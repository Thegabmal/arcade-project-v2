<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Gem Cascade</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { background:#0d0221; display:flex; justify-content:center; align-items:center;
       height:100vh; overflow:hidden; font-family:'Segoe UI',sans-serif; user-select:none; }
canvas { display:block; cursor:pointer; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
// ── AUDIO ──────────────────────────────────────────────────────────────────────
const AC = new (window.AudioContext || window.webkitAudioContext)();
function sfx(freq, type='sine', dur=0.12, vol=0.18) {
  try {
    const o=AC.createOscillator(), g=AC.createGain();
    o.type=type; o.frequency.value=freq;
    g.gain.setValueAtTime(vol,AC.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001,AC.currentTime+dur);
    o.connect(g); g.connect(AC.destination); o.start(); o.stop(AC.currentTime+dur);
  } catch(e){}
}
function sfxSwap()    { sfx(440,'sine',0.07,0.1); }
function sfxFail()    { sfx(180,'square',0.08,0.08); }
function sfxSpecial() { sfx(880,'sawtooth',0.18,0.22); setTimeout(()=>sfx(1100,'sine',0.12),100); }
function sfxMatch(n)  { sfx(300+n*90,'triangle',0.14,0.18+n*0.02); }
function sfxLevelUp() { [523,659,784,1047].forEach((f,i)=>setTimeout(()=>sfx(f,'sine',0.2,0.25),i*100)); }

// ── CONSTANTS ─────────────────────────────────────────────────────────────────
const COLS=8, ROWS=8, CELL=70, PAD=5;
const GSIZE = CELL-PAD*2;
const BX=200, BY=70; // board origin

const TYPES = ['ruby','sapphire','emerald','amber','amethyst','diamond'];
const CLR  = {ruby:'#e74c3c',sapphire:'#3498db',emerald:'#2ecc71',amber:'#f39c12',amethyst:'#9b59b6',diamond:'#cdd6df'};
const GLOW = {ruby:'#ff9999',sapphire:'#88ccff',emerald:'#88ffbb',amber:'#ffdd88',amethyst:'#cc99ff',diamond:'#eef2f7'};
const DARK = {ruby:'#7b241c',sapphire:'#1a5276',emerald:'#1d6a3a',amber:'#7d5a00',amethyst:'#5b2c6f',diamond:'#717d7e'};
const ICON = {ruby:'♦',sapphire:'●',emerald:'▲',amber:'★',amethyst:'◆',diamond:'◇'};

const LEVELS = [
  {moves:20,goal:'score', target:2000,  desc:'Score 2,000'},
  {moves:18,goal:'color', target:10,  color:'ruby',      desc:'Clear 10 Rubies'},
  {moves:22,goal:'score', target:5000,  desc:'Score 5,000'},
  {moves:16,goal:'color', target:12,  color:'sapphire',  desc:'Clear 12 Sapphires'},
  {moves:20,goal:'score', target:9000,  desc:'Score 9,000'},
  {moves:18,goal:'color', target:15,  color:'emerald',   desc:'Clear 15 Emeralds'},
  {moves:24,goal:'score', target:15000, desc:'Score 15,000'},
  {moves:22,goal:'color', target:18,  color:'amber',     desc:'Clear 18 Ambers'},
  {moves:25,goal:'score', target:22000, desc:'Score 22,000'},
  {moves:22,goal:'color', target:22,  color:'amethyst',  desc:'Clear 22 Amethysts'},
];

// ── CANVAS ────────────────────────────────────────────────────────────────────
const canvas=document.getElementById('c');
const ctx=canvas.getContext('2d');
canvas.width = BX*2+COLS*CELL;
canvas.height= BY+ROWS*CELL+100;
const W=canvas.width, H=canvas.height;

// ── GEM STRUCT ────────────────────────────────────────────────────────────────
function mkGem(type, special='none') {
  return {type, special,
    px:0,py:0, spx:0,spy:0, tpx:0,tpy:0, progress:1,  // animation
    scale:1, alpha:1, removing:false};
}
function gemX(c) { return BX+c*CELL+PAD; }
function gemY(r) { return BY+r*CELL+PAD; }

// ── GAME STATE ────────────────────────────────────────────────────────────────
let grid=[], score=0, levelIdx=0, movesLeft=0, goalProgress=0;
let selected=null;     // {r,c}
let phase='idle';      // idle|swapping|unswapping|removing|falling
let combo=0;
let animStart=0, animDur=200;
let swapData=null;     // {r1,c1,r2,c2}
let particles=[], floats=[];
let hintTimer=0, hintPos=null;
let gameState='menu';  // menu|playing|levelwin|gameover|allclear
let hiScore=parseInt(localStorage.getItem('gcHiScore')||0);

// ── GRID INIT ─────────────────────────────────────────────────────────────────
function initGrid() {
  grid=[];
  for(let r=0;r<ROWS;r++){
    grid[r]=[];
    for(let c=0;c<COLS;c++){
      let type;
      do { type=TYPES[Math.floor(Math.random()*TYPES.length)]; }
      while(
        (c>=2 && grid[r][c-1]?.type===type && grid[r][c-2]?.type===type) ||
        (r>=2 && grid[r-1]?.[c]?.type===type && grid[r-2]?.[c]?.type===type)
      );
      const g=mkGem(type);
      g.px=g.tpx=gemX(c); g.py=g.tpy=gemY(r);
      grid[r][c]=g;
    }
  }
}

function startLevel(idx) {
  levelIdx=idx; score=0; goalProgress=0; combo=0;
  movesLeft=LEVELS[idx].moves;
  initGrid();
  selected=null; phase='idle'; hintPos=null; hintTimer=0;
  gameState='playing';
}

// ── MATCH DETECTION ───────────────────────────────────────────────────────────
function findMatches() {
  const m=new Set();
  for(let r=0;r<ROWS;r++) {
    for(let c=0;c<COLS-2;c++) {
      const t=grid[r][c]?.type; if(!t) continue;
      if(grid[r][c+1]?.type===t && grid[r][c+2]?.type===t) {
        let e=c+3; while(e<COLS && grid[r][e]?.type===t) e++;
        for(let k=c;k<e;k++) m.add(`${r},${k}`); c=e-1;
      }
    }
  }
  for(let c=0;c<COLS;c++) {
    for(let r=0;r<ROWS-2;r++) {
      const t=grid[r][c]?.type; if(!t) continue;
      if(grid[r+1]?.[c]?.type===t && grid[r+2]?.[c]?.type===t) {
        let e=r+3; while(e<ROWS && grid[e]?.[c]?.type===t) e++;
        for(let k=r;k<e;k++) m.add(`${k},${c}`); r=e-1;
      }
    }
  }
  return m;
}

// Hint: find any valid swap
function findHint() {
  for(let r=0;r<ROWS;r++) for(let c=0;c<COLS;c++) {
    for(const [dr,dc] of [[0,1],[1,0]]) {
      const nr=r+dr, nc=c+dc;
      if(nr>=ROWS||nc>=COLS) continue;
      // try swap
      [grid[r][c],grid[nr][nc]]=[grid[nr][nc],grid[r][c]];
      const valid=findMatches().size>0;
      [grid[r][c],grid[nr][nc]]=[grid[nr][nc],grid[r][c]];
      if(valid) return {r,c};
    }
  }
  return null;
}

// ── SPECIAL GEM CREATION ──────────────────────────────────────────────────────
function computeSpecial(matched, swapR, swapC, swapType) {
  const cells=[...matched].map(k=>k.split(',').map(Number));
  const inSR=cells.filter(([mr])=>mr===swapR);
  const inSC=cells.filter(([,mc])=>mc===swapC);
  const hl=inSR.length, vl=inSC.length;
  if(matched.size>=5 || (hl>=3&&vl>=3)) return mkGem(swapType,'bomb');
  if(hl>=4) return mkGem(swapType,'rowclear');
  if(vl>=4) return mkGem(swapType,'colclear');
  if(matched.size>=4) return mkGem(swapType,'rainbow');
  return null;
}

// Expand bomb radius
function addBombCells(set, r, c) {
  for(let dr=-1;dr<=1;dr++) for(let dc=-1;dc<=1;dc++) {
    const nr=r+dr, nc=c+dc;
    if(nr>=0&&nr<ROWS&&nc>=0&&nc<COLS) set.add(`${nr},${nc}`);
  }
}

// ── RESOLVE MATCHES ───────────────────────────────────────────────────────────
let pendingSpecial=null;

function resolveMatches(matched, fromSwap=false, swapR=-1, swapC=-1) {
  if(matched.size===0) { phase='idle'; combo=0; scheduleHint(); checkEnd(); return; }

  // Expand specials in matched set
  const toExpand=[...matched].map(k=>{
    const [r,c]=k.split(',').map(Number); return {r,c,g:grid[r][c]};
  }).filter(({g})=>g&&g.special!=='none');

  toExpand.forEach(({r,c,g})=>{
    if(g.special==='bomb')     addBombCells(matched,r,c);
    if(g.special==='rowclear') { for(let cc=0;cc<COLS;cc++) matched.add(`${r},${cc}`); }
    if(g.special==='colclear') { for(let rr=0;rr<ROWS;rr++) matched.add(`${rr},${c}`); }
    if(g.special==='rainbow') {
      const t=g.type;
      for(let rr=0;rr<ROWS;rr++) for(let cc=0;cc<COLS;cc++) if(grid[rr][cc]?.type===t) matched.add(`${rr},${cc}`);
    }
  });

  // Score
  const base=100, bonus=matched.size>3?50:0;
  const pts=Math.round((base+bonus)*matched.size*Math.pow(1.35,combo));
  score+=pts; combo++;
  sfxMatch(Math.min(combo,6));

  // Color goal tracking
  if(LEVELS[levelIdx].goal==='color') {
    matched.forEach(k=>{
      const [r,c]=k.split(',').map(Number);
      if(grid[r][c]?.type===LEVELS[levelIdx].color) goalProgress++;
    });
  }

  // Floating text
  {
    const [r0,c0]=[...matched][0].split(',').map(Number);
    const cx=gemX(c0)+GSIZE/2, cy=gemY(r0);
    floats.push({x:cx,y:cy, text:`+${pts}${combo>1?` ×${combo}`:''}`, life:1, vy:-60});
  }

  // Special gem from long match
  if(fromSwap && swapR>=0) {
    const type=grid[swapR]?.[swapC]?.type || grid[swapR>0?swapR-1:swapR]?.[swapC]?.type || 'ruby';
    const sp=computeSpecial(matched,swapR,swapC,type);
    if(sp) pendingSpecial={r:swapR,c:swapC,gem:sp};
  }

  // Spawn particles
  matched.forEach(k=>{
    const [r,c]=k.split(',').map(Number);
    if(!grid[r][c]) return;
    spawnParticles(gemX(c)+GSIZE/2, gemY(r)+GSIZE/2, CLR[grid[r][c].type],10);
    grid[r][c].removing=true;
  });

  // Animate removal
  phase='removing'; animStart=performance.now(); animDur=200;
}

function finishRemoving() {
  // Delete matched gems
  for(let r=0;r<ROWS;r++) for(let c=0;c<COLS;c++) if(grid[r][c]?.removing) grid[r][c]=null;
  // Place special
  if(pendingSpecial) {
    const {r,c,gem}=pendingSpecial;
    if(!grid[r][c]) { gem.px=gemX(c); gem.py=gemY(r); gem.tpx=gem.px; gem.tpy=gem.py; grid[r][c]=gem; sfxSpecial(); }
    pendingSpecial=null;
  }
  applyGravity();
}

// ── GRAVITY ───────────────────────────────────────────────────────────────────
function applyGravity() {
  for(let c=0;c<COLS;c++) {
    let wr=ROWS-1;
    for(let r=ROWS-1;r>=0;r--) {
      if(grid[r][c]) {
        if(r!==wr) {
          const g=grid[r][c];
          g.spx=g.px; g.spy=g.py; g.tpx=gemX(c); g.tpy=gemY(wr); g.progress=0;
          grid[wr][c]=g; grid[r][c]=null;
        }
        wr--;
      }
    }
    // Fill from top
    let slot=wr;
    for(let r=slot;r>=0;r--) {
      const type=TYPES[Math.floor(Math.random()*TYPES.length)];
      const g=mkGem(type);
      g.spx=gemX(c); g.spy=gemY(r)-(slot-r+2)*CELL;
      g.tpx=gemX(c); g.tpy=gemY(r);
      g.px=g.spx; g.py=g.spy; g.progress=0;
      grid[r][c]=g;
    }
  }
  phase='falling'; animStart=performance.now(); animDur=320;
}

function finishFalling() {
  for(let r=0;r<ROWS;r++) for(let c=0;c<COLS;c++) {
    const g=grid[r][c]; if(g){ g.px=g.tpx; g.py=g.tpy; g.progress=1; }
  }
  const m=findMatches();
  if(m.size>0) resolveMatches(m);
  else { phase='idle'; combo=0; scheduleHint(); checkEnd(); }
}

// ── SWAP LOGIC ────────────────────────────────────────────────────────────────
function trySwap(r1,c1,r2,c2) {
  if(phase!=='idle') return;
  if(r2<0||r2>=ROWS||c2<0||c2>=COLS) return;
  sfxSwap();
  // Set up swap animation
  const g1=grid[r1][c1], g2=grid[r2][c2];
  g1.spx=g1.px; g1.spy=g1.py; g1.tpx=gemX(c2); g1.tpy=gemY(r2); g1.progress=0;
  g2.spx=g2.px; g2.spy=g2.py; g2.tpx=gemX(c1); g2.tpy=gemY(r1); g2.progress=0;
  swapData={r1,c1,r2,c2};
  phase='swapping'; animStart=performance.now(); animDur=180;
}

function finishSwap() {
  const {r1,c1,r2,c2}=swapData;
  [grid[r1][c1],grid[r2][c2]]=[grid[r2][c2],grid[r1][c1]];
  // Fix positions
  const g1=grid[r1][c1], g2=grid[r2][c2];
  g1.px=g1.tpx=gemX(c1); g1.py=g1.tpy=gemY(r1);
  g2.px=g2.tpx=gemX(c2); g2.py=g2.tpy=gemY(r2);
  const m=findMatches();
  if(m.size>0) {
    movesLeft--; hintPos=null; hintTimer=0;
    resolveMatches(m,true,r2,c2);
  } else {
    // Un-swap animation
    g1.spx=g1.px; g1.spy=g1.py; g1.tpx=gemX(c2); g1.tpy=gemY(r2); g1.progress=0;
    g2.spx=g2.px; g2.spy=g2.py; g2.tpx=gemX(c1); g2.tpy=gemY(r1); g2.progress=0;
    swapData={r1:r2,c1:c2,r2:r1,c2:c1};
    phase='unswapping'; animStart=performance.now(); animDur=180;
    sfxFail();
  }
}

function finishUnswap() {
  const {r1,c1,r2,c2}=swapData;
  [grid[r1][c1],grid[r2][c2]]=[grid[r2][c2],grid[r1][c1]];
  grid[r1][c1].px=grid[r1][c1].tpx=gemX(c1);
  grid[r1][c1].py=grid[r1][c1].tpy=gemY(r1);
  grid[r2][c2].px=grid[r2][c2].tpx=gemX(c2);
  grid[r2][c2].py=grid[r2][c2].tpy=gemY(r2);
  phase='idle'; selected=null;
}

// ── WIN/LOSE ──────────────────────────────────────────────────────────────────
function checkEnd() {
  const lv=LEVELS[levelIdx];
  const won = lv.goal==='score' ? score>=lv.target : goalProgress>=lv.target;
  if(won) {
    sfxLevelUp();
    if(score>hiScore){ hiScore=score; localStorage.setItem('gcHiScore',hiScore); }
    gameState = levelIdx>=LEVELS.length-1 ? 'allclear' : 'levelwin';
    return;
  }
  if(movesLeft<=0) { gameState='gameover'; }
}

function scheduleHint() {
  hintTimer=3.5;
  hintPos=null;
}

// ── PARTICLES ─────────────────────────────────────────────────────────────────
function spawnParticles(x, y, color, n) {
  for(let i=0;i<n;i++) {
    const angle=Math.random()*Math.PI*2;
    const speed=60+Math.random()*120;
    particles.push({x,y,vx:Math.cos(angle)*speed,vy:Math.sin(angle)*speed-50,
      color,life:1,r:3+Math.random()*5});
  }
}

function addFloat(text, x, y) {
  floats.push({x,y,text,life:1,vy:-55});
}

// ── UPDATE ────────────────────────────────────────────────────────────────────
let last=0;
function update(ts) {
  const dt=Math.min((ts-last)/1000,0.05); last=ts;

  // Hint timer
  if(phase==='idle' && gameState==='playing') {
    hintTimer-=dt;
    if(hintTimer<=0 && !hintPos) hintPos=findHint();
  }

  // Phase animations
  const t=Math.min(1,(ts-animStart)/animDur);
  const ease=1-Math.pow(1-t,3);

  if(phase==='swapping'||phase==='unswapping') {
    const {r1,c1,r2,c2}=swapData;
    [grid[r1][c1],grid[r2][c2]].forEach(g=>{
      if(!g) return;
      g.px=g.spx+(g.tpx-g.spx)*ease;
      g.py=g.spy+(g.tpy-g.spy)*ease;
    });
    if(t>=1) {
      if(phase==='swapping') finishSwap();
      else finishUnswap();
    }
  }

  if(phase==='removing') {
    const tRem=ease;
    for(let r=0;r<ROWS;r++) for(let c=0;c<COLS;c++) {
      const g=grid[r][c];
      if(g?.removing) { g.scale=1-tRem; g.alpha=1-tRem; }
    }
    if(t>=1) finishRemoving();
  }

  if(phase==='falling') {
    const fallEase=1-Math.pow(1-t,2.5);
    for(let r=0;r<ROWS;r++) for(let c=0;c<COLS;c++) {
      const g=grid[r][c];
      if(g&&g.progress<1) {
        g.progress=Math.min(1,g.progress+dt*4.5);
        const te=1-Math.pow(1-g.progress,2.5);
        g.px=g.spx+(g.tpx-g.spx)*te;
        g.py=g.spy+(g.tpy-g.spy)*te;
      }
    }
    if(t>=1) finishFalling();
  }

  // Particles
  particles.forEach(p=>{ p.x+=p.vx*dt; p.y+=p.vy*dt; p.vy+=180*dt; p.life-=dt*1.8; });
  particles=particles.filter(p=>p.life>0);

  // Floating texts
  floats.forEach(f=>{ f.y+=f.vy*dt; f.life-=dt*1.4; });
  floats=floats.filter(f=>f.life>0);
}

// ── DRAW ──────────────────────────────────────────────────────────────────────
function drawGem(g, x, y, s) {
  if(!g||g.alpha<=0) return;
  ctx.save();
  ctx.globalAlpha=g.alpha;
  ctx.translate(x+GSIZE/2, y+GSIZE/2);
  ctx.scale(g.scale*s, g.scale*s);

  // Shadow
  ctx.shadowColor=GLOW[g.type]; ctx.shadowBlur=8;

  // Body gradient
  const gr=ctx.createRadialGradient(-GSIZE*0.15,-GSIZE*0.15,2,0,0,GSIZE*0.6);
  gr.addColorStop(0, GLOW[g.type]);
  gr.addColorStop(0.5, CLR[g.type]);
  gr.addColorStop(1, DARK[g.type]);

  // Shape by type
  ctx.beginPath();
  const hs=GSIZE/2-2;
  if(g.type==='ruby')      { ctx.rect(-hs,-hs,hs*2,hs*2); }
  else if(g.type==='sapphire') { ctx.arc(0,0,hs,0,Math.PI*2); }
  else if(g.type==='emerald') {
    ctx.moveTo(0,-hs); ctx.lineTo(hs,0); ctx.lineTo(0,hs); ctx.lineTo(-hs,0); ctx.closePath();
  }
  else if(g.type==='amber') {
    // Star
    for(let i=0;i<5;i++){
      const a=i*Math.PI*2/5-Math.PI/2, a2=a+Math.PI/5;
      if(i===0) ctx.moveTo(Math.cos(a)*hs, Math.sin(a)*hs);
      else ctx.lineTo(Math.cos(a)*hs, Math.sin(a)*hs);
      ctx.lineTo(Math.cos(a2)*hs*0.45, Math.sin(a2)*hs*0.45);
    }
    ctx.closePath();
  }
  else if(g.type==='amethyst') {
    // Hexagon
    for(let i=0;i<6;i++){
      const a=i*Math.PI/3-Math.PI/6;
      if(i===0) ctx.moveTo(Math.cos(a)*hs, Math.sin(a)*hs);
      else ctx.lineTo(Math.cos(a)*hs, Math.sin(a)*hs);
    }
    ctx.closePath();
  }
  else { // diamond
    ctx.rect(-hs,-hs,hs*2,hs*2);
    ctx.rotate(Math.PI/4);
  }

  ctx.fillStyle=gr; ctx.fill();
  ctx.strokeStyle=GLOW[g.type]; ctx.lineWidth=1.5; ctx.stroke();
  ctx.shadowBlur=0;

  // Special markers
  if(g.special==='bomb')     { ctx.fillStyle='#fff'; ctx.font=`bold ${hs}px sans-serif`; ctx.textAlign='center'; ctx.textBaseline='middle'; ctx.fillText('💥',0,1); }
  if(g.special==='rowclear') { ctx.fillStyle='#fff'; ctx.fillRect(-hs+2,-3,hs*2-4,6); }
  if(g.special==='colclear') { ctx.fillStyle='#fff'; ctx.fillRect(-3,-hs+2,6,hs*2-4); }
  if(g.special==='rainbow')  { ctx.strokeStyle='#fff'; ctx.lineWidth=2.5; ctx.beginPath(); ctx.arc(0,0,hs*0.5,0,Math.PI*2); ctx.stroke(); }

  ctx.restore();
}

function draw() {
  ctx.clearRect(0,0,W,H);

  // Background
  const bg=ctx.createLinearGradient(0,0,0,H);
  bg.addColorStop(0,'#0d0221'); bg.addColorStop(1,'#1a0535');
  ctx.fillStyle=bg; ctx.fillRect(0,0,W,H);

  // Stars
  ctx.fillStyle='rgba(255,255,255,0.4)';
  for(let i=0;i<60;i++){
    const sx=(i*137+13)%W, sy=(i*97+7)%H;
    ctx.fillRect(sx,sy,1,1);
  }

  if(gameState==='menu') { drawMenu(); drawParticles(); requestAnimationFrame(loop); return; }
  if(gameState==='levelwin') { drawLevelWin(); drawParticles(); requestAnimationFrame(loop); return; }
  if(gameState==='gameover') { drawGameOver(); drawParticles(); requestAnimationFrame(loop); return; }
  if(gameState==='allclear') { drawAllClear(); drawParticles(); requestAnimationFrame(loop); return; }

  // Board background
  ctx.fillStyle='rgba(255,255,255,0.04)';
  ctx.beginPath(); roundRect(ctx,BX-8,BY-8,COLS*CELL+16,ROWS*CELL+16,12);
  ctx.fill();

  // Grid lines
  for(let r=0;r<ROWS;r++) for(let c=0;c<COLS;c++) {
    ctx.fillStyle=(r+c)%2===0?'rgba(255,255,255,0.03)':'rgba(0,0,0,0.03)';
    ctx.fillRect(BX+c*CELL,BY+r*CELL,CELL,CELL);
  }

  // Hint pulse
  if(hintPos && phase==='idle') {
    const pulse=0.5+0.5*Math.sin(performance.now()*0.005);
    ctx.strokeStyle=`rgba(255,255,100,${0.5+pulse*0.5})`;
    ctx.lineWidth=3;
    ctx.strokeRect(BX+hintPos.c*CELL+2,BY+hintPos.r*CELL+2,CELL-4,CELL-4);
  }

  // Selected highlight
  if(selected && phase==='idle') {
    ctx.strokeStyle='#fffb00'; ctx.lineWidth=3;
    ctx.shadowColor='#fffb00'; ctx.shadowBlur=12;
    ctx.strokeRect(BX+selected.c*CELL+2,BY+selected.r*CELL+2,CELL-4,CELL-4);
    ctx.shadowBlur=0;
  }

  // Gems
  for(let r=0;r<ROWS;r++) for(let c=0;c<COLS;c++) {
    const g=grid[r][c]; if(!g) continue;
    drawGem(g, g.px, g.py, 1);
  }

  // Particles
  drawParticles();

  // Floating texts
  floats.forEach(f=>{
    ctx.save(); ctx.globalAlpha=f.life;
    ctx.font='bold 18px Segoe UI'; ctx.textAlign='center';
    ctx.fillStyle='#fff'; ctx.shadowColor='#ff0'; ctx.shadowBlur=8;
    ctx.fillText(f.text, f.x, f.y); ctx.restore();
  });

  // HUD
  drawHUD();
}

function drawHUD() {
  const lv=LEVELS[levelIdx];
  const panelX=10, panelW=BX-20;

  // Level
  ctx.fillStyle='rgba(255,255,255,0.08)'; roundRect(ctx,panelX,10,panelW,55,8); ctx.fill();
  ctx.fillStyle='#aaa'; ctx.font='11px Segoe UI'; ctx.textAlign='left';
  ctx.fillText('LEVEL',panelX+10,28);
  ctx.fillStyle='#fff'; ctx.font='bold 26px Segoe UI';
  ctx.fillText(levelIdx+1, panelX+10, 55);

  // Goal
  ctx.fillStyle='rgba(255,255,255,0.08)'; roundRect(ctx,panelX,75,panelW,80,8); ctx.fill();
  ctx.fillStyle='#aaa'; ctx.font='11px Segoe UI'; ctx.fillText('GOAL',panelX+10,93);
  ctx.fillStyle='#fff'; ctx.font='13px Segoe UI';
  wrapText(ctx, lv.desc, panelX+10, 110, panelW-20, 16);
  // Progress bar
  const progress = lv.goal==='score' ? Math.min(score/lv.target,1) : Math.min(goalProgress/lv.target,1);
  ctx.fillStyle='rgba(255,255,255,0.1)'; roundRect(ctx,panelX+10,125,panelW-20,8,4); ctx.fill();
  const pclr=progress>=1?'#2ecc71':'#f39c12';
  ctx.fillStyle=pclr; ctx.shadowColor=pclr; ctx.shadowBlur=6;
  roundRect(ctx,panelX+10,125,Math.max(4,(panelW-20)*progress),8,4); ctx.fill();
  ctx.shadowBlur=0;
  ctx.fillStyle='#fff'; ctx.font='11px Segoe UI';
  ctx.fillText(lv.goal==='score'?`${score}/${lv.target}`:`${goalProgress}/${lv.target}`, panelX+10, 148);

  // Score
  ctx.fillStyle='rgba(255,255,255,0.08)'; roundRect(ctx,panelX,165,panelW,55,8); ctx.fill();
  ctx.fillStyle='#aaa'; ctx.font='11px Segoe UI'; ctx.fillText('SCORE',panelX+10,183);
  ctx.fillStyle='#ffe066'; ctx.font='bold 20px Segoe UI'; ctx.shadowColor='#ffe066'; ctx.shadowBlur=6;
  ctx.fillText(score.toLocaleString(), panelX+10, 210); ctx.shadowBlur=0;

  // Moves
  ctx.fillStyle='rgba(255,255,255,0.08)'; roundRect(ctx,panelX,230,panelW,55,8); ctx.fill();
  ctx.fillStyle='#aaa'; ctx.font='11px Segoe UI'; ctx.fillText('MOVES',panelX+10,248);
  ctx.fillStyle=movesLeft<=3?'#e74c3c':'#fff';
  ctx.shadowColor=movesLeft<=3?'#e74c3c':'transparent'; ctx.shadowBlur=movesLeft<=3?10:0;
  ctx.font='bold 26px Segoe UI'; ctx.fillText(movesLeft, panelX+10, 275); ctx.shadowBlur=0;

  // Combo
  if(combo>1) {
    ctx.save(); ctx.globalAlpha=Math.min(1, combo*0.3);
    ctx.fillStyle='rgba(255,200,0,0.15)'; roundRect(ctx,panelX,295,panelW,45,8); ctx.fill();
    ctx.fillStyle='#ffe066'; ctx.font=`bold ${14+combo*2}px Segoe UI`;
    ctx.textAlign='center'; ctx.fillText(`COMBO ×${combo}`, panelX+panelW/2, 323);
    ctx.restore();
  }

  // Right panel: Hi-score
  const rx=BX+COLS*CELL+10;
  ctx.fillStyle='rgba(255,255,255,0.08)'; roundRect(ctx,rx,10,panelW,55,8); ctx.fill();
  ctx.fillStyle='#aaa'; ctx.font='11px Segoe UI'; ctx.textAlign='left'; ctx.fillText('HI-SCORE',rx+10,28);
  ctx.fillStyle='#a29bfe'; ctx.font='bold 16px Segoe UI';
  ctx.fillText(hiScore.toLocaleString(), rx+10, 55);
}

function drawMenu() {
  ctx.fillStyle='rgba(0,0,0,0.5)'; ctx.fillRect(0,0,W,H);
  ctx.textAlign='center';
  ctx.fillStyle='#ffe066'; ctx.font='bold 48px Segoe UI'; ctx.shadowColor='#ffe066'; ctx.shadowBlur=20;
  ctx.fillText('GEM CASCADE', W/2, H/2-100); ctx.shadowBlur=0;
  ctx.fillStyle='rgba(255,255,255,0.15)'; roundRect(ctx,W/2-150,H/2-30,300,55,12); ctx.fill();
  ctx.fillStyle='#fff'; ctx.font='bold 22px Segoe UI';
  ctx.fillText('PLAY', W/2, H/2+4);
  ctx.fillStyle='#aaa'; ctx.font='14px Segoe UI';
  ctx.fillText('Match 3+ gems to score. 10 levels.', W/2, H/2+60);
}

function drawLevelWin() {
  ctx.fillStyle='rgba(0,20,0,0.6)'; ctx.fillRect(0,0,W,H);
  ctx.textAlign='center';
  ctx.fillStyle='#2ecc71'; ctx.font='bold 42px Segoe UI'; ctx.shadowColor='#2ecc71'; ctx.shadowBlur=20;
  ctx.fillText('LEVEL COMPLETE!', W/2, H/2-80); ctx.shadowBlur=0;
  ctx.fillStyle='#fff'; ctx.font='24px Segoe UI';
  ctx.fillText(`Score: ${score.toLocaleString()}`, W/2, H/2-30);
  ctx.fillStyle='rgba(255,255,255,0.15)'; roundRect(ctx,W/2-150,H/2+10,300,55,12); ctx.fill();
  ctx.fillStyle='#fff'; ctx.font='bold 22px Segoe UI';
  ctx.fillText('NEXT LEVEL →', W/2, H/2+44);
}

function drawGameOver() {
  ctx.fillStyle='rgba(30,0,0,0.65)'; ctx.fillRect(0,0,W,H);
  ctx.textAlign='center';
  ctx.fillStyle='#e74c3c'; ctx.font='bold 42px Segoe UI'; ctx.shadowColor='#e74c3c'; ctx.shadowBlur=20;
  ctx.fillText('OUT OF MOVES', W/2, H/2-80); ctx.shadowBlur=0;
  ctx.fillStyle='#fff'; ctx.font='22px Segoe UI'; ctx.fillText(`Score: ${score.toLocaleString()}`, W/2, H/2-30);
  ctx.fillStyle='rgba(255,255,255,0.12)'; roundRect(ctx,W/2-150,H/2+10,300,55,12); ctx.fill();
  ctx.fillStyle='#fff'; ctx.font='bold 22px Segoe UI'; ctx.fillText('RETRY LEVEL', W/2, H/2+44);
}

function drawAllClear() {
  ctx.fillStyle='rgba(0,0,30,0.7)'; ctx.fillRect(0,0,W,H);
  ctx.textAlign='center';
  ctx.fillStyle='#ffe066'; ctx.font='bold 46px Segoe UI'; ctx.shadowColor='#ffe066'; ctx.shadowBlur=24;
  ctx.fillText('ALL LEVELS CLEAR!', W/2, H/2-100); ctx.shadowBlur=0;
  ctx.fillStyle='#a29bfe'; ctx.font='bold 28px Segoe UI';
  ctx.fillText(`Final Score: ${score.toLocaleString()}`, W/2, H/2-40);
  ctx.fillStyle='rgba(255,255,255,0.12)'; roundRect(ctx,W/2-150,H/2+10,300,55,12); ctx.fill();
  ctx.fillStyle='#fff'; ctx.font='bold 22px Segoe UI'; ctx.fillText('PLAY AGAIN', W/2, H/2+44);
}

function drawParticles() {
  particles.forEach(p=>{
    ctx.save(); ctx.globalAlpha=p.life*0.9;
    ctx.fillStyle=p.color; ctx.shadowColor=p.color; ctx.shadowBlur=6;
    ctx.beginPath(); ctx.arc(p.x,p.y,p.r*p.life,0,Math.PI*2); ctx.fill();
    ctx.restore();
  });
}

// ── HELPERS ───────────────────────────────────────────────────────────────────
function roundRect(ctx, x, y, w, h, r) {
  ctx.beginPath(); ctx.moveTo(x+r,y);
  ctx.lineTo(x+w-r,y); ctx.quadraticCurveTo(x+w,y,x+w,y+r);
  ctx.lineTo(x+w,y+h-r); ctx.quadraticCurveTo(x+w,y+h,x+w-r,y+h);
  ctx.lineTo(x+r,y+h); ctx.quadraticCurveTo(x,y+h,x,y+h-r);
  ctx.lineTo(x,y+r); ctx.quadraticCurveTo(x,y,x+r,y); ctx.closePath();
}

function wrapText(ctx, text, x, y, maxW, lineH) {
  const words=text.split(' '), lines=[];
  let line='';
  words.forEach(w=>{ const t=line?line+' '+w:w; if(ctx.measureText(t).width>maxW){lines.push(line);line=w;}else line=t; });
  lines.push(line);
  lines.forEach((l,i)=>ctx.fillText(l,x,y+i*lineH));
}

// ── INPUT ─────────────────────────────────────────────────────────────────────
canvas.addEventListener('click', e=>{
  const rect=canvas.getBoundingClientRect();
  const mx=(e.clientX-rect.left)*(W/rect.width);
  const my=(e.clientY-rect.top)*(H/rect.height);

  if(gameState==='menu') { startLevel(0); return; }
  if(gameState==='levelwin') { startLevel(levelIdx+1); return; }
  if(gameState==='gameover') { startLevel(levelIdx); return; }
  if(gameState==='allclear') { startLevel(0); return; }
  if(gameState!=='playing' || phase!=='idle') return;

  const c=Math.floor((mx-BX)/CELL);
  const r=Math.floor((my-BY)/CELL);
  if(r<0||r>=ROWS||c<0||c>=COLS) return;

  if(!selected) { selected={r,c}; sfxSwap(); return; }
  const {r:sr,c:sc}=selected;
  if(r===sr&&c===sc) { selected=null; return; }
  // Must be adjacent
  if(Math.abs(r-sr)+Math.abs(c-sc)===1) {
    selected=null; trySwap(sr,sc,r,c);
  } else {
    selected={r,c};
  }
});

// ── LOOP ──────────────────────────────────────────────────────────────────────
function loop(ts) {
  update(ts); draw();
  requestAnimationFrame(loop);
}

// Start
spawnParticles(W/2,H/2,'#9b59b6',20);
scheduleHint();
requestAnimationFrame(loop);

  // Dev console bridge (global scope)
  window.__devPatch = function(code) { return eval(code); };
</script>

<script id="dev-console-script">
/* DEV_CONSOLE_INJECTED */
(function(){
'use strict';
var FILENAME=window.location.pathname.split('/').pop();
var panel=document.getElementById('dev-console');
var input=document.getElementById('dev-console-input');
var btn=document.getElementById('dev-console-btn');
var undoBtn=document.getElementById('dev-console-undo');
var statusEl=document.getElementById('dev-console-status');
var closeBtn=document.getElementById('dev-console-close');
var ctxBtn=document.getElementById('dev-console-ctx-btn');
var ctxPanel=document.getElementById('dev-console-ctx');
var logPanel=document.getElementById('dev-console-log');
var codeWrap=document.getElementById('dev-console-code-wrap');
var codeToggle=document.getElementById('dev-console-code-toggle');
var codePre=document.getElementById('dev-console-code-pre');
if(!panel||!input||!btn||!statusEl)return;

// ── État interne ──
var _snapshots=[];
var _history=[];
var _histIdx=-1;
var _actionLog=[];
var MAX_UNDO=15;
var MAX_LOG=30;
var _lastCode='';

// ── Toggle code généré ──
if(codeToggle&&codeWrap&&codePre){
  codeToggle.addEventListener('click',function(){
    var isOpen=codePre.style.display==='block';
    codePre.style.display=isOpen?'none':'block';
    codeToggle.textContent=(isOpen?'▶ voir':'▼ masquer')+' le code généré';
  });
  codePre.style.display='none'; // fermé par défaut
}

function showGeneratedCode(code){
  if(!codeWrap||!codePre||!codeToggle)return;
  _lastCode=code||'';
  codePre.textContent=_lastCode;
  codeWrap.classList.add('visible');
  codePre.style.display='none'; // fermé par défaut, l'utilisateur ouvre s'il veut
  codeToggle.textContent='▶ voir le code généré ('+_lastCode.split('\n').length+' lignes)';
}

function hideGeneratedCode(){
  if(!codeWrap)return;
  codeWrap.classList.remove('visible');
  _lastCode='';
}

// ── Utilitaires UI ──
closeBtn.addEventListener('click',function(){panel.classList.remove('open');input.blur();});

function setStatus(msg,cls){
  statusEl.textContent=msg;
  statusEl.className=cls||'';
}

function addLog(prompt,ok,note){
  var t=new Date().toLocaleTimeString('fr',{hour:'2-digit',minute:'2-digit',second:'2-digit'});
  var short=prompt.length>55?prompt.slice(0,55)+'…':prompt;
  _actionLog.unshift({t:t,short:short,ok:ok,note:note||''});
  if(_actionLog.length>MAX_LOG)_actionLog.pop();
  renderLog();
}

function renderLog(){
  if(!_actionLog.length){logPanel.classList.remove('visible');return;}
  logPanel.classList.add('visible');
  logPanel.innerHTML=_actionLog.map(function(e){
    return '<span style="color:#333">'+e.t+'</span> '+
      '<span style="color:'+(e.ok?'#1a6a1a':'#6a1a1a')+'">&#8226;</span> '+
      '<span style="color:'+(e.ok?'#447744':'#774444')+'">'+e.short+'</span>'+
      (e.note?'<span style="color:#333"> → '+e.note+'</span>':'');
  }).join('<br>');
}

// ── Snapshot pour undo ──
function takeSnapshot(){
  try{
    var s={_ts:Date.now()};
    // Numériques globaux
    ['score','highScore','gold','lives','level','floor','stage','currentFloor',
     'currentDungeonFloor','currentLevel','wave','waveNumber','coins','gems',
     'playerGold','energy','mana','ammo'].forEach(function(n){
      if(typeof window[n]==='number')s[n]=window[n];
    });
    // gameState
    if(typeof gameState!=='undefined')s.gameState=gameState;
    // Joueur (plusieurs conventions)
    ['hero','player','ship','character'].forEach(function(pn){
      if(typeof window[pn]!=='undefined'&&window[pn]&&typeof window[pn]==='object'){
        var p=window[pn];
        s['_p_'+pn]={hp:p.hp,maxHp:p.maxHp,speed:p.speed,attack:p.attack||p.damage,
          defense:p.defense,mp:p.mp,maxMp:p.maxMp,level:p.level,xp:p.xp,
          x:p.x,y:p.y,invincibilityTimer:p.invincibilityTimer||0,
          classId:p.classId,vx:p.vx||0,vy:p.vy||0};
      }
    });
    // Longueurs des tableaux
    ['enemies','towers','loot','minions','projectiles','bullets','interactables',
     'powerups','particles'].forEach(function(n){
      if(typeof window[n]!=='undefined'&&Array.isArray(window[n]))s['_len_'+n]=window[n].length;
    });
    // playerStats si existe
    if(typeof playerStats!=='undefined'&&playerStats)
      s._playerStats=JSON.parse(JSON.stringify(playerStats));
    if(typeof activeBuffs!=='undefined'&&Array.isArray(activeBuffs))
      s._activeBuffs=JSON.parse(JSON.stringify(activeBuffs));
    return s;
  }catch(e){return null;}
}

function applySnapshot(s){
  if(!s)return false;
  var ok=false;
  try{
    ['score','highScore','gold','lives','level','floor','stage','currentFloor',
     'currentDungeonFloor','currentLevel','wave','waveNumber','coins','gems',
     'playerGold','energy','mana','ammo'].forEach(function(n){
      if(s[n]!==undefined&&typeof window[n]==='number'){window[n]=s[n];ok=true;}
    });
    if(s.gameState!==undefined&&typeof gameState!=='undefined'){gameState=s.gameState;ok=true;}
    ['hero','player','ship','character'].forEach(function(pn){
      var pk='_p_'+pn;
      if(s[pk]&&typeof window[pn]!=='undefined'&&window[pn]){
        var p=window[pn],sd=s[pk];
        ['hp','maxHp','speed','attack','defense','mp','maxMp','level','xp',
         'invincibilityTimer','classId','vx','vy'].forEach(function(f){
          if(sd[f]!==undefined)p[f]=sd[f];
        });
        ok=true;
      }
    });
    if(s._playerStats&&typeof playerStats!=='undefined'&&playerStats){
      Object.assign(playerStats,s._playerStats);ok=true;
    }
    if(s._activeBuffs&&typeof activeBuffs!=='undefined'&&Array.isArray(activeBuffs)){
      activeBuffs.length=0;s._activeBuffs.forEach(function(b){activeBuffs.push(b);});ok=true;
    }
  }catch(e){}
  return ok;
}

function pushSnapshot(snap){
  if(!snap)return;
  _snapshots.push(snap);
  if(_snapshots.length>MAX_UNDO)_snapshots.shift();
  undoBtn.disabled=false;
}

function updateUndoBtn(){undoBtn.disabled=_snapshots.length===0;}

undoBtn.addEventListener('click',function(){
  if(!_snapshots.length)return;
  var snap=_snapshots.pop();
  updateUndoBtn();
  var ok=applySnapshot(snap);
  var dt=Math.round((Date.now()-snap._ts)/1000);
  if(ok){setStatus('↩ Annulé (il y a '+dt+'s)','ok');}
  else{setStatus('⚠ Annulation partielle — les changements complexes (nouvelles fonctions, types) ne peuvent pas être annulés automatiquement','warn');}
});

// ── Context browser ──
ctxBtn.addEventListener('click',function(){
  if(ctxPanel.classList.contains('open')){
    ctxPanel.classList.remove('open');
    ctxBtn.classList.remove('active');
    ctxPanel.innerHTML='';
    return;
  }
  ctxBtn.classList.add('active');
  var ctx=collectContext();
  var lines=['<b style="color:#226622">═══ CONTEXTE EN TEMPS RÉEL ═══</b>'];
  Object.keys(ctx).forEach(function(k){
    var v=ctx[k];
    var vs=typeof v==='object'?JSON.stringify(v).slice(0,90):String(v);
    lines.push('<span style="color:#00cc55">'+k+'</span><span style="color:#224422">:</span> <span style="color:#88aa88">'+vs+'</span>');
  });
  if(lines.length===1)lines.push('<span style="color:#1a3a1a">Aucune variable standard détectée (jeu custom)</span>');
  ctxPanel.innerHTML=lines.join('<br>');
  ctxPanel.classList.add('open');
});

// ── Collecte du contexte runtime ──
function collectContext(){
  var ctx={};
  try{
    var stateNames=['gameState','state','currentState','phase','mode','screen'];
    stateNames.forEach(function(n){if(typeof window[n]!=='undefined')ctx[n]=window[n];});
    var scoreNames=['score','highScore','bestScore','gold','lives','level','floor','stage',
                    'currentFloor','currentDungeonFloor','currentLevel','wave','waveNumber',
                    'coins','gems','playerGold','energy','mana','ammo','kills'];
    scoreNames.forEach(function(n){if(typeof window[n]!=='undefined')ctx[n]=window[n];});
    ['hero','player','ship','character','pawn','tank'].forEach(function(pn){
      if(typeof window[pn]!=='undefined'&&window[pn]&&typeof window[pn]==='object'){
        var p=window[pn];
        ctx[pn]={hp:p.hp,maxHp:p.maxHp,x:Math.round(p.x||0),y:Math.round(p.y||0),
          speed:p.speed,level:p.level,attack:p.attack||p.damage||p.atk,
          defense:p.defense||p.def,mp:p.mp,maxMp:p.maxMp,classId:p.classId,
          invincible:!!(p.invincibilityTimer>0)};
      }
    });
    var arrNames=['enemies','towers','projectiles','bullets','particles','loot','interactables',
                  'minions','platforms','coins','items','obstacles','pieces','waves','powerups',
                  'skills','traps','buildings','npcs','allies'];
    arrNames.forEach(function(n){
      if(typeof window[n]!=='undefined'&&Array.isArray(window[n]))ctx[n+'_count']=window[n].length;
    });
    if(typeof window['boss']!=='undefined')ctx.bossAlive=window['boss']!==null;
    if(typeof window['bossGate']!=='undefined')ctx.bossGateOpen=!!(window['bossGate']&&window['bossGate'].open);
    if(typeof ENEMY_TYPES!=='undefined')ctx.enemyTypes=Object.keys(ENEMY_TYPES);
    if(typeof TOWER_TYPES!=='undefined')ctx.towerTypes=Object.keys(TOWER_TYPES);
    if(typeof ITEM_TYPES!=='undefined')ctx.itemTypes=Object.keys(ITEM_TYPES);
    if(typeof WEAPON_TYPES!=='undefined')ctx.weaponTypes=Object.keys(WEAPON_TYPES);
    if(typeof UPGRADE_TYPES!=='undefined')ctx.upgradeTypes=Object.keys(UPGRADE_TYPES);
    if(typeof HERO_CLASSES!=='undefined')ctx.heroClasses=HERO_CLASSES.map(function(c){return c.id+':'+c.name;});
    if(typeof CUSTOM_SKILLS!=='undefined')ctx.customSkills=Object.keys(CUSTOM_SKILLS);
    if(typeof CUSTOM_ATTACKS!=='undefined')ctx.customAttacks=Object.keys(CUSTOM_ATTACKS);
    var fnNames=['createEnemy','spawnBoss','generateDungeon','checkLevelUp','handleEnemyDefeat',
                 'spawnParticles','spawnFloatingText','triggerShake','createProjectile',
                 'placeTower','addTower','spawnEnemy','createTower','restartGame','resetGame',
                 'spawnWave','addPowerup','unlockSkill','applyKnockback','onBossDefeat',
                 'openShop','buyItem','saveGame','loadGame','generateLevel','nextWave',
                 'addUpgrade','applyUpgrade','createItem','dropLoot'];
    var avail=fnNames.filter(function(n){return typeof window[n]==='function';});
    if(avail.length)ctx.functions=avail;
    if(typeof playerInventory!=='undefined')ctx.inventory=playerInventory;
    if(typeof activeBuffs!=='undefined'&&Array.isArray(activeBuffs))ctx.buffs=activeBuffs.length;
    if(typeof TILE_SIZE!=='undefined')ctx.TILE_SIZE=TILE_SIZE;
    if(typeof MAP_W!=='undefined')ctx.MAP_W=MAP_W;
  }catch(e){}
  return ctx;
}

// ── Validation syntaxique client ──
function validateSyntax(code){
  var o=0,c=0,po=0,pc=0,bo=0,bc=0;
  for(var i=0;i<code.length;i++){
    var ch=code[i];
    if(ch==='{')o++;else if(ch==='}')c++;
    else if(ch==='(')po++;else if(ch===')')pc++;
    else if(ch==='[')bo++;else if(ch===']')bc++;
  }
  if(o!==c)return 'Accolades: '+o+' { pour '+c+' }';
  if(po!==pc)return 'Parenthèses: '+po+' ( pour '+pc+' )';
  if(bo!==bc)return 'Crochets: '+bo+' [ pour '+bc+' ]';
  return null;
}

// ── Exécution du code patché ──
function execCode(code,explanation){
  var synErr=validateSyntax(code);
  if(synErr){
    setStatus('⚠ Syntaxe invalide côté client: '+synErr+' — Le code ne sera pas exécuté.','err');
    return false;
  }
  try{
    if(typeof window.__devPatch==='function'){
      window.__devPatch(code);
    }else{
      // Fallback: new Function (n'accède pas aux vars locales du jeu)
      (new Function(code))();
    }
    var msg=explanation||'Patch appliqué !';
    setStatus('✅ '+msg,'ok');
    input.value='';
    return true;
  }catch(e){
    var msg=e.message||String(e);
    if(msg.indexOf('not defined')!==-1){
      var vn=(msg.split(' ')[0]||'').replace(/[^a-zA-Z0-9_]/g,'');
      msg='Variable "'+vn+'" introuvable dans ce jeu. Utilisez le bouton ctx pour voir ce qui est disponible.';
    }else if(msg.indexOf('is not a function')!==-1){
      msg='Fonction non disponible dans ce jeu: '+msg+'. Vérifiez ctx → functions.';
    }else if(msg.indexOf('Cannot read')!==-1||msg.indexOf('null')!==-1){
      msg='Accès à null/undefined: '+msg+' — Ajoutez une vérification if(variable) avant.';
    }else if(msg.indexOf('Assignment to constant')!==-1){
      msg="Impossible de modifier une constante (const). Passez par l'objet: ex TYPE.xxx au lieu de TYPE=...";
    }else if(msg.indexOf('Unexpected token')!==-1){
      msg='Erreur de syntaxe JS: '+msg;
    }
    setStatus('❌ '+msg,'err');
    return false;
  }
}

// ── Application d'un patch ──
async function applyPatch(){
  var prompt=input.value.trim();
  if(!prompt)return;
  if(_history[0]!==prompt){_history.unshift(prompt);if(_history.length>50)_history.pop();}
  _histIdx=-1;
  btn.disabled=true;
  hideGeneratedCode();
  setStatus('⏳ Génération en cours...','pending');
  var snap=takeSnapshot();
  try{
    var resp=await fetch('/api/game-patch',{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({filename:FILENAME,prompt:prompt,context:collectContext()})
    });
    if(!resp.ok){
      var errText=await resp.text();
      setStatus('❌ Erreur serveur '+resp.status+': '+errText.slice(0,80),'err');
      addLog(prompt,false,'HTTP '+resp.status);
      return;
    }
    var data=await resp.json();
    if(data.error){
      setStatus('❌ '+data.error,'err');
      addLog(prompt,false,data.error.slice(0,40));
    }else if(data.code){
      // Afficher le code avant l'exec (utile si l'exec plante)
      showGeneratedCode(data.code);
      var ok=execCode(data.code,data.explanation);
      if(ok){
        pushSnapshot(snap);
        addLog(prompt,true,data.explanation?data.explanation.slice(0,80):'');
      }else{
        // En cas d'erreur, garder le code visible automatiquement pour debug
        if(codePre)codePre.style.display='block';
        if(codeToggle)codeToggle.textContent='▼ masquer le code généré (erreur — vérifier la syntaxe)';
        addLog(prompt,false,'Erreur exec');
      }
    }else{
      setStatus('⚠ Réponse vide du serveur','warn');
      addLog(prompt,false,'réponse vide');
    }
  }catch(e){
    setStatus('❌ Réseau: '+e.message,'err');
    addLog(prompt,false,'réseau');
  }finally{btn.disabled=false;}
}

// ── Événements ──
btn.addEventListener('click',applyPatch);
input.addEventListener('keydown',function(e){
  if(e.code!=='Backquote'&&e.code!=='IntlBackslash')e.stopPropagation();
  if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();applyPatch();return;}
  if(e.key==='ArrowUp'&&!e.shiftKey&&_history.length){
    e.preventDefault();_histIdx=Math.min(_histIdx+1,_history.length-1);input.value=_history[_histIdx];
  }
  if(e.key==='ArrowDown'&&!e.shiftKey){
    e.preventDefault();_histIdx=Math.max(_histIdx-1,-1);input.value=_histIdx>=0?_history[_histIdx]:'';
  }
});
document.addEventListener('keydown',function(e){
  if(e.code==='Backquote'||e.code==='IntlBackslash'){
    e.preventDefault();
    if(panel.classList.contains('open')){
      panel.classList.remove('open');input.blur();
    }else{
      panel.classList.add('open');input.focus();
    }
  }
});
})();
</script>
