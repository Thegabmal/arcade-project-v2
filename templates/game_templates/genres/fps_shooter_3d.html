// ── Meta-progression ─────────────────────────────────────────────────
const META_KEY = '[FILL: META_KEY]'; // e.g. 'meta_iron_citadel'

const UPGRADES = [FILL: UPGRADE_DEFS];
// Format:
// { id:'mag_ext', name:'Extended Mag', desc:'+15 max ammo per level', cost:30, maxLv:3, effect:'ammo' },
// { id:'stopping_power', name:'Stopping Power', desc:'+25% damage per level', cost:40, maxLv:3, effect:'dmg' },
// { id:'flak_vest', name:'Flak Vest', desc:'+25 max HP per level', cost:50, maxLv:3, effect:'hp' },
// { id:'quick_reload', name:'Quick Reload', desc:'-0.5s reload time per level', cost:35, maxLv:3, effect:'reload' },

let meta = { coins:0, upgrades:{} };
function loadMeta() {
  try { const s=localStorage.getItem(META_KEY); if(s) meta=JSON.parse(s); } catch(e){}
  UPGRADES.forEach(u=>{ if(meta.upgrades[u.id]===undefined) meta.upgrades[u.id]=0; });
}
function saveMeta() { try { localStorage.setItem(META_KEY,JSON.stringify(meta)); } catch(e){} }
function buyUpgrade(id) {
  const u=UPGRADES.find(u=>u.id===id); if(!u) return;
  const lv=meta.upgrades[id]; if(lv>=u.maxLv) return;
  const cost=u.cost*(lv+1); if(meta.coins<cost) return;
  meta.coins-=cost; meta.upgrades[id]++; saveMeta();
}
loadMeta();

// ── Three.js core ─────────────────────────────────────────────────────
const canvas = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({ canvas, antialias:true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio,2));
renderer.shadowMap.enabled = true;
renderer.setSize(window.innerWidth, window.innerHeight);

const scene  = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(75, window.innerWidth/window.innerHeight, 0.1, 100);
const clock  = new THREE.Clock();

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth/window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

// ── Input ─────────────────────────────────────────────────────────────
const keys = {};
window.addEventListener('keydown', e => { keys[e.code]=true; });
window.addEventListener('keyup',   e => { keys[e.code]=false; });

let yaw=0, pitch=0, locked=false;
document.addEventListener('pointerlockchange', () => { locked = document.pointerLockElement===canvas; });
document.addEventListener('mousemove', e => {
  if(!locked) return;
  yaw   -= e.movementX*0.002;
  pitch  = Math.max(-Math.PI/3, Math.min(Math.PI/3, pitch - e.movementY*0.002));
});
let shooting=false;
window.addEventListener('mousedown', e=>{ if(e.button===0) shooting=true; });
window.addEventListener('mouseup',   e=>{ if(e.button===0) shooting=false; });
window.addEventListener('keydown', e=>{
  if(e.code==='KeyR' && !player.isReloading && player.ammo<player.maxAmmo && player.reserve>0) startReload();
});

// ── Obstacle collision ────────────────────────────────────────────────
const obstacles = [];
function circleBlocked(x,z,r) {
  if(Math.abs(x)>19.5||Math.abs(z)>19.5) return true;
  for(const o of obstacles) if(Math.hypot(x-o.pos.x,z-o.pos.z)<r+o.r) return true;
  return false;
}

// ── Bullets ───────────────────────────────────────────────────────────
const bullets=[], eBullets=[];
const bMat = new THREE.MeshBasicMaterial({color:0xffd700});
const eMat = new THREE.MeshBasicMaterial({color:0xff4444});
function spawnBullet(fromPlayer=true, origin, direction) {
  const geo = new THREE.SphereGeometry(0.07,4,4);
  const mesh = new THREE.Mesh(geo, fromPlayer?bMat:eMat);
  const pos  = fromPlayer ? camera.position.clone() : origin.clone();
  mesh.position.copy(pos);
  const dir = fromPlayer ? (()=>{ const d=new THREE.Vector3(); camera.getWorldDirection(d); return d; })() : direction.clone().normalize();
  scene.add(mesh);
  (fromPlayer?bullets:eBullets).push({ mesh, dir, life:1.5 });
}

// ── Player state ──────────────────────────────────────────────────────
const player = {
  pos: new THREE.Vector3(0,1.7,0),
  hp:100, maxHp:100, ammo:30, maxAmmo:30, reserve:90,
  dmg:1, reloadTime:2.0, reloadTimer:0, isReloading:false,
  score:0, wave:1, dead:false,
};
let shootCooldown=0;

function startReload() {
  player.isReloading=true; player.reloadTimer=player.reloadTime;
  document.getElementById('reload-msg').style.display='block';
}
function finishReload() {
  const need=player.maxAmmo-player.ammo, take=Math.min(need,player.reserve);
  player.ammo+=take; player.reserve-=take;
  player.isReloading=false;
  document.getElementById('reload-msg').style.display='none';
}

// ── HUD helpers ───────────────────────────────────────────────────────
function updateHUD() {
  document.getElementById('score-disp').textContent = player.score.toLocaleString();
  document.getElementById('wave-disp').textContent  = `WAVE ${player.wave}`;
  document.getElementById('coins-disp').textContent = `🪙 ${meta.coins}`;
  document.getElementById('hp-fill').style.width    = (player.hp/player.maxHp*100)+'%';
  document.getElementById('ammo-count').textContent = `${player.ammo} / ${player.reserve}`;
}
function flashHit() {
  const el=document.getElementById('hit-flash');
  el.style.background='rgba(231,76,60,.45)';
  setTimeout(()=>el.style.background='rgba(231,76,60,0)',120);
}
function addKillFeed(label) {
  const f=document.getElementById('kill-feed');
  const el=document.createElement('div'); el.style.opacity='1'; el.textContent=`✦ ${label}`;
  f.appendChild(el);
  setTimeout(()=>{ el.style.opacity='0'; setTimeout(()=>el.remove(),2000); },2000);
  while(f.children.length>5) f.firstChild.remove();
}

// ── Game state machine ────────────────────────────────────────────────
let gameState='menu';
const enemies=[];
let waveActive=false, waveEnemiesLeft=0, waveCooldown=2;

function startGame() {
  enemies.forEach(e=>scene.remove(e.grp)); enemies.length=0;
  bullets.forEach(b=>scene.remove(b.mesh)); bullets.length=0;
  eBullets.forEach(b=>scene.remove(b.mesh)); eBullets.length=0;
  applyUpgrades();
  player.hp=player.maxHp; player.ammo=player.maxAmmo; player.reserve=90;
  player.score=0; player.wave=1; player.dead=false; player.isReloading=false;
  player.pos.set(0,1.7,0); yaw=0; pitch=0;
  waveActive=false; waveCooldown=2;
  document.getElementById('overlay').style.display='none';
  document.getElementById('hud').style.display='block';
  gameState='playing'; canvas.requestPointerLock(); updateHUD();
}

function triggerGameOver() {
  player.dead=true; gameState='gameover';
  document.exitPointerLock(); locked=false;
  const coins=Math.floor(player.score/10); meta.coins+=coins; saveMeta();
  document.getElementById('hud').style.display='none';
  const ov=document.getElementById('overlay');
  ov.innerHTML=`
    <h1 id="title-h1">[FILL: GAME_TITLE]</h1>
    <div class="sub">[FILL: GAMEOVER_SUBTITLE]</div>
    <div style="font-size:30px;color:#ffd700;margin:18px 0;">${player.score.toLocaleString()}</div>
    <div style="font-size:13px;color:#666;margin-bottom:22px;">WAVE ${player.wave} — +${coins} 🪙</div>
    <button class="menu-btn" id="btn-shop">[FILL: SHOP_LABEL]</button>
    <button class="menu-btn" id="btn-retry">[FILL: RETRY_LABEL]</button>`;
  ov.style.display='flex';
  document.getElementById('btn-shop').onclick=()=>{ ov.style.display='none'; openShop(); };
  document.getElementById('btn-retry').onclick=startGame;
}

function openShop()  { gameState='shop'; renderShop(); document.getElementById('shop-overlay').style.display='flex'; }
function closeShop() { document.getElementById('shop-overlay').style.display='none'; startGame(); }
function renderShop() {
  document.getElementById('shop-coins').textContent=`🪙 ${meta.coins}`;
  const grid=document.getElementById('shop-grid'); grid.innerHTML='';
  UPGRADES.forEach(u=>{
    const lv=meta.upgrades[u.id]||0, cost=u.cost*(lv+1), maxed=lv>=u.maxLv;
    const card=document.createElement('div'); card.className='shop-card';
    card.innerHTML=`<h3>${u.name}<span class="lvl">LV ${lv}/${u.maxLv}</span></h3><p>${u.desc}</p><span class="cost">${maxed?'— MAXED —':'🪙 '+cost}</span>`;
    if(!maxed&&meta.coins>=cost) card.onclick=()=>{ buyUpgrade(u.id); renderShop(); };
    else card.style.opacity=maxed?'0.4':'0.6';
    grid.appendChild(card);
  });
  document.getElementById('shop-skip').onclick=closeShop;
}

// ── Main update ───────────────────────────────────────────────────────
function update(dt) {
  if(gameState!=='playing') return;
  camera.rotation.order='YXZ'; camera.rotation.y=yaw; camera.rotation.x=pitch;

  // WASD movement
  const speed=5, move=new THREE.Vector3();
  if(keys['KeyW']||keys['ArrowUp'])    move.z-=1;
  if(keys['KeyS']||keys['ArrowDown'])  move.z+=1;
  if(keys['KeyA']||keys['ArrowLeft'])  move.x-=1;
  if(keys['KeyD']||keys['ArrowRight']) move.x+=1;
  if(move.lengthSq()>0) {
    move.normalize().applyAxisAngle(new THREE.Vector3(0,1,0),yaw).multiplyScalar(speed*dt);
    const nx=player.pos.x+move.x, nz=player.pos.z+move.z;
    if(!circleBlocked(nx,player.pos.z,.4)) player.pos.x=nx;
    if(!circleBlocked(player.pos.x,nz,.4)) player.pos.z=nz;
  }
  player.pos.y=1.7; camera.position.copy(player.pos);

  // Reload
  if(player.isReloading) { player.reloadTimer-=dt; if(player.reloadTimer<=0) finishReload(); }

  // Shoot
  shootCooldown=Math.max(0,shootCooldown-dt);
  if(shooting&&!player.isReloading&&shootCooldown<=0&&player.ammo>0) {
    spawnBullet(true); player.ammo--; shootCooldown=0.12;
    if(player.ammo===0&&player.reserve>0) startReload();
  }

  // Player bullet update
  for(let i=bullets.length-1;i>=0;i--) {
    const b=bullets[i]; b.mesh.position.addScaledVector(b.dir,30*dt); b.life-=dt;
    if(b.life<=0) { scene.remove(b.mesh); bullets.splice(i,1); continue; }
    let hit=false;
    for(let j=enemies.length-1;j>=0;j--) {
      const e=enemies[j]; if(e.dead) continue;
      if(b.mesh.position.distanceTo(e.grp.position)<.9*e.scale) {
        e.hp-=player.dmg; hit=true;
        if(e.hp<=0) { e.dead=true; scene.remove(e.grp); enemies.splice(j,1);
          player.score+=e.reward; addKillFeed(e.type.toUpperCase()+' DOWN');
          waveEnemiesLeft=Math.max(0,waveEnemiesLeft-1); }
        break;
      }
    }
    if(hit) { scene.remove(b.mesh); bullets.splice(i,1); }
  }

  // Enemy bullet update
  for(let i=eBullets.length-1;i>=0;i--) {
    const b=eBullets[i]; b.mesh.position.addScaledVector(b.dir,12*dt); b.life-=dt;
    if(b.life<=0) { scene.remove(b.mesh); eBullets.splice(i,1); continue; }
    if(b.mesh.position.distanceTo(camera.position)<.5) {
      player.hp-=10; flashHit(); scene.remove(b.mesh); eBullets.splice(i,1);
      if(player.hp<=0) { player.hp=0; triggerGameOver(); return; }
    }
  }

  // Wave management
  if(!waveActive) { waveCooldown-=dt; if(waveCooldown<=0) startWave(player.wave); }
  else if(waveEnemiesLeft===0&&enemies.length===0) { waveActive=false; player.wave++; waveCooldown=4; }

  updatePlaying(dt); // [FILL: custom per-frame logic called here]
  updateHUD();
}

// ── Render loop ───────────────────────────────────────────────────────
function animate() {
  requestAnimationFrame(animate);
  const dt=Math.min(clock.getDelta(),.05);
  update(dt);
  renderer.render(scene,camera);
}
