<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{background:#000;display:flex;align-items:center;justify-content:center;height:100vh;overflow:hidden;}
canvas{display:block;}
</style></head><body>
<canvas id="gameCanvas"></canvas>
<script>
// ══════════════════════════════════════════════════════════════════
// ENGINE — DO NOT MODIFY
window.__devPatch = function(code) { return eval(code); };
// ══════════════════════════════════════════════════════════════════
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
const DPR = Math.min(window.devicePixelRatio || 1, 2);
const GAME_W = 800, GAME_H = 600;
let W = GAME_W, H = GAME_H;
function resizeCanvas(){const s=Math.min(window.innerWidth/W,window.innerHeight/H);canvas.style.width=Math.round(W*s)+'px';canvas.style.height=Math.round(H*s)+'px';canvas.width=Math.round(W*DPR);canvas.height=Math.round(H*DPR);ctx.scale(DPR,DPR);}
resizeCanvas(); window.addEventListener('resize',()=>{resizeCanvas();ctx.scale(DPR,DPR);});

let gameState='menu';
function setState(s){gameState=s;}

const Keys={down:{},pressed:{}};
window.addEventListener('keydown',e=>{if(!Keys.down[e.code])Keys.pressed[e.code]=true;Keys.down[e.code]=true;if(e.code==='Escape')e.preventDefault();});
window.addEventListener('keyup',e=>{Keys.down[e.code]=false;});

const Pointer={x:0,y:0,justDown:false,justUp:false,down:false};
canvas.addEventListener('mousedown',e=>{if(e.button!==0)return;const r=canvas.getBoundingClientRect();Pointer.x=(e.clientX-r.left)*(W/r.width);Pointer.y=(e.clientY-r.top)*(H/r.height);Pointer.down=true;Pointer.justDown=true;});
canvas.addEventListener('mousemove',e=>{const r=canvas.getBoundingClientRect();Pointer.x=(e.clientX-r.left)*(W/r.width);Pointer.y=(e.clientY-r.top)*(H/r.height);});
canvas.addEventListener('mouseup',()=>{Pointer.down=false;Pointer.justUp=true;});
canvas.addEventListener('touchstart',e=>{e.preventDefault();const r=canvas.getBoundingClientRect();Pointer.x=(e.touches[0].clientX-r.left)*(W/r.width);Pointer.y=(e.touches[0].clientY-r.top)*(H/r.height);Pointer.down=true;Pointer.justDown=true;},{passive:false});
canvas.addEventListener('touchend',e=>{e.preventDefault();Pointer.down=false;Pointer.justUp=true;},{passive:false});
canvas.addEventListener('contextmenu',e=>e.preventDefault());

// Right-click sell
let _rightClick={active:false,x:0,y:0};
canvas.addEventListener('mousedown',e=>{if(e.button!==2)return;const r=canvas.getBoundingClientRect();_rightClick.x=(e.clientX-r.left)*(W/r.width);_rightClick.y=(e.clientY-r.top)*(H/r.height);_rightClick.active=true;});

function keyPressed(c){return!!Keys.pressed[c];}
function anyAction(){return Pointer.justDown||Object.keys(Keys.pressed).length>0;}
function flushInput(){Keys.pressed={};Pointer.justDown=false;Pointer.justUp=false;}

function createPool(factory,size){const inactive=Array.from({length:size},factory),active=[];return{active,get(fn){const o=inactive.length>0?inactive.pop():factory();o.alive=true;if(fn)fn(o);active.push(o);return o;},update(fn){for(let i=active.length-1;i>=0;i--)if(!fn(active[i])){active[i].alive=false;inactive.push(active.splice(i,1)[0]);}},clear(){while(active.length){active[0].alive=false;inactive.push(active.shift());}}};}

const Particles=createPool(()=>({alive:false,x:0,y:0,vx:0,vy:0,life:0,maxLife:0,size:3,color:'#fff',gravity:0}),300);
function spawnParticles(x,y,count,opts){opts=opts||{};for(let i=0;i<count;i++){const a=opts.angle!==undefined?opts.angle+(Math.random()-0.5)*(opts.spread||Math.PI*2):Math.random()*Math.PI*2;const sp=opts.speed||(40+Math.random()*60);Particles.get(p=>{p.x=x;p.y=y;p.vx=Math.cos(a)*sp;p.vy=Math.sin(a)*sp;p.life=p.maxLife=opts.life||(0.3+Math.random()*0.4);p.size=opts.size||(2+Math.random()*3);p.color=opts.color||'#fff';p.gravity=opts.gravity!==undefined?opts.gravity:0;});}}
function updateParticles(dt){Particles.update(p=>{p.life-=dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=p.gravity*dt;return p.life>0;});}
function drawParticles(){Particles.active.forEach(p=>{ctx.globalAlpha=p.life/p.maxLife;ctx.fillStyle=p.color;ctx.beginPath();ctx.arc(p.x,p.y,p.size*0.5,0,Math.PI*2);ctx.fill();});ctx.globalAlpha=1;}

const Popups=[];
function spawnPopup(x,y,text,color,size){Popups.push({x,y,text,color:color||'#fff',size:size||13,vy:-40,life:1.0});}
function updatePopups(dt){for(let i=Popups.length-1;i>=0;i--){Popups[i].y+=Popups[i].vy*dt;Popups[i].life-=dt;if(Popups[i].life<=0)Popups.splice(i,1);}}
function drawPopups(){Popups.forEach(p=>{ctx.globalAlpha=Math.min(p.life,1);ctx.fillStyle=p.color;ctx.font=`bold ${p.size}px system-ui,sans-serif`;ctx.textAlign='center';ctx.fillText(p.text,p.x,p.y);});ctx.globalAlpha=1;ctx.textAlign='left';}

const sfx={_ctx:null,init(){try{if(!this._ctx)this._ctx=new(window.AudioContext||window.webkitAudioContext)();if(this._ctx.state==='suspended')this._ctx.resume();}catch(e){}},play(f,d,t,v){try{this.init();if(!this._ctx)return;const o=this._ctx.createOscillator(),g=this._ctx.createGain();o.type=t||'square';o.frequency.value=f||440;g.gain.setValueAtTime(v||0.08,this._ctx.currentTime);g.gain.exponentialRampToValueAtTime(0.001,this._ctx.currentTime+(d||0.1));o.connect(g);g.connect(this._ctx.destination);o.start();o.stop(this._ctx.currentTime+(d||0.1));}catch(e){}}};

function lerp(a,b,t){return a+(b-a)*t;}
function clamp(v,mn,mx){return v<mn?mn:v>mx?mx:v;}
function randInt(a,b){return a+Math.floor(Math.random()*(b-a+1));}
function randFloat(a,b){return a+Math.random()*(b-a);}
function randChoice(arr){return arr[Math.floor(Math.random()*arr.length)];}
function dist(ax,ay,bx,by){return Math.sqrt((ax-bx)**2+(ay-by)**2);}
function drawText(t,x,y,c,s,a){ctx.fillStyle=c||'#fff';ctx.font=`bold ${s||13}px system-ui,sans-serif`;ctx.textAlign=a||'left';ctx.fillText(t,x,y);}
function drawBar(x,y,w,h,v,m,fg,bg){ctx.fillStyle=bg||'#333';ctx.fillRect(x,y,w,h);ctx.fillStyle=fg||'#0f0';ctx.fillRect(x,y,Math.round(w*clamp(v/m,0,1)),h);}
let _hiScore=parseInt(localStorage.getItem('hs_td')||'0');
function saveHiScore(s){if(s>_hiScore){_hiScore=s;localStorage.setItem('hs_td',s);}}

const FIXED_DT=1/60;
const MAX_DT=0.1;
let lastTime=0;
let accumulator=0;
function loop(ts){const rd=Math.min((ts-lastTime)/1000,MAX_DT);lastTime=ts;accumulator+=rd;while(accumulator>=FIXED_DT){update(FIXED_DT);accumulator-=FIXED_DT;}renderFrame();requestAnimationFrame(loop);}
function update(dt){updateParticles(dt);updatePopups(dt);switch(gameState){case'menu':if(Pointer.justDown){startGame();setState('playing');}break;case'playing':updatePlaying(dt);break;case'waveclear':updateWaveClear(dt);break;case'gameover':updateGameover(dt);break;case'victory':if(Pointer.justDown){startGame();setState('playing');}break;case'shop':updateShop(dt);break;}flushInput();}
function renderFrame(){switch(gameState){case'menu':renderMenu();break;case'playing':case'waveclear':renderPlaying();break;case'gameover':renderPlaying();renderGameoverOverlay();break;case'victory':renderPlaying();renderVictoryOverlay();break;case'shop':renderShop();break;}drawParticles();drawPopups();}

// ══════════════════════════════════════════════════════════════════
// GAME CONSTANTS
// ══════════════════════════════════════════════════════════════════
const GAME_TITLE = "KINGDOM'S LAST STAND";

const PALETTE = {
  bg:        '#0e1a08',
  path:      '#a07840',
  pathEdge:  '#6a4c20',
  buildable: '#1a3510',
  buildable2:'#1e3f12',
  blocked:   '#111f0a',
  ui:        '#f0e8c0',
  accent:    '#ffdd44',
  gold:      '#ffcc00',
  enemy:     '#ff4444',
  hp:        '#22ee22',
  shopBg:    '#0a120a',
  shopCard:  '#152215',
  shopSel:   '#1e3d1e',
};

const TILE = 40;
const GRID_COLS = 18;
const GRID_ROWS = 12;
const GRID_X = 0;
const GRID_Y = 0;
const HUD_Y = GRID_ROWS * TILE; // 480

// Winding S-path through the forest kingdom
const PATH_WAYPOINTS_GRID = [
  [0,5],[4,5],[4,1],[9,1],[9,8],[13,8],[13,3],[17,3]
];
let PATH = [];

let mapGrid = [];
let _treeCells = [];

// ── Tower types ───────────────────────────────────────────────────
const TOWER_TYPES = {
  archer: {
    name:'Archer', cost:60,  color:'#d4a017', color2:'#8B6000',
    range:120, damage:18, rate:1.6, projSpeed:320, splash:0, slowFactor:0,
    desc:'Fast arrows, cheap'
  },
  catapult: {
    name:'Catapult', cost:160, color:'#888888', color2:'#444444',
    range:90, damage:70, rate:0.42, projSpeed:180, splash:42, slowFactor:0,
    desc:'Heavy splash damage'
  },
  arcane: {
    name:'Arcane', cost:140, color:'#9944ff', color2:'#5a1fa8',
    range:110, damage:28, rate:0.9, projSpeed:240, splash:0, slowFactor:0.45,
    desc:'Slows enemies -45%'
  },
  storm: {
    name:'Storm', cost:220, color:'#ffee44', color2:'#aa8800',
    range:130, damage:45, rate:0.65, projSpeed:0, splash:0, slowFactor:0,
    desc:'Chains 3 enemies'
  },
};
const TOWER_KEYS = Object.keys(TOWER_TYPES);

// ── Enemy types ───────────────────────────────────────────────────
const ENEMY_TYPES = {
  goblin: { name:'Goblin',     hp:65,   speed:78,  reward:8,  size:12, color:'#44bb44', armor:0  },
  wolf:   { name:'Wolf Rider', hp:48,   speed:155, reward:14, size:11, color:'#ff8800', armor:0  },
  troll:  { name:'Troll',      hp:380,  speed:36,  reward:38, size:22, color:'#667755', armor:8  },
  bat:    { name:'Bat Swarm',  hp:55,   speed:115, reward:16, size:11, color:'#9922cc', armor:0  },
  dragon: { name:'DRAGON',     hp:1800, speed:26,  reward:130,size:32, color:'#cc2200', armor:14 },
};

// ── Waves ─────────────────────────────────────────────────────────
const WAVES = [
  [{type:'goblin',count:10,interval:1.0}],
  [{type:'goblin',count:8,interval:0.8},{type:'wolf',count:4,interval:1.2}],
  [{type:'wolf',count:8,interval:0.7},{type:'troll',count:2,interval:3.0}],
  [{type:'goblin',count:12,interval:0.6},{type:'bat',count:6,interval:0.9}],
  [{type:'wolf',count:10,interval:0.6},{type:'troll',count:3,interval:2.5},{type:'bat',count:4,interval:1.0}],
  [{type:'goblin',count:15,interval:0.5},{type:'wolf',count:8,interval:0.65},{type:'troll',count:2,interval:3.5}],
  [{type:'bat',count:10,interval:0.55},{type:'troll',count:5,interval:2.0},{type:'wolf',count:8,interval:0.7}],
  [{type:'goblin',count:12,interval:0.55},{type:'troll',count:4,interval:2.2},{type:'dragon',count:1,interval:0}],
];

// ── Game state ────────────────────────────────────────────────────
let gold = 150;
let lives = 20;
let waveIndex = 0;
let score = 0;
let selectedTowerType = 'archer';
let hoveredCell = {r:-1,c:-1};
const spawner = {active:false,groups:[],groupIdx:0,spawnCount:0,spawnTimer:0};

const enemyPool = createPool(()=>({alive:false,x:0,y:0,hp:0,maxHp:0,speed:0,baseSpeed:0,size:14,color:'#f44',reward:10,type:'goblin',pathIdx:0,pathProgress:0,slowTimer:0,slowFactor:0,armor:0,flashTimer:0,angle:0}),80);
const projPool  = createPool(()=>({alive:false,x:0,y:0,vx:0,vy:0,targetId:null,damage:0,splash:0,slowFactor:0,color:'#fff',type:'arrow',life:3}),200);
const towers    = [];

// ── Meta-progression ──────────────────────────────────────────────
const _META_KEY = 'meta_tower_defense';
const UPGRADES = [
  {id:'gold',    label:'Gold Bonus',   desc:'+25g start',     maxLv:3, cost:[60,120,200]},
  {id:'damage',  label:'Tower Power',  desc:'+20% damage',    maxLv:3, cost:[80,150,250]},
  {id:'firerate',label:'Fire Rate',    desc:'+15% rate',      maxLv:3, cost:[80,150,250]},
  {id:'life',    label:'Extra Lives',  desc:'+3 lives',       maxLv:3, cost:[70,130,220]},
];
let _meta={coins:0,upgrades:{}};
let _runCoins=0;
let _gameoverTimer=1.5;
let _shopIdx=0;
let _damageMultiplier=1.0;
let _goldBonus=0;
let waveClearTimer=0;

function loadMeta(){try{const s=localStorage.getItem(_META_KEY);_meta=s?JSON.parse(s):{coins:0,upgrades:{}};}catch(e){_meta={coins:0,upgrades:{}};}}
function saveMeta(){try{localStorage.setItem(_META_KEY,JSON.stringify(_meta));}catch(e){}}
function getUpgradeLevel(id){return(_meta.upgrades[id]||0);}
function buyUpgrade(id){const u=UPGRADES.find(x=>x.id===id);if(!u)return false;const lv=getUpgradeLevel(id);if(lv>=u.maxLv)return false;const cost=u.cost[lv];if(_meta.coins<cost)return false;_meta.coins-=cost;_meta.upgrades[id]=(lv+1);saveMeta();return true;}
function applyUpgrades(){_damageMultiplier=1+getUpgradeLevel('damage')*0.20;_goldBonus=getUpgradeLevel('gold')*25;gold=150+_goldBonus;lives=20+getUpgradeLevel('life')*3;}
function _shopHit(px,py,x,y,w,h){return px>=x&&px<=x+w&&py>=y&&py<=y+h;}
function updateGameover(dt){_gameoverTimer-=dt;if(_gameoverTimer<=0||anyAction()){_meta.coins+=_runCoins;saveMeta();_shopIdx=0;setState('shop');}}
function updateShop(dt){
  if(!Pointer.justDown)return;
  const n=UPGRADES.length,cardW=Math.round(W*0.20),cardH=Math.round(H*0.32),gap=Math.round(W*0.02);
  const sy=Math.round(H*0.22),totalW=n*cardW+(n-1)*gap,sx=(W-totalW)/2;
  for(let i=0;i<n;i++){
    if(_shopHit(Pointer.x,Pointer.y,sx+i*(cardW+gap),sy,cardW,cardH)){
      _shopIdx=i;if(buyUpgrade(UPGRADES[i].id)){sfx.play(660,0.12,'sine',0.1);applyUpgrades();}else sfx.play(110,0.06,'sawtooth',0.08);return;
    }
  }
  const btnW=160,btnH=42,btnX=(W-btnW)/2,btnY=sy+cardH+28;
  if(_shopHit(Pointer.x,Pointer.y,btnX,btnY,btnW,btnH)){sfx.play(440,0.08,'square',0.1);startGame();setState('playing');}
}
function renderShop(){
  ctx.fillStyle=PALETTE.shopBg;ctx.fillRect(0,0,W,H);
  ctx.textAlign='center';
  ctx.fillStyle=PALETTE.accent;ctx.font='bold 11px "Press Start 2P",monospace';ctx.fillText('UPGRADE SHOP',W/2,Math.round(H*0.12));
  ctx.fillStyle='#ffdd00';ctx.font='bold 14px system-ui,sans-serif';ctx.fillText(`🪙 ${_meta.coins} coins`,W/2,Math.round(H*0.19));
  const n=UPGRADES.length,cardW=Math.round(W*0.20),cardH=Math.round(H*0.32),gap=Math.round(W*0.02);
  const sy=Math.round(H*0.22),totalW=n*cardW+(n-1)*gap,sx=(W-totalW)/2;
  for(let i=0;i<n;i++){
    const u=UPGRADES[i],lv=getUpgradeLevel(u.id),cx=sx+i*(cardW+gap),maxed=lv>=u.maxLv,canBuy=!maxed&&_meta.coins>=u.cost[lv];
    ctx.fillStyle=_shopIdx===i?PALETTE.shopSel:PALETTE.shopCard;
    ctx.strokeStyle=maxed?'#44cc44':canBuy?'#ffdd00':'#333';ctx.lineWidth=_shopIdx===i?2:1;
    ctx.beginPath();ctx.roundRect(cx,sy,cardW,cardH,8);ctx.fill();ctx.stroke();
    ctx.fillStyle='#fff';ctx.font='bold 11px system-ui,sans-serif';ctx.fillText(u.label,cx+cardW/2,sy+22);
    ctx.fillStyle='#aaa';ctx.font='10px system-ui,sans-serif';ctx.fillText(u.desc,cx+cardW/2,sy+40);
    for(let d=0;d<u.maxLv;d++){ctx.fillStyle=d<lv?'#ffdd00':'#333';ctx.beginPath();ctx.arc(cx+cardW/2+(d-u.maxLv/2+0.5)*14,sy+cardH-36,5,0,Math.PI*2);ctx.fill();}
    ctx.font='bold 12px system-ui,sans-serif';ctx.fillStyle=maxed?'#44cc44':canBuy?'#ffdd00':'#555';
    ctx.fillText(maxed?'MAXED':`${u.cost[lv]}🪙`,cx+cardW/2,sy+cardH-14);
  }
  const btnW=160,btnH=42,btnX=(W-btnW)/2,btnY=sy+cardH+28;
  ctx.fillStyle='#1a4a1a';ctx.strokeStyle='#44cc44';ctx.lineWidth=2;ctx.beginPath();ctx.roundRect(btnX,btnY,btnW,btnH,8);ctx.fill();ctx.stroke();
  ctx.fillStyle='#fff';ctx.font='bold 16px system-ui,sans-serif';ctx.fillText('▶  PLAY',W/2,btnY+27);
  ctx.textAlign='left';
}

// ══════════════════════════════════════════════════════════════════
// MAP INIT
// ══════════════════════════════════════════════════════════════════
function buildMap(){
  mapGrid=[];_treeCells=[];
  for(let r=0;r<GRID_ROWS;r++){mapGrid[r]=[];for(let c=0;c<GRID_COLS;c++)mapGrid[r][c]={type:0,tower:null};}
  for(let i=0;i<PATH_WAYPOINTS_GRID.length-1;i++){
    const[c1,r1]=PATH_WAYPOINTS_GRID[i],[c2,r2]=PATH_WAYPOINTS_GRID[i+1];
    const dc=Math.sign(c2-c1),dr=Math.sign(r2-r1);
    let cc=c1,rr=r1;
    while(cc!==c2||rr!==r2){if(rr>=0&&rr<GRID_ROWS&&cc>=0&&cc<GRID_COLS)mapGrid[rr][cc].type=1;cc+=dc;rr+=dr;}
    if(r2>=0&&r2<GRID_ROWS&&c2>=0&&c2<GRID_COLS)mapGrid[r2][c2].type=1;
  }
  PATH=PATH_WAYPOINTS_GRID.map(([c,r])=>({x:GRID_X+c*TILE+TILE/2,y:GRID_Y+r*TILE+TILE/2}));
  // Scatter trees on buildable cells
  for(let r=0;r<GRID_ROWS;r++)for(let c=0;c<GRID_COLS;c++){
    if(mapGrid[r][c].type===0&&(r*31+c*17)%5===0)_treeCells.push({r,c});
  }
}

function tileCenter(r,c){return{x:GRID_X+c*TILE+TILE/2,y:GRID_Y+r*TILE+TILE/2};}
function pixelToTile(px,py){return{r:Math.floor((py-GRID_Y)/TILE),c:Math.floor((px-GRID_X)/TILE)};}
function inMap(r,c){return r>=0&&r<GRID_ROWS&&c>=0&&c<GRID_COLS;}
function canBuild(r,c){return inMap(r,c)&&mapGrid[r][c].type===0&&!mapGrid[r][c].tower;}

// ══════════════════════════════════════════════════════════════════
// GAME INIT
// ══════════════════════════════════════════════════════════════════
loadMeta();
function startGame(){
  loadMeta();_runCoins=0;_gameoverTimer=1.5;waveClearTimer=0;
  buildMap();
  towers.length=0;enemyPool.clear();projPool.clear();Popups.length=0;
  gold=150;lives=20;waveIndex=0;score=0;
  spawner.active=false;spawner.groups=[];spawner.groupIdx=0;spawner.spawnCount=0;spawner.spawnTimer=0;
  selectedTowerType='archer';
  applyUpgrades();
  startWave(0);
}

function startWave(idx){
  if(idx>=WAVES.length){setState('victory');return;}
  waveIndex=idx;
  spawner.groups=[...WAVES[idx].map(g=>({...g}))];
  spawner.groupIdx=0;spawner.spawnCount=0;spawner.spawnTimer=2.0;
  spawner.active=true;
}

function spawnEnemy(type){
  const def=ENEMY_TYPES[type]||ENEMY_TYPES.goblin;
  enemyPool.get(e=>{
    e.type=type;e.color=def.color;e.size=def.size;
    e.hp=e.maxHp=Math.round(def.hp*(1+waveIndex*0.12));
    e.speed=e.baseSpeed=def.speed;e.reward=def.reward;e.armor=def.armor||0;
    e.pathIdx=0;e.pathProgress=0;e.x=PATH[0].x;e.y=PATH[0].y;
    e.slowTimer=0;e.slowFactor=0;e.flashTimer=0;e.angle=0;
  });
}

// ══════════════════════════════════════════════════════════════════
// TARGETING & COMBAT
// ══════════════════════════════════════════════════════════════════
function getTarget(tower){
  let best=null,bestProg=-1;
  enemyPool.active.forEach(e=>{
    if(!e.alive)return;
    const d=dist(tower.x,tower.y,e.x,e.y);
    if(d<=tower.range&&e.pathProgress>bestProg){best=e;bestProg=e.pathProgress;}
  });
  return best;
}

function towerFire(tower,dt){
  tower.fireTimer=Math.max(0,tower.fireTimer-dt);
  if(tower.fireTimer>0)return;
  const def=TOWER_TYPES[tower.type];
  const target=getTarget(tower);
  if(!target)return;
  tower.fireTimer=1/(def.rate*(tower.rateBonus||1));
  tower.angle=Math.atan2(target.y-tower.y,target.x-tower.x);

  if(tower.type==='storm'){
    let targets=[target];
    enemyPool.active.forEach(e=>{if(e!==target&&e.alive&&dist(tower.x,tower.y,e.x,e.y)<=def.range)targets.push(e);});
    targets=targets.slice(0,3);
    targets.forEach(e=>{
      const dmg=Math.max(1,Math.round(def.damage*_damageMultiplier)-e.armor);
      e.hp-=dmg;e.flashTimer=0.07;
      spawnParticles(e.x,e.y,4,{color:'#ff0',speed:55,life:0.25,gravity:0});
      if(e.hp<=0)killEnemy(e);
    });
    // Lightning visual stored on tower
    tower.lightningTargets=targets.slice();tower.lightningTimer=0.12;
    sfx.play(880,0.07,'sawtooth',0.06);
    return;
  }

  const dx=target.x-tower.x,dy=target.y-tower.y,len=Math.hypot(dx,dy)||1;
  projPool.get(p=>{
    p.x=tower.x;p.y=tower.y;
    p.vx=dx/len*def.projSpeed;p.vy=dy/len*def.projSpeed;
    p.damage=def.damage;p.splash=def.splash||0;
    p.slowFactor=def.slowFactor||0;p.color=def.color;
    p.type=tower.type;p.life=3;p.targetId=target;
  });
  sfx.play(tower.type==='catapult'?150:tower.type==='arcane'?660:440,0.04,'square',0.04);
}

function killEnemy(e){
  gold+=e.reward;score+=e.reward*12;
  spawnParticles(e.x,e.y,12,{color:e.color,speed:65,life:0.45,gravity:90});
  spawnPopup(e.x,e.y-12,`+${e.reward}g`,PALETTE.gold,11);
  e.alive=false;
}

// UPDATE
// ══════════════════════════════════════════════════════════════════
function updatePlaying(dt){
  // Spawner
  if(spawner.active){
    spawner.spawnTimer-=dt;
    if(spawner.spawnTimer<=0&&spawner.groupIdx<spawner.groups.length){
      const group=spawner.groups[spawner.groupIdx];
      if(spawner.spawnCount<group.count){spawnEnemy(group.type);spawner.spawnCount++;spawner.spawnTimer=group.interval;}
      else{spawner.groupIdx++;spawner.spawnCount=0;spawner.spawnTimer=0.5;}
    }
    if(spawner.groupIdx>=spawner.groups.length&&enemyPool.active.filter(x=>x.alive).length===0){
      spawner.active=false;
      const bonus=30+waveIndex*6;gold+=bonus;
      spawnPopup(W/2,H/2-40,`WAVE CLEAR! +${bonus}g`,PALETTE.accent,16);
      sfx.play(660,0.3,'sine',0.12);
      setState('waveclear');
    }
  }

  // Enemy movement
  enemyPool.update(e=>{
    e.flashTimer=Math.max(0,e.flashTimer-dt);
    if(e.lightningTimer!==undefined)e.lightningTimer=Math.max(0,e.lightningTimer-dt);
    e.slowTimer=Math.max(0,e.slowTimer-dt);
    const spd=e.slowTimer>0?e.speed*(1-e.slowFactor):e.speed;
    if(e.pathIdx>=PATH.length){
      lives--;
      sfx.play(110,0.2,'sawtooth',0.14);
      spawnPopup(W/2,H/2,'ENEMY ESCAPED!','#f44',15);
      if(lives<=0){saveHiScore(score);_runCoins=Math.floor(score/150);_gameoverTimer=1.5;setState('gameover');}
      return false;
    }
    const wp=PATH[e.pathIdx];
    const dx=wp.x-e.x,dy=wp.y-e.y,d=Math.hypot(dx,dy);
    if(d<spd*dt+2){e.x=wp.x;e.y=wp.y;e.pathIdx++;e.pathProgress=e.pathIdx;}
    else{const step=spd*dt/d;e.x+=dx*step;e.y+=dy*step;e.pathProgress=e.pathIdx+(1-d/TILE);e.angle=Math.atan2(dy,dx);}
    return e.alive && e.y<H+80;
  });

  // Projectiles
  projPool.update(p=>{
    p.life-=dt;if(p.life<=0)return false;
    if(p.targetId&&p.targetId.alive){
      const dx=p.targetId.x-p.x,dy=p.targetId.y-p.y,len=Math.hypot(dx,dy)||1;
      const speed=Math.hypot(p.vx,p.vy);
      p.vx=lerp(p.vx,dx/len*speed,dt*5);p.vy=lerp(p.vy,dy/len*speed,dt*5);
    }
    p.x+=p.vx*dt;p.y+=p.vy*dt;
    let hit=false;
    enemyPool.active.forEach(e=>{
      if(!e.alive||hit)return;
      if(dist(p.x,p.y,e.x,e.y)<e.size+5){
        hit=true;
        if(p.splash>0){
          enemyPool.active.forEach(e2=>{if(!e2.alive)return;if(dist(p.x,p.y,e2.x,e2.y)<p.splash){const d2=Math.max(1,Math.round(p.damage*_damageMultiplier)-e2.armor);e2.hp-=d2;e2.flashTimer=0.07;if(e2.hp<=0)killEnemy(e2);}});
          spawnParticles(p.x,p.y,16,{color:'#f80',speed:75,life:0.5,gravity:80});
          triggerShake(3,0.2);
        } else {
          const d2=Math.max(1,Math.round(p.damage*_damageMultiplier)-e.armor);e.hp-=d2;e.flashTimer=0.07;
          if(p.slowFactor>0){e.slowTimer=2.5;e.slowFactor=p.slowFactor;}
          if(e.hp<=0)killEnemy(e);
        }
        spawnParticles(p.x,p.y,5,{color:p.color,speed:50,life:0.25,gravity:60});
      }
    });
    return!hit&&p.x>-20&&p.x<W+20&&p.y>-20&&p.y<H+20;
  });

  // Tower lightning timer decay
  towers.forEach(t=>{
    towerFire(t,dt);
    if(t.lightningTimer!==undefined)t.lightningTimer=Math.max(0,t.lightningTimer-dt);
  });

  // Hover
  const{r,c}=pixelToTile(Pointer.x,Pointer.y);hoveredCell={r,c};

  // Place tower (left-click)
  if(Pointer.justDown&&inMap(r,c)&&Pointer.y<HUD_Y){
    if(canBuild(r,c)){
      const def=TOWER_TYPES[selectedTowerType];
      if(gold>=def.cost){
        gold-=def.cost;
        const{x,y}=tileCenter(r,c);
        const tower={x,y,r,c,type:selectedTowerType,range:def.range,fireTimer:0,angle:0,lightningTargets:[],lightningTimer:0};
        towers.push(tower);mapGrid[r][c].tower=tower;
        sfx.play(550,0.08,'square',0.08);
      } else {
        spawnPopup(Pointer.x,Pointer.y,'Need more gold!','#f44',12);sfx.play(110,0.04,'sawtooth',0.06);
      }
    }
  }

  // Sell tower (right-click)
  if(_rightClick.active){
    const{r:sr,c:sc}=pixelToTile(_rightClick.x,_rightClick.y);
    if(inMap(sr,sc)&&mapGrid[sr][sc].tower){
      const t=mapGrid[sr][sc].tower;
      const refund=Math.floor(TOWER_TYPES[t.type].cost*0.5);
      gold+=refund;towers.splice(towers.indexOf(t),1);mapGrid[sr][sc].tower=null;
      spawnPopup(t.x,t.y-12,`+${refund}g SOLD`,'#ffdd00',12);sfx.play(300,0.08,'sine',0.08);
    }
    _rightClick.active=false;
  }

  // Keyboard tower selection
  if(keyPressed('Digit1'))selectedTowerType='archer';
  if(keyPressed('Digit2'))selectedTowerType='catapult';
  if(keyPressed('Digit3'))selectedTowerType='arcane';
  if(keyPressed('Digit4'))selectedTowerType='storm';
}

function updateWaveClear(dt){
  waveClearTimer+=dt;
  if(waveClearTimer>=3.5||Pointer.justDown){waveClearTimer=0;startWave(waveIndex+1);setState('playing');}
}

let _shakeAmt=0,_shakeDur=0;
function triggerShake(m,d){_shakeAmt=m;_shakeDur=d;}

function drawTree(cx,cy){
  // Trunk
  ctx.fillStyle='#5c3d1a';ctx.fillRect(cx-3,cy+4,6,10);
  // Crown
  ctx.fillStyle='#1a6a10';
  ctx.beginPath();ctx.arc(cx,cy,11,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='#22882a';
  ctx.beginPath();ctx.arc(cx-3,cy-3,7,0,Math.PI*2);ctx.fill();
}

function drawCastle(cx,cy){
  ctx.fillStyle='#888';
  // Main wall
  ctx.fillRect(cx-22,cy-18,44,30);
  // Battlements
  for(let i=0;i<5;i++){ctx.fillStyle=i%2===0?'#777':'#555';ctx.fillRect(cx-22+i*10,cy-26,8,10);}
  // Gate arch
  ctx.fillStyle='#2a1500';
  ctx.beginPath();ctx.ellipse(cx,cy+8,8,12,0,Math.PI,0,true);ctx.fillRect(cx-8,cy+8,16,6);ctx.fill();
  // Towers
  ctx.fillStyle='#666';
  ctx.fillRect(cx-30,cy-22,12,38);ctx.fillRect(cx+18,cy-22,12,38);
  // Tower tops
  for(const tx of[cx-30,cx+18]){for(let i=0;i<3;i++){ctx.fillStyle=i%2===0?'#666':'#444';ctx.fillRect(tx+i*4,cy-30,3,9);}}
  // Flag
  ctx.fillStyle='#dd2200';
  ctx.beginPath();ctx.moveTo(cx-5,cy-36);ctx.lineTo(cx-5,cy-24);ctx.lineTo(cx+8,cy-30);ctx.closePath();ctx.fill();
  ctx.strokeStyle='#888';ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(cx-5,cy-36);ctx.lineTo(cx-5,cy-10);ctx.stroke();
}

function renderEnemy(e){
  ctx.globalAlpha=e.flashTimer>0?0.35:1.0;
  const isSlow=e.slowTimer>0;
  switch(e.type){
    case'goblin':{
      // Green triangle body
      ctx.fillStyle=isSlow?'#88aaff':e.color;
      ctx.beginPath();ctx.moveTo(e.x,e.y-e.size);ctx.lineTo(e.x+e.size*0.8,e.y+e.size*0.6);ctx.lineTo(e.x-e.size*0.8,e.y+e.size*0.6);ctx.closePath();ctx.fill();
      // Eyes
      ctx.fillStyle='#ff0';ctx.beginPath();ctx.arc(e.x-3,e.y-1,2,0,Math.PI*2);ctx.arc(e.x+3,e.y-1,2,0,Math.PI*2);ctx.fill();
      break;}
    case'wolf':{
      // Orange horse-like shape
      ctx.fillStyle=isSlow?'#88aaff':e.color;
      ctx.beginPath();ctx.ellipse(e.x,e.y,e.size*0.9,e.size*0.7,e.angle||0,0,Math.PI*2);ctx.fill();
      // Rider
      ctx.fillStyle='#cc5500';
      ctx.beginPath();ctx.arc(e.x,e.y-e.size*0.6,e.size*0.45,0,Math.PI*2);ctx.fill();
      break;}
    case'troll':{
      ctx.fillStyle=isSlow?'#88aaff':e.color;
      ctx.shadowBlur=0;
      ctx.beginPath();ctx.arc(e.x,e.y,e.size,0,Math.PI*2);ctx.fill();
      // Club arm
      ctx.strokeStyle='#445533';ctx.lineWidth=5;
      ctx.beginPath();ctx.moveTo(e.x,e.y);ctx.lineTo(e.x+Math.cos(e.angle)*e.size*1.4,e.y+Math.sin(e.angle)*e.size*1.4);ctx.stroke();
      ctx.fillStyle='#667755';ctx.beginPath();ctx.arc(e.x+Math.cos(e.angle)*e.size*1.5,e.y+Math.sin(e.angle)*e.size*1.5,6,0,Math.PI*2);ctx.fill();
      break;}
    case'bat':{
      ctx.fillStyle=isSlow?'#88aaff':e.color;
      const bw=e.size*1.4,bt=Date.now()*0.008;
      // Wings (two arcs)
      ctx.beginPath();ctx.ellipse(e.x-bw*Math.sin(bt),e.y,bw,e.size*0.4,bt*0.5,0,Math.PI*2);ctx.fill();
      ctx.beginPath();ctx.ellipse(e.x+bw*Math.sin(bt),e.y,bw,e.size*0.4,-bt*0.5,0,Math.PI*2);ctx.fill();
      ctx.fillStyle='#440055';ctx.beginPath();ctx.arc(e.x,e.y,5,0,Math.PI*2);ctx.fill();
      break;}
    case'dragon':{
      ctx.shadowBlur=18;ctx.shadowColor='#cc2200';
      ctx.fillStyle=isSlow?'#88aaff':e.color;
      ctx.beginPath();ctx.arc(e.x,e.y,e.size,0,Math.PI*2);ctx.fill();
      // Spikes
      for(let i=0;i<6;i++){
        const a=i*Math.PI/3;
        ctx.fillStyle='#ff6600';
        ctx.beginPath();ctx.moveTo(e.x+Math.cos(a)*e.size,e.y+Math.sin(a)*e.size);
        ctx.lineTo(e.x+Math.cos(a+0.25)*e.size*1.6,e.y+Math.sin(a+0.25)*e.size*1.6);
        ctx.lineTo(e.x+Math.cos(a-0.25)*e.size*1.6,e.y+Math.sin(a-0.25)*e.size*1.6);
        ctx.closePath();ctx.fill();
      }
      ctx.shadowBlur=0;
      break;}
    default:{
      ctx.fillStyle=isSlow?'#88aaff':e.color;ctx.beginPath();ctx.arc(e.x,e.y,e.size,0,Math.PI*2);ctx.fill();
    }
  }
  ctx.globalAlpha=1;
  drawBar(e.x-e.size,e.y-e.size-7,e.size*2,4,e.hp,e.maxHp,'#22ee22','#330000');
}

function renderTower(t){
  const def=TOWER_TYPES[t.type];
  // Stone base
  ctx.fillStyle=def.color2;
  ctx.beginPath();ctx.arc(t.x,t.y,TILE/2-3,0,Math.PI*2);ctx.fill();
  ctx.strokeStyle='rgba(0,0,0,0.4)';ctx.lineWidth=1;ctx.stroke();
  // Barrel
  ctx.save();ctx.translate(t.x,t.y);ctx.rotate(t.angle||0);
  ctx.fillStyle=def.color;
  switch(t.type){
    case'archer':
      // Arrow tip
      ctx.fillRect(0,-2,TILE/2-6,4);
      ctx.beginPath();ctx.moveTo(TILE/2-6,-5);ctx.lineTo(TILE/2-2,0);ctx.lineTo(TILE/2-6,5);ctx.closePath();ctx.fill();
      break;
    case'catapult':
      // Catapult arm
      ctx.fillStyle='#aaa';ctx.fillRect(-2,-2,TILE/2-4,5);
      ctx.beginPath();ctx.arc(TILE/2-8,0,5,0,Math.PI*2);ctx.fill();
      break;
    case'arcane':
      // Magic orb on rod
      ctx.fillStyle='#6600aa';ctx.fillRect(0,-1.5,TILE/2-10,3);
      ctx.shadowBlur=10;ctx.shadowColor='#cc88ff';
      ctx.fillStyle='#cc88ff';ctx.beginPath();ctx.arc(TILE/2-8,0,5,0,Math.PI*2);ctx.fill();
      ctx.shadowBlur=0;
      break;
    case'storm':
      // Lightning rod
      ctx.fillStyle='#dddd00';ctx.fillRect(0,-2,TILE/2-5,4);
      ctx.shadowBlur=8;ctx.shadowColor='#ffff00';
      ctx.strokeStyle='#fff';ctx.lineWidth=2;
      ctx.beginPath();ctx.moveTo(TILE/2-5,-4);ctx.lineTo(TILE/2-1,0);ctx.lineTo(TILE/2-5,4);ctx.stroke();
      ctx.shadowBlur=0;
      break;
  }
  ctx.restore();
  // Center dot
  ctx.fillStyle=def.color;ctx.beginPath();ctx.arc(t.x,t.y,5,0,Math.PI*2);ctx.fill();
  // Lightning arcs
  if(t.type==='storm'&&t.lightningTimer>0&&t.lightningTargets){
    ctx.strokeStyle=`rgba(255,255,100,${t.lightningTimer*8})`;ctx.lineWidth=2;
    t.lightningTargets.forEach(e=>{
      if(!e||!e.alive)return;
      ctx.beginPath();ctx.moveTo(t.x,t.y);
      // Jagged line
      const mx=(t.x+e.x)/2+(Math.random()-0.5)*20,my=(t.y+e.y)/2+(Math.random()-0.5)*20;
      ctx.quadraticCurveTo(mx,my,e.x,e.y);ctx.stroke();
    });
  }
  // Range ring (hovered)
  if(hoveredCell.r===t.r&&hoveredCell.c===t.c){
    ctx.strokeStyle=`${def.color}55`;ctx.lineWidth=1;ctx.setLineDash([4,4]);
    ctx.beginPath();ctx.arc(t.x,t.y,t.range,0,Math.PI*2);ctx.stroke();ctx.setLineDash([]);
  }
}

function renderPlaying(){
  // Screen shake
  let sx=0,sy=0;
  if(_shakeAmt>0){sx=(Math.random()-0.5)*_shakeAmt*2;sy=(Math.random()-0.5)*_shakeAmt*2;_shakeDur-=1/60;if(_shakeDur<=0)_shakeAmt=0;}
  ctx.save();ctx.translate(sx,sy);

  ctx.fillStyle=PALETTE.bg;ctx.fillRect(-4,-4,W+8,H+8);

  // Grid tiles (checkerboard grass)
  for(let r=0;r<GRID_ROWS;r++) for(let c=0;c<GRID_COLS;c++){
    const cell=mapGrid[r][c];
    const x=GRID_X+c*TILE,y=GRID_Y+r*TILE;
    if(cell.type===1){
      ctx.fillStyle=PALETTE.path;ctx.fillRect(x,y,TILE,TILE);
      ctx.strokeStyle=PALETTE.pathEdge;ctx.lineWidth=0.5;ctx.strokeRect(x,y,TILE,TILE);
      // Dirt pebbles
      ctx.fillStyle='rgba(0,0,0,0.12)';
      ctx.beginPath();ctx.arc(x+10,y+12,2,0,Math.PI*2);ctx.arc(x+28,y+22,1.5,0,Math.PI*2);ctx.arc(x+18,y+32,2.5,0,Math.PI*2);ctx.fill();
    } else {
      ctx.fillStyle=(r+c)%2===0?PALETTE.buildable:PALETTE.buildable2;ctx.fillRect(x,y,TILE,TILE);
      ctx.strokeStyle='rgba(0,0,0,0.15)';ctx.lineWidth=0.5;ctx.strokeRect(x,y,TILE,TILE);
    }
  }

  // Trees (behind towers/enemies)
  _treeCells.forEach(({r,c})=>{
    if(mapGrid[r][c].tower)return;
    const x=GRID_X+c*TILE+TILE/2,y=GRID_Y+r*TILE+TILE/2;
    drawTree(x,y);
  });

  // Castle at path exit
  const last=PATH_WAYPOINTS_GRID[PATH_WAYPOINTS_GRID.length-1];
  drawCastle(GRID_X+last[0]*TILE+TILE/2,GRID_Y+last[1]*TILE+TILE/2);

  // Path dashes
  ctx.strokeStyle='rgba(255,255,200,0.10)';ctx.lineWidth=2;ctx.setLineDash([8,10]);
  ctx.beginPath();PATH.forEach((p,i)=>i===0?ctx.moveTo(p.x,p.y):ctx.lineTo(p.x,p.y));ctx.stroke();
  ctx.setLineDash([]);

  // Hover preview
  const{r:hr,c:hc}=hoveredCell;
  if(inMap(hr,hc)&&canBuild(hr,hc)){
    const def=TOWER_TYPES[selectedTowerType];
    const x=GRID_X+hc*TILE,y=GRID_Y+hr*TILE;
    ctx.fillStyle=gold>=def.cost?'rgba(255,255,200,0.15)':'rgba(255,60,60,0.12)';ctx.fillRect(x,y,TILE,TILE);
    const{x:cx,y:cy}=tileCenter(hr,hc);
    ctx.strokeStyle=gold>=def.cost?`${def.color}44`:'rgba(255,80,80,0.3)';ctx.lineWidth=1;ctx.setLineDash([4,4]);
    ctx.beginPath();ctx.arc(cx,cy,def.range,0,Math.PI*2);ctx.stroke();ctx.setLineDash([]);
  }

  // Towers
  towers.forEach(renderTower);

  // Enemies
  enemyPool.active.forEach(renderEnemy);

  // Projectiles
  projPool.active.forEach(p=>{
    ctx.fillStyle=p.color;
    if(p.type==='catapult'){ctx.shadowBlur=0;ctx.beginPath();ctx.arc(p.x,p.y,5,0,Math.PI*2);ctx.fill();}
    else if(p.type==='arcane'){ctx.shadowBlur=10;ctx.shadowColor=p.color;ctx.beginPath();ctx.arc(p.x,p.y,4,0,Math.PI*2);ctx.fill();ctx.shadowBlur=0;}
    else{ctx.fillRect(p.x-3,p.y-1.5,6,3);}
  });

  ctx.restore(); // end shake

  // HUD
  ctx.fillStyle='#0d1a0a';ctx.fillRect(0,HUD_Y,W,H-HUD_Y);
  ctx.fillStyle='rgba(255,220,100,0.12)';ctx.fillRect(0,HUD_Y,W,1);

  // Row 1: status
  drawText(`⚜ ${gold}g`,8,HUD_Y+18,PALETTE.gold,14);
  drawText(`♥ ${lives}`,100,HUD_Y+18,lives<=5?'#ff3333':'#ff8888',14);
  drawText(`WAVE ${waveIndex+1} / ${WAVES.length}`,W/2,HUD_Y+18,'#aaa',12,'center');
  drawText(`SCORE: ${score}`,W-8,HUD_Y+18,PALETTE.ui,12,'right');

  // Row 2: tower selector
  let tx=8;
  TOWER_KEYS.forEach((key,i)=>{
    const def=TOWER_TYPES[key];const sel=key===selectedTowerType;const canAfford=gold>=def.cost;
    ctx.fillStyle=sel?'#2a3a1a':'#111';
    ctx.strokeStyle=sel?def.color:'#333';ctx.lineWidth=sel?2:1;
    ctx.beginPath();ctx.roundRect(tx,HUD_Y+26,70,30,4);ctx.fill();ctx.stroke();
    drawText(`[${i+1}] ${def.name}`,tx+5,HUD_Y+39,canAfford?'#fff':'#555',9);
    drawText(`${def.cost}g`,tx+5,HUD_Y+52,canAfford?PALETTE.gold:'#444',8);
    // Tower icon
    ctx.fillStyle=def.color;ctx.beginPath();ctx.arc(tx+58,HUD_Y+38,7,0,Math.PI*2);ctx.fill();
    tx+=74;
  });

  // Range info for selected tower
  const sDef=TOWER_TYPES[selectedTowerType];
  drawText(`DMG:${sDef.damage} RNG:${sDef.range} | Right-click to SELL 50%`,W/2,HUD_Y+56,'#556644',9,'center');

  // Wave clear countdown
  if(gameState==='waveclear'){
    ctx.fillStyle='rgba(0,20,0,0.6)';ctx.fillRect(0,HUD_Y,W,H-HUD_Y);
    drawText(`WAVE CLEAR — NEXT WAVE IN ${Math.max(0,Math.ceil(3.5-waveClearTimer))}s — TAP to skip`,W/2,HUD_Y+35,'#ffdd44',13,'center');
  }
}

// ══════════════════════════════════════════════════════════════════
// START
// ══════════════════════════════════════════════════════════════════
startGame();
requestAnimationFrame(t=>{lastTime=t;requestAnimationFrame(loop);});
</script>
