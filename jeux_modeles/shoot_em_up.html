<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Stellar Assault</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: #000; display: flex; justify-content: center; align-items: center; height: 100vh; overflow: hidden; }
canvas { display: block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
var canvas = document.getElementById('c');
var ctx = canvas.getContext('2d');
var W = canvas.width  = 480;
var H = canvas.height = 640;

// ─── CONSTANTS ────────────────────────────────────────────────────────────────
var PLAYER_SPEED   = 230;
var BULLET_SPEED   = 470;
var BASE_FIRE_RATE = 0.11;
var PLAYER_LIVES   = 3;
var INVINCIBLE_DUR = 2.2;

// ─── GLOBAL STATE ─────────────────────────────────────────────────────────────
var gameState = 'menu';  // 'menu' | 'playing' | 'wave_clear' | 'gameover'
var score = 0;
var highScore = parseInt(localStorage.getItem('shmup_hs2') || '0');
var wave = 1;
var lives = PLAYER_LIVES;
var combo = 0;
var comboTimer = 0;
var shake = { x:0, y:0, timer:0, intensity:0 };
var waveClearTimer = 0;

// ─── ENTITIES ─────────────────────────────────────────────────────────────────
var player = null;
var bullets    = [];  // {x,y,vx,vy,owner,w,h,type}
var enemies    = [];  // {x,y,w,h,hp,maxHp,type,fireTimer,vx,vy,points,phase}
var particles  = [];  // {x,y,vx,vy,life,maxLife,r,color}
var powerups   = [];  // {x,y,type,vy,w,h,age}
var stars      = [];  // scrolling background

// ─── WEAPON SYSTEM ────────────────────────────────────────────────────────────
var weaponType  = 'single';   // 'single' | 'triple' | 'spread5' | 'laser'
var weaponTimer = 0;
var playerShield = false;
var shieldTimer  = 0;
var bombCount    = 0;
var laserActive  = false;
var laserTimer   = 0;

// ─── ENEMY TYPES ──────────────────────────────────────────────────────────────
var ENEMY_DEFS = {
    drone:   { w:22, h:22, hp:1,  speed:85,  pts:100,  color:'#00e5ff', fireRate:0,   shape:'triangle' },
    fighter: { w:30, h:30, hp:2,  speed:65,  pts:200,  color:'#ff6d00', fireRate:2.8, shape:'diamond'  },
    tank:    { w:44, h:40, hp:6,  speed:38,  pts:500,  color:'#aa00ff', fireRate:1.6, shape:'rect'     },
    stealth: { w:26, h:26, hp:1,  speed:140, pts:300,  color:'#69f0ae', fireRate:0,   shape:'triangle' },
    boss:    { w:90, h:90, hp:40, speed:50,  pts:5000, color:'#ff1744', fireRate:0.8, shape:'boss'     },
};

// ─── HELPERS ──────────────────────────────────────────────────────────────────
function rnd(a, b)       { return a + Math.random() * (b - a); }
function rndInt(a, b)    { return Math.floor(rnd(a, b + 1)); }
function aabb(a, b) {
    return Math.abs(a.x-b.x) < (a.w+b.w)/2 && Math.abs(a.y-b.y) < (a.h+b.h)/2;
}
function triggerShake(intensity) { shake.timer = 0.3; shake.intensity = intensity; }

// ─── STARS ────────────────────────────────────────────────────────────────────
function initStars() {
    stars = [];
    for (var i = 0; i < 120; i++) {
        stars.push({ x:rnd(0,W), y:rnd(0,H), r:rnd(0.4,2.2), speed:rnd(25,90) });
    }
}

// ─── PLAYER SPAWN ─────────────────────────────────────────────────────────────
function spawnPlayer() {
    player = { x:W/2, y:H-90, w:28, h:32, fireTimer:0, invTimer:0 };
    weaponType = 'single'; weaponTimer = 0;
    playerShield = false; shieldTimer = 0;
    bombCount = 0; laserActive = false; laserTimer = 0;
}

// ─── WAVE MANAGEMENT ──────────────────────────────────────────────────────────
var waveActive       = false;
var waveEnemiesLeft  = 0;
var spawnTimer       = 0;
var waveTimer        = 0;
var bossRef          = null;   // reference to the current boss entity

function startWave(w) {
    waveActive = true; bossRef = null;
    if (w % 5 === 0) {
        spawnBoss(w);
        waveEnemiesLeft = 0;
    } else {
        waveEnemiesLeft = 5 + w * 2;
        spawnTimer = 0.2;
        // Formation spawn on wave 3+
        if (w >= 3) spawnFormation(w);
    }
}

function spawnFormation(w) {
    // V-formation of drones
    var cx = W / 2;
    var types = w >= 6 ? 'fighter' : 'drone';
    for (var i = 0; i < 5; i++) {
        var def = ENEMY_DEFS[types];
        var angle = (-2 + i) * 0.4;
        enemies.push(Object.assign({}, def, {
            x: cx + (i-2)*48, y: -40 - Math.abs(i-2)*30,
            hp: def.hp, maxHp: def.hp,
            type: types, color: def.color, points: def.pts,
            speed: def.speed * (1 + w*0.04),
            vx: Math.sin(angle)*25, vy: def.speed*(1+w*0.04),
            fireTimer: rnd(1, def.fireRate || 3),
            sinOffset: rnd(0, Math.PI*2), age: 0,
        }));
        waveEnemiesLeft -= 1;
    }
}

function spawnEnemy(w) {
    var pool = w < 4  ? ['drone','drone','fighter'] :
               w < 7  ? ['drone','fighter','fighter','tank'] :
               w < 10 ? ['fighter','tank','tank','stealth'] :
                        ['tank','stealth','stealth'];
    var typeName = pool[rndInt(0, pool.length-1)];
    var def = ENEMY_DEFS[typeName];
    var spd = def.speed * (1 + w*0.05);
    enemies.push(Object.assign({}, def, {
        x: rnd(def.w, W-def.w), y: -def.h,
        hp: def.hp, maxHp: def.hp,
        type: typeName, points: def.pts, speed: spd,
        vx: rnd(-25,25), vy: spd,
        fireTimer: rnd(0.5, def.fireRate || 2),
        sinOffset: rnd(0, Math.PI*2), age: 0,
    }));
}

function spawnBoss(w) {
    var def = ENEMY_DEFS.boss;
    var totalHp = def.hp + w * 8;
    var b = Object.assign({}, def, {
        x: W/2, y: -def.h,
        hp: totalHp, maxHp: totalHp,
        type: 'boss', points: def.pts + w*500,
        speed: def.speed, vy: def.speed * 0.4,
        vx: 0, targetX: W/2,
        fireTimer: 0.5, age: 0, sinOffset: 0,
        phase: 1,   // boss transitions through 3 phases based on HP %
    });
    enemies.push(b);
    bossRef = b;
}

// ─── BULLET FACTORIES ─────────────────────────────────────────────────────────
function fireBullet(x, y, vx, vy, type) {
    bullets.push({ x:x, y:y, vx:vx, vy:vy, owner:'player', w:6, h:12, type:type||'normal' });
}
function fireEnemyBullet(x, y, vx, vy) {
    bullets.push({ x:x, y:y, vx:vx, vy:vy, owner:'enemy', w:5, h:10, type:'enemy' });
}

function shootPlayer() {
    var spd = BULLET_SPEED;
    if (weaponType === 'single') {
        fireBullet(player.x, player.y - player.h/2, 0, -spd);
    } else if (weaponType === 'triple') {
        fireBullet(player.x, player.y - player.h/2, 0, -spd);
        fireBullet(player.x - 15, player.y - player.h/4, -55, -spd*0.92);
        fireBullet(player.x + 15, player.y - player.h/4,  55, -spd*0.92);
    } else if (weaponType === 'spread5') {
        for (var i = -2; i <= 2; i++) {
            fireBullet(player.x, player.y - player.h/2, i*50, -spd*0.9, 'spread');
        }
    } else if (weaponType === 'homing') {
        // Homing missile: tracks nearest enemy
        var nearest = null, nd = Infinity;
        enemies.forEach(function(e) {
            var d = Math.hypot(e.x-player.x, e.y-player.y);
            if (d < nd) { nd = d; nearest = e; }
        });
        var vx = 0, vy = -spd;
        if (nearest) { vx = (nearest.x-player.x)/nd*spd*0.6; vy = (nearest.y-player.y)/nd*spd*0.9; }
        bullets.push({ x:player.x, y:player.y-player.h/2, vx:vx, vy:vy, owner:'player', w:8, h:14, type:'homing', target:nearest });
    }
}

// ─── PARTICLES ────────────────────────────────────────────────────────────────
function explode(x, y, color, count, big) {
    for (var i = 0; i < count; i++) {
        var a = rnd(0, Math.PI*2), spd = rnd(big ? 60:40, big ? 240:160);
        particles.push({ x:x, y:y, vx:Math.cos(a)*spd, vy:Math.sin(a)*spd,
            r:rnd(big?3:2, big?7:5), life:rnd(0.3,big?0.9:0.6), maxLife:0.9, color:color });
    }
}
function spawnPowerup(x, y) {
    if (Math.random() > 0.22) return;
    var types = ['triple','spread5','homing','shield','bomb'];
    var t = types[rndInt(0, types.length-1)];
    powerups.push({ x:x, y:y, type:t, vy:55, w:24, h:24, age:0 });
}

// ─── INPUT ────────────────────────────────────────────────────────────────────
var keys = {};
document.addEventListener('keydown', function(e) {
    keys[e.code] = true;
    if (e.code === 'Space') e.preventDefault();
    if (gameState === 'menu'       && (e.code==='Space'||e.code==='Enter')) startGame();
    if (gameState === 'gameover'   && (e.code==='Space'||e.code==='Enter')) startGame();
    if (gameState === 'wave_clear' && (e.code==='Space'||e.code==='Enter')) resumeWave();
    if (gameState === 'playing' && e.code === 'KeyB' && bombCount > 0) useBomb();
    if (gameState === 'playing' && e.code === 'KeyL' && weaponType !== 'laser') startLaser();
});
document.addEventListener('keyup', function(e) { keys[e.code] = false; });

function startGame() {
    score=0; lives=PLAYER_LIVES; wave=1; combo=0;
    bullets=[]; enemies=[]; particles=[]; powerups=[];
    spawnPlayer(); initStars(); startWave(wave);
    gameState = 'playing';
}
function resumeWave() { wave++; startWave(wave); gameState = 'playing'; }

function useBomb() {
    bombCount--;
    triggerShake(12);
    enemies.forEach(function(e) { score += e.points; explode(e.x, e.y, e.color, 14, true); });
    enemies = [];
    bullets = bullets.filter(function(b) { return b.owner !== 'enemy'; });
    combo = 0;
}
function startLaser() {
    laserActive = true; laserTimer = 1.8;
}

// ─── UPDATE ───────────────────────────────────────────────────────────────────
var lastTime = 0;
function update(dt) {
    if (gameState !== 'playing') return;

    // Screen shake
    shake.timer -= dt;
    shake.x = shake.timer > 0 ? (Math.random()-0.5)*shake.intensity*2 : 0;
    shake.y = shake.timer > 0 ? (Math.random()-0.5)*shake.intensity*2 : 0;

    // Combo decay
    if (combo > 0) { comboTimer -= dt; if (comboTimer <= 0) combo = 0; }

    // Scrolling stars
    stars.forEach(function(s) { s.y += s.speed * dt; if (s.y > H) s.y = -s.r; });

    // Weapon timer
    if (weaponTimer > 0) {
        weaponTimer -= dt;
        if (weaponTimer <= 0) weaponType = 'single';
    }
    if (shieldTimer > 0) { shieldTimer -= dt; if (shieldTimer <= 0) playerShield = false; }
    if (laserActive) { laserTimer -= dt; if (laserTimer <= 0) laserActive = false; }

    // Player movement
    if (player) {
        var spd = PLAYER_SPEED;
        if (keys['ArrowLeft']  || keys['KeyA']) player.x -= spd * dt;
        if (keys['ArrowRight'] || keys['KeyD']) player.x += spd * dt;
        if (keys['ArrowUp']    || keys['KeyW']) player.y -= spd * dt;
        if (keys['ArrowDown']  || keys['KeyS']) player.y += spd * dt;
        player.x = Math.max(player.w/2, Math.min(W-player.w/2, player.x));
        player.y = Math.max(player.h/2, Math.min(H-player.h/2, player.y));

        // Shooting
        player.fireTimer -= dt;
        if ((keys['Space'] || keys['KeyZ']) && player.fireTimer <= 0) {
            player.fireTimer = weaponType === 'spread5' ? BASE_FIRE_RATE * 1.5 : BASE_FIRE_RATE;
            shootPlayer();
        }

        // Laser: continuous beam damage
        if (laserActive) {
            enemies.forEach(function(e) {
                if (Math.abs(e.x - player.x) < 20) {
                    e.hp -= 0.15;
                    if (e.hp <= 0) killEnemy(e);
                }
            });
        }
        if (player.invTimer > 0) player.invTimer -= dt;
    }

    // Enemy spawn (normal waves)
    if (waveActive && !bossRef && waveEnemiesLeft > 0) {
        spawnTimer -= dt;
        if (spawnTimer <= 0) {
            spawnEnemy(wave);
            waveEnemiesLeft--;
            spawnTimer = Math.max(0.35, 1.3 - wave*0.08);
        }
    }

    // Enemy movement & shooting
    for (var i = enemies.length - 1; i >= 0; i--) {
        var e = enemies[i];
        e.age += dt;

        if (e.type === 'boss') {
            // Boss phases based on HP percentage
            var hpPct = e.hp / e.maxHp;
            var newPhase = hpPct > 0.66 ? 1 : hpPct > 0.33 ? 2 : 3;
            if (newPhase !== e.phase) {
                e.phase = newPhase;
                triggerShake(10);
                explode(e.x, e.y, '#ff1744', 20, true);
            }
            // Phase 1: side-to-side, aimed shots
            // Phase 2: faster, circular burst
            // Phase 3: enraged, chaotic spread
            var targetX = W/2 + Math.sin(e.age * (e.phase===3?1.8:1.0)) * (W*0.35);
            e.x += (targetX - e.x) * 2.5 * dt;
            if (e.vy > 0 && e.y < 120) e.y += e.vy * dt;

            e.fireTimer -= dt;
            if (e.fireTimer <= 0 && player) {
                e.fireTimer = e.phase === 3 ? 0.35 : e.phase === 2 ? 0.6 : e.fireRate;
                var shotCount = e.phase;
                for (var s = 0; s < shotCount; s++) {
                    var baseAngle = Math.atan2(player.y-e.y, player.x-e.x);
                    var spread = (s - (shotCount-1)/2) * 0.35;
                    var spd2 = 170 + wave * 7;
                    fireEnemyBullet(e.x, e.y+e.h/2,
                        Math.cos(baseAngle+spread)*spd2,
                        Math.sin(baseAngle+spread)*spd2);
                }
                // Phase 3: also fires in a circle
                if (e.phase === 3) {
                    for (var s = 0; s < 8; s++) {
                        var a = (s/8)*Math.PI*2;
                        fireEnemyBullet(e.x, e.y, Math.cos(a)*120, Math.sin(a)*120);
                    }
                }
            }
        } else if (e.type === 'stealth') {
            // Stealth: fast diagonal movement
            e.x += e.vx * dt * 2;
            e.y += e.vy * dt;
            if (e.x < e.w/2 || e.x > W-e.w/2) e.vx *= -1;
        } else {
            // Normal enemies: sinusoidal path
            e.x += (Math.sin(e.age*1.4 + e.sinOffset)*55 + e.vx) * dt;
            e.y += e.vy * dt;
            e.x = Math.max(e.w/2, Math.min(W-e.w/2, e.x));

            if (e.fireRate > 0 && player) {
                e.fireTimer -= dt;
                if (e.fireTimer <= 0) {
                    e.fireTimer = e.fireRate;
                    var dx = player.x-e.x, dy = player.y-e.y;
                    var len = Math.hypot(dx,dy)||1;
                    var spd3 = 190 + wave*8;
                    fireEnemyBullet(e.x, e.y+e.h/2, dx/len*spd3, dy/len*spd3);
                }
            }
        }

        if (e.hp <= 0 || e.y > H + e.h) {
            if (e.y > H + e.h) enemies.splice(i, 1);
        }
    }

    // Bullets
    for (var i = bullets.length - 1; i >= 0; i--) {
        var b = bullets[i];

        // Homing missiles adjust trajectory toward their target
        if (b.type === 'homing' && b.target && !b.target.dead) {
            var dx = b.target.x - b.x, dy = b.target.y - b.y;
            var len = Math.hypot(dx,dy)||1;
            b.vx += dx/len * 600 * dt;
            b.vy += dy/len * 600 * dt;
            var bspd = Math.hypot(b.vx,b.vy);
            if (bspd > BULLET_SPEED) { b.vx = b.vx/bspd*BULLET_SPEED; b.vy = b.vy/bspd*BULLET_SPEED; }
        }

        b.x += b.vx * dt; b.y += b.vy * dt;
        if (b.y < -30 || b.y > H+30 || b.x < -30 || b.x > W+30) { bullets.splice(i,1); continue; }

        if (b.owner === 'player') {
            var hit = false;
            for (var j = enemies.length-1; j >= 0; j--) {
                var e = enemies[j];
                if (aabb(b, e)) {
                    e.hp--;
                    explode(b.x, b.y, '#fff', 3);
                    if (e.hp <= 0) killEnemy(e);
                    hit = true; break;
                }
            }
            if (hit) { bullets.splice(i,1); continue; }
        } else {
            if (player && player.invTimer <= 0 && aabb(b, player)) {
                bullets.splice(i,1);
                hitPlayer();
            }
        }
    }

    // Enemy-player collision
    if (player && player.invTimer <= 0) {
        for (var i = enemies.length-1; i >= 0; i--) {
            if (aabb(player, enemies[i]) && enemies[i].type !== 'boss') {
                killEnemy(enemies[i]); hitPlayer(); break;
            }
        }
    }

    // Power-ups
    for (var i = powerups.length-1; i >= 0; i--) {
        var p = powerups[i];
        p.age += dt; p.y += p.vy * dt;
        if (p.y > H+30) { powerups.splice(i,1); continue; }
        if (player && aabb(p, player)) { applyPowerup(p.type); powerups.splice(i,1); }
    }

    // Particles
    for (var i = particles.length-1; i >= 0; i--) {
        var pt = particles[i];
        pt.x += pt.vx*dt; pt.y += pt.vy*dt; pt.vy += 50*dt;
        pt.life -= dt;
        if (pt.life <= 0) particles.splice(i,1);
    }

    // Wave clear check
    if (waveActive && enemies.length === 0 && waveEnemiesLeft === 0 && !bossRef) {
        waveActive = false;
        waveClearTimer = 2.8;
        score += wave * 300;
        gameState = 'wave_clear';
    }
}

function killEnemy(e) {
    e.hp = -1;
    var idx = enemies.indexOf(e);
    if (idx !== -1) enemies.splice(idx, 1);
    if (bossRef === e) bossRef = null;
    combo++;
    comboTimer = 2.5;
    var mult = Math.min(combo, 10);
    score += e.points * mult;
    explode(e.x, e.y, e.color, e.type === 'boss' ? 30 : 14, e.type === 'boss');
    if (e.type === 'boss') triggerShake(14);
    spawnPowerup(e.x, e.y);
}

function hitPlayer() {
    if (playerShield) {
        playerShield = false; shieldTimer = 0;
        explode(player.x, player.y, '#00e5ff', 12); triggerShake(5);
        player.invTimer = 1.0; return;
    }
    lives--;
    explode(player.x, player.y, '#ff6d00', 22, true);
    triggerShake(10); combo = 0;
    if (lives <= 0) {
        if (score > highScore) { highScore = score; localStorage.setItem('shmup_hs2', highScore); }
        gameState = 'gameover';
    } else {
        player.invTimer = INVINCIBLE_DUR;
    }
}

function applyPowerup(type) {
    if (type === 'triple')  { weaponType = 'triple';  weaponTimer = 12; }
    if (type === 'spread5') { weaponType = 'spread5'; weaponTimer = 10; }
    if (type === 'homing')  { weaponType = 'homing';  weaponTimer = 10; }
    if (type === 'shield')  { playerShield = true; shieldTimer = 15; }
    if (type === 'bomb')    { bombCount = Math.min(bombCount+1, 3); }
}

// ─── DRAW ─────────────────────────────────────────────────────────────────────
function draw() {
    ctx.save();
    ctx.translate(shake.x, shake.y);

    ctx.fillStyle = '#000010';
    ctx.fillRect(0, 0, W, H);

    // Scrolling stars (parallax: faster stars are brighter/bigger)
    stars.forEach(function(s) {
        ctx.globalAlpha = 0.25 + s.r/2.2*0.75;
        ctx.fillStyle = '#fff';
        ctx.beginPath(); ctx.arc(s.x, s.y, s.r, 0, Math.PI*2); ctx.fill();
    });
    ctx.globalAlpha = 1;

    if (gameState === 'menu')      { ctx.restore(); drawMenu();      return; }
    if (gameState === 'gameover')  { ctx.restore(); drawGameOver();  return; }
    if (gameState === 'wave_clear'){ ctx.restore(); drawWaveClear(); return; }

    // Particles
    particles.forEach(function(pt) {
        ctx.globalAlpha = Math.max(0, pt.life/pt.maxLife);
        ctx.fillStyle = pt.color;
        ctx.beginPath(); ctx.arc(pt.x, pt.y, pt.r * Math.max(0, pt.life/pt.maxLife), 0, Math.PI*2); ctx.fill();
    });
    ctx.globalAlpha = 1;

    // Power-ups
    powerups.forEach(function(p) {
        var glow = { triple:'#ffeb3b', spread5:'#ff9800', homing:'#e91e63', shield:'#00e5ff', bomb:'#ff5722' };
        ctx.fillStyle = glow[p.type] || '#fff';
        ctx.shadowColor = ctx.fillStyle; ctx.shadowBlur = 14;
        ctx.fillRect(p.x-p.w/2, p.y-p.h/2, p.w, p.h);
        ctx.shadowBlur = 0;
        ctx.fillStyle = '#000'; ctx.font = 'bold 8px monospace'; ctx.textAlign = 'center';
        var labels = {triple:'3×',spread5:'5×',homing:'⚙',shield:'SH',bomb:'💣'};
        ctx.fillText(labels[p.type]||'?', p.x, p.y+4);
    });

    // Enemies
    enemies.forEach(function(e) {
        var glow = e.type === 'boss' && e.phase >= 2 ? '#ff6d00' : e.color;
        ctx.fillStyle = e.color;
        ctx.shadowColor = glow; ctx.shadowBlur = 12;
        ctx.beginPath();
        if (e.type === 'boss') {
            // Octagon shape for boss
            for (var i = 0; i < 8; i++) {
                var a = i/8*Math.PI*2 - Math.PI/2 + e.age*0.5;
                if (i===0) ctx.moveTo(e.x+Math.cos(a)*e.w/2, e.y+Math.sin(a)*e.h/2);
                else       ctx.lineTo(e.x+Math.cos(a)*e.w/2, e.y+Math.sin(a)*e.h/2);
            }
            ctx.closePath(); ctx.fill();
            // Boss core
            ctx.fillStyle = e.phase===3 ? '#ff6d00' : (e.phase===2 ? '#ffeb3b' : '#fff');
            ctx.beginPath(); ctx.arc(e.x, e.y, 18, 0, Math.PI*2); ctx.fill();
            // HP bar
            ctx.shadowBlur = 0;
            ctx.fillStyle = '#222'; ctx.fillRect(e.x-45, e.y-e.h/2-16, 90, 8);
            var hpPct = e.hp/e.maxHp;
            ctx.fillStyle = hpPct > 0.66 ? '#4caf50' : hpPct > 0.33 ? '#ffb300' : '#f44336';
            ctx.fillRect(e.x-45, e.y-e.h/2-16, 90*hpPct, 8);
            ctx.fillStyle = '#fff'; ctx.font = '9px monospace'; ctx.textAlign = 'center';
            ctx.fillText('BOSS  PHASE '+e.phase, e.x, e.y-e.h/2-19);
        } else if (e.type === 'tank') {
            ctx.rect(e.x-e.w/2, e.y-e.h/2, e.w, e.h); ctx.fill();
            ctx.fillStyle = '#333'; ctx.fillRect(e.x-e.w/2, e.y-e.h/2-5, e.w*(e.hp/e.maxHp), 4);
        } else if (e.type === 'stealth') {
            // Stealth: transparent, hard to see
            ctx.globalAlpha = 0.45 + Math.sin(e.age*4)*0.2;
            ctx.moveTo(e.x, e.y-e.h/2);
            ctx.lineTo(e.x+e.w/2, e.y+e.h/2);
            ctx.lineTo(e.x-e.w/2, e.y+e.h/2);
            ctx.closePath(); ctx.fill();
            ctx.globalAlpha = 1;
        } else {
            // Fighter/drone: downward triangle
            ctx.moveTo(e.x, e.y+e.h/2);
            ctx.lineTo(e.x-e.w/2, e.y-e.h/2);
            ctx.lineTo(e.x+e.w/2, e.y-e.h/2);
            ctx.closePath(); ctx.fill();
        }
        ctx.shadowBlur = 0;
    });

    // Laser beam
    if (laserActive && player) {
        ctx.strokeStyle = '#69f0ae';
        ctx.shadowColor = '#69f0ae'; ctx.shadowBlur = 20;
        ctx.lineWidth = 4 + Math.sin(Date.now()*0.02)*2;
        ctx.beginPath(); ctx.moveTo(player.x, player.y-player.h/2); ctx.lineTo(player.x, 0);
        ctx.stroke(); ctx.shadowBlur = 0;
    }

    // Player bullets
    bullets.forEach(function(b) {
        var colors = { normal:'#00e5ff', spread:'#7cb8f5', homing:'#e91e63', enemy:'#ff1744' };
        ctx.fillStyle = colors[b.type] || (b.owner==='player' ? '#00e5ff' : '#ff1744');
        ctx.shadowColor = ctx.fillStyle; ctx.shadowBlur = 8;
        if (b.type === 'homing') {
            ctx.beginPath(); ctx.arc(b.x, b.y, 5, 0, Math.PI*2); ctx.fill();
        } else {
            ctx.fillRect(b.x-b.w/2, b.y-b.h/2, b.w, b.h);
        }
    });
    ctx.shadowBlur = 0;

    // Player ship
    if (player && (player.invTimer<=0 || Math.floor(player.invTimer/0.1)%2===0)) {
        ctx.save();
        ctx.translate(player.x, player.y);
        ctx.fillStyle = '#e3f2fd';
        ctx.shadowColor = '#64b5f6'; ctx.shadowBlur = 14;
        ctx.beginPath();
        ctx.moveTo(0, -player.h/2); ctx.lineTo(player.w/2, player.h/2);
        ctx.lineTo(0, player.h/4); ctx.lineTo(-player.w/2, player.h/2);
        ctx.closePath(); ctx.fill();
        ctx.fillStyle = '#64b5f6';
        ctx.beginPath(); ctx.arc(0, -player.h/6, 6, 0, Math.PI*2); ctx.fill();
        // Engine glow
        ctx.fillStyle = weaponType!=='single' ? '#ffb300' : '#ff6d00';
        ctx.shadowColor = ctx.fillStyle; ctx.shadowBlur = 10;
        ctx.beginPath(); ctx.arc(0, player.h/2+2, 5+Math.random()*3, 0, Math.PI*2); ctx.fill();
        if (playerShield) {
            ctx.strokeStyle = '#00e5ff'; ctx.lineWidth = 2; ctx.shadowColor = '#00e5ff'; ctx.shadowBlur = 16;
            ctx.globalAlpha = 0.55 + Math.sin(Date.now()*0.006)*0.45;
            ctx.beginPath(); ctx.arc(0, 0, player.w*0.9, 0, Math.PI*2); ctx.stroke();
            ctx.globalAlpha = 1;
        }
        ctx.shadowBlur = 0; ctx.restore();
    }

    // HUD
    ctx.shadowBlur = 0;
    ctx.fillStyle = '#fff'; ctx.font = 'bold 15px monospace'; ctx.textAlign = 'left';
    ctx.fillText('SCORE ' + score, 10, 24);
    ctx.textAlign = 'right';
    ctx.fillText('HI ' + highScore, W-10, 24);
    ctx.textAlign = 'center'; ctx.fillStyle = '#aaa'; ctx.font = '13px monospace';
    ctx.fillText('WAVE ' + wave + (bossRef ? '  [BOSS]' : ''), W/2, 24);
    // Lives
    for (var i = 0; i < lives; i++) {
        ctx.fillStyle = '#e3f2fd'; ctx.shadowColor = '#64b5f6'; ctx.shadowBlur = 6;
        ctx.beginPath();
        ctx.moveTo(12+i*22, H-12); ctx.lineTo(18+i*22, H-26);
        ctx.lineTo(24+i*22, H-12); ctx.closePath(); ctx.fill();
    }
    ctx.shadowBlur = 0;
    // Bombs
    ctx.fillStyle = '#ff5722'; ctx.font = '12px monospace'; ctx.textAlign = 'right';
    ctx.fillText('BOMB × ' + bombCount + '  [B]', W-10, H-10);
    // Active weapon
    if (weaponType !== 'single') {
        var wColors = {triple:'#ffeb3b', spread5:'#ff9800', homing:'#e91e63'};
        ctx.fillStyle = wColors[weaponType] || '#aaa';
        ctx.font = '11px monospace'; ctx.textAlign = 'center';
        ctx.fillText(weaponType.toUpperCase() + ' ' + Math.ceil(weaponTimer) + 's', W/2, H-12);
    }
    // Combo display
    if (combo >= 3) {
        ctx.fillStyle = combo >= 7 ? '#ff6d00' : '#ffeb3b';
        ctx.shadowColor = ctx.fillStyle; ctx.shadowBlur = 14;
        ctx.font = 'bold ' + (14 + Math.min(combo, 8)) + 'px monospace'; ctx.textAlign = 'right';
        ctx.fillText('×' + Math.min(combo,10) + ' COMBO!', W-10, 46);
        ctx.shadowBlur = 0;
    }
    ctx.restore();
}

function drawMenu() {
    ctx.fillStyle = '#000010'; ctx.fillRect(0,0,W,H);
    stars.forEach(function(s){ctx.globalAlpha=0.3+s.r/2.2*0.7;ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(s.x,s.y,s.r,0,Math.PI*2);ctx.fill();});
    ctx.globalAlpha = 1;
    ctx.fillStyle = '#fff'; ctx.font = 'bold 32px monospace'; ctx.textAlign = 'center';
    ctx.shadowColor = '#00e5ff'; ctx.shadowBlur = 20;
    ctx.fillText('STELLAR ASSAULT', W/2, H/2 - 90);
    ctx.shadowBlur = 0;
    ctx.fillStyle = '#ffeb3b'; ctx.font = '14px monospace';
    ctx.fillText('BEST: ' + highScore, W/2, H/2 - 50);
    ctx.fillStyle = '#00e5ff'; ctx.font = '13px monospace';
    ctx.fillText('← → ↑ ↓   :   Move', W/2, H/2 - 10);
    ctx.fillText('SPACE       :   Shoot', W/2, H/2 + 15);
    ctx.fillText('B           :   Bomb (pick up)', W/2, H/2 + 40);
    ctx.fillText('Survive waves · Beat the boss every 5 waves', W/2, H/2 + 70);
    if (Math.floor(Date.now()/500)%2) {
        ctx.fillStyle='#fff'; ctx.font='bold 13px monospace';
        ctx.fillText('PRESS SPACE TO START', W/2, H/2+110);
    }
}
function drawGameOver() {
    ctx.fillStyle='rgba(0,0,0,0.8)'; ctx.fillRect(0,0,W,H);
    ctx.fillStyle='#ff1744'; ctx.font='bold 48px monospace'; ctx.textAlign='center';
    ctx.shadowColor='#ff1744'; ctx.shadowBlur=30; ctx.fillText('GAME OVER',W/2,H/2-60); ctx.shadowBlur=0;
    ctx.fillStyle='#fff'; ctx.font='20px monospace'; ctx.fillText('SCORE: '+score, W/2, H/2);
    ctx.fillStyle='#ffeb3b'; ctx.fillText('BEST: '+highScore, W/2, H/2+34);
    if (Math.floor(Date.now()/500)%2){ctx.fillStyle='#aaa';ctx.font='13px monospace';ctx.fillText('PRESS SPACE TO RETRY',W/2,H/2+80);}
}
function drawWaveClear() {
    ctx.fillStyle='rgba(0,0,0,0.72)'; ctx.fillRect(0,0,W,H);
    ctx.fillStyle='#4caf50'; ctx.font='bold 34px monospace'; ctx.textAlign='center';
    ctx.shadowColor='#4caf50'; ctx.shadowBlur=18; ctx.fillText('WAVE ' + wave + ' CLEARED!', W/2, H/2-30); ctx.shadowBlur=0;
    ctx.fillStyle='#ffeb3b'; ctx.font='15px monospace'; ctx.fillText('+' + (wave*300) + ' BONUS', W/2, H/2+10);
    ctx.fillStyle='#fff'; ctx.font='13px monospace'; ctx.fillText('SCORE: '+score, W/2, H/2+40);
    if (Math.floor(Date.now()/500)%2){ctx.fillStyle='#aaa'; ctx.fillText('SPACE to continue', W/2, H/2+75);}
}

// ─── GAME LOOP ────────────────────────────────────────────────────────────────
function gameLoop(ts) {
    var dt = Math.min((ts - lastTime)/1000, 0.05);
    lastTime = ts;
    update(dt);
    draw();
    requestAnimationFrame(gameLoop);
}
document.addEventListener('DOMContentLoaded', function() {
    initStars();
    requestAnimationFrame(function(ts){ lastTime=ts; requestAnimationFrame(gameLoop); });
});
</script>
</body>
</html>
