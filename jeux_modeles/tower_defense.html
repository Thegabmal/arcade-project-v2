<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Neon Defense</title>
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    body { background:#050510; display:flex; flex-direction:column; align-items:center; justify-content:center; height:100vh; overflow:hidden; font-family:'Courier New', monospace; }
    canvas { display:block; box-shadow:0 0 50px rgba(0,120,255,0.2); }
    #ui { color:#888; font-size:11px; margin-top:6px; letter-spacing:1px; }
  </style>
</head>
<body>
<canvas id="c"></canvas>
<div id="ui">Left-click grid = place selected tower &nbsp;|&nbsp; Right-click tower = upgrade/sell &nbsp;|&nbsp; SPACE = start wave</div>
<script>
'use strict';

const canvas = document.getElementById('c');
const ctx    = canvas.getContext('2d');
const COLS = 20, ROWS = 14;
const CS   = 36;  // cell size
const W = COLS * CS;          // 720
const H = ROWS * CS + 80;     // 584
canvas.width = W; canvas.height = H;

const GRID_H = ROWS * CS;     // 504  (grid area)
const PANEL_Y = GRID_H;       // 504  (bottom panel top)

// ─── Audio ─────────────────────────────────────────────────────────────────────
const AC = new (window.AudioContext || window.webkitAudioContext)();
function tone(f, type, dur, vol, delay=0) {
  const o = AC.createOscillator(), g = AC.createGain();
  o.connect(g); g.connect(AC.destination);
  o.type = type; o.frequency.setValueAtTime(f, AC.currentTime + delay);
  g.gain.setValueAtTime(0.001, AC.currentTime + delay);
  g.gain.linearRampToValueAtTime(vol, AC.currentTime + delay + 0.01);
  g.gain.exponentialRampToValueAtTime(0.001, AC.currentTime + delay + dur);
  o.start(AC.currentTime + delay); o.stop(AC.currentTime + delay + dur + 0.01);
}
function sfxPlace()  { tone(300,'square',0.08,0.2); tone(420,'square',0.06,0.18,0.06); }
function sfxShoot()  { tone(600,'triangle',0.04,0.12); }
function sfxCannon() { tone(160,'sawtooth',0.08,0.25); tone(120,'sawtooth',0.06,0.2,0.05); }
function sfxIce()    { tone(900,'sine',0.06,0.15); tone(1100,'sine',0.05,0.1,0.04); }
function sfxLightning() { [800,600,400].forEach((f,i)=>tone(f,'square',0.06,0.2,i*0.03)); }
function sfxDie()    { tone(200,'sawtooth',0.12,0.3); tone(150,'sawtooth',0.1,0.25,0.08); }
function sfxWave()   { [300,400,500,600,800].forEach((f,i)=>tone(f,'square',0.08,0.22,i*0.05)); }
function sfxSell()   { tone(440,'triangle',0.1,0.2); tone(330,'triangle',0.08,0.15,0.07); }
function sfxLeak()   { [300,250,200,150].forEach((f,i)=>tone(f,'sawtooth',0.1,0.3,i*0.06)); }

// ─── Path (hand-designed, column+row waypoints) ────────────────────────────────
// Path goes left→right using a winding route
const WAYPOINTS = [
  {c:0,r:2}, {c:4,r:2}, {c:4,r:6}, {c:8,r:6},
  {c:8,r:2}, {c:12,r:2}, {c:12,r:10}, {c:16,r:10},
  {c:16,r:5}, {c:19,r:5}
];

// Convert waypoints to pixel centers
const PATH_PX = WAYPOINTS.map(wp => ({ x: wp.c * CS + CS/2, y: wp.r * CS + CS/2 }));

// Mark path cells (cannot place towers here)
const pathCells = new Set();
function markPath() {
  for (let i = 0; i < WAYPOINTS.length - 1; i++) {
    const a = WAYPOINTS[i], b = WAYPOINTS[i+1];
    const dc = Math.sign(b.c - a.c), dr = Math.sign(b.r - a.r);
    let c = a.c, r = a.r;
    while (c !== b.c || r !== b.r) {
      pathCells.add(`${c},${r}`);
      c += dc; r += dr;
    }
    pathCells.add(`${b.c},${b.r}`);
  }
}
markPath();

// ─── Tower Definitions ─────────────────────────────────────────────────────────
const TOWER_TYPES = ['arrow', 'cannon', 'ice', 'lightning'];
const TOWER_DEFS = {
  arrow:     { name:'Arrow',     col:'#44AAFF', cost:50,  dmg:12,  range:3.0, rate:1.2,  aoe:0,    slow:0,    chain:0, upgCost:60,  upgDmg:18,  upgRange:3.5, upgRate:1.8  },
  cannon:    { name:'Cannon',    col:'#FF8844', cost:100, dmg:35,  range:2.5, rate:0.55, aoe:1.2,  slow:0,    chain:0, upgCost:100, upgDmg:55,  upgRange:3.0, upgRate:0.7  },
  ice:       { name:'Ice',       col:'#80EEFF', cost:80,  dmg:8,   range:2.8, rate:0.9,  aoe:0,    slow:0.55, chain:0, upgCost:80,  upgDmg:14,  upgRange:3.2, upgRate:1.1  },
  lightning: { name:'Lightning', col:'#FFEE44', cost:130, dmg:28,  range:3.2, rate:0.6,  aoe:0,    slow:0,    chain:3, upgCost:120, upgDmg:44,  upgRange:3.8, upgRate:0.8  },
};

// ─── Enemy Definitions ─────────────────────────────────────────────────────────
// hp, speed (cells/s), reward, col
const ENEMY_TYPES = {
  grunt:  { hp:80,  spd:2.2, reward:8,  col:'#88FF88', r:7,  pts:10 },
  fast:   { hp:45,  spd:4.0, reward:6,  col:'#FFAA44', r:5,  pts:8  },
  tank:   { hp:380, spd:0.9, reward:20, col:'#FF6666', r:11, pts:30 },
  flyer:  { hp:90,  spd:2.8, reward:12, col:'#FF88FF', r:7,  pts:15 },  // ignores ground path
  boss:   { hp:1500,spd:0.7, reward:80, col:'#FF2222', r:15, pts:100},
};

// ─── Wave Definitions ──────────────────────────────────────────────────────────
// Each wave: array of [type, count, interval]
const WAVES = [
  [[{t:'grunt',n:8,iv:1.2}]],
  [[{t:'grunt',n:10,iv:1.0},{t:'fast',n:4,iv:1.5}]],
  [[{t:'grunt',n:12,iv:0.9},{t:'tank',n:2,iv:3}]],
  [[{t:'fast',n:12,iv:0.7},{t:'flyer',n:5,iv:1.2}]],
  [[{t:'grunt',n:15,iv:0.8},{t:'tank',n:3,iv:2.5},{t:'boss',n:1,iv:0}]],
  [[{t:'fast',n:16,iv:0.65},{t:'flyer',n:8,iv:0.9}]],
  [[{t:'tank',n:5,iv:2},{t:'grunt',n:20,iv:0.6}]],
  [[{t:'flyer',n:12,iv:0.7},{t:'fast',n:14,iv:0.7}]],
  [[{t:'tank',n:6,iv:1.8},{t:'flyer',n:10,iv:0.8},{t:'fast',n:8,iv:0.8}]],
  [[{t:'grunt',n:20,iv:0.4},{t:'tank',n:5,iv:1.5},{t:'boss',n:2,iv:5},{t:'flyer',n:10,iv:0.6}]],
];

// ─── Game State ─────────────────────────────────────────────────────────────────
let gold   = 120;
let lives  = 20;
let score  = 0;
let wave   = 0;
let waveActive = false;
let waveTimer  = 0;
let spawnQueue = [];  // [{t, delay}] remaining to spawn
let spawnTimer = 0;
let state = 'menu';   // menu | idle | waving | gameover | victory

const towers   = [];   // { col, row, type, level, cooldown, angle, shootAnim }
const enemies  = [];   // { type, px, py, pathIdx, pathFrac, hp, maxHp, slow, slowTimer, dead, reward }
const bullets  = [];   // { x, y, vx, vy, dmg, aoe, slow, chain, col, r }
const particles= [];

let selectedType = 'arrow';
let tooltip = null;    // { col, row } for right-click tower info

// ─── Helpers ───────────────────────────────────────────────────────────────────
function rnd(a,b)  { return a + Math.random()*(b-a); }
function dist(ax,ay,bx,by){ return Math.sqrt((ax-bx)**2+(ay-by)**2); }
function cellCenter(c,r) { return { x:c*CS+CS/2, y:r*CS+CS/2 }; }

// ─── Spawn Enemy ───────────────────────────────────────────────────────────────
function spawnEnemy(type) {
  const def = ENEMY_TYPES[type];
  const isFlyer = type === 'flyer';
  const startPx = isFlyer
    ? { x:-CS, y: rnd(0, GRID_H) }
    : { x: PATH_PX[0].x - CS, y: PATH_PX[0].y };

  enemies.push({
    type, px:startPx.x, py:startPx.y,
    pathIdx:0, pathFrac:0,
    hp:def.hp, maxHp:def.hp,
    slow:0, slowTimer:0,
    dead:false,
    reward:def.reward,
    isFlyer
  });
}

// ─── Move Enemy Along Path ────────────────────────────────────────────────────
function moveEnemy(e, dt) {
  const def = ENEMY_TYPES[e.type];
  const spd = def.spd * CS * (e.slowTimer > 0 ? (e.slow) : 1);
  e.slowTimer = Math.max(0, e.slowTimer - dt);

  if (e.isFlyer) {
    // Fly straight right
    e.px += spd * dt;
    if (e.px > W + CS) return true; // leaked
    return false;
  }

  const next = PATH_PX[e.pathIdx + 1];
  if (!next) return true; // reached end → leak

  const dx = next.x - e.px, dy = next.y - e.py;
  const d  = Math.sqrt(dx*dx+dy*dy);
  const step = spd * dt;

  if (step >= d) {
    e.px = next.x; e.py = next.y;
    e.pathIdx++;
    if (e.pathIdx >= PATH_PX.length - 1) return true; // leaked
  } else {
    e.px += (dx/d)*step; e.py += (dy/d)*step;
  }
  return false;
}

// ─── Tower shoot ───────────────────────────────────────────────────────────────
function towerShoot(tower, dt) {
  const def = TOWER_DEFS[tower.type];
  const lvlMult = tower.level === 1 ? 1 : 1.0;
  const dmg   = tower.level === 1 ? def.dmg : def.upgDmg;
  const range = (tower.level === 1 ? def.range : def.upgRange) * CS;
  const rate  = tower.level === 1 ? def.rate : def.upgRate;

  tower.cooldown -= dt;
  if (tower.cooldown > 0) return;

  const tc = cellCenter(tower.col, tower.row);

  // Find closest enemy in range
  let target = null, closest = Infinity;
  enemies.forEach(e => {
    if (e.dead) return;
    const d = dist(tc.x, tc.y, e.px, e.py);
    if (d < range && d < closest) { closest = d; target = e; }
  });

  if (!target) return;

  tower.cooldown = 1 / rate;
  tower.angle = Math.atan2(target.py - tc.y, target.px - tc.x);
  tower.shootAnim = 0.2;

  const dx = target.px - tc.x, dy = target.py - tc.y;
  const d  = Math.sqrt(dx*dx+dy*dy);
  const spd = 500;

  if (tower.type === 'arrow') {
    sfxShoot();
    bullets.push({ x:tc.x, y:tc.y, vx:(dx/d)*spd, vy:(dy/d)*spd, dmg, aoe:0, slow:0, chain:0, col:def.col, r:4 });
  }
  else if (tower.type === 'cannon') {
    sfxCannon();
    bullets.push({ x:tc.x, y:tc.y, vx:(dx/d)*320, vy:(dy/d)*320, dmg, aoe:range*0.45, slow:0, chain:0, col:def.col, r:7 });
  }
  else if (tower.type === 'ice') {
    sfxIce();
    const slowVal = tower.level === 2 ? 0.3 : def.slow;
    bullets.push({ x:tc.x, y:tc.y, vx:(dx/d)*420, vy:(dy/d)*420, dmg, aoe:0, slow:slowVal, slowDur:1.8, chain:0, col:def.col, r:5 });
  }
  else if (tower.type === 'lightning') {
    sfxLightning();
    // Instant chain hit
    const chain = tower.level === 2 ? 5 : def.chain;
    let hit = [target]; let remaining = [...enemies].filter(e=>!e.dead && e!==target);
    for (let i=0; i<chain-1 && remaining.length>0; i++) {
      const last = hit[hit.length-1];
      remaining.sort((a,b) => dist(last.px,last.py,a.px,a.py)-dist(last.px,last.py,b.px,b.py));
      const next = remaining[0];
      if (dist(last.px,last.py,next.px,next.py) < range * 1.2) {
        hit.push(next); remaining.splice(0,1);
      } else break;
    }
    hit.forEach((e,i) => {
      const d2 = dmg * Math.pow(0.7, i);
      damageEnemy(e, d2);
      spawnBolt(tc.x, tc.y, e.px, e.py);
    });
    return;
  }

  // Ice+Cannon synergy: splash slows
  if (tower.type === 'cannon') {
    const hasNearIce = towers.some(t => t.type === 'ice' && Math.abs(t.col-tower.col)<=2 && Math.abs(t.row-tower.row)<=2);
    if (hasNearIce) bullets[bullets.length-1].synergyIce = true;
  }
}

function damageEnemy(e, dmg) {
  e.hp -= dmg;
  if (e.hp <= 0 && !e.dead) {
    e.dead = true;
    gold += e.reward;
    score += ENEMY_TYPES[e.type].pts;
    sfxDie();
    spawnDeathParticles(e.px, e.py, ENEMY_TYPES[e.type].col);
  }
}

// ─── Particles ─────────────────────────────────────────────────────────────────
function spawnDeathParticles(x, y, col) {
  for (let i=0;i<8;i++) {
    const a=Math.random()*Math.PI*2, s=60+Math.random()*140;
    particles.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:0.5,max:0.5,r:3+Math.random()*3,col});
  }
}
function spawnBolt(x1,y1,x2,y2) {
  particles.push({type:'bolt',x1,y1,x2,y2,life:0.12,max:0.12});
}
function spawnAoe(x,y,r,col) {
  particles.push({type:'aoe',x,y,r,maxR:r,life:0.3,max:0.3,col});
}

// ─── Bullet Hit ────────────────────────────────────────────────────────────────
function bulletHit(b) {
  if (b.aoe > 0) {
    spawnAoe(b.x, b.y, b.aoe, b.col);
    enemies.forEach(e => {
      if (e.dead) return;
      if (dist(b.x,b.y,e.px,e.py) < b.aoe) {
        damageEnemy(e, b.dmg * (b.synergyIce ? 1.5 : 1));
        if (b.synergyIce) { e.slow=0.4; e.slowTimer=1.5; }
      }
    });
  } else {
    enemies.forEach(e => {
      if (e.dead) return;
      if (dist(b.x,b.y,e.px,e.py) < ENEMY_TYPES[e.type].r + b.r) {
        damageEnemy(e, b.dmg);
        if (b.slow > 0) { e.slow = b.slow; e.slowTimer = b.slowDur; }
      }
    });
  }
}

// ─── Build Wave Queue ──────────────────────────────────────────────────────────
function buildSpawnQueue(waveIdx) {
  spawnQueue = [];
  const groups = WAVES[Math.min(waveIdx, WAVES.length-1)][0];
  let t = 0;
  groups.forEach(g => {
    for (let i=0;i<g.n;i++) {
      spawnQueue.push({ t, type:g.t });
      t += g.iv;
    }
  });
  spawnQueue.sort((a,b)=>a.t-b.t);
  // Normalize to relative delays
  for (let i=spawnQueue.length-1;i>0;i--) spawnQueue[i].delay = spawnQueue[i].t - spawnQueue[i-1].t;
  spawnQueue[0].delay = 0;
}

// ─── Input ─────────────────────────────────────────────────────────────────────
let mx = 0, my = 0;
canvas.addEventListener('mousemove', e => {
  const r=canvas.getBoundingClientRect();
  mx=e.clientX-r.left; my=e.clientY-r.top;
  AC.resume();
});
canvas.addEventListener('click', e => {
  AC.resume();
  if (state==='menu') { state='idle'; return; }
  if (state==='gameover'||state==='victory') { restartGame(); return; }

  const gc = Math.floor(mx/CS), gr = Math.floor(my/CS);
  if (my < GRID_H && gc >= 0 && gc < COLS && gr >= 0 && gr < ROWS) {
    if (!pathCells.has(`${gc},${gr}`)) {
      const existing = towers.find(t=>t.col===gc&&t.row===gr);
      if (!existing) placeTower(gc, gr);
    }
  }
  tooltip = null;
});
canvas.addEventListener('contextmenu', e => {
  e.preventDefault();
  AC.resume();
  const gc=Math.floor(mx/CS), gr=Math.floor(my/CS);
  const t=towers.find(t=>t.col===gc&&t.row===gr);
  if (t) tooltip = { col:gc, row:gr, tower:t };
  else tooltip=null;
});
window.addEventListener('keydown', e => {
  AC.resume();
  if (e.code==='Space' && state==='idle') { e.preventDefault(); startWave(); }
  if (e.code==='Digit1') selectedType='arrow';
  if (e.code==='Digit2') selectedType='cannon';
  if (e.code==='Digit3') selectedType='ice';
  if (e.code==='Digit4') selectedType='lightning';
  if (e.code==='KeyU' && tooltip) upgradeTower();
  if (e.code==='KeyS' && tooltip) sellTower();
});

// ─── Tooltip Buttons ───────────────────────────────────────────────────────────
canvas.addEventListener('click', e => {
  if (!tooltip) return;
  const r = canvas.getBoundingClientRect();
  const lx=e.clientX-r.left, ly=e.clientY-r.top;
  // Upgrade button zone: tx+BW/2-55..tx+BW/2+10, ty+90..ty+110
  const tc = cellCenter(tooltip.col, tooltip.row);
  if (lx>tc.x-60 && lx<tc.x-5 && ly>PANEL_Y+20 && ly<PANEL_Y+40) upgradeTower();
  if (lx>tc.x+5  && lx<tc.x+60 && ly>PANEL_Y+20 && ly<PANEL_Y+40) sellTower();
});

function placeTower(c, r) {
  const def = TOWER_DEFS[selectedType];
  if (gold < def.cost) return;
  gold -= def.cost;
  sfxPlace();
  towers.push({ col:c, row:r, type:selectedType, level:1, cooldown:0, angle:0, shootAnim:0 });
}

function upgradeTower() {
  if (!tooltip) return;
  const t = towers.find(t=>t.col===tooltip.col&&t.row===tooltip.row);
  if (!t || t.level===2) return;
  const upgCost = TOWER_DEFS[t.type].upgCost;
  if (gold < upgCost) return;
  gold -= upgCost;
  t.level = 2;
  sfxPlace();
  tooltip = null;
}

function sellTower() {
  if (!tooltip) return;
  const idx = towers.findIndex(t=>t.col===tooltip.col&&t.row===tooltip.row);
  if (idx<0) return;
  const t = towers[idx];
  const sellVal = Math.floor(TOWER_DEFS[t.type].cost * 0.6 + (t.level===2?TOWER_DEFS[t.type].upgCost*0.6:0));
  gold += sellVal;
  towers.splice(idx,1);
  sfxSell();
  tooltip=null;
}

function startWave() {
  if (waveActive) return;
  sfxWave();
  buildSpawnQueue(wave);
  waveActive=true; spawnTimer=0;
}

function restartGame() {
  gold=120; lives=20; score=0; wave=0;
  waveActive=false; spawnQueue=[]; spawnTimer=0;
  towers.length=0; enemies.length=0; bullets.length=0; particles.length=0;
  state='idle';
}

// ─── Update ────────────────────────────────────────────────────────────────────
let lastTs=0;
function update(ts) {
  const dt = Math.min((ts-lastTs)/1000, 0.05);
  lastTs=ts;

  if (state==='menu'||state==='gameover'||state==='victory') {
    requestAnimationFrame(ts2=>{ draw(ts2/1000); update(ts2); });
    return;
  }

  // Spawn wave enemies
  if (waveActive && spawnQueue.length > 0) {
    spawnTimer -= dt;
    if (spawnTimer <= 0) {
      const e = spawnQueue.shift();
      spawnEnemy(e.type);
      spawnTimer = spawnQueue.length > 0 ? spawnQueue[0].delay : 0;
    }
  }

  // Move enemies
  enemies.forEach(e => {
    if (e.dead) return;
    const leaked = moveEnemy(e, dt);
    if (leaked) {
      e.dead = true; lives--;
      sfxLeak();
      if (lives <= 0) { lives=0; state='gameover'; }
    }
  });

  // Remove dead
  for (let i=enemies.length-1;i>=0;i--) if (enemies[i].dead) enemies.splice(i,1);

  // Towers shoot
  towers.forEach(t => {
    towerShoot(t, dt);
    if (t.shootAnim > 0) t.shootAnim -= dt * 4;
  });

  // Bullets move
  for (let i=bullets.length-1;i>=0;i--) {
    const b=bullets[i];
    b.x+=b.vx*dt; b.y+=b.vy*dt;
    if (b.x<-20||b.x>W+20||b.y<-20||b.y>GRID_H+20) { bullets.splice(i,1); continue; }
    // Hit detection
    let hit=false;
    if (b.aoe>0) {
      // AoE — hit if reaches any enemy
      for (const e of enemies) {
        if (e.dead) continue;
        if (dist(b.x,b.y,e.px,e.py)<b.r+ENEMY_TYPES[e.type].r) { bulletHit(b); hit=true; break; }
      }
    } else {
      for (const e of enemies) {
        if (e.dead) continue;
        if (dist(b.x,b.y,e.px,e.py)<b.r+ENEMY_TYPES[e.type].r) {
          damageEnemy(e,b.dmg);
          if (b.slow>0){ e.slow=b.slow; e.slowTimer=b.slowDur; }
          hit=true; break;
        }
      }
    }
    if (hit) bullets.splice(i,1);
  }

  // Particles
  for (let i=particles.length-1;i>=0;i--) {
    const p=particles[i];
    if (p.type!=='bolt'&&p.type!=='aoe') { p.x+=p.vx*dt; p.y+=p.vy*dt; p.vy+=80*dt; }
    p.life-=dt;
    if (p.life<=0) particles.splice(i,1);
  }

  // Check wave complete
  if (waveActive && spawnQueue.length===0 && enemies.length===0) {
    waveActive=false;
    wave++;
    // Interest: +5% of unspent gold
    gold += Math.floor(gold * 0.05);
    if (wave >= WAVES.length) state='victory';
  }

  requestAnimationFrame(ts2=>{ draw(ts2/1000); update(ts2); });
}

// ─── Draw ──────────────────────────────────────────────────────────────────────
function drawGrid(t) {
  const hc = Math.floor(mx/CS), hr = Math.floor(my/CS);

  for (let r=0;r<ROWS;r++) for (let c=0;c<COLS;c++) {
    const isPath = pathCells.has(`${c},${r}`);
    const hasTower = towers.some(t=>t.col===c&&t.row===r);
    const isHover = c===hc && r===hr && my<GRID_H;

    let bg = isPath ? '#12102a' : '#0d0c22';
    if (isHover && !isPath && !hasTower) bg='#1e1c40';
    ctx.fillStyle=bg; ctx.fillRect(c*CS,r*CS,CS,CS);
    ctx.strokeStyle='#1a1840'; ctx.lineWidth=0.5;
    ctx.strokeRect(c*CS,r*CS,CS,CS);

    // Path direction arrows
    if (isPath) {
      ctx.fillStyle='rgba(60,50,120,0.5)';
      ctx.fillRect(c*CS+1,r*CS+1,CS-2,CS-2);
    }
  }

  // Draw path arrows
  for (let i=0;i<PATH_PX.length-1;i++) {
    const a=PATH_PX[i], b=PATH_PX[i+1];
    const dx=b.x-a.x, dy=b.y-a.y, len=Math.sqrt(dx*dx+dy*dy);
    const nx=dx/len, ny=dy/len;
    ctx.strokeStyle='rgba(80,70,160,0.35)'; ctx.lineWidth=CS*0.35;
    ctx.lineCap='round';
    ctx.beginPath(); ctx.moveTo(a.x,a.y); ctx.lineTo(b.x,b.y); ctx.stroke();
  }

  // Start/end markers
  ctx.fillStyle='rgba(0,255,100,0.6)'; ctx.font='bold 11px Courier New'; ctx.textAlign='center';
  ctx.fillText('IN',  PATH_PX[0].x,  PATH_PX[0].y+4);
  ctx.fillStyle='rgba(255,80,80,0.7)';
  ctx.fillText('OUT', PATH_PX[PATH_PX.length-1].x, PATH_PX[PATH_PX.length-1].y+4);
}

function drawTowers(t) {
  towers.forEach(tower => {
    const def = TOWER_DEFS[tower.type];
    const {x,y} = cellCenter(tower.col, tower.row);
    const anim = tower.shootAnim;
    const lvl2 = tower.level === 2;

    ctx.save();
    ctx.translate(x, y);

    // Range ring on hover
    const hc=Math.floor(mx/CS), hr=Math.floor(my/CS);
    if (hc===tower.col && hr===tower.row) {
      const range=(lvl2?TOWER_DEFS[tower.type].upgRange:TOWER_DEFS[tower.type].range)*CS;
      ctx.strokeStyle=def.col+'55'; ctx.lineWidth=1.5;
      ctx.setLineDash([3,3]); ctx.beginPath(); ctx.arc(0,0,range,0,Math.PI*2); ctx.stroke();
      ctx.setLineDash([]);
    }

    // Base plate
    ctx.fillStyle = lvl2 ? '#2a2a60' : '#1a1a40';
    ctx.strokeStyle = def.col; ctx.lineWidth = lvl2 ? 2.5 : 1.5;
    ctx.shadowColor = def.col; ctx.shadowBlur = lvl2 ? 18 : 8;
    ctx.beginPath(); ctx.arc(0,0,CS*0.4,0,Math.PI*2); ctx.fill(); ctx.stroke();
    ctx.shadowBlur=0;

    // Gun barrel (rotates toward last target)
    ctx.rotate(tower.angle);
    const recoil = anim * 5;
    ctx.fillStyle = def.col;
    if (tower.type==='arrow') {
      ctx.fillRect(-2, -CS*0.35+recoil, 4, CS*0.45-recoil);
    } else if (tower.type==='cannon') {
      ctx.fillRect(-4, -CS*0.38+recoil, 8, CS*0.42-recoil);
      if (lvl2) { ctx.fillRect(-3, -CS*0.38+recoil, 6, CS*0.42-recoil); } // double barrel effect
    } else if (tower.type==='ice') {
      ctx.fillStyle='#80EEFF';
      for (let i=0;i<3;i++) {
        const a=i/3*Math.PI*2; ctx.fillRect(Math.cos(a)*5-1,-CS*0.35+recoil,2,CS*0.35);
      }
    } else { // lightning
      ctx.fillStyle='#FFEE44';
      ctx.beginPath(); ctx.moveTo(0,-CS*0.38+recoil); ctx.lineTo(4,0); ctx.lineTo(-4,0); ctx.closePath(); ctx.fill();
    }

    // Level 2 star indicator
    if (lvl2) {
      ctx.rotate(-tower.angle);
      ctx.fillStyle='#FFD700'; ctx.font='8px sans-serif'; ctx.textAlign='center';
      ctx.fillText('★',-CS*0.35,-CS*0.35);
    }

    ctx.restore();
  });
}

function drawEnemies(t) {
  enemies.forEach(e => {
    const def=ENEMY_TYPES[e.type];
    const isSlow=e.slowTimer>0;

    ctx.save();
    ctx.translate(e.px, e.py);

    // Shadow
    ctx.fillStyle='rgba(0,0,0,0.3)';
    ctx.beginPath(); ctx.ellipse(0,def.r+2,def.r*0.8,3,0,0,Math.PI*2); ctx.fill();

    // Body
    const col = isSlow ? '#80EEFF' : def.col;
    ctx.shadowColor=col; ctx.shadowBlur=10;
    ctx.fillStyle=col;

    if (e.type==='boss') {
      // Crown shape
      ctx.beginPath(); ctx.arc(0,0,def.r,0,Math.PI*2); ctx.fill();
      ctx.fillStyle='#FFD700';
      for (let i=0;i<5;i++) {
        const a=-Math.PI/2+i/5*Math.PI*2;
        ctx.beginPath(); ctx.arc(Math.cos(a)*def.r*0.7,Math.sin(a)*def.r*0.7,3,0,Math.PI*2); ctx.fill();
      }
    } else if (e.type==='tank') {
      ctx.fillRect(-def.r,-def.r,def.r*2,def.r*2);
      ctx.fillStyle='rgba(0,0,0,0.3)'; ctx.fillRect(-def.r+2,-def.r+2,def.r*2-4,def.r-2);
    } else if (e.type==='flyer') {
      // Diamond
      ctx.beginPath(); ctx.moveTo(0,-def.r); ctx.lineTo(def.r,0); ctx.lineTo(0,def.r); ctx.lineTo(-def.r,0); ctx.closePath(); ctx.fill();
    } else {
      ctx.beginPath(); ctx.arc(0,0,def.r,0,Math.PI*2); ctx.fill();
    }
    ctx.shadowBlur=0;

    // HP bar
    const barW=def.r*2.2, frac=e.hp/e.maxHp;
    ctx.fillStyle='#333'; ctx.fillRect(-barW/2,-def.r-7,barW,4);
    ctx.fillStyle=frac>0.5?'#44FF88':frac>0.25?'#FFAA44':'#FF4444';
    ctx.fillRect(-barW/2,-def.r-7,barW*frac,4);

    ctx.restore();
  });
}

function drawBullets() {
  bullets.forEach(b => {
    ctx.save();
    ctx.shadowColor=b.col; ctx.shadowBlur=10;
    ctx.fillStyle=b.col;
    ctx.beginPath(); ctx.arc(b.x,b.y,b.r,0,Math.PI*2); ctx.fill();
    ctx.restore();
  });
}

function drawParticles() {
  particles.forEach(p => {
    const alpha=p.life/p.max;
    ctx.save(); ctx.globalAlpha=alpha;
    if (p.type==='bolt') {
      ctx.strokeStyle='#FFEE88'; ctx.lineWidth=2; ctx.shadowColor='#FFEE44'; ctx.shadowBlur=8;
      ctx.beginPath(); ctx.moveTo(p.x1,p.y1); ctx.lineTo(p.x2,p.y2); ctx.stroke();
    } else if (p.type==='aoe') {
      const progress=1-p.life/p.max;
      ctx.strokeStyle=p.col; ctx.lineWidth=2; ctx.shadowColor=p.col; ctx.shadowBlur=8;
      ctx.beginPath(); ctx.arc(p.x,p.y,p.r*progress+10,0,Math.PI*2); ctx.stroke();
    } else {
      ctx.fillStyle=p.col;
      ctx.beginPath(); ctx.arc(p.x,p.y,p.r,0,Math.PI*2); ctx.fill();
    }
    ctx.restore();
  });
}

function drawPanel(t) {
  // Panel background
  ctx.fillStyle='#0a0920'; ctx.fillRect(0,PANEL_Y,W,80);
  ctx.strokeStyle='#2a2060'; ctx.lineWidth=1; ctx.strokeRect(0,PANEL_Y,W,80);

  // Tower selector
  const types=TOWER_TYPES;
  types.forEach((type,i) => {
    const def=TOWER_DEFS[type];
    const tx=20+i*165;
    const isSelected=selectedType===type;
    const canAfford=gold>=def.cost;

    ctx.fillStyle=isSelected?'#1e1c50':'#0e0c2a';
    ctx.strokeStyle=isSelected?def.col:canAfford?'#3a3870':'#1a1840';
    ctx.lineWidth=isSelected?2:1;
    ctx.beginPath(); ctx.roundRect(tx,PANEL_Y+6,160,68,4); ctx.fill(); ctx.stroke();

    ctx.fillStyle=canAfford?def.col:'#555';
    ctx.font=`bold 12px Courier New`; ctx.textAlign='left';
    ctx.fillText(`[${i+1}] ${def.name}`, tx+8, PANEL_Y+22);

    ctx.fillStyle='#FFD700'; ctx.font='11px Courier New';
    ctx.fillText(`Cost:${def.cost}  Upg:${def.upgCost}`, tx+8, PANEL_Y+37);

    ctx.fillStyle='#888'; ctx.font='10px Courier New';
    ctx.fillText(`DMG:${def.dmg} RNG:${def.range} SPD:${def.rate}`, tx+8, PANEL_Y+52);
    ctx.fillText(isSelected?'▶ SELECTED':'click to select', tx+8, PANEL_Y+67);
  });

  // Stats (right side)
  ctx.textAlign='right';
  ctx.fillStyle='#FFD700'; ctx.font='bold 14px Courier New';
  ctx.fillText(`Gold: ${gold}`, W-10, PANEL_Y+22);
  ctx.fillStyle='#FF6666';
  ctx.fillText(`Lives: ${lives}`, W-10, PANEL_Y+40);
  ctx.fillStyle='#aaddff';
  ctx.fillText(`Wave: ${wave+1}/${WAVES.length}`, W-10, PANEL_Y+58);
  ctx.fillStyle='#888';
  ctx.fillText(`Score: ${score}`, W-10, PANEL_Y+74);

  // Wave button
  if (!waveActive) {
    const pulse=0.7+Math.sin(t*3)*0.3;
    ctx.globalAlpha=pulse;
    ctx.fillStyle='#44FF88'; ctx.font='bold 12px Courier New'; ctx.textAlign='center';
    ctx.fillText('SPACE = START WAVE', W/2+100, PANEL_Y+74);
    ctx.globalAlpha=1;
  } else {
    ctx.fillStyle='#FF8844'; ctx.font='12px Courier New'; ctx.textAlign='center';
    ctx.fillText(`WAVE ${wave+1} — ${spawnQueue.length} remaining`, W/2+100, PANEL_Y+74);
  }

  // Tooltip / selected tower info
  if (tooltip) {
    const tc=cellCenter(tooltip.col, tooltip.row);
    const tw=tooltip.tower;
    const def=TOWER_DEFS[tw.type];
    ctx.textAlign='left';
    ctx.fillStyle='rgba(0,0,0,0.9)'; ctx.beginPath(); ctx.roundRect(tc.x-60,tc.y-80,140,72,6); ctx.fill();
    ctx.strokeStyle=def.col; ctx.lineWidth=1; ctx.beginPath(); ctx.roundRect(tc.x-60,tc.y-80,140,72,6); ctx.stroke();
    ctx.fillStyle=def.col; ctx.font='bold 11px Courier New';
    ctx.fillText(`${def.name} Lv${tw.level}`, tc.x-56, tc.y-64);
    ctx.fillStyle='#aaa'; ctx.font='10px Courier New';
    ctx.fillText(`DMG: ${tw.level===1?def.dmg:def.upgDmg}`, tc.x-56, tc.y-50);

    // Upgrade btn
    if (tw.level===1) {
      ctx.fillStyle=gold>=def.upgCost?'#22aa55':'#553333';
      ctx.beginPath(); ctx.roundRect(tc.x-56, tc.y-42, 56, 18, 3); ctx.fill();
      ctx.fillStyle='#fff'; ctx.font='9px Courier New'; ctx.textAlign='center';
      ctx.fillText(`UPG ${def.upgCost}g`, tc.x-28, tc.y-29);
    }
    // Sell btn
    const sv=Math.floor(def.cost*0.6+(tw.level===2?def.upgCost*0.6:0));
    ctx.fillStyle='#aa4422';
    ctx.beginPath(); ctx.roundRect(tc.x+2, tc.y-42, 52, 18, 3); ctx.fill();
    ctx.fillStyle='#fff'; ctx.font='9px Courier New'; ctx.textAlign='center';
    ctx.fillText(`SELL ${sv}g`, tc.x+28, tc.y-29);
  }
}

function drawOverlay(title, sub1, sub2, btn, col) {
  ctx.fillStyle='rgba(0,0,8,0.82)'; ctx.fillRect(0,0,W,GRID_H);
  ctx.textAlign='center';
  ctx.shadowColor=col; ctx.shadowBlur=30;
  ctx.fillStyle=col; ctx.font='bold 46px Courier New';
  ctx.fillText(title, W/2, GRID_H/2-60);
  ctx.shadowBlur=0;
  if (sub1) { ctx.fillStyle='#fff'; ctx.font='18px Courier New'; ctx.fillText(sub1, W/2, GRID_H/2-15); }
  if (sub2) { ctx.fillStyle='#aaa'; ctx.font='14px Courier New'; ctx.fillText(sub2, W/2, GRID_H/2+15); }
  const pulse=0.65+Math.sin(lastTs/320)*0.35;
  ctx.globalAlpha=pulse; ctx.fillStyle='#fff'; ctx.font='bold 17px Courier New';
  ctx.fillText(btn, W/2, GRID_H/2+60); ctx.globalAlpha=1;
}

function draw(t) {
  ctx.clearRect(0, 0, W, H);

  if (state==='menu') {
    ctx.fillStyle='#070714'; ctx.fillRect(0,0,W,H);
    drawOverlay('NEON DEFENSE','Prevent enemies from reaching the exit','Place towers, manage gold, synergize Ice+Cannon','[ CLICK TO START ]','#4488FF');
    drawPanel(t); return;
  }

  drawGrid(t);
  drawTowers(t);
  drawEnemies(t);
  drawBullets();
  drawParticles();
  drawPanel(t);

  if (state==='gameover') drawOverlay('DEFEATED',`Score: ${score}`,`Wave reached: ${wave+1}`,'[ CLICK TO RETRY ]','#FF2020');
  if (state==='victory')  drawOverlay('VICTORY!',`All ${WAVES.length} waves cleared!`,`Final Score: ${score}`,'[ CLICK TO PLAY AGAIN ]','#FFD700');
}

// ─── Boot ──────────────────────────────────────────────────────────────────────
requestAnimationFrame(ts=>{ lastTs=ts; update(ts); });

  // Dev console bridge (global scope)
  window.__devPatch = function(code) { return eval(code); };
</script>

<script id="dev-console-script">
/* DEV_CONSOLE_INJECTED */
(function(){
'use strict';
var FILENAME=window.location.pathname.split('/').pop();
var panel=document.getElementById('dev-console');
var input=document.getElementById('dev-console-input');
var btn=document.getElementById('dev-console-btn');
var undoBtn=document.getElementById('dev-console-undo');
var statusEl=document.getElementById('dev-console-status');
var closeBtn=document.getElementById('dev-console-close');
var ctxBtn=document.getElementById('dev-console-ctx-btn');
var ctxPanel=document.getElementById('dev-console-ctx');
var logPanel=document.getElementById('dev-console-log');
var codeWrap=document.getElementById('dev-console-code-wrap');
var codeToggle=document.getElementById('dev-console-code-toggle');
var codePre=document.getElementById('dev-console-code-pre');
if(!panel||!input||!btn||!statusEl)return;

// ── État interne ──
var _snapshots=[];
var _history=[];
var _histIdx=-1;
var _actionLog=[];
var MAX_UNDO=15;
var MAX_LOG=30;
var _lastCode='';

// ── Toggle code généré ──
if(codeToggle&&codeWrap&&codePre){
  codeToggle.addEventListener('click',function(){
    var isOpen=codePre.style.display==='block';
    codePre.style.display=isOpen?'none':'block';
    codeToggle.textContent=(isOpen?'▶ voir':'▼ masquer')+' le code généré';
  });
  codePre.style.display='none'; // fermé par défaut
}

function showGeneratedCode(code){
  if(!codeWrap||!codePre||!codeToggle)return;
  _lastCode=code||'';
  codePre.textContent=_lastCode;
  codeWrap.classList.add('visible');
  codePre.style.display='none'; // fermé par défaut, l'utilisateur ouvre s'il veut
  codeToggle.textContent='▶ voir le code généré ('+_lastCode.split('\n').length+' lignes)';
}

function hideGeneratedCode(){
  if(!codeWrap)return;
  codeWrap.classList.remove('visible');
  _lastCode='';
}

// ── Utilitaires UI ──
closeBtn.addEventListener('click',function(){panel.classList.remove('open');input.blur();});

function setStatus(msg,cls){
  statusEl.textContent=msg;
  statusEl.className=cls||'';
}

function addLog(prompt,ok,note){
  var t=new Date().toLocaleTimeString('fr',{hour:'2-digit',minute:'2-digit',second:'2-digit'});
  var short=prompt.length>55?prompt.slice(0,55)+'…':prompt;
  _actionLog.unshift({t:t,short:short,ok:ok,note:note||''});
  if(_actionLog.length>MAX_LOG)_actionLog.pop();
  renderLog();
}

function renderLog(){
  if(!_actionLog.length){logPanel.classList.remove('visible');return;}
  logPanel.classList.add('visible');
  logPanel.innerHTML=_actionLog.map(function(e){
    return '<span style="color:#333">'+e.t+'</span> '+
      '<span style="color:'+(e.ok?'#1a6a1a':'#6a1a1a')+'">&#8226;</span> '+
      '<span style="color:'+(e.ok?'#447744':'#774444')+'">'+e.short+'</span>'+
      (e.note?'<span style="color:#333"> → '+e.note+'</span>':'');
  }).join('<br>');
}

// ── Snapshot pour undo ──
function takeSnapshot(){
  try{
    var s={_ts:Date.now()};
    // Numériques globaux
    ['score','highScore','gold','lives','level','floor','stage','currentFloor',
     'currentDungeonFloor','currentLevel','wave','waveNumber','coins','gems',
     'playerGold','energy','mana','ammo'].forEach(function(n){
      if(typeof window[n]==='number')s[n]=window[n];
    });
    // gameState
    if(typeof gameState!=='undefined')s.gameState=gameState;
    // Joueur (plusieurs conventions)
    ['hero','player','ship','character'].forEach(function(pn){
      if(typeof window[pn]!=='undefined'&&window[pn]&&typeof window[pn]==='object'){
        var p=window[pn];
        s['_p_'+pn]={hp:p.hp,maxHp:p.maxHp,speed:p.speed,attack:p.attack||p.damage,
          defense:p.defense,mp:p.mp,maxMp:p.maxMp,level:p.level,xp:p.xp,
          x:p.x,y:p.y,invincibilityTimer:p.invincibilityTimer||0,
          classId:p.classId,vx:p.vx||0,vy:p.vy||0};
      }
    });
    // Longueurs des tableaux
    ['enemies','towers','loot','minions','projectiles','bullets','interactables',
     'powerups','particles'].forEach(function(n){
      if(typeof window[n]!=='undefined'&&Array.isArray(window[n]))s['_len_'+n]=window[n].length;
    });
    // playerStats si existe
    if(typeof playerStats!=='undefined'&&playerStats)
      s._playerStats=JSON.parse(JSON.stringify(playerStats));
    if(typeof activeBuffs!=='undefined'&&Array.isArray(activeBuffs))
      s._activeBuffs=JSON.parse(JSON.stringify(activeBuffs));
    return s;
  }catch(e){return null;}
}

function applySnapshot(s){
  if(!s)return false;
  var ok=false;
  try{
    ['score','highScore','gold','lives','level','floor','stage','currentFloor',
     'currentDungeonFloor','currentLevel','wave','waveNumber','coins','gems',
     'playerGold','energy','mana','ammo'].forEach(function(n){
      if(s[n]!==undefined&&typeof window[n]==='number'){window[n]=s[n];ok=true;}
    });
    if(s.gameState!==undefined&&typeof gameState!=='undefined'){gameState=s.gameState;ok=true;}
    ['hero','player','ship','character'].forEach(function(pn){
      var pk='_p_'+pn;
      if(s[pk]&&typeof window[pn]!=='undefined'&&window[pn]){
        var p=window[pn],sd=s[pk];
        ['hp','maxHp','speed','attack','defense','mp','maxMp','level','xp',
         'invincibilityTimer','classId','vx','vy'].forEach(function(f){
          if(sd[f]!==undefined)p[f]=sd[f];
        });
        ok=true;
      }
    });
    if(s._playerStats&&typeof playerStats!=='undefined'&&playerStats){
      Object.assign(playerStats,s._playerStats);ok=true;
    }
    if(s._activeBuffs&&typeof activeBuffs!=='undefined'&&Array.isArray(activeBuffs)){
      activeBuffs.length=0;s._activeBuffs.forEach(function(b){activeBuffs.push(b);});ok=true;
    }
  }catch(e){}
  return ok;
}

function pushSnapshot(snap){
  if(!snap)return;
  _snapshots.push(snap);
  if(_snapshots.length>MAX_UNDO)_snapshots.shift();
  undoBtn.disabled=false;
}

function updateUndoBtn(){undoBtn.disabled=_snapshots.length===0;}

undoBtn.addEventListener('click',function(){
  if(!_snapshots.length)return;
  var snap=_snapshots.pop();
  updateUndoBtn();
  var ok=applySnapshot(snap);
  var dt=Math.round((Date.now()-snap._ts)/1000);
  if(ok){setStatus('↩ Annulé (il y a '+dt+'s)','ok');}
  else{setStatus('⚠ Annulation partielle — les changements complexes (nouvelles fonctions, types) ne peuvent pas être annulés automatiquement','warn');}
});

// ── Context browser ──
ctxBtn.addEventListener('click',function(){
  if(ctxPanel.classList.contains('open')){
    ctxPanel.classList.remove('open');
    ctxBtn.classList.remove('active');
    ctxPanel.innerHTML='';
    return;
  }
  ctxBtn.classList.add('active');
  var ctx=collectContext();
  var lines=['<b style="color:#226622">═══ CONTEXTE EN TEMPS RÉEL ═══</b>'];
  Object.keys(ctx).forEach(function(k){
    var v=ctx[k];
    var vs=typeof v==='object'?JSON.stringify(v).slice(0,90):String(v);
    lines.push('<span style="color:#00cc55">'+k+'</span><span style="color:#224422">:</span> <span style="color:#88aa88">'+vs+'</span>');
  });
  if(lines.length===1)lines.push('<span style="color:#1a3a1a">Aucune variable standard détectée (jeu custom)</span>');
  ctxPanel.innerHTML=lines.join('<br>');
  ctxPanel.classList.add('open');
});

// ── Collecte du contexte runtime ──
function collectContext(){
  var ctx={};
  try{
    var stateNames=['gameState','state','currentState','phase','mode','screen'];
    stateNames.forEach(function(n){if(typeof window[n]!=='undefined')ctx[n]=window[n];});
    var scoreNames=['score','highScore','bestScore','gold','lives','level','floor','stage',
                    'currentFloor','currentDungeonFloor','currentLevel','wave','waveNumber',
                    'coins','gems','playerGold','energy','mana','ammo','kills'];
    scoreNames.forEach(function(n){if(typeof window[n]!=='undefined')ctx[n]=window[n];});
    ['hero','player','ship','character','pawn','tank'].forEach(function(pn){
      if(typeof window[pn]!=='undefined'&&window[pn]&&typeof window[pn]==='object'){
        var p=window[pn];
        ctx[pn]={hp:p.hp,maxHp:p.maxHp,x:Math.round(p.x||0),y:Math.round(p.y||0),
          speed:p.speed,level:p.level,attack:p.attack||p.damage||p.atk,
          defense:p.defense||p.def,mp:p.mp,maxMp:p.maxMp,classId:p.classId,
          invincible:!!(p.invincibilityTimer>0)};
      }
    });
    var arrNames=['enemies','towers','projectiles','bullets','particles','loot','interactables',
                  'minions','platforms','coins','items','obstacles','pieces','waves','powerups',
                  'skills','traps','buildings','npcs','allies'];
    arrNames.forEach(function(n){
      if(typeof window[n]!=='undefined'&&Array.isArray(window[n]))ctx[n+'_count']=window[n].length;
    });
    if(typeof window['boss']!=='undefined')ctx.bossAlive=window['boss']!==null;
    if(typeof window['bossGate']!=='undefined')ctx.bossGateOpen=!!(window['bossGate']&&window['bossGate'].open);
    if(typeof ENEMY_TYPES!=='undefined')ctx.enemyTypes=Object.keys(ENEMY_TYPES);
    if(typeof TOWER_TYPES!=='undefined')ctx.towerTypes=Object.keys(TOWER_TYPES);
    if(typeof ITEM_TYPES!=='undefined')ctx.itemTypes=Object.keys(ITEM_TYPES);
    if(typeof WEAPON_TYPES!=='undefined')ctx.weaponTypes=Object.keys(WEAPON_TYPES);
    if(typeof UPGRADE_TYPES!=='undefined')ctx.upgradeTypes=Object.keys(UPGRADE_TYPES);
    if(typeof HERO_CLASSES!=='undefined')ctx.heroClasses=HERO_CLASSES.map(function(c){return c.id+':'+c.name;});
    if(typeof CUSTOM_SKILLS!=='undefined')ctx.customSkills=Object.keys(CUSTOM_SKILLS);
    if(typeof CUSTOM_ATTACKS!=='undefined')ctx.customAttacks=Object.keys(CUSTOM_ATTACKS);
    var fnNames=['createEnemy','spawnBoss','generateDungeon','checkLevelUp','handleEnemyDefeat',
                 'spawnParticles','spawnFloatingText','triggerShake','createProjectile',
                 'placeTower','addTower','spawnEnemy','createTower','restartGame','resetGame',
                 'spawnWave','addPowerup','unlockSkill','applyKnockback','onBossDefeat',
                 'openShop','buyItem','saveGame','loadGame','generateLevel','nextWave',
                 'addUpgrade','applyUpgrade','createItem','dropLoot'];
    var avail=fnNames.filter(function(n){return typeof window[n]==='function';});
    if(avail.length)ctx.functions=avail;
    if(typeof playerInventory!=='undefined')ctx.inventory=playerInventory;
    if(typeof activeBuffs!=='undefined'&&Array.isArray(activeBuffs))ctx.buffs=activeBuffs.length;
    if(typeof TILE_SIZE!=='undefined')ctx.TILE_SIZE=TILE_SIZE;
    if(typeof MAP_W!=='undefined')ctx.MAP_W=MAP_W;
  }catch(e){}
  return ctx;
}

// ── Validation syntaxique client ──
function validateSyntax(code){
  var o=0,c=0,po=0,pc=0,bo=0,bc=0;
  for(var i=0;i<code.length;i++){
    var ch=code[i];
    if(ch==='{')o++;else if(ch==='}')c++;
    else if(ch==='(')po++;else if(ch===')')pc++;
    else if(ch==='[')bo++;else if(ch===']')bc++;
  }
  if(o!==c)return 'Accolades: '+o+' { pour '+c+' }';
  if(po!==pc)return 'Parenthèses: '+po+' ( pour '+pc+' )';
  if(bo!==bc)return 'Crochets: '+bo+' [ pour '+bc+' ]';
  return null;
}

// ── Exécution du code patché ──
function execCode(code,explanation){
  var synErr=validateSyntax(code);
  if(synErr){
    setStatus('⚠ Syntaxe invalide côté client: '+synErr+' — Le code ne sera pas exécuté.','err');
    return false;
  }
  try{
    if(typeof window.__devPatch==='function'){
      window.__devPatch(code);
    }else{
      // Fallback: new Function (n'accède pas aux vars locales du jeu)
      (new Function(code))();
    }
    var msg=explanation||'Patch appliqué !';
    setStatus('✅ '+msg,'ok');
    input.value='';
    return true;
  }catch(e){
    var msg=e.message||String(e);
    if(msg.indexOf('not defined')!==-1){
      var vn=(msg.split(' ')[0]||'').replace(/[^a-zA-Z0-9_]/g,'');
      msg='Variable "'+vn+'" introuvable dans ce jeu. Utilisez le bouton ctx pour voir ce qui est disponible.';
    }else if(msg.indexOf('is not a function')!==-1){
      msg='Fonction non disponible dans ce jeu: '+msg+'. Vérifiez ctx → functions.';
    }else if(msg.indexOf('Cannot read')!==-1||msg.indexOf('null')!==-1){
      msg='Accès à null/undefined: '+msg+' — Ajoutez une vérification if(variable) avant.';
    }else if(msg.indexOf('Assignment to constant')!==-1){
      msg="Impossible de modifier une constante (const). Passez par l'objet: ex TYPE.xxx au lieu de TYPE=...";
    }else if(msg.indexOf('Unexpected token')!==-1){
      msg='Erreur de syntaxe JS: '+msg;
    }
    setStatus('❌ '+msg,'err');
    return false;
  }
}

// ── Application d'un patch ──
async function applyPatch(){
  var prompt=input.value.trim();
  if(!prompt)return;
  if(_history[0]!==prompt){_history.unshift(prompt);if(_history.length>50)_history.pop();}
  _histIdx=-1;
  btn.disabled=true;
  hideGeneratedCode();
  setStatus('⏳ Génération en cours...','pending');
  var snap=takeSnapshot();
  try{
    var resp=await fetch('/api/game-patch',{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({filename:FILENAME,prompt:prompt,context:collectContext()})
    });
    if(!resp.ok){
      var errText=await resp.text();
      setStatus('❌ Erreur serveur '+resp.status+': '+errText.slice(0,80),'err');
      addLog(prompt,false,'HTTP '+resp.status);
      return;
    }
    var data=await resp.json();
    if(data.error){
      setStatus('❌ '+data.error,'err');
      addLog(prompt,false,data.error.slice(0,40));
    }else if(data.code){
      // Afficher le code avant l'exec (utile si l'exec plante)
      showGeneratedCode(data.code);
      var ok=execCode(data.code,data.explanation);
      if(ok){
        pushSnapshot(snap);
        addLog(prompt,true,data.explanation?data.explanation.slice(0,80):'');
      }else{
        // En cas d'erreur, garder le code visible automatiquement pour debug
        if(codePre)codePre.style.display='block';
        if(codeToggle)codeToggle.textContent='▼ masquer le code généré (erreur — vérifier la syntaxe)';
        addLog(prompt,false,'Erreur exec');
      }
    }else{
      setStatus('⚠ Réponse vide du serveur','warn');
      addLog(prompt,false,'réponse vide');
    }
  }catch(e){
    setStatus('❌ Réseau: '+e.message,'err');
    addLog(prompt,false,'réseau');
  }finally{btn.disabled=false;}
}

// ── Événements ──
btn.addEventListener('click',applyPatch);
input.addEventListener('keydown',function(e){
  if(e.code!=='Backquote'&&e.code!=='IntlBackslash')e.stopPropagation();
  if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();applyPatch();return;}
  if(e.key==='ArrowUp'&&!e.shiftKey&&_history.length){
    e.preventDefault();_histIdx=Math.min(_histIdx+1,_history.length-1);input.value=_history[_histIdx];
  }
  if(e.key==='ArrowDown'&&!e.shiftKey){
    e.preventDefault();_histIdx=Math.max(_histIdx-1,-1);input.value=_histIdx>=0?_history[_histIdx]:'';
  }
});
document.addEventListener('keydown',function(e){
  if(e.code==='Backquote'||e.code==='IntlBackslash'){
    e.preventDefault();
    if(panel.classList.contains('open')){
      panel.classList.remove('open');input.blur();
    }else{
      panel.classList.add('open');input.focus();
    }
  }
});
})();
</script>
