  if (!Keys.down[e.code]) Keys.pressed[e.code] = true;
  Keys.down[e.code] = true;
  if (['Space','ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.code)) e.preventDefault();
});
window.addEventListener('keyup', e => { Keys.down[e.code]=false; Keys.released[e.code]=true; });

canvas.addEventListener('touchstart', e => {
  e.preventDefault();
  let r = canvas.getBoundingClientRect();
  Touch.startX = Touch.x = (e.touches[0].clientX-r.left)*(W/r.width);
  Touch.y = (e.touches[0].clientY-r.top)*(H/r.height);
  Touch.justTapped = true;
}, {passive:false});
canvas.addEventListener('touchmove', e => {
  e.preventDefault();
  Touch.swipeDx = (e.touches[0].clientX-r.left)*(W/r.width) - Touch.startX;
}, {passive:false});
canvas.addEventListener('touchend', e => { e.preventDefault(); Touch.swipeDx = 0; }, {passive:false});
let Mouse = { clicked:false, x:0, y:0 };
canvas.addEventListener('mousemove', e => {
  const r = canvas.getBoundingClientRect();
  Mouse.x = (e.clientX - r.left) * (W / r.width);
  Mouse.y = (e.clientY - r.top)  * (H / r.height);
});

  const r = canvas.getBoundingClientRect();
  Mouse.x = (e.clientX - r.left) * (W / r.width);
  Mouse.y = (e.clientY - r.top)  * (H / r.height);
  Mouse.clicked = true;
});

// Object pool
function createPool(factory, size) {
  let inactive = Array.from({length:size}, factory), active = [];
  return {
    active,
    get(fn){ const o=inactive.length>0?inactive.pop():factory(); o.alive=true; if(fn)fn(o); active.push(o); return o; },
    update(fn){ for(let i=active.length-1;i>=0;i--) if(!fn(active[i])){active[i].alive=false;inactive.push(active.splice(i,1)[0]);} },
    clear(){ while(active.length){active[0].alive=false;inactive.push(active.shift());} }
  };
}

    Particles.get(p=>{p.x=x;p.y=y;p.vx=Math.cos(a)*sp;p.vy=Math.sin(a)*sp;p.life=p.maxLife=opts.life||(0.25+Math.random()*0.4);p.size=opts.size||(2+Math.random()*3);p.color=opts.color||'#fff';p.gravity=opts.gravity!==undefined?opts.gravity:250;});
  }
}

// COLLISION HELPERS — DO NOT MODIFY
// These implement the research-proven "X then Y" AABB resolution
// ══════════════════════════════════════════════════════════════════
function getPlatformAt(px, py, pw, ph) {
  return platforms.filter(p => p.type !== 'gone' && aabb(px,py,pw,ph, p.x,p.y,p.w,p.h));
}

// Resolve entity against solid platforms — returns updated entity
function resolveEntityPlatforms(ent, dt) {
  // Save previous Y for one-way check
  ent.prevY = ent.prevY !== undefined ? ent.prevY : ent.y;
  ent.wasOnGround = ent.onGround;
  ent.onGround = false;

  // ── X axis first ──────────────────────────────────────────────
  ent.x += ent.vx * dt;
  getPlatformAt(ent.x, ent.y, ent.w, ent.h).forEach(p => {
    if (p.type === 'oneWay' || p.type === 'bouncing') return;  // ignore one-way/bouncing for X
    let overlapX = ent.vx > 0
      ? (ent.x + ent.w) - p.x
      : p.x + p.w - ent.x;
    if (overlapX > 0) {
      ent.x += ent.vx > 0 ? -overlapX : overlapX;
      ent.vx = 0;
    }
  });

  // ── Y axis second ─────────────────────────────────────────────
  ent.y += ent.vy * dt;
  getPlatformAt(ent.x, ent.y, ent.w, ent.h).forEach(p => {
    if (p.type === 'oneWay') {
      // One-way: only solid when falling onto the top surface from above
      let prevBottom = ent.prevY + ent.h;
      let platTop    = p.y;
      if (ent.vy >= 0 && prevBottom <= platTop + 2 && ent.y + ent.h >= platTop) {
        ent.y = platTop - ent.h;
        ent.vy = 0;
        ent.onGround = true;
      }
      return;
    }
    if (p.type === 'bouncing' && ent === player) {
      if (ent.vy >= 0 && prevBottom <= platTop + 2 && ent.y + ent.h >= platTop) {
        ent.vy = -500 * player.jumpVelocityMultiplier;
        sfx.play(600, 0.1, 'square', 0.1);
        spawnParticles(ent.x + ent.w / 2, ent.y + ent.h, 10, { color: '#ffff00', speed: 80, angle: Math.PI * 1.5, spread: 0.8 });
        p.squashTimer = 0.1; // platform compresses
        ent.onGround = true; // Still considered on ground for coyote time purposes
      }
      return;
    }
    if (p.type === 'fragile') {
      if (ent.vy >= 0 && prevBottom <= platTop + 2 && ent.y + ent.h >= platTop) {
        if (p.state === 'SOLID') {
          p.state = 'SHAKING';
          p.shakeTimer = 0.5;
          sfx.play(200, 0.1, 'square', 0.08);
        }
        ent.y = platTop - ent.h;
        ent.vy = 0;
        ent.onGround = true;
      }
      return;
    }
    // Solid platform
    if (ent.vy >= 0) {
      // Landing on top
      ent.y = p.y - ent.h;
      ent.vy = 0;
      ent.onGround = true;
    } else {
      // Hitting ceiling
      ent.y = p.y + p.h;
      ent.vy = 0;
    }
  });

  ent.prevY = ent.y;

  // Screen bounds
  if (ent.x < 0) { ent.x = 0; ent.vx = 0; }
  if (ent.x + ent.w > currentLevelData.mapWidth) { ent.x = currentLevelData.mapWidth - ent.w; ent.vx = 0; }
}

let _META_KEY = 'meta_platformer';
let _meta = { coins:0, upgrades:{} };
function loadMeta(){try{_meta=JSON.parse(localStorage.getItem(_META_KEY))||{coins:0,upgrades:{}};}catch(e){_meta={coins:0,upgrades:{}};} if(!_meta.upgrades)_meta.upgrades={};}
function saveMeta(){try{localStorage.setItem(_META_KEY,JSON.stringify(_meta));}catch(e){}}
function addRunCoins(n){_meta.coins+=Math.floor(n);saveMeta();}
function getUpgradeLevel(id){return _meta.upgrades[id]||0;}
function buyUpgrade(id){const up=UPGRADES.find(u=>u.id===id);if(!up)return false;let lvl=getUpgradeLevel(id);if(lvl>=up.maxLevel)return false;const cost=up.costs[lvl];if(_meta.coins<cost)return false;_meta.coins-=cost;_meta.upgrades[id]=lvl+1;saveMeta();return true;}

function updateGameover(dt){_gameoverTimer-=dt;if(_gameoverTimer<=0||anyAction()){addRunCoins(_runCoins);_shopIdx=0;setState('shop');}}
function _shopHit(mx,my,x,y,w,h){return mx>=x&&mx<=x+w&&my>=y&&my<=y+h;}
function updateShop(dt){
  if(!anyAction())return;
  _recalcShopLayout();
  for(let i=0;i<UPGRADES.length;i++){
    let cardX=_shopSx+(i%_shopCols)*(_shopCardW+_shopGap);
    let cardY=_shopSy+Math.floor(i/_shopCols)*(_shopCardH+_shopGap);

function initGame() {
  loadMeta();
  player.currentLevel = 1; // Always start at level 1
  levelComplete = false;
  loadLevel(player.currentLevel);
}

function loadLevel(levelNum) {
  let levelIndex = levelNum - 1;
  if (levelIndex >= LEVEL_DATA.length) {
    // Game completed!
    saveHiScore(GAME_SCORE);
    _runCoins = player.currency;
    _gameoverTimer = 1.5;
    setState('gameover');
    return;
  }

  let data = LEVEL_DATA[levelIndex];
  currentLevelData.map = data.map;
  currentLevelData.platforms = JSON.parse(JSON.stringify(data.platforms)); // Deep copy
  currentLevelData.enemies = JSON.parse(JSON.stringify(data.enemies));
  currentLevelData.interactables = JSON.parse(JSON.stringify(data.interactables));
  currentLevelData.mapWidth = data.mapWidth;
  currentLevelData.mapHeight = data.mapHeight;

  mapCols = currentLevelData.map[0].length;
  mapRows = currentLevelData.map.length;

  platforms.length = 0;
  platforms.push(...currentLevelData.platforms);

  enemyPool.length = 0;
  currentLevelData.enemies.forEach(eData => {
    enemyPool.get(en => {
      en.x = eData.x;
      en.y = eData.y;
      en.type = eData.type;
      en.facingRight = eData.facingRight !== undefined ? eData.facingRight : true;
      en.state = 'PATROL'; // Default state for most enemies

      switch (eData.type) {
        case 'heavyGuard':
          en.w = 32; en.h = 32; en.hp = 40; en.maxHp = 40; en.points = 100;
          en.vx = 25 * (en.facingRight ? 1 : -1);
          en.patrolLeft = eData.patrolLeft; en.patrolRight = eData.patrolRight;
          en.attackCooldown = 0;
          en.color = PALETTE.enemyHeavy;
          break;
        case 'droneFlash':
          en.w = 28; en.h = 22; en.hp = 15; en.maxHp = 15; en.points = 50;
          en.vx = 65 * (en.facingRight ? 1 : -1);
          en.patrolLeft = eData.patrolLeft; en.patrolRight = eData.patrolRight;
          en.initialY = eData.initialY; en.y = en.initialY;
          en.state = 'PATROL';
          en.color = PALETTE.enemyDrone;
          break;
        case 'laserTurret':
          en.w = 32; en.h = 32; en.hp = 25; en.maxHp = 25; en.points = 75;
          en.vx = 0;
          en.state = 'IDLE';
          en.attackCooldown = 0; // Time until next shot
          en.color = PALETTE.enemyTurret;
          break;
        case 'kamikaze':
          en.w = 28; en.h = 28; en.hp = 10; en.maxHp = 10; en.points = 0;
          en.vx = 0;
          en.state = 'IDLE';
          en.countdown = 5; // Initial countdown
          en.color = PALETTE.enemyKamikaze;
          break;
        case 'boss':
          en.w = 32 * 1.9; en.h = 32 * 1.9; en.hp = 450; en.maxHp = 450; en.points = 500;
          en.vx = 40; en.vy = 0;
          en.state = 'PHASE1';
          en.attackCooldown = 0;
          en.color = PALETTE.boss;

// ══════════════════════════════════════════════════════════════════
// JUMPING — research-proven feel mechanics (DO NOT MODIFY LOGIC)
// ══════════════════════════════════════════════════════════════════
function executeJump() {
  let isDoubleJump = (!player.onGround && player.coyoteTimer <= 0 && player.jumpsLeft > 0) || player.infiniteJump;
  let isNormalJump = player.onGround || player.coyoteTimer > 0;

  if (isNormalJump || isDoubleJump) {
    player.vy = JUMP_FORCE * player.jumpVelocityMultiplier;
    if (isDoubleJump && !player.infiniteJump) {
      player.jumpsLeft--;
      sfx.play(660, 0.08, 'square', 0.09);
      spawnParticles(player.x + player.w / 2, player.y + player.h, 8, { color: '#00ccff', speed: 60, angle: Math.PI * 1.5, spread: 0.8, gravity: 50, life: 0.25 });
    } else if (isNormalJump) {
      player.jumpsLeft = MAX_JUMPS - 1; // Reset jumps for single jump
      player.coyoteTimer = 0;
      sfx.play(440, 0.08, 'square', 0.09);
      spawnParticles(player.x + player.w / 2, player.y + player.h, 4, { color: '#fff', speed: 40, angle: Math.PI * 0.5, spread: 0.6, gravity: 50, life: 0.25 });
    } else if (player.infiniteJump) { // Mega Jump
      sfx.play(660, 0.08, 'square', 0.09);
      spawnParticles(player.x + player.w / 2, player.y + player.h, 8, { color: '#00ccff', speed: 60, angle: Math.PI * 1.5, spread: 0.8, gravity: 50, life: 0.25 });
    }
    player.isJumping = true;
    player.jumpHeldTimer = 0;
    player.jumpBufferTimer = 0;
    player.squashX = 0.7; player.squashY = 1.35;
  }
}

// ══════════════════════════════════════════════════════════════════
// UPDATE
// ══════════════════════════════════════════════════════════════════
function updatePlaying(dt) {
  var radius = 0;

  if (hitstopTimer > 0) {
    hitstopTimer -= dt;
    // Only update particles and popups during hitstop
    updateParticles(dt);
    updatePopups(dt);
    updateFloatingTexts(dt);
    return;
  }

  showControlsTimer = Math.max(0, showControlsTimer - dt);

  // Power-up timers
  for (const id in powerUps) {
    let pu = powerUps[id];
    if (pu.active) {
      pu.timer -= dt;
      if (pu.timer <= 0) {
        pu.active = false;
        // Reset effects
        switch (id) {
          case 'superJump': player.jumpVelocityMultiplier = 1.0; break;
          case 'speed': player.speedMultiplier = 1.0; break;
          case 'dashUpgrade': player.dashDistanceMultiplier = 1.0; player.dashCooldown = DASH_COOLDOWN; break;
          case 'invincibility': player.isInvincible = false; break;
          case 'megaJump': player.infiniteJump = false; break;
        }
      }
    }
  }

  // ── Moving platforms ─────────────────────────────────────────
  platforms.forEach(p => {
    if (p.type === 'moving') {
      p.prevX = p.x; p.prevY = p.y;
      p.t += dt * p.speed;
      let frac = (Math.sin(p.t * Math.PI / ((p.endX - p.startX || 1) + (p.endY - p.startY || 1))) + 1) / 2;
      p.x = p.startX + (p.endX - p.startX) * frac;
      p.y = p.startY + (p.endY - p.startY) * frac;
      p.frameDelta = { x: p.x - p.prevX, y: p.y - p.prevY };
    } else if (p.type === 'fragile') {
      if (p.state === 'SHAKING') {
        p.shakeTimer -= dt;
        if (p.shakeTimer <= 0) {
          p.state = 'BROKEN';
          p.brokenTimer = 2;
          spawnParticles(p.x + p.w / 2, p.y + p.h / 2, 15, { color: '#888', speed: 80, life: 0.4 });
          sfx.play(100, 0.15, 'sawtooth', 0.1);
        }
      } else if (p.state === 'BROKEN') {
        p.brokenTimer -= dt;
        if (p.brokenTimer <= 0) {
          p.state = 'SOLID';
        }
      }
    } else if (p.type === 'bouncing' && p.squashTimer > 0) {
      p.squashTimer -= dt;
    }
  });

  // ── Player horizontal movement ────────────────────────────────
  let targetSpeed = (keyDown('ShiftLeft') || keyDown('ShiftRight') ? RUN_SPEED : WALK_SPEED) * player.speedMultiplier;
  let movingLeft  = keyDown('ArrowLeft')  || keyDown('KeyA') || (Touch.swipeDx < -15);
  let movingRight = keyDown('ArrowRight') || keyDown('KeyD') || (Touch.swipeDx > 15);

  if (!player.isKnockedBack && !player.isDashing) {
    if (movingLeft || movingRight) {
      let dir = movingLeft ? -1 : 1;
      if (movingRight) player.facingRight = true;
      if (movingLeft)  player.facingRight = false;
      let accel = player.onGround ? GROUND_ACCEL : AIR_ACCEL;
      player.vx = clamp(player.vx + dir * accel * dt, -targetSpeed, targetSpeed);
    } else {
      // Decelerate
      let decel = player.onGround ? GROUND_DECEL : AIR_ACCEL * 0.5;
      if (Math.abs(player.vx) <= decel * dt) player.vx = 0;
      else player.vx -= Math.sign(player.vx) * decel * dt;
    }
  }

  // ── Coyote time ───────────────────────────────────────────────
  if (player.wasOnGround && !player.onGround) player.coyoteTimer = COYOTE_TIME;
  player.coyoteTimer = Math.max(0, player.coyoteTimer - dt);

  // ── Jump buffer ───────────────────────────────────────────────
  if (keyPressed('Space') || keyPressed('ArrowUp') || keyPressed('KeyW') || Touch.justTapped) {
    player.jumpBufferTimer = JUMP_BUFFER;
  }
  player.jumpBufferTimer = Math.max(0, player.jumpBufferTimer - dt);

  // ── Jump execution ────────────────────────────────────────────
  let canJump = player.onGround || player.coyoteTimer > 0 || player.jumpsLeft > 0 || player.infiniteJump;
  if (player.jumpBufferTimer > 0 && canJump) executeJump();

  // ── Variable jump height ──────────────────────────────────────
  if (player.isJumping) {
    player.jumpHeldTimer += dt;
    let jumpReleased = !keyDown('Space') && !keyDown('ArrowUp') && !keyDown('KeyW');
    if (jumpReleased || player.jumpHeldTimer >= 0.3) {
      if (player.vy < 0) {
        player.vy *= JUMP_RELEASE;
      }
      player.isJumping = false;
    }
    if (player.vy >= 0) player.isJumping = false;  // reached peak
  }

  // ── Dash ──────────────────────────────────────────────────────
  player.dashCooldownTimer = Math.max(0, player.dashCooldownTimer - dt);
  if (player.dashCooldownTimer <= 0) player.canDash = true;

  if (keyPressed('KeyC') && player.canDash && !player.isKnockedBack && !player.isDashing && !player.isAttacking) {
    player.canDash = false;
    player.isDashing = true;
    player.dashTimer = DASH_DURATION;
    player.invincibleTimer = 4 * FIXED_DT; // 4 frames invincibility
    player.vx = (player.facingRight ? 1 : -1) * DASH_SPEED * player.dashDistanceMultiplier;
    player.vy = 0;
    sfx.play(700, 0.08, 'triangle', 0.12);
    spawnParticles(player.x + player.w / 2, player.y + player.h / 2, 10, { color: '#00ffff', speed: 150, angle: player.facingRight ? 0 : Math.PI, spread: 0.2, life: 0.2 });
    player.animState = 'dashing';
    player.squashX = 1.5; player.squashY = 0.8;
  }

  if (player.isDashing) {
    player.dashTimer -= dt;
    if (player.dashTimer <= 0) {
      player.isDashing = false;
      player.dashCooldownTimer = DASH_COOLDOWN;
      player.vx = 0; // Stop dash movement
    } else {
      spawnParticles(player.x + player.w / 2 - (player.facingRight ? 10 : -10), player.y + player.h / 2, 1, { color: '#00ffff', speed: 30, angle: player.facingRight ? Math.PI : 0, spread: 0.1, life: 0.1 });
    }
  }

  // ── Attack ────────────────────────────────────────────────────
  player.attackCooldownTimer = Math.max(0, player.attackCooldownTimer - dt);
  if (keyPressed('KeyX') && player.attackCooldownTimer <= 0 && !player.isDashing && !player.isKnockedBack) {
    player.isAttacking = true;
    player.attackCooldownTimer = ATTACK_COOLDOWN;
    sfx.play(800, 0.05, 'triangle', 0.1);
    player.animState = 'attacking';
    hitstopTimer = 3 * FIXED_DT; // Hit pause for 3 frames
    // Create attack hitbox
    let attackX = player.x + (player.facingRight ? player.w : -ATTACK_RANGE_X);
    let attackY = player.y + player.h / 2 - ATTACK_RANGE_Y / 2;
    enemyPool.active.forEach(en => {
      if (aabb(attackX, attackY, ATTACK_RANGE_X, ATTACK_RANGE_Y, en.x, en.y, en.w, en.h)) {
        dealDamageToEnemy(en, ATTACK_DAMAGE, attackX, attackY);
        triggerShake(1, 3 * FIXED_DT);
        spawnFloatingText(en.x + en.w / 2, en.y, `${ATTACK_DAMAGE}`, '#ffffff', 16);
      }
    });
  }
  if (player.isAttacking && player.attackCooldownTimer <= ATTACK_COOLDOWN - 0.1) {
    player.isAttacking = false;
  }

  // ── Knockback ─────────────────────────────────────────────────
  player.knockbackTimer = Math.max(0, player.knockbackTimer - dt);
  if (player.isKnockedBack && player.knockbackTimer <= 0) {
    player.isKnockedBack = false;
  }

  // ── Invincibility from dash ───────────────────────────────────
  player.invincibleTimer = Math.max(0, player.invincibleTimer - dt);


  // ── Gravity ───────────────────────────────────────────────────
  if (!player.isDashing && !player.isKnockedBack) {
    let fallMultiplier = player.vy > 0 ? 1.55 : 1.0;  // fall faster = more satisfying
    player.vy = Math.min(player.vy + GRAVITY * fallMultiplier * dt, MAX_FALL);
  } else if (player.isKnockedBack) {
    player.vy = Math.min(player.vy + GRAVITY * dt, MAX_FALL);
  }

  // ── Platform collision ────────────────────────────────────────
  resolveEntityPlatforms(player, dt);

  // ── Moving platform carry ─────────────────────────────────────
  platforms.forEach(p => {
    if (p.type !== 'moving' || !p.frameDelta) return;
    let standing =
      player.y + player.h >= p.y - 2 && player.y + player.h <= p.y + 4 &&
      player.x + player.w > p.x && player.x < p.x + p.w && player.vy >= 0;
    if (standing) { player.x += p.frameDelta.x; player.y += p.frameDelta.y; }
  });

  // ── On-ground effects ─────────────────────────────────────────
  if (player.onGround && !player.wasOnGround) {
    // Landing
    let landSpeed = Math.abs(player.vy < -50 ? player.vy : 0);
    if (landSpeed > 300) { triggerShake(3, 0.12); sfx.play(220, 0.06, 'sine', 0.08); }
    player.squashX = 1.25; player.squashY = 0.72;
    spawnParticles(player.x+player.w/2, player.y+player.h, 3, {color:'#ddd',speed:30,angle:Math.PI*0.5,spread:1.0,gravity:150,life:0.2});
    player.jumpsLeft = MAX_JUMPS;
    player.isJumping = false;
  }

  // Lerp squash/stretch back to 1
  player.squashX = lerp(player.squashX, 1.0, dt * 12);
  player.squashY = lerp(player.squashY, 1.0, dt * 12);

  // ── Iframes ───────────────────────────────────────────────────
  player.iframes = Math.max(0, player.iframes - dt);

  // ── Enemy updates ─────────────────────────────────────────────
  enemyPool.update(en => {
    en.flashTimer = Math.max(0, en.flashTimer - dt);
    let distPlayerX = Math.abs(player.x - en.x);
    let distPlayerY = Math.abs(player.y - en.y);
    let distPlayer = Math.sqrt(distPlayerX * distPlayerX + distPlayerY * distPlayerY);

    // AI State Machine
    switch (en.type) {
      case 'heavyGuard':
        switch (en.state) {
          case 'IDLE':
            en.stateTimer -= dt;
            if (en.stateTimer <= 0) en.state = 'PATROL';
            if (distPlayerX < 150) en.state = 'CHASE';
            break;
          case 'PATROL':
            en.x += en.vx * dt;
            if (en.x < en.patrolLeft) { en.vx = Math.abs(en.vx); en.facingRight = true; }
            if (en.x + en.w > en.patrolRight) { en.vx = -Math.abs(en.vx); en.facingRight = false; }
            if (distPlayerX < 150) en.state = 'CHASE';
            if (distPlayerX < 32 && distPlayerY < 32) en.state = 'ATTACK';
            break;
          case 'CHASE':
            en.vx = (player.x < en.x ? -1 : 1) * 20; // Slower chase
            if (distPlayerX >= 150) en.state = 'PATROL';
            if (distPlayerX < 32 && distPlayerY < 32) en.state = 'ATTACK';
            break;
          case 'ATTACK':
            en.vx = 0;
            en.attackCooldown -= dt;
            if (en.attackCooldown <= 0) {
              // Attack animation (0.3s pre-attack)
              en.stateTimer = 0.3;
              en.attackCooldown = 1.5; // Cooldown after attack
            }
            if (en.stateTimer > 0) {
              en.stateTimer -= dt;
              if (en.stateTimer <= 0) {
                // Actual attack hit
                let attackBoxX = en.x + (en.facingRight ? en.w : -32);
                if (aabb(attackBoxX, en.y, 32, 32, player.x, player.y, player.w, player.h)) {
                  dealDamageToPlayer(15, en);
                }
                en.state = 'CHASE'; // Resume chase after attack
              }
            }
            break;
          case 'STUNNED':
            en.stateTimer -= dt;
            if (en.stateTimer <= 0) en.state = 'PATROL'; // Resume previous state
            break;
        }
        break;
      case 'droneFlash':
        switch (en.state) {
          case 'IDLE':
            en.stateTimer -= dt;
            if (en.stateTimer <= 0) en.state = 'PATROL';
            if (distPlayer < 200) en.state = 'CHASE';
            break;
          case 'PATROL':
            en.x += en.vx * dt;
            en.y = en.initialY + Math.sin(en.stateTimer * 5) * 5; // Vertical bob
            en.stateTimer += dt;
            if (en.x < en.patrolLeft) { en.vx = Math.abs(en.vx); en.facingRight = true; }
            if (en.x + en.w > en.patrolRight) { en.vx = -Math.abs(en.vx); en.facingRight = false; }
            if (distPlayer < 200) en.state = 'CHASE';
            break;
          case 'CHASE':
            en.chargeTargetX = lerp(en.chargeTargetX, player.x, dt * 10);
            en.chargeTargetY = lerp(en.chargeTargetY, player.y, dt * 10);
            let angle = Math.atan2(en.chargeTargetY - en.y, en.chargeTargetX - en.x);
            en.vx = Math.cos(angle) * 65;
            en.vy = Math.sin(angle) * 65;
            if (distPlayer >= 200) en.state = 'PATROL';
            if (distPlayer < 16) en.state = 'ATTACK';
            break;
          case 'ATTACK':
            // Direct contact is the attack
            en.state = 'CHASE'; // Immediately go back to chase, relies on player collision
            break;
          case 'STUNNED':
            en.stateTimer -= dt;
            if (en.stateTimer <= 0) en.state = 'CHASE';
            break;
        }
        break;
      case 'laserTurret':
        switch (en.state) {
          case 'IDLE':
            en.stateTimer += dt;
            // Scan 90 degrees
            let scanAngle = Math.sin(en.stateTimer * 0.5) * Math.PI / 4;
            en.facingRight = Math.cos(scanAngle) > 0;
            if (distPlayer < 250 && Math.abs(Math.atan2(player.y - en.y, player.x - en.x)) < Math.PI / 3) {
              en.state = 'CHASE';
            }
            break;
          case 'CHASE':
            en.attackCooldown -= dt;
            let angleToPlayer = Math.atan2(player.y - en.y, player.x - en.x);
            en.facingRight = (player.x > en.x);
            if (distPlayer >= 250 || Math.abs(angleToPlayer) > Math.PI / 3) { // Out of 120 degree cone
              en.state = 'IDLE';
            } else if (en.attackCooldown <= 0) {
              en.state = 'ATTACK';
              en.attackCooldown = 2.0;
            }
            break;
          case 'ATTACK':
            var shootAngle = Math.atan2(player.y - en.y, player.x - en.x);
            projectilePool.get(proj => {
              proj.x = en.x + en.w / 2;
              proj.y = en.y + en.h / 2;
              proj.vx = Math.cos(shootAngle) * en.bulletSpeed;
              proj.vy = Math.sin(shootAngle) * en.bulletSpeed;
              proj.w = 8; proj.h = 8; proj.damage = 12;
            });
            sfx.play(900, 0.05, 'sine', 0.1);
            en.state = 'CHASE';
            break;
          case 'STUNNED':
            en.stateTimer -= dt;
            if (en.stateTimer <= 0) en.state = 'CHASE';
            break;
        }
        break;
      case 'kamikaze':
        switch (en.state) {
          case 'IDLE':
            if (distPlayer < 180) {
              en.state = 'CHASE';
              en.countdown = 3;
              sfx.play(300, 0.1, 'sawtooth', 0.1);
            }
            break;
          case 'CHASE':
            en.vx = (player.x < en.x ? -1 : 1) * 50;
            en.countdown -= dt;
            if (en.countdown <= 0 || distPlayer < 48) {
              en.state = 'ATTACK';
              en.stateTimer = 1.0; // Time before explosion
              sfx.play(400, 0.1, 'triangle', 0.1);
            }
            break;
          case 'ATTACK':
            en.vx = 0;
            en.stateTimer -= dt;
            if (en.stateTimer <= 0) {
              // Explode
              spawnParticles(en.x + en.w / 2, en.y + en.h / 2, 30, { color: PALETTE.enemyKamikaze, speed: 120, life: 0.5 });
              sfx.play(100, 0.2, 'sawtooth', 0.2);
              triggerShake(5, 0.2);
              // Damage player if in radius
              if (distPlayer < en.explosionRadius) {
                dealDamageToPlayer(20, en);
              }
              // Destroy fragile blocks
              platforms.forEach(p => {
                if (p.type === 'fragile' && aabb(en.x - en.explosionRadius/2, en.y - en.explosionRadius/2, en.explosionRadius, en.explosionRadius, p.x, p.y, p.w, p.h)) {
                  p.state = 'BROKEN';
                  p.brokenTimer = 2;
                }
              });
              en.alive = false; // Self-destruct
            }
            break;
          case 'STUNNED':
            en.stateTimer -= dt;
            if (en.stateTimer <= 0) en.state = 'CHASE';
            break;
        }
        break;
      case 'boss':
        // Boss AI
        switch (en.state) {
          case 'PHASE1': // 100% -> 50% HP
            en.vx = (player.x < en.x ? -1 : 1) * 40;
            en.attackCooldown -= dt;
            if (distPlayer < 48 && en.attackCooldown <= 0) {
              en.state = 'BOSS_ATTACK';
              en.stateTimer = 0.4; // Pre-attack animation
              en.attackCooldown = 2.0;
            }
            if (en.hp <= en.maxHp * 0.5) en.state = 'PHASE2';
            break;
          case 'BOSS_ATTACK': // Melee attack for Phase 1
            en.vx = 0;
            en.stateTimer -= dt;
            if (en.stateTimer <= 0) {
              let attackBoxX = en.x + (en.facingRight ? en.w : -48);
              if (aabb(attackBoxX, en.y, 48, 48, player.x, player.y, player.w, player.h)) {
                dealDamageToPlayer(20, en); // Boss attack damage
              }
              en.state = 'PHASE1';
            }
            break;
          case 'PHASE2': // 50% -> 25% HP
            en.vx = (player.x < en.x ? -1 : 1) * 65;
            en.attackCooldown -= dt;
            if (en.attackCooldown <= 0) {
              projectilePool.get(proj => {
                proj.x = en.x + en.w / 2; proj.y = en.y + en.h / 2;
                proj.vx = Math.cos(shootAngle) * 120; proj.vy = Math.sin(shootAngle) * 120;
                proj.w = 12; proj.h = 12; proj.damage = 15; proj.color = PALETTE.boss;
              });
              sfx.play(950, 0.07, 'sine', 0.12);
              en.attackCooldown = 1.5;
            }
            if (en.hp <= en.maxHp * 0.25) en.state = 'PHASE3';
            break;
          case 'PHASE3': // < 25% HP
            en.attackCooldown -= dt;
            if (en.attackCooldown <= 0) {
              // Teleport
              let teleports = [
                {x: 100, y: 100}, {x: currentLevelData.mapWidth - 100, y: 100},
                {x: 100, y: 300}, {x: currentLevelData.mapWidth - 100, y: 300}
              ];
              let targetPos = randChoice(teleports);
              en.x = targetPos.x; en.y = targetPos.y;
              spawnParticles(en.x + en.w / 2, en.y + en.h / 2, 20, { color: PALETTE.boss, speed: 100, life: 0.3 });
              sfx.play(1200, 0.08, 'triangle', 0.15);

              // Starburst attack
              for (let i = 0; i < 8; i++) {
                let angle = i * Math.PI / 4;
                projectilePool.get(proj => {
                  proj.x = en.x + en.w / 2; proj.y = en.y + en.h / 2;
                  proj.vx = Math.cos(angle) * 100; proj.vy = Math.sin(angle) * 100;
                  proj.w = 10; proj.h = 10; proj.damage = 10; proj.color = PALETTE.boss;
                });
              }
              en.attackCooldown = 1.2;
            }
            break;
        }
        break;
    }

    // Apply gravity for ground enemies
    if (en.type === 'heavyGuard' || en.type === 'kamikaze') {
      en.vy = Math.min(en.vy + GRAVITY * dt, MAX_FALL);
    } else { // Drones and Boss float
      en.vy = 0;
    }

    resolveEntityPlatforms(en, dt);
    // Contact damage — touching any enemy hurts the player
    if (en.type !== 'boss' && aabb(player.x, player.y, player.w, player.h, en.x, en.y, en.w, en.h)) {
      dealDamageToPlayer(1, en);
    }
    return en.y < H + 100 && en.hp > 0;  // remove if falls off screen or dies
  });

  // ── Projectile updates ────────────────────────────────────────
  projectilePool.update(proj => {
    proj.x += proj.vx * dt;
    proj.y += proj.vy * dt;

    if (aabb(player.x, player.y, player.w, player.h, proj.x, proj.y, proj.w, proj.h)) {
      dealDamageToPlayer(proj.damage, proj);
      return false; // Despawn projectile
    }

    // Collision with platforms
    let collidedPlatforms = getPlatformAt(proj.x, proj.y, proj.w, proj.h);
    if (collidedPlatforms.length > 0) {
      return false; // Despawn on wall hit
    }

    // Despawn if off-screen
    return proj.x > -20 && proj.x < currentLevelData.mapWidth + 20 && proj.y > -20 && proj.y < currentLevelData.mapHeight + 20;
  });

  // ── Coin collection ───────────────────────────────────────────
  coinPool.update(c => {
    c.bobTimer += dt;
    if (aabb(player.x,player.y,player.w,player.h, c.x,c.y,c.w,c.h) ||
        (_magnetRange > 0 && dist(player.x+player.w/2, player.y+player.h/2, c.x+c.w/2, c.y+c.h/2) < _magnetRange)) {
      player.currency += c.value;
      GAME_SCORE += c.value * _scoreMultiplier;
      spawnPopup(c.x,c.y,`+${c.value}`,'#ff0',13);
      sfx.play(880,0.07,'square',0.09);
      spawnParticles(c.x+c.w/2,c.y+c.h/2,4,{color:PALETTE.coin,speed:35,life:0.25});
      return false;
    }
    return true;
  });

  // ── Interactables ─────────────────────────────────────────────
  interactables.forEach(interact => {
    const distPlayer = Math.hypot(player.x - interact.x, player.y - interact.y);
    if (interact.type === 'recharge') {
      interact.cooldownTimer = Math.max(0, interact.cooldownTimer - dt);
      if (interact.state === 'IDLE' && aabb(player.x, player.y, player.w, player.h, interact.x, interact.y, interact.w, interact.h)) {
        player.hp = Math.min(player.maxHp, player.hp + player.maxHp * 0.25);
        player.canDash = true; // Restore dash
        interact.state = 'ACTIVATED';
        interact.cooldownTimer = 15;
        sfx.play(440, 0.3, 'sine', 0.1);
        spawnParticles(interact.x + interact.w / 2, interact.y, 50, { color: PALETTE.rechargeActivated, speed: 100, angle: Math.PI * 1.5, spread: 0.8, life: 0.5 });
      } else if (interact.state === 'ACTIVATED' && interact.cooldownTimer > 0) {
        interact.state = 'COOLDOWN';
      } else if (interact.state === 'COOLDOWN' && interact.cooldownTimer <= 0) {
        interact.state = 'IDLE';
      }
    } else if (interact.type === 'relay') {
      if (interact.state === 'LOCKED' && distPlayer < 75 && keyPressed('KeyE')) {
        let targetDoor = interactables.find(i => i.id === interact.targetId && i.type === 'door');
        if (targetDoor) {
          interact.state = 'UNLOCKED';
          targetDoor.state = 'OPENING';
          targetDoor.openTimer = 1.2;
          sfx.play(600, 0.2, 'square', 0.1);
          spawnParticles(interact.x + interact.w / 2, interact.y + interact.h / 2, 20, { color: PALETTE.relayUnlocked, speed: 50, life: 0.3, angle: Math.PI * 2, spread: Math.PI * 2 });
        }
      }
    } else if (interact.type === 'door') {
      if (interact.state === 'OPENING') {
        interact.openTimer -= dt;
        if (interact.openTimer <= 0) {
          interact.state = 'OPEN';
        }
      }
    } else if (interact.type === 'terminal') {
      interact.cooldownTimer = Math.max(0, interact.cooldownTimer - dt);
      if (interact.state === 'IDLE' && aabb(player.x, player.y, player.w, player.h, interact.x - 25, interact.y - 25, interact.w + 50, interact.h + 50)) {
        player.speedMultiplier *= 0.8;
        player.jumpVelocityMultiplier *= 0.85;
        player.canDash = false; // Disable dash
        interact.state = 'ACTIVE';
        interact.debuffActive = true;
        interact.cooldownTimer = 8; // Debuff duration
        sfx.play(150, 1.0, 'sawtooth', 0.1);
        spawnParticles(interact.x + interact.w / 2, interact.y + interact.h / 2, 30, { color: PALETTE.terminalActive, speed: 80, life: 0.5 });
      } else if (interact.state === 'ACTIVE' && interact.cooldownTimer <= 0) {
        player.speedMultiplier = 1.0;
        player.jumpVelocityMultiplier = 1.0;
        player.canDash = true;
        interact.state = 'COOLDOWN';
        interact.debuffActive = false;
        interact.cooldownTimer = 5; // Terminal cooldown
      } else if (interact.state === 'COOLDOWN' && interact.cooldownTimer <= 0) {
        interact.state = 'IDLE';
      }
    } else if (interact.type === 'exit') {
      if (aabb(player.x, player.y, player.w, player.h, interact.x, interact.y, interact.w, interact.h)) {
        player.currentLevel++;
        loadLevel(player.currentLevel);
        sfx.play(1000, 0.2, 'sine', 0.15);
      }
    }
  });

  // ── Level completion — all enemies cleared (non-boss level) ──
  const hasBoss = currentLevelData.enemies && currentLevelData.enemies.some(e => e.type === 'boss');
  const hasExit = interactables.some(i => i.type === 'exit');
  if (!hasBoss && !hasExit && enemyPool.active.length === 0 && gameState === 'playing') {
    interactables.push({x: currentLevelData.mapWidth - 60, y: 340, w: TILE_SIZE, h: TILE_SIZE * 2, type:'exit', state:'IDLE'});
    spawnPopup(W/2, H/3, 'AREA CLEAR!', '#00ff88', 22);
    sfx.play(880, 0.3, 'sine', 0.2);
  }

  // ── Death by falling ─────────────────────────────────────────
  if (player.y > H + 100) {
    dealDamageToPlayer(player.hp, {x:player.x, y:player.y}); // Instant death
  }

  // ── Camera smooth follow ─────────────────────────────────────
  let leadX = player.facingRight ? cam.LEAD_X : -cam.LEAD_X;
  cam.targetX = player.x + player.w/2 - W/2 + leadX;
  cam.targetY = player.y + player.h/2 - H/2 - 30;
  cam.x = lerp(cam.x, clamp(cam.targetX, 0, Math.max(0, currentLevelData.mapWidth - W)), cam.SMOOTH * dt);
  cam.y = lerp(cam.y, clamp(cam.targetY, 0, Math.max(0, currentLevelData.mapHeight - H)), cam.SMOOTH * dt);

  // ── Pause ─────────────────────────────────────────────────────
  if (keyPressed('Escape') || keyPressed('KeyP')) setState('paused');
}

function dealDamageToEnemy(en, damage, attackX, attackY) {
  en.hp -= damage;
  en.flashTimer = 0.1; // Flash red
  sfx.play(1000, 0.05, 'square', 0.1);
  spawnParticles(attackX, attackY, 8, { color: en.color, speed: 60, life: 0.35 });
  triggerShake(1, 3 * FIXED_DT);
  hitstopTimer = 3 * FIXED_DT;

  if (en.type === 'heavyGuard' || en.type === 'droneFlash' || en.type === 'laserTurret' || en.type === 'kamikaze') {
    en.vx = (player.x < en.x ? 1 : -1) * 16; // Knockback
    en.vy = -50;
    en.stateTimer = 0.2; // Stun duration
    en.state = 'STUNNED';
  }

  if (en.hp <= 0) {
    GAME_SCORE += en.points * _scoreMultiplier;
    spawnPopup(en.x + en.w / 2, en.y, `+${en.points}`, '#ff0', 13);
    sfx.play(660, 0.08, 'square', 0.1);
    spawnParticles(en.x + en.w / 2, en.y + en.h / 2, 12, { color: en.color, speed: 100, life: 0.5 });
    triggerShake(3, 10 * FIXED_DT);
    hitstopTimer = 5 * FIXED_DT;

    // Drop coins
    for (let i = 0; i < randInt(1, en.type === 'kamikaze' ? 0 : (en.type === 'heavyGuard' ? 2 : (en.type === 'laserTurret' ? 3 : 1))); i++) {
      coinPool.get(c => {
        c.x = en.x + en.w / 2;
        c.y = en.y + en.h / 2;
        c.vx = randFloat(-50, 50);
        c.vy = randFloat(-100, -50);
        c.value = 1;
      });
    }
    en.alive = false;

    if (en.type === 'boss') {
      interactables.push({x: en.x + en.w/2, y: en.y + en.h/2, w: TILE_SIZE, h: TILE_SIZE, type:'exit', state:'IDLE'});
      spawnPopup(en.x + en.w / 2, en.y, "BOSS DEFEATED!", '#00ff00', 20);
      sfx.play(1200, 0.5, 'sine', 0.3);
    }
  }
}

function dealDamageToPlayer(damage, source) {
  if (player.isInvincible || player.invincibleTimer > 0 || player.iframes > 0) return;

  player.hp -= damage;
  player.iframes = player.IFRAME_DUR;
  player.isKnockedBack = true;
  player.knockbackTimer = 0.25;
  player.vx = (player.x < source.x ? -1 : 1) * KNOCKBACK_VEL_X;
  player.vy = KNOCKBACK_VEL_Y;
  
  triggerShake(4, 6 * FIXED_DT);
  sfx.play(150, 0.18, 'sawtooth', 0.14);
  spawnParticles(player.x+player.w/2,player.y+player.h/2,6,{color:'#f44',speed:55});
  hitstopTimer = 8 * FIXED_DT;

  if (player.hp <= 0) {
    saveHiScore(GAME_SCORE);
    _runCoins = player.currency;
    _gameoverTimer = 1.5;
    setState('gameover');
    sfx.play(80, 0.5, 'square', 0.2); // Death sound
    spawnParticles(player.x + player.w / 2, player.y + player.h / 2, 20, { color: '#f00', speed: 150, life: 0.7 });
  }
}

function dist(x1, y1, x2, y2) {
  return Math.sqrt(Math.pow(x2 - x1, 2) + Math.pow(y2 - y1, 2));
}

// ══════════════════════════════════════════════════════════════════
// RENDER
// ══════════════════════════════════════════════════════════════════
function renderMenu() {
  ctx.fillStyle = PALETTE.bg; ctx.fillRect(0,0,W,H);
  ctx.textAlign='center';
  ctx.fillStyle='#00ccff'; ctx.font=`bold 30px 'Press Start 2P', monospace`; ctx.fillText(GAME_TITLE, W/2, H*0.30);
  ctx.fillStyle='#aaa'; ctx.font='12px system-ui,sans-serif'; ctx.fillText('← → to move  •  SPACE to jump  •  X to attack • C to dash', W/2, H*0.46);
  if(_meta.coins>0){ctx.fillStyle='#ffdd00';ctx.font='bold 13px system-ui,sans-serif';ctx.fillText(`🪙 ${_meta.coins} coins`,W/2,H*0.53);}
  ctx.fillStyle='#fff'; ctx.font='bold 16px system-ui,sans-serif'; ctx.fillText('SPACE / TAP to play', W/2, H*0.58);
  ctx.fillStyle='#888'; ctx.font='13px system-ui,sans-serif'; ctx.fillText(`BEST: ${_hiScore}`, W/2, H*0.68);
  ctx.textAlign='left';
}

function renderPlaying() {
  // Background
  ctx.fillStyle = PALETTE.bg; ctx.fillRect(0, 0, W, H);
  ctx.fillStyle = PALETTE.sky;
  ctx.fillRect(0, 0, W, H / 2); // Simple sky

  ctx.save();
  ctx.translate(-Math.round(cam.x), -Math.round(cam.y));

  // ── Platforms ────────────────────────────────────────────────
  platforms.forEach(p => {
    if (p.type === 'fragile' && p.state === 'BROKEN') return; // Don't draw broken platforms

    let platformX = p.x;
    let platformY = p.y;
    let platformW = p.w;
    let platformH = p.h;

    // Fragile platform shaking
    if (p.type === 'fragile' && p.state === 'SHAKING') {
      platformX += (Math.random() - 0.5) * 2;
      platformY += (Math.random() - 0.5) * 2;
    }
    // Bouncing platform squash
    if (p.type === 'bouncing' && p.squashTimer > 0) {
      platformY += 2; // Compress 2px
      platformH -= 2;
    }

    ctx.fillStyle = p.type === 'oneWay' ? '#2a4a2a' : PALETTE.platform;
    ctx.fillRect(platformX, platformY, platformW, platformH);
    // Top edge highlight
    ctx.fillStyle = p.type === 'oneWay' ? '#4a8a4a' : PALETTE.platTop;
    ctx.fillRect(platformX, platformY, platformW, 3);
  });

  // ── Coins ────────────────────────────────────────────────────
  coinPool.active.forEach(c => {
    let bob = Math.sin(c.bobTimer * 3.5) * 3;
    ctx.fillStyle = PALETTE.coin;
    ctx.shadowBlur = 6; ctx.shadowColor = PALETTE.coin;
    ctx.beginPath(); ctx.arc(c.x+c.w/2, c.y+c.h/2+bob, c.w/2, 0, Math.PI*2); ctx.fill();
    ctx.shadowBlur = 0;
  });

  // ── Interactables ─────────────────────────────────────────────
  interactables.forEach(interact => {
    if (interact.type === 'recharge') {
      ctx.fillStyle = interact.state === 'IDLE' ? PALETTE.rechargeIdle :
                      interact.state === 'ACTIVATED' ? PALETTE.rechargeActivated :
                      PALETTE.rechargeCooldown;
      ctx.shadowBlur = interact.state === 'IDLE' ? 10 : 0;
      ctx.shadowColor = ctx.fillStyle;
      ctx.fillRect(interact.x, interact.y, interact.w, interact.h);
      ctx.shadowBlur = 0;
    } else if (interact.type === 'relay') {
      ctx.fillStyle = interact.state === 'LOCKED' ? PALETTE.relayLocked : PALETTE.relayUnlocked;
      ctx.beginPath(); ctx.arc(interact.x + interact.w / 2, interact.y + interact.h / 2, interact.w / 2, 0, Math.PI * 2); ctx.fill();
    } else if (interact.type === 'door' && interact.state !== 'OPEN') {
      ctx.fillStyle = 'rgba(255,0,0,0.8)'; // Red opaque when closed
      if (interact.state === 'OPENING') {
        ctx.fillStyle = `rgba(0,0,255,${interact.openTimer / 1.2})`; // Fade to blue transparent
      }
      ctx.fillRect(interact.x, interact.y, interact.w, interact.h);
    } else if (interact.type === 'terminal') {
      ctx.fillStyle = interact.state === 'ACTIVE' ? PALETTE.terminalActive : PALETTE.terminalIdle;
      ctx.shadowBlur = interact.state === 'ACTIVE' ? 15 : 8;
      ctx.shadowColor = ctx.fillStyle;
      ctx.fillRect(interact.x, interact.y, interact.w, interact.h);
      ctx.shadowBlur = 0;
    } else if (interact.type === 'exit') {
      ctx.fillStyle = PALETTE.exit;
      ctx.fillRect(interact.x, interact.y, interact.w, interact.h);
      ctx.fillStyle = '#fff';
      drawText("EXIT", interact.x + interact.w / 2, interact.y + interact.h / 2, '#000', 10, 'center');
    }
  });

  // ── Enemies ──────────────────────────────────────────────────
  enemyPool.active.forEach(en => {
    ctx.globalAlpha = en.flashTimer > 0 || (player.isInvincible && Math.floor(player.isInvincible / 0.07) % 2 === 0) ? 0.35 : 1.0;
    let enemyColor = en.flashTimer > 0 ? '#fff' : en.color;
    ctx.fillStyle = enemyColor;
    ctx.shadowBlur = 5; ctx.shadowColor = enemyColor;
    ctx.beginPath();
    switch (en.type) {
      case 'heavyGuard':
        ctx.roundRect(en.x, en.y, en.w, en.h, 4); // Stocky robot
        break;
      case 'droneFlash':
        ctx.ellipse(en.x + en.w / 2, en.y + en.h / 2, en.w / 2, en.h / 2, 0, 0, Math.PI * 2); // Oval drone
        break;
      case 'laserTurret':
        ctx.roundRect(en.x, en.y, en.w, en.h, 2); // Square turret
        ctx.fillStyle = '#000';
        ctx.fillRect(en.x + en.w / 4, en.y + en.h / 4, en.w / 2, en.h / 2); // Eye
        ctx.fillStyle = enemyColor;
        break;
      case 'kamikaze':
        ctx.roundRect(en.x, en.y, en.w, en.h, 4); // Small bipedal
        ctx.fillStyle = '#000';
        ctx.fillRect(en.x + en.w / 4, en.y + en.h / 4, en.w / 2, en.h / 2); // Countdown display
        ctx.fillStyle = '#fff';
        drawText(Math.ceil(en.countdown).toString().padStart(2, '0'), en.x + en.w / 2, en.y + en.h / 2 + 5, '#fff', 10, 'center');
        ctx.fillStyle = enemyColor;
        break;
      case 'boss':
        ctx.roundRect(en.x, en.y, en.w, en.h, 8); // Large humanoid
        break;
    }
    ctx.fill();
    ctx.shadowBlur = 0;
    ctx.globalAlpha = 1;
  });

  // ── Projectiles ───────────────────────────────────────────────
  projectilePool.active.forEach(proj => {
    ctx.fillStyle = proj.color;
    ctx.shadowBlur = 8; ctx.shadowColor = proj.color;
    ctx.beginPath(); ctx.arc(proj.x, proj.y, proj.w / 2, 0, Math.PI * 2); ctx.fill();
    ctx.shadowBlur = 0;
  });

  // ── Player ───────────────────────────────────────────────────
  let blink = player.iframes > 0 && Math.floor(player.iframes / 0.07) % 2 === 0;
  if (!blink) {
    ctx.globalAlpha = player.iframes > 0 ? 0.55 : 1.0;
    let px = player.x + player.w / 2;
    let py = player.y + player.h / 2;
    let drawW = player.w * player.squashX;
    let drawH = player.h * player.squashY;

    ctx.fillStyle = PALETTE.player;
    ctx.shadowBlur = 8; ctx.shadowColor = PALETTE.player;
    ctx.beginPath();
    ctx.roundRect(px - drawW/2, py - drawH/2, drawW, drawH, 4);
    ctx.fill();
    // Eyes showing facing direction
    ctx.shadowBlur = 0; ctx.fillStyle = '#001a2e';
    let eyeX = player.facingRight ? px + 2 : px - 2;
    ctx.beginPath(); ctx.arc(eyeX, py - drawH*0.15, 4, 0, Math.PI*2); ctx.fill();
    ctx.shadowBlur = 0; ctx.globalAlpha = 1;

    // Dash trail for visual juice
    if (player.isDashing) {
      ctx.globalAlpha = 0.3;
      for (let i = 0; i < 3; i++) {
        let trailX = player.x - (player.facingRight ? 10 : -10) * (i + 1);
        ctx.beginPath();
        ctx.roundRect(trailX + player.w/2 - drawW/2, py - drawH/2, drawW, drawH, 4);
        ctx.fillStyle = `rgba(0, 204, 255, ${0.5 - i * 0.15})`;
        ctx.fill();
      }
      ctx.globalAlpha = 1;
    }

    // Power-up visual effects
    if (powerUps.superJump.active) {
      spawnParticles(player.x + player.w / 2, player.y + player.h, 1, { color: '#ffd700', speed: 20, angle: Math.PI * 1.5, spread: 0.2, life: 0.1, gravity: 0 });
    }
    if (powerUps.speed.active) {
      spawnParticles(player.x + player.w / 2 - (player.facingRight ? 5 : -5), player.y + player.h / 2, 1, { color: '#00ffff', speed: 10, angle: player.facingRight ? Math.PI : 0, spread: 0.1, life: 0.1, gravity: 0 });
    }
    if (powerUps.invincibility.active) {
      ctx.globalAlpha = Math.floor(player.invincibility.timer / 0.07) % 2 === 0 ? 0.8 : 0.2;
      ctx.fillStyle = '#ffffff';
      ctx.beginPath(); ctx.roundRect(px - drawW/2 - 2, py - drawH/2 - 2, drawW + 4, drawH + 4, 6); ctx.fill();
      ctx.globalAlpha = 1;
    }
    if (powerUps.megaJump.active) {
      spawnParticles(player.x + player.w / 2, player.y + player.h, 2, { color: '#00ccff', speed: 20, angle: Math.PI * 1.5, spread: 0.4, life: 0.1, gravity: 0 });
    }
  }

  ctx.restore();

  // ── HUD (screen-space, no camera transform) ──────────────────
  drawText(`SCORE: ${GAME_SCORE}`, 10, 22, '#fff', 14);
  drawText(`BEST: ${_hiScore}`, W - 10, 22, '#888', 12, 'right');
  drawText(`COINS: ${player.currency}`, 10, 42, PALETTE.coin, 14);

  // HP
  for (let i = 0; i < player.maxHp; i++) {
    ctx.fillStyle = i < player.hp ? '#f44' : '#333';
    ctx.beginPath(); ctx.arc(14 + i*22, H - 14, 8, 0, Math.PI*2); ctx.fill();
  }
  // Controls hint (first 5 seconds)
  if (showControlsTimer > 0) {
    ctx.fillStyle='rgba(0,0,0,0.5)'; ctx.fillRect(0,H-60,W,60);
    drawText('← → Move  •  SPACE Jump  •  X Attack  •  C Dash', W/2, H-30, '#fff', 13, 'center');
  }

  drawFloatingTexts(); // Render floating texts on top of everything
}

// ══════════════════════════════════════════════════════════════════
// START
// ══════════════════════════════════════════════════════════════════
initGame();
requestAnimationFrame(t => { lastTime = t; requestAnimationFrame(loop); });

let keys = { left:false, right:false, up:false, down:false, space:false, space_pressed:false, e:false, e_prev:false, z:false, x:false, c:false, escape:false };

let mouse = { x:0, y:0, clicked:false };

  // Dev console bridge (global scope)
  window.__devPatch = function(code) { return eval(code); };
</script>

<script id="dev-console-script">
/* DEV_CONSOLE_INJECTED */
(function(){
'use strict';
var FILENAME=window.location.pathname.split('/').pop();
var panel=document.getElementById('dev-console');
var input=document.getElementById('dev-console-input');
var btn=document.getElementById('dev-console-btn');
var undoBtn=document.getElementById('dev-console-undo');
var statusEl=document.getElementById('dev-console-status');
var closeBtn=document.getElementById('dev-console-close');
var ctxBtn=document.getElementById('dev-console-ctx-btn');
var ctxPanel=document.getElementById('dev-console-ctx');
var logPanel=document.getElementById('dev-console-log');
var codeWrap=document.getElementById('dev-console-code-wrap');
var codeToggle=document.getElementById('dev-console-code-toggle');
var codePre=document.getElementById('dev-console-code-pre');
if(!panel||!input||!btn||!statusEl)return;

// ── État interne ──
var _snapshots=[];
var _history=[];
var _histIdx=-1;
var _actionLog=[];
var MAX_UNDO=15;
var MAX_LOG=30;
var _lastCode='';

// ── Toggle code généré ──
if(codeToggle&&codeWrap&&codePre){
  codeToggle.addEventListener('click',function(){
    var isOpen=codePre.style.display==='block';
    codePre.style.display=isOpen?'none':'block';
    codeToggle.textContent=(isOpen?'▶ voir':'▼ masquer')+' le code généré';
  });
  codePre.style.display='none'; // fermé par défaut
}

function showGeneratedCode(code){
  if(!codeWrap||!codePre||!codeToggle)return;
  _lastCode=code||'';
  codePre.textContent=_lastCode;
  codeWrap.classList.add('visible');
  codePre.style.display='none'; // fermé par défaut, l'utilisateur ouvre s'il veut
  codeToggle.textContent='▶ voir le code généré ('+_lastCode.split('\n').length+' lignes)';
}

function hideGeneratedCode(){
  if(!codeWrap)return;
  codeWrap.classList.remove('visible');
  _lastCode='';
}

// ── Utilitaires UI ──
closeBtn.addEventListener('click',function(){panel.classList.remove('open');input.blur();});

function setStatus(msg,cls){
  statusEl.textContent=msg;
  statusEl.className=cls||'';
}

function addLog(prompt,ok,note){
  var t=new Date().toLocaleTimeString('fr',{hour:'2-digit',minute:'2-digit',second:'2-digit'});
  var short=prompt.length>55?prompt.slice(0,55)+'…':prompt;
  _actionLog.unshift({t:t,short:short,ok:ok,note:note||''});
  if(_actionLog.length>MAX_LOG)_actionLog.pop();
  renderLog();
}

function renderLog(){
  if(!_actionLog.length){logPanel.classList.remove('visible');return;}
  logPanel.classList.add('visible');
  logPanel.innerHTML=_actionLog.map(function(e){
    return '<span style="color:#333">'+e.t+'</span> '+
      '<span style="color:'+(e.ok?'#1a6a1a':'#6a1a1a')+'">&#8226;</span> '+
      '<span style="color:'+(e.ok?'#447744':'#774444')+'">'+e.short+'</span>'+
      (e.note?'<span style="color:#333"> → '+e.note+'</span>':'');
  }).join('<br>');
}

// ── Snapshot pour undo ──
function takeSnapshot(){
  try{
    var s={_ts:Date.now()};
    // Numériques globaux
    ['score','highScore','gold','lives','level','floor','stage','currentFloor',
     'currentDungeonFloor','currentLevel','wave','waveNumber','coins','gems',
     'playerGold','energy','mana','ammo'].forEach(function(n){
      if(typeof window[n]==='number')s[n]=window[n];
    });
    // gameState
    if(typeof gameState!=='undefined')s.gameState=gameState;
    // Joueur (plusieurs conventions)
    ['hero','player','ship','character'].forEach(function(pn){
      if(typeof window[pn]!=='undefined'&&window[pn]&&typeof window[pn]==='object'){
        var p=window[pn];
        s['_p_'+pn]={hp:p.hp,maxHp:p.maxHp,speed:p.speed,attack:p.attack||p.damage,
          defense:p.defense,mp:p.mp,maxMp:p.maxMp,level:p.level,xp:p.xp,
          x:p.x,y:p.y,invincibilityTimer:p.invincibilityTimer||0,
          classId:p.classId,vx:p.vx||0,vy:p.vy||0};
      }
    });
    // Longueurs des tableaux
    ['enemies','towers','loot','minions','projectiles','bullets','interactables',
     'powerups','particles'].forEach(function(n){
      if(typeof window[n]!=='undefined'&&Array.isArray(window[n]))s['_len_'+n]=window[n].length;
    });
    // playerStats si existe
    if(typeof playerStats!=='undefined'&&playerStats)
      s._playerStats=JSON.parse(JSON.stringify(playerStats));
    if(typeof activeBuffs!=='undefined'&&Array.isArray(activeBuffs))
      s._activeBuffs=JSON.parse(JSON.stringify(activeBuffs));
    return s;
  }catch(e){return null;}
}

function applySnapshot(s){
  if(!s)return false;
  var ok=false;
  try{
    ['score','highScore','gold','lives','level','floor','stage','currentFloor',
     'currentDungeonFloor','currentLevel','wave','waveNumber','coins','gems',
     'playerGold','energy','mana','ammo'].forEach(function(n){
      if(s[n]!==undefined&&typeof window[n]==='number'){window[n]=s[n];ok=true;}
    });
    if(s.gameState!==undefined&&typeof gameState!=='undefined'){gameState=s.gameState;ok=true;}
    ['hero','player','ship','character'].forEach(function(pn){
      var pk='_p_'+pn;
      if(s[pk]&&typeof window[pn]!=='undefined'&&window[pn]){
        var p=window[pn],sd=s[pk];
        ['hp','maxHp','speed','attack','defense','mp','maxMp','level','xp',
         'invincibilityTimer','classId','vx','vy'].forEach(function(f){
          if(sd[f]!==undefined)p[f]=sd[f];
        });
        ok=true;
      }
    });
    if(s._playerStats&&typeof playerStats!=='undefined'&&playerStats){
      Object.assign(playerStats,s._playerStats);ok=true;
    }
    if(s._activeBuffs&&typeof activeBuffs!=='undefined'&&Array.isArray(activeBuffs)){
      activeBuffs.length=0;s._activeBuffs.forEach(function(b){activeBuffs.push(b);});ok=true;
    }
  }catch(e){}
  return ok;
}

function pushSnapshot(snap){
  if(!snap)return;
  _snapshots.push(snap);
  if(_snapshots.length>MAX_UNDO)_snapshots.shift();
  undoBtn.disabled=false;
}

function updateUndoBtn(){undoBtn.disabled=_snapshots.length===0;}

undoBtn.addEventListener('click',function(){
  if(!_snapshots.length)return;
  var snap=_snapshots.pop();
  updateUndoBtn();
  var ok=applySnapshot(snap);
  var dt=Math.round((Date.now()-snap._ts)/1000);
  if(ok){setStatus('↩ Annulé (il y a '+dt+'s)','ok');}
  else{setStatus('⚠ Annulation partielle — les changements complexes (nouvelles fonctions, types) ne peuvent pas être annulés automatiquement','warn');}
});

// ── Context browser ──
ctxBtn.addEventListener('click',function(){
  if(ctxPanel.classList.contains('open')){
    ctxPanel.classList.remove('open');
    ctxBtn.classList.remove('active');
    ctxPanel.innerHTML='';
    return;
  }
  ctxBtn.classList.add('active');
  var ctx=collectContext();
  var lines=['<b style="color:#226622">═══ CONTEXTE EN TEMPS RÉEL ═══</b>'];
  Object.keys(ctx).forEach(function(k){
    var v=ctx[k];
    var vs=typeof v==='object'?JSON.stringify(v).slice(0,90):String(v);
    lines.push('<span style="color:#00cc55">'+k+'</span><span style="color:#224422">:</span> <span style="color:#88aa88">'+vs+'</span>');
  });
  if(lines.length===1)lines.push('<span style="color:#1a3a1a">Aucune variable standard détectée (jeu custom)</span>');
  ctxPanel.innerHTML=lines.join('<br>');
  ctxPanel.classList.add('open');
});

// ── Collecte du contexte runtime ──
function collectContext(){
  var ctx={};
  try{
    var stateNames=['gameState','state','currentState','phase','mode','screen'];
    stateNames.forEach(function(n){if(typeof window[n]!=='undefined')ctx[n]=window[n];});
    var scoreNames=['score','highScore','bestScore','gold','lives','level','floor','stage',
                    'currentFloor','currentDungeonFloor','currentLevel','wave','waveNumber',
                    'coins','gems','playerGold','energy','mana','ammo','kills'];
    scoreNames.forEach(function(n){if(typeof window[n]!=='undefined')ctx[n]=window[n];});
    ['hero','player','ship','character','pawn','tank'].forEach(function(pn){
      if(typeof window[pn]!=='undefined'&&window[pn]&&typeof window[pn]==='object'){
        var p=window[pn];
        ctx[pn]={hp:p.hp,maxHp:p.maxHp,x:Math.round(p.x||0),y:Math.round(p.y||0),
          speed:p.speed,level:p.level,attack:p.attack||p.damage||p.atk,
          defense:p.defense||p.def,mp:p.mp,maxMp:p.maxMp,classId:p.classId,
          invincible:!!(p.invincibilityTimer>0)};
      }
    });
    var arrNames=['enemies','towers','projectiles','bullets','particles','loot','interactables',
                  'minions','platforms','coins','items','obstacles','pieces','waves','powerups',
                  'skills','traps','buildings','npcs','allies'];
    arrNames.forEach(function(n){
      if(typeof window[n]!=='undefined'&&Array.isArray(window[n]))ctx[n+'_count']=window[n].length;
    });
    if(typeof window['boss']!=='undefined')ctx.bossAlive=window['boss']!==null;
    if(typeof window['bossGate']!=='undefined')ctx.bossGateOpen=!!(window['bossGate']&&window['bossGate'].open);
    if(typeof ENEMY_TYPES!=='undefined')ctx.enemyTypes=Object.keys(ENEMY_TYPES);
    if(typeof TOWER_TYPES!=='undefined')ctx.towerTypes=Object.keys(TOWER_TYPES);
    if(typeof ITEM_TYPES!=='undefined')ctx.itemTypes=Object.keys(ITEM_TYPES);
    if(typeof WEAPON_TYPES!=='undefined')ctx.weaponTypes=Object.keys(WEAPON_TYPES);
    if(typeof UPGRADE_TYPES!=='undefined')ctx.upgradeTypes=Object.keys(UPGRADE_TYPES);
    if(typeof HERO_CLASSES!=='undefined')ctx.heroClasses=HERO_CLASSES.map(function(c){return c.id+':'+c.name;});
    if(typeof CUSTOM_SKILLS!=='undefined')ctx.customSkills=Object.keys(CUSTOM_SKILLS);
    if(typeof CUSTOM_ATTACKS!=='undefined')ctx.customAttacks=Object.keys(CUSTOM_ATTACKS);
    var fnNames=['createEnemy','spawnBoss','generateDungeon','checkLevelUp','handleEnemyDefeat',
                 'spawnParticles','spawnFloatingText','triggerShake','createProjectile',
                 'placeTower','addTower','spawnEnemy','createTower','restartGame','resetGame',
                 'spawnWave','addPowerup','unlockSkill','applyKnockback','onBossDefeat',
                 'openShop','buyItem','saveGame','loadGame','generateLevel','nextWave',
                 'addUpgrade','applyUpgrade','createItem','dropLoot'];
    var avail=fnNames.filter(function(n){return typeof window[n]==='function';});
    if(avail.length)ctx.functions=avail;
    if(typeof playerInventory!=='undefined')ctx.inventory=playerInventory;
    if(typeof activeBuffs!=='undefined'&&Array.isArray(activeBuffs))ctx.buffs=activeBuffs.length;
    if(typeof TILE_SIZE!=='undefined')ctx.TILE_SIZE=TILE_SIZE;
    if(typeof MAP_W!=='undefined')ctx.MAP_W=MAP_W;
  }catch(e){}
  return ctx;
}

// ── Validation syntaxique client ──
function validateSyntax(code){
  var o=0,c=0,po=0,pc=0,bo=0,bc=0;
  for(var i=0;i<code.length;i++){
    var ch=code[i];
    if(ch==='{')o++;else if(ch==='}')c++;
    else if(ch==='(')po++;else if(ch===')')pc++;
    else if(ch==='[')bo++;else if(ch===']')bc++;
  }
  if(o!==c)return 'Accolades: '+o+' { pour '+c+' }';
  if(po!==pc)return 'Parenthèses: '+po+' ( pour '+pc+' )';
  if(bo!==bc)return 'Crochets: '+bo+' [ pour '+bc+' ]';
  return null;
}

// ── Exécution du code patché ──
function execCode(code,explanation){
  var synErr=validateSyntax(code);
  if(synErr){
    setStatus('⚠ Syntaxe invalide côté client: '+synErr+' — Le code ne sera pas exécuté.','err');
    return false;
  }
  try{
    if(typeof window.__devPatch==='function'){
      window.__devPatch(code);
    }else{
      // Fallback: new Function (n'accède pas aux vars locales du jeu)
      (new Function(code))();
    }
    var msg=explanation||'Patch appliqué !';
    setStatus('✅ '+msg,'ok');
    input.value='';
    return true;
  }catch(e){
    var msg=e.message||String(e);
    if(msg.indexOf('not defined')!==-1){
      var vn=(msg.split(' ')[0]||'').replace(/[^a-zA-Z0-9_]/g,'');
      msg='Variable "'+vn+'" introuvable dans ce jeu. Utilisez le bouton ctx pour voir ce qui est disponible.';
    }else if(msg.indexOf('is not a function')!==-1){
      msg='Fonction non disponible dans ce jeu: '+msg+'. Vérifiez ctx → functions.';
    }else if(msg.indexOf('Cannot read')!==-1||msg.indexOf('null')!==-1){
      msg='Accès à null/undefined: '+msg+' — Ajoutez une vérification if(variable) avant.';
    }else if(msg.indexOf('Assignment to constant')!==-1){
      msg="Impossible de modifier une constante (const). Passez par l'objet: ex TYPE.xxx au lieu de TYPE=...";
    }else if(msg.indexOf('Unexpected token')!==-1){
      msg='Erreur de syntaxe JS: '+msg;
    }
    setStatus('❌ '+msg,'err');
    return false;
  }
}

// ── Application d'un patch ──
async function applyPatch(){
  var prompt=input.value.trim();
  if(!prompt)return;
  if(_history[0]!==prompt){_history.unshift(prompt);if(_history.length>50)_history.pop();}
  _histIdx=-1;
  btn.disabled=true;
  hideGeneratedCode();
  setStatus('⏳ Génération en cours...','pending');
  var snap=takeSnapshot();
  try{
    var resp=await fetch('/api/game-patch',{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({filename:FILENAME,prompt:prompt,context:collectContext()})
    });
    if(!resp.ok){
      var errText=await resp.text();
      setStatus('❌ Erreur serveur '+resp.status+': '+errText.slice(0,80),'err');
      addLog(prompt,false,'HTTP '+resp.status);
      return;
    }
    var data=await resp.json();
    if(data.error){
      setStatus('❌ '+data.error,'err');
      addLog(prompt,false,data.error.slice(0,40));
    }else if(data.code){
      // Afficher le code avant l'exec (utile si l'exec plante)
      showGeneratedCode(data.code);
      var ok=execCode(data.code,data.explanation);
      if(ok){
        pushSnapshot(snap);
        addLog(prompt,true,data.explanation?data.explanation.slice(0,80):'');
      }else{
        // En cas d'erreur, garder le code visible automatiquement pour debug
        if(codePre)codePre.style.display='block';
        if(codeToggle)codeToggle.textContent='▼ masquer le code généré (erreur — vérifier la syntaxe)';
        addLog(prompt,false,'Erreur exec');
      }
    }else{
      setStatus('⚠ Réponse vide du serveur','warn');
      addLog(prompt,false,'réponse vide');
    }
  }catch(e){
    setStatus('❌ Réseau: '+e.message,'err');
    addLog(prompt,false,'réseau');
  }finally{btn.disabled=false;}
}

// ── Événements ──
btn.addEventListener('click',applyPatch);
input.addEventListener('keydown',function(e){
  if(e.code!=='Backquote'&&e.code!=='IntlBackslash')e.stopPropagation();
  if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();applyPatch();return;}
  if(e.key==='ArrowUp'&&!e.shiftKey&&_history.length){
    e.preventDefault();_histIdx=Math.min(_histIdx+1,_history.length-1);input.value=_history[_histIdx];
  }
  if(e.key==='ArrowDown'&&!e.shiftKey){
    e.preventDefault();_histIdx=Math.max(_histIdx-1,-1);input.value=_histIdx>=0?_history[_histIdx]:'';
  }
});
document.addEventListener('keydown',function(e){
  if(e.code==='Backquote'||e.code==='IntlBackslash'){
    e.preventDefault();
    if(panel.classList.contains('open')){
      panel.classList.remove('open');input.blur();
    }else{
      panel.classList.add('open');input.focus();
    }
  }
});
})();
</script>
