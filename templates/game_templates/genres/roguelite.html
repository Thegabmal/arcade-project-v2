function resizeCanvas(){const s=Math.min(window.innerWidth/W,window.innerHeight/H);canvas.style.width=Math.round(W*s)+'px';canvas.style.height=Math.round(H*s)+'px';canvas.width=Math.round(W*DPR);canvas.height=Math.round(H*DPR);ctx.scale(DPR,DPR);}

window.addEventListener('keyup',e=>{Keys.down[e.code]=false;Keys.released[e.code]=true;});
const Touch={active:false,stickX:0,stickY:0,startX:0,startY:0};
canvas.addEventListener('touchstart',e=>{e.preventDefault();const r=canvas.getBoundingClientRect();Touch.startX=(e.touches[0].clientX-r.left)*(W/r.width);Touch.startY=(e.touches[0].clientY-r.top)*(H/r.height);Touch.active=true;},{passive:false});
canvas.addEventListener('touchmove',e=>{e.preventDefault();const r=canvas.getBoundingClientRect();const dx=(e.touches[0].clientX-r.left)*(W/r.width)-Touch.startX,dy=(e.touches[0].clientY-r.top)*(H/r.height)-Touch.startY;const len=Math.hypot(dx,dy);Touch.stickX=len>10?dx/Math.max(len,40):0;Touch.stickY=len>10?dy/Math.max(len,40):0;},{passive:false});
canvas.addEventListener('touchend',e=>{e.preventDefault();Touch.active=false;Touch.stickX=0;Touch.stickY=0;},{passive:false});

function keyDown(c){return !!Keys.down[c];}

function createPool(factory,size){const inactive=Array.from({length:size},factory),active=[];return{active,get(fn){const o=inactive.length>0?inactive.pop():factory();o.alive=true;if(fn)fn(o);active.push(o);return o;},update(fn){for(let i=active.length-1;i>=0;i--)if(!fn(active[i])){active[i].alive=false;inactive.push(active.splice(i,1)[0]);}},clear(){while(active.length){active[0].alive=false;inactive.push(active.shift());}}};}

const Particles=createPool(()=>({alive:false,x:0,y:0,vx:0,vy:0,life:0,maxLife:0,size:3,color:'#fff',gravity:0}),200);
function spawnParticles(x,y,n,opts){opts=opts||{};for(let i=0;i<n;i++){const a=opts.angle!==undefined?opts.angle+(Math.random()-0.5)*(opts.spread||Math.PI*2):Math.random()*Math.PI*2;const sp=opts.speed||(50+Math.random()*60);Particles.get(p=>{p.x=x;p.y=y;p.vx=Math.cos(a)*sp;p.vy=Math.sin(a)*sp;p.life=p.maxLife=opts.life||(0.25+Math.random()*0.35);p.size=opts.size||(2+Math.random()*3);p.color=opts.color||'#fff';p.gravity=opts.gravity!==undefined?opts.gravity:0;});}}
function updateParticles(dt){Particles.update(p=>{p.life-=dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=p.gravity*dt;return p.life>0;});}
function drawParticles(){Particles.active.forEach(p=>{ctx.globalAlpha=p.life/p.maxLife;ctx.fillStyle=p.color;ctx.beginPath();ctx.arc(p.x,p.y,p.size*0.5,0,Math.PI*2);ctx.fill();});ctx.globalAlpha=1;}

const Popups=[];
function spawnPopup(x,y,t,c,s){Popups.push({x,y,text:t,color:c||'#fff',size:s||13,vy:-45,life:1.0});}
function updatePopups(dt){for(let i=Popups.length-1;i>=0;i--){Popups[i].y+=Popups[i].vy*dt;Popups[i].life-=dt;if(Popups[i].life<=0)Popups.splice(i,1);}}
function drawPopups(){Popups.forEach(p=>{ctx.globalAlpha=Math.min(p.life,1);ctx.fillStyle=p.color;ctx.font=`bold ${p.size}px monospace`;ctx.textAlign='center';ctx.fillText(p.text,p.x,p.y);});ctx.globalAlpha=1;ctx.textAlign='left';}

const Shake={x:0,y:0,mag:0,dur:0};
function triggerShake(m,d){Shake.mag=Math.max(Shake.mag,m);Shake.dur=Math.max(Shake.dur,d);}
function updateShake(dt){if(Shake.dur>0){Shake.dur-=dt;Shake.x=(Math.random()*2-1)*Shake.mag;Shake.y=(Math.random()*2-1)*Shake.mag;if(Shake.dur<=0){Shake.x=0;Shake.y=0;}}}

const sfx={_ctx:null,init(){try{if(!this._ctx)this._ctx=new(window.AudioContext||window.webkitAudioContext)();if(this._ctx.state==='suspended')this._ctx.resume();}catch(e){}},play(f,d,t,v){try{this.init();if(!this._ctx)return;const o=this._ctx.createOscillator(),g=this._ctx.createGain();o.type=t||'square';o.frequency.value=f||440;g.gain.setValueAtTime(v||0.10,this._ctx.currentTime);g.gain.exponentialRampToValueAtTime(0.001,this._ctx.currentTime+(d||0.1));o.connect(g);g.connect(this._ctx.destination);o.start();o.stop(this._ctx.currentTime+(d||0.1));}catch(e){}}};

function lerp(a,b,t){return a+(b-a)*t;}
function clamp(v,mn,mx){return v<mn?mn:v>mx?mx:v;}
function dist(ax,ay,bx,by){return Math.sqrt((ax-bx)**2+(ay-by)**2);}
function aabb(ax,ay,aw,ah,bx,by,bw,bh){return ax<bx+bw&&ax+aw>bx&&ay<by+bh&&ay+ah>by;}
function randInt(a,b){return a+Math.floor(Math.random()*(b-a+1));}
function randChoice(arr){return arr[Math.floor(Math.random()*arr.length)];}
function drawText(t,x,y,c,s,a){ctx.fillStyle=c||'#fff';ctx.font=`bold ${s||13}px monospace`;ctx.textAlign=a||'left';ctx.fillText(t,x,y);}
function drawBar(x,y,w,h,v,m,fg,bg){ctx.fillStyle=bg||'#333';ctx.fillRect(x,y,w,h);ctx.fillStyle=fg||'#0f0';ctx.fillRect(x,y,Math.round(w*clamp(v/m,0,1)),h);}

const FIXED_DT=1/60,MAX_DT=0.1;let lastTime=0,accumulator=0;
function loop(ts){const rd=Math.min((ts-lastTime)/1000,MAX_DT);lastTime=ts;accumulator+=rd;while(accumulator>=FIXED_DT){update(FIXED_DT);accumulator-=FIXED_DT;}renderFrame();requestAnimationFrame(loop);}
function update(dt){updateShake(dt);updateParticles(dt);updatePopups(dt);switch(gameState){case'menu':if(anyAction()){sfx.play(440,0.08,'square',0.1);startRun();setState('playing');}break;case'playing':updatePlaying(dt);break;case'levelup':updateLevelUp(dt);break;case'gameover':updateGameover(dt);break;case'shop':updateShop(dt);break;case'victory':if(anyAction()){setState('menu');}break;}flushInput();}
function renderFrame(){ctx.save();ctx.translate(Shake.x,Shake.y);switch(gameState){case'menu':renderMenu();break;case'playing':renderPlaying();break;case'levelup':renderLevelUp();break;case'gameover':renderGameover();break;case'shop':renderShop();break;case'victory':renderVictory();break;}drawParticles();drawPopups();ctx.restore();}

function generateRoom(type) {
  const border=TILE;
  const walls=[];
  // Perimeter
  walls.push({x:0,y:0,w:ROOM_W,h:border});
  walls.push({x:0,y:ROOM_H-border,w:ROOM_W,h:border});
  walls.push({x:0,y:0,w:border,h:ROOM_H});
  walls.push({x:ROOM_W-border,y:0,w:border,h:ROOM_H});

  // Random interior obstacles — [FILL: make room types distinct]
  const obstacles=[];
  if(type!=='boss'){
    const count=randInt(2,6);
    for(let i=0;i<count;i++){
      const w=randInt(1,3)*TILE, h=randInt(1,3)*TILE;
      const x=randInt(2,ROOM_W/TILE-w/TILE-2)*TILE;
      const y=randInt(2,ROOM_H/TILE-h/TILE-2)*TILE;
      walls.push({x,y,w,h});
      obstacles.push({x,y,w,h});
    }
  }

  // Enemy list
  const enemies=[];
  const difficulty=1+floorNum*0.4;
  if(type==='combat'){
    const count=randInt(3,5+floorNum);
    const pool=floorNum<2?['grunt']:floorNum<4?['grunt','archer']:['grunt','archer','shielder','elite'];
    for(let i=0;i<count;i++) enemies.push({type:randChoice(pool),x:randInt(TILE*3,ROOM_W-TILE*3),y:randInt(TILE*3,ROOM_H-TILE*3)});
  } else if(type==='elite'){
    enemies.push({type:'elite',x:ROOM_W/2,y:ROOM_H/2});
    enemies.push({type:'grunt',x:ROOM_W*0.3,y:ROOM_H*0.3});
    enemies.push({type:'grunt',x:ROOM_W*0.7,y:ROOM_H*0.7});
  } else if(type==='boss'){
    enemies.push({type:'boss',x:ROOM_W/2,y:ROOM_H*0.3});
  }

  // Loot
  const loot=[];
  if(type==='rest'){
    loot.push({type:'potion',x:ROOM_W/2-30,y:ROOM_H/2,value:40});
    loot.push({type:'gold',  x:ROOM_W/2+30,y:ROOM_H/2,value:randInt(20,50)});
  } else if(type==='treasure'){
    loot.push({type:'gold',  x:ROOM_W/2,y:ROOM_H/2,value:randInt(40,80)});
    loot.push({type:'relic', x:ROOM_W/2+40,y:ROOM_H/2,value:0});
  }

  return {type,walls,enemies,loot,cleared:type==='rest'||type==='treasure',difficulty};
}

function resolveWalls(ent,walls,dt){ent.x+=ent.vx*dt;for(const w of walls){if(aabb(ent.x,ent.y,ent.w,ent.h,w.x,w.y,w.w,w.h)){if(ent.vx>0)ent.x=w.x-ent.w;else ent.x=w.x+w.w;ent.vx=0;}}ent.y+=ent.vy*dt;for(const w of walls){if(aabb(ent.x,ent.y,ent.w,ent.h,w.x,w.y,w.w,w.h)){if(ent.vy>0)ent.y=w.y-ent.h;else ent.y=w.y+w.h;ent.vy=0;}}}

function _shopHit(px,py,x,y,w,h){return px>=x&&px<=x+w&&py>=y&&py<=y+h;}
function updateGameover(dt){_gameoverTimer-=dt;if(_gameoverTimer<=0||anyAction()){_meta.coins+=_runCoins;_saveMeta();_shopIdx=0;setState('shop');}}
function updateShop(dt){if(!anyAction())return;const mx=Mouse.clicked?Mouse.x:(Touch.justTapped?Touch.x:-1),my=Mouse.clicked?Mouse.y:(Touch.justTapped?Touch.y:-1);if(mx<0)return;const n=UPGRADES.length,cardW=Math.round(W*0.19),cardH=Math.round(H*0.32),gap=Math.round(W*0.02);const sy=Math.round(H*0.22),totalW=n*cardW+(n-1)*gap,sx=(W-totalW)/2;for(let i=0;i<n;i++){if(_shopHit(mx,my,sx+i*(cardW+gap),sy,cardW,cardH)){_shopIdx=i;if(buyUpgrade(UPGRADES[i].id)){sfx.play(660,0.12,'sine',0.1);applyUpgrades();}else sfx.play(110,0.06,'sawtooth',0.08);return;}}const btnW=160,btnH=42,btnX=(W-btnW)/2,btnY=sy+cardH+32;if(_shopHit(mx,my,btnX,btnY,btnW,btnH)){sfx.play(440,0.08,'square',0.1);startRun();setState('playing');}}
function renderShop(){ctx.fillStyle=PALETTE.shopBg;ctx.fillRect(0,0,W,H);ctx.textAlign='center';ctx.fillStyle='#fff';ctx.font='bold 22px system-ui,sans-serif';ctx.fillText('UPGRADE SHOP',W/2,Math.round(H*0.12));ctx.fillStyle='#ffdd00';ctx.font='bold 15px system-ui,sans-serif';ctx.fillText(`🪙 ${_meta.coins} coins`,W/2,Math.round(H*0.19));const n=UPGRADES.length,cardW=Math.round(W*0.19),cardH=Math.round(H*0.32),gap=Math.round(W*0.02);const sy=Math.round(H*0.22),totalW=n*cardW+(n-1)*gap,sx=(W-totalW)/2;for(let i=0;i<n;i++){const u=UPGRADES[i],lv=getUpgradeLevel(u.id),cx=sx+i*(cardW+gap);ctx.fillStyle=_shopIdx===i?PALETTE.shopSel:PALETTE.shopCard;ctx.beginPath();if(ctx.roundRect)ctx.roundRect(cx,sy,cardW,cardH,8);else ctx.rect(cx,sy,cardW,cardH);ctx.fill();ctx.fillStyle='#fff';ctx.font='bold 11px system-ui,sans-serif';ctx.fillText(u.label,cx+cardW/2,sy+22);ctx.fillStyle='#aaa';ctx.font='10px system-ui,sans-serif';ctx.fillText(u.desc,cx+cardW/2,sy+38);for(let d=0;d<u.maxLv;d++){ctx.fillStyle=d<lv?'#ffdd00':'#444';ctx.beginPath();ctx.arc(cx+cardW/2+(d-u.maxLv/2+0.5)*14,sy+cardH-36,5,0,Math.PI*2);ctx.fill();}if(lv<u.maxLv){ctx.fillStyle='#ffdd00';ctx.font='bold 12px system-ui,sans-serif';ctx.fillText(`${u.cost[lv]}🪙`,cx+cardW/2,sy+cardH-14);}else{ctx.fillStyle='#0f0';ctx.font='bold 11px system-ui,sans-serif';ctx.fillText('MAX',cx+cardW/2,sy+cardH-14);}}const btnW=160,btnH=42,btnX=(W-btnW)/2,btnY=sy+cardH+32;ctx.fillStyle='#2a1a3a';ctx.beginPath();if(ctx.roundRect)ctx.roundRect(btnX,btnY,btnW,btnH,8);else ctx.rect(btnX,btnY,btnW,btnH);ctx.fill();ctx.fillStyle='#fff';ctx.font='bold 16px system-ui,sans-serif';ctx.fillText('PLAY',W/2,btnY+27);ctx.textAlign='left';}

_loadMeta();
function startRun() {
  _loadMeta(); _runCoins=0; _gameoverTimer=1.5;
  floorNum=1; roomNum=0; runScore=0;
  totalRooms=5;
  // Reset player to base + meta bonuses
  Object.assign(player,{...BASE_STATS,hp:BASE_STATS.maxHp,xp:0,level:1,gold:0,relics:[],
    iframes:0,attackTimer:0,attackCooldown:0,dodgeTimer:0,dodgeCooldown:0,
    attack:{active:false,x:0,y:0,w:0,h:0},animTimer:0,facingX:1,facingY:0});
  applyUpgrades();
  enterRoom('combat');
}

function enterRoom(type) {
  currentRoom=generateRoom(type);
  player.x=ROOM_W/2-player.w/2; player.y=ROOM_H*0.8;
  player.vx=0; player.vy=0;
  enemyPool.clear(); projPool.clear(); lootPool.clear();
  currentRoom.enemies.forEach(eDef=>{
    const def=ENEMY_DEFS[eDef.type]||ENEMY_DEFS.grunt;
    enemyPool.get(e=>{Object.assign(e,{...def});e.x=eDef.x;e.y=eDef.y;e.hp=e.maxHp=Math.floor(def.hp*currentRoom.difficulty);e.type=eDef.type;e.state='idle';e.attackTimer=0;e.flashTimer=0;e.iframes=0;e.knockTimer=0;});
  });
  currentRoom.loot.forEach(l=>{
    lootPool.get(lo=>{lo.x=l.x;lo.y=l.y;lo.type=l.type;lo.value=l.value;lo.bobTimer=Math.random()*Math.PI*2;});
  });
  cam.x=ROOM_W/2-W/2; cam.y=ROOM_H/2-H/2;
}

function nextRoom() {
  roomNum++;
  if(roomNum>totalRooms){
    // Boss room
    saveBest(floorNum);
    enterRoom('boss');
    return;
  }
  const types=['combat','combat','elite','rest','treasure','combat'];
  const type=types[Math.min(roomNum,types.length-1)]||'combat';
  enterRoom(type);
}

// ══════════════════════════════════════════════════════════════════
// UPDATE
// ══════════════════════════════════════════════════════════════════
function updatePlaying(dt) {
  if(!currentRoom) return;

  // ── Player input ─────────────────────────────────────────────
  let dx=(keyDown('ArrowRight')||keyDown('KeyD')?1:0)-(keyDown('ArrowLeft')||keyDown('KeyA')?1:0);
  let dy=(keyDown('ArrowDown')||keyDown('KeyS')?1:0)-(keyDown('ArrowUp')||keyDown('KeyW')?1:0);
  if(Touch.active){dx=Touch.stickX;dy=Touch.stickY;}

  // ── Dodge roll ───────────────────────────────────────────────
  player.dodgeCooldown=Math.max(0,player.dodgeCooldown-dt);
  player.dodgeTimer=Math.max(0,player.dodgeTimer-dt);
  const wantDodge=keyPressed('ShiftLeft')||keyPressed('ShiftRight');
  if(wantDodge&&player.dodgeCooldown<=0&&(dx||dy)){
    player.dodgeTimer=player.DODGE_DUR;
    player.dodgeCooldown=player.DODGE_CD;
    const len=Math.hypot(dx,dy)||1;
    player.dodgeVx=dx/len*400; player.dodgeVy=dy/len*400;
    player.iframes=player.DODGE_DUR;
    sfx.play(660,0.08,'sine',0.08);
    spawnParticles(player.x+player.w/2,player.y+player.h/2,6,{color:PALETTE.player,speed:60,life:0.2,gravity:0});
  }

  // Move
  if(player.dodgeTimer>0){
    player.vx=player.dodgeVx; player.vy=player.dodgeVy;
    player.dodgeVx*=0.85; player.dodgeVy*=0.85;
  } else {
    const mag=Math.hypot(dx,dy)||0;
    if(mag>0){const nx=dx/mag,ny=dy/mag;player.vx=nx*player.moveSpd;player.vy=ny*player.moveSpd;player.facingX=nx;player.facingY=ny;}
    else{player.vx*=0.7;player.vy*=0.7;}
  }

  player.iframes=Math.max(0,player.iframes-dt);
  resolveWalls(player,currentRoom.walls,dt);
  player.animTimer+=dt;

  // ── Attack ───────────────────────────────────────────────────
  player.attackCooldown=Math.max(0,player.attackCooldown-dt);
  player.attackTimer=Math.max(0,player.attackTimer-dt);
  player.attack.active=player.attackTimer>0;

  const wantAtk=keyPressed('Space')||keyPressed('KeyZ')||keyPressed('KeyJ')||attackInput;
  if(wantAtk&&player.attackCooldown<=0){
    player.attackTimer=0.18; player.attackCooldown=player.atkSpd;
    const fx=player.facingX||1,fy=player.facingY||0;
    const hasAoe=player.relics.includes('aoe');
    const atkW=hasAoe?80:55, atkH=hasAoe?60:40;
    player.attack.x=player.x+player.w/2+fx*50-atkW/2;
    player.attack.y=player.y+player.h/2+fy*45-atkH/2;
    player.attack.w=atkW; player.attack.h=atkH;
    sfx.play(330,0.06,'sawtooth',0.09);
  }

  // Attack hits enemies
  if(player.attack.active){
    enemyPool.active.forEach(e=>{
      if(!e.alive||e.iframes>0) return;
      if(!aabb(player.attack.x,player.attack.y,player.attack.w,player.attack.h,e.x,e.y,e.w,e.h)) return;
      let dmg=player.atk+randInt(-3,3);
      if(player.relics.includes('crit')&&Math.random()<0.15) dmg*=2;
      e.hp-=dmg; e.flashTimer=0.09; e.iframes=0.20;
      const ang=Math.atan2(e.y-player.y,e.x-player.x);
      e.vx=Math.cos(ang)*160; e.vy=Math.sin(ang)*160; e.knockTimer=0.15;
      spawnParticles(e.x+e.w/2,e.y+e.h/2,5,{color:e.color,speed:55,life:0.25});
      spawnPopup(e.x+e.w/2,e.y-8,`-${dmg}`,'#fff',12);
      if(player.relics.includes('vamp')){player.hp=Math.min(player.maxHp,player.hp+Math.floor(dmg*0.1));}
      sfx.play(220,0.06,'sawtooth',0.08);
      if(e.hp<=0){
        runScore+=e.points; player.xp+=Math.floor(e.points*0.5);
        const crystal=ENEMY_DEFS[e.type].isBoss?randInt(5,10):Math.random()<0.15?1:0;
        if(crystal){lootPool.get(l=>{l.x=e.x;l.y=e.y;l.type='crystal';l.value=crystal;l.bobTimer=0;});}
        if(Math.random()<0.3){lootPool.get(l=>{l.x=e.x;l.y=e.y;l.type='gold';l.value=randInt(5,20);l.bobTimer=0;});}
        if(Math.random()<0.06){lootPool.get(l=>{l.x=e.x;l.y=e.y;l.type='potion';l.value=25;l.bobTimer=0;});}
        spawnParticles(e.x+e.w/2,e.y+e.h/2,12,{color:e.color,speed:80,life:0.4,gravity:60});
        sfx.play(440,0.10,'square',0.10);
        e.alive=false;
      }
    });
  }

  // ── Enemy update ─────────────────────────────────────────────
  enemyPool.update(e=>{
    e.flashTimer=Math.max(0,e.flashTimer-dt);
    e.iframes=Math.max(0,e.iframes-dt);
    if(e.knockTimer>0){e.knockTimer-=dt;e.vx*=0.8;e.vy*=0.8;resolveWalls(e,currentRoom.walls,dt);return true;}
    const dx2=player.x+player.w/2-(e.x+e.w/2),dy2=player.y+player.h/2-(e.y+e.h/2),d=Math.sqrt(dx2*dx2+dy2*dy2);
    const def=ENEMY_DEFS[e.type]||ENEMY_DEFS.grunt;
    if(d<def.alertRange){e.state='chase';}
    if(e.state==='chase'){
      if(def.ranged&&d<def.attackRange){
        e.attackTimer+=dt;
        if(e.attackTimer>=def.attackCD){
          e.attackTimer=0;
          const len=d||1;
          projPool.get(p=>{p.x=e.x+e.w/2;p.y=e.y+e.h/2;p.vx=dx2/len*(def.projSpeed||180);p.vy=dy2/len*(def.projSpeed||180);p.damage=def.damage;p.life=3;p.color=e.color;});
          sfx.play(660,0.04,'square',0.06);
        }
        e.vx*=0.7;e.vy*=0.7;
      } else if(!def.ranged&&d<def.attackRange){
        e.attackTimer+=dt;
        if(e.attackTimer>=def.attackCD&&player.iframes<=0){
          e.attackTimer=0;
          const dmg=Math.max(1,def.damage-player.def);
          player.hp-=dmg; player.iframes=player.IFRAME_DUR;
          player.vx+=(dx2>0?-1:1)*150; player.vy+=(dy2>0?-1:1)*150;
          triggerShake(4,0.22);sfx.play(150,0.18,'sawtooth',0.14);
          spawnParticles(player.x+player.w/2,player.y+player.h/2,6,{color:'#f44',speed:60});
          if(player.hp<=0){saveBest(floorNum);meta.crystals+=Math.floor(runScore/100);saveMeta();_runCoins=Math.floor(runScore/100);_gameoverTimer=1.5;setState('gameover');}
        }
      } else {
        if(d>0){e.vx=dx2/d*def.speed;e.vy=dy2/d*def.speed;}
      }
    }
    resolveWalls(e,currentRoom.walls,dt);
    return true;
  });

  // ── Projectiles ───────────────────────────────────────────────
  projPool.update(p=>{
    p.life-=dt;p.x+=p.vx*dt;p.y+=p.vy*dt;
    if(player.iframes<=0&&dist(p.x,p.y,player.x+player.w/2,player.y+player.h/2)<p.r+player.w/2){
      const dmg=Math.max(1,p.damage-player.def);player.hp-=dmg;player.iframes=player.IFRAME_DUR;
      triggerShake(3,0.18);sfx.play(150,0.15,'sawtooth',0.12);
      if(player.hp<=0){saveBest(floorNum);meta.crystals+=Math.floor(runScore/100);saveMeta();_runCoins=Math.floor(runScore/100);_gameoverTimer=1.5;setState('gameover');}
      return false;
    }
    return p.life>0&&p.x>-20&&p.x<ROOM_W+20&&p.y>-20&&p.y<ROOM_H+20;
  });

  // ── Loot ─────────────────────────────────────────────────────
  lootPool.update(l=>{
    l.bobTimer+=dt;
    if(aabb(player.x,player.y,player.w,player.h,l.x,l.y,l.w,l.h)){
      if(l.type==='gold'){player.gold+=l.value;runScore+=l.value;spawnPopup(l.x,l.y,`+${l.value}g`,'#ff0',12);}
      if(l.type==='potion'){player.hp=Math.min(player.maxHp,player.hp+l.value);spawnPopup(l.x,l.y,`+${l.value}HP`,'#0f0',12);}
      if(l.type==='crystal'){meta.crystals+=l.value;saveMeta();spawnPopup(l.x,l.y,`+${l.value}💎`,'#a4f',13);}
      sfx.play(880,0.07,'sine',0.09);return false;
    }
    return true;
  });

  // ── XP leveling ──────────────────────────────────────────────
  const xpNeeded=60*player.level;
  if(player.xp>=xpNeeded){player.xp-=xpNeeded;player.level++;offerUpgrades();}

  // ── Room clear → next ─────────────────────────────────────────
  if(!currentRoom.cleared&&enemyPool.active.length===0){
    currentRoom.cleared=true;
    sfx.play(660,0.15,'sine',0.10);
    spawnPopup(ROOM_W/2,ROOM_H/2-40,'ROOM CLEAR!','#ff0',16);
    // Check boss kill = floor complete
    if(currentRoom.type==='boss'){
      meta.crystals+=10*floorNum;saveMeta();
      floorNum++;roomNum=0;
      if(floorNum>5){saveBest(floorNum);setState('victory');}
      else{setTimeout(()=>enterRoom('rest'),1200);}
    }
  }

  // Door trigger — exit right side
  if(currentRoom.cleared&&player.x+player.w>ROOM_W-TILE*1.5&&currentRoom.type!=='boss'){
    nextRoom();
    return;
  }

  // ── Camera ───────────────────────────────────────────────────
  const tx=player.x+player.w/2-W/2,ty=player.y+player.h/2-H/2;
  cam.x=lerp(cam.x,clamp(tx,0,Math.max(0,ROOM_W-W)),cam.SMOOTH*dt);
  cam.y=lerp(cam.y,clamp(ty,0,Math.max(0,ROOM_H-H)),cam.SMOOTH*dt);
}

function offerUpgrades(){
  const shuffled=[...UPGRADES].sort(()=>Math.random()-0.5);
  levelUpChoices=shuffled.slice(0,3);
  setState('levelup');
}

let lvlChoice=0;
function updateLevelUp(dt){
  if(keyPressed('ArrowUp')&&lvlChoice>0)lvlChoice--;
  if(keyPressed('ArrowDown')&&lvlChoice<levelUpChoices.length-1)lvlChoice++;
  if(anyAction()){levelUpChoices[lvlChoice].apply();sfx.play(880,0.18,'sine',0.12);lvlChoice=0;setState('playing');}
}

function renderPlaying(){
  if(!currentRoom) return;
  ctx.fillStyle=PALETTE.bg;ctx.fillRect(0,0,W,H);
  ctx.save();ctx.translate(-Math.round(cam.x),-Math.round(cam.y));

  // Floor
  ctx.fillStyle=PALETTE.floor;ctx.fillRect(TILE,TILE,ROOM_W-TILE*2,ROOM_H-TILE*2);
  // [FILL: floor tiles pattern]

  // Walls
  currentRoom.walls.forEach(w=>{ctx.fillStyle=PALETTE.wall;ctx.fillRect(w.x,w.y,w.w,w.h);ctx.fillStyle=PALETTE.wallEdge;ctx.fillRect(w.x,w.y,w.w,4);});

  // Exit door indicator (right wall when cleared)
  if(currentRoom.cleared&&currentRoom.type!=='boss'){
    ctx.fillStyle='#664400';ctx.fillRect(ROOM_W-TILE,ROOM_H/2-TILE*0.8,TILE,TILE*1.6);
    drawText('EXIT→',ROOM_W-TILE-2,ROOM_H/2+6,'#ff0',10,'right');
  }

  // Loot
  lootPool.active.forEach(l=>{
    const bob=Math.sin(l.bobTimer*3)*3;
    ctx.fillStyle=l.type==='crystal'?PALETTE.crystal:l.type==='gold'?'#ff0':'#f88';
    ctx.shadowBlur=8;ctx.shadowColor=ctx.fillStyle;
    ctx.beginPath();ctx.arc(l.x+l.w/2,l.y+l.h/2+bob,l.w/2,0,Math.PI*2);ctx.fill();ctx.shadowBlur=0;
  });

  // Enemies
  enemyPool.active.forEach(e=>{
    ctx.globalAlpha=e.flashTimer>0?0.35:1.0;
    ctx.fillStyle=e.flashTimer>0?'#fff':e.color;
    ctx.shadowBlur=ENEMY_DEFS[e.type].isBoss?16:0;ctx.shadowColor=e.color;
    ctx.beginPath();ctx.arc(e.x+e.w/2,e.y+e.h/2,e.w/2,0,Math.PI*2);ctx.fill();ctx.shadowBlur=0;ctx.globalAlpha=1;
    drawBar(e.x,e.y-8,e.w,4,e.hp,e.maxHp,'#f44','#300');
  });

  // Projectiles
  projPool.active.forEach(p=>{ctx.fillStyle=p.color;ctx.shadowBlur=6;ctx.shadowColor=p.color;ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,Math.PI*2);ctx.fill();ctx.shadowBlur=0;});

  // Dodge trail
  if(player.dodgeTimer>0){ctx.fillStyle=PALETTE.dodge;ctx.beginPath();ctx.arc(player.x+player.w/2,player.y+player.h/2,player.w,0,Math.PI*2);ctx.fill();}

  // Attack hitbox
  if(player.attack.active){ctx.strokeStyle='rgba(0,200,255,0.5)';ctx.lineWidth=2;ctx.strokeRect(player.attack.x,player.attack.y,player.attack.w,player.attack.h);}

  // Player
  const blink=player.iframes>0&&player.dodgeTimer<=0&&Math.floor(player.iframes/0.07)%2===0;
  if(!blink){
    ctx.globalAlpha=player.iframes>0?0.6:1.0;
    ctx.fillStyle=PALETTE.player;ctx.shadowBlur=8;ctx.shadowColor=PALETTE.player;
    ctx.beginPath();ctx.arc(player.x+player.w/2,player.y+player.h/2,player.w/2,0,Math.PI*2);ctx.fill();ctx.shadowBlur=0;
    ctx.fillStyle='rgba(0,0,0,0.5)';ctx.beginPath();ctx.arc(player.x+player.w/2+player.facingX*8,player.y+player.h/2+player.facingY*8,4,0,Math.PI*2);ctx.fill();
    ctx.globalAlpha=1;
  }

  ctx.restore();

  // HUD
  drawText(`Floor ${floorNum}  Room ${Math.min(roomNum,totalRooms+1)}/${totalRooms+1}`,10,22,PALETTE.ui,13);
  drawText(`LV ${player.level}`,W/2,22,'#aaa',12,'center');
  drawText(`Score: ${runScore}`,W-10,22,'#888',11,'right');
  drawBar(10,H-32,140,10,player.hp,player.maxHp,'#f44','#300');drawText(`HP`,154,H-23,'#666',10);
  drawBar(10,H-18,100,6,player.xp,60*player.level,PALETTE.xp,'#133');drawText(`XP`,114,H-12,PALETTE.xp,9);
  // Dodge cooldown
  if(player.dodgeCooldown>0){drawBar(W-120,H-18,110,6,player.DODGE_CD-player.dodgeCooldown,player.DODGE_CD,'#0cf','#133');drawText('DODGE',W-125,H-12,'#0cf',9,'right');}
  // Gold & crystals
  drawText(`⚜${player.gold}g  💎${meta.crystals}`,W-10,H-32,'#ff0',11,'right');
  // Relics display
  if(player.relics.length>0)drawText('Relics: '+player.relics.join(' '),10,H-44,'#a4f',10);
}

// ══════════════════════════════════════════════════════════════════
// START
// ══════════════════════════════════════════════════════════════════
requestAnimationFrame(t=>{lastTime=t;requestAnimationFrame(loop);});
</script>
</body></html>
