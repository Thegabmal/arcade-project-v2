<!DOCTYPE html>
<html><head><title>GEM STORM</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{background:#000;display:flex;align-items:center;justify-content:center;height:100vh;overflow:hidden;}
canvas{display:block;}
</style></head><body>
<canvas id="gameCanvas"></canvas>
<script>
// ══════════════════════════════════════════════════════════════════
// ENGINE — DO NOT MODIFY
window.__devPatch = function(code) { return eval(code); };
// ══════════════════════════════════════════════════════════════════
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
const DPR = Math.min(window.devicePixelRatio || 1, 2);
let W = 480, H = 640;
function resizeCanvas() {
  const vw=window.innerWidth,vh=window.innerHeight;
  const scale=Math.min(vw/W,vh/H);
  canvas.style.width=Math.round(W*scale)+'px'; canvas.style.height=Math.round(H*scale)+'px';
  canvas.width=Math.round(W*DPR); canvas.height=Math.round(H*DPR); ctx.scale(DPR,DPR);
}
resizeCanvas(); window.addEventListener('resize',()=>{resizeCanvas();ctx.scale(DPR,DPR);});

let gameState = 'menu';
function setState(s) { gameState = s; }

const Keys={down:{},pressed:{}};
window.addEventListener('keydown',e=>{if(!Keys.down[e.code])Keys.pressed[e.code]=true;Keys.down[e.code]=true;});
window.addEventListener('keyup',e=>{Keys.down[e.code]=false;});

const Pointer={x:0,y:0,down:false,justDown:false,justUp:false,startX:0,startY:0,dragX:0,dragY:0};
function pointerDown(cx,cy){Pointer.x=cx;Pointer.y=cy;Pointer.startX=cx;Pointer.startY=cy;Pointer.dragX=0;Pointer.dragY=0;Pointer.down=true;Pointer.justDown=true;}
function pointerMove(cx,cy){Pointer.x=cx;Pointer.y=cy;Pointer.dragX=cx-Pointer.startX;Pointer.dragY=cy-Pointer.startY;}
function pointerUp(){Pointer.down=false;Pointer.justUp=true;}
canvas.addEventListener('mousedown',e=>{const r=canvas.getBoundingClientRect();pointerDown((e.clientX-r.left)*(W/r.width),(e.clientY-r.top)*(H/r.height));});
canvas.addEventListener('mousemove',e=>{const r=canvas.getBoundingClientRect();pointerMove((e.clientX-r.left)*(W/r.width),(e.clientY-r.top)*(H/r.height));});
canvas.addEventListener('mouseup',()=>pointerUp());
canvas.addEventListener('touchstart',e=>{e.preventDefault();const r=canvas.getBoundingClientRect();pointerDown((e.touches[0].clientX-r.left)*(W/r.width),(e.touches[0].clientY-r.top)*(H/r.height));},{passive:false});
canvas.addEventListener('touchmove',e=>{e.preventDefault();const r=canvas.getBoundingClientRect();pointerMove((e.touches[0].clientX-r.left)*(W/r.width),(e.touches[0].clientY-r.top)*(H/r.height));},{passive:false});
canvas.addEventListener('touchend',e=>{e.preventDefault();pointerUp();},{passive:false});

function flushInput(){Keys.pressed={};Pointer.justDown=false;Pointer.justUp=false;}

const Particles=[];
function spawnParticles(x,y,count,opts){
  opts=opts||{};
  for(let i=0;i<count;i++){
    const a=opts.angle!==undefined?opts.angle+(Math.random()-0.5)*(opts.spread||Math.PI*2):Math.random()*Math.PI*2;
    const sp=opts.speed||(50+Math.random()*80);
    Particles.push({x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,life:opts.life||(0.4+Math.random()*0.4),maxLife:opts.life||(0.4+Math.random()*0.4),size:opts.size||(3+Math.random()*4),color:opts.color||'#fff',gravity:opts.gravity!==undefined?opts.gravity:100});
  }
}
function updateParticles(dt){for(let i=Particles.length-1;i>=0;i--){const p=Particles[i];p.life-=dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=p.gravity*dt;if(p.life<=0)Particles.splice(i,1);}}
function drawParticles(){Particles.forEach(p=>{ctx.globalAlpha=Math.max(0,p.life/p.maxLife);ctx.fillStyle=p.color;ctx.beginPath();ctx.arc(p.x,p.y,p.size*0.5,0,Math.PI*2);ctx.fill();});ctx.globalAlpha=1;}

const Popups=[];
function spawnPopup(x,y,text,color,size){Popups.push({x,y,text,color:color||'#fff',size:size||14,vy:-50,life:1.2});}
function updatePopups(dt){for(let i=Popups.length-1;i>=0;i--){Popups[i].y+=Popups[i].vy*dt;Popups[i].life-=dt;if(Popups[i].life<=0)Popups.splice(i,1);}}
function drawPopups(){Popups.forEach(p=>{ctx.globalAlpha=Math.min(p.life,1);ctx.fillStyle=p.color;ctx.font=`bold ${p.size}px monospace`;ctx.textAlign='center';ctx.fillText(p.text,p.x,p.y);});ctx.globalAlpha=1;ctx.textAlign='left';}

const sfx={_ctx:null,init(){try{if(!this._ctx)this._ctx=new(window.AudioContext||window.webkitAudioContext)();if(this._ctx.state==='suspended')this._ctx.resume();}catch(e){}},
play(f,d,t,v){try{this.init();if(!this._ctx)return;const o=this._ctx.createOscillator(),g=this._ctx.createGain();o.type=t||'sine';o.frequency.value=f||440;g.gain.setValueAtTime(v||0.12,this._ctx.currentTime);g.gain.exponentialRampToValueAtTime(0.001,this._ctx.currentTime+(d||0.1));o.connect(g);g.connect(this._ctx.destination);o.start();o.stop(this._ctx.currentTime+(d||0.1));}catch(e){}}};

function lerp(a,b,t){return a+(b-a)*t;}
function clamp(v,mn,mx){return v<mn?mn:v>mx?mx:v;}
function randInt(a,b){return a+Math.floor(Math.random()*(b-a+1));}
function randFloat(a,b){return a+Math.random()*(b-a);}
function randChoice(arr){return arr[Math.floor(Math.random()*arr.length)];}
function drawText(t,x,y,c,s,a){ctx.fillStyle=c||'#fff';ctx.font=`bold ${s||14}px system-ui,sans-serif`;ctx.textAlign=a||'left';ctx.fillText(t,x,y);}
let _hiScore=parseInt(localStorage.getItem('hs_match3')||'0');
function saveHiScore(s){if(s>_hiScore){_hiScore=s;localStorage.setItem('hs_match3',s);}}

const FIXED_DT=1/60;
const MAX_DT=0.1;
let lastTime=0;
let accumulator=0;
function loop(ts){const rd=Math.min((ts-lastTime)/1000,MAX_DT);lastTime=ts;accumulator+=rd;while(accumulator>=FIXED_DT){update(FIXED_DT);accumulator-=FIXED_DT;}renderFrame();requestAnimationFrame(loop);}
function update(dt){updateParticles(dt);updatePopups(dt);switch(gameState){case'menu':if(Pointer.justDown){sfx.play(440,0.08,'sine',0.1);startGame();setState('playing');}break;case'playing':updatePlaying(dt);break;case'swapping':updateSwapping(dt);break;case'resolving':updateResolving(dt);break;case'falling':updateFalling(dt);break;case'victory':if(Pointer.justDown){nextLevel();}break;case'gameover':updateGameover(dt);break;case'shop':updateShop(dt);break;}flushInput();}
function renderFrame(){switch(gameState){case'menu':renderMenu();break;case'playing':case'swapping':case'resolving':case'falling':renderPlaying();break;case'victory':renderPlaying();renderVictoryOverlay();break;case'gameover':renderPlaying();renderGameoverOverlay();break;case'shop':renderShop();break;}drawParticles();drawPopups();}

// ══════════════════════════════════════════════════════════════════
// GAME CONSTANTS
// ══════════════════════════════════════════════════════════════════
const GAME_TITLE = 'GEM STORM';

const GEM_COLORS = ['#ff3355','#ff8800','#ffee00','#44dd44','#33aaff','#cc44ff'];
const GEM_LABELS = ['✦','◆','★','♣','▲','⬡'];
const GEM_NAMES  = ['Fire','Earth','Lightning','Nature','Water','Arcane'];

const PALETTE = {
  bg:       '#0a0a1e',
  board:    '#13133a',
  select:   '#ffffff',
  ui:       '#d8d8ff',
  accent:   '#ffdd44',
  combo:    ['#fff','#ff0','#f80','#f00','#f0f','#0ff'],
  shopBg:   '#0d0a1f',
  shopCard: '#1a1535',
  shopSel:  '#2a2558',
};

const ROWS = 8, COLS = 8;
const GEM_TYPES = GEM_COLORS.length;

const CELL = Math.floor((W - 20) / COLS);
const GRID_X = Math.floor((W - COLS * CELL) / 2);
const GRID_Y = 118;
const GRID_W = COLS * CELL;
const GRID_H = ROWS * CELL;

let GAME_SCORE = 0;
let level = 1;
let movesLeft = 30;
let cascadeDepth = 0;

let objective = { type:'score', target:1000, current:0 };

const _bgStars = Array.from({length:60}, () => ({
  x: Math.random()*480, y: Math.random()*640,
  r: 0.4 + Math.random()*1.8,
  phase: Math.random()*Math.PI*2,
  freq: 0.7 + Math.random()*1.8
}));

// ══════════════════════════════════════════════════════════════════
// GRID — DO NOT MODIFY
// ══════════════════════════════════════════════════════════════════
let grid = [];

function cellToPixel(r,c){return{x:GRID_X+c*CELL+CELL/2,y:GRID_Y+r*CELL+CELL/2};}
function pixelToCell(px,py){return{r:Math.floor((py-GRID_Y)/CELL),c:Math.floor((px-GRID_X)/CELL)};}
function inGrid(r,c){return r>=0&&r<ROWS&&c>=0&&c<COLS;}

function fillGrid(){
  grid=[];
  for(let r=0;r<ROWS;r++){grid[r]=[];for(let c=0;c<COLS;c++)grid[r][c]=makeGem(Math.floor(Math.random()*GEM_TYPES));}
  for(let pass=0;pass<3;pass++)for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++)while(causesMatch(r,c))grid[r][c].type=Math.floor(Math.random()*GEM_TYPES);
}
function makeGem(type,special){return{type:type>=0?type:Math.floor(Math.random()*GEM_TYPES),special:special||null,drawY:0,animY:0,scale:1.0};}
function causesMatch(r,c){const t=grid[r][c].type;if(c>=2&&grid[r][c-1].type===t&&grid[r][c-2].type===t)return true;if(r>=2&&grid[r-1][c].type===t&&grid[r-2][c].type===t)return true;return false;}

let selR=-1,selC=-1;
let swapState=null;
let resolveQueue=[];
let fallState=null;
let resolveTimer=0;

// ══════════════════════════════════════════════════════════════════
// MATCH DETECTION — DO NOT MODIFY
// ══════════════════════════════════════════════════════════════════
function findAllMatches(){
  const matched=new Set(),key=(r,c)=>r*COLS+c;
  for(let r=0;r<ROWS;r++){let c=0;while(c<COLS){let end=c+1;while(end<COLS&&grid[r][end].type===grid[r][c].type&&grid[r][c].type>=0)end++;if(end-c>=3)for(let k=c;k<end;k++)matched.add(key(r,k));c=end;}}
  for(let c=0;c<COLS;c++){let r=0;while(r<ROWS){let end=r+1;while(end<ROWS&&grid[end][c].type===grid[r][c].type&&grid[r][c].type>=0)end++;if(end-r>=3)for(let k=r;k<end;k++)matched.add(key(k,c));r=end;}}
  return[...matched].map(k=>({r:Math.floor(k/COLS),c:k%COLS}));
}
function getSpecialForMatch(cells){
  if(cells.length>=5)return'rainbow';
  if(cells.length===4){const allSameRow=cells.every(c2=>c2.r===cells[0].r);return allSameRow?'hline':'vline';}
  const rows=new Set(cells.map(c2=>c2.r)),cols=new Set(cells.map(c2=>c2.c));
  if(rows.size>=2&&cols.size>=2)return'bomb';
  return null;
}

// ── Meta-progression ──────────────────────────────────────────────
let _runCoins=0,_gameoverTimer=0,_shopIdx=0;
let _scoreMultiplier=1.0,_extraMoves=0;

const UPGRADES=[
  {id:'moves',   name:'Extra Moves',   desc:'+5 moves per run',        maxLevel:3,costs:[25,55,110], icon:'🔀'},
  {id:'cascade', name:'Cascade Boost', desc:'Cascade score ×1.5',      maxLevel:2,costs:[50,120],    icon:'💫'},
  {id:'special', name:'Special Gems',  desc:'Special threshold −1',    maxLevel:2,costs:[40,90],     icon:'💎'},
  {id:'coins',   name:'Gem Finder',    desc:'+25% coin yield',         maxLevel:2,costs:[35,80],     icon:'🪙'},
];
const _META_KEY='meta_match3';
let _meta={coins:0,upgrades:{}};
function loadMeta(){try{_meta=JSON.parse(localStorage.getItem(_META_KEY))||{coins:0,upgrades:{}};}catch(e){_meta={coins:0,upgrades:{}};} if(!_meta.upgrades)_meta.upgrades={};}
function saveMeta(){try{localStorage.setItem(_META_KEY,JSON.stringify(_meta));}catch(e){}}
function addRunCoins(n){_meta.coins+=Math.floor(n);saveMeta();}
function getUpgradeLevel(id){return _meta.upgrades[id]||0;}
function buyUpgrade(id){const up=UPGRADES.find(u=>u.id===id);if(!up)return false;const lvl=getUpgradeLevel(id);if(lvl>=up.maxLevel)return false;const cost=up.costs[lvl];if(_meta.coins<cost)return false;_meta.coins-=cost;_meta.upgrades[id]=lvl+1;saveMeta();return true;}

function updateGameover(dt){_gameoverTimer-=dt;if(_gameoverTimer<=0||Pointer.justDown){addRunCoins(_runCoins);_shopIdx=0;setState('shop');}}
function _shopHit(mx,my,x,y,w,h){return mx>=x&&mx<=x+w&&my>=y&&my<=y+h;}
function updateShop(dt){
  if(!Pointer.justDown)return;
  const cardW=100,cardH=128,gap=10,totalW=UPGRADES.length*cardW+(UPGRADES.length-1)*gap,sx=(W-totalW)/2,sy=Math.round(H*0.22);
  for(let i=0;i<UPGRADES.length;i++){
    if(_shopHit(Pointer.x,Pointer.y,sx+i*(cardW+gap),sy,cardW,cardH)){_shopIdx=i;if(buyUpgrade(UPGRADES[i].id)){sfx.play(660,0.12,'sine',0.1);applyUpgrades();}else sfx.play(110,0.06,'sawtooth',0.08);return;}
  }
  const btnW=160,btnH=42,btnX=(W-btnW)/2,btnY=sy+cardH+32;
  if(_shopHit(Pointer.x,Pointer.y,btnX,btnY,btnW,btnH)){sfx.play(440,0.08,'square',0.1);startGame();setState('playing');}
}
function renderShop(){
  const now=Date.now()*0.001;
  ctx.fillStyle=PALETTE.shopBg;ctx.fillRect(0,0,W,H);
  _bgStars.forEach(s=>{ctx.globalAlpha=(0.2+0.15*Math.sin(now*s.freq+s.phase));ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(s.x,s.y,s.r,0,Math.PI*2);ctx.fill();});
  ctx.globalAlpha=1;
  ctx.textAlign='center';
  ctx.shadowBlur=14;ctx.shadowColor='#cc44ff';
  ctx.fillStyle='#cc44ff';ctx.font='bold 9px "Press Start 2P",monospace';ctx.fillText('UPGRADE SHOP',W/2,Math.round(H*0.10));
  ctx.shadowBlur=0;
  ctx.fillStyle='#ffdd44';ctx.font='bold 13px system-ui,sans-serif';ctx.fillText(`🪙 ${_meta.coins} coins`,W/2,Math.round(H*0.17));
  const cardW=100,cardH=128,gap=10,totalW=UPGRADES.length*cardW+(UPGRADES.length-1)*gap,sx=(W-totalW)/2,sy=Math.round(H*0.22);
  for(let i=0;i<UPGRADES.length;i++){
    const up=UPGRADES[i],lvl=getUpgradeLevel(up.id),cx=sx+i*(cardW+gap),maxed=lvl>=up.maxLevel,canBuy=!maxed&&_meta.coins>=up.costs[lvl];
    ctx.fillStyle=i===_shopIdx?PALETTE.shopSel:PALETTE.shopCard;
    ctx.strokeStyle=maxed?'#44bb44':canBuy?'#cc44ff':'#333';ctx.lineWidth=i===_shopIdx?2:1;
    ctx.beginPath();ctx.roundRect(cx,sy,cardW,cardH,8);ctx.fill();ctx.stroke();
    ctx.font='22px system-ui,sans-serif';ctx.fillStyle='#fff';ctx.fillText(up.icon,cx+cardW/2,sy+28);
    ctx.font='bold 9px system-ui,sans-serif';ctx.fillStyle='#ddd';ctx.fillText(up.name,cx+cardW/2,sy+46);
    ctx.fillStyle='#888';ctx.font='8px system-ui,sans-serif';
    const words=up.desc.split(' ');let line='',ly=sy+60;
    words.forEach(w=>{const t=line?line+' '+w:w;if(ctx.measureText(t).width>cardW-8){ctx.fillText(line,cx+cardW/2,ly);line=w;ly+=11;}else line=t;});
    if(line)ctx.fillText(line,cx+cardW/2,ly);
    for(let p=0;p<up.maxLevel;p++){ctx.fillStyle=p<lvl?'#cc44ff':'#2a2548';ctx.beginPath();ctx.arc(cx+cardW/2-(up.maxLevel-1)*6+p*12,sy+96,4,0,Math.PI*2);ctx.fill();}
    ctx.font='bold 10px system-ui,sans-serif';ctx.fillStyle=maxed?'#44bb44':canBuy?'#ffdd44':'#555';ctx.fillText(maxed?'MAXED':`${up.costs[lvl]}🪙`,cx+cardW/2,sy+116);
  }
  const btnW=160,btnH=42,btnX=(W-btnW)/2,btnY=sy+cardH+28;
  ctx.fillStyle='#1a1050';ctx.strokeStyle='#cc44ff';ctx.lineWidth=2;ctx.beginPath();ctx.roundRect(btnX,btnY,btnW,btnH,8);ctx.fill();ctx.stroke();
  ctx.fillStyle='#fff';ctx.font='bold 15px system-ui,sans-serif';ctx.fillText('▶  PLAY',W/2,btnY+26);
  ctx.textAlign='left';
}

function applyUpgrades(){
  _extraMoves=[0,5,10,15][getUpgradeLevel('moves')];
  _scoreMultiplier=1.0+getUpgradeLevel('cascade')*0.5;
}

// ══════════════════════════════════════════════════════════════════
// GAME INIT
// ══════════════════════════════════════════════════════════════════
function initLevel(){
  loadMeta();
  movesLeft=25+Math.floor(level*2.5)+[0,5,10,15][getUpgradeLevel('moves')];
  objective=getObjective(level);
  objective.current=0;
  fillGrid();
  selR=-1;selC=-1;resolveQueue=[];fallState=null;cascadeDepth=0;
}

function getObjective(n){
  const tier=Math.floor((n-1)/3);
  const phase=(n-1)%3;
  if(phase===0) return{type:'score',target:900+tier*900,current:0};
  if(phase===1){
    const elemTypes=[0,4,5,1,2,3];
    const gt=elemTypes[tier%elemTypes.length];
    return{type:'clear_type',gemType:gt,target:12+tier*4,current:0};
  }
  return{type:'score',target:1800+tier*1400,current:0};
}

function startGame(){
  loadMeta();_runCoins=0;_gameoverTimer=1.5;
  GAME_SCORE=0;level=1;
  Popups.length=0;Particles.length=0;
  initLevel();
  applyUpgrades();
}

function nextLevel(){level++;initLevel();setState('playing');}

// ══════════════════════════════════════════════════════════════════
// UPDATE
// ══════════════════════════════════════════════════════════════════
function updatePlaying(dt){
  if(Pointer.justDown){
    const{r,c}=pixelToCell(Pointer.x,Pointer.y);
    if(!inGrid(r,c)){selR=-1;selC=-1;return;}
    if(selR===-1){selR=r;selC=c;grid[r][c].scale=1.15;sfx.play(660,0.05,'sine',0.07);}
    else{
      const dr=Math.abs(r-selR),dc=Math.abs(c-selC);
      if((dr===1&&dc===0)||(dr===0&&dc===1)){attemptSwap(selR,selC,r,c);}
      else{grid[selR][selC].scale=1.0;selR=r;selC=c;grid[r][c].scale=1.15;sfx.play(550,0.05,'sine',0.07);}
    }
  }
  if(selR>=0&&Pointer.down&&!Pointer.justDown){
    const adx=Math.abs(Pointer.dragX),ady=Math.abs(Pointer.dragY);
    if(adx>CELL*0.45||ady>CELL*0.45){
      const dr=ady>adx?(Pointer.dragY>0?1:-1):0,dc=adx>=ady?(Pointer.dragX>0?1:-1):0;
      const nr=selR+dr,nc=selC+dc;
      if(inGrid(nr,nc))attemptSwap(selR,selC,nr,nc);
    }
  }
}

function attemptSwap(r1,c1,r2,c2){
  if(selR>=0){grid[selR][selC].scale=1.0;selR=-1;selC=-1;}
  if(movesLeft<=0)return;
  const tmp={...grid[r1][c1]};
  grid[r1][c1]={...grid[r2][c2]};grid[r2][c2]=tmp;
  const matches=findAllMatches();
  grid[r2][c2]={...grid[r1][c1]};grid[r1][c1]=tmp;
  const valid=matches.length>0;
  swapState={r1,c1,r2,c2,t:0,maxT:0.14,isUndo:!valid};
  if(valid){movesLeft--;sfx.play(440,0.06,'sine',0.08);}else sfx.play(220,0.08,'sawtooth',0.06);
  setState('swapping');
}

function updateSwapping(dt){
  swapState.t+=dt;
  if(swapState.t>=swapState.maxT){
    const{r1,c1,r2,c2,isUndo}=swapState;
    if(!isUndo){const tmp={...grid[r1][c1]};grid[r1][c1]={...grid[r2][c2]};grid[r2][c2]=tmp;cascadeDepth=0;setState('resolving');startResolve();}
    else setState('playing');
    swapState=null;
  }
}

function startResolve(){
  const matches=findAllMatches();
  if(matches.length===0){checkObjective();setState('playing');return;}
  resolveQueue=matches;resolveTimer=0.12;
  const special=getSpecialForMatch(matches);
  const specThresh=Math.max(3,4-getUpgradeLevel('special'));
  if(special&&matches.length>=specThresh){
    const pivot=matches[Math.floor(matches.length/2)];
    grid[pivot.r][pivot.c].special=special;
  }
  setState('resolving');
}

function updateResolving(dt){
  resolveTimer-=dt;
  if(resolveTimer>0)return;
  const pts=Math.round(10*(cascadeDepth+1)*resolveQueue.length*_scoreMultiplier);
  GAME_SCORE+=pts;
  objective.current+=(objective.type==='clear_type'?
    resolveQueue.filter(c2=>grid[c2.r][c2.c].type===objective.gemType).length:pts);
  resolveQueue.forEach(({r,c})=>{
    const gem=grid[r][c];const{x,y}=cellToPixel(r,c);
    spawnParticles(x,y,8,{color:GEM_COLORS[gem.type]||'#fff',speed:75,life:0.5,gravity:55});
    triggerSpecial(gem.special,r,c);
    grid[r][c]={type:-1,special:null,drawY:0,animY:0,scale:1.0};
  });
  spawnPopup(GRID_X+GRID_W/2,GRID_Y+ROWS*CELL/2,
    cascadeDepth>0?`COMBO ×${cascadeDepth+1}! +${pts}`:'+'+pts,
    PALETTE.combo[Math.min(cascadeDepth,PALETTE.combo.length-1)],14);
  sfx.play(330+cascadeDepth*110,0.12,'sine',0.10);
  cascadeDepth++;
  startFall();
}

function triggerSpecial(special,r,c){
  if(!special)return;
  const blank={type:-1,special:null,drawY:0,animY:0,scale:1.0};
  if(special==='hline'){for(let cc=0;cc<COLS;cc++)if(grid[r][cc].type>=0){const{x,y}=cellToPixel(r,cc);spawnParticles(x,y,5,{color:'#fff',speed:60,life:0.4});grid[r][cc]={...blank};}}
  else if(special==='vline'){for(let rr=0;rr<ROWS;rr++)if(grid[rr][c].type>=0){const{x,y}=cellToPixel(rr,c);spawnParticles(x,y,5,{color:'#fff',speed:60,life:0.4});grid[rr][c]={...blank};}}
  else if(special==='bomb'){for(let dr=-2;dr<=2;dr++)for(let dc=-2;dc<=2;dc++){const nr=r+dr,nc=c+dc;if(inGrid(nr,nc)&&grid[nr][nc].type>=0){const{x,y}=cellToPixel(nr,nc);spawnParticles(x,y,4,{color:'#f80',speed:55,life:0.35});grid[nr][nc]={...blank};}}}
  else if(special==='rainbow'){const t=Math.floor(Math.random()*GEM_TYPES);for(let rr=0;rr<ROWS;rr++)for(let cc=0;cc<COLS;cc++)if(grid[rr][cc].type===t){const{x,y}=cellToPixel(rr,cc);spawnParticles(x,y,5,{color:GEM_COLORS[t],speed:60,life:0.4});grid[rr][cc]={...blank};}}
}

function startFall(){
  fallState={timer:0,maxT:0.18};
  for(let c=0;c<COLS;c++){
    let writeR=ROWS-1;
    for(let r=ROWS-1;r>=0;r--){
      if(grid[r][c].type>=0){
        if(r!==writeR){grid[writeR][c]=grid[r][c];grid[r][c]={type:-1,special:null,drawY:(writeR-r)*CELL,animY:(writeR-r)*CELL,scale:1.0};grid[writeR][c].animY=(writeR-r)*CELL;}
        writeR--;
      }
    }
    for(let r=writeR;r>=0;r--){grid[r][c]=makeGem(-1);grid[r][c].animY=-(writeR-r+1)*CELL;}
  }
  setState('falling');
}

function updateFalling(dt){
  fallState.timer+=dt;
  const progress=Math.min(fallState.timer/fallState.maxT,1);
  let allSettled=true;
  for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++){
    if(grid[r][c].animY!==0){
      grid[r][c].animY=lerp(grid[r][c].animY,0,progress*3.5*dt/fallState.maxT);
      if(Math.abs(grid[r][c].animY)<1)grid[r][c].animY=0;else allSettled=false;
    }
  }
  if(progress>=1&&allSettled)startResolve();
}

function checkObjective(){
  const met=objective.type==='score'?GAME_SCORE>=objective.target:objective.current>=objective.target;
  if(met){setState('victory');sfx.play(880,0.4,'sine',0.12);return;}
  if(movesLeft<=0&&findAllMatches().length===0){
    saveHiScore(GAME_SCORE);
    const coinMult=1+getUpgradeLevel('coins')*0.25;
    _runCoins=Math.floor(GAME_SCORE/80*coinMult);
    _gameoverTimer=1.5;setState('gameover');
  }
}

function triggerShake(m,d){}

// ══════════════════════════════════════════════════════════════════
// GEM DRAWING
// ══════════════════════════════════════════════════════════════════
function drawGemShape(type,R){
  ctx.beginPath();
  switch(type){
    case 0: // Fire — 6-pointed star
      for(let i=0;i<12;i++){const a=i*Math.PI/6-Math.PI/2,r2=i%2===0?R:R*0.42;i===0?ctx.moveTo(Math.cos(a)*r2,Math.sin(a)*r2):ctx.lineTo(Math.cos(a)*r2,Math.sin(a)*r2);}
      ctx.closePath();break;
    case 1: // Earth — rounded square
      ctx.roundRect(-R*0.78,-R*0.78,R*1.56,R*1.56,R*0.28);break;
    case 2: // Lightning — diamond
      ctx.moveTo(0,-R);ctx.lineTo(R*0.65,0);ctx.lineTo(0,R);ctx.lineTo(-R*0.65,0);ctx.closePath();break;
    case 3: // Nature — circle
      ctx.arc(0,0,R,0,Math.PI*2);break;
    case 4: // Water — tall ellipse
      ctx.ellipse(0,0,R*0.70,R,0,0,Math.PI*2);break;
    case 5: // Arcane — hexagon
      for(let i=0;i<6;i++){const a=i*Math.PI/3-Math.PI/6;i===0?ctx.moveTo(Math.cos(a)*R,Math.sin(a)*R):ctx.lineTo(Math.cos(a)*R,Math.sin(a)*R);}
      ctx.closePath();break;
    default:ctx.arc(0,0,R,0,Math.PI*2);
  }
}

// ══════════════════════════════════════════════════════════════════
// RENDER
// ══════════════════════════════════════════════════════════════════
function drawStars(now,alpha){
  _bgStars.forEach(s=>{
    ctx.globalAlpha=(0.25+0.35*Math.sin(now*s.freq+s.phase))*alpha;
    ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(s.x,s.y,s.r,0,Math.PI*2);ctx.fill();
  });
  ctx.globalAlpha=1;
}

function renderMenu(){
  const now=Date.now()*0.001;
  ctx.fillStyle=PALETTE.bg;ctx.fillRect(0,0,W,H);
  drawStars(now,1);

  // Title
  ctx.textAlign='center';
  ctx.shadowBlur=28;ctx.shadowColor='#cc44ff';
  ctx.fillStyle='#cc44ff';ctx.font='bold 12px "Press Start 2P",monospace';
  ctx.fillText(GAME_TITLE,W/2,H*0.20);
  ctx.shadowBlur=0;

  // Subtitle
  ctx.fillStyle='#8866aa';ctx.font='10px system-ui,sans-serif';
  ctx.fillText('ELEMENTAL MATCH-3',W/2,H*0.27);

  // Orbiting gem demo
  const ox=W/2,oy=H*0.45,orbitR=70;
  for(let i=0;i<6;i++){
    const angle=now*0.65+i*Math.PI/3;
    const gx=ox+Math.cos(angle)*orbitR,gy=oy+Math.sin(angle)*orbitR*0.52;
    const pulse=0.85+0.15*Math.sin(now*2.2+i*1.1);
    ctx.save();ctx.translate(gx,gy);ctx.scale(pulse,pulse);
    ctx.shadowBlur=12;ctx.shadowColor=GEM_COLORS[i];
    ctx.fillStyle=GEM_COLORS[i];
    drawGemShape(i,11);ctx.fill();
    // Shine
    const sh=ctx.createRadialGradient(-4,-4,0,0,0,11);
    sh.addColorStop(0,'rgba(255,255,255,0.45)');sh.addColorStop(1,'rgba(0,0,0,0)');
    ctx.fillStyle=sh;drawGemShape(i,11);ctx.fill();
    ctx.shadowBlur=0;
    ctx.restore();
  }
  // Center icon
  ctx.textAlign='center';ctx.fillStyle='rgba(255,255,255,0.08)';
  ctx.beginPath();ctx.arc(ox,oy,24,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='#fff';ctx.font='bold 14px system-ui,sans-serif';ctx.fillText('⚡',ox,oy+5);

  ctx.fillStyle='#8888bb';ctx.font='11px system-ui,sans-serif';
  ctx.fillText('Swap gems to match 3 or more',W/2,H*0.635);
  ctx.fillText('Chain combos for massive scores!',W/2,H*0.68);

  if(_meta.coins>0){ctx.fillStyle='#ffdd44';ctx.font='bold 12px system-ui,sans-serif';ctx.fillText(`🪙 ${_meta.coins} coins`,W/2,H*0.745);}

  const pulse2=0.65+0.35*Math.sin(now*2.8);
  ctx.globalAlpha=pulse2;
  ctx.fillStyle='#fff';ctx.font='bold 14px system-ui,sans-serif';
  ctx.fillText('TAP / CLICK TO PLAY',W/2,H*0.845);
  ctx.globalAlpha=1;
  ctx.fillStyle='#444466';ctx.font='11px system-ui,sans-serif';
  ctx.fillText(`BEST: ${_hiScore}`,W/2,H*0.905);
  ctx.textAlign='left';
}

function renderVictoryOverlay(){
  ctx.fillStyle='rgba(0,0,0,0.68)';ctx.fillRect(0,0,W,H);
  ctx.textAlign='center';
  ctx.shadowBlur=20;ctx.shadowColor='#ffdd44';
  ctx.fillStyle='#ffdd44';ctx.font='bold 20px system-ui,sans-serif';
  ctx.fillText('⚡ LEVEL CLEAR! ⚡',W/2,H*0.36);
  ctx.shadowBlur=0;
  ctx.fillStyle='#fff';ctx.font='bold 15px system-ui,sans-serif';ctx.fillText(`SCORE: ${GAME_SCORE}`,W/2,H*0.47);
  ctx.fillStyle='#aaa';ctx.font='12px system-ui,sans-serif';ctx.fillText('TAP to continue →',W/2,H*0.60);
  ctx.textAlign='left';
}

function renderGameoverOverlay(){
  ctx.fillStyle='rgba(0,0,0,0.74)';ctx.fillRect(0,0,W,H);
  ctx.textAlign='center';
  ctx.fillStyle='#ff3355';ctx.font='bold 22px system-ui,sans-serif';ctx.fillText('OUT OF MOVES',W/2,H*0.36);
  ctx.fillStyle='#fff';ctx.font='bold 15px system-ui,sans-serif';ctx.fillText(`SCORE: ${GAME_SCORE}`,W/2,H*0.46);
  ctx.fillStyle='#ffdd44';ctx.font='bold 13px system-ui,sans-serif';ctx.fillText(`BEST: ${_hiScore}`,W/2,H*0.54);
  if(_runCoins>0){ctx.fillStyle='#ffdd44';ctx.font='bold 12px system-ui,sans-serif';ctx.fillText(`🪙 +${_runCoins} coins`,W/2,H*0.62);}
  ctx.fillStyle='#666688';ctx.font='11px system-ui,sans-serif';ctx.fillText('Opening shop...',W/2,H*0.71);
  ctx.textAlign='left';
}

function renderPlaying(){
  const now=Date.now()*0.001;
  ctx.fillStyle=PALETTE.bg;ctx.fillRect(0,0,W,H);
  drawStars(now,0.55);

  // Soft glow behind board
  const grd=ctx.createRadialGradient(W/2,GRID_Y+GRID_H/2,20,W/2,GRID_Y+GRID_H/2,230);
  grd.addColorStop(0,'rgba(80,30,160,0.22)');grd.addColorStop(1,'rgba(0,0,0,0)');
  ctx.fillStyle=grd;ctx.fillRect(0,0,W,H);

  // Grid background
  ctx.fillStyle=PALETTE.board;
  ctx.beginPath();ctx.roundRect(GRID_X-4,GRID_Y-4,GRID_W+8,GRID_H+8,8);ctx.fill();

  // Grid lines
  ctx.strokeStyle='rgba(255,255,255,0.05)';ctx.lineWidth=1;
  for(let r=0;r<=ROWS;r++){ctx.beginPath();ctx.moveTo(GRID_X,GRID_Y+r*CELL);ctx.lineTo(GRID_X+GRID_W,GRID_Y+r*CELL);ctx.stroke();}
  for(let c=0;c<=COLS;c++){ctx.beginPath();ctx.moveTo(GRID_X+c*CELL,GRID_Y);ctx.lineTo(GRID_X+c*CELL,GRID_Y+GRID_H);ctx.stroke();}

  // Gems (clipped to board)
  ctx.save();ctx.beginPath();ctx.rect(GRID_X,GRID_Y,GRID_W,GRID_H);ctx.clip();
  for(let r=0;r<ROWS;r++){
    for(let c=0;c<COLS;c++){
      const gem=grid[r][c];
      if(gem.type<0)continue;
      const{x,y}=cellToPixel(r,c);
      const ay=gem.animY||0;
      const selected=r===selR&&c===selC;
      const sc=gem.scale||1.0;
      const R=(CELL/2-3)*sc;

      ctx.save();ctx.translate(x,y+ay);
      if(selected){ctx.shadowBlur=20;ctx.shadowColor='#fff';}
      else{ctx.shadowBlur=7;ctx.shadowColor=GEM_COLORS[gem.type];}

      // Gem fill
      ctx.fillStyle=GEM_COLORS[gem.type];
      drawGemShape(gem.type,R);ctx.fill();

      // Radial shine
      ctx.shadowBlur=0;
      const shine=ctx.createRadialGradient(-R*0.28,-R*0.30,0,0,0,R);
      shine.addColorStop(0,'rgba(255,255,255,0.42)');
      shine.addColorStop(0.55,'rgba(255,255,255,0.06)');
      shine.addColorStop(1,'rgba(0,0,0,0.18)');
      ctx.fillStyle=shine;drawGemShape(gem.type,R);ctx.fill();

      // Icon
      ctx.fillStyle='rgba(0,0,0,0.50)';
      ctx.font=`bold ${Math.round(R*0.88)}px monospace`;
      ctx.textAlign='center';ctx.textBaseline='middle';
      ctx.fillText(GEM_LABELS[gem.type]||'●',0,1);

      // Special ring
      if(gem.special){ctx.strokeStyle='#fff';ctx.lineWidth=2;ctx.beginPath();ctx.arc(0,0,R+2,0,Math.PI*2);ctx.stroke();}
      // Selection ring
      if(selected){ctx.strokeStyle='#fff';ctx.lineWidth=2.5;ctx.globalAlpha=0.85;ctx.beginPath();ctx.arc(0,0,R+5,0,Math.PI*2);ctx.stroke();}
      ctx.restore();
    }
  }
  ctx.restore();

  // Swap animation overlay
  if(swapState){
    const{r1,c1,r2,c2,t,maxT,isUndo}=swapState;
    const prog=Math.min(t/maxT,1);
    const{x:x1,y:y1}=cellToPixel(r1,c1),{x:x2,y:y2}=cellToPixel(r2,c2);
    const gem1=grid[r1][c1];
    if(gem1.type>=0){
      const cx2=lerp(x1,x2,isUndo?1-prog:prog),cy2=lerp(y1,y2,isUndo?1-prog:prog);
      ctx.save();ctx.translate(cx2,cy2);
      ctx.fillStyle=GEM_COLORS[gem1.type];drawGemShape(gem1.type,CELL/2-5);ctx.fill();
      ctx.restore();
    }
  }

  // HUD — title
  ctx.textAlign='center';
  ctx.shadowBlur=8;ctx.shadowColor='#cc44ff';
  ctx.fillStyle='#cc44ff';ctx.font='bold 8px "Press Start 2P",monospace';
  ctx.fillText(GAME_TITLE,W/2,16);
  ctx.shadowBlur=0;

  // HUD — score / level / best
  ctx.font='bold 12px system-ui,sans-serif';
  ctx.fillStyle=PALETTE.ui;ctx.textAlign='left';ctx.fillText(`SCORE: ${GAME_SCORE}`,8,32);
  ctx.fillStyle='#888899';ctx.textAlign='center';ctx.fillText(`LV ${level}`,W/2,32);
  ctx.fillStyle='#555577';ctx.textAlign='right';ctx.fillText(`BEST: ${_hiScore}`,W-8,32);

  // Moves
  const movCol=movesLeft<=5?'#ff3355':movesLeft<=10?'#ff8800':PALETTE.ui;
  ctx.textAlign='left';ctx.fillStyle=movCol;
  ctx.font='bold 12px system-ui,sans-serif';
  ctx.fillText(`MOVES: ${movesLeft}`,8,GRID_Y+GRID_H+20);

  // Objective text
  let objTxt;
  if(objective.type==='score'){
    objTxt=`GOAL: ${GAME_SCORE}/${objective.target}`;
  }else{
    const eName=GEM_NAMES[objective.gemType]||'gem';
    objTxt=`${eName}: ${objective.current}/${objective.target}`;
  }
  ctx.textAlign='right';ctx.fillStyle=PALETTE.accent;
  ctx.font='bold 11px system-ui,sans-serif';
  ctx.fillText(objTxt,W-8,GRID_Y+GRID_H+20);

  // Objective progress bar
  const objPct=objective.type==='score'?Math.min(GAME_SCORE/objective.target,1):Math.min(objective.current/objective.target,1);
  const barX=8,barY=GRID_Y+GRID_H+26,barW=W-16,barH=5;
  ctx.fillStyle='#22223a';ctx.fillRect(barX,barY,barW,barH);
  const barColor=objective.type==='clear_type'?GEM_COLORS[objective.gemType]:PALETTE.accent;
  ctx.fillStyle=barColor;ctx.fillRect(barX,barY,Math.round(objPct*barW),barH);

  ctx.textAlign='left';ctx.textBaseline='alphabetic';
}

// ══════════════════════════════════════════════════════════════════
// START
// ══════════════════════════════════════════════════════════════════
initLevel();
requestAnimationFrame(t=>{lastTime=t;requestAnimationFrame(loop);});
