canvas{display:block;}

</style></head><body>
<canvas id="gameCanvas"></canvas>
<script>
// ══════════════════════════════════════════════════════════════════
// ENGINE — DO NOT MODIFY
window.__devPatch=function(code){return eval(code);};
const canvas=document.getElementById('gameCanvas');
const ctx=canvas.getContext('2d');
const DPR=Math.min(window.devicePixelRatio||1,2);
const GAME_W=800,GAME_H=600;
let W=GAME_W,H=GAME_H;
function resizeCanvas(){const s=Math.min(window.innerWidth/W,window.innerHeight/H);canvas.style.width=Math.round(W*s)+'px';canvas.style.height=Math.round(H*s)+'px';canvas.width=Math.round(W*DPR);canvas.height=Math.round(H*DPR);ctx.scale(DPR,DPR);}
resizeCanvas();window.addEventListener('resize',()=>{resizeCanvas();ctx.scale(DPR,DPR);});

let gameState='title';
function setState(s){prevState=gameState;gameState=s;}
let prevState='title';

const Keys={down:{},pressed:{}};
window.addEventListener('keydown',e=>{if(!Keys.down[e.code])Keys.pressed[e.code]=true;Keys.down[e.code]=true;if(['Space','Enter','ArrowUp','ArrowDown','Escape'].includes(e.code))e.preventDefault();});
window.addEventListener('keyup',e=>{Keys.down[e.code]=false;});
const Pointer={x:0,y:0,justDown:false};
canvas.addEventListener('mousedown',e=>{const r=canvas.getBoundingClientRect();Pointer.x=(e.clientX-r.left)*(W/r.width);Pointer.y=(e.clientY-r.top)*(H/r.height);Pointer.justDown=true;});
canvas.addEventListener('touchstart',e=>{e.preventDefault();const r=canvas.getBoundingClientRect();Pointer.x=(e.touches[0].clientX-r.left)*(W/r.width);Pointer.y=(e.touches[0].clientY-r.top)*(H/r.height);Pointer.justDown=true;},{passive:false});
canvas.addEventListener('contextmenu',e=>e.preventDefault());

function keyPressed(c){return!!Keys.pressed[c];}
function anyAdvance(){return keyPressed('Space')||keyPressed('Enter')||Pointer.justDown;}
function flushInput(){Keys.pressed={};Pointer.justDown=false;}

const sfx={_ctx:null,init(){try{if(!this._ctx)this._ctx=new(window.AudioContext||window.webkitAudioContext)();if(this._ctx.state==='suspended')this._ctx.resume();}catch(e){}},
play(f,d,t,v){try{this.init();if(!this._ctx)return;const o=this._ctx.createOscillator(),g=this._ctx.createGain();o.type=t||'sine';o.frequency.value=f||440;g.gain.setValueAtTime(v||0.08,this._ctx.currentTime);g.gain.exponentialRampToValueAtTime(0.001,this._ctx.currentTime+(d||0.15));o.connect(g);g.connect(this._ctx.destination);o.start();o.stop(this._ctx.currentTime+(d||0.15));}catch(e){}}};

const bgm={_ctx:null,_osc:null,_gain:null,
  start(freq,vol){try{this.stop();this.init();const o=this._ctx.createOscillator(),g=this._ctx.createGain();o.type='sine';o.frequency.value=freq||220;g.gain.value=vol||0.04;o.connect(g);g.connect(this._ctx.destination);o.start();this._osc=o;this._gain=g;}catch(e){}},
  stop(){try{if(this._osc)this._osc.stop();}catch(e){}this._osc=null;},
  init(){try{if(!this._ctx)this._ctx=new(window.AudioContext||window.webkitAudioContext)();}catch(e){}}
};

function lerp(a,b,t){return a+(b-a)*t;}
function clamp(v,mn,mx){return v<mn?mn:v>mx?mx:v;}
function randInt(a,b){return a+Math.floor(Math.random()*(b-a+1));}
function randFloat(a,b){return a+Math.random()*(b-a);}
function randChoice(arr){return arr[Math.floor(Math.random()*arr.length)];}

const FIXED_DT=1/60;
const MAX_DT=0.1;
let lastTime=0;
let accumulator=0;
function loop(ts){const rd=Math.min((ts-lastTime)/1000,MAX_DT);lastTime=ts;accumulator+=rd;while(accumulator>=FIXED_DT){update(FIXED_DT);accumulator-=FIXED_DT;}renderFrame();requestAnimationFrame(loop);}
function anyAction(){return keyPressed('Space')||keyPressed('Enter')||Pointer.justDown;}
function update(dt){
  bgAnim+=dt;
  switch(gameState){
    case'title':   updateTitle(dt);   break;
    case'scene':   updateScene(dt);   break;
    case'choices': updateChoices(dt); break;
    case'history': if(keyPressed('Escape')||keyPressed('KeyH')||Pointer.justDown){setState(prevState);}break;
    case'credits': updateGameover(dt);break;
    case'shop':    updateShop(dt);    break;
  }
  flushInput();
}
function renderFrame(){
  switch(gameState){
    case'title':   renderTitle();   break;
    case'scene':   renderScene();   break;
    case'choices': renderScene();renderChoicesOverlay(); break;
    case'history': renderScene();renderHistoryOverlay(); break;
    case'credits': renderCredits(); break;
    case'shop':    renderShop();    break;
  }
}
// ══════════════════════════════════════════════════════════════════

  nameText:'#88eeff',text:'#d8e8f0',textShadow:'rgba(0,0,0,0.8)',
  choiceBg:'rgba(5,15,35,0.94)',choiceSel:'rgba(0,80,120,0.94)',
  choiceBorder:'rgba(0,160,200,0.6)',ui:'#88aacc',accent:'#00ffcc',
  shopBg:'#020a10',shopCard:'#041828',shopSel:'#083848',

// CHARACTERS
const CHARACTERS={
  mira:    {name:'Dr. Mira',   color:'#66bbff',hairColor:'#111122',eyeColor:'#44aaff',skinColor:'#ecc8a0',clothing:'#1a3a5a',pos:'left'},

// STORY SCRIPT — First Contact narrative, 3 endings
const SCRIPT=[

   chars:[{id:'mira',pos:'left',expression:'surprised'}],

   chars:[{id:'mira',pos:'left',expression:'neutral'}],
   speaker:null,text:'How do you proceed?',
   choices:[
     {text:"Wake Dr. Holden — you need a second opinion",      goto:'wake_holden'},

   chars:[{id:'mira',pos:'left',expression:'happy'},{id:'holden',pos:'right',expression:'surprised'}],
   speaker:'mira',text:'Look at the interval structure. Primes up to 89. Then Fibonacci. Then — I think — a periodic table reference. This is intentional, Holden.',next:'holden_reacts'},

  {id:'holden_reacts',bg:'observatory',
   chars:[{id:'mira',pos:'left',expression:'neutral'},{id:'holden',pos:'right',expression:'neutral'}],
   speaker:'holden',text:'Even if it is... we have protocols. We report up the chain immediately. This is not our decision to make alone.',next:'holden_choice'},

  {id:'holden_choice',bg:'observatory',
   chars:[{id:'mira',pos:'left',expression:'neutral'},{id:'holden',pos:'right',expression:'neutral'}],
   speaker:null,text:'What do you do?',
   choices:[
     {text:'"You\'re right. We report it now."',    goto:'report_command'},

   ]},

  {id:'buy_time',bg:'signal_room',setFlag:{bought_time:true},

  {id:'alone_path',bg:'signal_room',setFlag:{went_alone:true},
   chars:[{id:'mira',pos:'left',expression:'neutral'}],
   speaker:'mira',text:"The pattern deepens the longer I listen. There's a layer beneath the mathematics — something that almost resembles... syntax. A grammar.",next:'signal_responds'},

  {id:'signal_responds',bg:'signal_room',bgm:280,
   chars:[{id:'mira',pos:'left',expression:'surprised'},{id:'signal',pos:'right',expression:'neutral'}],
   speaker:null,text:'[The signal shifts. Responds. As if it heard you thinking about it.]',next:'signal_speaks'},

  {id:'signal_speaks',bg:'signal_room',
   chars:[{id:'mira',pos:'left',expression:'surprised'},{id:'signal',pos:'right',expression:'happy'}],
   speaker:'signal',text:'... WE HAVE BEEN LISTENING. YOU HAVE BEEN LOUD FOR A LONG TIME. WE WERE WAITING FOR YOU TO LEARN TO LISTEN.',next:'mira_responds'},

  {id:'mira_responds',bg:'signal_room',
   chars:[{id:'mira',pos:'left',expression:'happy'},{id:'signal',pos:'right',expression:'neutral'}],
   speaker:'mira',text:'"Who are you? Where are you from? Why us, why now?"',next:'signal_answers'},

  {id:'signal_answers',bg:'deep_space',
   chars:[{id:'mira',pos:'left',expression:'surprised'},{id:'signal',pos:'right',expression:'happy'}],
   speaker:'signal',text:'... WE ARE WHAT COMES AFTER ASKING. DISTANCE IS A UNIT YOU INVENTED. NOW — ARE YOU AFRAID?',next:'choice2'},

  {id:'choice2',bg:'deep_space',
   chars:[{id:'mira',pos:'left',expression:'neutral'},{id:'signal',pos:'right',expression:'neutral'}],

     {text:'"No. I\'m not afraid. Tell me everything."',  goto:'contact_achieved'},

   end:'good'},

  {id:'mira_doubt',bg:'observatory',
   chars:[{id:'mira',pos:'left',expression:'sad'}],
   speaker:'mira',text:"The right thing. The signal went quiet the moment we filed the report. As if it understood what we'd done.",next:'ending_neutral'},

  {id:'ending_neutral',bg:'deep_space',
   chars:[{id:'mira',pos:'left',expression:'sad'}],

// STORY ENGINE — DO NOT MODIFY
let nodeIndex=0,currentNode=null,typePos=0,typeTimer=0,textComplete=false,autoTimer=0;
let autoMode=false,skipMode=false,choiceIndex=0,flags={},visitedNodes=new Set();
const history=[],historyScroll={offset:0};
let bgAnim=0,bgTransition={from:null,to:null,t:1},currentBgKey='observatory',charFade={};

function getNode(id){return SCRIPT.find(n=>n.id===id)||null;}
function gotoNode(id){
  const node=getNode(id);if(!node){console.warn('Node not found:',id);return;}
  if(currentNode)bgTransition={from:currentNode.bg,to:node.bg,t:node.bg!==currentNode.bg?0:1};
  else bgTransition={from:node.bg,to:node.bg,t:1};
  if(node.setFlag)Object.assign(flags,node.setFlag);
  currentNode=node;visitedNodes.add(id);
  typePos=0;typeTimer=0;textComplete=false;autoTimer=0;choiceIndex=0;
  if(node.text&&node.text.trim()){
    if(history.length===0||history[history.length-1].text!==node.text){
      history.push({speaker:node.speaker&&CHARACTERS[node.speaker]?CHARACTERS[node.speaker].name:null,text:node.text});
    }
  }
  if(node.end){handleEnding(node.end);return;}
  if(node.choices&&node.choices.length>0)setState('choices');else setState('scene');
  if(node.bgm!==undefined)bgm.start(node.bgm,0.04);
  if(node.bgm===null)bgm.stop();
}
function handleEnding(type){bgm.stop();_runCoins=Math.floor(visitedNodes.size/2);_gameoverTimer=1.5;setTimeout(()=>setState('credits'),1000);}
function advanceScene(){if(!currentNode)return;if(!textComplete){typePos=currentNode.text.length;textComplete=true;return;}if(currentNode.next)gotoNode(currentNode.next);}
function updateTitle(dt){if(anyAdvance()){sfx.play(440,0.12,'sine',0.10);gotoNode(SCRIPT[0].id);}}
function updateScene(dt){
  if(!currentNode)return;
  const speed=skipMode?TYPE_SPEED_SKIP:TYPE_SPEED;
  if(!textComplete&&currentNode.text){
    typeTimer+=dt;const target=Math.floor(typeTimer*speed);
    if(target>=currentNode.text.length){typePos=currentNode.text.length;textComplete=true;autoTimer=0;sfx.play(660,0.04,'sine',0.04);}
    else if(target>typePos){typePos=target;if(typePos%4===0)sfx.play(380+Math.random()*60,0.025,'sine',0.035);}
  }
  if(textComplete&&autoMode){autoTimer+=dt;if(autoTimer>=AUTO_DELAY)advanceScene();}
  if(keyPressed('Escape'))setState('history');
  if(keyPressed('KeyA'))autoMode=!autoMode;
  if(keyPressed('KeyS'))skipMode=!skipMode;
  if(keyPressed('KeyH'))setState('history');
  if(anyAdvance())advanceScene();
}
function updateChoices(dt){
  if(!currentNode||!currentNode.choices)return;
  const valid=currentNode.choices.filter(c=>!c.requireFlag||flags[c.requireFlag]);
  if(keyPressed('ArrowUp')&&choiceIndex>0){choiceIndex--;sfx.play(550,0.05,'sine',0.06);}
  if(keyPressed('ArrowDown')&&choiceIndex<valid.length-1){choiceIndex++;sfx.play(550,0.05,'sine',0.06);}
  if(anyAdvance()){
    let idx=choiceIndex;
    if(Pointer.justDown){const cy=H/2-valid.length*30;valid.forEach((_,i)=>{if(Pointer.y>cy+i*70&&Pointer.y<cy+i*70+58)idx=i;});}
    const chosen=valid[idx];
    if(chosen){if(chosen.setFlag)Object.assign(flags,chosen.setFlag);sfx.play(660,0.08,'square',0.09);gotoNode(chosen.goto);}
  }
}

// BACKGROUNDS
function drawBg(key){
  const bgs={
    observatory:()=>{
      const g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#010508');g.addColorStop(1,'#02080f');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
      // Stars
      for(let i=0;i<100;i++){const sx=(i*137.5)%W,sy=(i*89.3)%(H*0.6);ctx.fillStyle=`rgba(200,220,255,${0.2+0.5*(i%3===0?1:0.3)})`;ctx.beginPath();ctx.arc(sx,sy,i%20===0?1.5:0.8,0,Math.PI*2);ctx.fill();}
      // Radio dish silhouette
      ctx.fillStyle='#0a0e14';ctx.fillRect(0,H*0.55,W,H*0.45);
      ctx.strokeStyle='#1a2030';ctx.lineWidth=3;
      ctx.beginPath();ctx.moveTo(W*0.5,H*0.55);ctx.lineTo(W*0.5,H*0.35);ctx.stroke();
      ctx.beginPath();ctx.arc(W*0.5,H*0.35,80,0,Math.PI,false);ctx.stroke();
      ctx.strokeStyle='rgba(0,150,255,0.2)';ctx.lineWidth=1;
      ctx.beginPath();ctx.moveTo(0,H*0.54);ctx.lineTo(W,H*0.54);ctx.stroke();
      // Control panel glow
      [[80,H*0.65,120,20],[240,H*0.68,80,16],[560,H*0.63,140,22]].forEach(([px,py,pw,ph])=>{ctx.fillStyle='rgba(0,100,200,0.12)';ctx.fillRect(px,py,pw,ph);ctx.strokeStyle='rgba(0,150,255,0.25)';ctx.lineWidth=1;ctx.strokeRect(px,py,pw,ph);});
    },
    signal_room:()=>{
      ctx.fillStyle='#010510';ctx.fillRect(0,0,W,H);
      // Wave visualization
      const t=bgAnim;ctx.strokeStyle='rgba(0,220,255,0.35)';ctx.lineWidth=2;
      for(let wave=0;wave<3;wave++){
        ctx.beginPath();ctx.moveTo(0,H/2);
        for(let x=0;x<W;x+=4){const y=H/2+Math.sin(x*0.02+t*(1+wave*0.3))*40*(1-wave*0.2)+Math.sin(x*0.05+t*2)*(20-wave*5);ctx.lineTo(x,y);}
        ctx.globalAlpha=0.4-wave*0.1;ctx.stroke();ctx.globalAlpha=1;
      }
      // Data readouts
      ctx.fillStyle='rgba(0,200,255,0.06)';ctx.fillRect(0,0,W,H);
      ctx.fillStyle='rgba(0,255,200,0.08)';
      for(let x=0;x<W;x+=40){ctx.fillRect(x,0,1,H);}
      // Pulsing circle (signal source)
      const pulseR=50+Math.sin(t*3)*8;ctx.strokeStyle=`rgba(0,255,200,0.4)`;ctx.lineWidth=2;ctx.shadowBlur=15;ctx.shadowColor='#00ffcc';ctx.beginPath();ctx.arc(W*0.7,H*0.4,pulseR,0,Math.PI*2);ctx.stroke();ctx.shadowBlur=0;
    },
    deep_space:()=>{
      const g=ctx.createRadialGradient(W/2,H/2,0,W/2,H/2,W*0.8);g.addColorStop(0,'#060818');g.addColorStop(1,'#000208');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
      // Star field
      for(let i=0;i<180;i++){const t2=i*0.618*Math.PI*2,r=Math.sqrt(i/180)*W*0.5;const sx=W/2+Math.cos(t2)*r,sy=H/2+Math.sin(t2)*r;ctx.fillStyle=`rgba(200,220,255,${i%5===0?0.8:0.3})`;ctx.beginPath();ctx.arc(sx,sy,i%15===0?1.5:0.8,0,Math.PI*2);ctx.fill();}
      // Nebula cloud
      ctx.fillStyle='rgba(40,0,80,0.25)';ctx.shadowBlur=60;ctx.shadowColor='rgba(100,0,200,0.3)';ctx.beginPath();ctx.arc(W*0.3,H*0.35,100,0,Math.PI*2);ctx.fill();ctx.shadowBlur=0;
      ctx.fillStyle='rgba(0,20,80,0.20)';ctx.beginPath();ctx.arc(W*0.7,H*0.6,80,0,Math.PI*2);ctx.fill();
    },
    dawn:()=>{
      const g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#010820');g.addColorStop(0.4,'#180828');g.addColorStop(0.7,'#380818');g.addColorStop(1,'#603010');
      ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
      // Horizon glow
      const hr=ctx.createRadialGradient(W/2,H,0,W/2,H,W*0.8);hr.addColorStop(0,'rgba(255,120,30,0.4)');hr.addColorStop(0.4,'rgba(255,60,10,0.15)');hr.addColorStop(1,'transparent');
      ctx.fillStyle=hr;ctx.fillRect(0,0,W,H);
      // Stars fading
      for(let i=0;i<60;i++){const sx=(i*137.5)%W,sy=(i*89.3)%(H*0.5);ctx.fillStyle=`rgba(255,255,255,${0.15*(1-sy/(H*0.5))})`;ctx.beginPath();ctx.arc(sx,sy,0.8,0,Math.PI*2);ctx.fill();}
      // Observatory horizon silhouette
      ctx.fillStyle='#0a0810';ctx.fillRect(0,H*0.75,W,H*0.25);
      ctx.fillStyle='#080610';
      [120,360,600].forEach(tx=>{ctx.beginPath();ctx.moveTo(tx,H*0.75);ctx.lineTo(tx+10,H*0.55);ctx.lineTo(tx+20,H*0.75);ctx.fill();});
    },
  };
  (bgs[key]||bgs.observatory)();
}

// CHARACTER DRAWING
function drawCharacter(charId,pos,expression,alpha){
  const def=CHARACTERS[charId];if(!def||charId==='narrator')return;
  const x=pos==='left'?80:pos==='right'?W-240:W/2-80;
  const baseY=H*0.08,h=H*0.78;
  ctx.globalAlpha=clamp(alpha||1,0,1);
  if(charId==='signal'){
    // Signal entity — abstract geometric form
    ctx.shadowBlur=30;ctx.shadowColor='#00ffcc';
    const cx2=x+80,cy2=baseY+h*0.45,t2=bgAnim;
    // Core rings
    [60,45,30].forEach((r,i)=>{ctx.strokeStyle=`rgba(0,255,200,${0.3+i*0.15})`;ctx.lineWidth=2;ctx.beginPath();ctx.arc(cx2,cy2,r,t2*(0.5+i*0.2),t2*(0.5+i*0.2)+Math.PI*1.5);ctx.stroke();});
    // Radiating lines
    for(let i=0;i<8;i++){const ang=t2*0.8+i*Math.PI/4;const len=70+Math.sin(t2*2+i)*15;ctx.strokeStyle='rgba(0,220,180,0.22)';ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(cx2,cy2);ctx.lineTo(cx2+Math.cos(ang)*len,cy2+Math.sin(ang)*len);ctx.stroke();}
    // Centre
    ctx.fillStyle='#00ffcc';ctx.beginPath();ctx.arc(cx2,cy2,10,0,Math.PI*2);ctx.fill();ctx.shadowBlur=0;
    ctx.globalAlpha=1;return;
  }
  // Clothing body
  ctx.fillStyle=def.clothing||'#333';ctx.beginPath();ctx.ellipse(x+80,baseY+h*0.75,50,h*0.34,0,0,Math.PI*2);ctx.fill();
  // Torso
  ctx.fillStyle=def.clothing;ctx.beginPath();ctx.ellipse(x+80,baseY+h*0.52,32,h*0.15,0,0,Math.PI*2);ctx.fill();
  // Head
  ctx.fillStyle=def.skinColor||'#c4a87a';ctx.beginPath();ctx.arc(x+80,baseY+h*0.26,44,0,Math.PI*2);ctx.fill();
  // Hair
  if(def.hairColor){ctx.fillStyle=def.hairColor;ctx.beginPath();ctx.arc(x+80,baseY+h*0.22,46,Math.PI,0);ctx.fill();ctx.fillRect(x+34,baseY+h*0.22,92,20);}
  // Eyes
  if(def.eyeColor){
    const eyeY=baseY+h*0.275;
    const brow=expression==='angry'?-6:expression==='surprised'?-10:expression==='sad'?3:0;
    ctx.strokeStyle='rgba(0,0,0,0.7)';ctx.lineWidth=3;
    ctx.beginPath();ctx.moveTo(x+55,eyeY-11+brow);ctx.lineTo(x+72,eyeY-9+brow);ctx.stroke();
    ctx.beginPath();ctx.moveTo(x+107,eyeY-9+brow);ctx.lineTo(x+124,eyeY-11+brow);ctx.stroke();
    ctx.fillStyle=def.eyeColor;ctx.beginPath();ctx.ellipse(x+63,eyeY,10,expression==='happy'?7:11,0,0,Math.PI*2);ctx.fill();
    ctx.beginPath();ctx.ellipse(x+115,eyeY,10,expression==='happy'?7:11,0,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='#000';ctx.beginPath();ctx.arc(x+63,eyeY,5,0,Math.PI*2);ctx.fill();ctx.beginPath();ctx.arc(x+115,eyeY,5,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='rgba(255,255,255,0.6)';ctx.beginPath();ctx.arc(x+66,eyeY-3,3,0,Math.PI*2);ctx.fill();ctx.beginPath();ctx.arc(x+118,eyeY-3,3,0,Math.PI*2);ctx.fill();
  }
  // Mouth
  const mouthY=baseY+h*0.33;ctx.strokeStyle='rgba(0,0,0,0.6)';ctx.lineWidth=2.5;ctx.beginPath();
  if(expression==='happy')ctx.arc(x+80,mouthY,17,0.05*Math.PI,0.95*Math.PI);
  else if(expression==='sad')ctx.arc(x+80,mouthY+12,17,1.05*Math.PI,1.95*Math.PI);
  else if(expression==='angry'){ctx.arc(x+80,mouthY+8,12,1.1*Math.PI,1.9*Math.PI);}
  else if(expression==='surprised'){ctx.arc(x+80,mouthY+4,9,0,Math.PI*2);}
  else{ctx.moveTo(x+63,mouthY+4);ctx.lineTo(x+97,mouthY+4);}
  ctx.stroke();
  // Character detail: Mira has earpiece
  if(charId==='mira'){ctx.fillStyle='#00aaff';ctx.beginPath();ctx.arc(x+34,baseY+h*0.28,5,0,Math.PI*2);ctx.fill();}
  ctx.globalAlpha=1;
}

// TEXT BOX HELPER
function drawWrappedText(text,x,y,maxW,color,font,lineH){
  ctx.fillStyle=color;ctx.font=font;ctx.textAlign='left';
  const words=text.slice(0,typePos).split(' ');let line='',cy=y;
  for(const w of words){const t=line+(line?' ':'')+w;if(ctx.measureText(t).width>maxW&&line){ctx.fillText(line,x,cy);line=w;cy+=lineH;}else line=t;}
  if(line)ctx.fillText(line,x,cy);
}

// RENDER
function renderTitle(){
  drawBg('observatory');ctx.fillStyle='rgba(0,0,0,0.65)';ctx.fillRect(0,0,W,H);
  ctx.fillStyle=PALETTE.textbox;ctx.beginPath();ctx.roundRect(W/2-280,H*0.22,560,220,10);ctx.fill();
  ctx.strokeStyle=PALETTE.boxBorder;ctx.lineWidth=1.5;ctx.beginPath();ctx.roundRect(W/2-280,H*0.22,560,220,10);ctx.stroke();
  ctx.fillStyle=PALETTE.nameText;ctx.font='bold 32px system-ui,sans-serif';ctx.textAlign='center';ctx.fillText(GAME_TITLE,W/2,H*0.33);
  ctx.fillStyle=PALETTE.text;ctx.font='14px system-ui,sans-serif';ctx.fillText(GAME_SUBTITLE,W/2,H*0.43);
  ctx.fillStyle='#556677';ctx.font='12px system-ui,sans-serif';ctx.fillText(GAME_AUTHOR,W/2,H*0.50);
  if(_meta.coins>0){ctx.fillStyle='#00ffcc';ctx.font='bold 13px system-ui,sans-serif';ctx.fillText(`◈ ${_meta.coins} coins`,W/2,H*0.57);}
  const pulse=0.7+0.3*Math.sin(bgAnim*2.5);
  ctx.globalAlpha=pulse;ctx.fillStyle='#88ddff';ctx.font='bold 13px system-ui,sans-serif';ctx.fillText('CLICK OR PRESS SPACE TO BEGIN',W/2,H*0.66);ctx.globalAlpha=1;
  ctx.textAlign='left';
}

function renderScene(){
  if(!currentNode)return;
  bgTransition.t=Math.min(1,(bgTransition.t||0)+FIXED_DT*2.5);
  drawBg(bgTransition.from||currentNode.bg);
  if(bgTransition.t<1&&bgTransition.to&&bgTransition.to!==bgTransition.from){ctx.globalAlpha=bgTransition.t;drawBg(bgTransition.to);ctx.globalAlpha=1;}
  if(bgTransition.t>=1){currentBgKey=bgTransition.to||currentNode.bg;bgTransition.from=currentBgKey;}
  if(currentNode.chars){
    currentNode.chars.forEach(c=>{
      if(c.id==='narrator')return;
      charFade[c.id]=lerp(charFade[c.id]||0,1,0.12);
      const isSpeaking=c.id===currentNode.speaker;
      drawCharacter(c.id,c.pos,c.expression||'neutral',isSpeaking?1.0:(charFade[c.id]||0)*0.52);
    });
  }
  if(!currentNode.text||!currentNode.text.trim())return;
  const boxX=30,boxY=H-178,boxW=W-60,boxH=158;
  ctx.fillStyle=PALETTE.textbox;ctx.beginPath();ctx.roundRect(boxX,boxY,boxW,boxH,10);ctx.fill();
  ctx.strokeStyle=PALETTE.boxBorder;ctx.lineWidth=1.5;ctx.beginPath();ctx.roundRect(boxX,boxY,boxW,boxH,10);ctx.stroke();
  if(currentNode.speaker&&CHARACTERS[currentNode.speaker]&&currentNode.speaker!=='narrator'){
    const def=CHARACTERS[currentNode.speaker];
    ctx.font='bold 15px system-ui,sans-serif';
    const nameW=ctx.measureText(def.name).width+24;
    ctx.fillStyle=PALETTE.nameBg;ctx.beginPath();ctx.roundRect(boxX+10,boxY-28,nameW,28,5);ctx.fill();
    ctx.strokeStyle=PALETTE.nameBorder;ctx.lineWidth=1;ctx.beginPath();ctx.roundRect(boxX+10,boxY-28,nameW,28,5);ctx.stroke();
    ctx.fillStyle=PALETTE.nameText;ctx.textAlign='left';ctx.fillText(def.name,boxX+22,boxY-9);
  }
  drawWrappedText(currentNode.text,boxX+20,boxY+28,boxW-40,PALETTE.text,"16px 'Georgia',serif",27);
  if(textComplete){const pulse=0.6+0.4*Math.sin(bgAnim*4);ctx.globalAlpha=pulse;ctx.fillStyle='#88aacc';ctx.font='bold 13px monospace';ctx.textAlign='right';ctx.fillText('▼ SPACE',W-44,boxY+boxH-16);ctx.globalAlpha=1;ctx.textAlign='left';}
  ctx.fillStyle='rgba(255,255,255,0.30)';ctx.font='10px monospace';ctx.textAlign='right';
  if(autoMode)ctx.fillText('[AUTO]',W-10,20);if(skipMode)ctx.fillText('[SKIP]',W-10,32);
  ctx.fillText('[H] History',W-10,H-8);ctx.textAlign='left';
}

function renderChoicesOverlay(){
  if(!currentNode||!currentNode.choices)return;
  const valid=currentNode.choices.filter(c=>!c.requireFlag||flags[c.requireFlag]);
  ctx.fillStyle='rgba(0,0,0,0.58)';ctx.fillRect(0,0,W,H);
  const totalH=valid.length*70,startY=H/2-totalH/2;
  ctx.fillStyle=PALETTE.ui;ctx.font='bold 13px system-ui,sans-serif';ctx.textAlign='center';
  ctx.fillText('— What will you do? —',W/2,startY-24);
  valid.forEach((ch,i)=>{
    const y=startY+i*70;
    const sel=i===choiceIndex;
    ctx.fillStyle=sel?PALETTE.choiceSel:PALETTE.choiceBg;ctx.beginPath();ctx.roundRect(80,y,W-160,55,8);ctx.fill();
    ctx.strokeStyle=sel?PALETTE.nameBorder:PALETTE.choiceBorder;ctx.lineWidth=sel?1.8:1;ctx.beginPath();ctx.roundRect(80,y,W-160,55,8);ctx.stroke();
    ctx.fillStyle=sel?'#fff':PALETTE.text;ctx.font=`${sel?'bold ':''} 15px 'Georgia',serif`;ctx.textAlign='center';ctx.fillText((sel?'▶  ':'')+ch.text,W/2,y+32);
  });
  ctx.textAlign='left';
}

function renderHistoryOverlay(){
  ctx.fillStyle='rgba(0,0,0,0.90)';ctx.fillRect(0,0,W,H);
  ctx.strokeStyle=PALETTE.boxBorder;ctx.lineWidth=1;ctx.strokeRect(20,20,W-40,H-40);
  ctx.fillStyle=PALETTE.nameText;ctx.font='bold 14px system-ui,sans-serif';ctx.textAlign='center';ctx.fillText('— History Log —',W/2,48);
  const startY=70,lineH=22,maxLines=Math.floor((H-100)/lineH);
  const slice=history.slice(Math.max(0,history.length-maxLines),history.length);
  slice.forEach((h,i)=>{
    if(h.speaker){ctx.fillStyle=PALETTE.nameText;ctx.font='bold 12px system-ui,sans-serif';ctx.textAlign='left';ctx.fillText(h.speaker+':',30,startY+i*lineH);}
    ctx.fillStyle=PALETTE.text;ctx.font="13px 'Georgia',serif";ctx.textAlign='left';
    const indent=h.speaker?100:30;ctx.fillText(h.text.length>76?h.text.slice(0,73)+'...':h.text,indent,startY+i*lineH);
  });
  ctx.fillStyle='rgba(255,255,255,0.4)';ctx.font='11px system-ui,sans-serif';ctx.textAlign='center';ctx.fillText('CLICK or ESC to close',W/2,H-30);ctx.textAlign='left';
}

function renderCredits(){
  drawBg(currentBgKey||'deep_space');ctx.fillStyle='rgba(0,0,0,0.75)';ctx.fillRect(0,0,W,H);
  let endType='';if(flags.full_contact)endType='■ ENDING: CONTACT';else if(flags.reported)endType='■ ENDING: CONTAINMENT';else endType='■ ENDING: SILENCE';
  const lines=[GAME_TITLE,'',endType,'','Written for the Arcade Project',`Scenes visited: ${visitedNodes.size}`,'','Thank you for listening.'];
  lines.forEach((l,i)=>{
    const y=H/2-lines.length*18+i*36;
    ctx.fillStyle=i===0?PALETTE.nameText:i===2?PALETTE.accent:'#aabbcc';
    ctx.font=`${i===0?'bold 26':'15'}px system-ui,sans-serif`;ctx.textAlign='center';ctx.fillText(l,W/2,y);
  });
  const pulse=0.6+0.4*Math.sin(bgAnim*2);ctx.globalAlpha=pulse;ctx.fillStyle='#556677';ctx.font='12px system-ui,sans-serif';ctx.fillText('CLICK to return to title',W/2,H-40);ctx.globalAlpha=1;ctx.textAlign='left';
}

// META PROGRESSION
const _META_KEY='meta_last_transmission';
const UPGRADES=[
  {id:'routes',  label:'Extra Routes', desc:'Unlock new paths',   maxLv:3,cost:[60,120,200]},
  {id:'hint',    label:'Hint System',  desc:'Show scene hints',   maxLv:3,cost:[50,100,170]},
  {id:'skip',    label:'Fast Skip',    desc:'2× skip speed/lv',   maxLv:3,cost:[40,80,140]},
  {id:'gallery', label:'Gallery',      desc:'Unlock extra scenes', maxLv:3,cost:[70,140,230]},
];
let _meta={coins:0,upgrades:{}},_runCoins=0,_gameoverTimer=1.5,_shopIdx=0;
let _skipMultiplier=1,_hintsEnabled=false,_extraRoutes=0;
function loadMeta(){try{const s=localStorage.getItem(_META_KEY);_meta=s?JSON.parse(s):{coins:0,upgrades:{}};}catch(e){_meta={coins:0,upgrades:{}};}}
function saveMeta(){try{localStorage.setItem(_META_KEY,JSON.stringify(_meta));}catch(e){}}
function getUpgradeLevel(id){return(_meta.upgrades[id]||0);}
function buyUpgrade(id){const u=UPGRADES.find(x=>x.id===id);if(!u)return false;const lv=getUpgradeLevel(id);if(lv>=u.maxLv)return false;const cost=u.cost[lv];if(_meta.coins<cost)return false;_meta.coins-=cost;_meta.upgrades[id]=(lv+1);saveMeta();return true;}
function applyUpgrades(){_skipMultiplier=1+getUpgradeLevel('skip');_hintsEnabled=getUpgradeLevel('hint')>=1;_extraRoutes=getUpgradeLevel('routes');}
function _shopHit(px,py,x,y,w,h){return px>=x&&px<=x+w&&py>=y&&py<=y+h;}
function updateGameover(dt){_gameoverTimer-=dt;if(_gameoverTimer<=0||anyAction()){_meta.coins+=_runCoins;saveMeta();_shopIdx=0;setState('shop');}}
function updateShop(dt){if(!Pointer.justDown)return;const n=UPGRADES.length,cardW=Math.round(W*0.19),cardH=Math.round(H*0.32),gap=Math.round(W*0.02);const sy=Math.round(H*0.22),totalW=n*cardW+(n-1)*gap,sx=(W-totalW)/2;for(let i=0;i<n;i++){if(_shopHit(Pointer.x,Pointer.y,sx+i*(cardW+gap),sy,cardW,cardH)){_shopIdx=i;if(buyUpgrade(UPGRADES[i].id)){sfx.play(660,0.12,'sine',0.1);applyUpgrades();}else sfx.play(110,0.06,'sawtooth',0.08);return;}}const btnW=160,btnH=42,btnX=(W-btnW)/2,btnY=sy+cardH+32;if(_shopHit(Pointer.x,Pointer.y,btnX,btnY,btnW,btnH)){sfx.play(440,0.08,'square',0.1);setState('title');}}
function renderShop(){ctx.fillStyle=PALETTE.shopBg;ctx.fillRect(0,0,W,H);ctx.textAlign='center';ctx.fillStyle='#fff';ctx.font='bold 22px system-ui,sans-serif';ctx.fillText('UPGRADE SHOP',W/2,Math.round(H*0.12));ctx.fillStyle='#00ffcc';ctx.font='bold 15px system-ui,sans-serif';ctx.fillText(`◈ ${_meta.coins} coins`,W/2,Math.round(H*0.19));const n=UPGRADES.length,cardW=Math.round(W*0.19),cardH=Math.round(H*0.32),gap=Math.round(W*0.02);const sy=Math.round(H*0.22),totalW=n*cardW+(n-1)*gap,sx=(W-totalW)/2;for(let i=0;i<n;i++){const u=UPGRADES[i],lv=getUpgradeLevel(u.id),cx=sx+i*(cardW+gap);ctx.fillStyle=_shopIdx===i?PALETTE.shopSel:PALETTE.shopCard;ctx.beginPath();if(ctx.roundRect)ctx.roundRect(cx,sy,cardW,cardH,8);else ctx.rect(cx,sy,cardW,cardH);ctx.fill();ctx.strokeStyle=_shopIdx===i?PALETTE.boxBorder:'rgba(0,100,150,0.3)';ctx.lineWidth=1;ctx.beginPath();if(ctx.roundRect)ctx.roundRect(cx,sy,cardW,cardH,8);else ctx.rect(cx,sy,cardW,cardH);ctx.stroke();ctx.fillStyle='#fff';ctx.font='bold 11px system-ui,sans-serif';ctx.fillText(u.label,cx+cardW/2,sy+22);ctx.fillStyle='#aaa';ctx.font='10px system-ui,sans-serif';ctx.fillText(u.desc,cx+cardW/2,sy+38);for(let d=0;d<u.maxLv;d++){ctx.fillStyle=d<lv?'#00ffcc':'#224';ctx.beginPath();ctx.arc(cx+cardW/2+(d-u.maxLv/2+0.5)*14,sy+cardH-36,5,0,Math.PI*2);ctx.fill();}if(lv<u.maxLv){ctx.fillStyle='#00ffcc';ctx.font='bold 12px system-ui,sans-serif';ctx.fillText(`${u.cost[lv]}◈`,cx+cardW/2,sy+cardH-14);}else{ctx.fillStyle='#0f0';ctx.font='bold 11px system-ui,sans-serif';ctx.fillText('MAX',cx+cardW/2,sy+cardH-14);}}const btnW=160,btnH=42,btnX=(W-btnW)/2,btnY=sy+cardH+32;ctx.fillStyle=PALETTE.shopCard;ctx.beginPath();if(ctx.roundRect)ctx.roundRect(btnX,btnY,btnW,btnH,8);else ctx.rect(btnX,btnY,btnW,btnH);ctx.fill();ctx.strokeStyle=PALETTE.boxBorder;ctx.lineWidth=1;ctx.beginPath();if(ctx.roundRect)ctx.roundRect(btnX,btnY,btnW,btnH,8);else ctx.rect(btnX,btnY,btnW,btnH);ctx.stroke();ctx.fillStyle='#00ffcc';ctx.font='bold 16px system-ui,sans-serif';ctx.fillText('PLAY',W/2,btnY+27);ctx.textAlign='left';}

loadMeta();applyUpgrades();
requestAnimationFrame(t=>{lastTime=t;requestAnimationFrame(loop);});
</script>
