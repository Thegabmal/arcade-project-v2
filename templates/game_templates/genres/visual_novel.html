function getNode(id) { return SCRIPT.find(n=>n.id===id)||null; }

function gotoNode(id) {
  const node=getNode(id);
  if(!node){console.warn('Node not found:',id);return;}
  if(currentNode) bgTransition={from:currentNode.bg,to:node.bg,t:node.bg!==currentNode.bg?0:1};
  else bgTransition={from:node.bg,to:node.bg,t:1};

  if(node.setFlag) Object.assign(flags,node.setFlag);
  currentNode=node; visitedNodes.add(id);
  typePos=0; typeTimer=0; textComplete=false; autoTimer=0; choiceIndex=0;

  if(node.text&&node.text.trim()){
    if(history.length===0||history[history.length-1].text!==node.text){
      history.push({speaker:node.speaker&&CHARACTERS[node.speaker]?CHARACTERS[node.speaker].name:null, text:node.text});
    }
  }

  if(node.end){ handleEnding(node.end); return; }
  if(node.choices&&node.choices.length>0) setState('choices');
  else setState('scene');

  if(node.bgm!==undefined) bgm.start(node.bgm,0.04);
  if(node.bgm===null) bgm.stop();
}

function handleEnding(type){
  bgm.stop();
  _runCoins=Math.floor(visitedNodes.size/2); _gameoverTimer=1.5;
  setTimeout(()=>setState('credits'),1000);
}

function advanceScene(){
  if(!currentNode) return;
  if(!textComplete){ typePos=currentNode.text.length; textComplete=true; return; }
  if(currentNode.next) gotoNode(currentNode.next);
}

function updateTitle(dt){if(anyAdvance()){sfx.play(440,0.12,'sine',0.10);gotoNode(SCRIPT[0].id);}}

function updateScene(dt){
  if(!currentNode) return;
  const speed=skipMode?TYPE_SPEED_SKIP:TYPE_SPEED;
  if(!textComplete&&currentNode.text){
    typeTimer+=dt;
    const target=Math.floor(typeTimer*speed);
    if(target>=currentNode.text.length){typePos=currentNode.text.length;textComplete=true;autoTimer=0;sfx.play(660,0.04,'sine',0.04);}
    else if(target>typePos){typePos=target;if(typePos%4===0)sfx.play(380+Math.random()*60,0.025,'sine',0.035);}
  }
  if(textComplete&&autoMode){autoTimer+=dt;if(autoTimer>=AUTO_DELAY)advanceScene();}
  if(keyPressed('Escape')) setState('history');
  if(keyPressed('KeyA')) autoMode=!autoMode;
  if(keyPressed('KeyS')) skipMode=!skipMode;
  if(keyPressed('KeyH')) setState('history');
  if(anyAdvance()) advanceScene();
}

function updateChoices(dt){
  if(!currentNode||!currentNode.choices) return;
  const valid=currentNode.choices.filter(c=>!c.requireFlag||flags[c.requireFlag]);
  if(keyPressed('ArrowUp')&&choiceIndex>0){choiceIndex--;sfx.play(550,0.05,'sine',0.06);}
  if(keyPressed('ArrowDown')&&choiceIndex<valid.length-1){choiceIndex++;sfx.play(550,0.05,'sine',0.06);}
  if(anyAdvance()){
    let idx=choiceIndex;
    if(Pointer.justDown){
      const choiceY=H/2-valid.length*30;
      valid.forEach((_,i)=>{if(Pointer.y>choiceY+i*70&&Pointer.y<choiceY+i*70+58)idx=i;});
    }
    const chosen=valid[idx];
    if(chosen){
      if(chosen.setFlag)Object.assign(flags,chosen.setFlag);
      sfx.play(660,0.08,'square',0.09);
      gotoNode(chosen.goto);
    }
  }
}

      // Station panels
      ctx.fillStyle='#0d1520';ctx.fillRect(0,H*0.55,W,H*0.45);
      ctx.fillStyle='#0f1a28';for(let i=0;i<8;i++){const x=i*(W/8);ctx.fillRect(x+4,H*0.57,W/8-8,H*0.1);}
      ctx.fillStyle='rgba(0,150,255,0.15)';ctx.fillRect(0,H*0.54,W,3);
    },
    dark_corridor:()=>{
      ctx.fillStyle='#050508';ctx.fillRect(0,0,W,H);
      // Perspective corridor
      ctx.fillStyle='#0d0d15';ctx.beginPath();ctx.moveTo(0,0);ctx.lineTo(W,0);ctx.lineTo(W*0.65,H*0.45);ctx.lineTo(W*0.35,H*0.45);ctx.fill();
      ctx.fillStyle='#111118';ctx.fillRect(0,H*0.45,W,H*0.55);
      // Flickering light
      const flicker=0.7+0.3*Math.sin(bgAnim*8+Math.sin(bgAnim*3)*2);
      ctx.fillStyle=`rgba(255,200,100,${0.06*flicker})`;ctx.beginPath();ctx.arc(W/2,H*0.3,120,0,Math.PI*2);ctx.fill();
      // Wall details
      ctx.strokeStyle='rgba(255,255,255,0.08)';ctx.lineWidth=1;
      for(let i=0;i<6;i++){ctx.strokeRect(i*(W/6),0,W/6,H);}
    },
    server_room:()=>{
      ctx.fillStyle='#040c04';ctx.fillRect(0,0,W,H);
      // Server racks
      ctx.fillStyle='#060f06';for(let i=0;i<6;i++){ctx.fillRect(40+i*(W/6),40,W/6-20,H-80);}
      // Blinking lights (animated)
      for(let i=0;i<20;i++){
        const on=Math.floor(bgAnim*2+i)%2===0;
        ctx.fillStyle=on?['#0f0','#f00','#00f','#ff0'][i%4]:'#111';
        ctx.beginPath();ctx.arc(60+Math.floor(i/4)*(W/5),80+i%4*30,4,0,Math.PI*2);ctx.fill();
      }
      ctx.fillStyle='rgba(0,255,0,0.04)';ctx.fillRect(0,0,W,H);
    },
    stars:()=>{
      const g=ctx.createRadialGradient(W/2,H/2,0,W/2,H/2,W*0.8);g.addColorStop(0,'#0a0a20');g.addColorStop(1,'#000005');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
      for(let i=0;i<200;i++){const t=(i*0.618)*Math.PI*2;const r=Math.sqrt(i/200)*W*0.5;const x=W/2+Math.cos(t)*r,y=H/2+Math.sin(t)*r;const sz=(i%10===0)?2:1;ctx.fillStyle=`rgba(255,255,255,${0.3+0.7*(i%3===0?1:0.4)})`;ctx.beginPath();ctx.arc(x,y,sz,0,Math.PI*2);ctx.fill();}
    },
    // [FILL: add more backgrounds — cafe, forest, rooftop, etc.]
  };
  (bgs[key]||bgs.space_station)();
}

// CHARACTER DRAWING — [FILL: replace with actual sprite sheets]
// ══════════════════════════════════════════════════════════════════
function drawCharacter(charId, pos, expression, alpha) {
  const def=CHARACTERS[charId]; if(!def||charId==='narrator') return;
  const x=pos==='left'?80:pos==='right'?W-240:W/2-80;
  const baseY=H*0.08;
  const h=H*0.78;

  ctx.globalAlpha=clamp(alpha||1,0,1);
  // [FILL: replace below with actual character art or sprite sheet]
  // Body silhouette
  ctx.fillStyle=def.clothing||'#333';
  ctx.beginPath();ctx.ellipse(x+80,baseY+h*0.75,52,h*0.35,0,0,Math.PI*2);ctx.fill();
  // Head
  ctx.fillStyle=def.skinColor||'#c4a87a';
  ctx.beginPath();ctx.arc(x+80,baseY+h*0.26,45,0,Math.PI*2);ctx.fill();
  // Hair
  if(def.hairColor){
    ctx.fillStyle=def.hairColor;
    ctx.beginPath();ctx.arc(x+80,baseY+h*0.22,47,Math.PI,0);ctx.fill();
    ctx.fillRect(x+33,baseY+h*0.22,94,22);
    // Hair length
    if(['aurora','elder'].includes(charId)){ctx.fillRect(x+33,baseY+h*0.22,18,h*0.15);ctx.fillRect(x+129,baseY+h*0.22,18,h*0.15);}
  }
  // Eyes
  if(def.eyeColor){
    const eyeY=baseY+h*0.275;
    const brow=expression==='angry'?-6:expression==='surprised'?-10:expression==='sad'?3:0;
    // Eyebrows
    ctx.strokeStyle='rgba(0,0,0,0.7)';ctx.lineWidth=3;
    ctx.beginPath();ctx.moveTo(x+55,eyeY-12+brow);ctx.lineTo(x+73,eyeY-10+brow);ctx.stroke();
    ctx.beginPath();ctx.moveTo(x+107,eyeY-10+brow);ctx.lineTo(x+125,eyeY-12+brow);ctx.stroke();
    // Eyes
    ctx.fillStyle=def.eyeColor;ctx.beginPath();ctx.ellipse(x+64,eyeY,10,expression==='happy'?8:12,0,0,Math.PI*2);ctx.fill();
    ctx.beginPath();ctx.ellipse(x+116,eyeY,10,expression==='happy'?8:12,0,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='#000';ctx.beginPath();ctx.arc(x+64,eyeY,5,0,Math.PI*2);ctx.fill();ctx.beginPath();ctx.arc(x+116,eyeY,5,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='rgba(255,255,255,0.6)';ctx.beginPath();ctx.arc(x+67,eyeY-3,3,0,Math.PI*2);ctx.fill();ctx.beginPath();ctx.arc(x+119,eyeY-3,3,0,Math.PI*2);ctx.fill();
  }
  // Mouth
  const mouthY=baseY+h*0.33;
  ctx.strokeStyle='rgba(0,0,0,0.6)';ctx.lineWidth=2.5;ctx.beginPath();
  if(expression==='happy')ctx.arc(x+80,mouthY,18,0.05*Math.PI,0.95*Math.PI);
  else if(expression==='sad')ctx.arc(x+80,mouthY+12,18,1.05*Math.PI,1.95*Math.PI);
  else if(expression==='angry'){ctx.arc(x+80,mouthY+8,12,1.1*Math.PI,1.9*Math.PI);}
  else if(expression==='surprised'){ctx.arc(x+80,mouthY+4,10,0,Math.PI*2);}
  else{ctx.moveTo(x+62,mouthY+4);ctx.lineTo(x+98,mouthY+4);}
  ctx.stroke();
  ctx.globalAlpha=1;
}

// ══════════════════════════════════════════════════════════════════
// TEXT BOX HELPERS — DO NOT MODIFY
// ══════════════════════════════════════════════════════════════════
function drawWrappedText(text,x,y,maxW,color,font,lineH){
  ctx.fillStyle=color;ctx.font=font;ctx.textAlign='left';
  const words=text.slice(0,typePos).split(' ');let line='',cy=y;
  for(const w of words){const t=line+(line?' ':'')+w;if(ctx.measureText(t).width>maxW&&line){ctx.fillText(line,x,cy);line=w;cy+=lineH;}else line=t;}
  if(line)ctx.fillText(line,x,cy);
}

// ══════════════════════════════════════════════════════════════════
function renderTitle(){
  drawBg('space_station');
  ctx.fillStyle='rgba(0,0,0,0.6)';ctx.fillRect(0,0,W,H);
  ctx.fillStyle=PALETTE.textbox;ctx.beginPath();ctx.roundRect(W/2-260,H*0.25,520,200,12);ctx.fill();
  ctx.strokeStyle=PALETTE.boxBorder;ctx.lineWidth=1.5;ctx.beginPath();ctx.roundRect(W/2-260,H*0.25,520,200,12);ctx.stroke();
  ctx.fillStyle=PALETTE.nameText;ctx.font=`bold 30px 'Georgia',serif`;ctx.textAlign='center';ctx.fillText(GAME_TITLE,W/2,H*0.35);
  ctx.fillStyle=PALETTE.text;ctx.font='16px system-ui,sans-serif';ctx.fillText(GAME_SUBTITLE,W/2,H*0.43);
  ctx.fillStyle='#888';ctx.font='13px system-ui,sans-serif';ctx.fillText(GAME_AUTHOR,W/2,H*0.50);
  if(_meta.coins>0){ctx.fillStyle='#ffdd00';ctx.font='bold 13px system-ui,sans-serif';ctx.fillText(`🪙 ${_meta.coins} coins`,W/2,H*0.57);}
  const pulse=0.7+0.3*Math.sin(bgAnim*2.5);
  ctx.globalAlpha=pulse;ctx.fillStyle='#fff';ctx.font='bold 13px system-ui,sans-serif';ctx.fillText('CLICK OR PRESS SPACE TO BEGIN',W/2,H*0.65);ctx.globalAlpha=1;
  ctx.textAlign='left';
}

function renderScene(){
  if(!currentNode) return;
  // Background with crossfade
  bgTransition.t=Math.min(1,(bgTransition.t||0)+FIXED_DT*2.5);
  drawBg(bgTransition.from||currentNode.bg);
  if(bgTransition.t<1&&bgTransition.to&&bgTransition.to!==bgTransition.from){
    ctx.globalAlpha=bgTransition.t;drawBg(bgTransition.to);ctx.globalAlpha=1;
  }
  if(bgTransition.t>=1){currentBgKey=bgTransition.to||currentNode.bg;bgTransition.from=currentBgKey;}

  // Characters
  if(currentNode.chars){
    currentNode.chars.forEach(c=>{
      if(c.id==='narrator') return;
      const target=1;
      charFade[c.id]=lerp(charFade[c.id]||0,target,0.12);
      // Dim non-speaking characters
      const isSpeaking=c.id===currentNode.speaker;
      const a=isSpeaking?1.0:(charFade[c.id]||0)*0.55;
      drawCharacter(c.id,c.pos,c.expression||'neutral',a);
    });
  }

  if(!currentNode.text||!currentNode.text.trim()) return;

  // Text box
  const boxX=30,boxY=H-180,boxW=W-60,boxH=160;
  ctx.fillStyle=PALETTE.textbox;ctx.beginPath();ctx.roundRect(boxX,boxY,boxW,boxH,10);ctx.fill();
  ctx.strokeStyle=PALETTE.boxBorder;ctx.lineWidth=1.5;ctx.beginPath();ctx.roundRect(boxX,boxY,boxW,boxH,10);ctx.stroke();

  // Speaker name plate
  if(currentNode.speaker&&CHARACTERS[currentNode.speaker]&&currentNode.speaker!=='narrator'){
    const def=CHARACTERS[currentNode.speaker];
    const nameW=ctx.measureText(def.name).width+24;
    ctx.fillStyle=PALETTE.nameBg;ctx.beginPath();ctx.roundRect(boxX+10,boxY-28,nameW,28,6);ctx.fill();
    ctx.strokeStyle=PALETTE.nameBorder;ctx.lineWidth=1;ctx.beginPath();ctx.roundRect(boxX+10,boxY-28,nameW,28,6);ctx.stroke();
    ctx.fillStyle=PALETTE.nameText;ctx.font=`bold 15px 'Georgia',serif`;ctx.textAlign='left';ctx.fillText(def.name,boxX+22,boxY-9);
  }

  // Dialogue text
  drawWrappedText(currentNode.text,boxX+20,boxY+28,boxW-40,PALETTE.text,`17px 'Georgia',serif`,28);

  // Advance arrow
  if(textComplete){
    const pulse=0.6+0.4*Math.sin(bgAnim*4);
    ctx.globalAlpha=pulse;ctx.fillStyle='#ccc';ctx.font=`bold 14px monospace`;ctx.textAlign='right';
    ctx.fillText('▼ SPACE',W-44,boxY+boxH-16);ctx.globalAlpha=1;ctx.textAlign='left';
  }

  // Mode indicators
  ctx.fillStyle='rgba(255,255,255,0.35)';ctx.font=`10px monospace`;ctx.textAlign='right';
  if(autoMode)ctx.fillText('[AUTO]',W-10,20);
  if(skipMode)ctx.fillText('[SKIP]',W-10,32);
  ctx.fillText('[H] History',W-10,H-8);
  ctx.textAlign='left';
}

function renderChoicesOverlay(){
  if(!currentNode||!currentNode.choices) return;
  const valid=currentNode.choices.filter(c=>!c.requireFlag||flags[c.requireFlag]);
  ctx.fillStyle='rgba(0,0,0,0.55)';ctx.fillRect(0,0,W,H);

  const totalH=valid.length*70;
  const startY=H/2-totalH/2;
  ctx.fillStyle=PALETTE.text;ctx.font=`bold 14px monospace`;ctx.textAlign='center';
  ctx.fillText('— What will you do? —',W/2,startY-24);

  valid.forEach((ch,i)=>{
    const y=startY+i*70;
    const sel=i===choiceIndex||(Pointer.y>y&&Pointer.y<y+58&&Pointer.x>80&&Pointer.x<W-80);
    ctx.fillStyle=sel?PALETTE.choiceSel:PALETTE.choiceBg;
    ctx.beginPath();ctx.roundRect(80,y,W-160,55,8);ctx.fill();
    ctx.strokeStyle=sel?PALETTE.nameBorder:PALETTE.choiceBorder;ctx.lineWidth=sel?1.8:1;
    ctx.beginPath();ctx.roundRect(80,y,W-160,55,8);ctx.stroke();
    ctx.fillStyle=sel?'#fff':PALETTE.text;ctx.font=`${sel?'bold ':''} 15px 'Georgia',serif`;ctx.textAlign='center';
    ctx.fillText((sel?'▶  ':'')+ch.text,W/2,y+32);
  });
  ctx.textAlign='left';
}

function renderHistoryOverlay(){
  ctx.fillStyle='rgba(0,0,0,0.88)';ctx.fillRect(0,0,W,H);
  ctx.strokeStyle=PALETTE.boxBorder;ctx.lineWidth=1;ctx.strokeRect(20,20,W-40,H-40);
  ctx.fillStyle=PALETTE.nameText;ctx.font=`bold 14px monospace`;ctx.textAlign='center';ctx.fillText('— History Log —',W/2,48);
  const startY=70, lineH=22, maxLines=Math.floor((H-100)/lineH);
  const slice=history.slice(Math.max(0,history.length-maxLines-historyScroll.offset),history.length-historyScroll.offset);
  slice.forEach((h,i)=>{
    if(h.speaker){ctx.fillStyle=PALETTE.nameText;ctx.font=`bold 12px monospace`;ctx.textAlign='left';ctx.fillText(h.speaker+':',30,startY+i*lineH);}
    ctx.fillStyle=PALETTE.text;ctx.font=`13px 'Georgia',serif`;ctx.textAlign='left';
    const indent=h.speaker?90:30;
    ctx.fillText(h.text.length>80?h.text.slice(0,77)+'...':h.text,indent,startY+i*lineH);
  });
  ctx.fillStyle='rgba(255,255,255,0.5)';ctx.font=`11px monospace`;ctx.textAlign='center';ctx.fillText('CLICK or ESC to close',W/2,H-30);
  ctx.textAlign='left';
}

function renderCredits(){
  ctx.fillStyle='#050510';ctx.fillRect(0,0,W,H);
  const lines=[GAME_TITLE,'','Story & Design: '+GAME_AUTHOR,'','[FILL: Credits]','','Thank you for reading.'];
  lines.forEach((l,i)=>{
    const y=H/2-lines.length*20+i*40;
    ctx.fillStyle=i===0?PALETTE.nameText:'#aaa';ctx.font=`${i===0?'bold 26':'16'}px 'Georgia',serif`;ctx.textAlign='center';ctx.fillText(l,W/2,y);
  });
  const pulse=0.6+0.4*Math.sin(bgAnim*2);
  ctx.globalAlpha=pulse;ctx.fillStyle='#666';ctx.font=`12px monospace`;ctx.fillText('CLICK to return to title',W/2,H-40);ctx.globalAlpha=1;
  ctx.textAlign='left';
}

// ══════════════════════════════════════════════════════════════════
// META PROGRESSION
// ══════════════════════════════════════════════════════════════════
const _META_KEY='meta_vn';
const UPGRADES=[
  {id:'routes',  label:'Extra Routes', desc:'Unlock new paths', maxLv:3, cost:[60,120,200]},
  {id:'hint',    label:'Hint System',  desc:'Show scene hints', maxLv:3, cost:[50,100,170]},
  {id:'skip',    label:'Fast Skip',    desc:'2× skip speed /lv',maxLv:3, cost:[40,80,140]},
  {id:'gallery', label:'Gallery',      desc:'Unlock CG art',    maxLv:3, cost:[70,140,230]},
];
let _meta={coins:0,upgrades:{}};
let _runCoins=0; let _gameoverTimer=1.5; let _shopIdx=0;
let _skipMultiplier=1; let _hintsEnabled=false; let _extraRoutes=0;
function loadMeta(){try{const s=localStorage.getItem(_META_KEY);_meta=s?JSON.parse(s):{coins:0,upgrades:{}};}catch(e){_meta={coins:0,upgrades:{}};}}
function saveMeta(){try{localStorage.setItem(_META_KEY,JSON.stringify(_meta));}catch(e){}}
function getUpgradeLevel(id){return(_meta.upgrades[id]||0);}
function buyUpgrade(id){const u=UPGRADES.find(x=>x.id===id);if(!u)return false;const lv=getUpgradeLevel(id);if(lv>=u.maxLv)return false;const cost=u.cost[lv];if(_meta.coins<cost)return false;_meta.coins-=cost;_meta.upgrades[id]=(lv+1);saveMeta();return true;}
function applyUpgrades(){_skipMultiplier=1+getUpgradeLevel('skip');_hintsEnabled=getUpgradeLevel('hint')>=1;_extraRoutes=getUpgradeLevel('routes');}
function _shopHit(px,py,x,y,w,h){return px>=x&&px<=x+w&&py>=y&&py<=y+h;}
function updateGameover(dt){_gameoverTimer-=dt;if(_gameoverTimer<=0||anyAction()){_meta.coins+=_runCoins;saveMeta();_shopIdx=0;setState('shop');}}
function updateShop(dt){if(!Pointer.justDown)return;const n=UPGRADES.length,cardW=Math.round(W*0.19),cardH=Math.round(H*0.32),gap=Math.round(W*0.02);const sy=Math.round(H*0.22),totalW=n*cardW+(n-1)*gap,sx=(W-totalW)/2;for(let i=0;i<n;i++){if(_shopHit(Pointer.x,Pointer.y,sx+i*(cardW+gap),sy,cardW,cardH)){_shopIdx=i;if(buyUpgrade(UPGRADES[i].id)){sfx.play(660,0.12,'sine',0.1);applyUpgrades();}else sfx.play(110,0.06,'sawtooth',0.08);return;}}const btnW=160,btnH=42,btnX=(W-btnW)/2,btnY=sy+cardH+32;if(_shopHit(Pointer.x,Pointer.y,btnX,btnY,btnW,btnH)){sfx.play(440,0.08,'square',0.1);setState('title');}}
function renderShop(){ctx.fillStyle=PALETTE.shopBg;ctx.fillRect(0,0,W,H);ctx.textAlign='center';ctx.fillStyle='#fff';ctx.font='bold 22px system-ui,sans-serif';ctx.fillText('UPGRADE SHOP',W/2,Math.round(H*0.12));ctx.fillStyle='#ffdd00';ctx.font='bold 15px system-ui,sans-serif';ctx.fillText(`🪙 ${_meta.coins} coins`,W/2,Math.round(H*0.19));const n=UPGRADES.length,cardW=Math.round(W*0.19),cardH=Math.round(H*0.32),gap=Math.round(W*0.02);const sy=Math.round(H*0.22),totalW=n*cardW+(n-1)*gap,sx=(W-totalW)/2;for(let i=0;i<n;i++){const u=UPGRADES[i],lv=getUpgradeLevel(u.id),cx=sx+i*(cardW+gap);ctx.fillStyle=_shopIdx===i?PALETTE.shopSel:PALETTE.shopCard;ctx.beginPath();if(ctx.roundRect)ctx.roundRect(cx,sy,cardW,cardH,8);else ctx.rect(cx,sy,cardW,cardH);ctx.fill();ctx.fillStyle='#fff';ctx.font='bold 11px system-ui,sans-serif';ctx.fillText(u.label,cx+cardW/2,sy+22);ctx.fillStyle='#aaa';ctx.font='10px system-ui,sans-serif';ctx.fillText(u.desc,cx+cardW/2,sy+38);for(let d=0;d<u.maxLv;d++){ctx.fillStyle=d<lv?'#ffdd00':'#444';ctx.beginPath();ctx.arc(cx+cardW/2+(d-u.maxLv/2+0.5)*14,sy+cardH-36,5,0,Math.PI*2);ctx.fill();}if(lv<u.maxLv){ctx.fillStyle='#ffdd00';ctx.font='bold 12px system-ui,sans-serif';ctx.fillText(`${u.cost[lv]}🪙`,cx+cardW/2,sy+cardH-14);}else{ctx.fillStyle='#0f0';ctx.font='bold 11px system-ui,sans-serif';ctx.fillText('MAX',cx+cardW/2,sy+cardH-14);}}const btnW=160,btnH=42,btnX=(W-btnW)/2,btnY=sy+cardH+32;ctx.fillStyle='#3a1a3a';ctx.beginPath();if(ctx.roundRect)ctx.roundRect(btnX,btnY,btnW,btnH,8);else ctx.rect(btnX,btnY,btnW,btnH);ctx.fill();ctx.fillStyle='#fff';ctx.font='bold 16px system-ui,sans-serif';ctx.fillText('PLAY',W/2,btnY+27);ctx.textAlign='left';}
loadMeta(); applyUpgrades();

// ══════════════════════════════════════════════════════════════════
// START
// ══════════════════════════════════════════════════════════════════
requestAnimationFrame(t=>{lastTime=t;requestAnimationFrame(loop);});
