function resizeCanvas() {
  const s = Math.min(window.innerWidth/W, window.innerHeight/H);

}
resizeCanvas(); window.addEventListener('resize', ()=>{resizeCanvas();ctx.scale(DPR,DPR);});

let gameState='menu';

const Keys={down:{},pressed:{},released:{}};
window.addEventListener('keydown',e=>{if(!Keys.down[e.code])Keys.pressed[e.code]=true;Keys.down[e.code]=true;if(['Space','ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.code))e.preventDefault();});
window.addEventListener('keyup',e=>{Keys.down[e.code]=false;Keys.released[e.code]=true;});
const Touch={justTapped:false,x:0,y:0,swipeDx:0,startX:0};
canvas.addEventListener('touchstart',e=>{e.preventDefault();const r=canvas.getBoundingClientRect();Touch.startX=Touch.x=(e.touches[0].clientX-r.left)*(W/r.width);Touch.y=(e.touches[0].clientY-r.top)*(H/r.height);Touch.justTapped=true;},{passive:false});
canvas.addEventListener('touchmove',e=>{e.preventDefault();const r=canvas.getBoundingClientRect();Touch.swipeDx=(e.touches[0].clientX-r.left)*(W/r.width)-Touch.startX;},{passive:false});
canvas.addEventListener('touchend',e=>{e.preventDefault();Touch.swipeDx=0;},{passive:false});
const Mouse={clicked:false,x:0,y:0};
canvas.addEventListener('click',()=>Mouse.clicked=true);
canvas.addEventListener('mousemove',e=>{const r=canvas.getBoundingClientRect();Mouse.x=(e.clientX-r.left)*(W/r.width);Mouse.y=(e.clientY-r.top)*(H/r.height);});

function keyDown(c){return !!Keys.down[c];}
function keyPressed(c){return !!Keys.pressed[c];}
function anyAction(){return Mouse.clicked||Touch.justTapped||keyPressed('Space')||keyPressed('Enter');}
function flushInput(){Keys.pressed={};Keys.released={};Touch.justTapped=false;Mouse.clicked=false;}

function createPool(factory,size){
  const inactive=Array.from({length:size},factory),active=[];
  return{active,get(fn){const o=inactive.length>0?inactive.pop():factory();o.alive=true;if(fn)fn(o);active.push(o);return o;},update(fn){for(let i=active.length-1;i>=0;i--)if(!fn(active[i])){active[i].alive=false;inactive.push(active.splice(i,1)[0]);}},clear(){while(active.length){active[0].alive=false;inactive.push(active.shift());}}};
}

const Particles=createPool(()=>({alive:false,x:0,y:0,vx:0,vy:0,life:0,maxLife:0,size:3,color:'#fff',gravity:250}),200);
function spawnParticles(x,y,count,opts){opts=opts||{};for(let i=0;i<count;i++){const a=opts.angle!==undefined?opts.angle+(Math.random()-0.5)*(opts.spread||Math.PI*2):Math.random()*Math.PI*2;const sp=opts.speed||(40+Math.random()*80);Particles.get(p=>{p.x=x;p.y=y;p.vx=Math.cos(a)*sp;p.vy=Math.sin(a)*sp;p.life=p.maxLife=opts.life||(0.25+Math.random()*0.4);p.size=opts.size||(2+Math.random()*3);p.color=opts.color||'#fff';p.gravity=opts.gravity!==undefined?opts.gravity:250;});}}
function updateParticles(dt){Particles.update(p=>{p.life-=dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=p.gravity*dt;return p.life>0;});}
function drawParticles(){Particles.active.forEach(p=>{ctx.globalAlpha=p.life/p.maxLife;ctx.fillStyle=p.color;ctx.fillRect(p.x-p.size/2,p.y-p.size/2,p.size,p.size);});ctx.globalAlpha=1;}

const Popups=[];
function spawnPopup(x,y,text,color,size){Popups.push({x,y,text,color:color||'#fff',size:size||13,vy:-50,life:1.0});}
function updatePopups(dt){for(let i=Popups.length-1;i>=0;i--){Popups[i].y+=Popups[i].vy*dt;Popups[i].life-=dt;if(Popups[i].life<=0)Popups.splice(i,1);}}
function drawPopups(){Popups.forEach(p=>{ctx.globalAlpha=Math.min(p.life,1);ctx.fillStyle=p.color;ctx.font=`bold ${p.size}px monospace`;ctx.textAlign='center';ctx.fillText(p.text,p.x,p.y);});ctx.globalAlpha=1;ctx.textAlign='left';}

const Shake={x:0,y:0,mag:0,dur:0};
function triggerShake(m,d){Shake.mag=Math.max(Shake.mag,m);Shake.dur=Math.max(Shake.dur,d);}
function updateShake(dt){if(Shake.dur>0){Shake.dur-=dt;Shake.x=(Math.random()*2-1)*Shake.mag;Shake.y=(Math.random()*2-1)*Shake.mag;if(Shake.dur<=0){Shake.x=0;Shake.y=0;}}}

const sfx={_ctx:null,init(){try{if(!this._ctx)this._ctx=new(window.AudioContext||window.webkitAudioContext)();if(this._ctx.state==='suspended')this._ctx.resume();}catch(e){}},play(f,d,t,v){try{this.init();if(!this._ctx)return;const o=this._ctx.createOscillator(),g=this._ctx.createGain();o.type=t||'square';o.frequency.value=f||440;g.gain.setValueAtTime(v||0.12,this._ctx.currentTime);g.gain.exponentialRampToValueAtTime(0.001,this._ctx.currentTime+(d||0.1));o.connect(g);g.connect(this._ctx.destination);o.start();o.stop(this._ctx.currentTime+(d||0.1));}catch(e){}}};

function lerp(a,b,t){return a+(b-a)*t;}
function clamp(v,mn,mx){return v<mn?mn:v>mx?mx:v;}
function aabb(ax,ay,aw,ah,bx,by,bw,bh){return ax<bx+bw&&ax+aw>bx&&ay<by+bh&&ay+ah>by;}
function randInt(a,b){return a+Math.floor(Math.random()*(b-a+1));}
function randFloat(a,b){return a+Math.random()*(b-a);}
function randChoice(arr){return arr[Math.floor(Math.random()*arr.length)];}

function drawBar(x,y,w,h,v,m,fg,bg){ctx.fillStyle=bg||'#333';ctx.fillRect(x,y,w,h);ctx.fillStyle=fg||'#0f0';ctx.fillRect(x,y,Math.round(w*clamp(v/m,0,1)),h);}

const FIXED_DT=1/60;
const MAX_DT=0.1;
let lastTime=0;
let accumulator=0;
function loop(ts){const rd=Math.min((ts-lastTime)/1000,MAX_DT);lastTime=ts;accumulator+=rd;while(accumulator>=FIXED_DT){update(FIXED_DT);accumulator-=FIXED_DT;}renderFrame();requestAnimationFrame(loop);}
function update(dt){updateShake(dt);updateParticles(dt);updatePopups(dt);switch(gameState){case'menu':updateMenu(dt);break;case'playing':updatePlaying(dt);break;case'paused':if(keyPressed('Escape')||keyPressed('KeyP'))setState('playing');break;case'gameover':updateGameover(dt);break;case'shop':updateShop(dt);break;}flushInput();}
function renderFrame(){ctx.save();ctx.translate(Shake.x,Shake.y);switch(gameState){case'menu':renderMenu();break;case'playing':renderPlaying();break;case'paused':renderPlaying();renderPauseOverlay();break;case'gameover':renderPlaying();renderGameoverOverlay();break;case'shop':renderShop();break;}drawParticles();drawPopups();ctx.restore();}

const _META_KEY='meta_platformer';

function loadMeta(){try{_meta=JSON.parse(localStorage.getItem(_META_KEY))||{coins:0,upgrades:{}};}catch(e){_meta={coins:0,upgrades:{}};} if(!_meta.upgrades)_meta.upgrades={};}
function saveMeta(){try{localStorage.setItem(_META_KEY,JSON.stringify(_meta));}catch(e){}}
function addRunCoins(n){_meta.coins+=Math.floor(n);saveMeta();}
function getUpgradeLevel(id){return _meta.upgrades[id]||0;}
function buyUpgrade(id){const up=UPGRADES.find(u=>u.id===id);if(!up)return false;const lvl=getUpgradeLevel(id);if(lvl>=up.maxLevel)return false;const cost=up.costs[lvl];if(_meta.coins<cost)return false;_meta.coins-=cost;_meta.upgrades[id]=lvl+1;saveMeta();return true;}

function updateGameover(dt){_gameoverTimer-=dt;if(_gameoverTimer<=0||anyAction()){addRunCoins(_runCoins);_shopIdx=0;setState('shop');}}
function _shopHit(mx,my,x,y,w,h){return mx>=x&&mx<=x+w&&my>=y&&my<=y+h;}
function updateShop(dt){
  if(!anyAction())return;
  const cW=160,cH=128,gap=16,cols=4,totW=cols*cW+(cols-1)*gap,sx=(W-totW)/2,sy=Math.round(H*0.22);

}

  const cW=160,cH=128,gap=16,cols=4,totW=cols*cW+(cols-1)*gap,sx=(W-totW)/2,sy=Math.round(H*0.22);
  for(let i=0;i<UPGRADES.length;i++){
    const up=UPGRADES[i],lvl=getUpgradeLevel(up.id),cx=sx+i*(cW+gap),maxed=lvl>=up.maxLevel,canBuy=!maxed&&_meta.coins>=up.costs[lvl];
    ctx.fillStyle=i===_shopIdx?PALETTE.shopSel:PALETTE.shopCard;ctx.strokeStyle=maxed?'#4caf50':canBuy?'#ffdd00':'#444';ctx.lineWidth=i===_shopIdx?2:1;
    ctx.beginPath();ctx.roundRect(cx,sy,cW,cH,8);ctx.fill();ctx.stroke();
    ctx.font='24px system-ui,sans-serif';ctx.fillStyle='#fff';ctx.fillText(up.icon,cx+cW/2,sy+30);
    ctx.font='bold 11px system-ui,sans-serif';ctx.fillText(up.name,cx+cW/2,sy+50);
    ctx.fillStyle='#aaa';ctx.font='10px system-ui,sans-serif';ctx.fillText(up.desc,cx+cW/2,sy+64);
    for(let p=0;p<up.maxLevel;p++){ctx.fillStyle=p<lvl?'#ffdd00':'#333';ctx.beginPath();ctx.arc(cx+cW/2-(up.maxLevel-1)*7+p*14,sy+84,5,0,Math.PI*2);ctx.fill();}

}

function getPlatformAt(px,py,pw,ph){return platforms.filter(p=>p.type!=='gone'&&aabb(px,py,pw,ph,p.x,p.y,p.w,p.h));}

function resolveEntityPlatforms(ent,dt){
  ent.prevY=ent.prevY!==undefined?ent.prevY:ent.y;
  ent.wasOnGround=ent.onGround;ent.onGround=false;
  ent.x+=ent.vx*dt;
  getPlatformAt(ent.x,ent.y,ent.w,ent.h).forEach(p=>{
    if(p.type==='oneWay')return;
    const ox=ent.vx>0?(ent.x+ent.w)-p.x:p.x+p.w-ent.x;
    if(ox>0){ent.x+=ent.vx>0?-ox:ox;ent.vx=0;}
  });
  ent.y+=ent.vy*dt;
  getPlatformAt(ent.x,ent.y,ent.w,ent.h).forEach(p=>{
    if(p.type==='oneWay'){
      const pb=ent.prevY+ent.h,pt=p.y;
      if(ent.vy>=0&&pb<=pt+2){ent.y=pt-ent.h;ent.vy=0;ent.onGround=true;}
      return;
    }
    if(ent.vy>=0){ent.y=p.y-ent.h;ent.vy=0;ent.onGround=true;}
    else{ent.y=p.y+p.h;ent.vy=0;}
  });
  ent.prevY=ent.y;
  if(ent.x<0){ent.x=0;ent.vx=0;}
  if(ent.x+ent.w>mapWidth){ent.x=mapWidth-ent.w;ent.vx=0;}
}

// ══════════════════════════════════════════════════════════════════
// LEVEL LOADING
// ══════════════════════════════════════════════════════════════════
function loadLevel(idx){
  const lvl=LEVEL_DATA[idx];
  mapWidth=lvl.width;
  exitX=lvl.exitX; exitY=lvl.exitY;
  platforms.length=0;
  lvl.platforms.forEach(p=>platforms.push(Object.assign({},p)));
  enemyPool.clear(); coinPool.clear(); Popups.length=0;
  lvl.coins.forEach(c=>coinPool.get(co=>{co.x=c.x;co.y=c.y;co.bobTimer=Math.random()*Math.PI*2;}));
  lvl.enemies.forEach(ed=>{
    const def=ENEMY_DEFS[ed.type];
    enemyPool.get(en=>{
      en.type=ed.type;en.x=ed.x;en.y=ed.y;en.vx=def.vx;en.vy=0;
      en.w=def.w;en.h=def.h;en.hp=en.maxHp=def.hp;en.points=def.points;
      en.patrolLeft=ed.patrolLeft;en.patrolRight=ed.patrolRight;
      en.facingRight=true;en.flashTimer=0;en.prevY=ed.y;
      en.jumpTimer=randFloat(0.8,1.8);
      en.baseY=ed.baseY||ed.y;
    });
  });
  player.checkpoint.x=lvl.checkpointX; player.checkpoint.y=lvl.checkpointY;
  player.x=lvl.checkpointX; player.y=lvl.checkpointY;
  player.vx=0;player.vy=0;player.onGround=false;
  cam.x=0;cam.y=0;
  levelComplete=false;
}

function initGame(){
  loadMeta();
  currentLevel=0;
  loadLevel(0);
}

function startGame(){
  loadMeta();
  GAME_SCORE=0;_runCoins=0;_gameoverTimer=1.5;
  player.hp=player.maxHp=3;player.iframes=0;player.coins=0;
  player.jumpsLeft=MAX_JUMPS;player.coyoteTimer=0;player.jumpBufferTimer=0;
  player.isJumping=false;player.squashX=1;player.squashY=1;
  currentLevel=0;loadLevel(0);
  applyUpgrades();
}

// JUMP MECHANICS
// ══════════════════════════════════════════════════════════════════
function executeJump(){
  const isDouble=!player.onGround&&player.coyoteTimer<=0;
  player.vy=isDouble?JUMP_FORCE*0.88:JUMP_FORCE;
  if(isDouble)player.jumpsLeft--;
  else{player.jumpsLeft=MAX_JUMPS-1;player.coyoteTimer=0;}
  player.isJumping=true;player.jumpBufferTimer=0;
  player.squashX=0.7;player.squashY=1.35;
  spawnParticles(player.x+player.w/2,player.y+player.h,4,{color:'#88ccff',speed:40,angle:Math.PI*0.5,spread:0.6,gravity:50,life:0.25});
  sfx.play(isDouble?660:440,0.08,'square',0.09);
}

// ══════════════════════════════════════════════════════════════════
// UPDATE
// ══════════════════════════════════════════════════════════════════
function updatePlaying(dt){
  bgTimer+=dt;

  // Moving platforms
  platforms.forEach(p=>{
    if(p.type!=='moving')return;
    p.prevX=p.x;p.prevY=p.y;
    p.t+=dt*p.speed;
    const frac=(Math.sin(p.t*Math.PI/(p.endX-p.startX+0.001))+1)/2;
    p.x=p.startX+(p.endX-p.startX)*frac;
    p.frameDelta={x:p.x-p.prevX,y:p.y-p.prevY};
  });

  // Player horizontal
  const isRunning=keyDown('ShiftLeft')||keyDown('ShiftRight');
  const spd=isRunning?(RUN_SPEED+(getUpgradeLevel('speed')*40)):(WALK_SPEED+(getUpgradeLevel('speed')*30));
  const mL=keyDown('ArrowLeft')||keyDown('KeyA')||(Touch.swipeDx<-15);
  const mR=keyDown('ArrowRight')||keyDown('KeyD')||(Touch.swipeDx>15);
  if(mL||mR){
    const dir=mL?-1:1;if(mR)player.facingRight=true;if(mL)player.facingRight=false;
    const accel=player.onGround?GROUND_ACCEL:AIR_ACCEL;
    player.vx=clamp(player.vx+dir*accel*dt,-spd,spd);
  }else{
    const decel=player.onGround?GROUND_DECEL:AIR_ACCEL*0.5;
    if(Math.abs(player.vx)<=decel*dt)player.vx=0;
    else player.vx-=Math.sign(player.vx)*decel*dt;
  }

  // Coyote time
  if(player.wasOnGround&&!player.onGround)player.coyoteTimer=COYOTE_TIME;
  player.coyoteTimer=Math.max(0,player.coyoteTimer-dt);

  // Jump buffer
  if(keyPressed('Space')||keyPressed('ArrowUp')||keyPressed('KeyW')||Touch.justTapped)player.jumpBufferTimer=JUMP_BUFFER;
  player.jumpBufferTimer=Math.max(0,player.jumpBufferTimer-dt);

  // Jump execution
  const canJump=player.onGround||player.coyoteTimer>0||player.jumpsLeft>0;
  if(player.jumpBufferTimer>0&&canJump)executeJump();

  // Variable jump height
  if(player.isJumping){
    const released=!keyDown('Space')&&!keyDown('ArrowUp')&&!keyDown('KeyW');
    if(released&&player.vy<0){player.vy*=JUMP_RELEASE;player.isJumping=false;}
    if(player.vy>=0)player.isJumping=false;
  }

  // Gravity
  const fallMul=player.vy>0?1.55:1.0;
  player.vy=Math.min(player.vy+GRAVITY*fallMul*dt,MAX_FALL);

  // Platform collision
  resolveEntityPlatforms(player,dt);

  // Moving platform carry
  platforms.forEach(p=>{
    if(p.type!=='moving'||!p.frameDelta)return;
    const standing=player.y+player.h>=p.y-2&&player.y+player.h<=p.y+4&&player.x+player.w>p.x&&player.x<p.x+p.w&&player.vy>=0;
    if(standing){player.x+=p.frameDelta.x;player.y+=p.frameDelta.y;}
  });

  // Landing effects
  if(player.onGround&&!player.wasOnGround){
    if(Math.abs(player.vy)<-50){}
    player.squashX=1.25;player.squashY=0.72;
    spawnParticles(player.x+player.w/2,player.y+player.h,3,{color:'#88ccff',speed:30,angle:Math.PI*0.5,spread:1.0,gravity:150,life:0.2});
    player.jumpsLeft=MAX_JUMPS;player.isJumping=false;
    sfx.play(200,0.05,'sine',0.07);
  }
  player.squashX=lerp(player.squashX,1.0,dt*12);
  player.squashY=lerp(player.squashY,1.0,dt*12);
  player.iframes=Math.max(0,player.iframes-dt);

  // Enemies
  enemyPool.update(en=>{
    en.flashTimer=Math.max(0,en.flashTimer-dt);
    const def=ENEMY_DEFS[en.type];
    if(en.type==='walker'){
      en.x+=en.vx*dt;
      if(en.x<en.patrolLeft){en.x=en.patrolLeft;en.vx=Math.abs(en.vx);en.facingRight=true;}
      if(en.x+en.w>en.patrolRight){en.x=en.patrolRight-en.w;en.vx=-Math.abs(en.vx);en.facingRight=false;}
      en.vy=Math.min(en.vy+GRAVITY*dt,MAX_FALL);
      resolveEntityPlatforms(en,dt);
    }else if(en.type==='jumper'){
      en.x+=en.vx*dt;
      if(en.x<en.patrolLeft){en.x=en.patrolLeft;en.vx=Math.abs(en.vx);en.facingRight=true;}
      if(en.x+en.w>en.patrolRight){en.x=en.patrolRight-en.w;en.vx=-Math.abs(en.vx);en.facingRight=false;}
      en.vy=Math.min(en.vy+GRAVITY*dt,MAX_FALL);
      resolveEntityPlatforms(en,dt);
      if(en.onGround){en.jumpTimer-=dt;if(en.jumpTimer<=0){en.vy=-480;en.jumpTimer=randFloat(1.2,2.2);sfx.play(330,0.04,'square',0.04);}}
    }else if(en.type==='drone'){
      en.x+=en.vx*dt;
      if(en.x<en.patrolLeft){en.x=en.patrolLeft;en.vx=Math.abs(en.vx);en.facingRight=true;}
      if(en.x+en.w>en.patrolRight){en.x=en.patrolRight-en.w;en.vx=-Math.abs(en.vx);en.facingRight=false;}
      en.y=en.baseY+Math.sin(bgTimer*def.hoverSpd+en.x*0.01)*def.hoverAmp;
      en.onGround=false;
    }
    return en.y<H+100;
  });

  // Enemy → player collision
  if(player.iframes<=0){
    enemyPool.active.forEach(en=>{
      if(!en.alive)return;
      if(aabb(player.x,player.y,player.w,player.h,en.x,en.y,en.w,en.h)){
        const playerBottom=player.y+player.h,enemyTop=en.y;
        if(player.vy>0&&playerBottom-en.h*0.35<=enemyTop+6){
          en.hp--;
          if(en.hp<=0){
            const pts=Math.round(en.points*_scoreMultiplier);GAME_SCORE+=pts;
            spawnParticles(en.x+en.w/2,en.y+en.h/2,8,{color:ENEMY_DEFS[en.type].color,speed:60,life:0.35});
            spawnPopup(en.x+en.w/2-cam.x,en.y-cam.y,`+${pts}`,'#ff0',13);
            sfx.play(660,0.08,'square',0.1);en.alive=false;
          }else{en.flashTimer=0.15;}
          player.vy=JUMP_FORCE*0.50;player.isJumping=false;
        }else{
          player.hp--;player.iframes=player.IFRAME_DUR;
          player.vx=(player.x<en.x?-1:1)*200;player.vy=-250;
          triggerShake(4,0.20);sfx.play(150,0.18,'sawtooth',0.14);
          spawnParticles(player.x+player.w/2,player.y+player.h/2,6,{color:'#f44',speed:55});
          if(player.hp<=0){saveHiScore(GAME_SCORE);_runCoins=player.coins;_gameoverTimer=1.5;setState('gameover');}
        }
      }
    });
  }

  // Coins + magnet
  coinPool.update(c=>{
    c.bobTimer+=dt;
    // Magnet pull
    if(_magnetRange>0){
      const cx2=c.x+c.w/2,cy2=c.y+c.h/2,px2=player.x+player.w/2,py2=player.y+player.h/2;
      const dist=Math.hypot(cx2-px2,cy2-py2);
      if(dist<_magnetRange&&dist>1){
        const pull=lerp(300,100,dist/_magnetRange);
        c.x+=(px2-cx2)/dist*pull*dt;c.y+=(py2-cy2)/dist*pull*dt;
      }
    }
    if(aabb(player.x,player.y,player.w,player.h,c.x,c.y,c.w,c.h)){
      const v=Math.round(c.value*_scoreMultiplier);GAME_SCORE+=v;player.coins++;
      spawnPopup(c.x-cam.x,c.y-cam.y,`+${v}`,'#ff0',12);
      sfx.play(880,0.07,'square',0.09);
      spawnParticles(c.x+c.w/2,c.y+c.h/2,4,{color:PALETTE.coin,speed:35,life:0.25,gravity:100});
      return false;
    }
    return true;
  });

  // Fall death
  if(player.y>H+120){
    player.hp--;
    if(player.hp<=0){saveHiScore(GAME_SCORE);_runCoins=player.coins;_gameoverTimer=1.5;setState('gameover');}
    else{player.x=player.checkpoint.x;player.y=player.checkpoint.y;player.vx=0;player.vy=0;triggerShake(4,0.3);}
  }

  // Level exit check
  if(!levelComplete&&aabb(player.x,player.y,player.w,player.h,exitX,exitY,48,60)){
    levelComplete=true;levelTimer=1.2;
    const bonus=1000*(currentLevel+1);GAME_SCORE+=bonus;
    spawnPopup(W/2,H/2,`LEVEL ${currentLevel+1} CLEAR! +${bonus}`,'#0f0',16);
    sfx.play(880,0.3,'square',0.12);sfx.play(1100,0.3,'square',0.10);
  }
  if(levelComplete){
    levelTimer-=dt;
    if(levelTimer<=0){
      if(currentLevel+1<LEVEL_DATA.length){currentLevel++;loadLevel(currentLevel);}
      else{saveHiScore(GAME_SCORE);_runCoins=player.coins;_gameoverTimer=0;setState('gameover');}
    }
  }

  // Camera
  const mapW2=mapWidth;
  cam.targetX=player.x+player.w/2-W/2+(player.facingRight?cam.LEAD_X:-cam.LEAD_X);
  cam.targetY=player.y+player.h/2-H/2-30;
  cam.x=lerp(cam.x,clamp(cam.targetX,0,Math.max(0,mapW2-W)),cam.SMOOTH*dt);
  cam.y=lerp(cam.y,clamp(cam.targetY,0,0),cam.SMOOTH*dt);

  if(keyPressed('Escape')||keyPressed('KeyP'))setState('paused');
}

function renderMenu(){
  ctx.fillStyle=PALETTE.bg;ctx.fillRect(0,0,W,H);
  // Cyberpunk cityscape bg
  for(let i=0;i<8;i++){
    const bx=i*110-30,bh=60+i*20,by=H-bh;
    ctx.fillStyle=`rgba(${10+i*5},${10+i*8},${30+i*12},1)`;
    ctx.fillRect(bx,by,90,bh);
    // Windows
    ctx.fillStyle='rgba(0,200,255,0.15)';
    for(let wy=by+8;wy<H-10;wy+=12){for(let wx=bx+8;wx<bx+80;wx+=14)ctx.fillRect(wx,wy,8,6);}
  }
  // Neon grid floor
  ctx.strokeStyle='rgba(0,100,255,0.2)';ctx.lineWidth=1;
  for(let i=0;i<W;i+=40){ctx.beginPath();ctx.moveTo(i,H*0.65);ctx.lineTo(i,H);ctx.stroke();}
  ctx.textAlign='center';
  ctx.shadowBlur=20;ctx.shadowColor=PALETTE.player;
  ctx.fillStyle=PALETTE.player;ctx.font='bold 46px monospace';ctx.fillText('CYBER',W/2,H*0.30);
  ctx.fillStyle='#ff00aa';ctx.shadowColor='#ff00aa';ctx.fillText('LEAP',W/2,H*0.30+52);
  ctx.shadowBlur=0;
  ctx.fillStyle='#8899bb';ctx.font='12px system-ui,sans-serif';
  ctx.fillText('← → move   SPACE jump (double jump!)   SHIFT run',W/2,H*0.55);
  ctx.fillStyle='#fff';ctx.font='bold 16px system-ui,sans-serif';ctx.fillText('PRESS SPACE TO PLAY',W/2,H*0.64);
  ctx.fillStyle='#446';ctx.font='13px system-ui,sans-serif';ctx.fillText(`Best: ${_hiScore}`,W/2,H*0.73);
  if(_meta.coins>0){ctx.fillStyle='#ffdd00';ctx.fillText(`🪙 ${_meta.coins} coins saved`,W/2,H*0.82);}
  ctx.textAlign='left';
}

function renderPlaying(){
  ctx.fillStyle=PALETTE.bg;ctx.fillRect(0,0,W,H);

  // Parallax BG (no camera transform)
  const parallax=[
    {speed:0.05,color:'rgba(0,20,60,0.6)'},
    {speed:0.15,color:'rgba(0,30,80,0.4)'},
    {speed:0.30,color:'rgba(0,40,100,0.3)'},
  ];
  parallax.forEach((layer,li)=>{
    const off=cam.x*layer.speed;
    for(let bi=0;bi<10;bi++){
      const bx=(bi*180-off%180)+li*40;
      const bh=50+li*30+bi*12,by=H-bh-li*20;
      ctx.fillStyle=layer.color;
      ctx.fillRect(bx%W-20,by,90+li*20,bh);
    }
  });
  // Neon scanlines
  for(let y=0;y<H;y+=4){ctx.fillStyle='rgba(0,0,20,0.08)';ctx.fillRect(0,y,W,2);}

  ctx.save();
  ctx.translate(-Math.round(cam.x),-Math.round(cam.y));

  // Platforms
  platforms.forEach(p=>{
    const isMoving=p.type==='moving',isOneWay=p.type==='oneWay';
    ctx.fillStyle=isOneWay?'#102030':isMoving?'#1a3a5a':PALETTE.platform;
    ctx.fillRect(p.x,p.y,p.w,p.h);
    // Neon top edge
    ctx.shadowBlur=8;ctx.shadowColor=PALETTE.platNeon;
    ctx.fillStyle=isOneWay?'#00ff88':isMoving?'#ffaa00':PALETTE.platNeon;
    ctx.fillRect(p.x,p.y,p.w,3);
    ctx.shadowBlur=0;
    // Circuit pattern on solid platforms
    if(!isOneWay&&p.w>60){
      ctx.strokeStyle='rgba(0,100,200,0.2)';ctx.lineWidth=1;
      for(let ci=p.x+16;ci<p.x+p.w-8;ci+=24){
        ctx.beginPath();ctx.moveTo(ci,p.y+6);ctx.lineTo(ci,p.y+p.h-4);ctx.stroke();
      }
    }
  });

  // Coins
  coinPool.active.forEach(c=>{
    const bob=Math.sin(c.bobTimer*4)*3;
    ctx.fillStyle=PALETTE.coin;ctx.shadowBlur=8;ctx.shadowColor=PALETTE.coin;
    ctx.beginPath();ctx.arc(c.x+c.w/2,c.y+c.h/2+bob,c.w/2,0,Math.PI*2);ctx.fill();
    ctx.shadowBlur=0;
    ctx.fillStyle='#aa7700';ctx.font='bold 9px monospace';ctx.textAlign='center';
    ctx.fillText('$',c.x+c.w/2,c.y+c.h/2+bob+3);ctx.textAlign='left';
  });

  // Enemies
  enemyPool.active.forEach(en=>{
    ctx.globalAlpha=en.flashTimer>0?0.3:1.0;
    const def=ENEMY_DEFS[en.type];
    const ex=en.x+en.w/2,ey=en.y+en.h/2;
    ctx.shadowBlur=8;ctx.shadowColor=def.color;
    if(en.type==='walker'){
      ctx.fillStyle=en.flashTimer>0?'#fff':def.color;
      ctx.beginPath();ctx.roundRect(en.x+2,en.y+2,en.w-4,en.h-4,4);ctx.fill();
      // Robot eye
      ctx.fillStyle='#ff0';ctx.shadowBlur=4;ctx.shadowColor='#ff0';
      const eyeX=en.facingRight?ex+4:ex-4;
      ctx.beginPath();ctx.arc(eyeX,ey-4,4,0,Math.PI*2);ctx.fill();
      // Legs
      ctx.fillStyle=def.color;
      ctx.fillRect(en.x+4,en.y+en.h-2,8,4);ctx.fillRect(en.x+en.w-12,en.y+en.h-2,8,4);
    }else if(en.type==='jumper'){
      ctx.fillStyle=en.flashTimer>0?'#fff':def.color;
      // Spring legs
      ctx.fillRect(en.x+4,en.y+en.h-6,6,6);ctx.fillRect(en.x+en.w-10,en.y+en.h-6,6,6);
      // Body
      ctx.beginPath();ctx.arc(ex,ey-4,en.w/2-2,0,Math.PI*2);ctx.fill();
      ctx.fillStyle='#ff0';ctx.shadowBlur=4;ctx.shadowColor='#ff0';
      ctx.beginPath();ctx.arc(ex,ey-8,3,0,Math.PI*2);ctx.fill();
    }else if(en.type==='drone'){
      ctx.fillStyle=en.flashTimer>0?'#fff':def.color;
      ctx.beginPath();ctx.ellipse(ex,ey,en.w/2,en.h/2,0,0,Math.PI*2);ctx.fill();
      // Rotors
      const rotAngle=bgTimer*5;
      for(let r=0;r<4;r++){
        const ra=rotAngle+r*Math.PI/2;
        const rx=ex+Math.cos(ra)*(en.w/2+6),ry=ey+Math.sin(ra)*(en.h/2+4);
        ctx.fillStyle='rgba(200,100,255,0.7)';ctx.beginPath();ctx.arc(rx,ry,5,0,Math.PI*2);ctx.fill();
      }
      ctx.fillStyle='#ff0';ctx.shadowBlur=6;ctx.shadowColor='#ff0';
      ctx.beginPath();ctx.arc(ex,ey,4,0,Math.PI*2);ctx.fill();
    }
    ctx.shadowBlur=0;ctx.globalAlpha=1;
    if(en.maxHp>1)drawBar(en.x,en.y-8,en.w,4,en.hp,en.maxHp,'#0f0','#400');
  });

  // Level exit portal
  if(!levelComplete){
    const pulse=0.6+Math.sin(bgTimer*3)*0.4;
    ctx.shadowBlur=20*pulse;ctx.shadowColor=PALETTE.exit;
    ctx.fillStyle=`rgba(0,255,136,${pulse*0.8})`;
    ctx.beginPath();ctx.arc(exitX+24,exitY+24,22,0,Math.PI*2);ctx.fill();
    ctx.strokeStyle=PALETTE.exit;ctx.lineWidth=3;
    ctx.beginPath();ctx.arc(exitX+24,exitY+24,28,0,Math.PI*2);ctx.stroke();
    ctx.lineWidth=1;ctx.shadowBlur=0;
    ctx.fillStyle='#fff';ctx.font='bold 10px system-ui,sans-serif';ctx.textAlign='center';
    ctx.fillText('EXIT',exitX+24,exitY+28);ctx.textAlign='left';
  }

  // Player
  const blink=player.iframes>0&&Math.floor(player.iframes/0.07)%2===0;
  if(!blink){
    ctx.globalAlpha=player.iframes>0?0.55:1.0;
    const px2=player.x+player.w/2,py2=player.y+player.h/2;
    const dW=player.w*player.squashX,dH=player.h*player.squashY;
    // Body
    ctx.fillStyle=PALETTE.player;ctx.shadowBlur=12;ctx.shadowColor=PALETTE.player;
    ctx.beginPath();ctx.roundRect(px2-dW/2,py2-dH/2,dW,dH,5);ctx.fill();
    ctx.shadowBlur=0;
    // Visor
    ctx.fillStyle='rgba(0,20,40,0.8)';
    const vw=dW*0.7,vh=dH*0.25,vx=px2-(player.facingRight?vw*0.1:-vw*0.9),vy=py2-dH*0.15;
    ctx.beginPath();ctx.roundRect(vx-vw/2,vy-vh/2,vw,vh,3);ctx.fill();
    ctx.fillStyle='rgba(0,200,255,0.6)';
    ctx.beginPath();ctx.roundRect(vx-vw/2,vy-vh/2,vw,vh,3);ctx.fill();
    // Jump trail
    if(!player.onGround&&player.vy<0){
      ctx.fillStyle='rgba(0,150,255,0.3)';
      ctx.beginPath();ctx.ellipse(px2,player.y+player.h+4,dW*0.4,4,0,0,Math.PI*2);ctx.fill();
    }
    ctx.globalAlpha=1;
  }

  ctx.restore();

  // HUD (screen space)
  drawText(`SCORE: ${GAME_SCORE}`,10,22,'#fff',14);
  drawText(`LVL ${currentLevel+1}/3`,W/2,22,'#88aacc',13,'center');
  drawText(`BEST: ${_hiScore}`,W-10,22,'#446',12,'right');
  // HP hearts
  for(let i=0;i<player.maxHp;i++){
    ctx.fillStyle=i<player.hp?'#ff4488':'#333';
    ctx.shadowBlur=i<player.hp?6:0;ctx.shadowColor='#ff4488';
    ctx.beginPath();
    const hx=14+i*22,hy=H-16;
    ctx.arc(hx-3,hy,5,Math.PI,0);ctx.arc(hx+3,hy,5,Math.PI,0);
    ctx.lineTo(hx,hy+8);ctx.closePath();ctx.fill();
    ctx.shadowBlur=0;
  }
  ctx.fillStyle='#ffdd00';ctx.font='11px system-ui,sans-serif';
  ctx.fillText(`🪙 ${player.coins}`,W-65,H-8);
  if(levelComplete){
    ctx.fillStyle='rgba(0,0,0,0.4)';ctx.fillRect(0,H/2-30,W,50);
    ctx.fillStyle='#00ff88';ctx.font='bold 20px system-ui,sans-serif';ctx.textAlign='center';
    ctx.fillText(`LEVEL ${currentLevel+1} COMPLETE!`,W/2,H/2+7);ctx.textAlign='left';
  }
}

// START
initGame();
requestAnimationFrame(t=>{lastTime=t;requestAnimationFrame(loop);});
</script>
</body></html>
