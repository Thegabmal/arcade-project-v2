<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Arcade AI — Play</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: #000; font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif; overflow: hidden; -webkit-font-smoothing: antialiased; }

    .game-bar {
      position: fixed; top: 0; left: 0; right: 0; z-index: 100;
      display: flex; align-items: center; gap: 12px;
      padding: 12px 20px;
      background: linear-gradient(to bottom, rgba(0,0,0,0.75) 0%, transparent 100%);
      transition: opacity 0.3s;
    }
    .game-bar.hidden-ui { opacity: 0; pointer-events: none; }
    .game-bar:hover { opacity: 1 !important; pointer-events: all !important; }

    .back-btn {
      display: flex; align-items: center; gap: 6px;
      padding: 6px 14px;
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 100px;
      color: #fff;
      text-decoration: none;
      font-size: 12px;
      font-weight: 500;
      letter-spacing: 0.01em;
      transition: background 0.15s, border-color 0.15s;
    }
    .back-btn:hover { background: rgba(255,255,255,0.14); border-color: rgba(255,255,255,0.18); }

    .game-title-bar {
      font-size: 13px;
      font-weight: 400;
      color: rgba(255,255,255,0.5);
      letter-spacing: -0.01em;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .scores-panel {
      position: fixed; bottom: 20px; right: 20px; z-index: 100;
      background: rgba(0,0,0,0.8);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 10px;
      padding: 14px 16px;
      font-family: 'Inter', sans-serif;
      font-size: 12px;
      color: rgba(255,255,255,0.35);
      min-width: 150px;
      backdrop-filter: blur(16px);
      transition: opacity 0.3s;
    }
    .scores-panel.hidden-ui { opacity: 0; pointer-events: none; }
    .scores-panel:hover { opacity: 1 !important; pointer-events: all !important; }

    .scores-heading {
      font-size: 9px;
      font-weight: 600;
      color: rgba(255,255,255,0.2);
      letter-spacing: 0.1em;
      text-transform: uppercase;
      margin-bottom: 10px;
    }

    .score-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 3px 0;
      gap: 16px;
    }

    .score-row .s-label {
      color: rgba(255,255,255,0.35);
      font-size: 11px;
    }

    .score-row .s-val {
      font-weight: 500;
      font-size: 12px;
      color: rgba(255,255,255,0.6);
      font-variant-numeric: tabular-nums;
    }

    .score-row .s-val.good { color: rgba(100,220,100,0.85); }
    .score-row .s-val.mid  { color: rgba(220,180,50,0.85); }
    .score-row .s-val.bad  { color: rgba(220,80,80,0.85); }

    .score-divider {
      border: none;
      border-top: 1px solid rgba(255,255,255,0.06);
      margin: 6px 0;
    }

    .hint {
      position: fixed;
      bottom: 20px; left: 20px;
      z-index: 100;
      font-size: 10px;
      color: rgba(255,255,255,0.15);
      font-family: 'Inter', sans-serif;
      letter-spacing: 0.02em;
    }

    .log-btn {
      display: flex; align-items: center; gap: 5px;
      padding: 5px 12px;
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 100px;
      color: rgba(255,255,255,0.5);
      font-size: 11px; font-weight: 500;
      cursor: pointer; text-decoration: none;
      transition: background 0.15s;
    }
    .log-btn:hover { background: rgba(255,255,255,0.12); color: #fff; }

    .reeval-btn {
      display: none; align-items: center; gap: 5px;
      padding: 5px 12px;
      background: rgba(80,140,255,0.1);
      border: 1px solid rgba(80,140,255,0.25);
      border-radius: 100px;
      color: rgba(120,170,255,0.8);
      font-size: 11px; font-weight: 500;
      cursor: pointer;
      transition: background 0.15s;
    }
    .reeval-btn:hover { background: rgba(80,140,255,0.2); color: #fff; }
    .reeval-btn:disabled { opacity: 0.4; cursor: not-allowed; }

    .reeval-overlay {
      display: none; position: fixed; inset: 0; z-index: 8000;
      background: rgba(0,0,0,0.75); backdrop-filter: blur(6px);
      align-items: center; justify-content: center;
    }
    .reeval-overlay.open { display: flex; }
    .reeval-card {
      background: #0d0d14; border: 1px solid rgba(80,140,255,0.2);
      border-radius: 14px; padding: 28px 32px; min-width: 300px;
      text-align: center; font-family: 'Inter', sans-serif;
    }
    .reeval-card h3 { color: rgba(255,255,255,0.8); font-size: 14px; margin-bottom: 8px; }
    .reeval-card p  { color: rgba(255,255,255,0.35); font-size: 11px; margin-bottom: 20px; }
    .reeval-progress {
      height: 3px; background: rgba(255,255,255,0.08);
      border-radius: 2px; overflow: hidden; margin-bottom: 16px;
    }
    .reeval-progress-bar {
      height: 100%; background: rgba(80,140,255,0.7);
      border-radius: 2px;
      animation: reeval-slide 1.4s ease-in-out infinite;
    }
    @keyframes reeval-slide {
      0%   { width: 0%;   margin-left: 0; }
      50%  { width: 60%;  margin-left: 20%; }
      100% { width: 0%;   margin-left: 100%; }
    }
    .reeval-status { font-size: 11px; color: rgba(255,255,255,0.3); min-height: 16px; }
    .reeval-result { display: none; }
    .reeval-score  { font-size: 36px; font-weight: 700; color: rgba(100,220,100,0.9); margin: 10px 0 4px; }
    .reeval-close  {
      margin-top: 18px; padding: 7px 20px;
      background: rgba(255,255,255,0.07); border: 1px solid rgba(255,255,255,0.12);
      border-radius: 100px; color: rgba(255,255,255,0.5);
      font-size: 12px; cursor: pointer;
    }
    .reeval-close:hover { background: rgba(255,255,255,0.12); color: #fff; }

    .log-modal-overlay {
      display: none; position: fixed; inset: 0; z-index: 9999;
      background: rgba(0,0,0,0.85); backdrop-filter: blur(6px);
      align-items: center; justify-content: center;
    }
    .log-modal-overlay.open { display: flex; }
    .log-modal {
      background: #0c0c0c; border: 1px solid rgba(255,255,255,0.1);
      border-radius: 12px; width: 90%; max-width: 820px; max-height: 80vh;
      display: flex; flex-direction: column; overflow: hidden;
    }
    .log-modal-header {
      display: flex; align-items: center; justify-content: space-between;
      padding: 14px 20px; border-bottom: 1px solid rgba(255,255,255,0.07);
      font-size: 12px; color: rgba(255,255,255,0.5);
    }
    .log-modal-close {
      background: none; border: none; color: rgba(255,255,255,0.4);
      cursor: pointer; font-size: 18px; padding: 2px 6px;
    }
    .log-modal-close:hover { color: #fff; }
    .log-modal-body {
      overflow-y: auto; padding: 16px 20px; flex: 1;
      font-family: 'Courier New', monospace; font-size: 11px;
      line-height: 1.6; color: rgba(255,255,255,0.55);
      white-space: pre-wrap; word-break: break-word;
    }
    .log-modal-body .log-success { color: rgba(100,220,100,0.9); }
    .log-modal-body .log-warn    { color: rgba(220,180,50,0.9); }
    .log-modal-body .log-error   { color: rgba(220,80,80,0.9); }
    .log-modal-body .log-section { color: rgba(100,180,255,0.9); font-weight: bold; }

    .game-iframe {
      position: fixed;
      top: 0; left: 0;
      width: 100vw; height: 100vh;
      border: none;
      z-index: 1;
    }
  </style>
</head>
<body>
  <div class="game-bar" id="game-ui">
    <a href="/" class="back-btn">
      <svg width="12" height="12" viewBox="0 0 12 12" fill="none">
        <path d="M8 2L3 6l5 4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      Back
    </a>
    <span class="game-title-bar" id="game-title-bar">Loading...</span>
    <button class="log-btn" id="log-btn" onclick="openLogModal()" style="display:none">Log</button>
    <button class="reeval-btn" id="reeval-btn" onclick="startReevaluation()" style="display:flex">Réévaluer</button>
  </div>

  <!-- Overlay réévaluation -->
  <div id="reeval-overlay" class="reeval-overlay">
    <div class="reeval-card">
      <h3>Réévaluation en cours</h3>
      <p>Les agents analysent le code actuel du jeu…</p>
      <div class="reeval-progress"><div class="reeval-progress-bar"></div></div>
      <div class="reeval-status" id="reeval-status">Initialisation…</div>
      <div class="reeval-result" id="reeval-result">
        <div class="reeval-score" id="reeval-score-val">—</div>
        <div style="font-size:11px;color:rgba(255,255,255,0.35);margin-bottom:4px">Score global / 10</div>
      </div>
      <button class="reeval-close" id="reeval-close" onclick="closeReevalOverlay()" style="display:none">Fermer & actualiser</button>
    </div>
  </div>

  <!-- Log viewer modal -->
  <div id="log-modal-overlay" class="log-modal-overlay" onclick="if(event.target===this)closeLogModal()">
    <div class="log-modal">
      <div class="log-modal-header">
        <span>Pipeline log</span>
        <button class="log-modal-close" onclick="closeLogModal()">×</button>
      </div>
      <div id="log-modal-body" class="log-modal-body">Loading...</div>
    </div>
  </div>

  <div class="scores-panel" id="scores-panel">
    <div class="scores-heading">AI Scores</div>
    <div id="scores-content">
      <div class="score-row"><span class="s-label">Loading...</span></div>
    </div>
  </div>

  <div class="hint">Hover to show UI</div>

  <iframe id="game-iframe" class="game-iframe" src="" title="Game" sandbox="allow-scripts allow-same-origin allow-pointer-lock"></iframe>

  <script>
    const filename = "{{ filename }}";
    document.getElementById('game-iframe').src = `/game-file/${filename}`;

    setTimeout(() => {
      document.getElementById('game-ui').classList.add('hidden-ui');
      document.getElementById('scores-panel').classList.add('hidden-ui');
    }, 3000);

    function loadGameMeta() {
      return fetch('/api/history').then(r => r.json()).then(games => {
        const game = games.find(g => g.html_basename === filename);
        if (!game) return;
        document.getElementById('game-title-bar').textContent = game.titre || filename;
        document.title = `${game.titre || 'Game'} — Arcade AI`;
        renderScores(game);
        document.getElementById('reeval-btn').style.display = 'flex';
        if (document.getElementById('log-btn')) document.getElementById('log-btn').style.display = 'flex';
      });
    }

    function renderScores(game) {
      const scores = game.scores || {};
      const cls = v => v >= 8 ? 'good' : v >= 6 ? 'mid' : 'bad';
      const labels = {
        technique: 'Technique', gameplay: 'Gameplay', visuel: 'Visual',
        execution: 'Execution', playtester: 'Playtester'
      };
      let html = Object.entries(labels)
        .filter(([k]) => scores[k] !== undefined)
        .map(([k, l]) => `<div class="score-row">
          <span class="s-label">${l}</span>
          <span class="s-val ${cls(scores[k])}">${scores[k].toFixed(1)}</span>
        </div>`).join('');
      if (scores.global !== undefined) {
        html += `<hr class="score-divider">
          <div class="score-row">
            <span class="s-label" style="color:rgba(255,255,255,0.5);font-weight:500">Global</span>
            <span class="s-val ${cls(scores.global)}" style="font-size:14px;font-weight:600">${scores.global.toFixed(1)}/10</span>
          </div>`;
      }
      if (game.duree_secondes) {
        const m = Math.floor(game.duree_secondes / 60);
        const s = game.duree_secondes % 60;
        const dur = m > 0 ? `${m}m ${String(s).padStart(2,'0')}s` : `${s}s`;
        html += `<div class="score-row" style="margin-top:6px">
          <span class="s-label">Generated in</span>
          <span class="s-val" style="font-size:11px">${dur}</span>
        </div>`;
      }
      document.getElementById('scores-content').innerHTML = html || '<div class="score-row"><span class="s-label">—</span></div>';
    }

    loadGameMeta().catch(() => {
      document.getElementById('game-title-bar').textContent = filename;
    });

    // ── Réévaluation ──
    async function startReevaluation() {
      const btn = document.getElementById('reeval-btn');
      btn.disabled = true;
      document.getElementById('reeval-overlay').classList.add('open');
      document.getElementById('reeval-result').style.display = 'none';
      document.getElementById('reeval-close').style.display = 'none';
      document.getElementById('reeval-status').textContent = 'Lancement des agents…';

      try {
        const res = await fetch('/api/reevaluate', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ filename }),
        });
        const { session_id, error } = await res.json();
        if (error) throw new Error(error);

        const evtSource = new EventSource(`/api/stream/${session_id}`);
        evtSource.onmessage = e => {
          const event = JSON.parse(e.data);
          if (event.type === 'agent_start') {
            document.getElementById('reeval-status').textContent = `${event.data.agent}…`;
          } else if (event.type === 'score') {
            document.getElementById('reeval-status').textContent = `${event.data.label} : ${event.data.value}`;
          } else if (event.type === 'complete') {
            evtSource.close();
            const score = event.data.score;
            const scoreEl = document.getElementById('reeval-score-val');
            scoreEl.textContent = `${score.toFixed(1)}/10`;
            scoreEl.style.color = score >= 8 ? 'rgba(100,220,100,0.9)' : score >= 6 ? 'rgba(220,180,50,0.9)' : 'rgba(220,80,80,0.9)';
            document.getElementById('reeval-result').style.display = 'block';
            document.getElementById('reeval-status').textContent = 'Terminé — metadata mis à jour.';
            document.getElementById('reeval-close').style.display = 'inline-block';
            document.querySelector('.reeval-progress-bar').style.animation = 'none';
            document.querySelector('.reeval-progress-bar').style.width = '100%';
          } else if (event.type === 'error') {
            evtSource.close();
            document.getElementById('reeval-status').textContent = `Erreur : ${event.data.message}`;
            document.getElementById('reeval-close').style.display = 'inline-block';
          } else if (event.type === 'end') {
            evtSource.close();
          }
        };
        evtSource.onerror = () => {
          evtSource.close();
          document.getElementById('reeval-status').textContent = 'Connexion perdue.';
          document.getElementById('reeval-close').style.display = 'inline-block';
        };
      } catch(err) {
        document.getElementById('reeval-status').textContent = `Erreur : ${err.message}`;
        document.getElementById('reeval-close').style.display = 'inline-block';
        btn.disabled = false;
      }
    }

    function closeReevalOverlay() {
      document.getElementById('reeval-overlay').classList.remove('open');
      document.getElementById('reeval-btn').disabled = false;
      // Recharger les scores depuis le metadata mis à jour
      loadGameMeta().catch(() => {});
    }


    async function openLogModal() {
      document.getElementById('log-modal-body').textContent = 'Loading...';
      document.getElementById('log-modal-overlay').classList.add('open');
      try {
        const res = await fetch(`/api/game-log/${filename}`);
        if (!res.ok) { document.getElementById('log-modal-body').textContent = 'Log non disponible.'; return; }
        const text = await res.text();
        const body = document.getElementById('log-modal-body');
        const lines = text.split('\n').map(line => {
          const esc = line.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
          if (/\[SUCCESS\]/.test(line)) return `<span class="log-success">${esc}</span>`;
          if (/\[WARNING\]/.test(line)) return `<span class="log-warn">${esc}</span>`;
          if (/\[ERROR\]/.test(line))   return `<span class="log-error">${esc}</span>`;
          if (/\[SECTION\]/.test(line)) return `<span class="log-section">${esc}</span>`;
          return esc;
        });
        body.innerHTML = lines.join('\n');
      } catch(e) {
        document.getElementById('log-modal-body').textContent = `Erreur : ${e.message}`;
      }
    }

    function closeLogModal() {
      document.getElementById('log-modal-overlay').classList.remove('open');
    }

    document.addEventListener('keydown', e => { if (e.key === 'Escape') closeLogModal(); });
  </script>
</body>
</html>
