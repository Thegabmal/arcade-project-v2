body{background:#000;display:flex;align-items:center;justify-content:center;height:100vh;overflow:hidden;}
canvas{display:block;}
</style></head><body>
<canvas id="gameCanvas"></canvas>
<script>
// ══════════════════════════════════════════════════════════════════
// ENGINE — DO NOT MODIFY
window.__devPatch=function(code){return eval(code);};
const canvas=document.getElementById('gameCanvas');
const ctx=canvas.getContext('2d');
const DPR=Math.min(window.devicePixelRatio||1,2);
const GAME_W=800,GAME_H=600;
let W=GAME_W,H=GAME_H;
function resizeCanvas(){const s=Math.min(window.innerWidth/W,window.innerHeight/H);canvas.style.width=Math.round(W*s)+'px';canvas.style.height=Math.round(H*s)+'px';canvas.width=Math.round(W*DPR);canvas.height=Math.round(H*DPR);ctx.scale(DPR,DPR);}
resizeCanvas();window.addEventListener('resize',()=>{resizeCanvas();ctx.scale(DPR,DPR);});

let gameState='title';
function setState(s){gameState=s;}

const Keys={down:{},pressed:{}};
window.addEventListener('keydown',e=>{if(!Keys.down[e.code])Keys.pressed[e.code]=true;Keys.down[e.code]=true;if(['Space','Enter','ArrowUp','ArrowDown'].includes(e.code))e.preventDefault();});
window.addEventListener('keyup',e=>{Keys.down[e.code]=false;});
const Pointer={x:0,y:0,justDown:false};
canvas.addEventListener('mousedown',e=>{const r=canvas.getBoundingClientRect();Pointer.x=(e.clientX-r.left)*(W/r.width);Pointer.y=(e.clientY-r.top)*(H/r.height);Pointer.justDown=true;});
canvas.addEventListener('touchstart',e=>{e.preventDefault();const r=canvas.getBoundingClientRect();Pointer.x=(e.touches[0].clientX-r.left)*(W/r.width);Pointer.y=(e.touches[0].clientY-r.top)*(H/r.height);Pointer.justDown=true;},{passive:false});

function keyPressed(c){return!!Keys.pressed[c];}
function anyAction(){return keyPressed('Space')||keyPressed('Enter')||Pointer.justDown;}
function flushInput(){Keys.pressed={};Pointer.justDown=false;}

const sfx={_ctx:null,init(){try{if(!this._ctx)this._ctx=new(window.AudioContext||window.webkitAudioContext)();if(this._ctx.state==='suspended')this._ctx.resume();}catch(e){}},
play(f,d,t,v){try{this.init();if(!this._ctx)return;const o=this._ctx.createOscillator(),g=this._ctx.createGain();o.type=t||'sine';o.frequency.value=f||440;g.gain.setValueAtTime(v||0.10,this._ctx.currentTime);g.gain.exponentialRampToValueAtTime(0.001,this._ctx.currentTime+(d||0.15));o.connect(g);g.connect(this._ctx.destination);o.start();o.stop(this._ctx.currentTime+(d||0.15));}catch(e){}}};

function lerp(a,b,t){return a+(b-a)*t;}
function clamp(v,mn,mx){return v<mn?mn:v>mx?mx:v;}
function randInt(a,b){return a+Math.floor(Math.random()*(b-a+1));}
function randFloat(a,b){return a+Math.random()*(b-a);}
function randChoice(arr){return arr[Math.floor(Math.random()*arr.length)];}
function drawText(t,x,y,c,s,a){ctx.fillStyle=c||'#fff';ctx.font=`${s||14}px 'Courier New',monospace`;ctx.textAlign=a||'left';ctx.fillText(t,x,y);}
function drawTextB(t,x,y,c,s,a){ctx.fillStyle=c||'#fff';ctx.font=`bold ${s||14}px system-ui,sans-serif`;ctx.textAlign=a||'left';ctx.fillText(t,x,y);}
function drawBar(x,y,w,h,v,m,fg,bg){ctx.fillStyle=bg||'#333';ctx.fillRect(x,y,w,h);ctx.fillStyle=fg||'#0f0';ctx.fillRect(x,y,Math.round(w*clamp(v/m,0,1)),h);ctx.strokeStyle='rgba(0,0,0,0.4)';ctx.lineWidth=1;ctx.strokeRect(x,y,w,h);}

const FIXED_DT=1/60;
const MAX_DT=0.1;
let lastTime=0;
let accumulator=0;
function loop(ts){const rd=Math.min((ts-lastTime)/1000,MAX_DT);lastTime=ts;accumulator+=rd;while(accumulator>=FIXED_DT){update(FIXED_DT);accumulator-=FIXED_DT;}renderFrame();requestAnimationFrame(loop);}
function update(dt){
  switch(gameState){
    case 'title':   updateTitle(dt);   break;
    case 'scene':   updateScene(dt);   break;
    case 'battle':  updateBattle(dt);  break;
    case 'levelup': updateLevelUp(dt); break;
    case 'gameover':updateGameover(dt);break;
    case 'shop':    updateShop(dt);    break;
    case 'victory': if(anyAction()){restartGame();}break;
  }
  flushInput();
}
function renderFrame(){
  switch(gameState){
    case 'title':   renderTitle();   break;
    case 'scene':   renderScene();   break;
    case 'battle':  renderBattle();  break;
    case 'levelup': renderLevelUp(); break;
    case 'gameover':renderGameover();break;
    case 'shop':    renderShop();    break;
    case 'victory': renderVictory(); break;
  }
}

// SCENE GRAPH — sci-fi narrative
const SCENES={

// DIALOGUE SYSTEM
let currentScene=null,lineIndex=0,typeTimer=0,typePos=0;
const TYPE_SPEED=40;
let displayedText='',textComplete=false,choiceIndex=0,storyFlags={},scenePhase='dialogue';

function gotoScene(id){
  if(id==='__VICTORY__'){setState('victory');return;}
  const scene=SCENES[id];if(!scene){console.warn('Scene not found:',id);return;}
  currentScene=scene;lineIndex=0;typePos=0;typeTimer=0;
  displayedText='';textComplete=false;choiceIndex=0;scenePhase='dialogue';
  bgTransition={from:currentBg,to:scene.bg,t:0};setState('scene');
}
function getCurrentLine(){return currentScene&&currentScene.lines[lineIndex]||null;}
function advanceDialogue(){
  if(!textComplete){typePos=getCurrentLine().text.length;textComplete=true;return;}
  lineIndex++;
  if(lineIndex>=currentScene.lines.length){
    if(currentScene.battle&&!storyFlags['battle_'+currentScene.id]){startBattle(currentScene.battle);return;}
    if(currentScene.choices&&currentScene.choices.length>0){scenePhase='choices';return;}
    if(currentScene.auto){gotoScene(currentScene.auto);return;}
    return;
  }
  typePos=0;typeTimer=0;displayedText='';textComplete=false;
}
function updateScene(dt){
  if(scenePhase==='dialogue'){
    const line=getCurrentLine();if(!line)return;
    if(!textComplete){
      typeTimer+=dt;
      const target=Math.floor(typeTimer*TYPE_SPEED);
      if(target>=line.text.length){typePos=line.text.length;textComplete=true;sfx.play(800,0.03,'square',0.04);}
      else if(target>typePos){typePos=target;if(typePos%4===0)sfx.play(500+Math.random()*120,0.02,'square',0.03);}
      displayedText=line.text.slice(0,typePos);
    }
    if(anyAction())advanceDialogue();
  }else{
    if(keyPressed('ArrowUp')&&choiceIndex>0){choiceIndex--;sfx.play(600,0.05,'square',0.05);}
    if(keyPressed('ArrowDown')&&choiceIndex<currentScene.choices.length-1){choiceIndex++;sfx.play(600,0.05,'square',0.05);}
    if(anyAction()){const ch=currentScene.choices[choiceIndex];if(ch){sfx.play(800,0.08,'square',0.08);gotoScene(ch.goto);}}
  }
}

// TURN-BASED BATTLE
let enemy=null,battleState='player_turn',battleLog=[],battleMenu={selected:0,open:true},battleTimer=0,battleResult='',returnToScene='';

function startBattle(def){
  storyFlags['battle_'+currentScene.id]=true;
  returnToScene=currentScene.auto||'';
  enemy={...def,hp:def.hp,maxHp:def.hp,animX:0,shakeTimer:0};
  battleLog=[`${def.name} engaged!`];
  battleState='player_turn';battleMenu.selected=0;battleMenu.open=true;battleTimer=0;
  setState('battle');sfx.play(180,0.30,'sawtooth',0.12);
}
function battleAction(action){
  battleMenu.open=false;let dmg=0,log='';
  if(action===0){
    dmg=Math.max(1,hero.atk+randInt(-3,3)-enemy.def);
    log=`Pulse Shot! ${dmg} damage.`;enemy.hp=Math.max(0,enemy.hp-dmg);enemy.shakeTimer=0.25;
    sfx.play(440,0.10,'square',0.10);
  }else if(action===1){
    if(hero.mp>=10){dmg=Math.max(1,Math.floor(hero.atk*1.8+randInt(-2,2)));hero.mp-=10;log=`EMP Burst! ${dmg} damage.`;enemy.hp=Math.max(0,enemy.hp-dmg);sfx.play(220,0.18,'sawtooth',0.12);}
    else{log='Insufficient power!';battleMenu.open=true;return;}
  }else if(action===2){
    log='Firewall deployed — defense doubled.';hero._defending=true;
  }else if(action===3){
    if(hero._potions>0){hero._potions--;const heal=randInt(22,38);hero.hp=Math.min(hero.maxHp,hero.hp+heal);log=`Stim Pack! +${heal} HP.`;}
    else{log='No Stim Packs remaining!';battleMenu.open=true;return;}
  }
  battleLog.push(log);if(battleLog.length>4)battleLog.shift();
  if(enemy.hp<=0){battleState='result';battleResult='win';battleTimer=1.5;return;}
  battleState='enemy_turn';battleTimer=0.9;
}
function updateBattle(dt){
  if(enemy.shakeTimer>0){enemy.shakeTimer-=dt;enemy.animX=(Math.random()*2-1)*5;}else{enemy.animX=0;}
  if(battleState==='player_turn'&&battleMenu.open){
    if(keyPressed('ArrowUp'))battleMenu.selected=Math.max(0,battleMenu.selected-1);
    if(keyPressed('ArrowDown'))battleMenu.selected=Math.min(hero.abilities.length-1,battleMenu.selected+1);
    if(keyPressed('Space')||keyPressed('Enter')||Pointer.justDown){
      let idx=battleMenu.selected;
      if(Pointer.justDown){const menuY=H-160;hero.abilities.forEach((_,i)=>{if(Pointer.y>menuY+i*36&&Pointer.y<menuY+i*36+32)idx=i;});}
      battleAction(idx);
    }
    return;
  }
  if(battleState==='enemy_turn'){
    battleTimer-=dt;
    if(battleTimer<=0){
      const def=hero._defending?Math.floor(hero.def*1.8):hero.def;hero._defending=false;
      const dmg=Math.max(1,enemy.atk+randInt(-3,3)-def);
      hero.hp=Math.max(0,hero.hp-dmg);
      battleLog.push(`${enemy.name} attacks! -${dmg} HP`);if(battleLog.length>4)battleLog.shift();
      sfx.play(120,0.18,'sawtooth',0.12);
      if(hero.hp<=0){battleState='result';battleResult='lose';battleTimer=1.5;return;}
      battleState='player_turn';battleMenu.open=true;battleMenu.selected=0;
    }
    return;
  }
  if(battleState==='result'){
    battleTimer-=dt;
    if(battleTimer<=0){
      if(battleResult==='win'){
        hero.xp+=Math.floor(enemy.reward.xp*_xpMult);hero.gold+=enemy.reward.gold;
        sfx.play(660,0.2,'sine',0.10);
        if(hero.xp>=hero.level*80){
          hero.xp-=hero.level*80;hero.level++;
          hero.maxHp+=15;hero.hp=Math.min(hero.hp+25,hero.maxHp);
          hero.atk+=3;hero.def+=2;hero.maxMp+=8;setState('levelup');
        }else{if(returnToScene)gotoScene(returnToScene);else setState('scene');}
      }else{_runCoins=hero.gold;_gameoverTimer=1.5;setState('gameover');}
    }
  }
}
let levelupTimer=0;
function updateLevelUp(dt){levelupTimer+=dt;if(anyAction()||levelupTimer>3){levelupTimer=0;if(returnToScene)gotoScene(returnToScene);else setState('scene');}}

// BACKGROUNDS
let currentBg='station',bgTransition={from:'station',to:'station',t:1};
function drawBackground(bg){
  const bgs={
    station:()=>{
      const g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#020810');g.addColorStop(1,'#041428');
      ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
      // Grid floor
      ctx.strokeStyle='rgba(0,170,200,0.10)';ctx.lineWidth=1;
      for(let x=0;x<W;x+=50){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,H);ctx.stroke();}
      for(let y=0;y<H;y+=50){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke();}
      // Holographic panels
      [[60,80,160,220],[580,60,160,240],[200,40,120,60],[480,50,110,55]].forEach(([px,py,pw,ph])=>{
        ctx.fillStyle='rgba(0,170,200,0.05)';ctx.strokeStyle='rgba(0,200,255,0.25)';ctx.lineWidth=1;
        ctx.fillRect(px,py,pw,ph);ctx.strokeRect(px,py,pw,ph);
        ctx.fillStyle='rgba(0,255,200,0.12)';ctx.fillRect(px+8,py+8,pw-16,8);ctx.fillRect(px+8,py+22,pw-16,4);
      });
      ctx.fillStyle='#021020';ctx.fillRect(0,H-40,W,40);
      ctx.strokeStyle='rgba(0,200,255,0.3)';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(0,H-40);ctx.lineTo(W,H-40);ctx.stroke();
    },
    corridor:()=>{
      ctx.fillStyle='#010508';ctx.fillRect(0,0,W,H);
      // Tunnel perspective
      ctx.strokeStyle='rgba(0,180,220,0.18)';ctx.lineWidth=1;
      [[0,0,W/2,H/2],[W,0,W/2,H/2],[0,H,W/2,H/2],[W,H,W/2,H/2]].forEach(([x1,y1,x2,y2])=>{ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.stroke();});
      // Warning strips
      ctx.fillStyle='rgba(255,100,0,0.08)';ctx.fillRect(0,0,W,8);ctx.fillRect(0,H-8,W,8);
      // Emergency lights
      [120,360,600].forEach(lx=>{ctx.fillStyle='rgba(255,50,50,0.15)';ctx.shadowBlur=20;ctx.shadowColor='#ff3300';ctx.fillRect(lx-4,0,8,H);ctx.shadowBlur=0;});
      ctx.fillStyle='rgba(0,20,40,0.6)';ctx.fillRect(0,H-60,W,60);
    },
    datacore:()=>{
      ctx.fillStyle='#020812';ctx.fillRect(0,0,W,H);
      // Server racks
      for(let sx=0;sx<4;sx++){
        const rx=80+sx*165;
        ctx.fillStyle='#0a1828';ctx.fillRect(rx,40,120,H-80);ctx.strokeStyle='rgba(0,180,255,0.2)';ctx.lineWidth=1;ctx.strokeRect(rx,40,120,H-80);
        for(let row=0;row<12;row++){
          const ry=60+row*38,active=Math.random()>0.3;
          ctx.fillStyle=active?'rgba(0,200,255,0.15)':'rgba(40,40,60,0.5)';ctx.fillRect(rx+8,ry,104,28);
          ctx.fillStyle=active?'#00ffcc':'#226644';ctx.beginPath();ctx.arc(rx+16,ry+14,4,0,Math.PI*2);ctx.fill();
        }
      }
      // Central node glow
      ctx.fillStyle='rgba(0,150,220,0.06)';ctx.shadowBlur=40;ctx.shadowColor='#0088ff';ctx.beginPath();ctx.arc(W/2,H/2,80,0,Math.PI*2);ctx.fill();ctx.shadowBlur=0;
    },
    voidspace:()=>{
      ctx.fillStyle='#000';ctx.fillRect(0,0,W,H);
      // Stars
      ctx.fillStyle='rgba(180,200,255,0.6)';
      for(let i=0;i<80;i++){const sx=(i*137+50)%W,sy=(i*89+30)%H;ctx.beginPath();ctx.arc(sx,sy,0.8,0,Math.PI*2);ctx.fill();}
      // Void tendrils
      ctx.strokeStyle='rgba(255,30,0,0.08)';ctx.lineWidth=2;
      for(let i=0;i<6;i++){const ang=i*Math.PI/3;ctx.beginPath();ctx.moveTo(W/2,H/2);ctx.lineTo(W/2+Math.cos(ang)*400,H/2+Math.sin(ang)*400);ctx.stroke();}
      // Data fragments
      ctx.fillStyle='rgba(0,200,255,0.06)';
      [[150,100,60,40],[500,150,80,50],[350,400,70,35],[620,350,55,30]].forEach(([fx,fy,fw,fh])=>{ctx.fillRect(fx,fy,fw,fh);ctx.strokeStyle='rgba(0,200,255,0.15)';ctx.lineWidth=1;ctx.strokeRect(fx,fy,fw,fh);});
    },
    restored:()=>{
      const g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#001428');g.addColorStop(1,'#002840');
      ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
      ctx.shadowBlur=60;ctx.shadowColor='#00ffcc';ctx.fillStyle='rgba(0,255,200,0.25)';ctx.beginPath();ctx.arc(W/2,H*0.35,100,0,Math.PI*2);ctx.fill();ctx.shadowBlur=0;
      for(let i=0;i<8;i++){const ang=i*Math.PI/4;ctx.strokeStyle='rgba(0,200,200,0.20)';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(W/2,H*0.35);ctx.lineTo(W/2+Math.cos(ang)*240,H*0.35+Math.sin(ang)*240);ctx.stroke();}
    },
  };
  (bgs[bg]||bgs.station)();
}

// CHARACTER PORTRAITS — sci-fi style
function drawCharacter(charId,side,mood,alpha){
  const def=CHAR_COLORS[charId];if(!def)return;
  const x=side==='left'?15:side==='right'?W-195:W/2-95;
  const y=H-295;
  ctx.globalAlpha=alpha||1;
  // Suit/body
  ctx.fillStyle=def.body;
  ctx.beginPath();ctx.moveTo(x+80,y+155);ctx.lineTo(x+18,y+295);ctx.lineTo(x+142,y+295);ctx.closePath();ctx.fill();
  ctx.beginPath();ctx.ellipse(x+80,y+178,33,46,0,0,Math.PI*2);ctx.fill();
  // Head
  ctx.fillStyle=def.body;ctx.beginPath();ctx.arc(x+80,y+100,44,0,Math.PI*2);ctx.fill();
  // Hair
  ctx.fillStyle=def.hair;ctx.beginPath();ctx.arc(x+80,y+82,46,Math.PI,0);ctx.fill();ctx.fillRect(x+34,y+78,92,22);
  // Visor/Eyes
  const ey=mood==='angry'?-3:mood==='happy'?2:0;
  if(charId==='aria'||charId==='villain'){
    // Visor band
    ctx.fillStyle=charId==='villain'?'rgba(255,20,0,0.5)':'rgba(0,200,255,0.4)';
    ctx.fillRect(x+46,y+98+ey,68,16);
    ctx.fillStyle=def.eye;ctx.shadowBlur=8;ctx.shadowColor=def.eye;
    ctx.beginPath();ctx.arc(x+63,y+106+ey,7,0,Math.PI*2);ctx.fill();ctx.beginPath();ctx.arc(x+97,y+106+ey,7,0,Math.PI*2);ctx.fill();ctx.shadowBlur=0;
  }else{
    ctx.fillStyle=def.eye;ctx.beginPath();ctx.arc(x+63,y+104+ey,8,0,Math.PI*2);ctx.fill();ctx.beginPath();ctx.arc(x+97,y+104+ey,8,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='#111';ctx.beginPath();ctx.arc(x+64,y+105+ey,4,0,Math.PI*2);ctx.fill();ctx.beginPath();ctx.arc(x+98,y+105+ey,4,0,Math.PI*2);ctx.fill();
  }
  // Mouth
  ctx.strokeStyle='#333';ctx.lineWidth=2;ctx.beginPath();
  if(mood==='happy'){ctx.arc(x+80,y+122,12,0.1*Math.PI,0.9*Math.PI);}
  else if(mood==='angry'){ctx.arc(x+80,y+130,12,1.1*Math.PI,1.9*Math.PI);}
  else{ctx.moveTo(x+68,y+126);ctx.lineTo(x+92,y+126);}
  ctx.stroke();
  // Details
  if(charId==='hero'){
    // Tool belt / tech chest
    ctx.fillStyle='#0a2a3a';ctx.fillRect(x+48,y+165,64,22);
    ctx.fillStyle='#00aacc';ctx.beginPath();ctx.arc(x+66,y+176,5,0,Math.PI*2);ctx.fill();ctx.beginPath();ctx.arc(x+80,y+176,5,0,Math.PI*2);ctx.fill();ctx.beginPath();ctx.arc(x+94,y+176,5,0,Math.PI*2);ctx.fill();
  }else if(charId==='aria'){
    // Holographic projector on arm
    ctx.strokeStyle='rgba(0,200,255,0.6)';ctx.lineWidth=1;
    ctx.beginPath();ctx.arc(x+130,y+180,16,0,Math.PI*2);ctx.stroke();
    ctx.fillStyle='rgba(0,200,255,0.15)';ctx.beginPath();ctx.arc(x+130,y+180,16,0,Math.PI*2);ctx.fill();
  }else if(charId==='soldier'){
    // Shoulder pad and rifle
    ctx.fillStyle='#2a3a1a';ctx.beginPath();ctx.arc(x+32,y+168,18,0,Math.PI*2);ctx.fill();ctx.beginPath();ctx.arc(x+128,y+168,18,0,Math.PI*2);ctx.fill();
    ctx.strokeStyle='#4a5a3a';ctx.lineWidth=8;ctx.beginPath();ctx.moveTo(x+130,y+200);ctx.lineTo(x+158,y+248);ctx.stroke();
  }else if(charId==='villain'){
    // Corruption aura
    ctx.shadowBlur=24;ctx.shadowColor='#ff2200';ctx.fillStyle='rgba(120,0,0,0.22)';ctx.beginPath();ctx.arc(x+80,y+140,80,0,Math.PI*2);ctx.fill();ctx.shadowBlur=0;
    // Glitch lines
    ctx.strokeStyle='rgba(255,30,0,0.5)';ctx.lineWidth=1;
    [[x+30,y+90,x+130,y+90],[x+20,y+140,x+40,y+140],[x+120,y+155,x+145,y+155]].forEach(([x1,y1,x2,y2])=>{ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.stroke();});
  }
  ctx.globalAlpha=1;
}

// ENEMY SPRITES
function drawEnemySprite(e,ex,ey){
  ctx.save();ctx.translate(ex+e.animX,ey);
  if(e.sprite==='drone'){
    ctx.fillStyle=e.color;ctx.shadowBlur=20;ctx.shadowColor=e.color;
    // Body — hexagonal
    ctx.beginPath();const hr=40;for(let i=0;i<6;i++){const a=i*Math.PI/3-Math.PI/6;ctx.lineTo(Math.cos(a)*hr,Math.sin(a)*hr);}ctx.closePath();ctx.fill();ctx.shadowBlur=0;
    // Rotors
    ctx.strokeStyle='rgba(100,200,255,0.7)';ctx.lineWidth=2;[[-44,-22],[44,-22]].forEach(([rx,ry])=>{ctx.beginPath();ctx.arc(rx,ry,18,0,Math.PI*2);ctx.stroke();});
    // Eye
    ctx.fillStyle='#ff4400';ctx.shadowBlur=10;ctx.shadowColor='#ff2200';ctx.beginPath();ctx.arc(0,0,12,0,Math.PI*2);ctx.fill();ctx.shadowBlur=0;
    // Weapon
    ctx.fillStyle='#1a3a55';ctx.fillRect(-4,36,8,20);
  }else if(e.sprite==='construct'){
    ctx.fillStyle=e.color;ctx.shadowBlur=18;ctx.shadowColor=e.color;
    ctx.fillRect(-60,-80,120,160);ctx.beginPath();ctx.arc(0,-80,60,Math.PI,0);ctx.fill();ctx.shadowBlur=0;
    // Armour plates
    ctx.fillStyle='#1a2a40';ctx.fillRect(-50,-60,44,50);ctx.fillRect(6,-60,44,50);
    ctx.strokeStyle='rgba(0,180,255,0.4)';ctx.lineWidth=1;ctx.strokeRect(-60,-80,120,160);
    // Eyes
    ctx.fillStyle='#00aaff';ctx.shadowBlur=14;ctx.shadowColor='#0044ff';ctx.beginPath();ctx.arc(-22,-50,14,0,Math.PI*2);ctx.fill();ctx.beginPath();ctx.arc(22,-50,14,0,Math.PI*2);ctx.fill();ctx.shadowBlur=0;
    // Arms
    ctx.fillStyle=e.color;ctx.fillRect(-88,-70,26,90);ctx.fillRect(62,-70,26,90);
    // Core gem
    ctx.fillStyle='#00ffcc';ctx.shadowBlur=10;ctx.shadowColor='#00ffaa';ctx.beginPath();ctx.arc(0,20,14,0,Math.PI*2);ctx.fill();ctx.shadowBlur=0;
  }else if(e.sprite==='nexus'){
    // Central orb
    const t2=Date.now()/800;
    ctx.fillStyle='#110000';ctx.shadowBlur=40;ctx.shadowColor='#ff2200';ctx.beginPath();ctx.arc(0,0,78,0,Math.PI*2);ctx.fill();ctx.shadowBlur=0;
    // Geometric rings
    [55,72,88].forEach((r,i)=>{ctx.strokeStyle=`rgba(255,${30+i*20},0,${0.4-i*0.1})`;ctx.lineWidth=2;ctx.beginPath();ctx.arc(0,0,r,t2+i,t2+i+Math.PI*1.6);ctx.stroke();});
    // Face
    ctx.fillStyle='#ff2200';ctx.shadowBlur=18;ctx.shadowColor='#ff0000';
    ctx.beginPath();ctx.arc(-24,-12,16,0,Math.PI*2);ctx.fill();ctx.beginPath();ctx.arc(24,-12,16,0,Math.PI*2);ctx.fill();ctx.shadowBlur=0;
    ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(-24,-12,7,0,Math.PI*2);ctx.fill();ctx.beginPath();ctx.arc(24,-12,7,0,Math.PI*2);ctx.fill();
    // Glitch rectangles
    ctx.fillStyle='rgba(255,30,0,0.18)';
    [-60,-20,20,50].forEach(gy=>{ctx.fillRect(-70+Math.sin(t2+gy)*5,gy,140,8);});
    // Orbiting fragments
    [0,1,2,3].forEach(i=>{const ang=t2+i*Math.PI/2;ctx.fillStyle='#ff3300';ctx.shadowBlur=8;ctx.shadowColor='#ff2200';ctx.beginPath();ctx.arc(Math.cos(ang)*105,Math.sin(ang)*55,9,0,Math.PI*2);ctx.fill();ctx.shadowBlur=0;});
  }else{
    ctx.fillStyle=e.color||'#f44';ctx.shadowBlur=20;ctx.shadowColor=e.color||'#f44';ctx.beginPath();ctx.arc(0,0,e.isBoss?80:50,0,Math.PI*2);ctx.fill();ctx.shadowBlur=0;
  }
  ctx.restore();
}

function drawWrappedText(text,x,y,maxW,color,size,lineH){
  ctx.fillStyle=color;ctx.font=`${size}px 'Courier New',monospace`;ctx.textAlign='left';
  const words=text.split(' ');let line='',lineY=y;
  for(const w of words){const test=line+(line?' ':'')+w;if(ctx.measureText(test).width>maxW&&line){ctx.fillText(line,x,lineY);line=w;lineY+=lineH;}else line=test;}
  if(line)ctx.fillText(line,x,lineY);
}

function renderScene(){
  if(!currentScene)return;
  bgTransition.t=Math.min(1,(bgTransition.t||0)+1/60*3);
  drawBackground(bgTransition.from||currentScene.bg);
  if(bgTransition.t<1&&bgTransition.to!==bgTransition.from){ctx.globalAlpha=bgTransition.t;drawBackground(bgTransition.to);ctx.globalAlpha=1;if(bgTransition.t>=1)currentBg=bgTransition.to;}
  currentScene.chars&&currentScene.chars.forEach(c=>{drawCharacter(c.id,c.side,c.mood||'neutral',bgTransition.t);});
  const boxY=H-190,boxH=180,boxX=20,boxW=W-40;
  ctx.fillStyle=PALETTE.textbox;ctx.beginPath();ctx.roundRect(boxX,boxY,boxW,boxH,6);ctx.fill();
  ctx.strokeStyle=PALETTE.border;ctx.lineWidth=1.5;ctx.beginPath();ctx.roundRect(boxX,boxY,boxW,boxH,6);ctx.stroke();
  if(scenePhase==='dialogue'){
    const line=getCurrentLine();
    if(line){
      if(line.speaker&&CHAR_COLORS[line.speaker]){ctx.fillStyle=PALETTE.name;ctx.font='bold 14px system-ui,sans-serif';ctx.textAlign='left';ctx.fillText(CHAR_COLORS[line.speaker].name,boxX+16,boxY+22);}
      drawWrappedText(displayedText,boxX+16,boxY+44,boxW-32,PALETTE.text,14,25);
      if(textComplete){ctx.globalAlpha=0.7;ctx.fillStyle='#00ddff';ctx.font='bold 12px system-ui,sans-serif';ctx.textAlign='right';ctx.fillText('▼',W-30,boxY+boxH-14);ctx.globalAlpha=1;ctx.textAlign='left';}
    }
  }else{
    ctx.fillStyle=PALETTE.name;ctx.font='bold 13px system-ui,sans-serif';ctx.textAlign='left';ctx.fillText('SELECT ACTION:',boxX+16,boxY+22);
    currentScene.choices.forEach((ch,i)=>{
      const cy=boxY+38+i*38;
      ctx.fillStyle=i===choiceIndex?PALETTE.choiceHover:PALETTE.choice;ctx.beginPath();ctx.roundRect(boxX+12,cy,boxW-24,32,3);ctx.fill();

    });
  }
}

// META PROGRESSION
const _META_KEY='meta_echoes_void';
const UPGRADES=[
  {id:'credit_cache', label:'Credit Cache',   desc:'+20 credits start/lv', maxLv:3,cost:[50,100,170]},
  {id:'xp_module',    label:'XP Module',      desc:'+25% XP earned/lv',   maxLv:3,cost:[70,140,230]},
  {id:'nano_shell',   label:'Nano Shell',     desc:'+20 max HP/lv',        maxLv:3,cost:[60,120,200]},
  {id:'combat_chip',  label:'Combat Chip',    desc:'+4 ATK +2 DEF/lv',    maxLv:3,cost:[90,160,260]},
];
let _meta={coins:0,upgrades:{}},_runCoins=0,_gameoverTimer=1.5,_shopIdx=0,_xpMult=1.0;
function loadMeta(){try{const s=localStorage.getItem(_META_KEY);_meta=s?JSON.parse(s):{coins:0,upgrades:{}};}catch(e){_meta={coins:0,upgrades:{}};}}
function saveMeta(){try{localStorage.setItem(_META_KEY,JSON.stringify(_meta));}catch(e){}}
function getUpgradeLevel(id){return(_meta.upgrades[id]||0);}
function buyUpgrade(id){const u=UPGRADES.find(x=>x.id===id);if(!u)return false;const lv=getUpgradeLevel(id);if(lv>=u.maxLv)return false;const cost=u.cost[lv];if(_meta.coins<cost)return false;_meta.coins-=cost;_meta.upgrades[id]=(lv+1);saveMeta();return true;}
function applyUpgrades(){
  const ns=getUpgradeLevel('nano_shell'),cc=getUpgradeLevel('combat_chip'),cr=getUpgradeLevel('credit_cache');
  hero.maxHp=75+ns*20;hero.hp=hero.maxHp;hero.atk=18+cc*4;hero.def=5+cc*2;hero.gold=cr*20;
  _xpMult=1+getUpgradeLevel('xp_module')*0.25;
}
function _shopHit(px,py,x,y,w,h){return px>=x&&px<=x+w&&py>=y&&py<=y+h;}
function updateGameover(dt){_gameoverTimer-=dt;if(_gameoverTimer<=0||anyAction()){_meta.coins+=_runCoins;saveMeta();_shopIdx=0;setState('shop');}}
function updateShop(dt){if(!Pointer.justDown)return;const n=UPGRADES.length,cardW=Math.round(W*0.19),cardH=Math.round(H*0.32),gap=Math.round(W*0.02);const sy=Math.round(H*0.22),totalW=n*cardW+(n-1)*gap,sx=(W-totalW)/2;for(let i=0;i<n;i++){if(_shopHit(Pointer.x,Pointer.y,sx+i*(cardW+gap),sy,cardW,cardH)){_shopIdx=i;if(buyUpgrade(UPGRADES[i].id)){sfx.play(660,0.12,'sine',0.1);applyUpgrades();}else sfx.play(110,0.06,'sawtooth',0.08);return;}}const btnW=160,btnH=42,btnX=(W-btnW)/2,btnY=sy+cardH+32;if(_shopHit(Pointer.x,Pointer.y,btnX,btnY,btnW,btnH)){sfx.play(440,0.08,'square',0.1);restartGame();}}
function renderShop(){ctx.fillStyle=PALETTE.shopBg;ctx.fillRect(0,0,W,H);ctx.textAlign='center';ctx.fillStyle='#fff';ctx.font='bold 22px system-ui,sans-serif';ctx.fillText('UPGRADE TERMINAL',W/2,Math.round(H*0.12));ctx.fillStyle='#00ffcc';ctx.font='bold 15px system-ui,sans-serif';ctx.fillText(`◈ ${_meta.coins} credits`,W/2,Math.round(H*0.19));const n=UPGRADES.length,cardW=Math.round(W*0.19),cardH=Math.round(H*0.32),gap=Math.round(W*0.02);const sy=Math.round(H*0.22),totalW=n*cardW+(n-1)*gap,sx=(W-totalW)/2;for(let i=0;i<n;i++){const u=UPGRADES[i],lv=getUpgradeLevel(u.id),cx=sx+i*(cardW+gap);ctx.fillStyle=_shopIdx===i?PALETTE.shopSel:PALETTE.shopCard;ctx.beginPath();if(ctx.roundRect)ctx.roundRect(cx,sy,cardW,cardH,6);else ctx.rect(cx,sy,cardW,cardH);ctx.fill();ctx.strokeStyle=_shopIdx===i?PALETTE.border:'rgba(0,100,150,0.3)';ctx.lineWidth=1;ctx.beginPath();if(ctx.roundRect)ctx.roundRect(cx,sy,cardW,cardH,6);else ctx.rect(cx,sy,cardW,cardH);ctx.stroke();ctx.fillStyle='#fff';ctx.font='bold 11px system-ui,sans-serif';ctx.fillText(u.label,cx+cardW/2,sy+22);ctx.fillStyle='#aaa';ctx.font='10px system-ui,sans-serif';ctx.fillText(u.desc,cx+cardW/2,sy+38);for(let d=0;d<u.maxLv;d++){ctx.fillStyle=d<lv?'#00ffcc':'#224';ctx.beginPath();ctx.arc(cx+cardW/2+(d-u.maxLv/2+0.5)*14,sy+cardH-36,5,0,Math.PI*2);ctx.fill();}if(lv<u.maxLv){ctx.fillStyle='#00ffcc';ctx.font='bold 12px system-ui,sans-serif';ctx.fillText(`${u.cost[lv]}◈`,cx+cardW/2,sy+cardH-14);}else{ctx.fillStyle='#0f0';ctx.font='bold 11px system-ui,sans-serif';ctx.fillText('MAX',cx+cardW/2,sy+cardH-14);}}const btnW=160,btnH=42,btnX=(W-btnW)/2,btnY=sy+cardH+32;ctx.fillStyle='#041828';ctx.beginPath();if(ctx.roundRect)ctx.roundRect(btnX,btnY,btnW,btnH,6);else ctx.rect(btnX,btnY,btnW,btnH);ctx.fill();ctx.strokeStyle=PALETTE.border;ctx.lineWidth=1;ctx.beginPath();if(ctx.roundRect)ctx.roundRect(btnX,btnY,btnW,btnH,6);else ctx.rect(btnX,btnY,btnW,btnH);ctx.stroke();ctx.fillStyle='#00ffcc';ctx.font='bold 16px system-ui,sans-serif';ctx.fillText('PLAY',W/2,btnY+27);ctx.textAlign='left';}

// INIT
loadMeta();
function restartGame(){
  loadMeta();_runCoins=0;_gameoverTimer=1.5;
  Object.assign(hero,{hp:75,maxHp:75,mp:60,maxMp:60,atk:18,def:5,xp:0,level:1,gold:0,_potions:2,_defending:false});
  applyUpgrades();storyFlags={};currentBg='station';bgTransition={from:'station',to:'station',t:1};
  setState('title');
}
restartGame();
requestAnimationFrame(t=>{lastTime=t;requestAnimationFrame(loop);});
</script>
