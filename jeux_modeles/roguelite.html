<script>
// ══════════════════════════════════════════════════════════════════
// ENGINE — DO NOT MODIFY
window.__devPatch=function(code){return eval(code);};
// ══════════════════════════════════════════════════════════════════
const canvas=document.getElementById('gameCanvas');
const ctx=canvas.getContext('2d');
const DPR=Math.min(window.devicePixelRatio||1,2);
const GAME_W=800,GAME_H=600;
let W=GAME_W,H=GAME_H;
function resizeCanvas(){const s=Math.min(window.innerWidth/W,window.innerHeight/H);canvas.style.width=Math.round(W*s)+'px';canvas.style.height=Math.round(H*s)+'px';canvas.width=Math.round(W*DPR);canvas.height=Math.round(H*DPR);ctx.scale(DPR,DPR);}
resizeCanvas();window.addEventListener('resize',()=>{resizeCanvas();ctx.scale(DPR,DPR);});

let gameState='menu';
function setState(s){gameState=s;}

const Keys={down:{},pressed:{},released:{}};
window.addEventListener('keydown',e=>{if(!Keys.down[e.code])Keys.pressed[e.code]=true;Keys.down[e.code]=true;if(['Space','ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.code))e.preventDefault();});
window.addEventListener('keyup',e=>{Keys.down[e.code]=false;Keys.released[e.code]=true;});

const Touch={active:false,stickX:0,stickY:0,startX:0,startY:0,x:0,y:0,justTapped:false};
canvas.addEventListener('touchstart',e=>{e.preventDefault();const r=canvas.getBoundingClientRect();Touch.startX=Touch.x=(e.touches[0].clientX-r.left)*(W/r.width);Touch.startY=Touch.y=(e.touches[0].clientY-r.top)*(H/r.height);Touch.active=true;},{passive:false});
canvas.addEventListener('touchmove',e=>{e.preventDefault();const r=canvas.getBoundingClientRect();Touch.x=(e.touches[0].clientX-r.left)*(W/r.width);Touch.y=(e.touches[0].clientY-r.top)*(H/r.height);const dx=Touch.x-Touch.startX,dy=Touch.y-Touch.startY,len=Math.hypot(dx,dy);Touch.stickX=len>10?dx/Math.max(len,40):0;Touch.stickY=len>10?dy/Math.max(len,40):0;},{passive:false});
canvas.addEventListener('touchend',e=>{e.preventDefault();Touch.active=false;Touch.stickX=0;Touch.stickY=0;Touch.justTapped=true;},{passive:false});

let attackInput=false,dodgeInput=false;
let _shopClick={x:-1,y:-1};
canvas.addEventListener('click',e=>{
  if(gameState==='playing')attackInput=true;
  const r=canvas.getBoundingClientRect();
  _shopClick.x=(e.clientX-r.left)*(W/r.width);
  _shopClick.y=(e.clientY-r.top)*(H/r.height);
});

function keyDown(c){return!!Keys.down[c];}
function keyPressed(c){return!!Keys.pressed[c];}
function anyAction(){return keyPressed('Space')||keyPressed('Enter')||keyPressed('KeyZ')||keyPressed('KeyJ');}
function flushInput(){Keys.pressed={};Keys.released={};attackInput=false;dodgeInput=false;Touch.justTapped=false;_shopClick={x:-1,y:-1};}

function createPool(factory,size){const inactive=Array.from({length:size},factory),active=[];return{active,get(fn){const o=inactive.length>0?inactive.pop():factory();o.alive=true;if(fn)fn(o);active.push(o);return o;},update(fn){for(let i=active.length-1;i>=0;i--)if(!fn(active[i])){active[i].alive=false;inactive.push(active.splice(i,1)[0]);}},clear(){while(active.length){active[0].alive=false;inactive.push(active.shift());}}};}

const Particles=createPool(()=>({alive:false,x:0,y:0,vx:0,vy:0,life:0,maxLife:0,size:3,color:'#fff',gravity:0}),200);
function spawnParticles(x,y,n,opts){opts=opts||{};for(let i=0;i<n;i++){const a=opts.angle!==undefined?opts.angle+(Math.random()-0.5)*(opts.spread||Math.PI*2):Math.random()*Math.PI*2;const sp=opts.speed||(50+Math.random()*60);Particles.get(p=>{p.x=x;p.y=y;p.vx=Math.cos(a)*sp;p.vy=Math.sin(a)*sp;p.life=p.maxLife=opts.life||(0.25+Math.random()*0.35);p.size=opts.size||(2+Math.random()*3);p.color=opts.color||'#fff';p.gravity=opts.gravity!==undefined?opts.gravity:0;});}}
function updateParticles(dt){Particles.update(p=>{p.life-=dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=p.gravity*dt;return p.life>0;});}
function drawParticles(){Particles.active.forEach(p=>{ctx.globalAlpha=p.life/p.maxLife;ctx.fillStyle=p.color;ctx.beginPath();ctx.arc(p.x,p.y,p.size*0.5,0,Math.PI*2);ctx.fill();});ctx.globalAlpha=1;}

const Popups=[];
function spawnPopup(x,y,t,c,s){Popups.push({x,y,text:t,color:c||'#fff',size:s||13,vy:-45,life:1.0});}
function updatePopups(dt){for(let i=Popups.length-1;i>=0;i--){Popups[i].y+=Popups[i].vy*dt;Popups[i].life-=dt;if(Popups[i].life<=0)Popups.splice(i,1);}}
function drawPopups(){Popups.forEach(p=>{ctx.globalAlpha=Math.min(p.life,1);ctx.fillStyle=p.color;ctx.font=`bold ${p.size}px monospace`;ctx.textAlign='center';ctx.fillText(p.text,p.x,p.y);});ctx.globalAlpha=1;ctx.textAlign='left';}

const Shake={x:0,y:0,mag:0,dur:0};
function triggerShake(m,d){Shake.mag=Math.max(Shake.mag,m);Shake.dur=Math.max(Shake.dur,d);}
function updateShake(dt){if(Shake.dur>0){Shake.dur-=dt;Shake.x=(Math.random()*2-1)*Shake.mag;Shake.y=(Math.random()*2-1)*Shake.mag;if(Shake.dur<=0){Shake.x=0;Shake.y=0;}}}

const sfx={_ctx:null,init(){try{if(!this._ctx)this._ctx=new(window.AudioContext||window.webkitAudioContext)();if(this._ctx.state==='suspended')this._ctx.resume();}catch(e){}},play(f,d,t,v){try{this.init();if(!this._ctx)return;const o=this._ctx.createOscillator(),g=this._ctx.createGain();o.type=t||'square';o.frequency.value=f||440;g.gain.setValueAtTime(v||0.10,this._ctx.currentTime);g.gain.exponentialRampToValueAtTime(0.001,this._ctx.currentTime+(d||0.1));o.connect(g);g.connect(this._ctx.destination);o.start();o.stop(this._ctx.currentTime+(d||0.1));}catch(e){}}};

function lerp(a,b,t){return a+(b-a)*t;}
function clamp(v,mn,mx){return v<mn?mn:v>mx?mx:v;}
function dist(ax,ay,bx,by){return Math.sqrt((ax-bx)**2+(ay-by)**2);}
function aabb(ax,ay,aw,ah,bx,by,bw,bh){return ax<bx+bw&&ax+aw>bx&&ay<by+bh&&ay+ah>by;}
function randInt(a,b){return a+Math.floor(Math.random()*(b-a+1));}
function randChoice(arr){return arr[Math.floor(Math.random()*arr.length)];}
function drawText(t,x,y,c,s,a){ctx.fillStyle=c||'#fff';ctx.font=`bold ${s||13}px monospace`;ctx.textAlign=a||'left';ctx.fillText(t,x,y);}
function drawBar(x,y,w,h,v,m,fg,bg){ctx.fillStyle=bg||'#333';ctx.fillRect(x,y,w,h);ctx.fillStyle=fg||'#0f0';ctx.fillRect(x,y,Math.round(w*clamp(v/m,0,1)),h);}
let _bestFloor=parseInt(localStorage.getItem('rl_best_ab')||'0');
function saveBest(f){if(f>_bestFloor){_bestFloor=f;localStorage.setItem('rl_best_ab',f);}}

const FIXED_DT=1/60;
const MAX_DT=0.1;
let lastTime=0;
let accumulator=0;
function loop(ts){const rd=Math.min((ts-lastTime)/1000,MAX_DT);lastTime=ts;accumulator+=rd;while(accumulator>=FIXED_DT){update(FIXED_DT);accumulator-=FIXED_DT;}renderFrame();requestAnimationFrame(loop);}
function update(dt){updateShake(dt);updateParticles(dt);updatePopups(dt);switch(gameState){case'menu':if(anyAction()){sfx.play(440,0.08,'square',0.1);startRun();setState('playing');}break;case'playing':updatePlaying(dt);break;case'levelup':updateLevelUp(dt);break;case'gameover':updateGameover(dt);break;case'shop':updateShop(dt);break;case'victory':if(anyAction()){setState('menu');}break;}flushInput();}
function renderFrame(){ctx.save();ctx.translate(Shake.x,Shake.y);switch(gameState){case'menu':renderMenu();break;case'playing':renderPlaying();break;case'levelup':renderLevelUp();break;case'gameover':renderGameover();break;case'shop':renderShop();break;case'victory':renderVictory();break;}drawParticles();drawPopups();ctx.restore();}

// ══════════════════════════════════════════════════════════════════
// GAME CONSTANTS
// ══════════════════════════════════════════════════════════════════
const GAME_TITLE='ABYSSAL DESCENT';
const PALETTE={
  bg:'#080408',floor:'#1a1020',floor2:'#1e1428',wall:'#2c1540',wallEdge:'#4a1e66',
  player:'#ffaa00',enemy:'#cc2200',loot:'#ffdd00',crystal:'#8844ff',
  ui:'#f0e0ff',accent:'#cc4400',xp:'#44ccff',dodge:'rgba(255,160,0,0.2)',
  shopBg:'#0a0512',shopCard:'#16102a',shopSel:'#241840',
};

const TILE=40;
const ROOM_W=18*TILE,ROOM_H=13*TILE;
const BASE_STATS={maxHp:100,atk:20,atkSpd:0.35,moveSpd:195,def:0};
const player={
  x:0,y:0,w:28,h:28,vx:0,vy:0,
  facingX:1,facingY:0,
  hp:BASE_STATS.maxHp,maxHp:BASE_STATS.maxHp,
  atk:BASE_STATS.atk,atkSpd:BASE_STATS.atkSpd,moveSpd:BASE_STATS.moveSpd,def:BASE_STATS.def,
  iframes:0,IFRAME_DUR:0.7,
  attackTimer:0,attackCooldown:0,
  dodgeTimer:0,DODGE_DUR:0.35,dodgeCooldown:0,DODGE_CD:0.8,
  dodgeVx:0,dodgeVy:0,
  attack:{active:false,x:0,y:0,w:0,h:0},
  xp:0,level:1,gold:0,relics:[],animTimer:0,
};
const cam={x:0,y:0,SMOOTH:9.0};
let currentRoom=null;
let floorNum=1,roomNum=0,runScore=0;
const TOTAL_FLOORS=5;

const enemyPool=createPool(()=>({alive:false,x:0,y:0,w:28,h:28,vx:0,vy:0,hp:0,maxHp:0,speed:70,damage:15,iframes:0,flashTimer:0,state:'idle',attackTimer:0,type:'cultist',color:'#c22',knockTimer:0,points:50,animTimer:0}),30);
const projPool =createPool(()=>({alive:false,x:0,y:0,vx:0,vy:0,damage:0,r:5,color:'#88f',life:3}),60);
const lootPool =createPool(()=>({alive:false,x:0,y:0,w:22,h:22,type:'gold',value:10,bobTimer:0}),20);

// ══════════════════════════════════════════════════════════════════
// ENEMY DEFINITIONS
// ══════════════════════════════════════════════════════════════════
const ENEMY_DEFS={
  cultist: {hp:50, speed:80, damage:12,points:50, color:'#cc2244',w:26,h:28,alertRange:200,attackRange:36, attackCD:1.0,ranged:false},
  wraith:  {hp:40, speed:70, damage:16,points:100,color:'#6688ff',w:28,h:28,alertRange:250,attackRange:220,attackCD:2.0,ranged:true, projSpeed:180,isBoss:false},
  gargoyle:{hp:120,speed:45, damage:24,points:150,color:'#778899',w:36,h:36,alertRange:150,attackRange:44, attackCD:1.6,ranged:false},
  demon:   {hp:100,speed:90, damage:28,points:200,color:'#dd2200',w:34,h:34,alertRange:220,attackRange:42, attackCD:0.9,ranged:false},
  overlord:{hp:600,speed:60, damage:35,points:1000,color:'#8800cc',w:56,h:56,alertRange:999,attackRange:220,attackCD:1.0,ranged:true, projSpeed:200,isBoss:true},
};

const FLOOR_POOLS=[
  ['cultist','cultist'],
  ['cultist','wraith','wraith'],
  ['wraith','gargoyle','gargoyle'],
  ['gargoyle','demon','demon'],
  ['demon','demon'],
];

// ══════════════════════════════════════════════════════════════════
// RUN UPGRADES — offered at level-up (3 random choices)
// ══════════════════════════════════════════════════════════════════
const RUN_UPGRADES=[
  {id:'hp_up',    name:'Vitality',      desc:'+30 max HP, heal 20',       icon:'❤',  apply:()=>{player.maxHp+=30;player.hp=Math.min(player.hp+20,player.maxHp);}},
  {id:'atk_up',   name:'Strength',      desc:'+10 attack damage',          icon:'⚔',  apply:()=>{player.atk+=10;}},
  {id:'spd_up',   name:'Agility',       desc:'+25 move speed, -0.04 atk', icon:'💨', apply:()=>{player.moveSpd+=25;player.atkSpd=Math.max(0.18,player.atkSpd-0.04);}},
  {id:'dodge_up', name:'Evasion',       desc:'-0.2s dodge cooldown',       icon:'🌀', apply:()=>{player.DODGE_CD=Math.max(0.4,player.DODGE_CD-0.2);}},
  {id:'def_up',   name:'Armor',         desc:'+6 defense',                 icon:'🛡', apply:()=>{player.def+=6;}},
  {id:'vamp',     name:'Life Drain',    desc:'Hits restore 10% dmg as HP', icon:'🩸', apply:()=>{if(!player.relics.includes('vamp'))player.relics.push('vamp');}},
  {id:'crit',     name:'Soul Reaper',   desc:'20% chance for 2× damage',   icon:'💀', apply:()=>{if(!player.relics.includes('crit'))player.relics.push('crit');}},
  {id:'aoe',      name:'Whirlwind',     desc:'Attack width ×1.6',          icon:'🌪', apply:()=>{if(!player.relics.includes('aoe'))player.relics.push('aoe');}},
  {id:'berserk',  name:'Berserker',     desc:'+35% atk below 30% HP',      icon:'🔥', apply:()=>{if(!player.relics.includes('berserk'))player.relics.push('berserk');}},
  {id:'heal',     name:'Dark Pact',     desc:'Heal 50 HP now',             icon:'✦',  apply:()=>{player.hp=Math.min(player.maxHp,player.hp+50);}},
];
let levelUpChoices=[];
let lvlChoice=0;

// ══════════════════════════════════════════════════════════════════
// META-PROGRESSION (shop between runs)
// ══════════════════════════════════════════════════════════════════
const _META_KEY='meta_abyssal';
const UPGRADES=[
  {id:'vitality', label:'Vitality',    desc:'+20 max HP /lv',  maxLv:3,cost:[60,120,200]},
  {id:'xpgain',   label:'Soul Hunger', desc:'+25% XP /lv',     maxLv:3,cost:[70,140,230]},
  {id:'luck',     label:'Dark Luck',   desc:'+1 loot drop /lv',maxLv:3,cost:[80,150,250]},
  {id:'power',    label:'Abyssal Pwr', desc:'+6 base atk /lv', maxLv:3,cost:[90,160,270]},
];
let _meta={coins:0,upgrades:{}};
let _runCoins=0,_gameoverTimer=1.5,_shopIdx=0;
let _xpMult=1.0,_bonusHp=0,_bonusAtk=0;

function loadMeta(){try{const s=localStorage.getItem(_META_KEY);_meta=s?JSON.parse(s):{coins:0,upgrades:{}};}catch(e){_meta={coins:0,upgrades:{}};}}
function saveMeta(){try{localStorage.setItem(_META_KEY,JSON.stringify(_meta));}catch(e){}}
function getUpgradeLevel(id){return _meta.upgrades[id]||0;}
function buyUpgrade(id){const u=UPGRADES.find(x=>x.id===id);if(!u)return false;const lv=getUpgradeLevel(id);if(lv>=u.maxLv)return false;const cost=u.cost[lv];if(_meta.coins<cost)return false;_meta.coins-=cost;_meta.upgrades[id]=(lv+1);saveMeta();return true;}
function applyMetaUpgrades(){_xpMult=1+getUpgradeLevel('xpgain')*0.25;_bonusHp=getUpgradeLevel('vitality')*20;_bonusAtk=getUpgradeLevel('power')*6;player.maxHp=BASE_STATS.maxHp+_bonusHp;player.hp=player.maxHp;player.atk=BASE_STATS.atk+_bonusAtk;}
function _shopHit(px,py,x,y,w,h){return px>=x&&px<=x+w&&py>=y&&py<=y+h;}

function updateGameover(dt){
  _gameoverTimer-=dt;
  if(_gameoverTimer<=0||anyAction()){_meta.coins+=_runCoins;saveMeta();_shopIdx=0;setState('shop');}
}

function updateShop(dt){
  const mx=_shopClick.x>=0?_shopClick.x:(Touch.justTapped?Touch.x:-1);
  const my=_shopClick.y>=0?_shopClick.y:(Touch.justTapped?Touch.y:-1);
  if(mx<0&&!anyAction())return;
  const n=UPGRADES.length,cardW=Math.round(W*0.19),cardH=Math.round(H*0.32),gap=Math.round(W*0.02);
  const sy=Math.round(H*0.22),totalW=n*cardW+(n-1)*gap,sx=(W-totalW)/2;
  const btnW=160,btnH=42,btnX=(W-btnW)/2,btnY=sy+cardH+32;
  if(mx>=0){
    for(let i=0;i<n;i++){
      if(_shopHit(mx,my,sx+i*(cardW+gap),sy,cardW,cardH)){
        _shopIdx=i;
        if(buyUpgrade(UPGRADES[i].id)){sfx.play(660,0.12,'sine',0.1);applyMetaUpgrades();}
        else sfx.play(110,0.06,'sawtooth',0.08);
        return;
      }
    }
    if(_shopHit(mx,my,btnX,btnY,btnW,btnH)){sfx.play(440,0.08,'square',0.1);startRun();setState('playing');}
  } else if(anyAction()){sfx.play(440,0.08,'square',0.1);startRun();setState('playing');}
}

function renderShop(){
  ctx.fillStyle=PALETTE.shopBg;ctx.fillRect(0,0,W,H);
  ctx.textAlign='center';
  ctx.fillStyle=PALETTE.ui;ctx.font='bold 22px system-ui,sans-serif';ctx.fillText('DARK SHRINE',W/2,Math.round(H*0.12));
  ctx.fillStyle='#ffdd00';ctx.font='bold 15px system-ui,sans-serif';ctx.fillText(`⚗ ${_meta.coins} souls`,W/2,Math.round(H*0.19));
  const n=UPGRADES.length,cardW=Math.round(W*0.19),cardH=Math.round(H*0.32),gap=Math.round(W*0.02);
  const sy=Math.round(H*0.22),totalW=n*cardW+(n-1)*gap,sx=(W-totalW)/2;
  for(let i=0;i<n;i++){
    const u=UPGRADES[i],lv=getUpgradeLevel(u.id),cx=sx+i*(cardW+gap);
    ctx.fillStyle=_shopIdx===i?PALETTE.shopSel:PALETTE.shopCard;
    ctx.beginPath();if(ctx.roundRect)ctx.roundRect(cx,sy,cardW,cardH,8);else ctx.rect(cx,sy,cardW,cardH);ctx.fill();
    ctx.strokeStyle=_shopIdx===i?PALETTE.accent:'#2a1540';ctx.lineWidth=1;ctx.stroke();
    ctx.fillStyle=PALETTE.ui;ctx.font='bold 11px system-ui,sans-serif';ctx.fillText(u.label,cx+cardW/2,sy+22);
    ctx.fillStyle='#aa88cc';ctx.font='10px system-ui,sans-serif';ctx.fillText(u.desc,cx+cardW/2,sy+38);
    for(let d=0;d<u.maxLv;d++){ctx.fillStyle=d<lv?PALETTE.accent:'#331a44';ctx.beginPath();ctx.arc(cx+cardW/2+(d-u.maxLv/2+0.5)*14,sy+cardH-36,5,0,Math.PI*2);ctx.fill();}
    if(lv<u.maxLv){ctx.fillStyle='#ffdd00';ctx.font='bold 12px system-ui,sans-serif';ctx.fillText(`${u.cost[lv]}⚗`,cx+cardW/2,sy+cardH-14);}
    else{ctx.fillStyle='#0f0';ctx.font='bold 11px system-ui,sans-serif';ctx.fillText('MAX',cx+cardW/2,sy+cardH-14);}
  }
  const btnW=160,btnH=42,btnX=(W-btnW)/2,btnY=sy+cardH+32;
  ctx.fillStyle='#1e0c30';ctx.beginPath();if(ctx.roundRect)ctx.roundRect(btnX,btnY,btnW,btnH,8);else ctx.rect(btnX,btnY,btnW,btnH);ctx.fill();
  ctx.strokeStyle=PALETTE.accent;ctx.lineWidth=1;ctx.stroke();
  ctx.fillStyle='#fff';ctx.font='bold 16px system-ui,sans-serif';ctx.fillText('DESCEND',W/2,btnY+27);
  ctx.textAlign='left';
}

// ══════════════════════════════════════════════════════════════════
// PROCEDURAL ROOM GENERATION
// ══════════════════════════════════════════════════════════════════
function generateRoom(type){
  const border=TILE,walls=[];
  walls.push({x:0,y:0,w:ROOM_W,h:border});
  walls.push({x:0,y:ROOM_H-border,w:ROOM_W,h:border});
  walls.push({x:0,y:0,w:border,h:ROOM_H});
  walls.push({x:ROOM_W-border,y:0,w:border,h:ROOM_H});

  const obstacles=[];
  if(type!=='boss'&&type!=='rest'){
    const count=type==='elite'?randInt(1,3):randInt(2,5+Math.min(floorNum,3));
    for(let i=0;i<count;i++){
      const w=randInt(1,2)*TILE,h=randInt(1,2)*TILE;
      const x=randInt(2,ROOM_W/TILE-w/TILE-2)*TILE,y=randInt(2,ROOM_H/TILE-h/TILE-2)*TILE;
      walls.push({x,y,w,h});obstacles.push({x,y,w,h});
    }
  }

  const pool=FLOOR_POOLS[Math.min(floorNum-1,FLOOR_POOLS.length-1)];
  const enemies=[];
  const diff=1+floorNum*0.35;

  if(type==='combat'){
    const cnt=randInt(3,4+Math.min(floorNum,4));
    for(let i=0;i<cnt;i++)enemies.push({type:randChoice(pool),x:randInt(TILE*3,ROOM_W-TILE*3),y:randInt(TILE*3,ROOM_H-TILE*3)});
  } else if(type==='elite'){
    const eliteType=floorNum>=4?'demon':floorNum>=2?'gargoyle':'cultist';
    enemies.push({type:eliteType,x:ROOM_W/2,y:ROOM_H/2});
    enemies.push({type:randChoice(pool),x:ROOM_W*0.3,y:ROOM_H*0.3});
    enemies.push({type:randChoice(pool),x:ROOM_W*0.7,y:ROOM_H*0.7});
  } else if(type==='boss'){
    enemies.push({type:'overlord',x:ROOM_W/2,y:ROOM_H*0.35});
    enemies.push({type:randChoice(pool),x:ROOM_W*0.25,y:ROOM_H*0.6});
    enemies.push({type:randChoice(pool),x:ROOM_W*0.75,y:ROOM_H*0.6});
  }

  const loot=[];
  if(type==='rest'){
    loot.push({type:'potion',x:ROOM_W/2-40,y:ROOM_H/2,value:50});
    loot.push({type:'gold',x:ROOM_W/2+40,y:ROOM_H/2,value:randInt(20,50)});
  } else if(type==='treasure'){
    loot.push({type:'gold',x:ROOM_W/2,y:ROOM_H/2,value:randInt(50,90)});
    loot.push({type:'crystal',x:ROOM_W/2+50,y:ROOM_H/2,value:randInt(3,8)});
  }

  return{type,walls,obstacles,enemies,loot,cleared:type==='rest'||type==='treasure',difficulty:diff};
}

function resolveWalls(ent,walls,dt){
  ent.x+=ent.vx*dt;for(const w of walls){if(aabb(ent.x,ent.y,ent.w,ent.h,w.x,w.y,w.w,w.h)){if(ent.vx>0)ent.x=w.x-ent.w;else ent.x=w.x+w.w;ent.vx=0;}}
  ent.y+=ent.vy*dt;for(const w of walls){if(aabb(ent.x,ent.y,ent.w,ent.h,w.x,w.y,w.w,w.h)){if(ent.vy>0)ent.y=w.y-ent.h;else ent.y=w.y+w.h;ent.vy=0;}}
}

// INIT
// ══════════════════════════════════════════════════════════════════
loadMeta();
function startRun(){
  loadMeta();_runCoins=0;_gameoverTimer=1.5;
  floorNum=1;roomNum=0;runScore=0;
  Object.assign(player,{...BASE_STATS,hp:BASE_STATS.maxHp,xp:0,level:1,gold:0,relics:[],
    iframes:0,attackTimer:0,attackCooldown:0,dodgeTimer:0,dodgeCooldown:0,
    attack:{active:false,x:0,y:0,w:0,h:0},animTimer:0,facingX:1,facingY:0,
    DODGE_DUR:0.35,DODGE_CD:0.8,dodgeVx:0,dodgeVy:0,IFRAME_DUR:0.7,
  });
  applyMetaUpgrades();
  // Relic start perk
  const relicLv=getUpgradeLevel('luck');
  if(relicLv>0)player.relics.push(randChoice(['vamp','crit','aoe']));
  enterRoom('combat');
}

function enterRoom(type){
  currentRoom=generateRoom(type);
  player.x=ROOM_W/2-player.w/2;player.y=ROOM_H*0.78;
  player.vx=0;player.vy=0;
  enemyPool.clear();projPool.clear();lootPool.clear();
  currentRoom.enemies.forEach(eDef=>{
    const def=ENEMY_DEFS[eDef.type]||ENEMY_DEFS.cultist;
    enemyPool.get(e=>{Object.assign(e,def);e.x=eDef.x;e.y=eDef.y;e.hp=e.maxHp=Math.floor(def.hp*currentRoom.difficulty);e.type=eDef.type;e.state='idle';e.attackTimer=0;e.flashTimer=0;e.iframes=0;e.knockTimer=0;e.animTimer=0;});
  });
  currentRoom.loot.forEach(l=>{lootPool.get(lo=>{lo.x=l.x;lo.y=l.y;lo.type=l.type;lo.value=l.value;lo.bobTimer=Math.random()*Math.PI*2;});});
  cam.x=ROOM_W/2-W/2;cam.y=ROOM_H/2-H/2;
}

function nextRoom(){
  roomNum++;
  const roomTypes=['combat','combat','elite','rest','treasure','boss'];
  if(roomNum>=roomTypes.length){enterRoom('boss');return;}
  enterRoom(roomTypes[roomNum]);
}

// UPDATE
// ══════════════════════════════════════════════════════════════════
let _bgTimer=0;
function updatePlaying(dt){
  if(!currentRoom)return;
  _bgTimer+=dt;

  // ── Movement ─────────────────────────────────────────────────
  let dx=(keyDown('ArrowRight')||keyDown('KeyD')?1:0)-(keyDown('ArrowLeft')||keyDown('KeyA')?1:0);
  let dy=(keyDown('ArrowDown')||keyDown('KeyS')?1:0)-(keyDown('ArrowUp')||keyDown('KeyW')?1:0);
  if(Touch.active){dx=Touch.stickX;dy=Touch.stickY;}

  // Dodge roll
  player.dodgeCooldown=Math.max(0,player.dodgeCooldown-dt);
  player.dodgeTimer=Math.max(0,player.dodgeTimer-dt);
  const wantDodge=keyPressed('ShiftLeft')||keyPressed('ShiftRight');
  if(wantDodge&&player.dodgeCooldown<=0&&(dx||dy)){
    player.dodgeTimer=player.DODGE_DUR;player.dodgeCooldown=player.DODGE_CD;
    const len=Math.hypot(dx,dy)||1;
    player.dodgeVx=dx/len*400;player.dodgeVy=dy/len*400;
    player.iframes=player.DODGE_DUR;
    sfx.play(660,0.08,'sine',0.08);
    spawnParticles(player.x+player.w/2,player.y+player.h/2,6,{color:PALETTE.player,speed:60,life:0.2});
  }

  if(player.dodgeTimer>0){player.vx=player.dodgeVx;player.vy=player.dodgeVy;player.dodgeVx*=0.85;player.dodgeVy*=0.85;}
  else{const mag=Math.hypot(dx,dy)||0;if(mag>0){const nx=dx/mag,ny=dy/mag;player.vx=nx*player.moveSpd;player.vy=ny*player.moveSpd;player.facingX=nx;player.facingY=ny;}else{player.vx*=0.7;player.vy*=0.7;}}
  player.iframes=Math.max(0,player.iframes-dt);
  resolveWalls(player,currentRoom.walls,dt);
  player.animTimer+=dt;

  // ── Attack ───────────────────────────────────────────────────
  player.attackCooldown=Math.max(0,player.attackCooldown-dt);
  player.attackTimer=Math.max(0,player.attackTimer-dt);
  player.attack.active=player.attackTimer>0;
  const wantAtk=keyPressed('Space')||keyPressed('KeyZ')||keyPressed('KeyJ')||attackInput;
  if(wantAtk&&player.attackCooldown<=0){
    player.attackTimer=0.18;player.attackCooldown=player.atkSpd;
    const fx=player.facingX||1,fy=player.facingY||0;
    const hasAoe=player.relics.includes('aoe');
    const atkW=hasAoe?88:56,atkH=hasAoe?64:42;
    player.attack.x=player.x+player.w/2+fx*52-atkW/2;
    player.attack.y=player.y+player.h/2+fy*46-atkH/2;
    player.attack.w=atkW;player.attack.h=atkH;
    sfx.play(280,0.07,'sawtooth',0.09);
  }

  // Attack hits enemies
  if(player.attack.active){
    enemyPool.active.forEach(e=>{
      if(!e.alive||e.iframes>0)return;
      if(!aabb(player.attack.x,player.attack.y,player.attack.w,player.attack.h,e.x,e.y,e.w,e.h))return;
      let dmg=player.atk+randInt(-3,3);
      if(player.relics.includes('berserk')&&player.hp<player.maxHp*0.3)dmg=Math.floor(dmg*1.35);
      if(player.relics.includes('crit')&&Math.random()<0.20)dmg*=2;
      e.hp-=dmg;e.flashTimer=0.09;e.iframes=0.20;
      const ang=Math.atan2(e.y-player.y,e.x-player.x);
      e.vx=Math.cos(ang)*160;e.vy=Math.sin(ang)*160;e.knockTimer=0.15;
      spawnParticles(e.x+e.w/2,e.y+e.h/2,5,{color:e.color,speed:55,life:0.25});
      spawnPopup(e.x+e.w/2,e.y-8,`-${dmg}`,'#fff',12);
      if(player.relics.includes('vamp'))player.hp=Math.min(player.maxHp,player.hp+Math.floor(dmg*0.10));
      sfx.play(220,0.06,'sawtooth',0.08);
      if(e.hp<=0){
        runScore+=e.points;player.xp+=Math.floor(e.points*0.5*_xpMult);
        const drops=1+getUpgradeLevel('luck');
        if(Math.random()<0.10+drops*0.05)lootPool.get(l=>{l.x=e.x;l.y=e.y;l.type='crystal';l.value=ENEMY_DEFS[e.type].isBoss?randInt(5,10):1;l.bobTimer=0;});
        if(Math.random()<0.28+drops*0.05)lootPool.get(l=>{l.x=e.x;l.y=e.y;l.type='gold';l.value=randInt(5,20);l.bobTimer=0;});
        if(Math.random()<0.07)lootPool.get(l=>{l.x=e.x;l.y=e.y;l.type='potion';l.value=25;l.bobTimer=0;});
        spawnParticles(e.x+e.w/2,e.y+e.h/2,12,{color:e.color,speed:80,life:0.4,gravity:50});
        sfx.play(440,0.10,'square',0.10);e.alive=false;
      }
    });
  }

  // ── Enemy AI ─────────────────────────────────────────────────
  enemyPool.update(e=>{
    if(!e.alive)return false;
    e.flashTimer=Math.max(0,e.flashTimer-dt);e.iframes=Math.max(0,e.iframes-dt);e.animTimer+=dt;
    if(e.knockTimer>0){e.knockTimer-=dt;e.vx*=0.8;e.vy*=0.8;resolveWalls(e,currentRoom.walls,dt);return true;}
    const dx2=player.x+player.w/2-(e.x+e.w/2),dy2=player.y+player.h/2-(e.y+e.h/2),d=Math.sqrt(dx2*dx2+dy2*dy2);
    const def=ENEMY_DEFS[e.type];
    if(d<def.alertRange)e.state='chase';
    if(e.state==='chase'){
      if(def.ranged&&d<def.attackRange){
        e.attackTimer+=dt;e.vx*=0.7;e.vy*=0.7;
        if(e.attackTimer>=def.attackCD){
          e.attackTimer=0;
          if(e.type==='overlord'){
            // 3-way spread
            for(let i=-1;i<=1;i++){const a=Math.atan2(dy2,dx2)+i*0.4;projPool.get(p=>{p.x=e.x+e.w/2;p.y=e.y+e.h/2;p.vx=Math.cos(a)*def.projSpeed;p.vy=Math.sin(a)*def.projSpeed;p.damage=def.damage;p.life=3;p.color=e.color;p.r=7;});}
            sfx.play(80,0.2,'sawtooth',0.08);
          } else {
            const len=d||1;projPool.get(p=>{p.x=e.x+e.w/2;p.y=e.y+e.h/2;p.vx=dx2/len*def.projSpeed;p.vy=dy2/len*def.projSpeed;p.damage=def.damage;p.life=3;p.color=e.color;p.r=5;});
            sfx.play(440,0.04,'square',0.06);
          }
        }
      } else if(!def.ranged&&d<def.attackRange){
        e.attackTimer+=dt;e.vx*=0.6;e.vy*=0.6;
        if(e.attackTimer>=def.attackCD&&player.iframes<=0){
          e.attackTimer=0;
          const dmg=Math.max(1,def.damage-player.def);
          player.hp-=dmg;player.iframes=player.IFRAME_DUR;
          player.vx+=(dx2>0?-1:1)*160;player.vy+=(dy2>0?-1:1)*160;
          triggerShake(4,0.22);sfx.play(150,0.18,'sawtooth',0.14);
          spawnParticles(player.x+player.w/2,player.y+player.h/2,6,{color:'#f44',speed:60});
          if(player.hp<=0){saveBest(floorNum);_runCoins=player.gold;_gameoverTimer=1.5;setState('gameover');}
        }
      } else {if(d>0){e.vx=dx2/d*def.speed;e.vy=dy2/d*def.speed;}}
    }
    resolveWalls(e,currentRoom.walls,dt);return true;
  });

  // ── Projectiles ───────────────────────────────────────────────
  projPool.update(p=>{
    p.life-=dt;p.x+=p.vx*dt;p.y+=p.vy*dt;
    for(const w of currentRoom.walls){if(aabb(p.x-p.r,p.y-p.r,p.r*2,p.r*2,w.x,w.y,w.w,w.h))return false;}
    if(player.iframes<=0&&dist(p.x,p.y,player.x+player.w/2,player.y+player.h/2)<p.r+player.w/2){
      const dmg=Math.max(1,p.damage-player.def);
      player.hp-=dmg;player.iframes=player.IFRAME_DUR;
      triggerShake(3,0.18);sfx.play(150,0.15,'sawtooth',0.12);
      spawnParticles(player.x+player.w/2,player.y+player.h/2,4,{color:'#f44',speed:50});
      if(player.hp<=0){saveBest(floorNum);_runCoins=player.gold;_gameoverTimer=1.5;setState('gameover');}
      return false;
    }
    return p.life>0&&p.x>-20&&p.x<ROOM_W+20&&p.y>-20&&p.y<ROOM_H+20;
  });

  // ── Loot ─────────────────────────────────────────────────────
  lootPool.update(l=>{
    l.bobTimer+=dt;
    if(aabb(player.x,player.y,player.w,player.h,l.x,l.y,l.w,l.h)){
      if(l.type==='gold'){player.gold+=l.value;runScore+=l.value;spawnPopup(l.x,l.y,`+${l.value}g`,'#ff0',12);}
      if(l.type==='potion'){player.hp=Math.min(player.maxHp,player.hp+l.value);spawnPopup(l.x,l.y,`+${l.value}HP`,'#0f0',12);}
      if(l.type==='crystal'){_meta.coins+=l.value;saveMeta();spawnPopup(l.x,l.y,`+${l.value}⚗`,'#a4f',13);}
      sfx.play(880,0.07,'sine',0.09);return false;
    }
    return true;
  });

  // ── XP level-up ──────────────────────────────────────────────
  const xpNeed=60*player.level;
  if(player.xp>=xpNeed){player.xp-=xpNeed;player.level++;offerUpgrades();}

  // ── Room clear ────────────────────────────────────────────────
  if(!currentRoom.cleared&&enemyPool.active.filter(x=>x.alive).length===0){
    currentRoom.cleared=true;sfx.play(660,0.15,'sine',0.10);
    spawnPopup(ROOM_W/2,ROOM_H/2-40,'ROOM CLEAR!','#ff0',16);
    if(currentRoom.type==='boss'){
      floorNum++;roomNum=0;
      if(floorNum>TOTAL_FLOORS){saveBest(floorNum);setState('victory');}
      else{setTimeout(()=>{enterRoom('rest');},1200);}
    }
  }

  // Exit right when cleared
  if(currentRoom.cleared&&currentRoom.type!=='boss'&&player.x+player.w>ROOM_W-TILE*1.5){
    nextRoom();return;
  }

  // ── Camera ───────────────────────────────────────────────────
  const tx=player.x+player.w/2-W/2,ty=player.y+player.h/2-H/2;
  cam.x=lerp(cam.x,clamp(tx,0,Math.max(0,ROOM_W-W)),cam.SMOOTH*dt);
  cam.y=lerp(cam.y,clamp(ty,0,Math.max(0,ROOM_H-H)),cam.SMOOTH*dt);
}

function offerUpgrades(){
  levelUpChoices=[...RUN_UPGRADES].sort(()=>Math.random()-0.5).slice(0,3);
  lvlChoice=0;setState('levelup');
}

function updateLevelUp(dt){
  if(keyPressed('ArrowUp')&&lvlChoice>0)lvlChoice--;
  if(keyPressed('ArrowDown')&&lvlChoice<levelUpChoices.length-1)lvlChoice++;
  if(anyAction()){levelUpChoices[lvlChoice].apply();sfx.play(880,0.18,'sine',0.12);setState('playing');}
}

function drawKnight(x,y,w,h,fx,fy,animT){
  const cx=x+w/2,cy=y+h/2;
  // Body armor
  ctx.fillStyle='#3a2800';ctx.beginPath();if(ctx.roundRect)ctx.roundRect(x+2,y+4,w-4,h-6,3);else ctx.rect(x+2,y+4,w-4,h-6);ctx.fill();
  ctx.fillStyle='#6a4800';ctx.fillRect(x+4,y+6,3,h-12);ctx.fillRect(x+w-7,y+6,3,h-12);
  // Helmet
  ctx.fillStyle='#2a1a00';ctx.beginPath();ctx.arc(cx,y+6,w*0.38,Math.PI,0);ctx.fill();
  ctx.fillStyle='#ffaa00';ctx.globalAlpha=0.9;ctx.fillRect(cx-5,y+5,10,3);ctx.globalAlpha=1;
  // Sword
  const sAngle=Math.atan2(fy,fx);
  ctx.save();ctx.translate(cx+fx*10,cy+fy*10);ctx.rotate(sAngle);
  ctx.fillStyle='#cc8800';ctx.fillRect(-2,-14,4,14);
  ctx.fillStyle='#887700';ctx.fillRect(-6,-2,12,3);
  ctx.restore();
  // Glow on attack
  if(player.attack.active){ctx.strokeStyle='rgba(255,200,0,0.5)';ctx.lineWidth=2;ctx.shadowBlur=8;ctx.shadowColor='#ffaa00';ctx.strokeRect(player.attack.x,player.attack.y,player.attack.w,player.attack.h);ctx.shadowBlur=0;}
}

function drawCultist(e,flash){
  const cx=e.x+e.w/2,cy=e.y+e.h/2;
  // Robe
  ctx.fillStyle=flash?'#fff':'#550020';
  ctx.beginPath();ctx.moveTo(cx,e.y);ctx.lineTo(e.x+e.w,e.y+e.h);ctx.lineTo(e.x,e.y+e.h);ctx.closePath();ctx.fill();
  // Hood
  ctx.fillStyle=flash?'#fff':'#3d0015';ctx.beginPath();ctx.arc(cx,e.y+5,e.w*0.3,0,Math.PI*2);ctx.fill();
  // Glowing eyes
  if(!flash){ctx.fillStyle='#ff2200';ctx.shadowBlur=4;ctx.shadowColor='#ff2200';
    ctx.beginPath();ctx.arc(cx-4,e.y+5,2,0,Math.PI*2);ctx.fill();
    ctx.beginPath();ctx.arc(cx+4,e.y+5,2,0,Math.PI*2);ctx.fill();ctx.shadowBlur=0;}
  // Staff
  ctx.strokeStyle=flash?'#fff':'#6a3a00';ctx.lineWidth=2;
  ctx.beginPath();ctx.moveTo(e.x+e.w-2,e.y+4);ctx.lineTo(e.x+e.w-2,e.y+e.h-2);ctx.stroke();
  ctx.fillStyle='#dd4422';ctx.beginPath();ctx.arc(e.x+e.w-2,e.y+4,4,0,Math.PI*2);ctx.fill();
}

function drawWraith(e,flash){
  const cx=e.x+e.w/2,cy=e.y+e.h/2;
  const wave=Math.sin(e.animTimer*4)*3;
  ctx.globalAlpha=flash?1:0.80;
  // Ghostly body
  ctx.fillStyle=flash?'#fff':'#3344aa';
  ctx.beginPath();ctx.ellipse(cx,cy+wave,e.w*0.38,e.h*0.45,0,0,Math.PI*2);ctx.fill();
  // Wispy tails
  ctx.strokeStyle=flash?'#fff':'#5566cc';ctx.lineWidth=3;ctx.lineCap='round';
  ctx.beginPath();ctx.moveTo(cx-6,cy+e.h*0.3+wave);ctx.quadraticCurveTo(cx-14,cy+e.h*0.55+wave,cx-8,cy+e.h*0.72+wave);ctx.stroke();
  ctx.beginPath();ctx.moveTo(cx+6,cy+e.h*0.3+wave);ctx.quadraticCurveTo(cx+14,cy+e.h*0.55+wave,cx+8,cy+e.h*0.72+wave);ctx.stroke();
  // Eyes
  if(!flash){ctx.fillStyle='#ffffff';ctx.beginPath();ctx.arc(cx-5,cy-2+wave,3,0,Math.PI*2);ctx.fill();ctx.beginPath();ctx.arc(cx+5,cy-2+wave,3,0,Math.PI*2);ctx.fill();}
  ctx.globalAlpha=1;
}

function drawGargoyle(e,flash){
  const cx=e.x+e.w/2,cy=e.y+e.h/2;
  // Stone body
  ctx.fillStyle=flash?'#fff':'#556677';ctx.beginPath();if(ctx.roundRect)ctx.roundRect(e.x+2,e.y+4,e.w-4,e.h-6,4);else ctx.rect(e.x+2,e.y+4,e.w-4,e.h-6);ctx.fill();
  // Wings
  ctx.fillStyle=flash?'#fff':'#445566';
  ctx.beginPath();ctx.moveTo(e.x,e.y+8);ctx.lineTo(e.x-8,e.y+4);ctx.lineTo(e.x+2,e.y+24);ctx.closePath();ctx.fill();
  ctx.beginPath();ctx.moveTo(e.x+e.w,e.y+8);ctx.lineTo(e.x+e.w+8,e.y+4);ctx.lineTo(e.x+e.w-2,e.y+24);ctx.closePath();ctx.fill();
  // Head with horns
  ctx.fillStyle=flash?'#fff':'#667788';ctx.beginPath();ctx.arc(cx,e.y+7,e.w*0.33,0,Math.PI*2);ctx.fill();
  if(!flash){ctx.fillStyle='#445566';ctx.fillRect(cx-8,e.y-2,3,8);ctx.fillRect(cx+5,e.y-2,3,8);}
  // Red eyes
  if(!flash){ctx.fillStyle='#ff4400';ctx.beginPath();ctx.arc(cx-5,e.y+6,2.5,0,Math.PI*2);ctx.fill();ctx.beginPath();ctx.arc(cx+5,e.y+6,2.5,0,Math.PI*2);ctx.fill();}
}

function drawDemon(e,flash){
  const cx=e.x+e.w/2,cy=e.y+e.h/2;
  // Fire aura
  if(!flash){const aura=0.15+0.1*Math.sin(e.animTimer*5);ctx.fillStyle=`rgba(220,50,0,${aura})`;ctx.beginPath();ctx.arc(cx,cy,e.w*0.7,0,Math.PI*2);ctx.fill();}
  // Body
  ctx.fillStyle=flash?'#fff':'#8b0000';ctx.beginPath();if(ctx.roundRect)ctx.roundRect(e.x+2,e.y+3,e.w-4,e.h-5,3);else ctx.rect(e.x+2,e.y+3,e.w-4,e.h-5);ctx.fill();
  // Horns
  if(!flash){ctx.fillStyle='#440000';ctx.fillRect(cx-10,e.y-6,5,12);ctx.fillRect(cx+5,e.y-6,5,12);}
  // Eyes
  if(!flash){ctx.fillStyle='#ff8800';ctx.shadowBlur=6;ctx.shadowColor='#ff8800';
    ctx.beginPath();ctx.arc(cx-6,e.y+8,3,0,Math.PI*2);ctx.fill();
    ctx.beginPath();ctx.arc(cx+6,e.y+8,3,0,Math.PI*2);ctx.fill();ctx.shadowBlur=0;}
}

function drawOverlord(e,flash){
  const cx=e.x+e.w/2,cy=e.y+e.h/2;
  // Crown/aura
  if(!flash){
    const aura=0.2+0.15*Math.sin(_bgTimer*3);
    ctx.strokeStyle=`rgba(136,0,200,${aura*2})`;ctx.lineWidth=3;ctx.shadowBlur=12;ctx.shadowColor='#8800cc';
    ctx.beginPath();ctx.arc(cx,cy,e.w*0.65,0,Math.PI*2);ctx.stroke();ctx.shadowBlur=0;
    // Orbiting skulls
    for(let i=0;i<3;i++){const a=_bgTimer*1.8+i*Math.PI*2/3;const ox=cx+Math.cos(a)*e.w*0.55,oy=cy+Math.sin(a)*e.h*0.5;ctx.fillStyle='#cc88ff';ctx.beginPath();ctx.arc(ox,oy,5,0,Math.PI*2);ctx.fill();}
  }
  // Body
  ctx.fillStyle=flash?'#fff':'#1a0030';ctx.beginPath();ctx.arc(cx,cy,e.w/2-2,0,Math.PI*2);ctx.fill();
  // Crown spikes
  if(!flash){for(let i=-2;i<=2;i++){const sx=cx+i*8,sy=e.y-2;ctx.fillStyle='#8800cc';ctx.beginPath();ctx.moveTo(sx-4,sy+6);ctx.lineTo(sx,sy-4);ctx.lineTo(sx+4,sy+6);ctx.closePath();ctx.fill();}}
  // Face
  if(!flash){
    ctx.fillStyle='#cc88ff';ctx.shadowBlur=8;ctx.shadowColor='#8800cc';
    ctx.beginPath();ctx.arc(cx-9,cy-4,4,0,Math.PI*2);ctx.fill();
    ctx.beginPath();ctx.arc(cx+9,cy-4,4,0,Math.PI*2);ctx.fill();ctx.shadowBlur=0;
    ctx.strokeStyle='#aa44ff';ctx.lineWidth=2;ctx.beginPath();ctx.arc(cx,cy+4,8,0,Math.PI);ctx.stroke();
  }
}

// ══════════════════════════════════════════════════════════════════
// RENDER
// ══════════════════════════════════════════════════════════════════
const FLOOR_THEMES=[
  {name:'Crypt',      floorC:'#1a1020',floor2:'#1e1428',wallC:'#2c1540',edge:'#4a1e66'},
  {name:'Temple',     floorC:'#101820',floor2:'#141e28',wallC:'#1a2a40',edge:'#2a4466'},
  {name:'Abyss',      floorC:'#0a0818',floor2:'#0e0c20',wallC:'#18104a',edge:'#2a1870'},
  {name:'Inferno',    floorC:'#180808',floor2:'#201010',wallC:'#3a1408',edge:'#6a2200'},
  {name:'Dark Core',  floorC:'#080808',floor2:'#100e10',wallC:'#1a0020',edge:'#440044'},
];

function renderPlaying(){
  if(!currentRoom)return;
  const theme=FLOOR_THEMES[Math.min(floorNum-1,FLOOR_THEMES.length-1)];
  ctx.fillStyle=theme.floorC;ctx.fillRect(0,0,W,H);
  ctx.save();ctx.translate(-Math.round(cam.x),-Math.round(cam.y));

  // Floor tiles
  for(let r=0;r<ROOM_H/TILE-2;r++){
    for(let c=0;c<ROOM_W/TILE-2;c++){
      ctx.fillStyle=(r+c)%2===0?theme.floorC:theme.floor2;
      ctx.fillRect(TILE+c*TILE,TILE+r*TILE,TILE,TILE);
    }
  }
  // Floor cracks (inferno/abyss)
  if(floorNum>=3){
    ctx.strokeStyle=floorNum>=4?'rgba(220,80,0,0.12)':'rgba(80,0,160,0.10)';ctx.lineWidth=1.5;
    for(let i=0;i<8;i++){const x=TILE+(i*137+floorNum*31)%(ROOM_W-TILE*2),y=TILE+(i*97+floorNum*53)%(ROOM_H-TILE*2);ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(x+TILE*0.6,y+TILE*0.4);ctx.stroke();}
  }

  // Walls
  currentRoom.walls.forEach(w=>{ctx.fillStyle=theme.wallC;ctx.fillRect(w.x,w.y,w.w,w.h);ctx.fillStyle=theme.edge;ctx.fillRect(w.x,w.y,w.w,3);});

  // Exit marker
  if(currentRoom.cleared&&currentRoom.type!=='boss'){
    ctx.fillStyle='#664400';ctx.fillRect(ROOM_W-TILE,ROOM_H/2-TILE*0.8,TILE,TILE*1.6);
    ctx.fillStyle='#ffaa00';ctx.shadowBlur=8;ctx.shadowColor='#ffaa00';
    ctx.fillRect(ROOM_W-TILE+2,ROOM_H/2-TILE*0.6,TILE-4,TILE*1.2);ctx.shadowBlur=0;
    drawText('►',ROOM_W-TILE*0.6,ROOM_H/2+5,'#000',12,'center');
  }

  // Loot
  lootPool.active.forEach(l=>{
    const bob=Math.sin(l.bobTimer*3)*3;
    const col=l.type==='crystal'?PALETTE.crystal:l.type==='gold'?'#ffcc00':'#ff8888';
    ctx.fillStyle=col;ctx.shadowBlur=8;ctx.shadowColor=col;
    ctx.beginPath();ctx.arc(l.x+l.w/2,l.y+l.h/2+bob,l.w/2,0,Math.PI*2);ctx.fill();ctx.shadowBlur=0;
    ctx.fillStyle='#000';ctx.font='bold 9px monospace';ctx.textAlign='center';
    ctx.fillText(l.type==='crystal'?'⚗':l.type==='gold'?'g':'+',l.x+l.w/2,l.y+l.h/2+bob+3);ctx.textAlign='left';
  });

  // Enemy projectiles
  projPool.active.forEach(p=>{ctx.fillStyle=p.color;ctx.shadowBlur=6;ctx.shadowColor=p.color;ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,Math.PI*2);ctx.fill();ctx.shadowBlur=0;});

  // Enemies
  enemyPool.active.forEach(e=>{
    const flash=e.flashTimer>0;
    switch(e.type){
      case'cultist':drawCultist(e,flash);break;
      case'wraith':drawWraith(e,flash);break;
      case'gargoyle':drawGargoyle(e,flash);break;
      case'demon':drawDemon(e,flash);break;
      case'overlord':drawOverlord(e,flash);break;
    }
    drawBar(e.x,e.y-9,e.w,5,e.hp,e.maxHp,'#f44','#300');
  });

  // Dodge trail
  if(player.dodgeTimer>0){ctx.fillStyle=PALETTE.dodge;ctx.beginPath();ctx.arc(player.x+player.w/2,player.y+player.h/2,player.w,0,Math.PI*2);ctx.fill();}

  // Player
  const blink=player.iframes>0&&player.dodgeTimer<=0&&Math.floor(player.iframes/0.07)%2===0;
  if(!blink){
    ctx.globalAlpha=player.iframes>0?0.55:1.0;
    drawKnight(player.x,player.y,player.w,player.h,player.facingX||1,player.facingY||0,player.animTimer);
    ctx.globalAlpha=1;
  }

  ctx.restore();

  // HUD
  drawText(`Floor ${floorNum}  ${FLOOR_THEMES[Math.min(floorNum-1,FLOOR_THEMES.length-1)].name}`,10,22,PALETTE.ui,12);
  drawText(`LV ${player.level}`,W/2,22,'#ccaaff',12,'center');
  drawText(`Score: ${runScore}`,W-10,22,'#556',11,'right');
  drawBar(10,H-32,140,10,player.hp,player.maxHp,'#cc2244','#300');drawText('HP',155,H-23,'#664',10);
  drawBar(10,H-18,100,6,player.xp,60*player.level,PALETTE.xp,'#022');drawText('XP',114,H-12,PALETTE.xp,9);
  if(player.dodgeCooldown>0){drawBar(W-120,H-18,110,6,player.DODGE_CD-player.dodgeCooldown,player.DODGE_CD,'#ffaa00','#320');drawText('ROLL',W-127,H-12,PALETTE.player,9,'right');}
  drawText(`⚗${_meta.coins}  ⚜${player.gold}g`,W-10,H-32,'#ccaaff',11,'right');
  if(player.relics.length>0)drawText(player.relics.map(r=>({vamp:'🩸',crit:'💀',aoe:'🌪',berserk:'🔥'}[r]||r)).join(' '),10,H-46,'#a4f',11);
}

function renderLevelUp(){
  renderPlaying();
  ctx.fillStyle='rgba(0,0,0,0.74)';ctx.fillRect(0,0,W,H);
  drawText('LEVEL UP!',W/2,H*0.13,'#ffcc00',28,'center');
  drawText(`Level ${player.level} — Choose an upgrade:`,W/2,H*0.21,'#ccaaff',13,'center');
  levelUpChoices.forEach((u,i)=>{
    const sel=i===lvlChoice;
    const y=H*0.29+i*105;
    ctx.fillStyle=sel?'#2a1840':'#160c28';
    ctx.beginPath();if(ctx.roundRect)ctx.roundRect(W/2-220,y,440,92,8);else ctx.rect(W/2-220,y,440,92);ctx.fill();
    ctx.strokeStyle=sel?PALETTE.accent:'#2a1040';ctx.lineWidth=1.5;
    ctx.beginPath();if(ctx.roundRect)ctx.roundRect(W/2-220,y,440,92,8);else ctx.rect(W/2-220,y,440,92);ctx.stroke();
    drawText(u.icon,W/2-195,y+52,'#fff',30,'left');
    drawText(u.name,W/2-148,y+27,sel?'#fff':'#ccaaff',17,'left');
    drawText(u.desc,W/2-148,y+52,'#998899',12,'left');
    if(sel)drawText('▶ ENTER to choose',W/2+108,y+72,'#ffcc00',10,'right');
  });
}

function renderMenu(){
  const now=performance.now()*0.001;
  ctx.fillStyle=PALETTE.bg;ctx.fillRect(0,0,W,H);
  // Background skulls
  ctx.fillStyle='rgba(80,0,30,0.08)';
  for(let i=0;i<12;i++){const x=(i*113)%W,y=(i*79)%H;ctx.beginPath();ctx.arc(x,y,20,0,Math.PI*2);ctx.fill();}
  ctx.textAlign='center';
  ctx.fillStyle='#8800cc';ctx.shadowBlur=20;ctx.shadowColor='#8800cc';
  ctx.font='bold 46px "Courier New",monospace';ctx.fillText('ABYSSAL',W/2,H*0.26);
  ctx.fillStyle='#cc4400';ctx.shadowColor='#cc4400';
  ctx.fillText('DESCENT',W/2,H*0.38);ctx.shadowBlur=0;
  ctx.fillStyle='#ccaaff';ctx.font='11px system-ui,sans-serif';
  ctx.fillText('WASD — Move    SPACE/Z — Attack    SHIFT — Dodge',W/2,H*0.50);
  ctx.fillText('Survive 5 floors and slay the Abyssal Overlord',W/2,H*0.57);
  ctx.fillStyle='#aa88cc';ctx.font='13px system-ui,sans-serif';
  ctx.fillText(`⚗ ${_meta.coins} souls    Best Floor: ${_bestFloor}`,W/2,H*0.66);
  ctx.fillStyle='#fff';ctx.font='bold 16px system-ui,sans-serif';ctx.fillText('PRESS SPACE',W/2,H*0.75);
  ctx.textAlign='left';
}

function renderGameover(){
  ctx.fillStyle=PALETTE.bg;ctx.fillRect(0,0,W,H);
  ctx.textAlign='center';
  ctx.fillStyle='#cc2244';ctx.font='bold 34px system-ui,sans-serif';ctx.fillText('FALLEN',W/2,H*0.28);
  ctx.fillStyle='#f0e0ff';ctx.font='bold 15px system-ui,sans-serif';ctx.fillText(`Floor ${floorNum} — ${FLOOR_THEMES[Math.min(floorNum-1,FLOOR_THEMES.length-1)].name}`,W/2,H*0.38);
  ctx.font='bold 13px system-ui,sans-serif';ctx.fillText(`Score: ${runScore}`,W/2,H*0.46);
  ctx.fillStyle='#ccaaff';ctx.fillText(`Best Floor: ${_bestFloor}`,W/2,H*0.54);
  if(_runCoins>0){ctx.fillStyle='#ffdd00';ctx.fillText(`⚗ ${_runCoins} souls earned`,W/2,H*0.62);}
  ctx.fillStyle='#887799';ctx.font='13px system-ui,sans-serif';ctx.fillText('Approaching the Dark Shrine…',W/2,H*0.72);
  ctx.textAlign='left';
}

function renderVictory(){
  ctx.fillStyle=PALETTE.bg;ctx.fillRect(0,0,W,H);
  ctx.textAlign='center';
  ctx.fillStyle='#ffcc00';ctx.shadowBlur=16;ctx.shadowColor='#ffcc00';
  ctx.font='bold 30px system-ui,sans-serif';ctx.fillText('OVERLORD VANQUISHED!',W/2,H*0.28);ctx.shadowBlur=0;
  ctx.fillStyle='#f0e0ff';ctx.font='bold 15px system-ui,sans-serif';ctx.fillText(`All ${TOTAL_FLOORS} floors cleared!`,W/2,H*0.38);
  ctx.fillText(`Score: ${runScore}`,W/2,H*0.47);
  ctx.fillStyle='#ccaaff';ctx.font='13px system-ui,sans-serif';ctx.fillText('SPACE to return to menu',W/2,H*0.62);
  ctx.textAlign='left';
}

// ══════════════════════════════════════════════════════════════════
// START
// ══════════════════════════════════════════════════════════════════
requestAnimationFrame(t=>{lastTime=t;requestAnimationFrame(loop);});
</script>
