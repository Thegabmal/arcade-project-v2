// ENGINE — DO NOT MODIFY
window.__devPatch=function(code){return eval(code);};
const canvas=document.getElementById('gameCanvas');
const ctx=canvas.getContext('2d');
const DPR=Math.min(window.devicePixelRatio||1,2);
const GAME_W=800,GAME_H=600;
let W=GAME_W,H=GAME_H;
function resizeCanvas(){const s=Math.min(window.innerWidth/W,window.innerHeight/H);canvas.style.width=Math.round(W*s)+'px';canvas.style.height=Math.round(H*s)+'px';canvas.width=Math.round(W*DPR);canvas.height=Math.round(H*DPR);ctx.scale(DPR,DPR);}
resizeCanvas();window.addEventListener('resize',()=>{resizeCanvas();ctx.scale(DPR,DPR);});

let gameState='title';
function setState(s){gameState=s;}

const Keys={down:{},pressed:{}};
window.addEventListener('keydown',e=>{if(!Keys.down[e.code])Keys.pressed[e.code]=true;Keys.down[e.code]=true;if(['Space','Enter','ArrowUp','ArrowDown'].includes(e.code))e.preventDefault();});
window.addEventListener('keyup',e=>{Keys.down[e.code]=false;});
const Pointer={x:0,y:0,justDown:false};
canvas.addEventListener('mousedown',e=>{const r=canvas.getBoundingClientRect();Pointer.x=(e.clientX-r.left)*(W/r.width);Pointer.y=(e.clientY-r.top)*(H/r.height);Pointer.justDown=true;});
canvas.addEventListener('touchstart',e=>{e.preventDefault();const r=canvas.getBoundingClientRect();Pointer.x=(e.touches[0].clientX-r.left)*(W/r.width);Pointer.y=(e.touches[0].clientY-r.top)*(H/r.height);Pointer.justDown=true;},{passive:false});

function keyPressed(c){return!!Keys.pressed[c];}
function anyAction(){return keyPressed('Space')||keyPressed('Enter')||Pointer.justDown;}
function flushInput(){Keys.pressed={};Pointer.justDown=false;}

const sfx={_ctx:null,init(){try{if(!this._ctx)this._ctx=new(window.AudioContext||window.webkitAudioContext)();if(this._ctx.state==='suspended')this._ctx.resume();}catch(e){}},
play(f,d,t,v){try{this.init();if(!this._ctx)return;const o=this._ctx.createOscillator(),g=this._ctx.createGain();o.type=t||'sine';o.frequency.value=f||440;g.gain.setValueAtTime(v||0.10,this._ctx.currentTime);g.gain.exponentialRampToValueAtTime(0.001,this._ctx.currentTime+(d||0.15));o.connect(g);g.connect(this._ctx.destination);o.start();o.stop(this._ctx.currentTime+(d||0.15));}catch(e){}}};

function lerp(a,b,t){return a+(b-a)*t;}
function clamp(v,mn,mx){return v<mn?mn:v>mx?mx:v;}
function randInt(a,b){return a+Math.floor(Math.random()*(b-a+1));}
function randFloat(a,b){return a+Math.random()*(b-a);}
function randChoice(arr){return arr[Math.floor(Math.random()*arr.length)];}
function drawText(t,x,y,c,s,a){ctx.fillStyle=c||'#fff';ctx.font=`${s||14}px 'Georgia',serif`;ctx.textAlign=a||'left';ctx.fillText(t,x,y);}
function drawTextB(t,x,y,c,s,a){ctx.fillStyle=c||'#fff';ctx.font=`bold ${s||14}px system-ui,sans-serif`;ctx.textAlign=a||'left';ctx.fillText(t,x,y);}
function drawBar(x,y,w,h,v,m,fg,bg){ctx.fillStyle=bg||'#333';ctx.fillRect(x,y,w,h);ctx.fillStyle=fg||'#0f0';ctx.fillRect(x,y,Math.round(w*clamp(v/m,0,1)),h);ctx.strokeStyle='rgba(0,0,0,0.4)';ctx.lineWidth=1;ctx.strokeRect(x,y,w,h);}

const FIXED_DT=1/60;
const MAX_DT=0.1;
let lastTime=0;
let accumulator=0;
function loop(ts){const rd=Math.min((ts-lastTime)/1000,MAX_DT);lastTime=ts;accumulator+=rd;while(accumulator>=FIXED_DT){update(FIXED_DT);accumulator-=FIXED_DT;}renderFrame();requestAnimationFrame(loop);}
function update(dt){
  switch(gameState){
    case 'title':   updateTitle(dt);   break;
    case 'scene':   updateScene(dt);   break;
    case 'battle':  updateBattle(dt);  break;
    case 'levelup': updateLevelUp(dt); break;
    case 'gameover':updateGameover(dt);break;
    case 'shop':    updateShop(dt);    break;
    case 'victory': if(anyAction()){restartGame();}break;
  }
  flushInput();
}
function renderFrame(){
  switch(gameState){
    case 'title':   renderTitle();   break;
    case 'scene':   renderScene();   break;
    case 'battle':  renderBattle();  break;
    case 'levelup': renderLevelUp(); break;
    case 'gameover':renderGameover();break;
    case 'shop':    renderShop();    break;
    case 'victory': renderVictory(); break;
  }
}

// DIALOGUE SYSTEM
let currentScene=null,lineIndex=0,typeTimer=0,typePos=0;
const TYPE_SPEED=38;
let displayedText='',textComplete=false,choiceIndex=0,storyFlags={},scenePhase='dialogue';

function gotoScene(id){
  if(id==='__VICTORY__'){setState('victory');return;}
  const scene=SCENES[id];
  if(!scene){console.warn('Scene not found:',id);return;}
  currentScene=scene;lineIndex=0;typePos=0;typeTimer=0;
  displayedText='';textComplete=false;choiceIndex=0;scenePhase='dialogue';
  bgTransition={from:currentBg,to:scene.bg,t:0};
  setState('scene');
}
function getCurrentLine(){return currentScene&&currentScene.lines[lineIndex]||null;}
function advanceDialogue(){
  if(!textComplete){typePos=getCurrentLine().text.length;textComplete=true;return;}
  lineIndex++;
  if(lineIndex>=currentScene.lines.length){
    if(currentScene.battle&&!storyFlags['battle_'+currentScene.id]){startBattle(currentScene.battle);return;}
    if(currentScene.choices&&currentScene.choices.length>0){scenePhase='choices';return;}
    if(currentScene.auto){gotoScene(currentScene.auto);return;}
    return;
  }
  typePos=0;typeTimer=0;displayedText='';textComplete=false;
}
function updateScene(dt){
  if(scenePhase==='dialogue'){
    const line=getCurrentLine();if(!line)return;
    if(!textComplete){
      typeTimer+=dt;
      const target=Math.floor(typeTimer*TYPE_SPEED);
      if(target>=line.text.length){typePos=line.text.length;textComplete=true;sfx.play(660,0.04,'sine',0.05);}
      else if(target>typePos){typePos=target;if(typePos%3===0)sfx.play(440+Math.random()*80,0.03,'sine',0.04);}
      displayedText=line.text.slice(0,typePos);
    }
    if(anyAction())advanceDialogue();
  } else {
    if(keyPressed('ArrowUp')&&choiceIndex>0){choiceIndex--;sfx.play(550,0.05,'sine',0.06);}
    if(keyPressed('ArrowDown')&&choiceIndex<currentScene.choices.length-1){choiceIndex++;sfx.play(550,0.05,'sine',0.06);}
    if(anyAction()){const ch=currentScene.choices[choiceIndex];if(ch){sfx.play(660,0.08,'square',0.09);gotoScene(ch.goto);}}
  }
}

// TURN-BASED BATTLE
let enemy=null,battleState='player_turn',battleLog=[],battleMenu={selected:0,open:true},battleTimer=0,battleResult='',returnToScene='';

function startBattle(def){
  storyFlags['battle_'+currentScene.id]=true;
  returnToScene=currentScene.auto||'';
  enemy={...def,hp:def.hp,maxHp:def.hp,animX:0,shakeTimer:0};
  battleLog=[`${def.name} appears!`];
  battleState='player_turn';battleMenu.selected=0;battleMenu.open=true;battleTimer=0;
  setState('battle');sfx.play(220,0.25,'sawtooth',0.12);
}
function battleAction(action){
  battleMenu.open=false;
  let dmg=0,log='';
  if(action===0){
    dmg=Math.max(1,hero.atk+randInt(-3,3)-enemy.def);
    log=`Lyra strikes! ${dmg} damage.`;
    enemy.hp=Math.max(0,enemy.hp-dmg);enemy.shakeTimer=0.25;
    sfx.play(330,0.10,'sawtooth',0.12);
  }else if(action===1){
    if(hero.mp>=10){dmg=Math.max(1,Math.floor(hero.atk*1.8+randInt(-2,2)));hero.mp-=10;log=`Arcane Bolt! ${dmg} damage.`;enemy.hp=Math.max(0,enemy.hp-dmg);sfx.play(880,0.15,'sine',0.12);}
    else{log='Not enough MP!';battleMenu.open=true;return;}
  }else if(action===2){
    log='Ward active — damage halved next hit.';hero._defending=true;
  }else if(action===3){
    if(hero._potions>0){hero._potions--;const heal=randInt(25,40);hero.hp=Math.min(hero.maxHp,hero.hp+heal);log=`Elixir used! +${heal} HP.`;}
    else{log='No Elixirs remaining!';battleMenu.open=true;return;}
  }
  battleLog.push(log);if(battleLog.length>4)battleLog.shift();
  if(enemy.hp<=0){battleState='result';battleResult='win';battleTimer=1.5;return;}
  battleState='enemy_turn';battleTimer=0.9;
}
function updateBattle(dt){
  if(enemy.shakeTimer>0){enemy.shakeTimer-=dt;enemy.animX=(Math.random()*2-1)*5;}else{enemy.animX=0;}
  if(battleState==='player_turn'&&battleMenu.open){
    if(keyPressed('ArrowUp'))battleMenu.selected=Math.max(0,battleMenu.selected-1);
    if(keyPressed('ArrowDown'))battleMenu.selected=Math.min(hero.abilities.length-1,battleMenu.selected+1);
    if(keyPressed('Space')||keyPressed('Enter')||Pointer.justDown){
      let idx=battleMenu.selected;
      if(Pointer.justDown){const menuY=H-160;hero.abilities.forEach((_,i)=>{if(Pointer.y>menuY+i*36&&Pointer.y<menuY+i*36+32)idx=i;});}
      battleAction(idx);
    }
    return;
  }
  if(battleState==='enemy_turn'){
    battleTimer-=dt;
    if(battleTimer<=0){
      const def=hero._defending?Math.floor(hero.def*1.8):hero.def;hero._defending=false;
      const dmg=Math.max(1,enemy.atk+randInt(-3,3)-def);
      hero.hp=Math.max(0,hero.hp-dmg);
      battleLog.push(`${enemy.name} attacks! -${dmg} HP`);if(battleLog.length>4)battleLog.shift();
      sfx.play(150,0.18,'sawtooth',0.12);
      if(hero.hp<=0){battleState='result';battleResult='lose';battleTimer=1.5;return;}
      battleState='player_turn';battleMenu.open=true;battleMenu.selected=0;
    }
    return;
  }
  if(battleState==='result'){
    battleTimer-=dt;
    if(battleTimer<=0){
      if(battleResult==='win'){
        hero.xp+=Math.floor(enemy.reward.xp*_xpMult);hero.gold+=enemy.reward.gold;
        sfx.play(660,0.2,'sine',0.10);
        if(hero.xp>=hero.level*80){
          hero.xp-=hero.level*80;hero.level++;
          hero.maxHp+=15;hero.hp=Math.min(hero.hp+25,hero.maxHp);
          hero.atk+=3;hero.def+=2;hero.maxMp+=8;
          setState('levelup');
        }else{if(returnToScene)gotoScene(returnToScene);else setState('scene');}
      }else{
        _runCoins=hero.gold;_gameoverTimer=1.5;setState('gameover');
      }
    }
  }
}
let levelupTimer=0;
function updateLevelUp(dt){levelupTimer+=dt;if(anyAction()||levelupTimer>3){levelupTimer=0;if(returnToScene)gotoScene(returnToScene);else setState('scene');}}

// BACKGROUNDS
let currentBg='village',bgTransition={from:'village',to:'village',t:1};
function drawBackground(bg){
  const bgs={
    village:()=>{
      const g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#12204a');g.addColorStop(1,'#1e3020');
      ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
      // Stars
      ctx.fillStyle='#fff';[[90,40],[210,70],[370,35],[530,55],[680,28],[760,65]].forEach(([sx,sy])=>{ctx.beginPath();ctx.arc(sx,sy,1.5,0,Math.PI*2);ctx.fill();});
      // Houses
      ctx.fillStyle='#5a3a22';ctx.fillRect(50,310,110,170);ctx.fillRect(590,290,130,190);
      ctx.fillStyle='#7a4a2a';ctx.fillRect(270,330,100,150);
      // Roofs
      ctx.fillStyle='#8a2a2a';
      ctx.beginPath();ctx.moveTo(38,310);ctx.lineTo(105,235);ctx.lineTo(172,310);ctx.fill();
      ctx.beginPath();ctx.moveTo(258,330);ctx.lineTo(320,258);ctx.lineTo(382,330);ctx.fill();
      ctx.beginPath();ctx.moveTo(578,290);ctx.lineTo(655,215);ctx.lineTo(732,290);ctx.fill();
      // Glowing windows
      ctx.fillStyle='#ffdd88';ctx.shadowBlur=8;ctx.shadowColor='#ffaa00';
      ctx.fillRect(78,360,26,22);ctx.fillRect(114,360,26,22);ctx.fillRect(293,368,22,18);ctx.fillRect(614,338,22,18);ctx.shadowBlur=0;
      ctx.fillStyle='#2a3a1a';ctx.fillRect(0,H-55,W,55);
    },
    forest:()=>{
      const g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#060e0a');g.addColorStop(1,'#0e1e0e');
      ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
      ctx.fillStyle='rgba(200,220,255,0.6)';ctx.shadowBlur=25;ctx.shadowColor='#aaccff';
      ctx.beginPath();ctx.arc(680,75,30,0,Math.PI*2);ctx.fill();ctx.shadowBlur=0;
      [30,155,290,430,565,690].forEach((tx,i)=>{
        const th=185+i*15,r=26+i*3;
        ctx.fillStyle='#1a1005';ctx.fillRect(tx+r-8,H-th,16,th);
        ctx.fillStyle=`hsl(${128+i*8},28%,${10+i*2}%)`;
        ctx.beginPath();ctx.arc(tx+r,H-th,r,0,Math.PI*2);ctx.fill();
        ctx.beginPath();ctx.arc(tx+r,H-th-18,r*0.7,0,Math.PI*2);ctx.fill();
      });
      ctx.fillStyle='#0a1a08';ctx.fillRect(0,H-50,W,50);
      ctx.fillStyle='rgba(160,200,180,0.05)';ctx.fillRect(0,H-100,W,70);
    },
    dungeon:()=>{
      ctx.fillStyle='#04020c';ctx.fillRect(0,0,W,H);
      for(let r=0;r<H;r+=40){const off=r%80===0?0:40;for(let c=off;c<W;c+=80){ctx.fillStyle=`hsl(270,12%,${7+Math.random()*3}%)`;ctx.fillRect(c,r,78,38);ctx.strokeStyle='rgba(0,0,0,0.5)';ctx.lineWidth=1;ctx.strokeRect(c,r,78,38);}}
      [180,580].forEach(tx=>{ctx.fillStyle='#6a3300';ctx.fillRect(tx-4,188,8,35);ctx.fillStyle='#ffaa00';ctx.shadowBlur=22;ctx.shadowColor='#ff6600';ctx.beginPath();ctx.arc(tx,186,13,0,Math.PI*2);ctx.fill();ctx.shadowBlur=0;});
      ctx.fillStyle='#0a0518';ctx.fillRect(0,H-45,W,45);
    },
    castle:()=>{
      const g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#0c0618');g.addColorStop(1,'#180828');
      ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
      ctx.fillStyle='#14082a';ctx.fillRect(0,130,W,H-130);
      for(let bx=0;bx<W;bx+=60){ctx.fillStyle='#14082a';ctx.fillRect(bx,108,40,28);}
      [[200,200],[400,175],[600,198],[310,305],[500,280]].forEach(([wx,wy])=>{
        ctx.fillStyle='#6600aa';ctx.shadowBlur=14;ctx.shadowColor='#cc44ff';
        ctx.beginPath();ctx.arc(wx,wy,10,Math.PI,0);ctx.fill();ctx.fillRect(wx-10,wy,20,14);ctx.shadowBlur=0;
      });
      ctx.fillStyle='rgba(100,0,180,0.07)';ctx.fillRect(0,H-110,W,90);
      ctx.fillStyle='#0c0618';ctx.fillRect(0,H-35,W,35);
    },
    light:()=>{
      const g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#fff9e6');g.addColorStop(1,'#ffe060');
      ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
      ctx.shadowBlur=80;ctx.shadowColor='#fff';ctx.fillStyle='rgba(255,255,255,0.5)';
      ctx.beginPath();ctx.arc(W/2,H*0.3,130,0,Math.PI*2);ctx.fill();

    },
  };
  (bgs[bg]||bgs.village)();
}

// CHARACTER PORTRAITS
function drawCharacter(charId,side,mood,alpha){
  const def=CHAR_COLORS[charId];if(!def)return;
  const x=side==='left'?15:side==='right'?W-195:W/2-95;
  const y=H-295;
  ctx.globalAlpha=alpha||1;
  // Robe
  ctx.fillStyle=def.body;
  ctx.beginPath();ctx.moveTo(x+80,y+155);ctx.lineTo(x+15,y+295);ctx.lineTo(x+145,y+295);ctx.closePath();ctx.fill();
  ctx.beginPath();ctx.ellipse(x+80,y+175,34,48,0,0,Math.PI*2);ctx.fill();
  // Head
  ctx.beginPath();ctx.arc(x+80,y+100,46,0,Math.PI*2);ctx.fill();
  // Hair
  ctx.fillStyle=def.hair;ctx.beginPath();ctx.arc(x+80,y+80,48,Math.PI,0);ctx.fill();ctx.fillRect(x+32,y+76,96,24);
  // Eyes
  const ey=mood==='angry'?-3:mood==='happy'?2:0;
  ctx.fillStyle=def.eye;ctx.beginPath();ctx.arc(x+63,y+103+ey,8,0,Math.PI*2);ctx.fill();ctx.beginPath();ctx.arc(x+97,y+103+ey,8,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='#111';ctx.beginPath();ctx.arc(x+64,y+104+ey,4,0,Math.PI*2);ctx.fill();ctx.beginPath();ctx.arc(x+98,y+104+ey,4,0,Math.PI*2);ctx.fill();
  // Mouth
  ctx.strokeStyle='#222';ctx.lineWidth=2;ctx.beginPath();
  if(mood==='happy'){ctx.arc(x+80,y+122,13,0.1*Math.PI,0.9*Math.PI);}
  else if(mood==='angry'){ctx.arc(x+80,y+130,13,1.1*Math.PI,1.9*Math.PI);}
  else{ctx.moveTo(x+67,y+126);ctx.lineTo(x+93,y+126);}
  ctx.stroke();
  // Character details
  if(charId==='sage'){
    ctx.strokeStyle='#aa7700';ctx.lineWidth=4;ctx.beginPath();ctx.moveTo(x+130,y+148);ctx.lineTo(x+142,y+295);ctx.stroke();
    ctx.fillStyle='#ffaa00';ctx.shadowBlur=12;ctx.shadowColor='#ffaa00';ctx.beginPath();ctx.arc(x+130,y+140,9,0,Math.PI*2);ctx.fill();ctx.shadowBlur=0;
    ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(x+80,y+60,48,Math.PI+0.3,Math.PI*2-0.3);ctx.fill();
  }else if(charId==='knight'){
    ctx.fillStyle='#991a10';ctx.beginPath();ctx.arc(x+80,y+78,50,Math.PI,0);ctx.fill();
    ctx.fillStyle='#cccccc';ctx.fillRect(x+52,y+88,56,14);
    ctx.fillStyle='#991a10';ctx.beginPath();ctx.arc(x+34,y+168,18,0,Math.PI*2);ctx.fill();ctx.beginPath();ctx.arc(x+126,y+168,18,0,Math.PI*2);ctx.fill();
  }else if(charId==='villain'){
    ctx.shadowBlur=22;ctx.shadowColor='#cc00ff';ctx.fillStyle='rgba(80,0,110,0.28)';ctx.beginPath();ctx.arc(x+80,y+140,78,0,Math.PI*2);ctx.fill();ctx.shadowBlur=0;
    ctx.fillStyle='#330044';
    [[60,58],[71,44],[80,40],[89,44],[100,58]].forEach(([sx,sy])=>{ctx.beginPath();ctx.moveTo(x+sx-80+80,y+sy);ctx.lineTo(x+sx-80+74,y+sy+18);ctx.lineTo(x+sx-80+86,y+sy+18);ctx.closePath();ctx.fill();});
  }
  ctx.globalAlpha=1;
}

function drawEnemySprite(e,ex,ey){

  if(e.sprite==='wraith'){
    ctx.fillStyle=e.color;ctx.shadowBlur=28;ctx.shadowColor=e.color;
    ctx.beginPath();ctx.arc(0,0,44,Math.PI,0);ctx.fill();
    ctx.beginPath();ctx.ellipse(0,15,44,28,0,0,Math.PI*2);ctx.fill();ctx.shadowBlur=0;
    ctx.strokeStyle='rgba(136,170,221,0.4)';ctx.lineWidth=3;
    [-28,0,28].forEach(ox=>{ctx.beginPath();ctx.moveTo(ox,28);ctx.quadraticCurveTo(ox+(Math.random()*14-7),55,ox+(Math.random()*14-7),80);ctx.stroke();});
    ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(-16,-4,10,0,Math.PI*2);ctx.fill();ctx.beginPath();ctx.arc(16,-4,10,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='#001133';ctx.beginPath();ctx.arc(-16,-3,5,0,Math.PI*2);ctx.fill();ctx.beginPath();ctx.arc(16,-3,5,0,Math.PI*2);ctx.fill();
  }else if(e.sprite==='golem'){
    ctx.fillStyle=e.color;ctx.fillRect(-52,-72,104,145);ctx.beginPath();ctx.arc(0,-72,52,Math.PI,0);ctx.fill();
    ctx.strokeStyle='#6a5a40';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(-30,-38);ctx.lineTo(30,-38);ctx.stroke();ctx.beginPath();ctx.moveTo(-40,-8);ctx.lineTo(40,-8);ctx.stroke();
    ctx.fillStyle=e.color;ctx.fillRect(-82,-62,28,84);ctx.fillRect(54,-62,28,84);
    ctx.fillStyle='#aaddff';ctx.shadowBlur=16;ctx.shadowColor='#44aaff';ctx.beginPath();ctx.arc(-18,-56,12,0,Math.PI*2);ctx.fill();ctx.beginPath();ctx.arc(18,-56,12,0,Math.PI*2);ctx.fill();ctx.shadowBlur=0;
    ctx.fillStyle='#ccaaff';ctx.shadowBlur=10;ctx.shadowColor='#aa44ff';ctx.beginPath();ctx.moveTo(0,-18);ctx.lineTo(13,0);ctx.lineTo(0,18);ctx.lineTo(-13,0);ctx.closePath();ctx.fill();ctx.shadowBlur=0;
  }else if(e.sprite==='boss'){
    ctx.fillStyle='#220033';ctx.shadowBlur=35;ctx.shadowColor='#cc00ff';ctx.beginPath();ctx.arc(0,10,82,0,Math.PI*2);ctx.fill();ctx.shadowBlur=0;
    ctx.fillStyle='#0d0018';ctx.beginPath();ctx.moveTo(-74,10);ctx.lineTo(-95,130);ctx.lineTo(95,130);ctx.lineTo(74,10);ctx.closePath();ctx.fill();
    ctx.fillStyle='#1c0036';ctx.beginPath();ctx.arc(0,-12,56,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='#440066';ctx.beginPath();ctx.moveTo(-32,-58);ctx.lineTo(-52,-108);ctx.lineTo(-18,-65);ctx.closePath();ctx.fill();ctx.beginPath();ctx.moveTo(32,-58);ctx.lineTo(52,-108);ctx.lineTo(18,-65);ctx.closePath();ctx.fill();
    ctx.fillStyle='#ff2255';ctx.shadowBlur=16;ctx.shadowColor='#ff0033';ctx.beginPath();ctx.arc(-20,-15,14,0,Math.PI*2);ctx.fill();ctx.beginPath();ctx.arc(20,-15,14,0,Math.PI*2);ctx.fill();ctx.shadowBlur=0;
    ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(-20,-15,6,0,Math.PI*2);ctx.fill();ctx.beginPath();ctx.arc(20,-15,6,0,Math.PI*2);ctx.fill();
    const t2=Date.now()/600;
    [0,1,2].forEach(i=>{const ang=t2+i*Math.PI*2/3;ctx.fillStyle='#8800cc';ctx.shadowBlur=10;ctx.shadowColor='#cc00ff';ctx.beginPath();ctx.arc(Math.cos(ang)*95,Math.sin(ang)*50-10,10,0,Math.PI*2);ctx.fill();ctx.shadowBlur=0;});
  }else{
    ctx.fillStyle=e.color||'#f44';ctx.shadowBlur=20;ctx.shadowColor=e.color||'#f44';ctx.beginPath();ctx.arc(0,0,e.isBoss?80:50,0,Math.PI*2);ctx.fill();ctx.shadowBlur=0;

function drawWrappedText(text,x,y,maxW,color,size,lineH){
  ctx.fillStyle=color;ctx.font=`${size}px 'Georgia',serif`;ctx.textAlign='left';
  const words=text.split(' ');let line='',lineY=y;
  for(const w of words){const test=line+(line?' ':'')+w;if(ctx.measureText(test).width>maxW&&line){ctx.fillText(line,x,lineY);line=w;lineY+=lineH;}else line=test;}
  if(line)ctx.fillText(line,x,lineY);
}

// META PROGRESSION
const _META_KEY='meta_shards_eternity';
const UPGRADES=[
  {id:'star_shard',  label:'Star Shard',    desc:'+20g at start/lv', maxLv:3,cost:[50,100,170]},
  {id:'wisdom',      label:'Ancient Wisdom', desc:'+25% XP/lv',       maxLv:3,cost:[70,140,230]},
  {id:'life_crystal',label:'Life Crystal',   desc:'+20 max HP/lv',    maxLv:3,cost:[60,120,200]},
  {id:'battle_rite', label:'Battle Rite',    desc:'+4 ATK +2 DEF/lv', maxLv:3,cost:[90,160,260]},
];
let _meta={coins:0,upgrades:{}},_runCoins=0,_gameoverTimer=1.5,_shopIdx=0,_xpMult=1.0;
function loadMeta(){try{const s=localStorage.getItem(_META_KEY);_meta=s?JSON.parse(s):{coins:0,upgrades:{}};}catch(e){_meta={coins:0,upgrades:{}};}}
function saveMeta(){try{localStorage.setItem(_META_KEY,JSON.stringify(_meta));}catch(e){}}
function getUpgradeLevel(id){return(_meta.upgrades[id]||0);}
function buyUpgrade(id){const u=UPGRADES.find(x=>x.id===id);if(!u)return false;const lv=getUpgradeLevel(id);if(lv>=u.maxLv)return false;const cost=u.cost[lv];if(_meta.coins<cost)return false;_meta.coins-=cost;_meta.upgrades[id]=(lv+1);saveMeta();return true;}
function applyUpgrades(){
  const lc=getUpgradeLevel('life_crystal'),br=getUpgradeLevel('battle_rite'),sg=getUpgradeLevel('star_shard');
  hero.maxHp=80+lc*20;hero.hp=hero.maxHp;hero.atk=20+br*4;hero.def=6+br*2;hero.gold=sg*20;
  _xpMult=1+getUpgradeLevel('wisdom')*0.25;
}
function _shopHit(px,py,x,y,w,h){return px>=x&&px<=x+w&&py>=y&&py<=y+h;}
function updateGameover(dt){_gameoverTimer-=dt;if(_gameoverTimer<=0||anyAction()){_meta.coins+=_runCoins;saveMeta();_shopIdx=0;setState('shop');}}
function updateShop(dt){if(!Pointer.justDown)return;const n=UPGRADES.length,cardW=Math.round(W*0.19),cardH=Math.round(H*0.32),gap=Math.round(W*0.02);const sy=Math.round(H*0.22),totalW=n*cardW+(n-1)*gap,sx=(W-totalW)/2;for(let i=0;i<n;i++){if(_shopHit(Pointer.x,Pointer.y,sx+i*(cardW+gap),sy,cardW,cardH)){_shopIdx=i;if(buyUpgrade(UPGRADES[i].id)){sfx.play(660,0.12,'sine',0.1);applyUpgrades();}else sfx.play(110,0.06,'sawtooth',0.08);return;}}const btnW=160,btnH=42,btnX=(W-btnW)/2,btnY=sy+cardH+32;if(_shopHit(Pointer.x,Pointer.y,btnX,btnY,btnW,btnH)){sfx.play(440,0.08,'square',0.1);restartGame();}}
function renderShop(){ctx.fillStyle=PALETTE.shopBg;ctx.fillRect(0,0,W,H);ctx.textAlign='center';ctx.fillStyle='#fff';ctx.font='bold 22px system-ui,sans-serif';ctx.fillText('UPGRADE SHOP',W/2,Math.round(H*0.12));ctx.fillStyle='#ffdd00';ctx.font='bold 15px system-ui,sans-serif';ctx.fillText(`🪙 ${_meta.coins} coins`,W/2,Math.round(H*0.19));const n=UPGRADES.length,cardW=Math.round(W*0.19),cardH=Math.round(H*0.32),gap=Math.round(W*0.02);const sy=Math.round(H*0.22),totalW=n*cardW+(n-1)*gap,sx=(W-totalW)/2;for(let i=0;i<n;i++){const u=UPGRADES[i],lv=getUpgradeLevel(u.id),cx=sx+i*(cardW+gap);ctx.fillStyle=_shopIdx===i?PALETTE.shopSel:PALETTE.shopCard;ctx.beginPath();if(ctx.roundRect)ctx.roundRect(cx,sy,cardW,cardH,8);else ctx.rect(cx,sy,cardW,cardH);ctx.fill();ctx.fillStyle='#fff';ctx.font='bold 11px system-ui,sans-serif';ctx.fillText(u.label,cx+cardW/2,sy+22);ctx.fillStyle='#aaa';ctx.font='10px system-ui,sans-serif';ctx.fillText(u.desc,cx+cardW/2,sy+38);for(let d=0;d<u.maxLv;d++){ctx.fillStyle=d<lv?'#ffdd00':'#444';ctx.beginPath();ctx.arc(cx+cardW/2+(d-u.maxLv/2+0.5)*14,sy+cardH-36,5,0,Math.PI*2);ctx.fill();}if(lv<u.maxLv){ctx.fillStyle='#ffdd00';ctx.font='bold 12px system-ui,sans-serif';ctx.fillText(`${u.cost[lv]}🪙`,cx+cardW/2,sy+cardH-14);}else{ctx.fillStyle='#0f0';ctx.font='bold 11px system-ui,sans-serif';ctx.fillText('MAX',cx+cardW/2,sy+cardH-14);}}const btnW=160,btnH=42,btnX=(W-btnW)/2,btnY=sy+cardH+32;ctx.fillStyle='#2a0044';ctx.beginPath();if(ctx.roundRect)ctx.roundRect(btnX,btnY,btnW,btnH,8);else ctx.rect(btnX,btnY,btnW,btnH);ctx.fill();ctx.fillStyle='#fff';ctx.font='bold 16px system-ui,sans-serif';ctx.fillText('PLAY',W/2,btnY+27);ctx.textAlign='left';}

// INIT
loadMeta();
