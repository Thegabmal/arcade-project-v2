function resizeCanvas(){const s=Math.min(window.innerWidth/W,window.innerHeight/H);canvas.style.width=Math.round(W*s)+'px';canvas.style.height=Math.round(H*s)+'px';canvas.width=Math.round(W*DPR);canvas.height=Math.round(H*DPR);ctx.scale(DPR,DPR);}
resizeCanvas(); window.addEventListener('resize',()=>{resizeCanvas();ctx.scale(DPR,DPR);});

const Keys={down:{},pressed:{},released:{}};
window.addEventListener('keydown',e=>{if(!Keys.down[e.code])Keys.pressed[e.code]=true;Keys.down[e.code]=true;if(['Space','ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.code))e.preventDefault();});
window.addEventListener('keyup',e=>{Keys.down[e.code]=false;Keys.released[e.code]=true;});

const Touch={active:false,stickX:0,stickY:0,attackTap:false,startX:0,startY:0,x:0,y:0,justTapped:false};
canvas.addEventListener('touchstart',e=>{e.preventDefault();const r=canvas.getBoundingClientRect();Touch.startX=Touch.x=(e.touches[0].clientX-r.left)*(W/r.width);Touch.startY=Touch.y=(e.touches[0].clientY-r.top)*(H/r.height);Touch.active=true;},{passive:false});
canvas.addEventListener('touchmove',e=>{e.preventDefault();const r=canvas.getBoundingClientRect();Touch.x=(e.touches[0].clientX-r.left)*(W/r.width);Touch.y=(e.touches[0].clientY-r.top)*(H/r.height);const dx=Touch.x-Touch.startX,dy=Touch.y-Touch.startY,len=Math.hypot(dx,dy);Touch.stickX=len>10?dx/Math.max(len,40):0;Touch.stickY=len>10?dy/Math.max(len,40):0;},{passive:false});
canvas.addEventListener('touchend',e=>{e.preventDefault();Touch.active=false;Touch.stickX=0;Touch.stickY=0;Touch.justTapped=true;const r=canvas.getBoundingClientRect();if(e.changedTouches.length){_shopClick.x=(e.changedTouches[0].clientX-r.left)*(W/r.width);_shopClick.y=(e.changedTouches[0].clientY-r.top)*(H/r.height);}},{passive:false});

let _shopClick={x:-1,y:-1};

function keyDown(c){return!!Keys.down[c];}
function keyPressed(c){return!!Keys.pressed[c];}
function anyAction(){return keyPressed('Space')||keyPressed('Enter')||keyPressed('KeyZ')||keyPressed('KeyJ');}
function flushInput(){Keys.pressed={};Keys.released={};attackInput=false;Touch.justTapped=false;}

function createPool(factory,size){const inactive=Array.from({length:size},factory),active=[];return{active,get(fn){const o=inactive.length>0?inactive.pop():factory();o.alive=true;if(fn)fn(o);active.push(o);return o;},update(fn){for(let i=active.length-1;i>=0;i--)if(!fn(active[i])){active[i].alive=false;inactive.push(active.splice(i,1)[0]);}},clear(){while(active.length){active[0].alive=false;inactive.push(active.shift());}}};}

const Particles=createPool(()=>({alive:false,x:0,y:0,vx:0,vy:0,life:0,maxLife:0,size:3,color:'#fff',gravity:0}),200);
function spawnParticles(x,y,count,opts){opts=opts||{};for(let i=0;i<count;i++){const a=opts.angle!==undefined?opts.angle+(Math.random()-0.5)*(opts.spread||Math.PI*2):Math.random()*Math.PI*2;const sp=opts.speed||(50+Math.random()*70);Particles.get(p=>{p.x=x;p.y=y;p.vx=Math.cos(a)*sp;p.vy=Math.sin(a)*sp;p.life=p.maxLife=opts.life||(0.25+Math.random()*0.35);p.size=opts.size||(2+Math.random()*3);p.color=opts.color||'#fff';p.gravity=opts.gravity!==undefined?opts.gravity:0;});}}
function updateParticles(dt){Particles.update(p=>{p.life-=dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=p.gravity*dt;return p.life>0;});}
function drawParticles(){Particles.active.forEach(p=>{ctx.globalAlpha=p.life/p.maxLife;ctx.fillStyle=p.color;ctx.beginPath();ctx.arc(p.x,p.y,p.size*0.5,0,Math.PI*2);ctx.fill();});ctx.globalAlpha=1;}

const Popups=[];
function spawnPopup(x,y,text,color,size){Popups.push({x,y,text,color:color||'#fff',size:size||13,vy:-45,life:1.0});}
function updatePopups(dt){for(let i=Popups.length-1;i>=0;i--){Popups[i].y+=Popups[i].vy*dt;Popups[i].life-=dt;if(Popups[i].life<=0)Popups.splice(i,1);}}
function drawPopups(){Popups.forEach(p=>{ctx.globalAlpha=Math.min(p.life,1);ctx.fillStyle=p.color;ctx.font=`bold ${p.size}px system-ui,sans-serif`;ctx.textAlign='center';ctx.fillText(p.text,p.x,p.y);});ctx.globalAlpha=1;ctx.textAlign='left';}

const Shake={x:0,y:0,mag:0,dur:0};
function triggerShake(m,d){Shake.mag=Math.max(Shake.mag,m);Shake.dur=Math.max(Shake.dur,d);}
function updateShake(dt){if(Shake.dur>0){Shake.dur-=dt;Shake.x=(Math.random()*2-1)*Shake.mag;Shake.y=(Math.random()*2-1)*Shake.mag;if(Shake.dur<=0){Shake.x=0;Shake.y=0;}}}

const sfx={_ctx:null,init(){try{if(!this._ctx)this._ctx=new(window.AudioContext||window.webkitAudioContext)();if(this._ctx.state==='suspended')this._ctx.resume();}catch(e){}},play(f,d,t,v){try{this.init();if(!this._ctx)return;const o=this._ctx.createOscillator(),g=this._ctx.createGain();o.type=t||'square';o.frequency.value=f||440;g.gain.setValueAtTime(v||0.10,this._ctx.currentTime);g.gain.exponentialRampToValueAtTime(0.001,this._ctx.currentTime+(d||0.1));o.connect(g);g.connect(this._ctx.destination);o.start();o.stop(this._ctx.currentTime+(d||0.1));}catch(e){}}};

function lerp(a,b,t){return a+(b-a)*t;}
function clamp(v,mn,mx){return v<mn?mn:v>mx?mx:v;}
function aabb(ax,ay,aw,ah,bx,by,bw,bh){return ax<bx+bw&&ax+aw>bx&&ay<by+bh&&ay+ah>by;}
function randInt(a,b){return a+Math.floor(Math.random()*(b-a+1));}
function randFloat(a,b){return a+Math.random()*(b-a);}
function randChoice(arr){return arr[Math.floor(Math.random()*arr.length)];}
let _hiScore=parseInt(localStorage.getItem('hs_dungeon')||'0');
function saveHiScore(s){if(s>_hiScore){_hiScore=s;localStorage.setItem('hs_dungeon',s);}}
function drawText(t,x,y,c,s,a){ctx.fillStyle=c||'#fff';ctx.font=`bold ${s||13}px system-ui,sans-serif`;ctx.textAlign=a||'left';ctx.fillText(t,x,y);}
function drawBar(x,y,w,h,v,m,fg,bg){ctx.fillStyle=bg||'#333';ctx.fillRect(x,y,w,h);ctx.fillStyle=fg||'#0f0';ctx.fillRect(x,y,Math.round(w*clamp(v/m,0,1)),h);}

const FIXED_DT=1/60;
const MAX_DT=0.1;
let lastTime=0;
let accumulator=0;
function loop(ts){const rd=Math.min((ts-lastTime)/1000,MAX_DT);lastTime=ts;accumulator+=rd;while(accumulator>=FIXED_DT){update(FIXED_DT);accumulator-=FIXED_DT;}renderFrame();requestAnimationFrame(loop);}
function update(dt){updateShake(dt);updateParticles(dt);updatePopups(dt);switch(gameState){case'menu':if(anyAction()||keyPressed('Space')){sfx.play(440,0.08,'square',0.1);startGame();setState('playing');}break;case'playing':updatePlaying(dt);break;case'gameover':updateGameover(dt);break;case'shop':updateShop(dt);break;case'victory':if(anyAction()){startGame();setState('playing');}break;}flushInput();}
function renderFrame(){ctx.save();ctx.translate(Shake.x,Shake.y);switch(gameState){case'menu':renderMenu();break;case'playing':renderPlaying();break;case'gameover':renderPlaying();renderGameoverOverlay();break;case'shop':renderShop();break;case'victory':renderPlaying();renderVictoryOverlay();break;}drawParticles();drawPopups();ctx.restore();}

function buildRooms(){
  rooms.length=0;
  const border=TILE;
  const R=[0,ROOM_W+GAP,2*(ROOM_W+GAP),3*(ROOM_W+GAP),4*(ROOM_W+GAP)];

  function makeRoom(worldX,worldY,w,h,enemyList,lootList,doors,extraWalls){
    const walls=[];
    walls.push({x:worldX,y:worldY,w:w,h:border});
    walls.push({x:worldX,y:worldY+h-border,w:w,h:border});
    walls.push({x:worldX,y:worldY,w:border,h:h});
    walls.push({x:worldX+w-border,y:worldY,w:border,h:h});
    if(extraWalls)extraWalls.forEach(ew=>walls.push({x:worldX+ew.ox,y:worldY+ew.oy,w:ew.w,h:ew.h}));
    return{worldX,worldY,w,h,walls,enemyList,lootList,doors,cleared:false};
  }

  // Room 0 — Entrance Crypt: slimes + skeleton, corner pillars
  rooms.push(makeRoom(R[0],0,ROOM_W,ROOM_H,
    [{type:'slime',x:R[0]+160,y:160},{type:'slime',x:R[0]+540,y:310},{type:'skeleton',x:R[0]+340,y:400}],
    [{type:'gold',x:R[0]+350,y:250,value:15}],
    {N:null,S:null,E:1,W:null},
    [{ox:3*TILE,oy:3*TILE,w:TILE,h:TILE},{ox:14*TILE,oy:3*TILE,w:TILE,h:TILE},
     {ox:3*TILE,oy:10*TILE,w:TILE,h:TILE},{ox:14*TILE,oy:10*TILE,w:TILE,h:TILE}]
  ));

  // Room 1 — Guard Hall: skeletons + orc, 2 central pillars
  rooms.push(makeRoom(R[1],0,ROOM_W,ROOM_H,
    [{type:'skeleton',x:R[1]+190,y:180},{type:'skeleton',x:R[1]+520,y:350},{type:'orc',x:R[1]+360,y:270}],
    [{type:'potion',x:R[1]+300,y:400,value:30}],
    {N:null,S:null,E:2,W:0},
    [{ox:6*TILE,oy:5*TILE,w:TILE,h:2*TILE},{ox:11*TILE,oy:5*TILE,w:TILE,h:2*TILE}]
  ));

  // Room 2 — Mage Sanctum: 2 mages, central altar block
  rooms.push(makeRoom(R[2],0,ROOM_W,ROOM_H,
    [{type:'mage',x:R[2]+200,y:200},{type:'mage',x:R[2]+510,y:340}],
    [{type:'gold',x:R[2]+360,y:460,value:40}],
    {N:null,S:null,E:3,W:1},
    [{ox:8*TILE,oy:6*TILE,w:2*TILE,h:2*TILE}]
  ));

  // Room 3 — Deep Passage: mixed, L-shaped obstacles
  rooms.push(makeRoom(R[3],0,ROOM_W,ROOM_H,
    [{type:'skeleton',x:R[3]+150,y:150},{type:'orc',x:R[3]+420,y:300},{type:'mage',x:R[3]+580,y:430}],
    [{type:'potion',x:R[3]+200,y:450,value:40},{type:'gold',x:R[3]+500,y:180,value:30}],
    {N:null,S:null,E:4,W:2},
    [{ox:6*TILE,oy:3*TILE,w:4*TILE,h:TILE},{ox:6*TILE,oy:3*TILE,w:TILE,h:4*TILE},
     {ox:9*TILE,oy:9*TILE,w:4*TILE,h:TILE},{ox:12*TILE,oy:6*TILE,w:TILE,h:4*TILE}]
  ));

  // Room 4 — Boss Vault: Shadow Boss, open arena with corner pillars
  rooms.push(makeRoom(R[4],0,ROOM_W,ROOM_H,
    [{type:'boss',x:R[4]+360,y:280}],
    [{type:'gold',x:R[4]+280,y:200,value:80},{type:'gold',x:R[4]+440,y:380,value:80}],
    {N:null,S:null,E:null,W:3},
    [{ox:2*TILE,oy:2*TILE,w:2*TILE,h:2*TILE},{ox:14*TILE,oy:2*TILE,w:2*TILE,h:2*TILE},
     {ox:2*TILE,oy:10*TILE,w:2*TILE,h:2*TILE},{ox:14*TILE,oy:10*TILE,w:2*TILE,h:2*TILE}]
  ));
}

// ══════════════════════════════════════════════════════════════════
// TILE COLLISION — DO NOT MODIFY
// ══════════════════════════════════════════════════════════════════
function resolveWalls(ent,roomWalls,dt){
  ent.x+=ent.vx*dt;
  for(const wall of roomWalls){if(aabb(ent.x,ent.y,ent.w,ent.h,wall.x,wall.y,wall.w,wall.h)){if(ent.vx>0)ent.x=wall.x-ent.w;else ent.x=wall.x+wall.w;ent.vx=0;}}
  ent.y+=ent.vy*dt;
  for(const wall of roomWalls){if(aabb(ent.x,ent.y,ent.w,ent.h,wall.x,wall.y,wall.w,wall.h)){if(ent.vy>0)ent.y=wall.y-ent.h;else ent.y=wall.y+wall.h;ent.vy=0;}}
}

// META PROGRESSION
// ══════════════════════════════════════════════════════════════════
const _META_KEY='meta_dungeon';
const UPGRADES=[
  {id:'strength',label:'Strength',   desc:'+25% attack',   maxLv:3,cost:[70,140,230]},
  {id:'agility', label:'Agility',    desc:'-15% cooldown', maxLv:3,cost:[70,140,230]},
  {id:'vitality', label:'Vitality',  desc:'+20 max HP',    maxLv:3,cost:[60,120,200]},
  {id:'gold',    label:'Gold Start', desc:'+15g start',    maxLv:3,cost:[50,100,170]},
];
let _meta={coins:0,upgrades:{}};
let _runCoins=0,_gameoverTimer=1.5,_shopIdx=0;
let _atkMultiplier=1.0,_startGold=0;
function loadMeta(){try{const s=localStorage.getItem(_META_KEY);_meta=s?JSON.parse(s):{coins:0,upgrades:{}};}catch(e){_meta={coins:0,upgrades:{}};}}
function saveMeta(){try{localStorage.setItem(_META_KEY,JSON.stringify(_meta));}catch(e){}}
function getUpgradeLevel(id){return(_meta.upgrades[id]||0);}
function buyUpgrade(id){const u=UPGRADES.find(x=>x.id===id);if(!u)return false;const lv=getUpgradeLevel(id);if(lv>=u.maxLv)return false;const cost=u.cost[lv];if(_meta.coins<cost)return false;_meta.coins-=cost;_meta.upgrades[id]=(lv+1);saveMeta();return true;}
function applyUpgrades(){_atkMultiplier=1+getUpgradeLevel('strength')*0.25;_startGold=getUpgradeLevel('gold')*15;player.maxHp=80+getUpgradeLevel('vitality')*20;player.hp=player.maxHp;player.gold=_startGold;}
function _shopHit(px,py,x,y,w,h){return px>=x&&px<=x+w&&py>=y&&py<=y+h;}
function updateGameover(dt){_gameoverTimer-=dt;if(_gameoverTimer<=0||anyAction()){_meta.coins+=_runCoins;saveMeta();_shopIdx=0;setState('shop');}}
function updateShop(dt){
  const sc=_shopClick;
  if(sc.x<0)return;
  const mx=sc.x,my=sc.y;
  _shopClick={x:-1,y:-1};
  const n=UPGRADES.length,cardW=Math.round(W*0.19),cardH=Math.round(H*0.35),gap=Math.round(W*0.02);
  const sy=Math.round(H*0.20),totalW=n*cardW+(n-1)*gap,sx=(W-totalW)/2;
  for(let i=0;i<n;i++){
    if(_shopHit(mx,my,sx+i*(cardW+gap),sy,cardW,cardH)){
      _shopIdx=i;if(buyUpgrade(UPGRADES[i].id)){sfx.play(660,0.12,'sine',0.1);applyUpgrades();}else sfx.play(110,0.06,'sawtooth',0.08);return;
    }
  }
  const btnW=160,btnH=42,btnX=(W-btnW)/2,btnY=sy+cardH+28;
  if(_shopHit(mx,my,btnX,btnY,btnW,btnH)){sfx.play(440,0.08,'square',0.1);startGame();setState('playing');}
}
function renderShop(){
  ctx.fillStyle=PALETTE.shopBg;ctx.fillRect(0,0,W,H);
  ctx.textAlign='center';
  ctx.shadowBlur=16;ctx.shadowColor='#8844ff';
  ctx.fillStyle='#cc88ff';ctx.font='bold 10px "Press Start 2P",monospace';ctx.fillText('UPGRADE SHOP',W/2,Math.round(H*0.10));
  ctx.shadowBlur=0;
  ctx.fillStyle='#ffdd00';ctx.font='bold 14px system-ui,sans-serif';ctx.fillText(`🪙 ${_meta.coins} coins`,W/2,Math.round(H*0.17));
  const n=UPGRADES.length,cardW=Math.round(W*0.19),cardH=Math.round(H*0.35),gap=Math.round(W*0.02);
  const sy=Math.round(H*0.20),totalW=n*cardW+(n-1)*gap,sx=(W-totalW)/2;
  for(let i=0;i<n;i++){
    const u=UPGRADES[i],lv=getUpgradeLevel(u.id),cx=sx+i*(cardW+gap),maxed=lv>=u.maxLv,canBuy=!maxed&&_meta.coins>=u.cost[lv];
    ctx.fillStyle=_shopIdx===i?PALETTE.shopSel:PALETTE.shopCard;
    ctx.strokeStyle=maxed?'#44ff88':canBuy?'#8844ff':'#222';ctx.lineWidth=_shopIdx===i?2:1;
    ctx.beginPath();ctx.roundRect(cx,sy,cardW,cardH,8);ctx.fill();ctx.stroke();
    ctx.fillStyle='#fff';ctx.font='bold 11px system-ui,sans-serif';ctx.fillText(u.label,cx+cardW/2,sy+22);
    ctx.fillStyle='#aaa';ctx.font='10px system-ui,sans-serif';ctx.fillText(u.desc,cx+cardW/2,sy+40);
    for(let d=0;d<u.maxLv;d++){ctx.fillStyle=d<lv?'#8844ff':'#333';ctx.beginPath();ctx.arc(cx+cardW/2+(d-u.maxLv/2+0.5)*14,sy+cardH-36,5,0,Math.PI*2);ctx.fill();}
    ctx.font='bold 12px system-ui,sans-serif';ctx.fillStyle=maxed?'#44ff88':canBuy?'#ffdd00':'#444';
    ctx.fillText(maxed?'MAXED':`${u.cost[lv]}🪙`,cx+cardW/2,sy+cardH-14);
  }
  const btnW=160,btnH=42,btnX=(W-btnW)/2,btnY=sy+cardH+28;
  ctx.fillStyle='#1a1040';ctx.strokeStyle='#8844ff';ctx.lineWidth=2;ctx.beginPath();ctx.roundRect(btnX,btnY,btnW,btnH,8);ctx.fill();ctx.stroke();
  ctx.fillStyle='#fff';ctx.font='bold 16px system-ui,sans-serif';ctx.fillText('ENTER CRYPT',W/2,btnY+27);
  ctx.textAlign='left';
}

loadMeta();
function startGame(){
  loadMeta();_runCoins=0;_gameoverTimer=1.5;
  buildRooms();currentRoomIdx=0;
  GAME_SCORE=0;mageProj.clear();Popups.length=0;
  player.iframes=0;player.attackTimer=0;player.attackCooldown=0;player.attack.active=false;
  player.gold=0;player.xp=0;player.level=1;player.animTimer=0;
  applyUpgrades();
  loadRoom(0);
}

function loadRoom(idx){
  currentRoomIdx=idx;
  const room=rooms[idx];
  player.x=room.worldX+room.w/2-player.w/2;
  player.y=room.worldY+room.h/2-player.h/2;
  player.vx=0;player.vy=0;
  enemyPool.clear();lootPool.clear();mageProj.clear();
  if(!room.cleared){
    room.enemyList.forEach(eDef=>{
      const def=ENEMY_DEFS[eDef.type]||ENEMY_DEFS.slime;
      enemyPool.get(e=>{
        Object.assign(e,{...def});
        e.x=eDef.x;e.y=eDef.y;e.hp=e.maxHp=def.hp;e.type=eDef.type;
        e.state='idle';e.alertTimer=0;e.attackTimer=0;e.flashTimer=0;e.iframes=0;
        e.knockX=0;e.knockY=0;e.knockTimer=0;e.animTimer=0;
      });
    });
    room.lootList.forEach(l=>{lootPool.get(lo=>{lo.x=l.x;lo.y=l.y;lo.type=l.type;lo.value=l.value||10;lo.bobTimer=Math.random()*Math.PI*2;});});
  }
  cam.x=room.worldX+room.w/2-W/2;
  cam.y=room.worldY+room.h/2-H/2;
}

// ══════════════════════════════════════════════════════════════════
// ENEMY AI
// ══════════════════════════════════════════════════════════════════
function updateEnemy(e,dt,room){
  e.flashTimer=Math.max(0,e.flashTimer-dt);
  e.iframes=Math.max(0,e.iframes-dt);
  e.animTimer+=dt;

  if(e.knockTimer>0){
    e.knockTimer-=dt;
    e.vx=lerp(e.vx,0,dt*8);e.vy=lerp(e.vy,0,dt*8);
    resolveWalls(e,room.walls,dt);
    return;
  }

  const dx=player.x+player.w/2-(e.x+e.w/2);
  const dy=player.y+player.h/2-(e.y+e.h/2);
  const d=Math.sqrt(dx*dx+dy*dy);
  const def=ENEMY_DEFS[e.type]||ENEMY_DEFS.slime;

  switch(e.state){
    case'idle':
      e.vx*=0.85;e.vy*=0.85;
      if(d<def.alertRange){e.state='chase';spawnPopup(e.x+e.w/2,e.y-10,'!','#ff0',16);sfx.play(330,0.06,'sawtooth',0.06);}
      break;
    case'chase':
      if(d>0){e.vx=dx/d*def.speed;e.vy=dy/d*def.speed;}
      if(d<def.attackRange){e.state='attack';e.attackTimer=0;}
      // Mage: strafe instead of approach
      if(e.type==='mage'&&d<120){const perp=Math.atan2(dy,dx)+Math.PI/2;e.vx=Math.cos(perp)*60;e.vy=Math.sin(perp)*60;}
      break;
    case'attack':
      e.vx*=0.6;e.vy*=0.6;
      e.attackTimer+=dt;
      if(e.attackTimer>=def.attackCooldown){
        e.attackTimer=0;
        if(e.type==='mage'){
          // Fireball
          const ang=Math.atan2(dy,dx);
          mageProj.get(p=>{p.x=e.x+e.w/2;p.y=e.y+e.h/2;p.vx=Math.cos(ang)*220;p.vy=Math.sin(ang)*220;p.damage=def.damage;p.r=7;p.life=4;p.color='#aa44ff';});
          sfx.play(660,0.10,'sine',0.08);
          spawnParticles(e.x+e.w/2,e.y+e.h/2,4,{color:'#aa44ff',speed:40,life:0.2});
        } else if(d<def.attackRange+14&&player.iframes<=0){
          player.hp-=def.damage;player.iframes=player.IFRAME_DUR;
          const kx=dx>0?-1:1,ky=dy>0?-1:1;
          player.vx+=kx*200;player.vy+=ky*200;
          triggerShake(5,0.25);sfx.play(150,0.18,'sawtooth',0.14);
          spawnParticles(player.x+player.w/2,player.y+player.h/2,7,{color:'#f44',speed:65});
          if(player.hp<=0){saveHiScore(GAME_SCORE);_runCoins=player.gold;_gameoverTimer=1.5;setState('gameover');}
        }
      }
      if(d>def.attackRange+25)e.state='chase';
      break;
  }
  resolveWalls(e,room.walls,dt);
}

// ══════════════════════════════════════════════════════════════════
// UPDATE
// ══════════════════════════════════════════════════════════════════
function updatePlaying(dt){
  const room=rooms[currentRoomIdx];

  // Input
  let dx=(keyDown('ArrowRight')||keyDown('KeyD')?1:0)-(keyDown('ArrowLeft')||keyDown('KeyA')?1:0);
  let dy=(keyDown('ArrowDown')||keyDown('KeyS')?1:0)-(keyDown('ArrowUp')||keyDown('KeyW')?1:0);
  if(Touch.active){dx=Touch.stickX;dy=Touch.stickY;}
  const mag=Math.hypot(dx,dy)||0;
  if(mag>0){const nx=dx/mag,ny=dy/mag;player.vx=nx*PLAYER_SPEED;player.vy=ny*PLAYER_SPEED;player.facingX=nx;player.facingY=ny;}
  else{player.vx*=0.7;player.vy*=0.7;if(Math.abs(player.vx)<2)player.vx=0;if(Math.abs(player.vy)<2)player.vy=0;}

  player.iframes=Math.max(0,player.iframes-dt);
  if(player.iframes>0){player.vx*=0.82;player.vy*=0.82;}

  resolveWalls(player,room.walls,dt);
  player.animTimer+=dt;

  // Attack
  const cdMult=1-getUpgradeLevel('agility')*0.15;
  player.attackCooldown=Math.max(0,player.attackCooldown-dt);
  player.attackTimer=Math.max(0,player.attackTimer-dt);
  player.attack.active=player.attackTimer>0;

  const wantAttack=keyPressed('Space')||keyPressed('KeyZ')||keyPressed('KeyJ')||attackInput;
  if(wantAttack&&player.attackCooldown<=0){
    player.attackTimer=ATTACK_DUR;player.attackCooldown=ATTACK_COOLDOWN*cdMult;
    const fx=player.facingX||1,fy=player.facingY||0;
    const hw=ATTACK_RANGE+10,hh=TILE+4;
    player.attack.x=player.x+player.w/2+fx*ATTACK_RANGE/2-hw/2;
    player.attack.y=player.y+player.h/2+fy*ATTACK_RANGE/2-hh/2;
    player.attack.w=hw;player.attack.h=hh;
    player.attack.damage=Math.round((ATTACK_DAMAGE+(player.level-1)*5)*_atkMultiplier);
    sfx.play(280,0.07,'sawtooth',0.09);
    spawnParticles(player.x+player.w/2+fx*28,player.y+player.h/2+fy*28,3,{color:PALETTE.player,speed:40,life:0.15,spread:0.8,angle:Math.atan2(fy,fx)});
  }

  // Attack hits enemies
  if(player.attack.active){
    enemyPool.active.forEach(e=>{
      if(!e.alive||e.iframes>0)return;
      if(aabb(player.attack.x,player.attack.y,player.attack.w,player.attack.h,e.x,e.y,e.w,e.h)){
        e.hp-=player.attack.damage;e.flashTimer=0.10;e.iframes=0.28;
        const ang=Math.atan2(e.y-player.y,e.x-player.x);
        e.vx=Math.cos(ang)*200;e.vy=Math.sin(ang)*200;e.knockTimer=0.18;
        spawnParticles(e.x+e.w/2,e.y+e.h/2,6,{color:e.color,speed:60,life:0.25});
        spawnPopup(e.x+e.w/2,e.y-8,`-${player.attack.damage}`,'#ff8800',12);
        sfx.play(220,0.07,'sawtooth',0.09);
        if(e.hp<=0){
          GAME_SCORE+=e.points;player.xp+=e.points/2;
          spawnParticles(e.x+e.w/2,e.y+e.h/2,14,{color:e.color,speed:85,life:0.4,gravity:80});
          if(Math.random()<0.32)lootPool.get(l=>{l.x=e.x;l.y=e.y;l.type='gold';l.value=randInt(6,22);l.bobTimer=0;});
          if(Math.random()<0.10)lootPool.get(l=>{l.x=e.x;l.y=e.y;l.type='potion';l.value=30;l.bobTimer=0;});
          e.alive=false;
          sfx.play(440,0.10,'square',0.10);
          if(enemyPool.active.filter(x=>x.alive).length===0&&!room.cleared){
            room.cleared=true;sfx.play(660,0.20,'sine',0.12);
            spawnPopup(player.x+player.w/2,player.y-35,'ROOM CLEAR!','#ff0',15);
          }
        }
      }
    });
  }

  // Mage fireballs
  mageProj.update(p=>{
    p.life-=dt;if(p.life<=0)return false;
    p.x+=p.vx*dt;p.y+=p.vy*dt;
    // Wall collision
    for(const wall of room.walls){
      if(aabb(p.x-p.r,p.y-p.r,p.r*2,p.r*2,wall.x,wall.y,wall.w,wall.h)){
        spawnParticles(p.x,p.y,5,{color:p.color,speed:45,life:0.2});
        return false;
      }
    }
    // Player collision
    if(player.iframes<=0&&aabb(p.x-p.r,p.y-p.r,p.r*2,p.r*2,player.x,player.y,player.w,player.h)){
      player.hp-=p.damage;player.iframes=player.IFRAME_DUR;
      player.vx+=(player.x-p.x)*2;player.vy+=(player.y-p.y)*2;
      triggerShake(3,0.2);sfx.play(200,0.12,'sawtooth',0.12);
      spawnParticles(player.x+player.w/2,player.y+player.h/2,8,{color:'#aa44ff',speed:70});
      if(player.hp<=0){saveHiScore(GAME_SCORE);_runCoins=player.gold;_gameoverTimer=1.5;setState('gameover');}
      return false;
    }
    return p.x>room.worldX-20&&p.x<room.worldX+room.w+20&&p.y>room.worldY-20&&p.y<room.worldY+room.h+20;
  });

  enemyPool.update(e=>{updateEnemy(e,dt,room);return e.alive;});

  // Loot
  lootPool.update(l=>{
    l.bobTimer+=dt;
    if(aabb(player.x,player.y,player.w,player.h,l.x,l.y,l.w,l.h)){
      if(l.type==='gold'){player.gold+=l.value;GAME_SCORE+=l.value*5;spawnPopup(l.x,l.y,`+${l.value}g`,'#ffdd00',12);}
      if(l.type==='potion'){player.hp=Math.min(player.maxHp,player.hp+l.value);spawnPopup(l.x,l.y,`+${l.value}HP`,'#ff66aa',13);}
      sfx.play(880,0.07,'sine',0.09);
      return false;
    }
    return true;
  });

  // XP & leveling
  const xpNeeded=100*player.level;
  if(player.xp>=xpNeeded){player.xp-=xpNeeded;player.level++;player.maxHp+=20;player.hp=Math.min(player.hp+30,player.maxHp);spawnPopup(player.x+player.w/2,player.y-44,'LEVEL UP!','#ff0',16);sfx.play(880,0.22,'sine',0.12);}

  // Door transitions
  if(room.cleared){
    const m=TILE*0.5;
    if(room.doors.E!==null&&player.x+player.w>room.worldX+room.w-TILE+m){loadRoom(room.doors.E);sfx.play(440,0.10,'square',0.09);}
    if(room.doors.W!==null&&player.x<room.worldX+TILE-m){loadRoom(room.doors.W);sfx.play(440,0.10,'square',0.09);}
    if(room.doors.S!==null&&player.y+player.h>room.worldY+room.h-TILE+m){loadRoom(room.doors.S);sfx.play(440,0.10,'square',0.09);}
    if(room.doors.N!==null&&player.y<room.worldY+TILE-m){loadRoom(room.doors.N);sfx.play(440,0.10,'square',0.09);}
  }

  // Victory
  if(rooms[rooms.length-1].cleared&&currentRoomIdx===rooms.length-1){saveHiScore(GAME_SCORE);setState('victory');}

  // Camera
  const targetX=player.x+player.w/2-W/2,targetY=player.y+player.h/2-H/2;
  const minX=room.worldX,maxX=room.worldX+room.w-W,minY=room.worldY,maxY=room.worldY+room.h-H;
  cam.x=lerp(cam.x,clamp(targetX,minX,Math.max(minX,maxX)),cam.SMOOTH*dt);
  cam.y=lerp(cam.y,clamp(targetY,minY,Math.max(minY,maxY)),cam.SMOOTH*dt);
}

// ══════════════════════════════════════════════════════════════════
// RENDER
// ══════════════════════════════════════════════════════════════════
function drawEnemy(e){
  ctx.globalAlpha=e.flashTimer>0?0.35:1.0;
  const ec=e.flashTimer>0?'#fff':e.color;
  const cx=e.x+e.w/2,cy=e.y+e.h/2;
  switch(e.type){
    case'slime':{
      // Green blob: wide ellipse, bounce animation
      const bounce=Math.abs(Math.sin(e.animTimer*4))*3;
      ctx.fillStyle=ec;ctx.shadowBlur=6;ctx.shadowColor=e.color;
      ctx.beginPath();ctx.ellipse(cx,cy+bounce*0.5,e.w/2+2,e.h/2-bounce,0,0,Math.PI*2);ctx.fill();
      ctx.shadowBlur=0;
      // Eyes
      ctx.fillStyle='#000';ctx.beginPath();ctx.arc(cx-5,cy-2,3,0,Math.PI*2);ctx.arc(cx+5,cy-2,3,0,Math.PI*2);ctx.fill();
      ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(cx-4,cy-3,1.5,0,Math.PI*2);ctx.arc(cx+6,cy-3,1.5,0,Math.PI*2);ctx.fill();
      break;}
    case'skeleton':{
      ctx.fillStyle=ec;
      // Body oval
      ctx.beginPath();ctx.ellipse(cx,cy+4,7,11,0,0,Math.PI*2);ctx.fill();
      // Head skull
      ctx.beginPath();ctx.arc(cx,cy-12,9,0,Math.PI*2);ctx.fill();
      // Eye sockets
      ctx.fillStyle=e.flashTimer>0?'#fff':'#000';
      ctx.beginPath();ctx.ellipse(cx-3.5,cy-12,2.5,3,0,0,Math.PI*2);ctx.ellipse(cx+3.5,cy-12,2.5,3,0,0,Math.PI*2);ctx.fill();
      // Arms (stick lines)
      ctx.strokeStyle=ec;ctx.lineWidth=2.5;
      ctx.beginPath();ctx.moveTo(cx-7,cy-2);ctx.lineTo(cx-13,cy+5);ctx.moveTo(cx+7,cy-2);ctx.lineTo(cx+13,cy+5);ctx.stroke();
      break;}
    case'orc':{
      ctx.fillStyle=ec;ctx.shadowBlur=4;ctx.shadowColor=e.color;
      // Stocky body
      ctx.fillRect(cx-e.w/2,cy-e.h/2+4,e.w,e.h-4);
      // Head
      ctx.beginPath();ctx.arc(cx,cy-e.h/2+2,12,0,Math.PI*2);ctx.fill();
      ctx.shadowBlur=0;
      // Tusks
      ctx.fillStyle='#ffeeaa';
      ctx.beginPath();ctx.moveTo(cx-7,cy-e.h/2+10);ctx.lineTo(cx-4,cy-e.h/2+18);ctx.lineTo(cx-1,cy-e.h/2+10);ctx.closePath();ctx.fill();
      ctx.beginPath();ctx.moveTo(cx+7,cy-e.h/2+10);ctx.lineTo(cx+4,cy-e.h/2+18);ctx.lineTo(cx+1,cy-e.h/2+10);ctx.closePath();ctx.fill();
      // Eyes
      ctx.fillStyle='#ff0';ctx.beginPath();ctx.arc(cx-5,cy-e.h/2,3,0,Math.PI*2);ctx.arc(cx+5,cy-e.h/2,3,0,Math.PI*2);ctx.fill();
      break;}
    case'mage':{
      const bob=Math.sin(e.animTimer*2)*3;
      // Robe
      ctx.fillStyle=ec;ctx.shadowBlur=10;ctx.shadowColor='#aa44ff';
      ctx.beginPath();ctx.moveTo(cx,cy+e.h/2);ctx.lineTo(cx-e.w/2,cy+2+bob);ctx.lineTo(cx-e.w/3,cy-e.h/2+bob);ctx.lineTo(cx+e.w/3,cy-e.h/2+bob);ctx.lineTo(cx+e.w/2,cy+2+bob);ctx.closePath();ctx.fill();
      ctx.shadowBlur=0;
      // Hood
      ctx.beginPath();ctx.arc(cx,cy-e.h/2-3+bob,10,0,Math.PI*2);ctx.fill();
      // Glowing eyes
      ctx.fillStyle='#ffdd00';ctx.shadowBlur=6;ctx.shadowColor='#ffdd00';
      ctx.beginPath();ctx.arc(cx-3,cy-e.h/2-1+bob,2.5,0,Math.PI*2);ctx.arc(cx+3,cy-e.h/2-1+bob,2.5,0,Math.PI*2);ctx.fill();
      ctx.shadowBlur=0;
      // Staff
      ctx.strokeStyle='#6622aa';ctx.lineWidth=2;
      ctx.beginPath();ctx.moveTo(cx+e.w/2-2,cy+e.h/2);ctx.lineTo(cx+e.w/2+4,cy-e.h/2-8+bob);ctx.stroke();
      ctx.fillStyle='#cc88ff';ctx.shadowBlur=8;ctx.shadowColor='#cc88ff';
      ctx.beginPath();ctx.arc(cx+e.w/2+4,cy-e.h/2-8+bob,4,0,Math.PI*2);ctx.fill();
      ctx.shadowBlur=0;
      break;}
    case'boss':{
      const t=Date.now()*0.001;
      ctx.shadowBlur=20;ctx.shadowColor=e.color;
      // Core
      ctx.fillStyle=ec;ctx.beginPath();ctx.arc(cx,cy,e.w/2,0,Math.PI*2);ctx.fill();
      // Orbiting shadow orbs
      for(let i=0;i<4;i++){
        const ang=t*1.5+i*Math.PI/2;
        const ox=Math.cos(ang)*24,oy=Math.sin(ang)*24;
        ctx.fillStyle='#660011';ctx.beginPath();ctx.arc(cx+ox,cy+oy,7,0,Math.PI*2);ctx.fill();
      }
      ctx.shadowBlur=0;
      // Glowing face
      ctx.fillStyle='#ff8800';ctx.shadowBlur=10;ctx.shadowColor='#ff8800';
      ctx.beginPath();ctx.ellipse(cx-10,cy-6,5,4,0,0,Math.PI*2);ctx.ellipse(cx+10,cy-6,5,4,0,0,Math.PI*2);ctx.fill();
      ctx.shadowBlur=0;
      break;}
  }
  ctx.globalAlpha=1;ctx.shadowBlur=0;
  drawBar(e.x,e.y-10,e.w,5,e.hp,e.maxHp,'#22ff66','#300');
  if(e.state==='idle'){ctx.globalAlpha=0.4;ctx.fillStyle='#aaa';ctx.font='8px monospace';ctx.textAlign='center';ctx.fillText('zzz',cx,e.y-14);ctx.textAlign='left';ctx.globalAlpha=1;}
}

function drawFloor(room){
  // Stone tile pattern
  const ts=TILE;
  for(let r=1;r<ROOM_H/ts-1;r++)for(let c=1;c<ROOM_W/ts-1;c++){
    const x=room.worldX+c*ts,y=room.worldY+r*ts;
    ctx.fillStyle=(r+c)%2===0?PALETTE.floor:PALETTE.floor2;
    ctx.fillRect(x,y,ts,ts);
    ctx.strokeStyle='rgba(0,0,0,0.25)';ctx.lineWidth=0.5;ctx.strokeRect(x,y,ts,ts);
  }
  // Torches at room corners
  const torchPos=[
    {x:room.worldX+TILE*2+12,y:room.worldY+TILE+10},
    {x:room.worldX+room.w-TILE*2-12,y:room.worldY+TILE+10},
    {x:room.worldX+TILE*2+12,y:room.worldY+room.h-TILE-10},
    {x:room.worldX+room.w-TILE*2-12,y:room.worldY+room.h-TILE-10},
  ];
  const flicker=0.7+0.3*Math.sin(Date.now()*0.01);
  torchPos.forEach(tp=>{
    // Flame glow
    ctx.globalAlpha=0.15*flicker;
    const grd=ctx.createRadialGradient(tp.x,tp.y,0,tp.x,tp.y,40);
    grd.addColorStop(0,'#ff8800');grd.addColorStop(1,'transparent');
    ctx.fillStyle=grd;ctx.fillRect(tp.x-40,tp.y-40,80,80);
    ctx.globalAlpha=1;
    // Torch stick
    ctx.fillStyle='#6b3c1a';ctx.fillRect(tp.x-2,tp.y,4,10);
    // Flame
    ctx.fillStyle=`rgba(255,${100+Math.round(80*flicker)},0,0.9)`;
    ctx.beginPath();ctx.ellipse(tp.x,tp.y-3,4,6,0,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='rgba(255,240,100,0.8)';
    ctx.beginPath();ctx.ellipse(tp.x,tp.y-5,2,3,0,0,Math.PI*2);ctx.fill();
  });

  // Boss room: ritual circle
  if(currentRoomIdx===rooms.length-1){
    ctx.strokeStyle='rgba(150,0,0,0.25)';ctx.lineWidth=2;
    ctx.beginPath();ctx.arc(room.worldX+room.w/2,room.worldY+room.h/2,80,0,Math.PI*2);ctx.stroke();
    for(let i=0;i<5;i++){
      const a=i*2*Math.PI/5;
      ctx.beginPath();ctx.arc(room.worldX+room.w/2+Math.cos(a)*60,room.worldY+room.h/2+Math.sin(a)*60,5,0,Math.PI*2);ctx.fillStyle='rgba(120,0,0,0.3)';ctx.fill();
    }
  }
}

function renderPlaying(){
  ctx.fillStyle=PALETTE.bg;ctx.fillRect(0,0,W,H);
  ctx.save();ctx.translate(-Math.round(cam.x),-Math.round(cam.y));

  const room=rooms[currentRoomIdx];
  drawFloor(room);

  // Walls
  room.walls.forEach(wall=>{
    ctx.fillStyle=PALETTE.wall;ctx.fillRect(wall.x,wall.y,wall.w,wall.h);
    ctx.fillStyle=PALETTE.wallEdge;ctx.fillRect(wall.x,wall.y,wall.w,4);
    ctx.fillStyle='rgba(0,0,0,0.3)';ctx.fillRect(wall.x,wall.y+wall.h-4,wall.w,4);
  });

  // Doors
  if(room.cleared){
    const dd=(dx,dy,dw,dh)=>{
      ctx.fillStyle=PALETTE.doorOpen;ctx.fillRect(dx,dy,dw,dh);
      ctx.fillStyle='rgba(255,150,0,0.3)';ctx.fillRect(dx,dy,dw,dh);
      ctx.fillStyle='rgba(255,200,100,0.6)';ctx.font='10px monospace';ctx.textAlign='center';ctx.fillText('→',dx+dw/2,dy+dh/2+4);ctx.textAlign='left';
    };
    if(room.doors.E!==null)dd(room.worldX+room.w-TILE,room.worldY+room.h/2-TILE*0.75,TILE,TILE*1.5);
    if(room.doors.W!==null)dd(room.worldX,room.worldY+room.h/2-TILE*0.75,TILE,TILE*1.5);
    if(room.doors.S!==null)dd(room.worldX+room.w/2-TILE*0.75,room.worldY+room.h-TILE,TILE*1.5,TILE);
    if(room.doors.N!==null)dd(room.worldX+room.w/2-TILE*0.75,room.worldY,TILE*1.5,TILE);
  }

  // Loot
  lootPool.active.forEach(l=>{
    const bob=Math.sin(l.bobTimer*3)*3;
    ctx.shadowBlur=8;ctx.shadowColor=l.type==='gold'?PALETTE.loot:PALETTE.potion;
    ctx.fillStyle=l.type==='gold'?PALETTE.loot:PALETTE.potion;
    ctx.beginPath();ctx.arc(l.x+l.w/2,l.y+l.h/2+bob,l.w/2,0,Math.PI*2);ctx.fill();
    ctx.shadowBlur=0;
    ctx.fillStyle='rgba(0,0,0,0.7)';ctx.font='bold 8px monospace';ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.fillText(l.type==='gold'?'g':'♥',l.x+l.w/2,l.y+l.h/2+bob);ctx.textBaseline='alphabetic';ctx.textAlign='left';
  });

  // Mage fireballs
  mageProj.active.forEach(p=>{
    ctx.shadowBlur=12;ctx.shadowColor=p.color;
    ctx.fillStyle=p.color;ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='#ffccff';ctx.beginPath();ctx.arc(p.x-1,p.y-1,p.r*0.45,0,Math.PI*2);ctx.fill();
    ctx.shadowBlur=0;
  });

  // Enemies
  enemyPool.active.forEach(drawEnemy);

  // Attack arc
  if(player.attack.active){
    const fx=player.facingX||1,fy=player.facingY||0;
    const baseAngle=Math.atan2(fy,fx);
    const progress=1-player.attackTimer/ATTACK_DUR;
    ctx.strokeStyle=`rgba(0,200,255,${0.7-progress*0.5})`;ctx.lineWidth=4;
    ctx.beginPath();ctx.arc(player.x+player.w/2,player.y+player.h/2,ATTACK_RANGE+6,baseAngle-0.8,baseAngle+0.8);ctx.stroke();
    ctx.strokeStyle=`rgba(180,240,255,${0.4-progress*0.3})`;ctx.lineWidth=10;
    ctx.beginPath();ctx.arc(player.x+player.w/2,player.y+player.h/2,ATTACK_RANGE,baseAngle-0.6,baseAngle+0.6);ctx.stroke();
  }

  // Player (knight)
  const blink=player.iframes>0&&Math.floor(player.iframes/0.07)%2===0;
  if(!blink){
    ctx.globalAlpha=player.iframes>0?0.5:1.0;
    const px=player.x,py=player.y,pw=player.w,ph=player.h;
    // Armor body
    ctx.fillStyle=PALETTE.player;ctx.shadowBlur=8;ctx.shadowColor=PALETTE.player;
    ctx.beginPath();ctx.roundRect(px+2,py+8,pw-4,ph-8,4);ctx.fill();
    ctx.shadowBlur=0;
    // Helmet
    ctx.fillStyle='#0099cc';
    ctx.beginPath();ctx.roundRect(px+3,py,pw-6,14,6);ctx.fill();
    // Visor slit
    ctx.fillStyle='rgba(255,255,150,0.8)';ctx.fillRect(px+5,py+5,pw-10,3);
    // Sword (in facing direction)
    const fx=player.facingX||1,fy=player.facingY||0;
    const sx=px+pw/2+fx*12,sy=py+ph/2+fy*12;
    ctx.strokeStyle='#cccccc';ctx.lineWidth=3;
    ctx.beginPath();ctx.moveTo(sx-fx*8,sy-fy*8);ctx.lineTo(sx+fx*18,sy+fy*18);ctx.stroke();
    ctx.fillStyle='#885500';ctx.fillRect(sx-fy*5,sy-fx*5,fy*10+2,fx*10+2);
    ctx.globalAlpha=1;
  }

  ctx.restore();

  // HUD
  drawText(`SCORE: ${GAME_SCORE}`,10,20,PALETTE.ui,13);
  drawText(`LV ${player.level}`,W/2,20,'#cc88ff',12,'center');
  drawText(`BEST: ${_hiScore}`,W-10,20,'#555',11,'right');
  drawBar(10,H-30,160,10,player.hp,player.maxHp,'#ff4466','#300');
  drawText('HP',174,H-21,'#666',9);
  drawBar(10,H-15,160,6,player.xp,100*player.level,PALETTE.xp,'#133');
  drawText('XP',174,H-10,PALETTE.xp,8);
  drawText(`⚜ ${player.gold}g`,W-10,H-18,PALETTE.loot,13,'right');
  if(player.attackCooldown>0){drawBar(10,H-44,90,4,ATTACK_COOLDOWN-player.attackCooldown,ATTACK_COOLDOWN,'#00ccff','#133');}
  const roomLabel=currentRoomIdx===rooms.length-1?'⚠ BOSS VAULT':`Room ${currentRoomIdx+1} / ${rooms.length}`;
  drawText(roomLabel,W/2,H-10,'#664',10,'center');
}

function renderMenu(){
  const now=Date.now()*0.001;
  ctx.fillStyle=PALETTE.bg;ctx.fillRect(0,0,W,H);
  // Dark stone floor preview
  for(let r=0;r<H/TILE+1;r++)for(let c=0;c<W/TILE+1;c++){
    ctx.fillStyle=(r+c)%2===0?'#0e0a18':'#110d1e';ctx.fillRect(c*TILE,r*TILE,TILE,TILE);
  }
  // Torch glows
  for(let i=0;i<4;i++){
    const x=[80,W-80,80,W-80][i],y=[80,80,H-80,H-80][i];
    const flicker=0.5+0.5*Math.sin(now*3.7+i*1.3);
    ctx.globalAlpha=0.15*flicker;
    const grd=ctx.createRadialGradient(x,y,0,x,y,100);
    grd.addColorStop(0,'#ff6600');grd.addColorStop(1,'transparent');
    ctx.fillStyle=grd;ctx.fillRect(x-100,y-100,200,200);
    ctx.globalAlpha=1;
    ctx.fillStyle='#ff6600';ctx.beginPath();ctx.ellipse(x,y,4,7,0,0,Math.PI*2);ctx.fill();
  }
  ctx.textAlign='center';
  ctx.shadowBlur=24;ctx.shadowColor='#8844ff';
  ctx.fillStyle='#cc88ff';ctx.font='bold 10px "Press Start 2P",monospace';ctx.fillText(GAME_TITLE,W/2,H*0.28);
  ctx.shadowBlur=0;
  ctx.fillStyle='#9988bb';ctx.font='12px system-ui,sans-serif';
  ctx.fillText('WASD / Arrows — Move',W/2,H*0.42);
  ctx.fillText('SPACE / Z — Attack',W/2,H*0.48);
  ctx.fillText('Clear 5 rooms — defeat the Shadow Boss!',W/2,H*0.55);
  if(_meta.coins>0){ctx.fillStyle='#ffdd44';ctx.font='bold 13px system-ui,sans-serif';ctx.fillText(`🪙 ${_meta.coins} coins`,W/2,H*0.62);}
  const pulse=0.65+0.35*Math.sin(now*2.5);ctx.globalAlpha=pulse;
  ctx.fillStyle='#fff';ctx.font='bold 16px system-ui,sans-serif';ctx.fillText('PRESS SPACE TO ENTER',W/2,H*0.73);ctx.globalAlpha=1;
  ctx.fillStyle='#33224a';ctx.font='12px system-ui,sans-serif';ctx.fillText(`BEST: ${_hiScore}`,W/2,H*0.82);
  ctx.textAlign='left';
}
function renderGameoverOverlay(){ctx.fillStyle='rgba(0,0,0,0.78)';ctx.fillRect(0,0,W,H);ctx.textAlign='center';ctx.shadowBlur=16;ctx.shadowColor='#cc0022';ctx.fillStyle='#ff2244';ctx.font='bold 36px system-ui,sans-serif';ctx.fillText('YOU PERISHED',W/2,H*0.35);ctx.shadowBlur=0;ctx.fillStyle='#fff';ctx.font='bold 18px system-ui,sans-serif';ctx.fillText(`SCORE: ${GAME_SCORE}`,W/2,H*0.45);if(_runCoins>0){ctx.fillStyle='#ffdd44';ctx.font='bold 14px system-ui,sans-serif';ctx.fillText(`🪙 +${_runCoins} coins`,W/2,H*0.54);}ctx.fillStyle='#666';ctx.font='12px system-ui,sans-serif';ctx.fillText('Waiting for shop...',W/2,H*0.64);ctx.textAlign='left';}
function renderVictoryOverlay(){ctx.fillStyle='rgba(0,0,0,0.68)';ctx.fillRect(0,0,W,H);ctx.textAlign='center';ctx.shadowBlur=20;ctx.shadowColor='#ffdd44';ctx.fillStyle='#ffdd44';ctx.font='bold 26px system-ui,sans-serif';ctx.fillText('CRYPT CONQUERED!',W/2,H*0.35);ctx.shadowBlur=0;ctx.fillStyle='#fff';ctx.font='bold 18px system-ui,sans-serif';ctx.fillText(`SCORE: ${GAME_SCORE}`,W/2,H*0.46);ctx.fillStyle='#aaa';ctx.font='13px system-ui,sans-serif';ctx.fillText('SPACE to play again',W/2,H*0.58);ctx.textAlign='left';}

// ══════════════════════════════════════════════════════════════════
// START
// ══════════════════════════════════════════════════════════════════
startGame();
requestAnimationFrame(t=>{lastTime=t;requestAnimationFrame(loop);});
</script>
