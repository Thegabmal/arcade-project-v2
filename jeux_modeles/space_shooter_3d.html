<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>NEBULA BREACH — Space Shooter 3D</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #000; overflow: hidden; font-family: system-ui, sans-serif; }
  #c { display: block; width: 100vw; height: 100vh; }

  #hud {
    position: fixed; inset: 0; pointer-events: none;
    color: #fff; font-family: system-ui, sans-serif;
  }
  #score-disp {
    position: absolute; top: 18px; left: 50%; transform: translateX(-50%);
    font-size: 22px; font-weight: 700; color: #66aaff; text-shadow: 0 0 12px #66aaff88; letter-spacing: 2px;
  }
  #wave-disp {
    position: absolute; top: 48px; left: 50%; transform: translateX(-50%);
    font-size: 13px; color: #aaa; letter-spacing: 3px; text-transform: uppercase;
  }
  #hp-wrap { position: absolute; bottom: 50px; left: 24px; }
  #hp-label { font-size: 11px; color: #888; letter-spacing: 2px; margin-bottom: 4px; }
  #hp-bg { width: 160px; height: 12px; background: #222; border-radius: 6px; overflow: hidden; }
  #hp-fill { height: 100%; background: linear-gradient(90deg,#e74c3c,#ff8888); border-radius: 6px; transition: width 0.2s; }
  #shield-wrap { position: absolute; bottom: 80px; left: 24px; }
  #shield-label { font-size: 11px; color: #888; letter-spacing: 2px; margin-bottom: 4px; }
  #shield-bg { width: 160px; height: 10px; background: #222; border-radius: 5px; overflow: hidden; }
  #shield-fill { height: 100%; background: linear-gradient(90deg,#3366ff,#88aaff); border-radius: 5px; transition: width 0.3s; }
  #ammo-disp { position: absolute; bottom: 50px; right: 24px; font-size: 20px; color: #ffd700; font-weight: 700; }
  #ammo-label { font-size: 11px; color: #888; letter-spacing: 2px; margin-bottom: 4px; }
  #coins-disp { position: absolute; top: 18px; right: 24px; font-size: 15px; color: #ffd700; }
  #hit-flash { position: absolute; inset: 0; background: rgba(231,76,60,0); pointer-events: none; transition: background 0.07s; }
  #power-banner {
    position: absolute; top: 80px; left: 50%; transform: translateX(-50%);
    font-size: 14px; color: #66aaff; letter-spacing: 2px; opacity: 0; transition: opacity 0.4s;
  }

  /* Targeting reticle */
  #reticle {
    position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%);
    width: 40px; height: 40px; pointer-events: none;
    border: 2px solid rgba(100,180,255,0.7); border-radius: 50%;
  }
  #reticle::before, #reticle::after {
    content:''; position:absolute; background:rgba(100,180,255,0.7);
  }
  #reticle::before { width:1px; height:14px; left:19px; top:-8px; }
  #reticle::after  { width:14px; height:1px; top:19px; left:-8px; }

  #overlay {
    position: fixed; inset: 0;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    background: rgba(0,0,0,0.9); color: #fff;
  }
  #overlay h1 {
    font-size: 50px; font-weight: 900; letter-spacing: 8px;
    color: #66aaff; text-shadow: 0 0 30px #66aaff88;
    font-family: 'Impact', system-ui; margin-bottom: 6px;
  }
  #overlay .sub { font-size: 13px; color: #555; letter-spacing: 4px; margin-bottom: 40px; }
  .menu-btn {
    padding: 13px 38px; margin: 5px;
    font-size: 14px; font-weight: 700; letter-spacing: 2px;
    border: 2px solid #66aaff; background: transparent; color: #66aaff;
    cursor: pointer; text-transform: uppercase; transition: all 0.15s; font-family: system-ui;
  }
  .menu-btn:hover { background: #66aaff; color: #000; }
  #gameover-score { font-size: 30px; color: #66aaff; margin: 18px 0; }

  #shop-overlay {
    position: fixed; inset: 0; background: rgba(0,0,0,0.93);
    display: none; flex-direction: column; align-items: center; justify-content: center;
    color: #fff; font-family: system-ui;
  }
  #shop-overlay h2 { font-size: 30px; color: #66aaff; letter-spacing: 4px; margin-bottom: 6px; }
  #shop-coins-disp { font-size: 15px; color: #ffd700; margin-bottom: 26px; }
  #shop-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; max-width: 540px; width: 100%; }
  .shop-card { border: 2px solid #333; padding: 16px; cursor: pointer; transition: all 0.15s; background: #080a12; }
  .shop-card:hover { border-color: #66aaff; background: #0a0f20; }
  .shop-card h3 { font-size: 13px; color: #66aaff; margin-bottom: 6px; }
  .shop-card p  { font-size: 11px; color: #666; margin-bottom: 10px; line-height: 1.4; }
  .shop-card .cost { font-size: 12px; color: #ffd700; font-weight: 700; }
  .shop-card .lvl  { font-size: 11px; color: #444; float: right; }
  #shop-skip { margin-top: 18px; font-size: 13px; color: #444; cursor: pointer; letter-spacing: 2px; }
  #shop-skip:hover { color: #aaa; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hud" style="display:none;">
  <div id="hit-flash"></div>
  <div id="reticle"></div>
  <div id="score-disp">0</div>
  <div id="wave-disp">SECTOR 1</div>
  <div id="coins-disp">🪙 0</div>
  <div id="hp-wrap">
    <div id="hp-label">HULL</div>
    <div id="hp-bg"><div id="hp-fill" style="width:100%"></div></div>
  </div>
  <div id="shield-wrap">
    <div id="shield-label">SHIELD</div>
    <div id="shield-bg"><div id="shield-fill" style="width:100%"></div></div>
  </div>
  <div id="ammo-disp">
    <div id="ammo-label">MISSILES</div>
    <div id="ammo-count">∞</div>
  </div>
  <div id="power-banner"></div>
</div>

<div id="overlay">
  <h1>NEBULA BREACH</h1>
  <div class="sub">SPACE SHOOTER 3D</div>
  <button class="menu-btn" id="btn-play" onclick="startGame()">LAUNCH</button>
  <div style="font-size:11px;color:#444;margin-top:14px;">MOUSE — AIM &nbsp;|&nbsp; LMB / SPACE — FIRE &nbsp;|&nbsp; WASD — STRAFE</div>
</div>

<div id="shop-overlay">
  <h2>COMMAND DECK</h2>
  <div id="shop-coins-disp">🪙 0</div>
  <div id="shop-grid"></div>
  <div id="shop-skip">[ SKIP → ]</div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r160/three.min.js"></script>
<script>
// ─── META ─────────────────────────────────────────────────────────────────────
const META_KEY = 'meta_nebula_breach';
const UPGRADES = [
  { id:'plasma_core',  name:'Plasma Core',   desc:'+30% weapon damage per level',    cost:35, maxLv:3, effect:'damage' },
  { id:'shield_cell',  name:'Shield Cell',   desc:'+25 shield capacity per level',   cost:40, maxLv:3, effect:'shield' },
  { id:'ion_drive',    name:'Ion Drive',     desc:'+20% ship speed per level',       cost:30, maxLv:3, effect:'speed' },
  { id:'auto_repair',  name:'Auto Repair',   desc:'+15 max hull per level',          cost:45, maxLv:2, effect:'hull' },
];
let meta={coins:0,upgrades:{}};
function loadMeta(){try{const s=localStorage.getItem(META_KEY);if(s)meta=JSON.parse(s);}catch(e){}
  UPGRADES.forEach(u=>{if(!meta.upgrades[u.id])meta.upgrades[u.id]=0;});}
function saveMeta(){try{localStorage.setItem(META_KEY,JSON.stringify(meta));}catch(e){}}
function buyUpgrade(id){
  const u=UPGRADES.find(u=>u.id===id);if(!u)return;
  const lv=meta.upgrades[id];if(lv>=u.maxLv)return;
  const cost=u.cost*(lv+1);if(meta.coins<cost)return;
  meta.coins-=cost;meta.upgrades[id]++;saveMeta();
}
function applyUpgrades(){
  const lv=id=>meta.upgrades[id]||0;
  ship.dmg=1+lv('plasma_core')*0.3;
  ship.maxShield=50+lv('shield_cell')*25;
  ship.speed=8+lv('ion_drive')*1.6;
  ship.maxHp=80+lv('auto_repair')*15;
}
loadMeta();

// ─── THREE.JS SETUP ───────────────────────────────────────────────────────────
const canvas=document.getElementById('c');
const renderer=new THREE.WebGLRenderer({canvas,antialias:true});
renderer.setPixelRatio(Math.min(window.devicePixelRatio,2));
renderer.setSize(window.innerWidth,window.innerHeight);

const scene=new THREE.Scene();
scene.background=new THREE.Color(0x010610);

const camera=new THREE.PerspectiveCamera(65,window.innerWidth/window.innerHeight,0.1,500);
const clock=new THREE.Clock();

window.addEventListener('resize',()=>{
  camera.aspect=window.innerWidth/window.innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth,window.innerHeight);
});

// ─── LIGHTING ─────────────────────────────────────────────────────────────────
scene.add(new THREE.AmbientLight(0x112244,0.8));
const sunLight=new THREE.DirectionalLight(0x6699ff,1.2);
sunLight.position.set(0,1,0.5); scene.add(sunLight);
scene.add(new THREE.PointLight(0xff6600,2,60));

// ─── STAR FIELD ───────────────────────────────────────────────────────────────
(()=>{
  const geo=new THREE.BufferGeometry();
  const pos=[];
  for(let i=0;i<3000;i++){
    pos.push((Math.random()-0.5)*400,(Math.random()-0.5)*400,(Math.random()-0.5)*400);
  }
  geo.setAttribute('position',new THREE.Float32BufferAttribute(pos,3));
  scene.add(new THREE.Points(geo,new THREE.PointsMaterial({color:0xffffff,size:0.4})));
})();

// ─── NEBULA (decorative) ──────────────────────────────────────────────────────
[0x3366ff,0xff6600,0x66ff88].forEach((col,i)=>{
  const geo=new THREE.SphereGeometry(30+i*10,8,8);
  const mat=new THREE.MeshBasicMaterial({color:col,transparent:true,opacity:0.03,wireframe:true});
  const mesh=new THREE.Mesh(geo,mat);
  mesh.position.set(i*30-30,i*10-10,-120); scene.add(mesh);
});

// ─── SHIP ─────────────────────────────────────────────────────────────────────
const ship = {
  mesh: null,
  pos: new THREE.Vector3(0,0,0),
  vel: new THREE.Vector3(),
  hp:80, maxHp:80, shield:50, maxShield:50,
  score:0, wave:1, dmg:1, speed:8,
  dead:false,
};

function buildShip(){
  const grp=new THREE.Group();
  const mat=new THREE.MeshLambertMaterial({color:0x4488ff});
  const matThrust=new THREE.MeshLambertMaterial({color:0xff8800,emissive:0x442200});
  // Fuselage
  const body=new THREE.Mesh(new THREE.ConeGeometry(0.4,2.4,6),mat);
  body.rotation.x=Math.PI/2; grp.add(body);
  // Wings
  const wingGeo=new THREE.BoxGeometry(3,0.1,1.2);
  const wingL=new THREE.Mesh(wingGeo,mat); wingL.position.set(0,0,0.3); grp.add(wingL);
  // Engine glow
  const glow=new THREE.Mesh(new THREE.SphereGeometry(0.25,8,8),matThrust);
  glow.position.set(0,0,1.2); grp.add(glow);
  scene.add(grp);
  ship.mesh=grp;
}
buildShip();

// ─── BULLETS & ENEMIES ────────────────────────────────────────────────────────
const bullets=[], eBullets=[], enemies=[], particles=[];
const bulletMat=new THREE.MeshBasicMaterial({color:0x66aaff});
const eBulletMat=new THREE.MeshBasicMaterial({color:0xff4444});
const enemyMats={
  fighter:new THREE.MeshLambertMaterial({color:0xcc2244}),
  cruiser:new THREE.MeshLambertMaterial({color:0x884400}),
  bomber:new THREE.MeshLambertMaterial({color:0x228844}),
  boss:new THREE.MeshLambertMaterial({color:0x882288}),
};
const ENEMY_DEFS={
  fighter:{hp:3,speed:5,  reward:15,scale:1,  sInt:2.5,bSpeed:14},
  cruiser:{hp:8,speed:2.5,reward:30,scale:1.5,sInt:3.5,bSpeed:10},
  bomber: {hp:5,speed:3.5,reward:20,scale:1.2,sInt:4,  bSpeed:12},
  boss:   {hp:40,speed:1.5,reward:150,scale:2.5,sInt:1.2,bSpeed:12},
};

function spawnEnemy(type){
  const def=ENEMY_DEFS[type];
  const grp=new THREE.Group();
  const mat=enemyMats[type];
  const body=new THREE.Mesh(new THREE.ConeGeometry(0.5*def.scale,1.8*def.scale,6),mat);
  body.rotation.x=-Math.PI/2; grp.add(body);
  const wing=new THREE.Mesh(new THREE.BoxGeometry(2.5*def.scale,0.1,0.8*def.scale),mat);
  grp.add(wing);
  // Spawn ahead (negative Z) and off-screen
  const sx=(Math.random()-0.5)*30, sy=(Math.random()-0.5)*20;
  grp.position.set(sx,sy,-80);
  grp.rotation.x=Math.PI;
  scene.add(grp);
  enemies.push({type,grp,hp:def.hp,maxHp:def.hp,speed:def.speed,reward:def.reward,
    sTimer:Math.random()*def.sInt,sInt:def.sInt,bSpeed:def.bSpeed,scale:def.scale,dead:false});
}

function fireBullet(fromPlayer,pos,dir){
  const geo=new THREE.SphereGeometry(fromPlayer?0.12:0.15,4,4);
  const mesh=new THREE.Mesh(geo,fromPlayer?bulletMat:eBulletMat);
  mesh.position.copy(pos);
  scene.add(mesh);
  (fromPlayer?bullets:eBullets).push({mesh,dir:dir.clone().normalize(),life:3,speed:fromPlayer?30:12});
}

function spawnParticles(pos,col){
  for(let i=0;i<8;i++){
    const m=new THREE.Mesh(new THREE.SphereGeometry(0.08,4,4),
      new THREE.MeshBasicMaterial({color:col}));
    m.position.copy(pos);
    const d=new THREE.Vector3((Math.random()-0.5),(Math.random()-0.5),(Math.random()-0.5)).normalize().multiplyScalar(4+Math.random()*4);
    scene.add(m);
    particles.push({mesh:m,vel:d,life:0.8});
  }
}

// ─── MOUSE AIM ────────────────────────────────────────────────────────────────
let mouseX=0,mouseY=0;
window.addEventListener('mousemove',e=>{
  mouseX=(e.clientX/window.innerWidth-0.5)*2;
  mouseY=-(e.clientY/window.innerHeight-0.5)*2;
});
let shooting=false;
window.addEventListener('mousedown',e=>{if(e.button===0)shooting=true;});
window.addEventListener('mouseup',  e=>{if(e.button===0)shooting=false;});

const keys2={};
window.addEventListener('keydown',e=>{ keys2[e.code]=true;
  if(e.code==='Space'){ shooting=true; e.preventDefault(); }});
window.addEventListener('keyup',  e=>{ keys2[e.code]=false;
  if(e.code==='Space') shooting=false; });

// ─── WAVE SYSTEM ──────────────────────────────────────────────────────────────
let waveActive=false, waveEnemiesLeft=0, waveCooldown=2;
function startWave(w){
  waveActive=true;
  const hasBoss=w%5===0;
  if(hasBoss){ spawnEnemy('boss'); waveEnemiesLeft=1; }
  else {
    const n=4+w*2;
    for(let i=0;i<n;i++){
      const t=w<2?'fighter':(['fighter','cruiser','bomber'][Math.floor(Math.random()*3)]);
      spawnEnemy(t);
    }
    waveEnemiesLeft=n;
  }
}

// ─── STATE ────────────────────────────────────────────────────────────────────
let gameState='menu';
let shootTimer=0;
let shieldRegen=0;

function startGame(){
  enemies.forEach(e=>scene.remove(e.grp)); enemies.length=0;
  bullets.forEach(b=>scene.remove(b.mesh)); bullets.length=0;
  eBullets.forEach(b=>scene.remove(b.mesh)); eBullets.length=0;
  particles.forEach(p=>scene.remove(p.mesh)); particles.length=0;
  applyUpgrades();
  ship.hp=ship.maxHp; ship.shield=ship.maxShield;
  ship.score=0; ship.wave=1; ship.dead=false;
  ship.pos.set(0,0,0); ship.vel.set(0,0,0);
  waveActive=false; waveCooldown=2;
  document.getElementById('overlay').style.display='none';
  document.getElementById('hud').style.display='block';
  gameState='playing'; updateHUD();
}

function triggerGameOver(){
  ship.dead=true; gameState='gameover';
  const coins=Math.floor(ship.score/12);
  meta.coins+=coins; saveMeta();
  document.getElementById('hud').style.display='none';
  const ov=document.getElementById('overlay');
  ov.innerHTML=`
    <h1>NEBULA BREACH</h1><div class="sub">SHIP DESTROYED</div>
    <div id="gameover-score">${ship.score.toLocaleString()}</div>
    <div style="font-size:13px;color:#555;margin-bottom:22px;">SECTOR ${ship.wave} — +${coins} 🪙</div>
    <button class="menu-btn" id="btn-shop">UPGRADE</button>
    <button class="menu-btn" id="btn-retry">RETRY</button>
  `;
  ov.style.display='flex';
  document.getElementById('btn-shop').onclick=()=>{ov.style.display='none';openShop();};
  document.getElementById('btn-retry').onclick=startGame;
}

function openShop(){ gameState='shop'; renderShop(); document.getElementById('shop-overlay').style.display='flex'; }
function closeShop(){ document.getElementById('shop-overlay').style.display='none'; startGame(); }
function renderShop(){
  document.getElementById('shop-coins-disp').textContent=`🪙 ${meta.coins}`;
  const grid=document.getElementById('shop-grid'); grid.innerHTML='';
  UPGRADES.forEach(u=>{
    const lv=meta.upgrades[u.id]||0, cost=u.cost*(lv+1), maxed=lv>=u.maxLv;
    const card=document.createElement('div'); card.className='shop-card';
    card.innerHTML=`<h3>${u.name}<span class="lvl">LV${lv}/${u.maxLv}</span></h3><p>${u.desc}</p><span class="cost">${maxed?'MAXED':'🪙 '+cost}</span>`;
    if(!maxed&&meta.coins>=cost) card.onclick=()=>{buyUpgrade(u.id);renderShop();};
    else card.style.opacity=maxed?'0.4':'0.6';
    grid.appendChild(card);
  });
  document.getElementById('shop-skip').onclick=closeShop;
}

function flashHit(){
  const el=document.getElementById('hit-flash');
  el.style.background='rgba(231,76,60,0.4)';
  setTimeout(()=>el.style.background='rgba(231,76,60,0)',100);
}
function updateHUD(){
  document.getElementById('score-disp').textContent=ship.score.toLocaleString();
  document.getElementById('wave-disp').textContent=`SECTOR ${ship.wave}`;
  document.getElementById('coins-disp').textContent=`🪙 ${meta.coins}`;
  document.getElementById('hp-fill').style.width=(ship.hp/ship.maxHp*100)+'%';
  document.getElementById('shield-fill').style.width=(ship.shield/ship.maxShield*100)+'%';
}

// ─── UPDATE ───────────────────────────────────────────────────────────────────
function update(dt){
  if(gameState!=='playing') return;

  // Shield regen
  shieldRegen+=dt;
  if(shieldRegen>3 && ship.shield<ship.maxShield){
    ship.shield=Math.min(ship.maxShield, ship.shield+10*dt);
  }

  // Ship movement (mouse aim + WASD strafe)
  const targetX=mouseX*14, targetY=mouseY*10;
  ship.pos.x+=(targetX-ship.pos.x)*5*dt;
  ship.pos.y+=(targetY-ship.pos.y)*5*dt;
  if(keys2['KeyA']||keys2['ArrowLeft'])  ship.pos.x-=ship.speed*dt;
  if(keys2['KeyD']||keys2['ArrowRight']) ship.pos.x+=ship.speed*dt;
  if(keys2['KeyW']||keys2['ArrowUp'])    ship.pos.y+=ship.speed*dt;
  if(keys2['KeyS']||keys2['ArrowDown'])  ship.pos.y-=ship.speed*dt;
  ship.pos.x=Math.max(-15,Math.min(15,ship.pos.x));
  ship.pos.y=Math.max(-10,Math.min(10,ship.pos.y));

  // Banking
  ship.mesh.position.set(ship.pos.x,ship.pos.y,0);
  ship.mesh.rotation.z=-(ship.pos.x-ship.mesh.position.x)*0.05;
  ship.mesh.rotation.x=0.1;

  // Shoot
  shootTimer=Math.max(0,shootTimer-dt);
  if(shooting && shootTimer<=0){
    const dir=new THREE.Vector3(0,0,-1);
    fireBullet(true, new THREE.Vector3(ship.pos.x-0.8,ship.pos.y,-1), dir);
    fireBullet(true, new THREE.Vector3(ship.pos.x+0.8,ship.pos.y,-1), dir);
    shootTimer=0.15;
  }

  // Update player bullets
  for(let i=bullets.length-1;i>=0;i--){
    const b=bullets[i]; b.mesh.position.addScaledVector(b.dir,b.speed*dt); b.life-=dt;
    if(b.life<=0){ scene.remove(b.mesh); bullets.splice(i,1); continue; }
    let hit=false;
    for(let j=enemies.length-1;j>=0;j--){
      const e=enemies[j]; if(e.dead) continue;
      if(b.mesh.position.distanceTo(e.grp.position)<1.2*e.scale){
        e.hp-=ship.dmg; hit=true;
        if(e.hp<=0){ e.dead=true; spawnParticles(e.grp.position.clone(),enemyMats[e.type].color.getHex());
          scene.remove(e.grp); enemies.splice(j,1);
          ship.score+=e.reward; waveEnemiesLeft=Math.max(0,waveEnemiesLeft-1);
        }
        break;
      }
    }
    if(hit){ scene.remove(b.mesh); bullets.splice(i,1); }
  }

  // Update enemy bullets
  for(let i=eBullets.length-1;i>=0;i--){
    const b=eBullets[i]; b.mesh.position.addScaledVector(b.dir,b.speed*dt); b.life-=dt;
    if(b.life<=0){ scene.remove(b.mesh); eBullets.splice(i,1); continue; }
    if(b.mesh.position.z>2){ scene.remove(b.mesh); eBullets.splice(i,1); continue; }
    if(b.mesh.position.distanceTo(ship.mesh.position)<0.8){
      scene.remove(b.mesh); eBullets.splice(i,1);
      shieldRegen=0;
      if(ship.shield>0){ ship.shield=Math.max(0,ship.shield-12); }
      else { ship.hp-=15; flashHit(); }
      if(ship.hp<=0){ ship.hp=0; triggerGameOver(); return; }
    }
  }

  // Update enemies
  enemies.forEach(e=>{
    if(e.dead) return;
    e.grp.position.z+=e.speed*dt;
    // Slight tracking
    const dx=ship.pos.x-e.grp.position.x;
    e.grp.position.x+=dx*0.5*dt;
    if(e.grp.position.z>5){
      // passed player — damage
      scene.remove(e.grp); const idx=enemies.indexOf(e); if(idx>=0) enemies.splice(idx,1);
      ship.hp-=20; flashHit(); waveEnemiesLeft=Math.max(0,waveEnemiesLeft-1);
      if(ship.hp<=0){ ship.hp=0; triggerGameOver(); return; }
    }
    // Enemy shoot
    e.sTimer-=dt;
    if(e.sTimer<=0){
      e.sTimer=e.sInt;
      const dir=new THREE.Vector3(ship.pos.x-e.grp.position.x,ship.pos.y-e.grp.position.y,1).normalize();
      dir.x+=(Math.random()-0.5)*0.2; dir.y+=(Math.random()-0.5)*0.2;
      fireBullet(false,e.grp.position.clone().add(new THREE.Vector3(0,0,0.5)),dir);
    }
  });

  // Particles
  for(let i=particles.length-1;i>=0;i--){
    const p=particles[i]; p.mesh.position.addScaledVector(p.vel,dt); p.life-=dt;
    p.mesh.material.opacity=p.life/0.8;
    if(p.life<=0){ scene.remove(p.mesh); particles.splice(i,1); }
  }

  // Wave
  if(!waveActive){ waveCooldown-=dt; if(waveCooldown<=0) startWave(ship.wave); }
  else if(waveEnemiesLeft===0 && enemies.length===0){
    waveActive=false; ship.wave++; waveCooldown=3;
    ship.shield=Math.min(ship.maxShield,ship.shield+30);
  }

  // Camera follows ship loosely
  camera.position.set(ship.pos.x*0.1, ship.pos.y*0.1+1, 12);
  camera.lookAt(ship.pos.x*0.05, ship.pos.y*0.05, 0);

  updateHUD();
}

function animate(){
  requestAnimationFrame(animate);
  const dt=Math.min(clock.getDelta(),0.05);
  update(dt);
  renderer.render(scene,camera);
}
camera.position.set(0,2,14);
animate();
document.getElementById('btn-play').onclick=startGame;
</script>
</body>
