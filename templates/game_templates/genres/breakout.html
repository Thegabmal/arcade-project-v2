const canvas = document.getElementById('gameCanvas');

let W = 480, H = 640;
function resizeCanvas() {
  const vw = window.innerWidth, vh = window.innerHeight;
  const scale = Math.min(vw / W, vh / H);
  canvas.style.width  = Math.round(W * scale) + 'px';
  canvas.style.height = Math.round(H * scale) + 'px';
  canvas.width  = Math.round(W * DPR);
  canvas.height = Math.round(H * DPR);
  ctx.scale(DPR, DPR);
}

window.addEventListener('resize', () => { resizeCanvas(); ctx.scale(DPR, DPR); });

let gameState = 'menu'; // menu | playing | levelclear | gameover
function setState(s) { gameState = s; }

const Keys = { down: {}, pressed: {}, released: {} };
window.addEventListener('keydown', e => {
  if (!Keys.down[e.code]) Keys.pressed[e.code] = true;
  Keys.down[e.code] = true;
  if (['Space','ArrowLeft','ArrowRight'].includes(e.code)) e.preventDefault();
});
window.addEventListener('keyup', e => { Keys.down[e.code] = false; Keys.released[e.code] = true; });
const Touch = { justTapped: false, x: W/2, y: 0, active: false, prevX: W/2, moveX: 0 };
canvas.addEventListener('touchstart', e => {
  e.preventDefault();
  const r = canvas.getBoundingClientRect();
  Touch.x = (e.touches[0].clientX - r.left) * (W / r.width);
  Touch.y = (e.touches[0].clientY - r.top) * (H / r.height);
  Touch.prevX = Touch.x; Touch.justTapped = true; Touch.active = true;
}, { passive: false });
canvas.addEventListener('touchmove', e => {
  e.preventDefault();
  const r = canvas.getBoundingClientRect();
  const nx = (e.touches[0].clientX - r.left) * (W / r.width);
  Touch.moveX = nx - Touch.prevX; Touch.prevX = nx; Touch.x = nx;
}, { passive: false });
canvas.addEventListener('touchend', e => { e.preventDefault(); Touch.active = false; Touch.moveX = 0; }, { passive: false });
const Mouse = { x: W/2, clicked: false, moved: false, prevX: W/2 };
canvas.addEventListener('mousemove', e => {
  const r = canvas.getBoundingClientRect();
  Mouse.x = (e.clientX - r.left) * (W / r.width); Mouse.moved = true;
});
canvas.addEventListener('click', () => Mouse.clicked = true);

function keyDown(c) { return !!Keys.down[c]; }
function keyPressed(c) { return !!Keys.pressed[c]; }
function anyAction() { return Mouse.clicked || Touch.justTapped || keyPressed('Space') || keyPressed('Enter'); }
function flushInput() { Keys.pressed = {}; Keys.released = {}; Touch.justTapped = false; Mouse.clicked = false; Mouse.moved = false; }

function createPool(factory, size) {
  const inactive = Array.from({ length: size }, factory), active = [];
  return {
    active,
    get(fn) { const o = inactive.length > 0 ? inactive.pop() : factory(); o.alive = true; if (fn) fn(o); active.push(o); return o; },
    update(fn) { for (let i = active.length-1; i >= 0; i--) if (!fn(active[i])) { active[i].alive = false; inactive.push(active.splice(i,1)[0]); } },
    clear() { while (active.length) { active[0].alive = false; inactive.push(active.shift()); } }
  };
}

const Particles = createPool(() => ({alive:false,x:0,y:0,vx:0,vy:0,life:0,maxLife:0,size:3,color:'#fff',gravity:0}), 200);
function spawnParticles(x,y,count,opts) {
  opts = opts || {};
  for (let i = 0; i < count; i++) {
    const a = opts.angle !== undefined ? opts.angle + (Math.random()-0.5)*(opts.spread||Math.PI*2) : Math.random()*Math.PI*2;
    const sp = opts.speed || (30 + Math.random()*60);
    Particles.get(p => { p.x=x; p.y=y; p.vx=Math.cos(a)*sp; p.vy=Math.sin(a)*sp; p.life=p.maxLife=opts.life||(0.3+Math.random()*0.4); p.size=opts.size||(2+Math.random()*3); p.color=opts.color||'#fff'; p.gravity=opts.gravity!==undefined?opts.gravity:0; });
  }
}
function updateParticles(dt) { Particles.update(p => { p.life-=dt; p.x+=p.vx*dt; p.y+=p.vy*dt; p.vy+=p.gravity*dt; return p.life > 0; }); }
function drawParticles() { Particles.active.forEach(p => { ctx.globalAlpha=p.life/p.maxLife; ctx.fillStyle=p.color; ctx.beginPath(); ctx.arc(p.x,p.y,p.size*0.5,0,Math.PI*2); ctx.fill(); }); ctx.globalAlpha=1; }

const Popups = [];
function spawnPopup(x,y,text,color,size) { Popups.push({x,y,text,color:color||'#fff',size:size||14,vy:-45,life:1.0}); }
function updatePopups(dt) { for (let i=Popups.length-1;i>=0;i--) { Popups[i].y+=Popups[i].vy*dt; Popups[i].life-=dt; if(Popups[i].life<=0) Popups.splice(i,1); } }
function drawPopups() { Popups.forEach(p => { ctx.globalAlpha=Math.min(p.life,1); ctx.fillStyle=p.color; ctx.font=`bold ${p.size}px monospace`; ctx.textAlign='center'; ctx.fillText(p.text,p.x,p.y); }); ctx.globalAlpha=1; ctx.textAlign='left'; }

const Shake = {x:0,y:0,mag:0,dur:0};
function triggerShake(m,d) { Shake.mag=Math.max(Shake.mag,m); Shake.dur=Math.max(Shake.dur,d); }
function updateShake(dt) { if (Shake.dur>0) { Shake.dur-=dt; Shake.x=(Math.random()*2-1)*Shake.mag; Shake.y=(Math.random()*2-1)*Shake.mag; if(Shake.dur<=0){Shake.x=0;Shake.y=0;} } }

const sfx = { _ctx:null, init() { try { if(!this._ctx) this._ctx=new(window.AudioContext||window.webkitAudioContext)(); if(this._ctx.state==='suspended') this._ctx.resume(); } catch(e) {} },
  play(f,d,t,v) { try { this.init(); if(!this._ctx) return; const o=this._ctx.createOscillator(),g=this._ctx.createGain(); o.type=t||'square'; o.frequency.value=f||440; g.gain.setValueAtTime(v||0.12,this._ctx.currentTime); g.gain.exponentialRampToValueAtTime(0.001,this._ctx.currentTime+(d||0.1)); o.connect(g); g.connect(this._ctx.destination); o.start(); o.stop(this._ctx.currentTime+(d||0.1)); } catch(e) {} }
};

function lerp(a,b,t) { return a+(b-a)*t; }
function clamp(v,min,max) { return v<min?min:v>max?max:v; }
function randFloat(a,b) { return a+Math.random()*(b-a); }
function randChoice(arr) { return arr[Math.floor(Math.random()*arr.length)]; }
let _hiScore = parseInt(localStorage.getItem('hs_breakout')||'0');

function drawText(t,x,y,c,s,a) { ctx.fillStyle=c||'#fff'; ctx.font=`bold ${s||14}px monospace`; ctx.textAlign=a||'left'; ctx.fillText(t,x,y); }
function drawBar(x,y,w,h,v,m,fg,bg) { ctx.fillStyle=bg||'#333'; ctx.fillRect(x,y,w,h); ctx.fillStyle=fg||'#0f0'; ctx.fillRect(x,y,Math.round(w*clamp(v/m,0,1)),h); }

const FIXED_DT = 1/60, MAX_DT = 0.1;
let lastTime = 0, accumulator = 0;
function loop(ts) { const rd=Math.min((ts-lastTime)/1000,MAX_DT); lastTime=ts; accumulator+=rd; while(accumulator>=FIXED_DT){update(FIXED_DT);accumulator-=FIXED_DT;} renderFrame(); requestAnimationFrame(loop); }
function update(dt) {
  updateShake(dt); updateParticles(dt); updatePopups(dt);
  switch(gameState) {
    case 'menu':      updateMenu(dt); break;
    case 'playing':   updatePlaying(dt); break;
    case 'levelclear':if(anyAction()){nextLevel();} break;
    case 'gameover':  updateGameover(dt); break;
    case 'shop':      updateShop(dt); break;
  }
  flushInput();
}
function renderFrame() {
  ctx.save(); ctx.translate(Shake.x,Shake.y);
  switch(gameState) {
    case 'menu':      renderMenu(); break;
    case 'playing':   renderPlaying(); break;
    case 'levelclear':renderPlaying(); renderLevelClearOverlay(); break;
    case 'gameover':  renderPlaying(); renderGameoverOverlay(); break;
    case 'shop':      renderShop(); break;
  }
  drawParticles(); drawPopups(); ctx.restore();
}
function updateMenu(dt) { if(anyAction()){sfx.play(440,0.08,'square',0.1);startGame();setState('playing');} }
function renderGameoverOverlay() { ctx.fillStyle='rgba(0,0,0,0.75)'; ctx.fillRect(0,0,W,H); ctx.textAlign='center'; ctx.fillStyle='#f44'; ctx.font='bold 34px system-ui,sans-serif'; ctx.fillText('GAME OVER',W/2,H*0.38); ctx.fillStyle='#fff'; ctx.font='bold 20px system-ui,sans-serif'; ctx.fillText(`SCORE: ${GAME_SCORE}`,W/2,H*0.50); ctx.fillStyle='#ff0'; ctx.font='bold 16px system-ui,sans-serif'; ctx.fillText(`BEST: ${_hiScore}`,W/2,H*0.58); if(_runCoins>0){ctx.fillStyle='#ffdd00';ctx.font='bold 14px system-ui,sans-serif';ctx.fillText(`🪙 ${_runCoins} coins earned`,W/2,H*0.66);} ctx.fillStyle='#aaa'; ctx.font='13px system-ui,sans-serif'; ctx.fillText('Waiting for shop...',W/2,H*0.74); ctx.textAlign='left'; }
function renderLevelClearOverlay() { ctx.fillStyle='rgba(0,0,0,0.65)'; ctx.fillRect(0,0,W,H); drawText(`LEVEL ${level-1} CLEAR!`,W/2,H*0.38,'#ff0',26,'center'); drawText(`SCORE: ${GAME_SCORE}`,W/2,H*0.50,'#fff',18,'center'); drawText('SPACE / TAP to continue',W/2,H*0.62,'#aaa',13,'center'); }

function buildBricksFromMap(map) {
  bricks = [];
  map.forEach((row, r) => {
    row.forEach((cell, c) => {
      if (!cell) return;
      const type = cell === 2 ? 'hard' : cell === 3 ? 'steel' : cell === 4 ? 'powerup' : 'normal';
      const hp   = type === 'hard' ? 2 : type === 'steel' ? Infinity : 1;
      bricks.push({
        x: BRICK_OFFSET_X + c * (BRICK_W + BRICK_GAP),
        y: BRICK_OFFSET_Y + r * (BRICK_H + BRICK_GAP),
        w: BRICK_W, h: BRICK_H,
        hp, maxHp: type === 'steel' ? 1 : hp, type, alive: true, flashTimer: 0,
        color: PALETTE.brickRows[r % PALETTE.brickRows.length],
        points: type === 'hard' ? 25 : 10,
      });
    });
  });
}

function buildBricksProc(n) {
  // Procedural generation when no hand-crafted map is available
  bricks = [];
  const rows = Math.min(3 + Math.floor(n * 0.7), 9);
  for (let r = 0; r < rows; r++) {
    for (let c = 0; c < BRICK_COLS; c++) {
      const rng = Math.random();
      const type = n >= 4 && rng < 0.06 ? 'steel'
                 : n >= 2 && rng < 0.18 ? 'hard'
                 : rng < 0.08 ? 'powerup' : 'normal';
      const hp = type === 'hard' ? 2 : type === 'steel' ? Infinity : 1;
      bricks.push({
        x: BRICK_OFFSET_X + c * (BRICK_W + BRICK_GAP),
        y: BRICK_OFFSET_Y + r * (BRICK_H + BRICK_GAP),
        w: BRICK_W, h: BRICK_H,
        hp, maxHp: type === 'steel' ? 1 : hp, type, alive: true, flashTimer: 0,
        color: PALETTE.brickRows[r % PALETTE.brickRows.length],
        points: type === 'hard' ? 25 : 10,
      });
    }
  }
}

// ══════════════════════════════════════════════════════════════════
// BALL–BRICK COLLISION — DO NOT MODIFY
// Correct face-detection via smallest-overlap axis (AABB + circle).
// Prevents tunneling via substep loop in updatePlaying().
// ══════════════════════════════════════════════════════════════════
function ballVsBricks(ball) {
  for (const b of bricks) {
    if (!b.alive) continue;
    const nearX = clamp(ball.x, b.x, b.x + b.w);
    const nearY = clamp(ball.y, b.y, b.y + b.h);
    const dx = ball.x - nearX, dy = ball.y - nearY;
    if (dx*dx + dy*dy >= ball.r*ball.r) continue;

    // Determine which face was hit
    const ol = (ball.x + ball.r) - b.x;
    const or2 = (b.x + b.w) - (ball.x - ball.r);
    const ot = (ball.y + ball.r) - b.y;
    const ob = (b.y + b.h) - (ball.y - ball.r);
    if (Math.min(ol, or2) < Math.min(ot, ob)) {
      ball.vx = ol < or2 ? -Math.abs(ball.vx) : Math.abs(ball.vx);
    } else {
      ball.vy = ot < ob ? -Math.abs(ball.vy) : Math.abs(ball.vy);
    }

    b.flashTimer = 0.08;
    if (b.type !== 'steel') {
      b.hp--;
      if (b.hp <= 0) {
        b.alive = false;
        GAME_SCORE += b.points * level;
        spawnParticles(b.x+b.w/2, b.y+b.h/2, 10, {color:b.color, speed:55, life:0.35, gravity:80});
        spawnPopup(b.x+b.w/2, b.y, `+${b.points*level}`, b.color, 11);
        if (b.type === 'powerup' || Math.random() < 0.06) {
          powerupPool.get(p => {
            p.x = b.x+b.w/2-12; p.y = b.y;
            p.type = randChoice(POWERUP_TYPES);
          });
        }
        sfx.play(660, 0.05, 'square', 0.07);
      } else {
        sfx.play(440, 0.04, 'square', 0.06);
      }
    } else {
      sfx.play(180, 0.05, 'sawtooth', 0.06);
    }

    // Speed up on each hit
    ball.speed = Math.min(ball.speed + BALL_SPEED_INC, BALL_SPEED_MAX);
    const len = Math.hypot(ball.vx, ball.vy);
    if (len > 0) { ball.vx = ball.vx/len*ball.speed; ball.vy = ball.vy/len*ball.speed; }
    return; // one brick per substep — prevents double-hit corner cases
  }
}

// ── Meta-progression runtime ──────────────────────────────────────────────────
let _runCoins      = 0;
let _gameoverTimer = 0;
let _shopIdx       = 0;
let _scoreMultiplier = 1.0;

const UPGRADES = [
  {id:'multiball', name:'Multi-Ball',   desc:'Start each run with 2 balls',   maxLevel:1, costs:[80],        icon:'🎱'},
  {id:'paddle',    name:'Wide Paddle',  desc:'Paddle is wider each run',       maxLevel:3, costs:[25,55,110], icon:'🏓'},
  {id:'speed',     name:'Ball Speed',   desc:'Ball moves faster',              maxLevel:2, costs:[40,90],     icon:'⚡'},
  {id:'life',      name:'Extra Life',   desc:'Start with one more life',       maxLevel:2, costs:[60,130],    icon:'❤️'},
];

const _META_KEY = 'meta_breakout';
let _meta = { coins:0, upgrades:{} };
function loadMeta(){try{_meta=JSON.parse(localStorage.getItem(_META_KEY))||{coins:0,upgrades:{}};}catch(e){_meta={coins:0,upgrades:{}};} if(!_meta.upgrades)_meta.upgrades={};}
function saveMeta(){try{localStorage.setItem(_META_KEY,JSON.stringify(_meta));}catch(e){}}
function addRunCoins(n){_meta.coins+=Math.floor(n);saveMeta();}
function getUpgradeLevel(id){return _meta.upgrades[id]||0;}
function buyUpgrade(id){const up=UPGRADES.find(u=>u.id===id);if(!up)return false;const lvl=getUpgradeLevel(id);if(lvl>=up.maxLevel)return false;const cost=up.costs[lvl];if(_meta.coins<cost)return false;_meta.coins-=cost;_meta.upgrades[id]=lvl+1;saveMeta();return true;}

function updateGameover(dt){_gameoverTimer-=dt;if(_gameoverTimer<=0||anyAction()){addRunCoins(_runCoins);_shopIdx=0;setState('shop');}}
function _shopHit(mx,my,x,y,w,h){return mx>=x&&mx<=x+w&&my>=y&&my<=y+h;}
function updateShop(dt){
  if(!anyAction())return;
  const cardW=160,cardH=128,gap=16,cols=Math.min(UPGRADES.length,UPGRADES.length<=4?4:3),totalW=cols*cardW+(cols-1)*gap,sx=(W-totalW)/2,sy=Math.round(H*0.22);
  for(let i=0;i<UPGRADES.length;i++){
    if(_shopHit(Mouse.x,Mouse.y,sx+i*(cardW+gap),sy,cardW,cardH)){_shopIdx=i;if(buyUpgrade(UPGRADES[i].id)){sfx.play(660,0.12,'sine',0.1);applyUpgrades();}else sfx.play(110,0.06,'sawtooth',0.08);return;}
  }
  const btnW=160,btnH=42,btnX=(W-btnW)/2,btnY=sy+cardH+32;
  if(_shopHit(Mouse.x,Mouse.y,btnX,btnY,btnW,btnH)){sfx.play(440,0.08,'square',0.1);startGame();setState('playing');}
}
function renderShop(){
  ctx.fillStyle=PALETTE.shopBg;ctx.fillRect(0,0,W,H);
  ctx.textAlign='center';
  ctx.fillStyle=PALETTE.accent||'#ff8800';ctx.font='bold 24px system-ui,sans-serif';ctx.fillText('UPGRADE SHOP',W/2,Math.round(H*0.10));
  ctx.fillStyle='#ffdd00';ctx.font='bold 14px system-ui,sans-serif';ctx.fillText(`🪙 ${_meta.coins} coins`,W/2,Math.round(H*0.18));
  const cardW=160,cardH=128,gap=16,cols=Math.min(UPGRADES.length,UPGRADES.length<=4?4:3),totalW=cols*cardW+(cols-1)*gap,sx=(W-totalW)/2,sy=Math.round(H*0.22);
  for(let i=0;i<UPGRADES.length;i++){
    const up=UPGRADES[i],lvl=getUpgradeLevel(up.id),cx=sx+i*(cardW+gap),maxed=lvl>=up.maxLevel,canBuy=!maxed&&_meta.coins>=up.costs[lvl];
    ctx.fillStyle=i===_shopIdx?PALETTE.shopSel:PALETTE.shopCard;ctx.strokeStyle=maxed?'#4caf50':canBuy?'#ffdd00':'#444';ctx.lineWidth=i===_shopIdx?2:1;
    ctx.beginPath();ctx.roundRect(cx,sy,cardW,cardH,8);ctx.fill();ctx.stroke();
    ctx.font='24px system-ui,sans-serif';ctx.fillStyle='#fff';ctx.fillText(up.icon,cx+cardW/2,sy+30);
    ctx.font='bold 11px system-ui,sans-serif';ctx.fillText(up.name,cx+cardW/2,sy+50);
    ctx.fillStyle='#aaa';ctx.font='10px system-ui,sans-serif';ctx.fillText(up.desc,cx+cardW/2,sy+64);
    for(let p=0;p<up.maxLevel;p++){ctx.fillStyle=p<lvl?'#ffdd00':'#333';ctx.beginPath();ctx.arc(cx+cardW/2-(up.maxLevel-1)*7+p*14,sy+84,5,0,Math.PI*2);ctx.fill();}
    ctx.font='bold 11px system-ui,sans-serif';ctx.fillStyle=maxed?'#4caf50':canBuy?'#ffdd00':'#555';ctx.fillText(maxed?'MAXED':`${up.costs[lvl]} coins`,cx+cardW/2,sy+108);
  }
  const btnW=160,btnH=42,btnX=(W-btnW)/2,btnY=sy+cardH+30;
  ctx.fillStyle='#1a4a1a';ctx.strokeStyle='#4caf50';ctx.lineWidth=2;ctx.beginPath();ctx.roundRect(btnX,btnY,btnW,btnH,8);ctx.fill();ctx.stroke();
  ctx.fillStyle='#fff';ctx.font='bold 16px system-ui,sans-serif';ctx.fillText('▶  PLAY',W/2,btnY+26);
  ctx.textAlign='left';
}

function applyUpgrades(){
  if(getUpgradeLevel('multiball')>=1 && balls.length===1 && !balls[0].stuck){
    const src=balls[0];
    balls.push({...src,vx:src.vx*0.9+50,vy:src.vy});
  }
  paddle.w=PADDLE_BASE_W+[0,30,55,80][getUpgradeLevel('paddle')];
  lives=3+getUpgradeLevel('life');
}

// ══════════════════════════════════════════════════════════════════
// GAME INIT
// ══════════════════════════════════════════════════════════════════
function initGame() {
  loadMeta();
  // [FILL: select level map or use procedural]
  buildBricksProc(level);
  resetBalls();
}

function resetBalls() {
  balls = [makeBall(W/2, PADDLE_Y - BALL_R - 2, 0, 0, true)];
  stickyMode = false;
}

function startGame() {
  loadMeta();
  GAME_SCORE = 0; level = 1; lives = 3;
  _runCoins = 0; _gameoverTimer = 1.5;
  paddle.x = W/2 - PADDLE_BASE_W/2; paddle.w = PADDLE_BASE_W;
  paddle.powerup = 'none'; paddle.powerTimer = 0;
  powerupPool.clear(); Popups.length = 0; bricks.length = 0;
  initGame();
  applyUpgrades();
}

function nextLevel() {
  level++;
  paddle.powerup = 'none'; paddle.powerTimer = 0; paddle.w = PADDLE_BASE_W;
  powerupPool.clear();
  initGame();
  setState('playing');
}

// ══════════════════════════════════════════════════════════════════
// UPDATE
// ══════════════════════════════════════════════════════════════════
function updatePlaying(dt) {
  // ── Paddle input ──────────────────────────────────────────────
  if (Mouse.moved)    paddle.x = clamp(Mouse.x - paddle.w/2, 0, W - paddle.w);
  if (Touch.active)   paddle.x = clamp(Touch.x - paddle.w/2, 0, W - paddle.w);
  if (keyDown('ArrowLeft')  || keyDown('KeyA')) paddle.x = Math.max(0,          paddle.x - PADDLE_SPEED * dt);
  if (keyDown('ArrowRight') || keyDown('KeyD')) paddle.x = Math.min(W-paddle.w, paddle.x + PADDLE_SPEED * dt);

  // ── Power-up timer ────────────────────────────────────────────
  if (paddle.powerup !== 'none') {
    paddle.powerTimer -= dt;
    if (paddle.powerTimer <= 0) {
      if (paddle.powerup === 'wide') { paddle.w = PADDLE_BASE_W; paddle.x = clamp(paddle.x,0,W-paddle.w); }
      if (paddle.powerup === 'sticky') stickyMode = false;
      paddle.powerup = 'none';
    }
  }

  // ── Balls ─────────────────────────────────────────────────────
  for (let bi = balls.length - 1; bi >= 0; bi--) {
    const ball = balls[bi];

    if (ball.stuck) {
      ball.x = clamp(paddle.x + paddle.w/2, BALL_R, W - BALL_R);
      ball.y = PADDLE_Y - BALL_R - 1;
      if (anyAction()) {
        ball.stuck = false;
        ball.vx = randFloat(-140, 140);
        ball.vy = -ball.speed;
        const len = Math.hypot(ball.vx, ball.vy);
        ball.vx = ball.vx/len*ball.speed; ball.vy = ball.vy/len*ball.speed;
        sfx.play(550, 0.07, 'square', 0.09);
      }
      continue;
    }

    // Ball trail
    ball.trail.push({x:ball.x, y:ball.y});
    if (ball.trail.length > 6) ball.trail.shift();

    // Substep integration (prevents tunneling at high speed)
    const SUBSTEPS = 4;
    for (let s = 0; s < SUBSTEPS; s++) {
      ball.x += ball.vx * dt / SUBSTEPS;
      ball.y += ball.vy * dt / SUBSTEPS;

      // Walls
      if (ball.x - ball.r < 0)  { ball.x = ball.r;    ball.vx =  Math.abs(ball.vx); sfx.play(300,0.03,'sine',0.05); }
      if (ball.x + ball.r > W)  { ball.x = W-ball.r;  ball.vx = -Math.abs(ball.vx); sfx.play(300,0.03,'sine',0.05); }
      if (ball.y - ball.r < 0)  { ball.y = ball.r;    ball.vy =  Math.abs(ball.vy); sfx.play(300,0.03,'sine',0.05); }

      // Brick collision
      ballVsBricks(ball);

      // Paddle collision (only while falling)
      if (ball.vy > 0 &&
          ball.y + ball.r >= PADDLE_Y &&
          ball.y - ball.r <  PADDLE_Y + PADDLE_H + 6 &&
          ball.x > paddle.x - ball.r &&
          ball.x < paddle.x + paddle.w + ball.r) {
        ball.y = PADDLE_Y - ball.r;
        // Angle modulation: hit position → angle
        const frac  = clamp((ball.x - paddle.x) / paddle.w, 0, 1);
        const angle = lerp(-ANGLE_MAX_DEG, ANGLE_MAX_DEG, frac) * Math.PI / 180;
        ball.vx = Math.sin(angle) * ball.speed;
        ball.vy = -Math.cos(angle) * ball.speed;
        if (stickyMode) {
          ball.stuck = true;
          sfx.play(550,0.06,'square',0.09);
        } else {
          sfx.play(440, 0.06, 'square', 0.10);
        }
        triggerShake(2, 0.08);
      }
    }

    // Ball lost below screen
    if (ball.y > H + 30) balls.splice(bi, 1);
  }

  // ── All balls lost ────────────────────────────────────────────
  if (balls.length === 0) {
    lives--;
    triggerShake(6, 0.35); sfx.play(110, 0.25, 'sawtooth', 0.15);
    if (lives <= 0) { saveHiScore(GAME_SCORE); _runCoins=Math.floor(GAME_SCORE/50); _gameoverTimer=1.5; setState('gameover'); }
    else resetBalls();
  }

  // ── Power-ups falling ─────────────────────────────────────────
  powerupPool.update(p => {
    p.y += p.vy * dt;
    if (p.y > H + 20) return false;
    // Paddle catch
    if (p.y + p.h >= PADDLE_Y && p.y < PADDLE_Y + PADDLE_H + 8 &&
        p.x + p.w > paddle.x && p.x < paddle.x + paddle.w) {
      applyPowerup(p.type);
      sfx.play(880, 0.12, 'sine', 0.10);
      return false;
    }
    return true;
  });

  // ── Level clear ───────────────────────────────────────────────
  const aliveDestructible = bricks.filter(b => b.alive && b.type !== 'steel').length;
  if (aliveDestructible === 0) {
    GAME_SCORE += lives * 100 * level;
    spawnParticles(W/2, H/2, 30, {speed:120, life:0.8, gravity:80, color:PALETTE.accent});
    sfx.play(880, 0.20, 'sine', 0.12);
    setState('levelclear');
  }
}

function applyPowerup(type) {
  paddle.powerup = type; paddle.powerTimer = 12;
  if (type === 'wide') { paddle.w = Math.min(PADDLE_BASE_W + 55, W/2); paddle.x = clamp(paddle.x,0,W-paddle.w); }
  if (type === 'multi') {
    const src = balls[0] || makeBall(W/2, PADDLE_Y-BALL_R-2, 0, -BALL_SPEED_INIT, false);
    for (let i = 0; i < 2; i++) {
      const a = (Math.random()-0.5)*0.9;
      const sp = src.speed;
      balls.push(makeBall(src.x, src.y, Math.sin(a)*sp, -Math.cos(a)*sp, false));
    }
  }
  if (type === 'slow') {
    balls.forEach(b => { b.speed = Math.max(b.speed*0.6, BALL_SPEED_INIT); const l=Math.hypot(b.vx,b.vy); if(l>0){b.vx=b.vx/l*b.speed;b.vy=b.vy/l*b.speed;} });
  }
  if (type === 'sticky') { stickyMode = true; paddle.powerTimer = 10; }
  // [FILL: implement 'laser' — paddle fires upward bullets on Space press]
}

function renderMenu() {
  ctx.fillStyle = PALETTE.bg; ctx.fillRect(0,0,W,H);
  // [FILL: animated menu background — e.g., a demo ball bouncing]
  ctx.textAlign='center';
  ctx.fillStyle=PALETTE.accent; ctx.font='bold 30px system-ui,sans-serif'; ctx.fillText(GAME_TITLE, W/2, H*0.28);
  ctx.fillStyle='#aaa'; ctx.font='11px system-ui,sans-serif'; ctx.fillText('MOUSE / TOUCH moves paddle', W/2, H*0.44);
  ctx.fillText('SPACE / CLICK to launch ball', W/2, H*0.51);
  if(_meta.coins>0){ctx.fillStyle='#ffdd00';ctx.font='bold 13px system-ui,sans-serif';ctx.fillText(`🪙 ${_meta.coins} coins`,W/2,H*0.58);}
  ctx.fillStyle='#fff'; ctx.font='bold 16px system-ui,sans-serif'; ctx.fillText('SPACE / TAP to play', W/2, H*0.65);
  ctx.fillStyle='#888'; ctx.font='13px system-ui,sans-serif'; ctx.fillText(`BEST: ${_hiScore}`, W/2, H*0.75);
  ctx.textAlign='left';
}

function renderPlaying() {
  ctx.fillStyle = PALETTE.bg; ctx.fillRect(0,0,W,H);
  // [FILL: decorative background grid or gradient]

  // ── Bricks ───────────────────────────────────────────────────
  bricks.forEach(b => {
    if (!b.alive) return;
    b.flashTimer = Math.max(0, b.flashTimer - FIXED_DT);
    if (b.type === 'steel') {
      ctx.fillStyle = b.flashTimer > 0 ? '#ccc' : '#777';
      ctx.fillRect(b.x, b.y, b.w, b.h);
      ctx.strokeStyle = '#aaa'; ctx.lineWidth = 1.5;
      ctx.strokeRect(b.x+1, b.y+1, b.w-2, b.h-2);
    } else {
      ctx.fillStyle = b.flashTimer > 0 ? '#fff' : b.color;
      ctx.fillRect(b.x, b.y, b.w, b.h);
      // Shine
      ctx.fillStyle = 'rgba(255,255,255,0.28)';
      ctx.fillRect(b.x, b.y, b.w, 4);
      // Hard brick HP bar
      if (b.maxHp > 1) {
        ctx.fillStyle = 'rgba(0,0,0,0.45)';
        ctx.fillRect(b.x+2, b.y+b.h-5, b.w-4, 3);
        ctx.fillStyle = '#fff';
        ctx.fillRect(b.x+2, b.y+b.h-5, Math.round((b.w-4)*Math.max(b.hp,0)/b.maxHp), 3);
      }
      if (b.type === 'powerup') {
        ctx.fillStyle = 'rgba(255,255,255,0.7)';
        ctx.font = '10px monospace'; ctx.textAlign='center';
        ctx.fillText('★', b.x+b.w/2, b.y+b.h-5);
        ctx.textAlign='left';
      }
    }
  });

  // ── Power-ups falling ────────────────────────────────────────
  powerupPool.active.forEach(p => {
    ctx.fillStyle = POWERUP_COLORS[p.type] || '#fff';
    ctx.shadowBlur=6; ctx.shadowColor=POWERUP_COLORS[p.type]||'#fff';
    ctx.fillRect(p.x, p.y, p.w, p.h);
    ctx.shadowBlur=0;
    ctx.fillStyle='#000'; ctx.font='8px monospace'; ctx.textAlign='center';
    ctx.fillText(POWERUP_LABELS[p.type]||'?', p.x+p.w/2, p.y+p.h-3);
    ctx.textAlign='left';
  });

  // ── Paddle ───────────────────────────────────────────────────
  const pCol = paddle.powerup==='wide' ? '#0ff' : paddle.powerup==='sticky' ? '#fa0' : PALETTE.paddle;
  ctx.shadowBlur=10; ctx.shadowColor=pCol; ctx.fillStyle=pCol;
  ctx.beginPath(); ctx.roundRect(paddle.x, paddle.y, paddle.w, paddle.h, 7); ctx.fill();
  ctx.shadowBlur=0;

  // ── Ball trails + balls ───────────────────────────────────────
  balls.forEach(ball => {
    ball.trail.forEach((pt, i) => {
      ctx.globalAlpha = (i/ball.trail.length)*0.3;
      ctx.fillStyle = PALETTE.ball;
      ctx.beginPath(); ctx.arc(pt.x, pt.y, ball.r*(0.4+0.6*i/ball.trail.length), 0, Math.PI*2); ctx.fill();
    });
    ctx.globalAlpha=1;
    ctx.shadowBlur=14; ctx.shadowColor=PALETTE.ball; ctx.fillStyle=PALETTE.ball;
    ctx.beginPath(); ctx.arc(ball.x, ball.y, ball.r, 0, Math.PI*2); ctx.fill();
    ctx.shadowBlur=0;
  });

  // ── HUD ───────────────────────────────────────────────────────
  drawText(`SCORE: ${GAME_SCORE}`, 10, 22, PALETTE.ui, 13);
  drawText(`LV ${level}`, W/2, 22, '#aaa', 12, 'center');
  drawText(`BEST: ${_hiScore}`, W-10, 22, '#888', 11, 'right');
  for (let i = 0; i < lives; i++) {
    ctx.fillStyle = PALETTE.ball;
    ctx.beginPath(); ctx.arc(14+i*20, H-14, 6, 0, Math.PI*2); ctx.fill();
  }
  if (paddle.powerup !== 'none') {
    const col = POWERUP_COLORS[paddle.powerup]||'#fff';
    drawText(`${POWERUP_LABELS[paddle.powerup]} ${Math.ceil(paddle.powerTimer)}s`, W/2, H-10, col, 12, 'center');
  }
  // Stuck ball hint
  if (balls.length > 0 && balls[0].stuck) {
    drawText('SPACE / CLICK to launch', W/2, H*0.88, '#aaa', 11, 'center');
  }
}

// ══════════════════════════════════════════════════════════════════

requestAnimationFrame(t => { lastTime = t; requestAnimationFrame(loop); });
