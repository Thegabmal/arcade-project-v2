</head>

// ─── Audio ─────────────────────────────────────────────────────────────────────
const AC = new (window.AudioContext || window.webkitAudioContext)();
function tone(f, type, dur, vol, delay=0) {
  const o=AC.createOscillator(), g=AC.createGain();
  o.connect(g); g.connect(AC.destination);
  o.type=type; o.frequency.setValueAtTime(f, AC.currentTime+delay);
  g.gain.setValueAtTime(0.001,AC.currentTime+delay);
  g.gain.linearRampToValueAtTime(vol,AC.currentTime+delay+0.01);
  g.gain.exponentialRampToValueAtTime(0.001,AC.currentTime+delay+dur);
  o.start(AC.currentTime+delay); o.stop(AC.currentTime+delay+dur+0.01);
}
function sfxClick()   { tone(600,'sine',0.04,0.12); }
function sfxChoice()  { tone(440,'sine',0.06,0.18); tone(550,'sine',0.05,0.12,0.05); }
function sfxChapter() { [200,300,400,500,700].forEach((f,i)=>tone(f,'square',0.1,0.2,i*0.06)); }
function sfxEnd(good) { const freqs=good?[400,500,640,800,1000]:[300,260,220,180,150]; freqs.forEach((f,i)=>tone(f,'triangle',0.2,0.25,i*0.1)); }

function drawPortraitAlex(ctx, x, y, w, h, emotion) {
  // Alex: short hair, round face, warm colors
  const cx=x+w/2, cy=y+h/2;
  // Body
  ctx.fillStyle='#3060A0'; ctx.fillRect(x+10,y+h*0.65,w-20,h*0.4);
  // Face
  ctx.fillStyle=emotion==='happy'?'#FFB888':emotion==='sad'?'#CC9966':'#E8A878';
  ctx.beginPath(); ctx.arc(cx,cy-5,h*0.28,0,Math.PI*2); ctx.fill();
  // Hair
  ctx.fillStyle='#5C3A10';
  ctx.beginPath(); ctx.arc(cx,cy-5,h*0.28,Math.PI,0); ctx.fill();
  ctx.fillRect(cx-h*0.28,cy-5,h*0.28*2,h*0.08);
  // Eyes
  const ey=cy-5;
  [cx-14,cx+14].forEach(ex=>{
    ctx.fillStyle='#fff'; ctx.beginPath(); ctx.ellipse(ex,ey,6,4,0,0,Math.PI*2); ctx.fill();
    ctx.fillStyle='#3050C0'; ctx.beginPath(); ctx.arc(ex,ey,3,0,Math.PI*2); ctx.fill();
    ctx.fillStyle='#111'; ctx.beginPath(); ctx.arc(ex,ey,2,0,Math.PI*2); ctx.fill();
  });
  if (emotion==='surprised') {
    ctx.fillStyle='#FFB888';
    ctx.beginPath(); ctx.ellipse(cx,cy+20,8,6,0,0,Math.PI*2); ctx.fill();
  } else {
    const smile=emotion==='happy'?1:emotion==='sad'?-1:0;
    ctx.strokeStyle='#8B4513'; ctx.lineWidth=1.5;
    ctx.beginPath(); ctx.arc(cx,cy+15+smile*4,8,0.2*Math.PI,(1-0.2)*Math.PI,smile<0); ctx.stroke();
  }
}

function drawPortraitLyra(ctx, x, y, w, h, emotion) {
  const cx=x+w/2, cy=y+h/2;
  // Body
  ctx.fillStyle='#6030A0'; ctx.fillRect(x+8,y+h*0.65,w-16,h*0.4);
  // Face
  ctx.fillStyle=emotion==='happy'?'#FFD0D8':emotion==='angry'?'#CC8080':'#F0B8C8';
  ctx.beginPath(); ctx.arc(cx,cy-5,h*0.27,0,Math.PI*2); ctx.fill();
  // Long hair
  ctx.fillStyle='#E040B0';
  ctx.beginPath(); ctx.arc(cx,cy-5,h*0.27,Math.PI,0); ctx.fill();
  ctx.fillRect(cx-h*0.27,cy-5,8,h*0.5);       // left strand
  ctx.fillRect(cx+h*0.27-8,cy-5,8,h*0.5);     // right strand
  // Eyes (cat-like)
  const ey=cy-6;
  [cx-12,cx+12].forEach(ex=>{
    ctx.fillStyle='#fff'; ctx.beginPath(); ctx.ellipse(ex,ey,7,4,0,0,Math.PI*2); ctx.fill();
    ctx.fillStyle='#9030C0'; ctx.beginPath(); ctx.ellipse(ex,ey,3,4,0,0,Math.PI*2); ctx.fill();
    ctx.fillStyle='#111'; ctx.beginPath(); ctx.ellipse(ex,ey,1.5,4,0,0,Math.PI*2); ctx.fill();
  });
  // Mouth
  ctx.strokeStyle='#C86080'; ctx.lineWidth=1.5;
  if (emotion==='angry') {
    ctx.beginPath(); ctx.moveTo(cx-8,cy+15); ctx.lineTo(cx+8,cy+17); ctx.stroke();
  } else {
    ctx.beginPath(); ctx.arc(cx,cy+14+((emotion==='happy')?4:0),7,0.15*Math.PI,0.85*Math.PI); ctx.stroke();
  }
}

function drawPortraitZero(ctx, x, y, w, h, emotion) {
  const cx=x+w/2, cy=y+h/2;
  // Robotic body
  ctx.fillStyle='#2a2a3a'; ctx.fillRect(x+5,y+h*0.6,w-10,h*0.45);
  // Head (square)
  ctx.fillStyle=emotion==='active'?'#3a3a5a':'#1e1e2e';
  ctx.fillRect(cx-h*0.25,cy-h*0.3,h*0.5,h*0.45);
  // Visor
  ctx.fillStyle=emotion==='active'?'#FF6644':emotion==='neutral'?'#FF4422':'#CC3322';
  ctx.fillRect(cx-h*0.2,cy-h*0.18,h*0.4,h*0.12);
  // Glow
  ctx.shadowColor=ctx.fillStyle; ctx.shadowBlur=10;
  ctx.fillRect(cx-h*0.2,cy-h*0.18,h*0.4,h*0.12);
  ctx.shadowBlur=0;
  // Panel lines
  ctx.strokeStyle='#444466'; ctx.lineWidth=1;
  ctx.strokeRect(cx-h*0.25,cy-h*0.3,h*0.5,h*0.45);
  ctx.beginPath(); ctx.moveTo(cx-h*0.25,cy+h*0.02); ctx.lineTo(cx+h*0.25,cy+h*0.02); ctx.stroke();
  // Speaker grill
  for (let i=0;i<3;i++) {
    ctx.beginPath(); ctx.moveTo(cx-10+i*6,cy+h*0.04); ctx.lineTo(cx-10+i*6,cy+h*0.1); ctx.stroke();
  }
}

// ─── Game State ─────────────────────────────────────────────────────────────────

let state = 'transition';  // transition | reading | choices | ending
let fadeAlpha = 1;
let fadingIn = true;

// Typewriter
let fullText    = '';
let shownChars  = 0;
let typeTimer   = 0;
const TYPE_SPEED = 0.032;  // seconds per char
let textDone    = false;

// Choice animation
let choiceHover = -1;

// Chapter title overlay
let chapterTitle   = '';
let chapterAlpha   = 0;
let chapterShowing = false;

// Auto-advance
let autoTimer = 0;

// Current portraits

let leftEmo = 'normal', rightEmo = 'normal';

// Backgrounds (canvas-drawn)
const bgColors = {
  lab:       ['#0e0a2a','#1a1040','#0a0820'],

  server:    ['#1a0a0a','#2a0808','#0a0505'],

  ending_g:  ['#001a0a','#001408','#002a10'],
  ending_b:  ['#04041a','#080830','#04041a'],
};

function nodeApply(node) {
  // Apply flag changes from previous choice
}

function gotoNode(id, fromChoice) {
  const node = NODES[id];
  if (!node) return;
  currentNode = id;

  if (fromChoice) {
    // Apply score add if present (already applied at choice time)
  }

  fullText    = node.text;
  shownChars  = 0;
  typeTimer   = 0;
  textDone    = false;

  // Portrait logic
  const ch = node.char;
  if (ch === 'lyra')   { leftChar='lyra';  leftEmo=node.emotion; rightChar=rightChar||null; activeChar='left'; }
  else if (ch==='zero'){ rightChar='zero'; rightEmo=node.emotion; leftChar=leftChar||null; activeChar='right'; }
  else if (ch==='player'){ activeChar='player'; }
  else { activeChar='narrator'; }

  // Log history
  if (ch !== 'narrator') {
    dialogueHistory.push({ speaker: CHARACTERS[ch]?.name||'', text: node.text });
    updateHistoryPanel();
  }

  // Fade
  fadingIn = true; fadeAlpha = 0;
  state = 'transition';
}

function updateHistoryPanel() {
  const list = document.getElementById('history-list');
  list.innerHTML = dialogueHistory.map(e =>
    `<div class="hentry"><span>${e.speaker ? e.speaker+': ' : ''}</span>${escHtml(e.text)}</div>`
  ).join('');
}
function escHtml(s) { return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

// ─── Input ─────────────────────────────────────────────────────────────────────
canvas.addEventListener('click', e => {
  AC.resume();
  const r = canvas.getBoundingClientRect();
  const cx = e.clientX-r.left, cy = e.clientY-r.top;

  if (state === 'transition') return;

  const node = NODES[currentNode];

  if (state === 'choices') {
    // Check which choice was clicked
    const choices = node.choices;
    choices.forEach((c,i) => {
      const by = 280 + i * 58;
      if (cy >= by && cy <= by+48 && cx >= 40 && cx <= W-40) {
        sfxChoice();
        if (c.flag) flags[c.flag] = c.value !== undefined ? c.value : true;
        if (c.scoreAdd) flags.choice_score += c.scoreAdd;
        gotoNode(c.next, true);
      }
    });
    return;
  }

  if (state === 'reading') {
    if (!textDone) {
      shownChars = fullText.length; textDone = true; // skip typewriter
    } else {
      sfxClick();
      advance();
    }
  }
});

canvas.addEventListener('mousemove', e => {
  const r = canvas.getBoundingClientRect();
  const cy = e.clientY-r.top;
  if (state === 'choices') {
    const node = NODES[currentNode];
    choiceHover = -1;
    (node.choices||[]).forEach((c,i) => {
      const by = 280 + i * 58;
      if (cy >= by && cy <= by+48) choiceHover = i;
    });
  }
});

window.addEventListener('keydown', e => {
  AC.resume();
  if (e.code==='Space' || e.code==='Enter') {
    e.preventDefault();
    if (state==='reading') {
      if (!textDone) { shownChars=fullText.length; textDone=true; }
      else { sfxClick(); advance(); }
    }
  }
  if (e.code==='KeyH') {
    document.getElementById('history-panel').style.display='block';
  }
  if (e.code==='Escape') {
    document.getElementById('history-panel').style.display='none';
  }
});

function advance() {
  const node = NODES[currentNode];
  if (node.isEnding) {
    state = 'ending'; sfxEnd(flags.choice_score > 0); return;
  }
  if (node.chapterEnd) {
    chapterTitle = node.chapterTitle || '';
    chapterAlpha = 1; chapterShowing = true;
    setTimeout(() => { chapterShowing = false; gotoNode(node.next); }, 2200);
    sfxChapter();
    return;
  }
  if (node.choices) { state = 'choices'; sfxClick(); return; }
  if (node.next) gotoNode(node.next);
}

// ─── Draw Background ────────────────────────────────────────────────────────────
function drawBackground(bgKey, t) {
  const cols = bgColors[bgKey] || bgColors.lab;
  const g = ctx.createLinearGradient(0,0,W,H);
  g.addColorStop(0, cols[0]); g.addColorStop(0.5, cols[1]); g.addColorStop(1, cols[2]);
  ctx.fillStyle=g; ctx.fillRect(0,0,W,H);

  // Scene-specific details
  if (bgKey==='lab') {
    // Flickering console lines
    ctx.strokeStyle='rgba(0,180,255,0.08)'; ctx.lineWidth=1;
    for (let i=0;i<12;i++) {
      const y=20+i*38; const alpha=0.04+Math.sin(t*2+i)*0.02;
      ctx.strokeStyle=`rgba(0,180,255,${alpha})`;
      ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(W,y); ctx.stroke();
    }
    // Terminal glow
    ctx.fillStyle='rgba(0,80,255,0.06)';
    ctx.fillRect(W-240, 40, 220, 140);
    ctx.strokeStyle='rgba(0,120,255,0.3)'; ctx.lineWidth=1;
    ctx.strokeRect(W-240, 40, 220, 140);
    for (let i=0;i<8;i++) {
      ctx.fillStyle=`rgba(0,${140+i*10},255,0.4)`;
      ctx.fillRect(W-230, 55+i*14, Math.random()*160+20, 6);
    }
  } else if (bgKey==='archive') {
    // Data streams
    for (let i=0;i<20;i++) {
      const x=((i*137+t*30)%W);
      const alpha=0.03+Math.sin(t+i)*0.02;
      ctx.fillStyle=`rgba(0,255,100,${alpha})`;
      ctx.font='10px Courier New'; ctx.fillText(Math.random()>0.5?'1':'0', x, (i*27+t*20)%H);
    }
  } else if (bgKey==='server') {
    // Server racks
    for (let r=0;r<5;r++) {
      const rx=80+r*120;
      ctx.fillStyle='#1a0505';
      ctx.fillRect(rx, 60, 90, 200);
      for (let s=0;s<8;s++) {
        const active=Math.sin(t*3+r*2+s)>0;
        ctx.fillStyle=active?'#FF3322':'#330000';
        ctx.fillRect(rx+8, 70+s*22, 74, 10);
      }
    }
  } else if (bgKey.startsWith('ending')) {
    // Stars / ending ambience
    for (let i=0;i<80;i++) {
      const sx=(i*137.5)%W, sy=(i*97.3)%H;
      const a=0.3+Math.sin(t+i*0.5)*0.2;
      ctx.fillStyle=`rgba(255,255,255,${a})`;
      ctx.beginPath(); ctx.arc(sx,sy,0.8,0,Math.PI*2); ctx.fill();
    }
  }
}

// ─── Draw Portraits ─────────────────────────────────────────────────────────────
function drawPortraits(t) {
  const PORTRAIT_W = 120, PORTRAIT_H = 160;
  const node = NODES[currentNode];
  const ch = node.char;

  // Left portrait (Lyra)
  if (leftChar) {
    const active = ch==='lyra';
    ctx.save();
    ctx.globalAlpha = active ? 1.0 : 0.45;
    if (!active) { ctx.filter='grayscale(60%)'; }
    ctx.fillStyle='rgba(0,0,0,0.3)';
    ctx.fillRect(20, H-290, PORTRAIT_W, PORTRAIT_H);
    CHARACTERS[leftChar].portrait(ctx, 20, H-290, PORTRAIT_W, PORTRAIT_H, leftEmo);
    ctx.restore();
    // Name tag
    if (active) {
      ctx.fillStyle='rgba(255,128,204,0.8)'; ctx.font='bold 11px Courier New';
      ctx.textAlign='center'; ctx.fillText(CHARACTERS.lyra.name, 20+PORTRAIT_W/2, H-300);
    }
  }

  // Right portrait (Zero)
  if (rightChar) {
    const active = ch==='zero';
    const rx = W-PORTRAIT_W-20;
    ctx.save();
    ctx.globalAlpha = active ? 1.0 : 0.45;
    if (!active) { ctx.filter='grayscale(60%)'; }
    ctx.fillStyle='rgba(0,0,0,0.3)';
    ctx.fillRect(rx, H-290, PORTRAIT_W, PORTRAIT_H);
    CHARACTERS[rightChar].portrait(ctx, rx, H-290, PORTRAIT_W, PORTRAIT_H, rightEmo);
    ctx.restore();
    if (active) {
      ctx.fillStyle='rgba(255,100,68,0.8)'; ctx.font='bold 11px Courier New';
      ctx.textAlign='center'; ctx.fillText(CHARACTERS.zero.name, rx+PORTRAIT_W/2, H-300);
    }
  }

  // Player (Alex) center
  if (ch==='player') {
    const px=W/2-60;
    CHARACTERS.player.portrait(ctx, px, H-290, 120, PORTRAIT_H, node.emotion||'normal');
    ctx.fillStyle='rgba(128,187,255,0.8)'; ctx.font='bold 11px Courier New';
    ctx.textAlign='center'; ctx.fillText('Alex', W/2, H-300);
  }
}

// ─── Draw Dialogue Box ──────────────────────────────────────────────────────────
function drawDialogue(t) {
  const node = NODES[currentNode];
  const ch = node.char;
  const charDef = CHARACTERS[ch] || CHARACTERS.narrator;

  // Box
  ctx.fillStyle='rgba(0,0,10,0.82)';
  ctx.beginPath(); ctx.roundRect(30, H-210, W-60, 175, 8); ctx.fill();
  ctx.strokeStyle=charDef.col+'88'; ctx.lineWidth=1.5;
  ctx.beginPath(); ctx.roundRect(30, H-210, W-60, 175, 8); ctx.stroke();

  // Speaker name
  if (ch !== 'narrator') {
    ctx.fillStyle=charDef.col; ctx.font='bold 13px Courier New'; ctx.textAlign='left';
    ctx.fillText(charDef.name, 46, H-192);
    // Underline
    ctx.strokeStyle=charDef.col+'66'; ctx.lineWidth=1;
    ctx.beginPath(); ctx.moveTo(46,H-186); ctx.lineTo(46+charDef.name.length*8+4,H-186); ctx.stroke();
  }

  // Text (with wrap)
  const shown = fullText.substring(0, shownChars);
  ctx.fillStyle=charDef.textCol; ctx.font='14px Courier New';
  wrapText(shown, 46, H-172, W-92, 22);

  // Caret blink (when text done)
  if (textDone && state==='reading') {
    const blink = Math.sin(t*5)>0;
    if (blink) {
      ctx.fillStyle=charDef.col+'CC'; ctx.font='12px Courier New';
      ctx.textAlign='right';
      ctx.fillText('▼  click or SPACE', W-46, H-42);
    }
  }
}

function wrapText(text, x, y, maxW, lineH) {
  const words = text.split(' ');
  let line = '';
  let oy = y;
  for (let i=0;i<words.length;i++) {
    const test = line ? line+' '+words[i] : words[i];
    if (ctx.measureText(test).width > maxW && line) {
      ctx.fillText(line, x, oy); line=words[i]; oy+=lineH;
      if (oy > y+lineH*4+4) { ctx.fillText('...', x, oy); return; }
    } else { line=test; }
  }
  if (line) ctx.fillText(line, x, oy);
}

// ─── Draw Choices ──────────────────────────────────────────────────────────────
function drawChoices(t) {
  const node = NODES[currentNode];
  if (!node.choices) return;

  // Question prompt
  ctx.fillStyle='rgba(0,0,10,0.92)'; ctx.fillRect(0, 240, W, H);
  ctx.fillStyle='rgba(255,255,255,0.6)'; ctx.font='13px Courier New'; ctx.textAlign='center';
  ctx.fillText('— MAKE YOUR CHOICE —', W/2, 268);

  node.choices.forEach((c,i) => {
    const by = 280 + i * 58;
    const hover = choiceHover === i;
    ctx.fillStyle = hover ? 'rgba(96,60,200,0.45)' : 'rgba(20,16,50,0.7)';
    ctx.beginPath(); ctx.roundRect(40, by, W-80, 48, 6); ctx.fill();
    ctx.strokeStyle = hover ? '#8060ff' : '#3a2880'; ctx.lineWidth = hover ? 2 : 1;
    ctx.beginPath(); ctx.roundRect(40, by, W-80, 48, 6); ctx.stroke();

    if (hover) { ctx.shadowColor='#8060ff'; ctx.shadowBlur=10; }
    ctx.fillStyle = hover ? '#fff' : '#aaa'; ctx.font='13px Courier New'; ctx.textAlign='left';
    wrapTextSingle(c.label, 60, by+30, W-120);
    ctx.shadowBlur=0;

    // Index
    ctx.fillStyle='#6050CC'; ctx.font='bold 11px Courier New'; ctx.textAlign='left';
    ctx.fillText(`${i+1}.`, 46, by+30);
  });
}
function wrapTextSingle(text, x, y, maxW) {
  if (ctx.measureText(text).width <= maxW) { ctx.fillText(text, x, y); return; }
  const mid=Math.floor(text.length/2);
  let split=text.lastIndexOf(' ',mid);
  if (split<0) split=mid;
  ctx.font='13px Courier New';
  ctx.fillText(text.substring(0,split), x, y-8);
  ctx.fillText(text.substring(split+1), x, y+8);
}

// ─── Draw HUD ────────────────────────────────────────────────────────────────────
function drawHUD(t) {
  const node = NODES[currentNode];

  // Chapter info (top bar)
  ctx.fillStyle='rgba(0,0,0,0.5)'; ctx.fillRect(0,0,W,32);
  const chapterNum = currentNode.startsWith('c1')?'CH.1':currentNode.startsWith('c2')?'CH.2':currentNode.startsWith('c3')||currentNode.startsWith('ending')?'CH.3':'PROLOGUE';
  ctx.fillStyle='#6050CC'; ctx.font='bold 11px Courier New'; ctx.textAlign='left';
  ctx.fillText(`ECHOES OF TOMORROW — ${chapterNum}`, 12, 20);

  // Flags HUD (top right)
  ctx.textAlign='right';
  ctx.font='10px Courier New';
  const score = flags.choice_score;
  ctx.fillStyle=score>0?'#44FF88':score<0?'#FF4444':'#888';
  ctx.fillText(`alignment: ${score>0?'human':score<0?'machine':'neutral'} (${score>0?'+':''}${score})`, W-10, 20);

  // Key hints
  ctx.fillStyle='rgba(60,50,100,0.4)'; ctx.font='10px Courier New'; ctx.textAlign='right';
  ctx.fillText('[H] history  [ESC] close', W-10, H-4);

  // Chapter title overlay
  if (chapterShowing && chapterAlpha > 0) {
    ctx.fillStyle=`rgba(0,0,10,${Math.min(chapterAlpha,0.85)})`;
    ctx.fillRect(0,0,W,H);
    ctx.fillStyle=`rgba(255,255,255,${chapterAlpha})`;
    ctx.font='bold 28px Courier New'; ctx.textAlign='center';
    ctx.fillText(chapterTitle, W/2, H/2);
    chapterAlpha -= 0.008;
  }
}

function drawEnding() {
  const node = NODES[currentNode];
  ctx.fillStyle='rgba(0,0,10,0.92)'; ctx.fillRect(0,0,W,H);

  ctx.textAlign='center';
  ctx.shadowColor=node.endingColor||'#8080FF'; ctx.shadowBlur=40;
  ctx.fillStyle=node.endingColor||'#8080FF'; ctx.font='bold 36px Courier New';
  ctx.fillText(node.endingTitle||'THE END', W/2, H/2-80);
  ctx.shadowBlur=0;

  ctx.fillStyle='rgba(255,255,255,0.85)'; ctx.font='15px Courier New';
  wrapText(node.text, 60, H/2-30, W-120, 24);

  ctx.fillStyle='#888'; ctx.font='12px Courier New';
  const score=flags.choice_score;
  ctx.fillText(`Final alignment: ${score>1?'human':score<-1?'machine':'balanced'} (${score>0?'+':''}${score})`, W/2, H/2+110);

  const pulse=0.65+Math.sin(lastTs/400)*0.35;
  ctx.globalAlpha=pulse; ctx.fillStyle='#fff'; ctx.font='bold 14px Courier New';
  ctx.fillText('[ CLICK TO REPLAY ]', W/2, H-30); ctx.globalAlpha=1;
}

// ─── Update ────────────────────────────────────────────────────────────────────
let lastTs = 0;
function update(ts) {
  const dt = Math.min((ts-lastTs)/1000, 0.05);
  lastTs = ts;

  // Fade
  if (state==='transition') {
    fadeAlpha += dt * 3;
    if (fadeAlpha >= 1) { fadeAlpha=1; state = NODES[currentNode].choices ? 'choices' : (NODES[currentNode].isEnding ? 'ending' : 'reading'); }
  }

  // Typewriter
  if (state==='reading' && !textDone) {
    typeTimer += dt;
    while (typeTimer >= TYPE_SPEED && shownChars < fullText.length) {
      typeTimer -= TYPE_SPEED;
      shownChars++;
    }
    if (shownChars >= fullText.length) textDone = true;
  }

  requestAnimationFrame(ts2=>{ draw(ts2/1000); update(ts2); });
}

canvas.addEventListener('click', e => {
  if (state==='ending') { Object.assign(flags,{trusted_lyra:false,helped_zero:false,revealed_truth:false,chose_humanity:false,chose_machine:false,choice_score:0}); dialogueHistory.length=0; updateHistoryPanel(); leftChar=null; rightChar=null; gotoNode('start'); }
});

function draw(t) {
  ctx.clearRect(0,0,W,H);
  const node = NODES[currentNode];

  drawBackground(node.bg||'lab', t);

  ctx.globalAlpha = fadeAlpha;

  if (state !== 'ending') {
    drawPortraits(t);
    drawDialogue(t);
    if (state==='choices') drawChoices(t);
    drawHUD(t);
  } else {
    drawEnding();
  }

  ctx.globalAlpha = 1;
}

// ─── Boot ──────────────────────────────────────────────────────────────────────
gotoNode('start');
requestAnimationFrame(ts=>{ lastTs=ts; update(ts); });

  // Dev console bridge (global scope)
  window.__devPatch = function(code) { return eval(code); };
</script>

<script id="dev-console-script">
/* DEV_CONSOLE_INJECTED */
(function(){
'use strict';
var FILENAME=window.location.pathname.split('/').pop();
var panel=document.getElementById('dev-console');
var input=document.getElementById('dev-console-input');
var btn=document.getElementById('dev-console-btn');
var undoBtn=document.getElementById('dev-console-undo');
var statusEl=document.getElementById('dev-console-status');
var closeBtn=document.getElementById('dev-console-close');
var ctxBtn=document.getElementById('dev-console-ctx-btn');
var ctxPanel=document.getElementById('dev-console-ctx');
var logPanel=document.getElementById('dev-console-log');
var codeWrap=document.getElementById('dev-console-code-wrap');
var codeToggle=document.getElementById('dev-console-code-toggle');
var codePre=document.getElementById('dev-console-code-pre');
if(!panel||!input||!btn||!statusEl)return;

// ── État interne ──
var _snapshots=[];
var _history=[];
var _histIdx=-1;
var _actionLog=[];
var MAX_UNDO=15;
var MAX_LOG=30;
var _lastCode='';

// ── Toggle code généré ──
if(codeToggle&&codeWrap&&codePre){
  codeToggle.addEventListener('click',function(){
    var isOpen=codePre.style.display==='block';
    codePre.style.display=isOpen?'none':'block';
    codeToggle.textContent=(isOpen?'▶ voir':'▼ masquer')+' le code généré';
  });
  codePre.style.display='none'; // fermé par défaut
}

function showGeneratedCode(code){
  if(!codeWrap||!codePre||!codeToggle)return;
  _lastCode=code||'';
  codePre.textContent=_lastCode;
  codeWrap.classList.add('visible');
  codePre.style.display='none'; // fermé par défaut, l'utilisateur ouvre s'il veut
  codeToggle.textContent='▶ voir le code généré ('+_lastCode.split('\n').length+' lignes)';
}

function hideGeneratedCode(){
  if(!codeWrap)return;
  codeWrap.classList.remove('visible');
  _lastCode='';
}

// ── Utilitaires UI ──
closeBtn.addEventListener('click',function(){panel.classList.remove('open');input.blur();});

function setStatus(msg,cls){
  statusEl.textContent=msg;
  statusEl.className=cls||'';
}

function addLog(prompt,ok,note){
  var t=new Date().toLocaleTimeString('fr',{hour:'2-digit',minute:'2-digit',second:'2-digit'});
  var short=prompt.length>55?prompt.slice(0,55)+'…':prompt;
  _actionLog.unshift({t:t,short:short,ok:ok,note:note||''});
  if(_actionLog.length>MAX_LOG)_actionLog.pop();
  renderLog();
}

function renderLog(){
  if(!_actionLog.length){logPanel.classList.remove('visible');return;}
  logPanel.classList.add('visible');
  logPanel.innerHTML=_actionLog.map(function(e){
    return '<span style="color:#333">'+e.t+'</span> '+
      '<span style="color:'+(e.ok?'#1a6a1a':'#6a1a1a')+'">&#8226;</span> '+
      '<span style="color:'+(e.ok?'#447744':'#774444')+'">'+e.short+'</span>'+
      (e.note?'<span style="color:#333"> → '+e.note+'</span>':'');
  }).join('<br>');
}

// ── Snapshot pour undo ──
function takeSnapshot(){
  try{
    var s={_ts:Date.now()};
    // Numériques globaux
    ['score','highScore','gold','lives','level','floor','stage','currentFloor',
     'currentDungeonFloor','currentLevel','wave','waveNumber','coins','gems',
     'playerGold','energy','mana','ammo'].forEach(function(n){
      if(typeof window[n]==='number')s[n]=window[n];
    });
    // gameState
    if(typeof gameState!=='undefined')s.gameState=gameState;
    // Joueur (plusieurs conventions)
    ['hero','player','ship','character'].forEach(function(pn){
      if(typeof window[pn]!=='undefined'&&window[pn]&&typeof window[pn]==='object'){
        var p=window[pn];
        s['_p_'+pn]={hp:p.hp,maxHp:p.maxHp,speed:p.speed,attack:p.attack||p.damage,
          defense:p.defense,mp:p.mp,maxMp:p.maxMp,level:p.level,xp:p.xp,
          x:p.x,y:p.y,invincibilityTimer:p.invincibilityTimer||0,
          classId:p.classId,vx:p.vx||0,vy:p.vy||0};
      }
    });
    // Longueurs des tableaux
    ['enemies','towers','loot','minions','projectiles','bullets','interactables',
     'powerups','particles'].forEach(function(n){
      if(typeof window[n]!=='undefined'&&Array.isArray(window[n]))s['_len_'+n]=window[n].length;
    });
    // playerStats si existe
    if(typeof playerStats!=='undefined'&&playerStats)
      s._playerStats=JSON.parse(JSON.stringify(playerStats));
    if(typeof activeBuffs!=='undefined'&&Array.isArray(activeBuffs))
      s._activeBuffs=JSON.parse(JSON.stringify(activeBuffs));
    return s;
  }catch(e){return null;}
}

function applySnapshot(s){
  if(!s)return false;
  var ok=false;
  try{
    ['score','highScore','gold','lives','level','floor','stage','currentFloor',
     'currentDungeonFloor','currentLevel','wave','waveNumber','coins','gems',
     'playerGold','energy','mana','ammo'].forEach(function(n){
      if(s[n]!==undefined&&typeof window[n]==='number'){window[n]=s[n];ok=true;}
    });
    if(s.gameState!==undefined&&typeof gameState!=='undefined'){gameState=s.gameState;ok=true;}
    ['hero','player','ship','character'].forEach(function(pn){
      var pk='_p_'+pn;
      if(s[pk]&&typeof window[pn]!=='undefined'&&window[pn]){
        var p=window[pn],sd=s[pk];
        ['hp','maxHp','speed','attack','defense','mp','maxMp','level','xp',
         'invincibilityTimer','classId','vx','vy'].forEach(function(f){
          if(sd[f]!==undefined)p[f]=sd[f];
        });
        ok=true;
      }
    });
    if(s._playerStats&&typeof playerStats!=='undefined'&&playerStats){
      Object.assign(playerStats,s._playerStats);ok=true;
    }
    if(s._activeBuffs&&typeof activeBuffs!=='undefined'&&Array.isArray(activeBuffs)){
      activeBuffs.length=0;s._activeBuffs.forEach(function(b){activeBuffs.push(b);});ok=true;
    }
  }catch(e){}
  return ok;
}

function pushSnapshot(snap){
  if(!snap)return;
  _snapshots.push(snap);
  if(_snapshots.length>MAX_UNDO)_snapshots.shift();
  undoBtn.disabled=false;
}

function updateUndoBtn(){undoBtn.disabled=_snapshots.length===0;}

undoBtn.addEventListener('click',function(){
  if(!_snapshots.length)return;
  var snap=_snapshots.pop();
  updateUndoBtn();
  var ok=applySnapshot(snap);
  var dt=Math.round((Date.now()-snap._ts)/1000);
  if(ok){setStatus('↩ Annulé (il y a '+dt+'s)','ok');}
  else{setStatus('⚠ Annulation partielle — les changements complexes (nouvelles fonctions, types) ne peuvent pas être annulés automatiquement','warn');}
});

// ── Context browser ──
ctxBtn.addEventListener('click',function(){
  if(ctxPanel.classList.contains('open')){
    ctxPanel.classList.remove('open');
    ctxBtn.classList.remove('active');
    ctxPanel.innerHTML='';
    return;
  }
  ctxBtn.classList.add('active');
  var ctx=collectContext();
  var lines=['<b style="color:#226622">═══ CONTEXTE EN TEMPS RÉEL ═══</b>'];
  Object.keys(ctx).forEach(function(k){
    var v=ctx[k];
    var vs=typeof v==='object'?JSON.stringify(v).slice(0,90):String(v);
    lines.push('<span style="color:#00cc55">'+k+'</span><span style="color:#224422">:</span> <span style="color:#88aa88">'+vs+'</span>');
  });
  if(lines.length===1)lines.push('<span style="color:#1a3a1a">Aucune variable standard détectée (jeu custom)</span>');
  ctxPanel.innerHTML=lines.join('<br>');
  ctxPanel.classList.add('open');
});

// ── Collecte du contexte runtime ──
function collectContext(){
  var ctx={};
  try{
    var stateNames=['gameState','state','currentState','phase','mode','screen'];
    stateNames.forEach(function(n){if(typeof window[n]!=='undefined')ctx[n]=window[n];});
    var scoreNames=['score','highScore','bestScore','gold','lives','level','floor','stage',
                    'currentFloor','currentDungeonFloor','currentLevel','wave','waveNumber',
                    'coins','gems','playerGold','energy','mana','ammo','kills'];
    scoreNames.forEach(function(n){if(typeof window[n]!=='undefined')ctx[n]=window[n];});
    ['hero','player','ship','character','pawn','tank'].forEach(function(pn){
      if(typeof window[pn]!=='undefined'&&window[pn]&&typeof window[pn]==='object'){
        var p=window[pn];
        ctx[pn]={hp:p.hp,maxHp:p.maxHp,x:Math.round(p.x||0),y:Math.round(p.y||0),
          speed:p.speed,level:p.level,attack:p.attack||p.damage||p.atk,
          defense:p.defense||p.def,mp:p.mp,maxMp:p.maxMp,classId:p.classId,
          invincible:!!(p.invincibilityTimer>0)};
      }
    });
    var arrNames=['enemies','towers','projectiles','bullets','particles','loot','interactables',
                  'minions','platforms','coins','items','obstacles','pieces','waves','powerups',
                  'skills','traps','buildings','npcs','allies'];
    arrNames.forEach(function(n){
      if(typeof window[n]!=='undefined'&&Array.isArray(window[n]))ctx[n+'_count']=window[n].length;
    });
    if(typeof window['boss']!=='undefined')ctx.bossAlive=window['boss']!==null;
    if(typeof window['bossGate']!=='undefined')ctx.bossGateOpen=!!(window['bossGate']&&window['bossGate'].open);
    if(typeof ENEMY_TYPES!=='undefined')ctx.enemyTypes=Object.keys(ENEMY_TYPES);
    if(typeof TOWER_TYPES!=='undefined')ctx.towerTypes=Object.keys(TOWER_TYPES);
    if(typeof ITEM_TYPES!=='undefined')ctx.itemTypes=Object.keys(ITEM_TYPES);
    if(typeof WEAPON_TYPES!=='undefined')ctx.weaponTypes=Object.keys(WEAPON_TYPES);
    if(typeof UPGRADE_TYPES!=='undefined')ctx.upgradeTypes=Object.keys(UPGRADE_TYPES);
    if(typeof HERO_CLASSES!=='undefined')ctx.heroClasses=HERO_CLASSES.map(function(c){return c.id+':'+c.name;});
    if(typeof CUSTOM_SKILLS!=='undefined')ctx.customSkills=Object.keys(CUSTOM_SKILLS);
    if(typeof CUSTOM_ATTACKS!=='undefined')ctx.customAttacks=Object.keys(CUSTOM_ATTACKS);
    var fnNames=['createEnemy','spawnBoss','generateDungeon','checkLevelUp','handleEnemyDefeat',
                 'spawnParticles','spawnFloatingText','triggerShake','createProjectile',
                 'placeTower','addTower','spawnEnemy','createTower','restartGame','resetGame',
                 'spawnWave','addPowerup','unlockSkill','applyKnockback','onBossDefeat',
                 'openShop','buyItem','saveGame','loadGame','generateLevel','nextWave',
                 'addUpgrade','applyUpgrade','createItem','dropLoot'];
    var avail=fnNames.filter(function(n){return typeof window[n]==='function';});
    if(avail.length)ctx.functions=avail;
    if(typeof playerInventory!=='undefined')ctx.inventory=playerInventory;
    if(typeof activeBuffs!=='undefined'&&Array.isArray(activeBuffs))ctx.buffs=activeBuffs.length;
    if(typeof TILE_SIZE!=='undefined')ctx.TILE_SIZE=TILE_SIZE;
    if(typeof MAP_W!=='undefined')ctx.MAP_W=MAP_W;
  }catch(e){}
  return ctx;
}

// ── Validation syntaxique client ──
function validateSyntax(code){
  var o=0,c=0,po=0,pc=0,bo=0,bc=0;
  for(var i=0;i<code.length;i++){
    var ch=code[i];
    if(ch==='{')o++;else if(ch==='}')c++;
    else if(ch==='(')po++;else if(ch===')')pc++;
    else if(ch==='[')bo++;else if(ch===']')bc++;
  }
  if(o!==c)return 'Accolades: '+o+' { pour '+c+' }';
  if(po!==pc)return 'Parenthèses: '+po+' ( pour '+pc+' )';
  if(bo!==bc)return 'Crochets: '+bo+' [ pour '+bc+' ]';
  return null;
}

// ── Exécution du code patché ──
function execCode(code,explanation){
  var synErr=validateSyntax(code);
  if(synErr){
    setStatus('⚠ Syntaxe invalide côté client: '+synErr+' — Le code ne sera pas exécuté.','err');
    return false;
  }
  try{
    if(typeof window.__devPatch==='function'){
      window.__devPatch(code);
    }else{
      // Fallback: new Function (n'accède pas aux vars locales du jeu)
      (new Function(code))();
    }
    var msg=explanation||'Patch appliqué !';
    setStatus('✅ '+msg,'ok');
    input.value='';
    return true;
  }catch(e){
    var msg=e.message||String(e);
    if(msg.indexOf('not defined')!==-1){
      var vn=(msg.split(' ')[0]||'').replace(/[^a-zA-Z0-9_]/g,'');
      msg='Variable "'+vn+'" introuvable dans ce jeu. Utilisez le bouton ctx pour voir ce qui est disponible.';
    }else if(msg.indexOf('is not a function')!==-1){
      msg='Fonction non disponible dans ce jeu: '+msg+'. Vérifiez ctx → functions.';
    }else if(msg.indexOf('Cannot read')!==-1||msg.indexOf('null')!==-1){
      msg='Accès à null/undefined: '+msg+' — Ajoutez une vérification if(variable) avant.';
    }else if(msg.indexOf('Assignment to constant')!==-1){
      msg="Impossible de modifier une constante (const). Passez par l'objet: ex TYPE.xxx au lieu de TYPE=...";
    }else if(msg.indexOf('Unexpected token')!==-1){
      msg='Erreur de syntaxe JS: '+msg;
    }
    setStatus('❌ '+msg,'err');
    return false;
  }
}

// ── Application d'un patch ──
async function applyPatch(){
  var prompt=input.value.trim();
  if(!prompt)return;
  if(_history[0]!==prompt){_history.unshift(prompt);if(_history.length>50)_history.pop();}
  _histIdx=-1;
  btn.disabled=true;
  hideGeneratedCode();
  setStatus('⏳ Génération en cours...','pending');
  var snap=takeSnapshot();
  try{
    var resp=await fetch('/api/game-patch',{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({filename:FILENAME,prompt:prompt,context:collectContext()})
    });
    if(!resp.ok){
      var errText=await resp.text();
      setStatus('❌ Erreur serveur '+resp.status+': '+errText.slice(0,80),'err');
      addLog(prompt,false,'HTTP '+resp.status);
      return;
    }
    var data=await resp.json();
    if(data.error){
      setStatus('❌ '+data.error,'err');
      addLog(prompt,false,data.error.slice(0,40));
    }else if(data.code){
      // Afficher le code avant l'exec (utile si l'exec plante)
      showGeneratedCode(data.code);
      var ok=execCode(data.code,data.explanation);
      if(ok){
        pushSnapshot(snap);
        addLog(prompt,true,data.explanation?data.explanation.slice(0,80):'');
      }else{
        // En cas d'erreur, garder le code visible automatiquement pour debug
        if(codePre)codePre.style.display='block';
        if(codeToggle)codeToggle.textContent='▼ masquer le code généré (erreur — vérifier la syntaxe)';
        addLog(prompt,false,'Erreur exec');
      }
    }else{
      setStatus('⚠ Réponse vide du serveur','warn');
      addLog(prompt,false,'réponse vide');
    }
  }catch(e){
    setStatus('❌ Réseau: '+e.message,'err');
    addLog(prompt,false,'réseau');
  }finally{btn.disabled=false;}
}

// ── Événements ──
btn.addEventListener('click',applyPatch);
input.addEventListener('keydown',function(e){
  if(e.code!=='Backquote'&&e.code!=='IntlBackslash')e.stopPropagation();
  if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();applyPatch();return;}
  if(e.key==='ArrowUp'&&!e.shiftKey&&_history.length){
    e.preventDefault();_histIdx=Math.min(_histIdx+1,_history.length-1);input.value=_history[_histIdx];
  }
  if(e.key==='ArrowDown'&&!e.shiftKey){
    e.preventDefault();_histIdx=Math.max(_histIdx-1,-1);input.value=_histIdx>=0?_history[_histIdx]:'';
  }
});
document.addEventListener('keydown',function(e){
  if(e.code==='Backquote'||e.code==='IntlBackslash'){
    e.preventDefault();
    if(panel.classList.contains('open')){
      panel.classList.remove('open');input.blur();
    }else{
      panel.classList.add('open');input.focus();
    }
  }
});
})();
</script>
