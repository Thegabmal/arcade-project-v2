function createPool(factory,size){const inactive=Array.from({length:size},factory),active=[];return{active,get(fn){const o=inactive.length>0?inactive.pop():factory();o.alive=true;if(fn)fn(o);active.push(o);return o;},update(fn){for(let i=active.length-1;i>=0;i--)if(!fn(active[i])){active[i].alive=false;inactive.push(active.splice(i,1)[0]);}},clear(){while(active.length){active[0].alive=false;inactive.push(active.shift());}}};}

const Particles=createPool(()=>({alive:false,x:0,y:0,vx:0,vy:0,life:0,maxLife:0,size:3,color:'#fff',gravity:0}),300);
function spawnParticles(x,y,count,opts){opts=opts||{};for(let i=0;i<count;i++){const a=opts.angle!==undefined?opts.angle+(Math.random()-0.5)*(opts.spread||Math.PI*2):Math.random()*Math.PI*2;const sp=opts.speed||(40+Math.random()*60);Particles.get(p=>{p.x=x;p.y=y;p.vx=Math.cos(a)*sp;p.vy=Math.sin(a)*sp;p.life=p.maxLife=opts.life||(0.3+Math.random()*0.4);p.size=opts.size||(2+Math.random()*3);p.color=opts.color||'#fff';p.gravity=opts.gravity!==undefined?opts.gravity:0;});}}

function randInt(a,b){return a+Math.floor(Math.random()*(b-a+1));}

function buildMap() {
  mapGrid = [];
  for (let r=0;r<GRID_ROWS;r++) {
    mapGrid[r]=[];
    for (let c=0;c<GRID_COLS;c++) {
      mapGrid[r][c]={type:0,tower:null}; // 0=buildable by default
    }
  }

  // Mark path cells as non-buildable
  for (let i=0;i<PATH_WAYPOINTS_GRID.length-1;i++) {
    const [c1,r1]=PATH_WAYPOINTS_GRID[i];
    const [c2,r2]=PATH_WAYPOINTS_GRID[i+1];
    const dc=Math.sign(c2-c1), dr=Math.sign(r2-r1);
    let cc=c1, rr=r1;
    while(cc!==c2||rr!==r2) {
      if(rr>=0&&rr<GRID_ROWS&&cc>=0&&cc<GRID_COLS) mapGrid[rr][cc].type=1;
      cc+=dc; rr+=dr;
    }
    if(r2>=0&&r2<GRID_ROWS&&c2>=0&&c2<GRID_COLS) mapGrid[r2][c2].type=1;
  }

  // Convert waypoints to pixel centers
  PATH = PATH_WAYPOINTS_GRID.map(([c,r])=>({
    x: GRID_X + c*TILE + TILE/2,
    y: GRID_Y + r*TILE + TILE/2,
  }));
}

function tileCenter(r,c){return{x:GRID_X+c*TILE+TILE/2,y:GRID_Y+r*TILE+TILE/2};}
function pixelToTile(px,py){return{r:Math.floor((py-GRID_Y)/TILE),c:Math.floor((px-GRID_X)/TILE)};}
function inMap(r,c){return r>=0&&r<GRID_ROWS&&c>=0&&c<GRID_COLS;}
function canBuild(r,c){return inMap(r,c)&&mapGrid[r][c].type===0&&!mapGrid[r][c].tower;}

function applyUpgrades(){_damageMultiplier=1+getUpgradeLevel('damage')*0.2;_goldBonus=getUpgradeLevel('gold')*25;gold=150+_goldBonus;lives=20+getUpgradeLevel('life')*3;}
function _shopHit(px,py,x,y,w,h){return px>=x&&px<=x+w&&py>=y&&py<=y+h;}
function updateGameover(dt){_gameoverTimer-=dt;if(_gameoverTimer<=0||anyAction()){_meta.coins+=_runCoins;saveMeta();_shopIdx=0;setState('shop');}}
function updateShop(dt){if(!Pointer.justDown)return;const n=UPGRADES.length,cardW=Math.round(W*0.19),cardH=Math.round(H*0.32),gap=Math.round(W*0.02);const sy=Math.round(H*0.22),totalW=n*cardW+(n-1)*gap,sx=(W-totalW)/2;for(let i=0;i<n;i++){if(_shopHit(Pointer.x,Pointer.y,sx+i*(cardW+gap),sy,cardW,cardH)){_shopIdx=i;if(buyUpgrade(UPGRADES[i].id)){sfx.play(660,0.12,'sine',0.1);applyUpgrades();}else sfx.play(110,0.06,'sawtooth',0.08);return;}}const btnW=160,btnH=42,btnX=(W-btnW)/2,btnY=sy+cardH+32;if(_shopHit(Pointer.x,Pointer.y,btnX,btnY,btnW,btnH)){sfx.play(440,0.08,'square',0.1);startGame();setState('playing');}}
function renderShop(){ctx.fillStyle=PALETTE.shopBg;ctx.fillRect(0,0,W,H);ctx.textAlign='center';ctx.fillStyle='#fff';ctx.font='bold 22px system-ui,sans-serif';ctx.fillText('UPGRADE SHOP',W/2,Math.round(H*0.12));ctx.fillStyle='#ffdd00';ctx.font='bold 15px system-ui,sans-serif';ctx.fillText(`🪙 ${_meta.coins} coins`,W/2,Math.round(H*0.19));const n=UPGRADES.length,cardW=Math.round(W*0.19),cardH=Math.round(H*0.32),gap=Math.round(W*0.02);const sy=Math.round(H*0.22),totalW=n*cardW+(n-1)*gap,sx=(W-totalW)/2;for(let i=0;i<n;i++){const u=UPGRADES[i],lv=getUpgradeLevel(u.id),cx=sx+i*(cardW+gap);ctx.fillStyle=_shopIdx===i?PALETTE.shopSel:PALETTE.shopCard;ctx.beginPath();if(ctx.roundRect)ctx.roundRect(cx,sy,cardW,cardH,8);else ctx.rect(cx,sy,cardW,cardH);ctx.fill();ctx.fillStyle='#fff';ctx.font='bold 11px system-ui,sans-serif';ctx.fillText(u.label,cx+cardW/2,sy+22);ctx.fillStyle='#aaa';ctx.font='10px system-ui,sans-serif';ctx.fillText(u.desc,cx+cardW/2,sy+38);ctx.fillStyle='#ffdd00';for(let d=0;d<u.maxLv;d++){ctx.fillStyle=d<lv?'#ffdd00':'#444';ctx.beginPath();ctx.arc(cx+cardW/2+(d-u.maxLv/2+0.5)*14,sy+cardH-36,5,0,Math.PI*2);ctx.fill();}if(lv<u.maxLv){ctx.fillStyle='#ffdd00';ctx.font='bold 12px system-ui,sans-serif';ctx.fillText(`${u.cost[lv]}🪙`,cx+cardW/2,sy+cardH-14);}else{ctx.fillStyle='#0f0';ctx.font='bold 11px system-ui,sans-serif';ctx.fillText('MAX',cx+cardW/2,sy+cardH-14);}}const btnW=160,btnH=42,btnX=(W-btnW)/2,btnY=sy+cardH+32;ctx.fillStyle='#2a6a2a';ctx.beginPath();if(ctx.roundRect)ctx.roundRect(btnX,btnY,btnW,btnH,8);else ctx.rect(btnX,btnY,btnW,btnH);ctx.fill();ctx.fillStyle='#fff';ctx.font='bold 16px system-ui,sans-serif';ctx.fillText('PLAY',W/2,btnY+27);ctx.textAlign='left';}

// ══════════════════════════════════════════════════════════════════
// GAME INIT
// ══════════════════════════════════════════════════════════════════
loadMeta();
function startGame() {
  loadMeta(); _runCoins=0; _gameoverTimer=1.5;
  buildMap();
  towers.length=0; enemyPool.clear(); projPool.clear(); Popups.length=0;
  gold=150; lives=20; waveIndex=0; score=0;
  spawner.active=false; spawner.groups=[]; spawner.groupIdx=0; spawner.spawnCount=0; spawner.spawnTimer=0;
  selectedTowerType='arrow';
  applyUpgrades();
  startWave(0);
}

function startWave(idx) {
  if (idx>=WAVES.length) { setState('victory'); return; }
  waveIndex=idx;
  spawner.groups=[...WAVES[idx].map(g=>({...g}))];
  spawner.groupIdx=0; spawner.spawnCount=0; spawner.spawnTimer=1.5;
  spawner.active=true;
}

function spawnEnemy(type) {
  const def=ENEMY_TYPES[type]||ENEMY_TYPES.grunt;
  enemyPool.get(e=>{
    e.type=type; e.color=def.color; e.size=def.size;
    e.hp=e.maxHp=def.hp + Math.floor(waveIndex*def.hp*0.15);
    e.speed=e.baseSpeed=def.speed; e.reward=def.reward; e.armor=def.armor||0;
    e.pathIdx=0; e.pathProgress=0;
    e.x=PATH[0].x; e.y=PATH[0].y;
    e.slowTimer=0; e.slowFactor=0; e.flashTimer=0; e.angle=0;
  });
}

// ══════════════════════════════════════════════════════════════════
// TOWER TARGETING — DO NOT MODIFY
// ══════════════════════════════════════════════════════════════════
function getTarget(tower) {
  // Strategy: first enemy on path (highest pathProgress)
  let best=null, bestProg=-1;
  enemyPool.active.forEach(e=>{
    if(!e.alive) return;
    const d=dist(tower.x,tower.y,e.x,e.y);
    if(d<=tower.range && e.pathProgress>bestProg) { best=e; bestProg=e.pathProgress; }
  });
  return best;
}

function towerFire(tower, dt) {
  tower.fireTimer=Math.max(0,tower.fireTimer-dt);
  if(tower.fireTimer>0) return;
  const def=TOWER_TYPES[tower.type];
  const target=getTarget(tower);
  if(!target) return;
  tower.fireTimer=1/def.rate;

  if(tower.type==='lightning') {
    // Instant chain — deal damage to up to 3 nearest in range
    let targets=[target];
    enemyPool.active.forEach(e=>{if(e!==target&&e.alive&&dist(tower.x,tower.y,e.x,e.y)<=def.range)targets.push(e);});
    targets=targets.slice(0,3);
    targets.forEach(e=>{
      const dmg=Math.max(1,def.damage-e.armor);
      e.hp-=dmg; e.flashTimer=0.07;
      spawnParticles(e.x,e.y,4,{color:'#ff0',speed:50,life:0.25,gravity:0});
      if(e.hp<=0) killEnemy(e);
    });
    sfx.play(880,0.06,'sawtooth',0.05);
    return;
  }

  // Projectile
  const dx=target.x-tower.x, dy=target.y-tower.y, len=Math.hypot(dx,dy)||1;
  projPool.get(p=>{
    p.x=tower.x; p.y=tower.y;
    p.vx=dx/len*def.projSpeed; p.vy=dy/len*def.projSpeed;
    p.damage=def.damage; p.splash=def.splash||0;
    p.slowFactor=def.slowFactor||0;
    p.color=def.color; p.type=tower.type; p.life=3;
    p.targetId=target; // soft reference for homing
  });
  sfx.play(tower.type==='cannon'?180:tower.type==='magic'?660:440, 0.05, 'square', 0.05);
}

function killEnemy(e) {
  gold+=e.reward; score+=e.reward*10;
  spawnParticles(e.x,e.y,10,{color:e.color,speed:65,life:0.4,gravity:80});
  spawnPopup(e.x,e.y-10,`+${e.reward}g`,PALETTE.gold,11);
  e.alive=false;
}

// ══════════════════════════════════════════════════════════════════
// UPDATE
// ══════════════════════════════════════════════════════════════════
function updatePlaying(dt) {
  // ── Spawner ───────────────────────────────────────────────────
  if (spawner.active) {
    spawner.spawnTimer-=dt;
    if(spawner.spawnTimer<=0&&spawner.groupIdx<spawner.groups.length) {
      const group=spawner.groups[spawner.groupIdx];
      if(spawner.spawnCount<group.count) {
        spawnEnemy(group.type);
        spawner.spawnCount++;
        spawner.spawnTimer=group.interval;
      } else {
        spawner.groupIdx++; spawner.spawnCount=0; spawner.spawnTimer=0.5;
      }
    }
    if(spawner.groupIdx>=spawner.groups.length&&enemyPool.active.length===0) {
      spawner.active=false;
      gold+=30+(waveIndex*5); // inter-wave bonus
      spawnPopup(W/2,H/2-40,`WAVE CLEAR! +${30+waveIndex*5}g`,PALETTE.accent,16);
      setState('waveclear');
    }
  }

  // ── Enemy movement (path-following) ──────────────────────────
  enemyPool.update(e=>{
    e.flashTimer=Math.max(0,e.flashTimer-dt);
    // Slow effect
    e.slowTimer=Math.max(0,e.slowTimer-dt);
    const spd=e.slowTimer>0?e.speed*(1-e.slowFactor):e.speed;

    // Walk toward current waypoint
    if(e.pathIdx>=PATH.length){lives--;spawnPopup(W/2,H/2,'ENEMY ESCAPED!','#f44',16);sfx.play(110,0.2,'sawtooth',0.14);if(lives<=0){saveHiScore(score);_runCoins=Math.floor(score/200);_gameoverTimer=1.5;setState('gameover');}return false;}
    const wp=PATH[e.pathIdx];
    const dx=wp.x-e.x,dy=wp.y-e.y,d=Math.hypot(dx,dy);
    if(d<spd*dt+2){e.x=wp.x;e.y=wp.y;e.pathIdx++;e.pathProgress=e.pathIdx;}
    else{const step=spd*dt/d;e.x+=dx*step;e.y+=dy*step;e.pathProgress=e.pathIdx+(1-d/TILE);e.angle=Math.atan2(dy,dx);}
    return e.y<H+60;
  });

  // ── Projectiles ───────────────────────────────────────────────
  projPool.update(p=>{
    p.life-=dt;
    if(p.life<=0) return false;
    // Homing (gentle)
    if(p.targetId&&p.targetId.alive) {
      const dx=p.targetId.x-p.x,dy=p.targetId.y-p.y,len=Math.hypot(dx,dy)||1;
      const speed=Math.hypot(p.vx,p.vy);
      p.vx=lerp(p.vx,dx/len*speed,dt*5);
      p.vy=lerp(p.vy,dy/len*speed,dt*5);
    }
    p.x+=p.vx*dt; p.y+=p.vy*dt;
    // Hit check
    let hit=false;
    enemyPool.active.forEach(e=>{
      if(!e.alive||hit) return;
      if(dist(p.x,p.y,e.x,e.y)<e.size+5){
        hit=true;
        if(p.splash>0){
          enemyPool.active.forEach(e2=>{if(!e2.alive)return;if(dist(p.x,p.y,e2.x,e2.y)<p.splash){const d=Math.max(1,p.damage-e2.armor);e2.hp-=d;e2.flashTimer=0.07;if(e2.hp<=0)killEnemy(e2);}});
          spawnParticles(p.x,p.y,14,{color:'#f80',speed:70,life:0.5,gravity:80});
        } else {
          const d=Math.max(1,p.damage-e.armor); e.hp-=d; e.flashTimer=0.07;
          if(p.slowFactor>0){e.slowTimer=2.5;e.slowFactor=p.slowFactor;}
          if(e.hp<=0) killEnemy(e);
        }
        spawnParticles(p.x,p.y,5,{color:p.color,speed:50,life:0.25,gravity:60});
      }
    });
    return !hit&&p.x>-20&&p.x<W+20&&p.y>-20&&p.y<H+20;
  });

  // ── Towers fire ───────────────────────────────────────────────
  towers.forEach(t=>towerFire(t,dt));

  // ── Player input — tower placement ────────────────────────────
  const {r,c}=pixelToTile(Pointer.x,Pointer.y);
  hoveredCell={r,c};

  if (Pointer.justDown && inMap(r,c) && Pointer.y<GRID_ROWS*TILE) {
    if (canBuild(r,c)) {
      const def=TOWER_TYPES[selectedTowerType];
      if(gold>=def.cost) {
        gold-=def.cost;
        const {x,y}=tileCenter(r,c);
        const tower={x,y,r,c,type:selectedTowerType,range:def.range,fireTimer:0,level:1};
        towers.push(tower);
        mapGrid[r][c].tower=tower;
        sfx.play(660,0.08,'square',0.09);
      } else {
        spawnPopup(Pointer.x,Pointer.y,'Not enough gold!','#f44',12);
      }
    } else if (mapGrid[r][c].tower) {
      // [FILL: tower upgrade / sell on right-click or double-tap]
    }
  }

  // Tower type selection shortcuts
  if(keyPressed('Digit1')) selectedTowerType='arrow';
  if(keyPressed('Digit2')) selectedTowerType='cannon';
  if(keyPressed('Digit3')) selectedTowerType='magic';
  if(keyPressed('Digit4')) selectedTowerType='lightning';
}

let waveClearTimer=0;
function updateWaveClear(dt) {
  waveClearTimer+=dt;
  if(waveClearTimer>=3.0||Pointer.justDown) {
    waveClearTimer=0;
    startWave(waveIndex+1);
    setState('playing');
  }
}

// ══════════════════════════════════════════════════════════════════
// RENDER
// ══════════════════════════════════════════════════════════════════
function renderMenu() {
  ctx.fillStyle=PALETTE.bg; ctx.fillRect(0,0,W,H);
  ctx.textAlign='center';
  ctx.fillStyle=PALETTE.accent; ctx.font='bold 30px system-ui,sans-serif'; ctx.fillText(GAME_TITLE,W/2,H*0.32);
  ctx.fillStyle='#aaa'; ctx.font='12px system-ui,sans-serif'; ctx.fillText('Click/Tap buildable tiles to place towers',W/2,H*0.46);
  ctx.fillText('Keys 1-4 to switch tower type',W/2,H*0.53);
  if(_meta.coins>0){ctx.fillStyle='#ffdd00';ctx.font='bold 13px system-ui,sans-serif';ctx.fillText(`🪙 ${_meta.coins} coins`,W/2,H*0.60);}
  ctx.fillStyle='#fff'; ctx.font='bold 16px system-ui,sans-serif'; ctx.fillText('TAP to start',W/2,H*0.67);

}

function renderGameoverOverlay(){ctx.fillStyle='rgba(0,0,0,0.75)';ctx.fillRect(0,0,W,H);ctx.textAlign='center';ctx.fillStyle='#f44';ctx.font='bold 34px system-ui,sans-serif';ctx.fillText('DEFEAT',W/2,H*0.35);ctx.fillStyle='#fff';ctx.font='bold 18px system-ui,sans-serif';ctx.fillText(`SCORE: ${score}`,W/2,H*0.45);if(_runCoins>0){ctx.fillStyle='#ffdd00';ctx.font='bold 14px system-ui,sans-serif';ctx.fillText(`🪙 ${_runCoins} coins earned`,W/2,H*0.54);}ctx.fillStyle='#aaa';ctx.font='13px system-ui,sans-serif';ctx.fillText('Waiting for shop...',W/2,H*0.63);ctx.textAlign='left';}
function renderVictoryOverlay(){ctx.fillStyle='rgba(0,0,0,0.65)';ctx.fillRect(0,0,W,H);drawText('VICTORY!',W/2,H*0.35,'#ff0',34,'center');drawText(`SCORE: ${score}`,W/2,H*0.47,'#fff',18,'center');drawText('TAP to play again',W/2,H*0.60,'#aaa',13,'center');}

function renderPlaying() {
  ctx.fillStyle=PALETTE.bg; ctx.fillRect(0,0,W,H);

  // ── Grid tiles ────────────────────────────────────────────────
  for(let r=0;r<GRID_ROWS;r++) for(let c=0;c<GRID_COLS;c++) {
    const cell=mapGrid[r][c];
    const x=GRID_X+c*TILE, y=GRID_Y+r*TILE;
    if(cell.type===1) {
      ctx.fillStyle=PALETTE.path; ctx.fillRect(x,y,TILE,TILE);
      ctx.strokeStyle=PALETTE.pathEdge; ctx.lineWidth=0.5; ctx.strokeRect(x,y,TILE,TILE);
    } else {
      ctx.fillStyle=cell.tower?PALETTE.blocked:PALETTE.buildable; ctx.fillRect(x,y,TILE,TILE);
      ctx.strokeStyle='rgba(0,0,0,0.2)'; ctx.lineWidth=0.5; ctx.strokeRect(x,y,TILE,TILE);
    }
  }

  // ── Hover highlight ───────────────────────────────────────────
  const {r:hr,c:hc}=hoveredCell;
  if(inMap(hr,hc)&&canBuild(hr,hc)) {
    const def=TOWER_TYPES[selectedTowerType];
    const x=GRID_X+hc*TILE, y=GRID_Y+hr*TILE;
    ctx.fillStyle=gold>=def.cost?'rgba(255,255,255,0.15)':'rgba(255,0,0,0.12)';
    ctx.fillRect(x,y,TILE,TILE);
    // Range preview
    const {x:cx,y:cy}=tileCenter(hr,hc);
    ctx.strokeStyle=gold>=def.cost?'rgba(255,255,255,0.25)':'rgba(255,0,0,0.2)';
    ctx.lineWidth=1; ctx.setLineDash([4,4]);
    ctx.beginPath(); ctx.arc(cx,cy,def.range,0,Math.PI*2); ctx.stroke();
    ctx.setLineDash([]);
  }

  // ── Path arrows (visual guide) ────────────────────────────────
  ctx.strokeStyle='rgba(255,255,255,0.12)'; ctx.lineWidth=2; ctx.setLineDash([6,8]);
  ctx.beginPath(); PATH.forEach((p,i)=>i===0?ctx.moveTo(p.x,p.y):ctx.lineTo(p.x,p.y)); ctx.stroke();
  ctx.setLineDash([]);

  // ── Towers ────────────────────────────────────────────────────
  towers.forEach(t=>{
    const def=TOWER_TYPES[t.type];
    // Base
    ctx.fillStyle=def.color2||'#444';
    ctx.beginPath(); ctx.arc(t.x,t.y,TILE/2-4,0,Math.PI*2); ctx.fill();
    // Head / barrel
    ctx.fillStyle=def.color;
    ctx.beginPath(); ctx.arc(t.x,t.y,TILE/2-9,0,Math.PI*2); ctx.fill();
    // [FILL: draw barrel pointing toward last target direction]
    ctx.fillStyle='#fff'; ctx.font='9px monospace'; ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.fillText(def.name[0],t.x,t.y);
    ctx.textBaseline='alphabetic';
    // Cost/level indicator
    drawText(`${def.cost}g`,t.x,t.y+TILE/2-1,'#ccc',8,'center');
  });

  // ── Enemies ───────────────────────────────────────────────────
  enemyPool.active.forEach(e=>{
    ctx.globalAlpha=e.flashTimer>0?0.4:1.0;
    ctx.fillStyle=e.slowTimer>0?'#88aaff':e.color;
    ctx.shadowBlur=e.type==='boss'?12:0; ctx.shadowColor=e.color;
    ctx.beginPath(); ctx.arc(e.x,e.y,e.size,0,Math.PI*2); ctx.fill();
    ctx.shadowBlur=0; ctx.globalAlpha=1;
    // HP bar
    drawBar(e.x-e.size,e.y-e.size-6,e.size*2,4,e.hp,e.maxHp,'#0f0','#300');
    // [FILL: draw enemy type icon or shape]
  });

  // ── Projectiles ───────────────────────────────────────────────
  projPool.active.forEach(p=>{
    ctx.fillStyle=p.color;
    if(p.type==='cannon'){ctx.beginPath();ctx.arc(p.x,p.y,5,0,Math.PI*2);ctx.fill();}
    else if(p.type==='magic'){ctx.shadowBlur=8;ctx.shadowColor=p.color;ctx.beginPath();ctx.arc(p.x,p.y,4,0,Math.PI*2);ctx.fill();ctx.shadowBlur=0;}
    else{ctx.fillRect(p.x-3,p.y-3,6,6);}
  });

  // ── HUD ───────────────────────────────────────────────────────
  const hudY=GRID_ROWS*TILE;
  ctx.fillStyle='#111'; ctx.fillRect(0,hudY,W,H-hudY);

  // Gold & lives
  drawText(`⚜ ${gold}g`,10,hudY+20,PALETTE.gold,14);
  drawText(`♥ ${lives}`,100,hudY+20,'#f44',14);
  drawText(`WAVE ${waveIndex+1}/${WAVES.length}`,W/2,hudY+20,'#aaa',13,'center');
  drawText(`SCORE: ${score}`,W-10,hudY+20,PALETTE.ui,13,'right');

  // Tower selector
  let tx=10;
  TOWER_KEYS.forEach((key,i)=>{
    const def=TOWER_TYPES[key];
    const sel=key===selectedTowerType;
    const canAfford=gold>=def.cost;
    ctx.fillStyle=sel?def.color:'#333';
    ctx.beginPath(); ctx.roundRect(tx,hudY+30,65,28,4); ctx.fill();
    ctx.strokeStyle=sel?'#fff':'transparent'; ctx.lineWidth=1.5; ctx.strokeRect(tx,hudY+30,65,28);
    drawText(`[${i+1}] ${def.name}`,tx+4,hudY+43,canAfford?'#fff':'#666',10);
    drawText(`${def.cost}g`,tx+4,hudY+55,canAfford?PALETTE.gold:'#555',9);
    tx+=70;
  });

  // Wave state
  if(gameState==='waveclear') {
    ctx.fillStyle='rgba(0,0,0,0.5)'; ctx.fillRect(0,hudY,W,H-hudY);
    drawText(`NEXT WAVE IN ${Math.ceil(3-waveClearTimer)}s — TAP to skip`,W/2,hudY+35,'#ff0',13,'center');
  }
}
