// ─── PLAYER ───────────────────────────────────────────────────────────────────
var player = {
    tx: 10, ty: 8,
    x: 10*TILE, y: 8*TILE,
    // Pixel-smooth movement
    moving: false, moveTimer: 0, moveDur: 0.14,
    dx: 0, dy: 0,
    // Stats
    name: 'Hero',
    hp: 50, maxHp: 50,
    atk: 5, def: 2, spd: 5,
    level: 1, xp: 0, xpNext: 30,
    gold: 10,
    // Equipment
    weapon: {name:'Wooden Sword', atk:1, icon:'⚔'},
    armor:  {name:'Cloth Robe',   def:0, icon:'🥋'},
    // Inventory
    inventory: [],
    // State
    facing: 'down',
    invTimer: 0,
    attackTimer: 0,
    attacking: false,
    floor: 0,
};

// ─── RUNTIME STATE ────────────────────────────────────────────────────────────
var currentFloor = 0;
var gameState = 'explore';   // 'explore' | 'dialog' | 'combat' | 'inventory' | 'gameover' | 'win'
var enemies   = [];
var chests    = [];
var npcs      = [];
var floatTexts = [];  // floating damage numbers

// ─── COMBAT STATE ─────────────────────────────────────────────────────────────
var combat = null;
/*  combat = {
      enemy: {...},
      phase: 'player_turn' | 'enemy_turn' | 'player_anim' | 'enemy_anim' | 'reward',
      log: [strings],
      timer: float,
      shake: float,
      rewardItem: null|item,
    }
*/

// ─── DIALOG STATE ─────────────────────────────────────────────────────────────
var dialog = { npc: null, lineIdx: 0 };

// ─── TILE CACHE ───────────────────────────────────────────────────────────────
var tileCache = {};
function makeTile(type) {
    var key = type;
    if (tileCache[key]) return tileCache[key];
    var tc = document.createElement('canvas'); tc.width = TILE; tc.height = TILE;
    var c = tc.getContext('2d'); var T = TILE;
    if (type===0) {
        c.fillStyle = '#2a3a2a'; c.fillRect(0,0,T,T);
        c.fillStyle = '#1e2e1e'; c.fillRect(0,0,T,2); c.fillRect(0,0,2,T);
    } else if (type===1) {
        var g = c.createLinearGradient(0,0,0,T);
        g.addColorStop(0,'#4a4a5a'); g.addColorStop(1,'#2a2a3a');
        c.fillStyle = g; c.fillRect(0,0,T,T);
        c.fillStyle = '#5a5a6a'; c.fillRect(0,0,T,3);
        c.fillStyle = '#1a1a2a'; c.fillRect(0,T-3,T,3);
        c.fillStyle = '#3a3a4a'; c.fillRect(2,4,T-4,T-8);
    } else if (type===2) {
        c.fillStyle = '#0a3a6a'; c.fillRect(0,0,T,T);
        c.fillStyle = '#0a4a7a'; c.fillRect(5,8,T-10,4); c.fillRect(8,16,T-16,4);
    } else if (type===3) {
        c.fillStyle = '#7b3f00'; c.fillRect(2,T/2,T-4,T/2-2);
        c.fillStyle = '#5d2e00'; c.fillRect(4,T/2+2,T-8,T/2-6);
        c.fillStyle = '#ffd700'; c.fillRect(T/2-6,T/2-4,12,10);
        c.fillStyle = '#c0a000'; c.fillRect(T/2-3,T/2-2,6,6);
    } else if (type===4) {
        c.fillStyle = '#5d2e00'; c.fillRect(0,0,T,T);
        c.fillStyle = '#8b5e3c'; c.fillRect(4,4,T-8,T-8);
        c.fillStyle = '#ffd700'; c.fillRect(T/2-2,T/2-6,4,12);
    } else if (type===5) {
        c.fillStyle = '#333'; c.fillRect(0,0,T,T);
        c.fillStyle = '#555'; c.beginPath(); c.arc(T/2,T/2,T/2-4,0,Math.PI*2); c.fill();
        c.fillStyle = '#111'; c.beginPath(); c.arc(T/2,T/2,T/4,0,Math.PI*2); c.fill();
        c.fillStyle = '#aaa';
        c.font = '14px monospace'; c.textAlign = 'center'; c.textBaseline = 'middle';
        c.fillText('▼', T/2, T/2);
    } else if (type===7) {
        c.fillStyle = '#1a0000'; c.fillRect(0,0,T,T);
        c.fillStyle = '#cc2200'; c.fillRect(5,T-10,T-10,8);
        c.fillStyle = '#ff4400'; c.fillRect(8,T-16,T-16,6);
        c.fillStyle = '#ff8800'; c.fillRect(12,T-20,T-24,4);
    }
    tileCache[key] = tc;
    return tc;
}

// ─── CAMERA ───────────────────────────────────────────────────────────────────
var camX = 0, camY = 0;
function updateCamera() {
    camX = player.x - W/2 + TILE/2;
    camY = player.y - (H-60)/2 + TILE/2;
    var maxX = MAP_W*TILE - W;
    var maxY = MAP_H*TILE - (H-60);
    camX = Math.max(0, Math.min(maxX, camX));
    camY = Math.max(0, Math.min(maxY, camY));
}

// ─── FLOOR LOAD ───────────────────────────────────────────────────────────────
function loadFloor(floorIdx) {
    currentFloor = floorIdx;
    var def = FLOORS[floorIdx];
    // Deep-copy enemies
    enemies = def.enemies.map(function(e) {
        return Object.assign({}, e, {
            x: e.tx*TILE, y: e.ty*TILE,
            alive: true, moveTimer: 0, moveDur: 0.4,
            patrolTimer: rnd(1,3),
            aggroRange: 4,
        });
    });
    // Deep-copy chests
    chests = def.chests.map(function(c) {
        return Object.assign({}, c, { opened: false });
    });
    npcs = def.npcs ? def.npcs.map(function(n) { return Object.assign({},n); }) : [];
    player.tx = def.playerStart.tx;
    player.ty = def.playerStart.ty;
    player.x  = player.tx * TILE;
    player.y  = player.ty * TILE;
}

// ─── INPUT ────────────────────────────────────────────────────────────────────
var keys = {};
var keyJust = {};
document.addEventListener('keydown', function(e) {
    if (!keys[e.code]) keyJust[e.code] = true;
    keys[e.code] = true;
    if (['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Space'].includes(e.code)) e.preventDefault();
});
document.addEventListener('keyup', function(e) { keys[e.code] = false; });

// ─── HELPERS ──────────────────────────────────────────────────────────────────
function rnd(a,b){ return a + Math.random()*(b-a); }
function tileAt(tx,ty){ var fl = FLOORS[currentFloor]; return (fl.map[ty]||[])[tx]||1; }

function addFloatText(x, y, text, color) {
    floatTexts.push({ x:x, y:y, text:text, color:color||'#fff', life:1.2, vy:-40 });
}

// ─── COMBAT ───────────────────────────────────────────────────────────────────
function startCombat(enemy) {
    gameState = 'combat';
    combat = {
        enemy: enemy,
        phase: 'player_turn',
        log: ['A ' + enemy.type + ' appears!'],
        timer: 0,
        shake: 0,
        rewardItem: null,
    };
}

function playerAttack() {
    if (combat.phase !== 'player_turn') return;
    var totalAtk = player.atk + (player.weapon ? player.weapon.atk : 0);
    var dmg = Math.max(1, totalAtk - Math.floor(combat.enemy.def||0) + Math.floor(rnd(-1,3)));
    combat.enemy.hp -= dmg;
    combat.log.push('You attack for ' + dmg + ' damage!');
    combat.shake = 0.2;
    addFloatText(300, 120, '-'+dmg, '#ff6d00');
    if (combat.enemy.hp <= 0) {
        combat.enemy.hp = 0;
        endCombat();
    } else {
        combat.phase = 'enemy_turn';
        combat.timer = 0.7;
    }
}

function usePotion() {
    if (combat.phase !== 'player_turn') return;
    var idx = player.inventory.findIndex(function(i){ return i.type==='potion'; });
    if (idx === -1) { combat.log.push('No potions!'); return; }
    var pot = player.inventory.splice(idx, 1)[0];
    var heal = Math.min(pot.heal, player.maxHp - player.hp);
    player.hp += heal;
    combat.log.push('You drink ' + pot.name + ' and restore ' + heal + ' HP!');
    addFloatText(150, 250, '+'+heal, '#4caf50');
    combat.phase = 'enemy_turn';
    combat.timer = 0.7;
}

function enemyAttack() {
    if (!combat) return;
    var totalDef = player.def + (player.armor ? player.armor.def : 0);
    var dmg = Math.max(1, combat.enemy.atk - totalDef + Math.floor(rnd(-1,3)));
    player.hp -= dmg;
    combat.log.push(combat.enemy.type + ' attacks for ' + dmg + ' damage!');
    combat.shake = 0.25;
    addFloatText(150, 260, '-'+dmg, '#ff1744');
    if (player.hp <= 0) {
        player.hp = 0;
        combat.log.push('You were defeated...');
        combat.timer = 1.5;
        combat.phase = 'defeat';
    } else {
        combat.phase = 'player_turn';
    }
}

function tryFlee() {
    if (rnd(0,1) < 0.4) {
        combat.log.push('You fled successfully!');
        combat = null;
        gameState = 'explore';
    } else {
        combat.log.push('Could not escape!');
        combat.phase = 'enemy_turn';
        combat.timer = 0.7;
    }
}

function endCombat() {
    var e = combat.enemy;
    player.xp += e.xp;
    player.gold += e.gold;
    combat.log.push('Victory! +' + e.xp + ' XP, +' + e.gold + ' gold.');
    e.alive = false;
    // Check level up
    while (player.xp >= player.xpNext) {
        player.xp -= player.xpNext;
        player.level++;
        player.maxHp += 15;
        player.hp = Math.min(player.hp + 20, player.maxHp);
        player.atk += 2; player.def += 1;
        player.xpNext = Math.floor(player.xpNext * 1.5);
        combat.log.push('LEVEL UP! Now level ' + player.level + '!');
    }
    combat.phase = 'reward';
    combat.timer = 1.0;
}

// ─── UPDATE ───────────────────────────────────────────────────────────────────
var lastTime = 0;
function update(dt) {
    // Float texts
    for (var i = floatTexts.length-1; i >= 0; i--) {
        var ft = floatTexts[i];
        ft.y += ft.vy * dt; ft.life -= dt;
        if (ft.life <= 0) floatTexts.splice(i,1);
    }

    if (gameState === 'dialog') {
        if (keyJust['Space'] || keyJust['KeyE'] || keyJust['Enter']) {
            dialog.lineIdx++;
            if (dialog.lineIdx >= dialog.npc.dialog.length) {
                gameState = 'explore';
                dialog.npc = null;
            }
        }
        keyJust = {};
        return;
    }

    if (gameState === 'combat') {
        if (combat.shake > 0) combat.shake -= dt;
        if (combat.timer > 0) {
            combat.timer -= dt;
            if (combat.timer <= 0) {
                if (combat.phase === 'enemy_turn') enemyAttack();
                if (combat.phase === 'reward') { combat = null; gameState = 'explore'; }
                if (combat.phase === 'defeat') { gameState = 'gameover'; combat = null; }
            }
        }
        if (combat && combat.phase === 'player_turn') {
            if (keyJust['KeyA'] || keyJust['Space'] || keyJust['KeyZ']) playerAttack();
            if (keyJust['KeyD'] || keyJust['KeyP'])                      usePotion();
            if (keyJust['Escape'] || keyJust['KeyF'])                    tryFlee();
        }
        keyJust = {};
        return;
    }

    if (gameState === 'explore') {
        if (player.invTimer > 0) player.invTimer -= dt;
        if (player.attackTimer > 0) player.attackTimer -= dt;

        // Player movement
        if (!player.moving) {
            var ndx = 0, ndy = 0;
            if      (keys['ArrowUp']    || keys['KeyW']) { ndy=-1; player.facing='up'; }
            else if (keys['ArrowDown']  || keys['KeyS']) { ndy= 1; player.facing='down'; }
            else if (keys['ArrowLeft']  || keys['KeyA']) { ndx=-1; player.facing='left'; }
            else if (keys['ArrowRight'] || keys['KeyD']) { ndx= 1; player.facing='right'; }

            if (ndx!==0 || ndy!==0) {
                var ntx = player.tx + ndx, nty = player.ty + ndy;
                var tile = tileAt(ntx, nty);

                // Check NPC interaction
                var npcAt = npcs.find(function(n){ return n.tx===ntx && n.ty===nty; });
                if (npcAt) { gameState='dialog'; dialog.npc=npcAt; dialog.lineIdx=0; return; }

                // Check chest
                var chestAt = chests.find(function(c){ return c.tx===ntx && c.ty===nty && !c.opened; });
                if (chestAt) {
                    chestAt.opened = true;
                    player.inventory.push(chestAt.item);
                    addFloatText(player.x-camX, player.y-camY-20, 'Got '+chestAt.item.icon+' '+chestAt.item.name, '#ffd700');
                    return;
                }

                // Check stairs
                if (tile === 5) {
                    if (currentFloor + 1 < FLOORS.length) {
                        loadFloor(currentFloor + 1);
                    } else {
                        gameState = 'win';
                    }
                    return;
                }

                if (!SOLID[tile] || tile === 3) {
                    player.moving = true;
                    player.moveTimer = 0;
                    player.dx = ndx; player.dy = ndy;
                    player.tx = ntx; player.ty = nty;
                }
            }

            // Attack key
            if (keyJust['Space'] || keyJust['KeyZ']) {
                player.attacking = true;
                player.attackTimer = 0.25;
                // Check adjacent enemy
                var ax = player.tx + (player.facing==='right'?1:player.facing==='left'?-1:0);
                var ay = player.ty + (player.facing==='down'?1:player.facing==='up'?-1:0);
                var target = enemies.find(function(e){ return e.alive && e.tx===ax && e.ty===ay; });
                if (target) startCombat(target);
            }
        } else {
            // Smooth movement interpolation
            player.moveTimer += dt;
            var t = Math.min(player.moveTimer / player.moveDur, 1);
            var prevX = (player.tx - player.dx) * TILE;
            var prevY = (player.ty - player.dy) * TILE;
            player.x = prevX + player.dx * TILE * t;
            player.y = prevY + player.dy * TILE * t;
            if (t >= 1) {
                player.x = player.tx * TILE;
                player.y = player.ty * TILE;
                player.moving = false;
                // Check enemy on arrival
                var onEnemy = enemies.find(function(e){ return e.alive && e.tx===player.tx && e.ty===player.ty; });
                if (onEnemy) startCombat(onEnemy);
            }
        }

        // Enemy AI: patrol and aggro
        enemies.forEach(function(e) {
            if (!e.alive) return;
            e.moveTimer -= dt;
            if (e.moveTimer <= 0) {
                e.moveTimer = e.moveDur;
                var dist = Math.max(Math.abs(e.tx-player.tx), Math.abs(e.ty-player.ty));
                var moved = false;
                if (dist <= e.aggroRange && dist > 1) {
                    // Chase player
                    var ddx = Math.sign(player.tx - e.tx);
                    var ddy = Math.sign(player.ty - e.ty);
                    var candidates = [];
                    if (ddx!==0) candidates.push({dx:ddx,dy:0});
                    if (ddy!==0) candidates.push({dx:0,dy:ddy});
                    for (var c = 0; c < candidates.length; c++) {
                        var nx = e.tx+candidates[c].dx, ny = e.ty+candidates[c].dy;
                        var blocked = !e.alive || SOLID[tileAt(nx,ny)] ||
                            enemies.some(function(o){return o!==e&&o.alive&&o.tx===nx&&o.ty===ny;});
                        if (!blocked) { e.tx=nx; e.ty=ny; e.x=nx*TILE; e.y=ny*TILE; moved=true; break; }
                    }
                } else {
                    // Patrol: random walk
                    e.patrolTimer -= e.moveDur;
                    if (e.patrolTimer <= 0) {
                        e.patrolTimer = rnd(1,3);
                        var dirs = [{dx:1,dy:0},{dx:-1,dy:0},{dx:0,dy:1},{dx:0,dy:-1}];
                        dirs.sort(function(){return Math.random()-0.5;});
                        for (var d = 0; d < dirs.length; d++) {
                            var nx = e.tx+dirs[d].dx, ny = e.ty+dirs[d].dy;
                            if (!SOLID[tileAt(nx,ny)] && !enemies.some(function(o){return o!==e&&o.alive&&o.tx===nx&&o.ty===ny;})) {
                                e.tx=nx; e.ty=ny; e.x=nx*TILE; e.y=ny*TILE; break;
                            }
                        }
                    }
                }
            }
        });
    }
    keyJust = {};
    updateCamera();
}

// ─── DRAW ─────────────────────────────────────────────────────────────────────
function draw() {
    var def = FLOORS[currentFloor];
    var grad = ctx.createLinearGradient(0,0,0,H);
    grad.addColorStop(0,def.bgColor[0]); grad.addColorStop(1,def.bgColor[1]);
    ctx.fillStyle = grad; ctx.fillRect(0,0,W,H);

    if (gameState==='combat')    { drawCombat(); return; }
    if (gameState==='gameover')  { drawGameOver(); return; }
    if (gameState==='win')       { drawWin(); return; }

    // World
    ctx.save(); ctx.translate(-camX, -camY);

    // Tiles
    for (var ty = 0; ty < MAP_H; ty++) {
        for (var tx = 0; tx < MAP_W; tx++) {
            var tile = tileAt(tx,ty);
            ctx.drawImage(makeTile(tile), tx*TILE, ty*TILE);
        }
    }
    // Opened chests (darker)
    chests.forEach(function(c) {
        if (c.opened) { ctx.fillStyle='rgba(0,0,0,0.5)'; ctx.fillRect(c.tx*TILE, c.ty*TILE, TILE, TILE); }
    });
    // NPCs
    npcs.forEach(function(n) {
        ctx.fillStyle = '#ffd700'; ctx.shadowColor='#ffd700'; ctx.shadowBlur=8;
        ctx.beginPath(); ctx.arc(n.tx*TILE+TILE/2, n.ty*TILE+TILE/2-4, 8, 0, Math.PI*2); ctx.fill();
        ctx.fillStyle='#000';
        ctx.font='10px monospace'; ctx.textAlign='center';
        ctx.fillText('E', n.tx*TILE+TILE/2, n.ty*TILE+TILE/2-1);
        ctx.shadowBlur=0;
    });
    // Enemies
    enemies.forEach(function(e) {
        if (!e.alive) return;
        ctx.fillStyle = e.color; ctx.shadowColor=e.color; ctx.shadowBlur=6;
        ctx.beginPath(); ctx.arc(e.tx*TILE+TILE/2, e.ty*TILE+TILE/2, TILE/2-5, 0, Math.PI*2); ctx.fill();
        ctx.shadowBlur=0;
        if (e.isBoss) {
            ctx.strokeStyle='#ff1744'; ctx.lineWidth=2;
            ctx.beginPath(); ctx.arc(e.tx*TILE+TILE/2, e.ty*TILE+TILE/2, TILE/2-2, 0, Math.PI*2); ctx.stroke();
        }
        // Enemy HP bar
        var bw = TILE-6, bh = 3;
        ctx.fillStyle='#333'; ctx.fillRect(e.tx*TILE+3, e.ty*TILE+TILE-7, bw, bh);
        ctx.fillStyle = e.hp/e.maxHp>0.5?'#4caf50':'#f44336';
        ctx.fillRect(e.tx*TILE+3, e.ty*TILE+TILE-7, bw*(e.hp/e.maxHp), bh);
    });
    // Player
    var px = player.x+TILE/2, py = player.y+TILE/2;
    ctx.fillStyle='#e91e63'; ctx.shadowColor='#e91e63'; ctx.shadowBlur=10;
    ctx.beginPath(); ctx.arc(px, py, TILE/2-4, 0, Math.PI*2); ctx.fill();
    ctx.shadowBlur=0;
    ctx.fillStyle='#fff'; ctx.font='bold 14px monospace'; ctx.textAlign='center';
    ctx.fillText('☺', px, py+5);
    // Attack flash
    if (player.attackTimer > 0) {
        var offs = {up:{dx:0,dy:-1},down:{dx:0,dy:1},left:{dx:-1,dy:0},right:{dx:1,dy:0}};
        var of = offs[player.facing];
        ctx.fillStyle='rgba(255,200,0,0.45)';
        ctx.fillRect((player.tx+of.dx)*TILE, (player.ty+of.dy)*TILE, TILE, TILE);
    }
    ctx.restore();

    // Float texts
    floatTexts.forEach(function(ft) {
        ctx.globalAlpha = Math.min(1, ft.life);
        ctx.fillStyle = ft.color; ctx.font='bold 14px monospace'; ctx.textAlign='center';
        ctx.fillText(ft.text, ft.x+W/2-player.x, ft.y+H/2-player.y-30+camY-camX*0);
        ctx.globalAlpha = 1;
    });

    // Dialog box
    if (gameState==='dialog' && dialog.npc) {
        ctx.fillStyle='rgba(0,0,0,0.88)'; ctx.fillRect(20, H-155, W-40, 130);
        ctx.strokeStyle='#ffd700'; ctx.lineWidth=2; ctx.strokeRect(20, H-155, W-40, 130);
        ctx.fillStyle='#ffd700'; ctx.font='bold 13px monospace'; ctx.textAlign='left';
        ctx.fillText(dialog.npc.name, 36, H-135);
        ctx.fillStyle='#fff'; ctx.font='14px monospace';
        var line = dialog.npc.dialog[dialog.lineIdx] || '';
        ctx.fillText(line, 36, H-110);
        ctx.fillStyle='#aaa'; ctx.font='11px monospace'; ctx.textAlign='right';
        ctx.fillText('[SPACE / E] Continue', W-28, H-38);
    }

    drawHUD();
}

function drawHUD() {
    ctx.fillStyle='rgba(0,0,0,0.75)'; ctx.fillRect(0, H-60, W, 60);
    // HP bar
    ctx.fillStyle='#333'; ctx.fillRect(10, H-50, 150, 12);
    ctx.fillStyle = player.hp/player.maxHp > 0.5 ? '#4caf50' : player.hp/player.maxHp > 0.25 ? '#ffb300' : '#f44336';
    ctx.fillRect(10, H-50, 150*(player.hp/player.maxHp), 12);
    ctx.fillStyle='#fff'; ctx.font='10px monospace'; ctx.textAlign='left';
    ctx.fillText('HP ' + player.hp + '/' + player.maxHp, 10, H-52);
    // XP bar
    ctx.fillStyle='#333'; ctx.fillRect(10, H-33, 150, 8);
    ctx.fillStyle='#00bcd4';
    ctx.fillRect(10, H-33, 150*(player.xp/player.xpNext), 8);
    ctx.fillStyle='#aaa'; ctx.font='9px monospace';
    ctx.fillText('XP ' + player.xp + '/' + player.xpNext, 10, H-35);
    // Level & stats
    ctx.fillStyle='#ffeb3b'; ctx.font='bold 13px monospace';
    ctx.fillText('LV ' + player.level, 170, H-48);
    ctx.fillStyle='#fff'; ctx.font='11px monospace';
    ctx.fillText('ATK '+(player.atk+(player.weapon?player.weapon.atk:0)), 170, H-34);
    ctx.fillText('DEF '+(player.def+(player.armor?player.armor.def:0)), 230, H-34);
    // Gold
    ctx.fillStyle='#ffd700'; ctx.font='12px monospace';
    ctx.fillText('GOLD ' + player.gold, 290, H-48);
    // Weapon/armor
    ctx.fillStyle='#ccc'; ctx.font='10px monospace';
    ctx.fillText((player.weapon?player.weapon.icon:'')+' '+(player.weapon?player.weapon.name:''), 290, H-34);
    // Inventory summary
    var potCount = player.inventory.filter(function(i){return i.type==='potion';}).length;
    ctx.fillStyle='#69f0ae'; ctx.font='11px monospace'; ctx.textAlign='right';
    ctx.fillText('🧪×'+potCount+'  [D]  |  Floor '+(currentFloor+1)+'/'+FLOORS.length, W-10, H-34);
    // Floor name
    ctx.fillStyle='#aaa'; ctx.font='11px monospace'; ctx.textAlign='center';
    ctx.fillText(FLOORS[currentFloor].name, W/2, H-48);
    // Controls hint
    ctx.fillStyle='#555'; ctx.font='9px monospace';
    ctx.fillText('ARROWS: Move   SPACE/Z: Attack   D: Potion   E: Talk', W/2, H-10);
}

function drawCombat() {
    if (!combat) return;
    var e = combat.enemy;
    var sx = combat.shake > 0 ? (Math.random()-0.5)*8 : 0;
    var sy = combat.shake > 0 ? (Math.random()-0.5)*8 : 0;
    ctx.save(); ctx.translate(sx, sy);

    ctx.fillStyle='#0d0d1a'; ctx.fillRect(0,0,W,H);
    // Enemy
    ctx.fillStyle = e.color; ctx.shadowColor=e.color; ctx.shadowBlur=20;
    ctx.beginPath(); ctx.arc(300, 130, e.isBoss ? 55 : 40, 0, Math.PI*2); ctx.fill();
    ctx.shadowBlur=0;
    ctx.fillStyle='#fff'; ctx.font='bold 18px monospace'; ctx.textAlign='center';
    ctx.fillText(e.type.toUpperCase(), 300, 135);
    // Enemy HP bar
    ctx.fillStyle='#333'; ctx.fillRect(150, 185, 300, 16);
    ctx.fillStyle = e.hp/e.maxHp>0.5?'#4caf50':'#f44336';
    ctx.fillRect(150, 185, 300*(e.hp/e.maxHp), 16);
    ctx.fillStyle='#fff'; ctx.font='11px monospace';
    ctx.fillText(e.hp + ' / ' + e.maxHp + ' HP', 300, 198);

    // Player sprite
    ctx.fillStyle='#e91e63'; ctx.shadowColor='#e91e63'; ctx.shadowBlur=12;
    ctx.beginPath(); ctx.arc(110, 280, 28, 0, Math.PI*2); ctx.fill();
    ctx.shadowBlur=0;
    ctx.fillStyle='#fff'; ctx.font='18px monospace'; ctx.textAlign='center';
    ctx.fillText('☺', 110, 286);
    // Player HP bar
    ctx.fillStyle='#333'; ctx.fillRect(55, 315, 110, 12);
    ctx.fillStyle = player.hp/player.maxHp>0.5?'#4caf50':'#f44336';
    ctx.fillRect(55, 315, 110*(player.hp/player.maxHp), 12);
    ctx.fillStyle='#fff'; ctx.font='10px monospace';
    ctx.fillText(player.hp+'/'+player.maxHp+' HP', 110, 313);

    // Battle log
    ctx.fillStyle='rgba(0,0,0,0.7)'; ctx.fillRect(20, 220, 420, 70);
    ctx.strokeStyle='#444'; ctx.lineWidth=1; ctx.strokeRect(20,220,420,70);
    ctx.fillStyle='#ddd'; ctx.font='12px monospace'; ctx.textAlign='left';
    var logLen = combat.log.length;
    for (var li = 0; li < 3; li++) {
        var idx = logLen - 3 + li;
        if (idx >= 0) ctx.fillText(combat.log[idx], 30, 238 + li*20);
    }

    // Action buttons
    if (combat.phase === 'player_turn') {
        ctx.fillStyle='rgba(0,0,0,0.8)'; ctx.fillRect(20, H-75, W-40, 55);
        ctx.strokeStyle='#555'; ctx.strokeRect(20, H-75, W-40, 55);
        var btns = [
            {label:'[A/SPACE] Attack', x:55, c:'#ff6d00'},
            {label:'[D] Potion (×'+player.inventory.filter(function(i){return i.type==='potion';}).length+')', x:230, c:'#4caf50'},
            {label:'[F/ESC] Flee', x:390, c:'#aaa'},
        ];
        btns.forEach(function(b) {
            ctx.fillStyle=b.c; ctx.font='bold 11px monospace'; ctx.textAlign='center';
            ctx.fillText(b.label, b.x, H-42);
        });
    }
    // Float texts
    floatTexts.forEach(function(ft) {
        ctx.globalAlpha=Math.max(0,ft.life);
        ctx.fillStyle=ft.color; ctx.font='bold 20px monospace'; ctx.textAlign='center';
        ctx.fillText(ft.text, ft.x, ft.y); ctx.globalAlpha=1;
    });
    ctx.restore();
}

function drawGameOver() {
    ctx.fillStyle='rgba(0,0,0,0.9)'; ctx.fillRect(0,0,W,H);
    ctx.fillStyle='#f44336'; ctx.font='bold 48px monospace'; ctx.textAlign='center';
    ctx.shadowColor='#f44336'; ctx.shadowBlur=30; ctx.fillText('DEFEATED', W/2, H/2-50); ctx.shadowBlur=0;
    ctx.fillStyle='#fff'; ctx.font='16px monospace';
    ctx.fillText('Reached: ' + FLOORS[currentFloor].name, W/2, H/2+10);
    ctx.fillText('Level: ' + player.level + '  XP: ' + player.xp + '  Gold: ' + player.gold, W/2, H/2+40);
    if (Math.floor(Date.now()/600)%2){ ctx.fillStyle='#aaa'; ctx.font='13px monospace'; ctx.fillText('Refresh to try again', W/2, H/2+90); }
}
function drawWin() {
    ctx.fillStyle='rgba(0,0,0,0.88)'; ctx.fillRect(0,0,W,H);
    ctx.fillStyle='#ffd700'; ctx.font='bold 40px monospace'; ctx.textAlign='center';
    ctx.shadowColor='#ffd700'; ctx.shadowBlur=24; ctx.fillText('AELINDRA SAVED!', W/2, H/2-60); ctx.shadowBlur=0;
    ctx.fillStyle='#fff'; ctx.font='16px monospace';
    ctx.fillText('The Dark Crystal is destroyed!', W/2, H/2-10);
    ctx.fillText('Level '+player.level+'  Gold '+player.gold, W/2, H/2+30);
    if (Math.floor(Date.now()/600)%2){ ctx.fillStyle='#ffd700'; ctx.font='13px monospace'; ctx.fillText('You are a legend!', W/2, H/2+80); }
}

// ─── GAME LOOP ────────────────────────────────────────────────────────────────
function gameLoop(ts) {
    var dt = Math.min((ts - lastTime)/1000, 0.05);
    lastTime = ts;
    update(dt);
    draw();
    requestAnimationFrame(gameLoop);
}
document.addEventListener('DOMContentLoaded', function() {
    loadFloor(0);
    updateCamera();
    requestAnimationFrame(function(ts){ lastTime=ts; requestAnimationFrame(gameLoop); });

  // Dev console bridge — accès aux variables locales du jeu
  window.__devPatch = function(code) { return eval(code); };
});
</script>

<script id="dev-console-script">
/* DEV_CONSOLE_INJECTED */
(function(){
'use strict';
var FILENAME=window.location.pathname.split('/').pop();
var panel=document.getElementById('dev-console');
var input=document.getElementById('dev-console-input');
var btn=document.getElementById('dev-console-btn');
var undoBtn=document.getElementById('dev-console-undo');
var statusEl=document.getElementById('dev-console-status');
var closeBtn=document.getElementById('dev-console-close');
var ctxBtn=document.getElementById('dev-console-ctx-btn');
var ctxPanel=document.getElementById('dev-console-ctx');
var logPanel=document.getElementById('dev-console-log');
var codeWrap=document.getElementById('dev-console-code-wrap');
var codeToggle=document.getElementById('dev-console-code-toggle');
var codePre=document.getElementById('dev-console-code-pre');
if(!panel||!input||!btn||!statusEl)return;

// ── État interne ──
var _snapshots=[];
var _history=[];
var _histIdx=-1;
var _actionLog=[];
var MAX_UNDO=15;
var MAX_LOG=30;
var _lastCode='';

// ── Toggle code généré ──
if(codeToggle&&codeWrap&&codePre){
  codeToggle.addEventListener('click',function(){
    var isOpen=codePre.style.display==='block';
    codePre.style.display=isOpen?'none':'block';
    codeToggle.textContent=(isOpen?'▶ voir':'▼ masquer')+' le code généré';
  });
  codePre.style.display='none'; // fermé par défaut
}

function showGeneratedCode(code){
  if(!codeWrap||!codePre||!codeToggle)return;
  _lastCode=code||'';
  codePre.textContent=_lastCode;
  codeWrap.classList.add('visible');
  codePre.style.display='none'; // fermé par défaut, l'utilisateur ouvre s'il veut
  codeToggle.textContent='▶ voir le code généré ('+_lastCode.split('\n').length+' lignes)';
}

function hideGeneratedCode(){
  if(!codeWrap)return;
  codeWrap.classList.remove('visible');
  _lastCode='';
}

// ── Utilitaires UI ──
closeBtn.addEventListener('click',function(){panel.classList.remove('open');input.blur();});

function setStatus(msg,cls){
  statusEl.textContent=msg;
  statusEl.className=cls||'';
}

function addLog(prompt,ok,note){
  var t=new Date().toLocaleTimeString('fr',{hour:'2-digit',minute:'2-digit',second:'2-digit'});
  var short=prompt.length>55?prompt.slice(0,55)+'…':prompt;
  _actionLog.unshift({t:t,short:short,ok:ok,note:note||''});
  if(_actionLog.length>MAX_LOG)_actionLog.pop();
  renderLog();
}

function renderLog(){
  if(!_actionLog.length){logPanel.classList.remove('visible');return;}
  logPanel.classList.add('visible');
  logPanel.innerHTML=_actionLog.map(function(e){
    return '<span style="color:#333">'+e.t+'</span> '+
      '<span style="color:'+(e.ok?'#1a6a1a':'#6a1a1a')+'">&#8226;</span> '+
      '<span style="color:'+(e.ok?'#447744':'#774444')+'">'+e.short+'</span>'+
      (e.note?'<span style="color:#333"> → '+e.note+'</span>':'');
  }).join('<br>');
}

// ── Snapshot pour undo ──
function takeSnapshot(){
  try{
    var s={_ts:Date.now()};
    // Numériques globaux
    ['score','highScore','gold','lives','level','floor','stage','currentFloor',
     'currentDungeonFloor','currentLevel','wave','waveNumber','coins','gems',
     'playerGold','energy','mana','ammo'].forEach(function(n){
      if(typeof window[n]==='number')s[n]=window[n];
    });
    // gameState
    if(typeof gameState!=='undefined')s.gameState=gameState;
    // Joueur (plusieurs conventions)
    ['hero','player','ship','character'].forEach(function(pn){
      if(typeof window[pn]!=='undefined'&&window[pn]&&typeof window[pn]==='object'){
        var p=window[pn];
        s['_p_'+pn]={hp:p.hp,maxHp:p.maxHp,speed:p.speed,attack:p.attack||p.damage,
          defense:p.defense,mp:p.mp,maxMp:p.maxMp,level:p.level,xp:p.xp,
          x:p.x,y:p.y,invincibilityTimer:p.invincibilityTimer||0,
          classId:p.classId,vx:p.vx||0,vy:p.vy||0};
      }
    });
    // Longueurs des tableaux
    ['enemies','towers','loot','minions','projectiles','bullets','interactables',
     'powerups','particles'].forEach(function(n){
      if(typeof window[n]!=='undefined'&&Array.isArray(window[n]))s['_len_'+n]=window[n].length;
    });
    // playerStats si existe
    if(typeof playerStats!=='undefined'&&playerStats)
      s._playerStats=JSON.parse(JSON.stringify(playerStats));
    if(typeof activeBuffs!=='undefined'&&Array.isArray(activeBuffs))
      s._activeBuffs=JSON.parse(JSON.stringify(activeBuffs));
    return s;
  }catch(e){return null;}
}

function applySnapshot(s){
  if(!s)return false;
  var ok=false;
  try{
    ['score','highScore','gold','lives','level','floor','stage','currentFloor',
     'currentDungeonFloor','currentLevel','wave','waveNumber','coins','gems',
     'playerGold','energy','mana','ammo'].forEach(function(n){
      if(s[n]!==undefined&&typeof window[n]==='number'){window[n]=s[n];ok=true;}
    });
    if(s.gameState!==undefined&&typeof gameState!=='undefined'){gameState=s.gameState;ok=true;}
    ['hero','player','ship','character'].forEach(function(pn){
      var pk='_p_'+pn;
      if(s[pk]&&typeof window[pn]!=='undefined'&&window[pn]){
        var p=window[pn],sd=s[pk];
        ['hp','maxHp','speed','attack','defense','mp','maxMp','level','xp',
         'invincibilityTimer','classId','vx','vy'].forEach(function(f){
          if(sd[f]!==undefined)p[f]=sd[f];
        });
        ok=true;
      }
    });
    if(s._playerStats&&typeof playerStats!=='undefined'&&playerStats){
      Object.assign(playerStats,s._playerStats);ok=true;
    }
    if(s._activeBuffs&&typeof activeBuffs!=='undefined'&&Array.isArray(activeBuffs)){
      activeBuffs.length=0;s._activeBuffs.forEach(function(b){activeBuffs.push(b);});ok=true;
    }
  }catch(e){}
  return ok;
}

function pushSnapshot(snap){
  if(!snap)return;
  _snapshots.push(snap);
  if(_snapshots.length>MAX_UNDO)_snapshots.shift();
  undoBtn.disabled=false;
}

function updateUndoBtn(){undoBtn.disabled=_snapshots.length===0;}

undoBtn.addEventListener('click',function(){
  if(!_snapshots.length)return;
  var snap=_snapshots.pop();
  updateUndoBtn();
  var ok=applySnapshot(snap);
  var dt=Math.round((Date.now()-snap._ts)/1000);
  if(ok){setStatus('↩ Annulé (il y a '+dt+'s)','ok');}
  else{setStatus('⚠ Annulation partielle — les changements complexes (nouvelles fonctions, types) ne peuvent pas être annulés automatiquement','warn');}
});

// ── Context browser ──
ctxBtn.addEventListener('click',function(){
  if(ctxPanel.classList.contains('open')){
    ctxPanel.classList.remove('open');
    ctxBtn.classList.remove('active');
    ctxPanel.innerHTML='';
    return;
  }
  ctxBtn.classList.add('active');
  var ctx=collectContext();
  var lines=['<b style="color:#226622">═══ CONTEXTE EN TEMPS RÉEL ═══</b>'];
  Object.keys(ctx).forEach(function(k){
    var v=ctx[k];
    var vs=typeof v==='object'?JSON.stringify(v).slice(0,90):String(v);
    lines.push('<span style="color:#00cc55">'+k+'</span><span style="color:#224422">:</span> <span style="color:#88aa88">'+vs+'</span>');
  });
  if(lines.length===1)lines.push('<span style="color:#1a3a1a">Aucune variable standard détectée (jeu custom)</span>');
  ctxPanel.innerHTML=lines.join('<br>');
  ctxPanel.classList.add('open');
});

// ── Collecte du contexte runtime ──
function collectContext(){
  var ctx={};
  try{
    var stateNames=['gameState','state','currentState','phase','mode','screen'];
    stateNames.forEach(function(n){if(typeof window[n]!=='undefined')ctx[n]=window[n];});
    var scoreNames=['score','highScore','bestScore','gold','lives','level','floor','stage',
                    'currentFloor','currentDungeonFloor','currentLevel','wave','waveNumber',
                    'coins','gems','playerGold','energy','mana','ammo','kills'];
    scoreNames.forEach(function(n){if(typeof window[n]!=='undefined')ctx[n]=window[n];});
    ['hero','player','ship','character','pawn','tank'].forEach(function(pn){
      if(typeof window[pn]!=='undefined'&&window[pn]&&typeof window[pn]==='object'){
        var p=window[pn];
        ctx[pn]={hp:p.hp,maxHp:p.maxHp,x:Math.round(p.x||0),y:Math.round(p.y||0),
          speed:p.speed,level:p.level,attack:p.attack||p.damage||p.atk,
          defense:p.defense||p.def,mp:p.mp,maxMp:p.maxMp,classId:p.classId,
          invincible:!!(p.invincibilityTimer>0)};
      }
    });
    var arrNames=['enemies','towers','projectiles','bullets','particles','loot','interactables',
                  'minions','platforms','coins','items','obstacles','pieces','waves','powerups',
                  'skills','traps','buildings','npcs','allies'];
    arrNames.forEach(function(n){
      if(typeof window[n]!=='undefined'&&Array.isArray(window[n]))ctx[n+'_count']=window[n].length;
    });
    if(typeof window['boss']!=='undefined')ctx.bossAlive=window['boss']!==null;
    if(typeof window['bossGate']!=='undefined')ctx.bossGateOpen=!!(window['bossGate']&&window['bossGate'].open);
    if(typeof ENEMY_TYPES!=='undefined')ctx.enemyTypes=Object.keys(ENEMY_TYPES);
    if(typeof TOWER_TYPES!=='undefined')ctx.towerTypes=Object.keys(TOWER_TYPES);
    if(typeof ITEM_TYPES!=='undefined')ctx.itemTypes=Object.keys(ITEM_TYPES);
    if(typeof WEAPON_TYPES!=='undefined')ctx.weaponTypes=Object.keys(WEAPON_TYPES);
    if(typeof UPGRADE_TYPES!=='undefined')ctx.upgradeTypes=Object.keys(UPGRADE_TYPES);
    if(typeof HERO_CLASSES!=='undefined')ctx.heroClasses=HERO_CLASSES.map(function(c){return c.id+':'+c.name;});
    if(typeof CUSTOM_SKILLS!=='undefined')ctx.customSkills=Object.keys(CUSTOM_SKILLS);
    if(typeof CUSTOM_ATTACKS!=='undefined')ctx.customAttacks=Object.keys(CUSTOM_ATTACKS);
    var fnNames=['createEnemy','spawnBoss','generateDungeon','checkLevelUp','handleEnemyDefeat',
                 'spawnParticles','spawnFloatingText','triggerShake','createProjectile',
                 'placeTower','addTower','spawnEnemy','createTower','restartGame','resetGame',
                 'spawnWave','addPowerup','unlockSkill','applyKnockback','onBossDefeat',
                 'openShop','buyItem','saveGame','loadGame','generateLevel','nextWave',
                 'addUpgrade','applyUpgrade','createItem','dropLoot'];
    var avail=fnNames.filter(function(n){return typeof window[n]==='function';});
    if(avail.length)ctx.functions=avail;
    if(typeof playerInventory!=='undefined')ctx.inventory=playerInventory;
    if(typeof activeBuffs!=='undefined'&&Array.isArray(activeBuffs))ctx.buffs=activeBuffs.length;
    if(typeof TILE_SIZE!=='undefined')ctx.TILE_SIZE=TILE_SIZE;
    if(typeof MAP_W!=='undefined')ctx.MAP_W=MAP_W;
  }catch(e){}
  return ctx;
}

// ── Validation syntaxique client ──
function validateSyntax(code){
  var o=0,c=0,po=0,pc=0,bo=0,bc=0;
  for(var i=0;i<code.length;i++){
    var ch=code[i];
    if(ch==='{')o++;else if(ch==='}')c++;
    else if(ch==='(')po++;else if(ch===')')pc++;
    else if(ch==='[')bo++;else if(ch===']')bc++;
  }
  if(o!==c)return 'Accolades: '+o+' { pour '+c+' }';
  if(po!==pc)return 'Parenthèses: '+po+' ( pour '+pc+' )';
  if(bo!==bc)return 'Crochets: '+bo+' [ pour '+bc+' ]';
  return null;
}

// ── Exécution du code patché ──
function execCode(code,explanation){
  var synErr=validateSyntax(code);
  if(synErr){
    setStatus('⚠ Syntaxe invalide côté client: '+synErr+' — Le code ne sera pas exécuté.','err');
    return false;
  }
  try{
    if(typeof window.__devPatch==='function'){
      window.__devPatch(code);
    }else{
      // Fallback: new Function (n'accède pas aux vars locales du jeu)
      (new Function(code))();
    }
    var msg=explanation||'Patch appliqué !';
    setStatus('✅ '+msg,'ok');
    input.value='';
    return true;
  }catch(e){
    var msg=e.message||String(e);
    if(msg.indexOf('not defined')!==-1){
      var vn=(msg.split(' ')[0]||'').replace(/[^a-zA-Z0-9_]/g,'');
      msg='Variable "'+vn+'" introuvable dans ce jeu. Utilisez le bouton ctx pour voir ce qui est disponible.';
    }else if(msg.indexOf('is not a function')!==-1){
      msg='Fonction non disponible dans ce jeu: '+msg+'. Vérifiez ctx → functions.';
    }else if(msg.indexOf('Cannot read')!==-1||msg.indexOf('null')!==-1){
      msg='Accès à null/undefined: '+msg+' — Ajoutez une vérification if(variable) avant.';
    }else if(msg.indexOf('Assignment to constant')!==-1){
      msg="Impossible de modifier une constante (const). Passez par l'objet: ex TYPE.xxx au lieu de TYPE=...";
    }else if(msg.indexOf('Unexpected token')!==-1){
      msg='Erreur de syntaxe JS: '+msg;
    }
    setStatus('❌ '+msg,'err');
    return false;
  }
}

// ── Application d'un patch ──
async function applyPatch(){
  var prompt=input.value.trim();
  if(!prompt)return;
  if(_history[0]!==prompt){_history.unshift(prompt);if(_history.length>50)_history.pop();}
  _histIdx=-1;
  btn.disabled=true;
  hideGeneratedCode();
  setStatus('⏳ Génération en cours...','pending');
  var snap=takeSnapshot();
  try{
    var resp=await fetch('/api/game-patch',{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({filename:FILENAME,prompt:prompt,context:collectContext()})
    });
    if(!resp.ok){
      var errText=await resp.text();
      setStatus('❌ Erreur serveur '+resp.status+': '+errText.slice(0,80),'err');
      addLog(prompt,false,'HTTP '+resp.status);
      return;
    }
    var data=await resp.json();
    if(data.error){
      setStatus('❌ '+data.error,'err');
      addLog(prompt,false,data.error.slice(0,40));
    }else if(data.code){
      // Afficher le code avant l'exec (utile si l'exec plante)
      showGeneratedCode(data.code);
      var ok=execCode(data.code,data.explanation);
      if(ok){
        pushSnapshot(snap);
        addLog(prompt,true,data.explanation?data.explanation.slice(0,80):'');
      }else{
        // En cas d'erreur, garder le code visible automatiquement pour debug
        if(codePre)codePre.style.display='block';
        if(codeToggle)codeToggle.textContent='▼ masquer le code généré (erreur — vérifier la syntaxe)';
        addLog(prompt,false,'Erreur exec');
      }
    }else{
      setStatus('⚠ Réponse vide du serveur','warn');
      addLog(prompt,false,'réponse vide');
    }
  }catch(e){
    setStatus('❌ Réseau: '+e.message,'err');
    addLog(prompt,false,'réseau');
  }finally{btn.disabled=false;}
}

// ── Événements ──
btn.addEventListener('click',applyPatch);
input.addEventListener('keydown',function(e){
  if(e.code!=='Backquote'&&e.code!=='IntlBackslash')e.stopPropagation();
  if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();applyPatch();return;}
  if(e.key==='ArrowUp'&&!e.shiftKey&&_history.length){
    e.preventDefault();_histIdx=Math.min(_histIdx+1,_history.length-1);input.value=_history[_histIdx];
  }
  if(e.key==='ArrowDown'&&!e.shiftKey){
    e.preventDefault();_histIdx=Math.max(_histIdx-1,-1);input.value=_histIdx>=0?_history[_histIdx]:'';
  }
});
document.addEventListener('keydown',function(e){
  if(e.code==='Backquote'||e.code==='IntlBackslash'){
    e.preventDefault();
    if(panel.classList.contains('open')){
      panel.classList.remove('open');input.blur();
    }else{
      panel.classList.add('open');input.focus();
    }
  }
});
})();
</script>
