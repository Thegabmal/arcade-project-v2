// ENGINE — DO NOT MODIFY
window.__devPatch=function(code){return eval(code);};
// ══════════════════════════════════════════════════════════════════
const canvas=document.getElementById('gameCanvas');
const ctx=canvas.getContext('2d');
const DPR=Math.min(window.devicePixelRatio||1,2);
const GAME_W=800,GAME_H=600;
let W=GAME_W,H=GAME_H;
function resizeCanvas(){const s=Math.min(window.innerWidth/W,window.innerHeight/H);canvas.style.width=Math.round(W*s)+'px';canvas.style.height=Math.round(H*s)+'px';canvas.width=Math.round(W*DPR);canvas.height=Math.round(H*DPR);ctx.scale(DPR,DPR);}
resizeCanvas();window.addEventListener('resize',()=>{resizeCanvas();ctx.scale(DPR,DPR);});

let gameState='menu';
function setState(s){gameState=s;}

const Keys={down:{},pressed:{},released:{}};
window.addEventListener('keydown',e=>{if(!Keys.down[e.code])Keys.pressed[e.code]=true;Keys.down[e.code]=true;if(['Space','ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.code))e.preventDefault();});
window.addEventListener('keyup',e=>{Keys.down[e.code]=false;Keys.released[e.code]=true;});

const Touch={active:false,stickX:0,stickY:0,startX:0,startY:0,x:0,y:0,justTapped:false};
canvas.addEventListener('touchstart',e=>{e.preventDefault();const r=canvas.getBoundingClientRect();Touch.startX=Touch.x=(e.touches[0].clientX-r.left)*(W/r.width);Touch.startY=Touch.y=(e.touches[0].clientY-r.top)*(H/r.height);Touch.active=true;},{passive:false});
canvas.addEventListener('touchmove',e=>{e.preventDefault();const r=canvas.getBoundingClientRect();Touch.x=(e.touches[0].clientX-r.left)*(W/r.width);Touch.y=(e.touches[0].clientY-r.top)*(H/r.height);const dx=Touch.x-Touch.startX,dy=Touch.y-Touch.startY,len=Math.hypot(dx,dy);Touch.stickX=len>10?dx/Math.max(len,40):0;Touch.stickY=len>10?dy/Math.max(len,40):0;},{passive:false});
canvas.addEventListener('touchend',e=>{e.preventDefault();Touch.active=false;Touch.stickX=0;Touch.stickY=0;Touch.justTapped=true;},{passive:false});
canvas.addEventListener('contextmenu',e=>e.preventDefault());

let attackInput=false;
let _shopClick={x:-1,y:-1};
canvas.addEventListener('click',e=>{
  if(gameState==='playing')attackInput=true;
  const r=canvas.getBoundingClientRect();
  _shopClick.x=(e.clientX-r.left)*(W/r.width);
  _shopClick.y=(e.clientY-r.top)*(H/r.height);
});

function keyDown(c){return!!Keys.down[c];}
function keyPressed(c){return!!Keys.pressed[c];}
function anyAction(){return keyPressed('Space')||keyPressed('Enter')||keyPressed('KeyZ')||keyPressed('KeyJ');}
function flushInput(){Keys.pressed={};Keys.released={};attackInput=false;Touch.justTapped=false;_shopClick={x:-1,y:-1};}

function createPool(factory,size){const inactive=Array.from({length:size},factory),active=[];return{active,get(fn){const o=inactive.length>0?inactive.pop():factory();o.alive=true;if(fn)fn(o);active.push(o);return o;},update(fn){for(let i=active.length-1;i>=0;i--)if(!fn(active[i])){active[i].alive=false;inactive.push(active.splice(i,1)[0]);}},clear(){while(active.length){active[0].alive=false;inactive.push(active.shift());}}};}

const Particles=createPool(()=>({alive:false,x:0,y:0,vx:0,vy:0,life:0,maxLife:0,size:3,color:'#fff',gravity:0}),200);
function spawnParticles(x,y,count,opts){opts=opts||{};for(let i=0;i<count;i++){const a=opts.angle!==undefined?opts.angle+(Math.random()-0.5)*(opts.spread||Math.PI*2):Math.random()*Math.PI*2;const sp=opts.speed||(50+Math.random()*70);Particles.get(p=>{p.x=x;p.y=y;p.vx=Math.cos(a)*sp;p.vy=Math.sin(a)*sp;p.life=p.maxLife=opts.life||(0.25+Math.random()*0.35);p.size=opts.size||(2+Math.random()*3);p.color=opts.color||'#fff';p.gravity=opts.gravity!==undefined?opts.gravity:0;});}}
function updateParticles(dt){Particles.update(p=>{p.life-=dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=p.gravity*dt;return p.life>0;});}
function drawParticles(){Particles.active.forEach(p=>{ctx.globalAlpha=p.life/p.maxLife;ctx.fillStyle=p.color;ctx.beginPath();ctx.arc(p.x,p.y,p.size*0.5,0,Math.PI*2);ctx.fill();});ctx.globalAlpha=1;}

const Popups=[];
function spawnPopup(x,y,text,color,size){Popups.push({x,y,text,color:color||'#fff',size:size||13,vy:-45,life:1.0});}
function updatePopups(dt){for(let i=Popups.length-1;i>=0;i--){Popups[i].y+=Popups[i].vy*dt;Popups[i].life-=dt;if(Popups[i].life<=0)Popups.splice(i,1);}}
function drawPopups(){Popups.forEach(p=>{ctx.globalAlpha=Math.min(p.life,1);ctx.fillStyle=p.color;ctx.font=`bold ${p.size}px monospace`;ctx.textAlign='center';ctx.fillText(p.text,p.x,p.y);});ctx.globalAlpha=1;ctx.textAlign='left';}

const Shake={x:0,y:0,mag:0,dur:0};
function triggerShake(m,d){Shake.mag=Math.max(Shake.mag,m);Shake.dur=Math.max(Shake.dur,d);}
function updateShake(dt){if(Shake.dur>0){Shake.dur-=dt;Shake.x=(Math.random()*2-1)*Shake.mag;Shake.y=(Math.random()*2-1)*Shake.mag;if(Shake.dur<=0){Shake.x=0;Shake.y=0;}}}

const sfx={_ctx:null,init(){try{if(!this._ctx)this._ctx=new(window.AudioContext||window.webkitAudioContext)();if(this._ctx.state==='suspended')this._ctx.resume();}catch(e){}},play(f,d,t,v){try{this.init();if(!this._ctx)return;const o=this._ctx.createOscillator(),g=this._ctx.createGain();o.type=t||'square';o.frequency.value=f||440;g.gain.setValueAtTime(v||0.10,this._ctx.currentTime);g.gain.exponentialRampToValueAtTime(0.001,this._ctx.currentTime+(d||0.1));o.connect(g);g.connect(this._ctx.destination);o.start();o.stop(this._ctx.currentTime+(d||0.1));}catch(e){}}};

function lerp(a,b,t){return a+(b-a)*t;}
function clamp(v,mn,mx){return v<mn?mn:v>mx?mx:v;}
function aabb(ax,ay,aw,ah,bx,by,bw,bh){return ax<bx+bw&&ax+aw>bx&&ay<by+bh&&ay+ah>by;}
function randInt(a,b){return a+Math.floor(Math.random()*(b-a+1));}
function randFloat(a,b){return a+Math.random()*(b-a);}
function randChoice(arr){return arr[Math.floor(Math.random()*arr.length)];}
let _hiScore=parseInt(localStorage.getItem('hs_void')||'0');
function saveHiScore(s){if(s>_hiScore){_hiScore=s;localStorage.setItem('hs_void',s);}}
function drawText(t,x,y,c,s,a){ctx.fillStyle=c||'#fff';ctx.font=`bold ${s||13}px monospace`;ctx.textAlign=a||'left';ctx.fillText(t,x,y);}
function drawBar(x,y,w,h,v,m,fg,bg){ctx.fillStyle=bg||'#333';ctx.fillRect(x,y,w,h);ctx.fillStyle=fg||'#0f0';ctx.fillRect(x,y,Math.round(w*clamp(v/m,0,1)),h);}

const FIXED_DT=1/60;
const MAX_DT=0.1;
let lastTime=0;
let accumulator=0;
function loop(ts){const rd=Math.min((ts-lastTime)/1000,MAX_DT);lastTime=ts;accumulator+=rd;while(accumulator>=FIXED_DT){update(FIXED_DT);accumulator-=FIXED_DT;}renderFrame();requestAnimationFrame(loop);}
function update(dt){updateShake(dt);updateParticles(dt);updatePopups(dt);switch(gameState){case'menu':if(anyAction()||keyPressed('Space')){sfx.play(440,0.08,'square',0.1);startGame();setState('playing');}break;case'playing':updatePlaying(dt);break;case'gameover':updateGameover(dt);break;case'shop':updateShop(dt);break;case'victory':if(anyAction()){startGame();setState('playing');}break;}flushInput();}
function renderFrame(){ctx.save();ctx.translate(Shake.x,Shake.y);switch(gameState){case'menu':renderMenu();break;case'playing':renderPlaying();break;case'gameover':renderPlaying();renderGameoverOverlay();break;case'shop':renderShop();break;case'victory':renderPlaying();renderVictoryOverlay();break;}drawParticles();drawPopups();ctx.restore();}

// ══════════════════════════════════════════════════════════════════
// GAME CONSTANTS
// ══════════════════════════════════════════════════════════════════
const GAME_TITLE='VOID SECTOR';

const PALETTE={
  bg:'#040812',floor:'#080f1e',floor2:'#0b1428',

const ENEMY_DEFS={
  bot:    {hp:80, speed:55, damage:25,points:80, color:'#ff6644',w:30,h:30,alertRange:160,attackRange:40, attackCooldown:1.4,ranged:false},

// ══════════════════════════════════════════════════════════════════
// META-PROGRESSION
// ══════════════════════════════════════════════════════════════════
const _META_KEY='meta_void';
const UPGRADES=[
  {id:'power',  label:'Power Core',    desc:'+25% dmg /lv',   maxLv:3,cost:[70,140,230]},
  {id:'speed',  label:'Servo Boost',   desc:'-15% cd /lv',    maxLv:3,cost:[70,140,230]},
  {id:'shield', label:'Shield Matrix', desc:'+20 HP /lv',     maxLv:3,cost:[60,120,200]},
  {id:'credits',label:'Credit Chip',   desc:'+20 cr start/lv',maxLv:3,cost:[50,100,170]},
];
let _meta={coins:0,upgrades:{}};
let _runCoins=0;let _gameoverTimer=1.5;let _shopIdx=0;
let _dmgMult=1.0;let _cdMult=1.0;let _startCredits=0;

function loadMeta(){try{const s=localStorage.getItem(_META_KEY);_meta=s?JSON.parse(s):{coins:0,upgrades:{}};}catch(e){_meta={coins:0,upgrades:{}};}}
function saveMeta(){try{localStorage.setItem(_META_KEY,JSON.stringify(_meta));}catch(e){}}
function getUpgradeLevel(id){return _meta.upgrades[id]||0;}
function buyUpgrade(id){const u=UPGRADES.find(x=>x.id===id);if(!u)return false;const lv=getUpgradeLevel(id);if(lv>=u.maxLv)return false;const cost=u.cost[lv];if(_meta.coins<cost)return false;_meta.coins-=cost;_meta.upgrades[id]=(lv+1);saveMeta();return true;}
function applyUpgrades(){_dmgMult=1+getUpgradeLevel('power')*0.25;_cdMult=1-getUpgradeLevel('speed')*0.15;_startCredits=getUpgradeLevel('credits')*20;player.maxHp=100+getUpgradeLevel('shield')*20;player.hp=player.maxHp;player.credits=_startCredits;}
function _shopHit(px,py,x,y,w,h){return px>=x&&px<=x+w&&py>=y&&py<=y+h;}

function updateGameover(dt){
  _gameoverTimer-=dt;
  if(_gameoverTimer<=0||anyAction()){_meta.coins+=_runCoins;saveMeta();_shopIdx=0;setState('shop');}
}

function updateShop(dt){
  const mx=_shopClick.x>=0?_shopClick.x:(Touch.justTapped?Touch.x:-1);
  const my=_shopClick.y>=0?_shopClick.y:(Touch.justTapped?Touch.y:-1);
  if(mx<0&&!anyAction())return;
  const n=UPGRADES.length,cardW=Math.round(W*0.19),cardH=Math.round(H*0.32),gap=Math.round(W*0.02);
  const sy=Math.round(H*0.22),totalW=n*cardW+(n-1)*gap,sx=(W-totalW)/2;
  const btnW=160,btnH=42,btnX=(W-btnW)/2,btnY=sy+cardH+32;
  if(mx>=0){
    for(let i=0;i<n;i++){
      if(_shopHit(mx,my,sx+i*(cardW+gap),sy,cardW,cardH)){
        _shopIdx=i;
        if(buyUpgrade(UPGRADES[i].id)){sfx.play(660,0.12,'sine',0.1);applyUpgrades();}
        else sfx.play(110,0.06,'sawtooth',0.08);
        return;
      }
    }
    if(_shopHit(mx,my,btnX,btnY,btnW,btnH)){sfx.play(440,0.08,'square',0.1);startGame();setState('playing');}
  } else if(anyAction()){sfx.play(440,0.08,'square',0.1);startGame();setState('playing');}
}

function renderShop(){
  ctx.fillStyle=PALETTE.shopBg;ctx.fillRect(0,0,W,H);
  ctx.textAlign='center';
  ctx.fillStyle='#e0f0ff';ctx.font='bold 22px system-ui,sans-serif';ctx.fillText('UPGRADE TERMINAL',W/2,Math.round(H*0.12));
  ctx.fillStyle='#ffcc00';ctx.font='bold 15px system-ui,sans-serif';ctx.fillText(`🪙 ${_meta.coins} credits`,W/2,Math.round(H*0.19));
  const n=UPGRADES.length,cardW=Math.round(W*0.19),cardH=Math.round(H*0.32),gap=Math.round(W*0.02);
  const sy=Math.round(H*0.22),totalW=n*cardW+(n-1)*gap,sx=(W-totalW)/2;
  for(let i=0;i<n;i++){
    const u=UPGRADES[i],lv=getUpgradeLevel(u.id),cx=sx+i*(cardW+gap);
    ctx.fillStyle=_shopIdx===i?PALETTE.shopSel:PALETTE.shopCard;
    ctx.beginPath();if(ctx.roundRect)ctx.roundRect(cx,sy,cardW,cardH,8);else ctx.rect(cx,sy,cardW,cardH);ctx.fill();
    ctx.strokeStyle=_shopIdx===i?PALETTE.accent:'#1a3c70';ctx.lineWidth=1;ctx.stroke();
    ctx.fillStyle='#e0f0ff';ctx.font='bold 11px system-ui,sans-serif';ctx.fillText(u.label,cx+cardW/2,sy+22);
    ctx.fillStyle='#88aacc';ctx.font='10px system-ui,sans-serif';ctx.fillText(u.desc,cx+cardW/2,sy+38);
    for(let d=0;d<u.maxLv;d++){ctx.fillStyle=d<lv?PALETTE.accent:'#1a3c70';ctx.beginPath();ctx.arc(cx+cardW/2+(d-u.maxLv/2+0.5)*14,sy+cardH-36,5,0,Math.PI*2);ctx.fill();}
    if(lv<u.maxLv){ctx.fillStyle='#ffcc00';ctx.font='bold 12px system-ui,sans-serif';ctx.fillText(`${u.cost[lv]}cr`,cx+cardW/2,sy+cardH-14);}
    else{ctx.fillStyle='#00ffcc';ctx.font='bold 11px system-ui,sans-serif';ctx.fillText('MAX',cx+cardW/2,sy+cardH-14);}
  }
  const btnW=160,btnH=42,btnX=(W-btnW)/2,btnY=sy+cardH+32;
  ctx.fillStyle='#102040';ctx.beginPath();if(ctx.roundRect)ctx.roundRect(btnX,btnY,btnW,btnH,8);else ctx.rect(btnX,btnY,btnW,btnH);ctx.fill();
  ctx.strokeStyle=PALETTE.accent;ctx.lineWidth=1;ctx.stroke();
  ctx.fillStyle='#fff';ctx.font='bold 16px system-ui,sans-serif';ctx.fillText('DEPLOY',W/2,btnY+27);
  ctx.textAlign='left';
}

// ROOM DEFINITIONS — 5 rooms linear East
// ══════════════════════════════════════════════════════════════════
function buildRooms(){
  rooms.length=0;
  const ROOM_W=18*TILE,ROOM_H=14*TILE,GAP=TILE*2,B=TILE;

  function makeRoom(worldX,worldY,extraWalls,enemyList,lootList,doors){
    const walls=[];
    walls.push({x:worldX,y:worldY,w:ROOM_W,h:B});
    walls.push({x:worldX,y:worldY+ROOM_H-B,w:ROOM_W,h:B});
    walls.push({x:worldX,y:worldY,w:B,h:ROOM_H});
    walls.push({x:worldX+ROOM_W-B,y:worldY,w:B,h:ROOM_H});
    extraWalls.forEach(([ex,ey,ew,eh])=>walls.push({x:worldX+ex,y:worldY+ey,w:ew,h:eh}));
    const absE=enemyList.map(e=>({...e,x:worldX+e.x,y:worldY+e.y}));
    const absL=lootList.map(l=>({...l,x:worldX+l.x,y:worldY+l.y}));
    return{worldX,worldY,w:ROOM_W,h:ROOM_H,walls,enemyList:absE,lootList:absL,doors,cleared:false};
  }

  const STEP=ROOM_W+GAP;

  // Room 0 — Entry Hub: 4 server rack pillars, 2 bots
  rooms.push(makeRoom(0,0,
    [[4*TILE,2*TILE,TILE,3*TILE],[4*TILE,9*TILE,TILE,3*TILE],
     [13*TILE,2*TILE,TILE,3*TILE],[13*TILE,9*TILE,TILE,3*TILE]],
    [{type:'bot',x:6*TILE,y:4*TILE},{type:'bot',x:11*TILE,y:8*TILE}],
    [{type:'credits',x:9*TILE,y:6*TILE,value:25}],
    {N:null,S:null,E:1,W:null}
  ));

  // Room 1 — Server Hall: horizontal banks (wide obstacles), 2 drones + 1 turret
  rooms.push(makeRoom(STEP,0,
    [[2*TILE,3*TILE,5*TILE,TILE],[11*TILE,3*TILE,5*TILE,TILE],
     [2*TILE,10*TILE,5*TILE,TILE],[11*TILE,10*TILE,5*TILE,TILE]],
    [{type:'drone',x:5*TILE,y:4*TILE},{type:'drone',x:12*TILE,y:8*TILE},{type:'turret',x:9*TILE,y:6*TILE}],
    [{type:'medkit',x:9*TILE,y:10*TILE,value:35},{type:'credits',x:4*TILE,y:9*TILE,value:20}],
    {N:null,S:null,E:2,W:0}
  ));

  // Room 2 — Energy Lab: cross-shaped conduit pillars, 2 turrets + 1 stealth
  rooms.push(makeRoom(STEP*2,0,
    [[8*TILE,TILE,2*TILE,TILE],[8*TILE,12*TILE,2*TILE,TILE],
     [TILE,5*TILE,TILE,4*TILE],[16*TILE,5*TILE,TILE,4*TILE]],
    [{type:'turret',x:4*TILE,y:5*TILE},{type:'turret',x:13*TILE,y:5*TILE},{type:'stealth',x:9*TILE,y:9*TILE}],
    [{type:'credits',x:9*TILE,y:5*TILE,value:30},{type:'medkit',x:3*TILE,y:10*TILE,value:25}],
    {N:null,S:null,E:3,W:1}
  ));

  // Room 3 — Stealth Wing: scattered cover pillars, drone + stealth + bot
  rooms.push(makeRoom(STEP*3,0,
    [[3*TILE,3*TILE,TILE,TILE],[7*TILE,6*TILE,TILE,TILE],[12*TILE,3*TILE,TILE,TILE],
     [5*TILE,10*TILE,TILE,TILE],[10*TILE,9*TILE,TILE,TILE],[15*TILE,8*TILE,TILE,TILE]],
    [{type:'drone',x:4*TILE,y:4*TILE},{type:'stealth',x:11*TILE,y:7*TILE},{type:'bot',x:14*TILE,y:10*TILE}],
    [{type:'credits',x:8*TILE,y:4*TILE,value:40},{type:'medkit',x:14*TILE,y:4*TILE,value:30}],
    {N:null,S:null,E:4,W:2}
  ));

  // Room 4 — Core Chamber: 4 corner 2×2 pillars + center 2×2 pillar, Cyber Boss
  rooms.push(makeRoom(STEP*4,0,
    [[2*TILE,2*TILE,2*TILE,2*TILE],[14*TILE,2*TILE,2*TILE,2*TILE],
     [2*TILE,10*TILE,2*TILE,2*TILE],[14*TILE,10*TILE,2*TILE,2*TILE],
     [8*TILE,6*TILE,2*TILE,2*TILE]],
    [{type:'boss',x:9*TILE,y:6*TILE}],
    [{type:'credits',x:7*TILE,y:11*TILE,value:100}],
    {N:null,S:null,E:null,W:3}
  ));
}

// ══════════════════════════════════════════════════════════════════
// WALL COLLISION — Engine contract (AABB sweep)
// ══════════════════════════════════════════════════════════════════
function resolveWalls(ent,roomWalls,dt){
  ent.x+=ent.vx*dt;
  for(const w of roomWalls){if(aabb(ent.x,ent.y,ent.w,ent.h,w.x,w.y,w.w,w.h)){if(ent.vx>0)ent.x=w.x-ent.w;else ent.x=w.x+w.w;ent.vx=0;}}
  ent.y+=ent.vy*dt;
  for(const w of roomWalls){if(aabb(ent.x,ent.y,ent.w,ent.h,w.x,w.y,w.w,w.h)){if(ent.vy>0)ent.y=w.y-ent.h;else ent.y=w.y+w.h;ent.vy=0;}}
}

// ══════════════════════════════════════════════════════════════════
// ENEMY AI
// ══════════════════════════════════════════════════════════════════
function fireEnemyBolt(e,tdx,tdy){
  const d=Math.sqrt(tdx*tdx+tdy*tdy)||1;
  const spd=e.type==='boss'&&e.phase===2?ENEMY_SHOT_SPEED*1.35:ENEMY_SHOT_SPEED;
  enemyBulletPool.get(b=>{
    b.x=e.x+e.w/2;b.y=e.y+e.h/2;
    b.vx=tdx/d*spd;b.vy=tdy/d*spd;
    b.damage=ENEMY_DEFS[e.type].damage;b.life=3.0;b.r=5;
  });
  sfx.play(180,0.04,'square',0.04);
}

function updateEnemy(e,dt,room){
  e.flashTimer=Math.max(0,e.flashTimer-dt);
  e.iframes=Math.max(0,e.iframes-dt);

  if(e.knockTimer>0){e.knockTimer-=dt;e.vx=lerp(e.vx,0,dt*8);e.vy=lerp(e.vy,0,dt*8);resolveWalls(e,room.walls,dt);return;}

  const pdx=player.x+player.w/2-(e.x+e.w/2);
  const pdy=player.y+player.h/2-(e.y+e.h/2);
  const dist=Math.sqrt(pdx*pdx+pdy*pdy);
  const def=ENEMY_DEFS[e.type];

  // Stealth fades when idle
  if(e.type==='stealth'){
    e.stealthAlpha=lerp(e.stealthAlpha,e.state==='idle'?0.14:1.0,dt*3);
  }

  // Boss phase 2 at 50% HP
  if(e.type==='boss'&&e.phase===1&&e.hp<350){
    e.phase=2;e.speed=72;
    spawnParticles(e.x+e.w/2,e.y+e.h/2,24,{color:'#ff0088',speed:100,life:0.5});
    triggerShake(6,0.35);sfx.play(60,0.4,'sawtooth',0.12);
    spawnPopup(e.x+e.w/2,e.y-24,'PHASE 2!','#ff0088',16);
  }

  switch(e.state){
    case'idle':
      e.vx*=0.85;e.vy*=0.85;
      if(dist<def.alertRange){e.state=e.type==='turret'?'attack':'chase';spawnPopup(e.x+e.w/2,e.y-10,'!','#ff4',16);sfx.play(330,0.06,'sawtooth',0.06);}
      break;
    case'chase':
      if(dist>0){e.vx=pdx/dist*def.speed;e.vy=pdy/dist*def.speed;}
      if(dist<def.attackRange)e.state='attack';
      break;
    case'attack':
      e.vx*=def.ranged?0.5:0.6;e.vy*=def.ranged?0.5:0.6;
      e.angle=Math.atan2(pdy,pdx);
      e.attackTimer+=dt;
      const cd=e.type==='boss'&&e.phase===2?def.attackCooldown*0.65:def.attackCooldown;
      if(e.attackTimer>=cd){
        e.attackTimer=0;
        if(def.ranged){
          if(e.type==='boss'&&e.phase===2){
            for(let i=0;i<8;i++){const a=i*Math.PI/4+e.bossTimer*0.4;fireEnemyBolt(e,Math.cos(a)*100,Math.sin(a)*100);}
          } else if(e.type==='boss'){
            for(let i=0;i<4;i++){const a=e.angle+i*Math.PI/2;fireEnemyBolt(e,Math.cos(a)*100,Math.sin(a)*100);}
          } else {
            fireEnemyBolt(e,pdx,pdy);
          }
        } else {
          if(dist<def.attackRange+10&&player.iframes<=0){
            player.hp-=def.damage;player.iframes=player.IFRAME_DUR;
            const kx=pdx>0?-1:1,ky=pdy>0?-1:1;
            player.vx+=kx*180;player.vy+=ky*180;
            triggerShake(4,0.22);sfx.play(150,0.18,'sawtooth',0.14);
            spawnParticles(player.x+player.w/2,player.y+player.h/2,6,{color:'#00ffcc',speed:60});
            if(player.hp<=0){saveHiScore(GAME_SCORE);_runCoins=player.credits;_gameoverTimer=1.5;setState('gameover');}
          }
        }
      }
      if(!def.ranged&&dist>def.attackRange+20)e.state='chase';
      if(def.ranged&&e.type!=='turret'&&dist>def.attackRange+50)e.state='chase';
      break;
  }
  if(e.type==='boss')e.bossTimer+=dt;
  if(e.type!=='turret')resolveWalls(e,room.walls,dt);
}

// ══════════════════════════════════════════════════════════════════
// INIT
// ══════════════════════════════════════════════════════════════════
loadMeta();
function startGame(){
  loadMeta();_runCoins=0;_gameoverTimer=1.5;_bgTimer=0;
  buildRooms();currentRoomIdx=0;GAME_SCORE=0;
  player.iframes=0;player.credits=0;player.xp=0;player.level=1;
  player.shotTimer=0;player.facingX=1;player.facingY=0;
  applyUpgrades();
  loadRoom(0);
}

function loadRoom(idx){
  currentRoomIdx=idx;
  const room=rooms[idx];
  player.x=room.worldX+room.w/2-player.w/2;
  player.y=room.worldY+room.h/2-player.h/2;
  player.vx=0;player.vy=0;
  enemyPool.clear();lootPool.clear();bulletPool.clear();enemyBulletPool.clear();

  if(!room.cleared){
    room.enemyList.forEach(eDef=>{
      const def=ENEMY_DEFS[eDef.type]||ENEMY_DEFS.bot;
      enemyPool.get(e=>{
        Object.assign(e,def);
        e.x=eDef.x;e.y=eDef.y;e.hp=e.maxHp=def.hp;e.type=eDef.type;
        e.w=def.w;e.h=def.h;
        e.state='idle';e.attackTimer=0;e.flashTimer=0;e.iframes=0;
        e.knockX=0;e.knockY=0;e.knockTimer=0;e.angle=0;
        e.stealthAlpha=1.0;e.phase=1;e.bossTimer=0;
      });
    });
    room.lootList.forEach(l=>{lootPool.get(lo=>{lo.x=l.x;lo.y=l.y;lo.type=l.type;lo.value=l.value||10;lo.bobTimer=Math.random()*Math.PI*2;});});
  }
  cam.x=room.worldX+room.w/2-W/2;
  cam.y=room.worldY+room.h/2-H/2;
}

// ══════════════════════════════════════════════════════════════════
// UPDATE
// ══════════════════════════════════════════════════════════════════
function updatePlaying(dt){
  const room=rooms[currentRoomIdx];
  _bgTimer+=dt;

  // ── Movement ─────────────────────────────────────────────────
  let dx=(keyDown('ArrowRight')||keyDown('KeyD')?1:0)-(keyDown('ArrowLeft')||keyDown('KeyA')?1:0);
  let dy=(keyDown('ArrowDown')||keyDown('KeyS')?1:0)-(keyDown('ArrowUp')||keyDown('KeyW')?1:0);
  if(Touch.active){dx=Touch.stickX;dy=Touch.stickY;}
  const mag=Math.hypot(dx,dy)||0;
  if(mag>0){const nx=dx/mag,ny=dy/mag;player.vx=nx*PLAYER_SPEED;player.vy=ny*PLAYER_SPEED;player.facingX=nx;player.facingY=ny;}
  else{player.vx*=0.7;player.vy*=0.7;if(Math.abs(player.vx)<2)player.vx=0;if(Math.abs(player.vy)<2)player.vy=0;}
  player.iframes=Math.max(0,player.iframes-dt);
  if(player.iframes>0){player.vx*=0.85;player.vy*=0.85;}
  resolveWalls(player,room.walls,dt);
  player.animTimer+=dt;

  // ── Shooting ─────────────────────────────────────────────────
  player.shotTimer=Math.max(0,player.shotTimer-dt);
  const wantShoot=keyPressed('Space')||keyPressed('KeyZ')||keyPressed('KeyJ')||attackInput;
  const activeCd=SHOT_COOLDOWN*_cdMult;
  if(wantShoot&&player.shotTimer<=0){
    player.shotTimer=activeCd;
    const dmg=Math.round(SHOT_DAMAGE*_dmgMult+(player.level-1)*4);
    bulletPool.get(b=>{
      b.x=player.x+player.w/2;b.y=player.y+player.h/2;
      b.vx=player.facingX*SHOT_SPEED;b.vy=player.facingY*SHOT_SPEED;
      b.damage=dmg;b.traveled=0;b.r=5;
    });
    sfx.play(880,0.04,'square',0.08);
  }

  // ── Player bullets ────────────────────────────────────────────
  bulletPool.update(b=>{
    const mx=b.vx*dt,my=b.vy*dt;
    b.x+=mx;b.y+=my;b.traveled+=Math.hypot(mx,my);
    if(b.traveled>SHOT_RANGE){spawnParticles(b.x,b.y,2,{color:'#00ffcc',speed:40,life:0.12});return false;}
    for(const w of room.walls){if(aabb(b.x-b.r,b.y-b.r,b.r*2,b.r*2,w.x,w.y,w.w,w.h)){spawnParticles(b.x,b.y,3,{color:'#00ffcc',speed:55,life:0.15});return false;}}
    let hit=false;
    enemyPool.active.forEach(e=>{
      if(!e.alive||e.iframes>0||hit)return;
      if(aabb(b.x-b.r,b.y-b.r,b.r*2,b.r*2,e.x,e.y,e.w,e.h)){
        hit=true;
        e.hp-=b.damage;e.flashTimer=0.10;e.iframes=0.18;
        const ang=Math.atan2(e.y-player.y,e.x-player.x);
        e.vx=Math.cos(ang)*130;e.vy=Math.sin(ang)*130;e.knockTimer=0.14;
        spawnParticles(b.x,b.y,6,{color:e.color,speed:55,life:0.2});
        spawnPopup(e.x+e.w/2,e.y-8,`-${b.damage}`,'#0cf',12);
        sfx.play(220,0.06,'sawtooth',0.09);
        if(e.hp<=0){
          GAME_SCORE+=e.points;player.xp+=e.points/2;
          spawnParticles(e.x+e.w/2,e.y+e.h/2,14,{color:e.color,speed:85,life:0.45,gravity:70});
          if(Math.random()<0.35)lootPool.get(l=>{l.x=e.x;l.y=e.y;l.type='credits';l.value=randInt(8,25);l.bobTimer=0;});
          if(Math.random()<0.10)lootPool.get(l=>{l.x=e.x;l.y=e.y;l.type='medkit';l.value=25;l.bobTimer=0;});
          e.alive=false;sfx.play(440,0.10,'square',0.10);
          if(enemyPool.active.length===0&&!room.cleared){
            room.cleared=true;sfx.play(660,0.15,'sine',0.10);
            spawnPopup(player.x+player.w/2,player.y-30,'SECTOR CLEAR!','#0cf',15);
          }
        }
      }
    });
    return!hit;
  });

  // ── Enemy bullets ─────────────────────────────────────────────
  enemyBulletPool.update(b=>{
    b.x+=b.vx*dt;b.y+=b.vy*dt;b.life-=dt;
    if(b.life<=0)return false;
    for(const w of room.walls){if(aabb(b.x-b.r,b.y-b.r,b.r*2,b.r*2,w.x,w.y,w.w,w.h)){spawnParticles(b.x,b.y,2,{color:'#ff4466',speed:40,life:0.1});return false;}}
    if(player.iframes<=0&&aabb(b.x-b.r,b.y-b.r,b.r*2,b.r*2,player.x,player.y,player.w,player.h)){
      player.hp-=b.damage;player.iframes=player.IFRAME_DUR;
      triggerShake(3,0.18);sfx.play(150,0.15,'sawtooth',0.12);
      spawnParticles(player.x+player.w/2,player.y+player.h/2,5,{color:'#00ffcc',speed:55});
      if(player.hp<=0){saveHiScore(GAME_SCORE);_runCoins=player.credits;_gameoverTimer=1.5;setState('gameover');}
      return false;
    }
    return true;
  });

  // ── Enemies ───────────────────────────────────────────────────
  enemyPool.update(e=>{updateEnemy(e,dt,room);return e.alive;});

  // ── Loot ─────────────────────────────────────────────────────
  lootPool.update(l=>{
    l.bobTimer+=dt;
    if(aabb(player.x,player.y,player.w,player.h,l.x,l.y,l.w,l.h)){
      if(l.type==='credits'){player.credits+=l.value;GAME_SCORE+=l.value*5;spawnPopup(l.x,l.y,`+${l.value}cr`,'#fc0',12);}
      if(l.type==='medkit'){player.hp=Math.min(player.maxHp,player.hp+l.value);spawnPopup(l.x,l.y,`+${l.value}HP`,'#0f0',12);}
      sfx.play(880,0.07,'sine',0.09);return false;
    }
    return true;
  });

  // ── XP / leveling ─────────────────────────────────────────────
  const xpNeed=100*player.level;
  if(player.xp>=xpNeed){player.xp-=xpNeed;player.level++;player.maxHp+=15;player.hp=Math.min(player.hp+20,player.maxHp);spawnPopup(player.x+player.w/2,player.y-40,'LEVEL UP!','#fc0',16);sfx.play(880,0.20,'sine',0.12);}

  // ── Door transitions ──────────────────────────────────────────
  if(room.cleared){
    const m=TILE*0.5;
    if(room.doors.E!==null&&player.x+player.w>room.worldX+room.w-TILE+m){loadRoom(room.doors.E);sfx.play(440,0.10,'square',0.09);return;}
    if(room.doors.W!==null&&player.x<room.worldX+TILE-m){loadRoom(room.doors.W);sfx.play(440,0.10,'square',0.09);return;}
    if(room.doors.S!==null&&player.y+player.h>room.worldY+room.h-TILE+m){loadRoom(room.doors.S);sfx.play(440,0.10,'square',0.09);return;}
    if(room.doors.N!==null&&player.y<room.worldY+TILE-m){loadRoom(room.doors.N);sfx.play(440,0.10,'square',0.09);return;}
  }

  // ── Victory ───────────────────────────────────────────────────
  if(rooms[rooms.length-1].cleared&&currentRoomIdx===rooms.length-1){saveHiScore(GAME_SCORE);setState('victory');}

  // ── Camera ────────────────────────────────────────────────────
  const tX=player.x+player.w/2-W/2,tY=player.y+player.h/2-H/2;
  const mnX=room.worldX,mxX=room.worldX+room.w-W;
  const mnY=room.worldY,mxY=room.worldY+room.h-H;
  cam.x=lerp(cam.x,clamp(tX,mnX,Math.max(mnX,mxX)),cam.SMOOTH*dt);
  cam.y=lerp(cam.y,clamp(tY,mnY,Math.max(mnY,mxY)),cam.SMOOTH*dt);
}

// ══════════════════════════════════════════════════════════════════
// SPRITE DRAWING
// ══════════════════════════════════════════════════════════════════
function drawOperative(x,y,w,h,fx,fy){
  const cx=x+w/2,cy=y+h/2;
  // Suit body
  ctx.fillStyle='#0a1e30';
  ctx.beginPath();if(ctx.roundRect)ctx.roundRect(x+2,y+4,w-4,h-6,4);else ctx.rect(x+2,y+4,w-4,h-6);ctx.fill();
  // Armor stripe
  ctx.fillStyle='#133a55';ctx.fillRect(x+4,y+6,3,h-12);ctx.fillRect(x+w-7,y+6,3,h-12);
  // Helmet
  ctx.fillStyle='#0d2038';ctx.beginPath();ctx.ellipse(cx,y+6,w*0.38,5,0,0,Math.PI*2);ctx.fill();
  // Visor glow
  ctx.fillStyle='#00ffcc';ctx.globalAlpha=0.85;ctx.beginPath();ctx.ellipse(cx,y+6,w*0.24,3,0,0,Math.PI*2);ctx.fill();ctx.globalAlpha=1;
  // Pistol arm
  ctx.strokeStyle='#4488cc';ctx.lineWidth=3;ctx.lineCap='round';
  ctx.beginPath();ctx.moveTo(cx+fx*4,cy+fy*4);ctx.lineTo(cx+fx*14,cy+fy*14);ctx.stroke();
  ctx.fillStyle='#6aacee';ctx.beginPath();ctx.arc(cx+fx*14,cy+fy*14,3,0,Math.PI*2);ctx.fill();
  // Suit edge glow
  ctx.shadowBlur=6;ctx.shadowColor='#00ffcc';
  ctx.strokeStyle='rgba(0,255,200,0.4)';ctx.lineWidth=1;
  ctx.beginPath();if(ctx.roundRect)ctx.roundRect(x+2,y+4,w-4,h-6,4);else ctx.rect(x+2,y+4,w-4,h-6);ctx.stroke();
  ctx.shadowBlur=0;
}

function drawBot(e,flash){
  const cx=e.x+e.w/2,cy=e.y+e.h/2;
  ctx.fillStyle=flash?'#fff':'#181818';
  ctx.beginPath();if(ctx.roundRect)ctx.roundRect(e.x+2,e.y+2,e.w-4,e.h-4,3);else ctx.rect(e.x+2,e.y+2,e.w-4,e.h-4);ctx.fill();
  // Shoulder plates
  ctx.fillStyle=flash?'#fff':'#252525';ctx.fillRect(e.x,e.y+5,4,e.h-12);ctx.fillRect(e.x+e.w-4,e.y+5,4,e.h-12);
  // Red visor bar
  ctx.fillStyle=flash?'#fff':'#ff2200';ctx.shadowBlur=5;ctx.shadowColor='#ff2200';
  ctx.fillRect(e.x+5,e.y+6,e.w-10,5);ctx.shadowBlur=0;
  // LED indicators
  ctx.fillStyle='#ff8800';
  ctx.beginPath();ctx.arc(cx-6,cy+6,2,0,Math.PI*2);ctx.fill();
  ctx.beginPath();ctx.arc(cx+6,cy+6,2,0,Math.PI*2);ctx.fill();
  // Antenna
  ctx.strokeStyle=flash?'#fff':'#555';ctx.lineWidth=1.5;
  ctx.beginPath();ctx.moveTo(cx,e.y+2);ctx.lineTo(cx,e.y-6);ctx.stroke();
  ctx.fillStyle='#ff4400';ctx.beginPath();ctx.arc(cx,e.y-6,2,0,Math.PI*2);ctx.fill();
}

function drawDrone(e,flash){
  const cx=e.x+e.w/2,cy=e.y+e.h/2,r=e.w/2-3;
  // Shield ring
  if(!flash){ctx.strokeStyle='rgba(80,140,255,0.3)';ctx.lineWidth=2;ctx.beginPath();ctx.arc(cx,cy,r+5,0,Math.PI*2);ctx.stroke();}
  // Diamond body
  ctx.fillStyle=flash?'#fff':'#0a1530';
  ctx.beginPath();ctx.moveTo(cx,cy-r);ctx.lineTo(cx+r,cy);ctx.lineTo(cx,cy+r);ctx.lineTo(cx-r,cy);ctx.closePath();ctx.fill();
  ctx.strokeStyle=flash?'#fff':'#4488ff';ctx.lineWidth=1.5;ctx.stroke();
  // Rotors
  const rot=_bgTimer*3.5;
  [0,1,2,3].forEach(i=>{const a=rot+i*Math.PI/2;ctx.fillStyle=flash?'#fff':'#4488ff';ctx.beginPath();ctx.arc(cx+Math.cos(a)*(r-2),cy+Math.sin(a)*(r-2),2.5,0,Math.PI*2);ctx.fill();});
  // Core
  ctx.fillStyle=flash?'#fff':'#aaccff';ctx.beginPath();ctx.arc(cx,cy,3.5,0,Math.PI*2);ctx.fill();
}

function drawTurret(e,flash){
  const cx=e.x+e.w/2,cy=e.y+e.h/2;
  // Base
  ctx.fillStyle=flash?'#fff':'#1e1e1e';ctx.beginPath();ctx.arc(cx,cy,e.w/2-1,0,Math.PI*2);ctx.fill();
  ctx.strokeStyle=flash?'#fff':'#ff8800';ctx.lineWidth=2;ctx.globalAlpha=0.5;ctx.beginPath();ctx.arc(cx,cy,e.w/2+1,0,Math.PI*2);ctx.stroke();ctx.globalAlpha=1;
  // Barrel (rotated toward player)
  ctx.save();ctx.translate(cx,cy);ctx.rotate(e.angle||0);
  ctx.fillStyle=flash?'#fff':'#333';ctx.fillRect(0,-4,e.w/2,8);
  ctx.fillStyle=flash?'#fff':'#ff8800';ctx.shadowBlur=4;ctx.shadowColor='#ff8800';
  ctx.beginPath();ctx.arc(e.w/2,0,4,0,Math.PI*2);ctx.fill();ctx.shadowBlur=0;
  ctx.restore();
}

function drawStealth(e,flash){
  const cx=e.x+e.w/2,cy=e.y+e.h/2,r=e.w/2-2;
  ctx.globalAlpha=flash?1.0:e.stealthAlpha;
  // Hexagon
  ctx.fillStyle='#1a0830';
  ctx.beginPath();for(let i=0;i<6;i++){const a=i*Math.PI/3-Math.PI/6;ctx.lineTo(cx+Math.cos(a)*r,cy+Math.sin(a)*r);}ctx.closePath();ctx.fill();
  ctx.strokeStyle='#aa44ff';ctx.lineWidth=1.5;ctx.shadowBlur=8;ctx.shadowColor='#aa44ff';
  ctx.beginPath();for(let i=0;i<6;i++){const a=i*Math.PI/3-Math.PI/6;ctx.lineTo(cx+Math.cos(a)*r,cy+Math.sin(a)*r);}ctx.closePath();ctx.stroke();
  ctx.shadowBlur=0;ctx.globalAlpha=1;
}

function drawBoss(e,flash){
  const cx=e.x+e.w/2,cy=e.y+e.h/2,r=e.w/2;
  // Rotating shield segments
  const segs=e.phase===2?8:6;
  ctx.lineWidth=4;ctx.lineCap='round';ctx.shadowBlur=10;ctx.shadowColor='#ff0088';
  for(let i=0;i<segs;i++){
    const a=e.bossTimer*1.5+i*(Math.PI*2/segs);
    ctx.strokeStyle=flash?'#fff':'#ff0088';
    ctx.beginPath();ctx.arc(cx,cy,r+9,a,a+Math.PI/segs);ctx.stroke();
  }
  ctx.shadowBlur=0;
  // Body
  ctx.fillStyle=flash?'#fff':'#180020';ctx.beginPath();ctx.arc(cx,cy,r,0,Math.PI*2);ctx.fill();
  // Pulsing core
  const pulse=0.55+0.45*Math.sin(_bgTimer*4.5);
  ctx.fillStyle=`rgba(255,0,136,${pulse})`;ctx.shadowBlur=14;ctx.shadowColor='#ff0088';
  ctx.beginPath();ctx.arc(cx,cy,r*0.4,0,Math.PI*2);ctx.fill();ctx.shadowBlur=0;
  // Eye slits
  if(!flash){ctx.fillStyle='#ff44aa';ctx.fillRect(cx-14,cy-5,9,5);ctx.fillRect(cx+5,cy-5,9,5);}
  // Phase 2: inner ring
  if(e.phase===2){
    ctx.strokeStyle='rgba(255,0,136,0.5)';ctx.lineWidth=2;
    ctx.beginPath();ctx.arc(cx,cy,r*0.65,e.bossTimer*-2,e.bossTimer*-2+Math.PI*1.5);ctx.stroke();
  }
}

// ══════════════════════════════════════════════════════════════════
// ENVIRONMENT DRAWING
// ══════════════════════════════════════════════════════════════════
function drawGridFloor(room){
  for(let r=0;r<room.h/TILE-2;r++){
    for(let c=0;c<room.w/TILE-2;c++){
      ctx.fillStyle=(r+c)%2===0?PALETTE.floor:PALETTE.floor2;
      ctx.fillRect(room.worldX+TILE+c*TILE,room.worldY+TILE+r*TILE,TILE,TILE);
    }
  }
  ctx.strokeStyle='rgba(0,120,255,0.07)';ctx.lineWidth=1;
  const fx=room.worldX+TILE,fy=room.worldY+TILE,fw=room.w-TILE*2,fh=room.h-TILE*2;
  for(let x=fx;x<=fx+fw;x+=TILE){ctx.beginPath();ctx.moveTo(x,fy);ctx.lineTo(x,fy+fh);ctx.stroke();}
  for(let y=fy;y<=fy+fh;y+=TILE){ctx.beginPath();ctx.moveTo(fx,y);ctx.lineTo(fx+fw,y);ctx.stroke();}
}

function drawServerRack(wx,wy,tall){
  const h=tall?TILE*3:TILE;
  ctx.fillStyle='#0d1828';ctx.fillRect(wx,wy,TILE,h);
  ctx.strokeStyle='#1a3c70';ctx.lineWidth=1;ctx.strokeRect(wx,wy,TILE,h);
  const slots=tall?6:2;
  for(let i=0;i<slots;i++){
    const colors=['#00ff44','#ff8800','#0055ff','#ff0000','#00ccff','#ffcc00'];
    ctx.fillStyle=colors[i%colors.length];
    ctx.fillRect(wx+TILE-8,wy+4+i*(h/slots*0.8),4,3);
  }
}

function drawConduitPillar(wx,wy,wh){
  ctx.fillStyle='#060c1a';ctx.fillRect(wx,wy,TILE,wh);
  const glow=0.35+0.25*Math.sin(_bgTimer*3+wx*0.01);
  ctx.strokeStyle=`rgba(0,220,180,${glow})`;ctx.lineWidth=2;ctx.strokeRect(wx,wy,TILE,wh);
  ctx.fillStyle=`rgba(0,180,140,${glow*0.25})`;ctx.fillRect(wx+TILE*0.3,wy+2,TILE*0.4,wh-4);
}

function drawCorePillar(wx,wy){
  ctx.fillStyle='#060a18';ctx.fillRect(wx,wy,TILE*2,TILE*2);
  ctx.strokeStyle='rgba(0,80,200,0.45)';ctx.lineWidth=1;ctx.strokeRect(wx,wy,TILE*2,TILE*2);
  const p=0.25+0.18*Math.sin(_bgTimer*2.2+wx*0.005);
  ctx.fillStyle=`rgba(0,80,200,${p})`;ctx.fillRect(wx+4,wy+4,TILE*2-8,TILE*2-8);
}

// ══════════════════════════════════════════════════════════════════
// RENDER
// ══════════════════════════════════════════════════════════════════
function renderPlaying(){
  ctx.fillStyle=PALETTE.bg;ctx.fillRect(0,0,W,H);
  ctx.save();ctx.translate(-Math.round(cam.x),-Math.round(cam.y));
  const room=rooms[currentRoomIdx];
  const ri=currentRoomIdx;

  // ── Floor ─────────────────────────────────────────────────────
  drawGridFloor(room);

  // ── Walls ─────────────────────────────────────────────────────
  room.walls.forEach(w=>{
    ctx.fillStyle=PALETTE.wall;ctx.fillRect(w.x,w.y,w.w,w.h);
    ctx.fillStyle=PALETTE.wallEdge;ctx.fillRect(w.x,w.y,w.w,4);
  });

  // ── Environment decorations (over walls) ──────────────────────
  if(ri===0){
    drawServerRack(room.worldX+4*TILE,room.worldY+2*TILE,true);
    drawServerRack(room.worldX+4*TILE,room.worldY+9*TILE,true);
    drawServerRack(room.worldX+13*TILE,room.worldY+2*TILE,true);
    drawServerRack(room.worldX+13*TILE,room.worldY+9*TILE,true);
  } else if(ri===1){
    for(let i=0;i<5;i++){
      ctx.fillStyle='#0a1824';
      ctx.fillRect(room.worldX+(2+i)*TILE,room.worldY+3*TILE,TILE,TILE);
      ctx.fillRect(room.worldX+(11+i)*TILE,room.worldY+3*TILE,TILE,TILE);
      ctx.fillRect(room.worldX+(2+i)*TILE,room.worldY+10*TILE,TILE,TILE);
      ctx.fillRect(room.worldX+(11+i)*TILE,room.worldY+10*TILE,TILE,TILE);
      ctx.strokeStyle='#1a3c70';ctx.lineWidth=1;
      ctx.strokeRect(room.worldX+(2+i)*TILE,room.worldY+3*TILE,TILE,TILE);
      ctx.strokeRect(room.worldX+(11+i)*TILE,room.worldY+3*TILE,TILE,TILE);
    }
  } else if(ri===2){
    drawConduitPillar(room.worldX+8*TILE,room.worldY+TILE,TILE);
    drawConduitPillar(room.worldX+8*TILE,room.worldY+12*TILE,TILE);
    drawConduitPillar(room.worldX+TILE,room.worldY+5*TILE,TILE*4);
    drawConduitPillar(room.worldX+16*TILE,room.worldY+5*TILE,TILE*4);
    // Energy beams between conduits
    ctx.strokeStyle=`rgba(0,220,180,${0.1+0.08*Math.sin(_bgTimer*4)})`;ctx.lineWidth=3;ctx.lineCap='round';
    ctx.beginPath();ctx.moveTo(room.worldX+9*TILE,room.worldY+TILE+20);ctx.lineTo(room.worldX+9*TILE,room.worldY+12*TILE+20);ctx.stroke();
    ctx.beginPath();ctx.moveTo(room.worldX+TILE+20,room.worldY+7*TILE);ctx.lineTo(room.worldX+16*TILE+20,room.worldY+7*TILE);ctx.stroke();
  } else if(ri===4){
    drawCorePillar(room.worldX+2*TILE,room.worldY+2*TILE);
    drawCorePillar(room.worldX+14*TILE,room.worldY+2*TILE);
    drawCorePillar(room.worldX+2*TILE,room.worldY+10*TILE);
    drawCorePillar(room.worldX+14*TILE,room.worldY+10*TILE);
    drawCorePillar(room.worldX+8*TILE,room.worldY+6*TILE);
    // Core ambient glow
    const pulse=0.3+0.25*Math.sin(_bgTimer*2.8);
    ctx.fillStyle=`rgba(255,0,136,${pulse*0.12})`;
    ctx.beginPath();ctx.arc(room.worldX+9*TILE,room.worldY+7*TILE,80,0,Math.PI*2);ctx.fill();
  }

  // ── Door openings ─────────────────────────────────────────────
  if(room.cleared){
    const dc=PALETTE.doorOpen;
    const drawDoor=(dx,dy,dw,dh)=>{
      ctx.fillStyle=dc;ctx.fillRect(dx,dy,dw,dh);
      ctx.shadowBlur=10;ctx.shadowColor=dc;ctx.strokeStyle=dc;ctx.lineWidth=2;ctx.strokeRect(dx,dy,dw,dh);ctx.shadowBlur=0;
    };
    if(room.doors.E!==null)drawDoor(room.worldX+room.w-TILE,room.worldY+room.h/2-TILE*0.75,TILE,TILE*1.5);
    if(room.doors.W!==null)drawDoor(room.worldX,room.worldY+room.h/2-TILE*0.75,TILE,TILE*1.5);
  }

  // ── Enemy bullets ─────────────────────────────────────────────
  enemyBulletPool.active.forEach(b=>{
    ctx.fillStyle='#ff4466';ctx.shadowBlur=6;ctx.shadowColor='#ff4466';
    ctx.beginPath();ctx.arc(b.x,b.y,b.r,0,Math.PI*2);ctx.fill();ctx.shadowBlur=0;
  });

  // ── Loot ──────────────────────────────────────────────────────
  lootPool.active.forEach(l=>{
    const bob=Math.sin(l.bobTimer*3)*3;
    ctx.fillStyle=l.type==='credits'?PALETTE.loot:'#44ff88';
    ctx.shadowBlur=6;ctx.shadowColor=ctx.fillStyle;
    ctx.beginPath();ctx.arc(l.x+l.w/2,l.y+l.h/2+bob,l.w/2,0,Math.PI*2);ctx.fill();ctx.shadowBlur=0;
    ctx.fillStyle='#000';ctx.font='bold 8px monospace';ctx.textAlign='center';
    ctx.fillText(l.type==='credits'?'$':'+',l.x+l.w/2,l.y+l.h/2+bob+3);ctx.textAlign='left';
  });

  // ── Enemies ───────────────────────────────────────────────────
  enemyPool.active.forEach(e=>{
    const flash=e.flashTimer>0;
    ctx.globalAlpha=e.type==='stealth'?e.stealthAlpha:1.0;
    switch(e.type){
      case'bot':drawBot(e,flash);break;
      case'drone':drawDrone(e,flash);break;
      case'turret':drawTurret(e,flash);break;
      case'stealth':drawStealth(e,flash);break;
      case'boss':drawBoss(e,flash);break;
    }
    ctx.globalAlpha=1;
    // HP bar above enemy (skip if flashing white)
    if(!flash)drawBar(e.x,e.y-9,e.w,5,e.hp,e.maxHp,'#0cf','#003');
    // Idle indicator
    if(e.state==='idle'){ctx.globalAlpha=0.4;ctx.fillStyle='#667';ctx.font='8px monospace';ctx.textAlign='center';ctx.fillText('zzz',e.x+e.w/2,e.y-12);ctx.textAlign='left';ctx.globalAlpha=1;}
  });

  // ── Player bullets ────────────────────────────────────────────
  bulletPool.active.forEach(b=>{
    ctx.fillStyle='#00ffcc';ctx.shadowBlur=8;ctx.shadowColor='#00ffcc';
    ctx.beginPath();ctx.arc(b.x,b.y,b.r,0,Math.PI*2);ctx.fill();
    // Tracer
    ctx.strokeStyle='rgba(0,255,200,0.25)';ctx.lineWidth=2;ctx.lineCap='round';
    ctx.beginPath();ctx.moveTo(b.x,b.y);ctx.lineTo(b.x-b.vx/SHOT_SPEED*18,b.y-b.vy/SHOT_SPEED*18);ctx.stroke();
    ctx.shadowBlur=0;
  });

  // ── Player ────────────────────────────────────────────────────
  const blink=player.iframes>0&&Math.floor(player.iframes/0.07)%2===0;
  if(!blink){
    ctx.globalAlpha=player.iframes>0?0.5:1.0;
    drawOperative(player.x,player.y,player.w,player.h,player.facingX||1,player.facingY||0);
    ctx.globalAlpha=1;
  }

  ctx.restore();

  // ── HUD ───────────────────────────────────────────────────────
  drawText(`SCORE: ${GAME_SCORE}`,10,22,PALETTE.ui,13);
  drawText(`LV ${player.level}`,W/2,22,'#88aacc',12,'center');
  drawText(`BEST: ${_hiScore}`,W-10,22,'#334455',11,'right');
  drawBar(10,H-32,150,10,player.hp,player.maxHp,'#0cf','#002233');
  drawText('HP',164,H-23,'#224455',10);
  drawBar(10,H-18,150,6,player.xp,100*player.level,PALETTE.xp,'#011f11');
  drawText('XP',164,H-13,PALETTE.xp,9);
  drawText(`Cr ${player.credits}`,W-10,H-22,PALETTE.loot,13,'right');
  if(player.shotTimer>0)drawBar(10,H-44,80,4,SHOT_COOLDOWN*_cdMult-player.shotTimer,SHOT_COOLDOWN*_cdMult,'#00ffcc','#022');
  const rLabel=currentRoomIdx===rooms.length-1?'CORE CHAMBER':`Sector ${currentRoomIdx+1}/${rooms.length}`;
  drawText(rLabel,W/2,H-10,'#334455',10,'center');
}

function renderMenu(){
  const now=performance.now()*0.001;
  ctx.fillStyle=PALETTE.bg;ctx.fillRect(0,0,W,H);
  // Grid
  ctx.strokeStyle='rgba(0,100,200,0.07)';ctx.lineWidth=1;
  for(let x=0;x<W;x+=TILE){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,H);ctx.stroke();}
  for(let y=0;y<H;y+=TILE){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke();}
  // Scan line
  ctx.fillStyle='rgba(0,200,255,0.04)';ctx.fillRect(0,((now*0.4)%1)*H,W,2);
  // Title
  ctx.textAlign='center';
  ctx.font='bold 48px "Courier New",monospace';
  ctx.shadowBlur=20;ctx.shadowColor='#00ffcc';ctx.fillStyle='#00ffcc';ctx.fillText('VOID',W/2,H*0.28);
  ctx.shadowColor='#00aaff';ctx.fillStyle='#00aaff';ctx.fillText('SECTOR',W/2,H*0.41);ctx.shadowBlur=0;
  ctx.fillStyle='#88aacc';ctx.font='11px system-ui,sans-serif';
  ctx.fillText('WASD / Arrows — Move     SPACE / Z — Fire',W/2,H*0.52);
  ctx.fillText('Clear all sectors to reach the Core',W/2,H*0.59);
  if(_meta.coins>0){ctx.fillStyle='#ffcc00';ctx.font='bold 13px system-ui,sans-serif';ctx.fillText(`🪙 ${_meta.coins} credits`,W/2,H*0.66);}
  ctx.fillStyle='#fff';ctx.font='bold 17px system-ui,sans-serif';ctx.fillText('PRESS SPACE',W/2,H*0.74);
  ctx.fillStyle='#334455';ctx.font='12px system-ui,sans-serif';ctx.fillText(`BEST: ${_hiScore}`,W/2,H*0.83);
  ctx.textAlign='left';
}

function renderGameoverOverlay(){
  ctx.fillStyle='rgba(0,0,0,0.78)';ctx.fillRect(0,0,W,H);
  ctx.textAlign='center';
  ctx.fillStyle='#ff4466';ctx.font='bold 34px system-ui,sans-serif';ctx.fillText('OPERATIVE KIA',W/2,H*0.35);
  ctx.fillStyle='#fff';ctx.font='bold 18px system-ui,sans-serif';ctx.fillText(`SCORE: ${GAME_SCORE}`,W/2,H*0.45);
  ctx.fillStyle='#00ffcc';ctx.font='bold 15px system-ui,sans-serif';ctx.fillText(`BEST: ${_hiScore}`,W/2,H*0.53);
  if(_runCoins>0){ctx.fillStyle='#ffcc00';ctx.font='bold 14px system-ui,sans-serif';ctx.fillText(`🪙 ${_runCoins} credits earned`,W/2,H*0.61);}
  ctx.fillStyle='#88aacc';ctx.font='13px system-ui,sans-serif';ctx.fillText('Redirecting to upgrade terminal…',W/2,H*0.70);
  ctx.textAlign='left';
}

function renderVictoryOverlay(){
  ctx.fillStyle='rgba(0,0,0,0.65)';ctx.fillRect(0,0,W,H);
  ctx.textAlign='center';
  ctx.shadowBlur=14;ctx.shadowColor='#00ffcc';ctx.fillStyle='#00ffcc';ctx.font='bold 28px system-ui,sans-serif';ctx.fillText('VOID SECTOR CLEARED!',W/2,H*0.35);ctx.shadowBlur=0;
  ctx.fillStyle='#fff';ctx.font='bold 18px system-ui,sans-serif';ctx.fillText(`SCORE: ${GAME_SCORE}`,W/2,H*0.47);
  ctx.fillStyle='#88aacc';ctx.font='13px system-ui,sans-serif';ctx.fillText('SPACE to run again',W/2,H*0.60);
  ctx.textAlign='left';
}

// ══════════════════════════════════════════════════════════════════
// START
// ══════════════════════════════════════════════════════════════════
startGame();
requestAnimationFrame(t=>{lastTime=t;requestAnimationFrame(loop);});
</script>
