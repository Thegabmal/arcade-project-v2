<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>DEAD COMPOUND — Zombie Survival 3D</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #000; overflow: hidden; font-family: system-ui, sans-serif; }
  #c { display: block; width: 100vw; height: 100vh; }

  #hud { position: fixed; inset: 0; pointer-events: none; font-family: system-ui, sans-serif; }
  #score-disp {
    position: absolute; top: 20px; left: 50%; transform: translateX(-50%);
    font-size: 22px; font-weight: 700; color: #88ff44; letter-spacing: 2px; text-shadow: 0 0 10px #88ff4455;
  }
  #wave-disp {
    position: absolute; top: 52px; left: 50%; transform: translateX(-50%);
    font-size: 13px; color: #888; letter-spacing: 3px; text-transform: uppercase;
  }
  #hp-wrap { position: absolute; bottom: 60px; left: 24px; }
  #hp-label { font-size: 11px; color: #888; letter-spacing: 2px; margin-bottom: 4px; }
  #hp-bg { width: 180px; height: 14px; background: #222; border-radius: 7px; overflow: hidden; }
  #hp-fill { height: 100%; background: linear-gradient(90deg,#c0392b,#e74c3c); border-radius: 7px; transition: width 0.15s; }
  #ammo-disp { position: absolute; bottom: 60px; right: 24px; font-size: 26px; font-weight: 700; color: #ffd700; }
  #ammo-label { font-size: 11px; color: #888; letter-spacing: 2px; margin-bottom: 4px; }
  #coins-disp { position: absolute; top: 20px; right: 24px; font-size: 15px; color: #ffd700; }
  #hit-flash { position: absolute; inset: 0; background: rgba(192,57,43,0); pointer-events: none; transition: background 0.07s; }
  #crosshair {
    position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%);
    color: rgba(136,255,68,0.9); font-size: 20px; line-height: 1; pointer-events: none;
  }
  #reload-msg {
    position: absolute; bottom: 104px; left: 50%; transform: translateX(-50%);
    font-size: 14px; color: #ff8844; letter-spacing: 2px; display: none;
  }
  #kill-count {
    position: absolute; top: 80px; left: 50%; transform: translateX(-50%);
    font-size: 13px; color: #666; letter-spacing: 3px;
  }
  #wave-banner {
    position: absolute; top: 35%; left: 50%; transform: translateX(-50%);
    font-size: 36px; font-weight: 700; color: #88ff44;
    opacity: 0; transition: opacity 0.4s; letter-spacing: 6px;
    text-shadow: 0 0 20px #88ff44; pointer-events: none;
  }
  #ammo-warn {
    position: absolute; bottom: 100px; right: 24px;
    font-size: 12px; color: #ff4444; letter-spacing: 2px; display: none;
  }

  #overlay {
    position: fixed; inset: 0;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    background: rgba(0,0,0,0.9); color: #fff;
  }
  #overlay h1 {
    font-size: 48px; font-weight: 900; letter-spacing: 6px;
    color: #88ff44; text-shadow: 0 0 30px #88ff4488;
    font-family: 'Impact', system-ui; margin-bottom: 6px;
  }
  #overlay .sub { font-size: 13px; color: #555; letter-spacing: 4px; margin-bottom: 40px; }
  .menu-btn {
    padding: 13px 36px; margin: 5px;
    font-size: 14px; font-weight: 700; letter-spacing: 2px;
    border: 2px solid #88ff44; background: transparent; color: #88ff44;
    cursor: pointer; text-transform: uppercase; transition: all 0.15s; font-family: system-ui;
  }
  .menu-btn:hover { background: #88ff44; color: #000; }
  #gameover-score { font-size: 28px; color: #88ff44; margin: 16px 0; }

  #shop-overlay {
    position: fixed; inset: 0; background: rgba(0,0,0,0.93);
    display: none; flex-direction: column; align-items: center; justify-content: center;
    color: #fff; font-family: system-ui;
  }
  #shop-overlay h2 { font-size: 30px; color: #88ff44; letter-spacing: 4px; margin-bottom: 6px; }
  #shop-coins-disp { font-size: 15px; color: #ffd700; margin-bottom: 24px; }
  #shop-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; max-width: 540px; width: 100%; }
  .shop-card { border: 2px solid #333; padding: 16px; cursor: pointer; transition: all 0.15s; background: #060a04; }
  .shop-card:hover { border-color: #88ff44; background: #0a1406; }
  .shop-card h3 { font-size: 13px; color: #88ff44; margin-bottom: 6px; }
  .shop-card p  { font-size: 11px; color: #666; margin-bottom: 10px; line-height: 1.4; }
  .shop-card .cost { font-size: 12px; color: #ffd700; font-weight: 700; }
  .shop-card .lvl  { font-size: 11px; color: #444; float: right; }
  #shop-skip { margin-top: 18px; font-size: 13px; color: #444; cursor: pointer; letter-spacing: 2px; }
  #shop-skip:hover { color: #aaa; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hud" style="display:none;">
  <div id="hit-flash"></div>
  <div id="crosshair">+</div>
  <div id="score-disp">0</div>
  <div id="wave-disp">WAVE 1</div>
  <div id="kill-count">KILLS: 0</div>
  <div id="coins-disp">🪙 0</div>
  <div id="hp-wrap">
    <div id="hp-label">HEALTH</div>
    <div id="hp-bg"><div id="hp-fill" style="width:100%"></div></div>
  </div>
  <div id="ammo-disp">
    <div id="ammo-label">AMMO</div>
    <div id="ammo-count">30 / 120</div>
  </div>
  <div id="ammo-warn">LOW AMMO!</div>
  <div id="reload-msg">[ RELOADING ]</div>
  <div id="wave-banner">WAVE 1</div>
</div>

<div id="overlay">
  <h1>DEAD COMPOUND</h1>
  <div class="sub">ZOMBIE SURVIVAL 3D</div>
  <button class="menu-btn" id="btn-play" onclick="startGame()">SURVIVE</button>
  <div style="font-size:11px;color:#444;margin-top:14px;">WASD — MOVE &nbsp;|&nbsp; MOUSE — AIM &nbsp;|&nbsp; LMB — SHOOT &nbsp;|&nbsp; R — RELOAD</div>
</div>

<div id="shop-overlay">
  <h2>SUPPLY DROP</h2>
  <div id="shop-coins-disp">🪙 0</div>
  <div id="shop-grid"></div>
  <div id="shop-skip">[ SKIP → ]</div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r160/three.min.js"></script>
<script>
// ─── META ─────────────────────────────────────────────────────────────────────
const META_KEY='meta_dead_compound';
const UPGRADES=[
  {id:'mag',    name:'Extended Mag',  desc:'+15 ammo per clip per level',    cost:30,maxLv:3,effect:'ammo'},
  {id:'damage', name:'Hollow Point',  desc:'+30% bullet damage per level',   cost:40,maxLv:3,effect:'dmg'},
  {id:'armor',  name:'Body Armor',    desc:'+25 max HP per level',           cost:45,maxLv:3,effect:'hp'},
  {id:'reload', name:'Speed Loader',  desc:'-0.5s reload time per level',    cost:35,maxLv:3,effect:'reload'},
];
let meta={coins:0,upgrades:{}};
function loadMeta(){try{const s=localStorage.getItem(META_KEY);if(s)meta=JSON.parse(s);}catch(e){}
  UPGRADES.forEach(u=>{if(!meta.upgrades[u.id])meta.upgrades[u.id]=0;});}
function saveMeta(){try{localStorage.setItem(META_KEY,JSON.stringify(meta));}catch(e){}}
function buyUpgrade(id){
  const u=UPGRADES.find(u=>u.id===id);if(!u)return;
  const lv=meta.upgrades[id];if(lv>=u.maxLv)return;
  const cost=u.cost*(lv+1);if(meta.coins<cost)return;
  meta.coins-=cost;meta.upgrades[id]++;saveMeta();
}
function applyUpgrades(){
  const lv=id=>meta.upgrades[id]||0;
  player.maxAmmo=30+lv('mag')*15;
  player.bulletDmg=1+lv('damage')*0.3;
  player.maxHp=100+lv('armor')*25;
  player.reloadTime=2.5-lv('reload')*0.5;
}
loadMeta();

// ─── THREE.JS ─────────────────────────────────────────────────────────────────
const canvas=document.getElementById('c');
const renderer=new THREE.WebGLRenderer({canvas,antialias:true});
renderer.setPixelRatio(Math.min(window.devicePixelRatio,2));
renderer.shadowMap.enabled=true;
renderer.setSize(window.innerWidth,window.innerHeight);

const scene=new THREE.Scene();
scene.background=new THREE.Color(0x0d1106);
scene.fog=new THREE.FogExp2(0x0d1106,0.035);

const camera=new THREE.PerspectiveCamera(75,window.innerWidth/window.innerHeight,0.1,120);
const clock=new THREE.Clock();

window.addEventListener('resize',()=>{
  camera.aspect=window.innerWidth/window.innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth,window.innerHeight);
});

// ─── LIGHTING ─────────────────────────────────────────────────────────────────
scene.add(new THREE.AmbientLight(0x112211,0.7));
scene.add(new THREE.HemisphereLight(0x224411,0x001100,0.5));
// Floodlights at corners
[[-12,4,-12],[12,4,-12],[12,4,12],[-12,4,12]].forEach(([x,y,z])=>{
  const pl=new THREE.SpotLight(0x88ff44,2,30,Math.PI/5);
  pl.position.set(x,y,z); pl.target.position.set(0,0,0);
  scene.add(pl); scene.add(pl.target);
});

// ─── COMPOUND ARENA ──────────────────────────────────────────────────────────
const obstacles=[];
function buildCompound(){
  const matFloor=new THREE.MeshLambertMaterial({color:0x1a2210});
  const matWall=new THREE.MeshLambertMaterial({color:0x2a3318});
  const matBarrel=new THREE.MeshLambertMaterial({color:0x4a3820});
  const matFence=new THREE.MeshLambertMaterial({color:0x3a3a3a});

  const floor=new THREE.Mesh(new THREE.PlaneGeometry(40,40),matFloor);
  floor.rotation.x=-Math.PI/2; floor.receiveShadow=true; scene.add(floor);

  // Outer walls
  [{s:[40,4,0.4],p:[0,2,-20]},{s:[40,4,0.4],p:[0,2,20]},
   {s:[0.4,4,40],p:[-20,2,0]},{s:[0.4,4,40],p:[20,2,0]}].forEach(({s,p})=>{
    const m=new THREE.Mesh(new THREE.BoxGeometry(...s),matWall);
    m.position.set(...p); scene.add(m);
  });

  // Barricades / cover
  const covers=[[-4,0,-4],[4,0,-4],[4,0,4],[-4,0,4],[0,0,-8],[0,0,8],[-8,0,0],[8,0,0]];
  covers.forEach(([x,,z])=>{
    const h=1.2; const w=1.5+Math.random();
    const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,w*0.6),matBarrel);
    m.position.set(x,h/2,z); m.castShadow=true; m.receiveShadow=true;
    scene.add(m);
    obstacles.push({pos:new THREE.Vector3(x,0,z),r:0.8});
  });

  // Fence posts
  for(let i=0;i<16;i++){
    const a=i/16*Math.PI*2;
    const r=18;
    const m=new THREE.Mesh(new THREE.BoxGeometry(0.2,2.5,0.2),matFence);
    m.position.set(Math.cos(a)*r,1.25,Math.sin(a)*r); scene.add(m);
  }

  // Ground detail patches
  for(let i=0;i<20;i++){
    const d=new THREE.Mesh(new THREE.PlaneGeometry(1+Math.random()*2,1+Math.random()*2),
      new THREE.MeshLambertMaterial({color:0x111a08}));
    d.rotation.x=-Math.PI/2; d.position.set((Math.random()-0.5)*36,0.01,(Math.random()-0.5)*36);
    scene.add(d);
  }
}

// ─── PLAYER ───────────────────────────────────────────────────────────────────
const player={
  pos:new THREE.Vector3(0,1.7,0),
  hp:100, maxHp:100,
  ammo:30, maxAmmo:30,
  reserve:120,
  bulletDmg:1, reloadTime:2.5,
  reloadTimer:0, isReloading:false,
  score:0, kills:0, wave:1,
  dead:false,
};

let yaw=0,pitch=0,locked=false;
document.addEventListener('pointerlockchange',()=>locked=document.pointerLockElement===canvas);
document.addEventListener('mousemove',e=>{
  if(!locked) return;
  yaw-=e.movementX*0.002;
  pitch=Math.max(-Math.PI/3,Math.min(Math.PI/3,pitch-e.movementY*0.002));
});

const keys={};
window.addEventListener('keydown',e=>{
  keys[e.code]=true;
  if(e.code==='KeyR'&&!player.isReloading&&player.ammo<player.maxAmmo&&player.reserve>0) startReload();
});
window.addEventListener('keyup',e=>keys[e.code]=false);

let shooting=false, shootCD=0;
window.addEventListener('mousedown',e=>{if(e.button===0) shooting=true;});
window.addEventListener('mouseup',  e=>{if(e.button===0) shooting=false;});

function startReload(){
  player.isReloading=true; player.reloadTimer=player.reloadTime;
  document.getElementById('reload-msg').style.display='block';
}
function finishReload(){
  const need=player.maxAmmo-player.ammo;
  const take=Math.min(need,player.reserve);
  player.ammo+=take; player.reserve-=take;
  player.isReloading=false;
  document.getElementById('reload-msg').style.display='none';
}

// ─── BULLETS + ZOMBIES ────────────────────────────────────────────────────────
const bullets=[], zombies=[], bloodParticles=[];
const bulletMat=new THREE.MeshBasicMaterial({color:0xffd700});

function fireBullet(){
  const d=new THREE.Vector3(); camera.getWorldDirection(d);
  const m=new THREE.Mesh(new THREE.SphereGeometry(0.07,4,4),bulletMat);
  m.position.copy(camera.position).addScaledVector(d,0.3);
  scene.add(m);
  bullets.push({mesh:m,dir:d,life:1.5,dmg:player.bulletDmg});
}

const ZOMBIE_TYPES={
  walker: {hp:4, speed:1.6,reward:10,dmg:8, col:0x3a6622,scale:1},
  runner: {hp:2, speed:4.0,reward:15,dmg:6, col:0x226644,scale:0.9},
  brute:  {hp:12,speed:1.0,reward:30,dmg:20,col:0x4a3322,scale:1.5},
  special:{hp:6, speed:2.5,reward:25,dmg:12,col:0x662244,scale:1.1},
};

function spawnZombie(type){
  const def=ZOMBIE_TYPES[type];
  const side=Math.floor(Math.random()*4); const r=19;
  let x=0,z=0;
  if(side===0){x=(Math.random()*2-1)*r;z=-r;}
  else if(side===1){x=(Math.random()*2-1)*r;z=r;}
  else if(side===2){x=-r;z=(Math.random()*2-1)*r;}
  else{x=r;z=(Math.random()*2-1)*r;}
  x=Math.max(-19,Math.min(19,x)); z=Math.max(-19,Math.min(19,z));

  const grp=new THREE.Group();
  const mat=new THREE.MeshLambertMaterial({color:def.col});
  const body=new THREE.Mesh(new THREE.BoxGeometry(0.7*def.scale,1.5*def.scale,0.6*def.scale),mat);
  body.position.y=0.75*def.scale; grp.add(body);
  const head=new THREE.Mesh(new THREE.BoxGeometry(0.55*def.scale,0.55*def.scale,0.55*def.scale),mat);
  head.position.y=1.65*def.scale; grp.add(head);
  grp.position.set(x,0,z);
  scene.add(grp);
  zombies.push({type,grp,hp:def.hp,maxHp:def.hp,speed:def.speed,dmg:def.dmg,
    reward:def.reward,attackTimer:0,dead:false,scale:def.scale});
}

function spawnBlood(pos){
  for(let i=0;i<6;i++){
    const m=new THREE.Mesh(new THREE.SphereGeometry(0.08,4,4),
      new THREE.MeshBasicMaterial({color:0x881100}));
    m.position.copy(pos);
    const d=new THREE.Vector3((Math.random()-0.5),(Math.random()*2),(Math.random()-0.5)).normalize().multiplyScalar(3+Math.random()*2);
    scene.add(m);
    bloodParticles.push({mesh:m,vel:d,life:0.6});
  }
}

// ─── WAVE SYSTEM ──────────────────────────────────────────────────────────────
let waveActive=false, waveLeft=0, waveCooldown=3, waveBannerTimer=0;

function startWave(w){
  waveActive=true;
  const n=5+w*3;
  const types=['walker','runner'];
  if(w>=3) types.push('brute');
  if(w>=5) types.push('special');
  for(let i=0;i<n;i++){
    setTimeout(()=>spawnZombie(types[Math.floor(Math.random()*types.length)]),i*300);
  }
  waveLeft=n;
  // Banner
  const el=document.getElementById('wave-banner');
  el.textContent=`WAVE ${w}`; el.style.opacity='1'; waveBannerTimer=2;
}

// ─── STATE ────────────────────────────────────────────────────────────────────
let gameState='menu';

function startGame(){
  zombies.forEach(z=>scene.remove(z.grp)); zombies.length=0;
  bullets.forEach(b=>scene.remove(b.mesh)); bullets.length=0;
  bloodParticles.forEach(p=>scene.remove(p.mesh)); bloodParticles.length=0;
  applyUpgrades();
  player.hp=player.maxHp; player.ammo=player.maxAmmo; player.reserve=120;
  player.score=0; player.kills=0; player.wave=1; player.dead=false;
  player.isReloading=false;
  player.pos.set(0,1.7,0);
  waveActive=false; waveCooldown=3;
  yaw=0; pitch=0;
  document.getElementById('overlay').style.display='none';
  document.getElementById('hud').style.display='block';
  gameState='playing';
  canvas.requestPointerLock();
  updateHUD();
}

function triggerGameOver(){
  player.dead=true; gameState='gameover';
  document.exitPointerLock();
  const coins=Math.floor(player.score/10);
  meta.coins+=coins; saveMeta();
  document.getElementById('hud').style.display='none';
  const ov=document.getElementById('overlay');
  ov.innerHTML=`<h1>DEAD COMPOUND</h1><div class="sub">OVERRUN</div>
    <div id="gameover-score">${player.score.toLocaleString()}</div>
    <div style="font-size:13px;color:#555;margin-bottom:22px;">WAVE ${player.wave} | ${player.kills} KILLS — +${coins} 🪙</div>
    <button class="menu-btn" id="btn-shop">SUPPLY DROP</button>
    <button class="menu-btn" id="btn-retry">SURVIVE AGAIN</button>`;
  ov.style.display='flex';
  document.getElementById('btn-shop').onclick=()=>{ov.style.display='none';openShop();};
  document.getElementById('btn-retry').onclick=startGame;
}

function openShop(){ gameState='shop'; renderShop(); document.getElementById('shop-overlay').style.display='flex'; }
function closeShop(){ document.getElementById('shop-overlay').style.display='none'; startGame(); }
function renderShop(){
  document.getElementById('shop-coins-disp').textContent=`🪙 ${meta.coins}`;
  const grid=document.getElementById('shop-grid'); grid.innerHTML='';
  UPGRADES.forEach(u=>{
    const lv=meta.upgrades[u.id]||0,cost=u.cost*(lv+1),maxed=lv>=u.maxLv;
    const card=document.createElement('div'); card.className='shop-card';
    card.innerHTML=`<h3>${u.name}<span class="lvl">LV${lv}/${u.maxLv}</span></h3><p>${u.desc}</p><span class="cost">${maxed?'MAXED':'🪙 '+cost}</span>`;
    if(!maxed&&meta.coins>=cost) card.onclick=()=>{buyUpgrade(u.id);renderShop();};
    else card.style.opacity=maxed?'0.4':'0.6';
    grid.appendChild(card);
  });
  document.getElementById('shop-skip').onclick=closeShop;
}

function flashHit(){
  const el=document.getElementById('hit-flash');
  el.style.background='rgba(192,57,43,0.45)';
  setTimeout(()=>el.style.background='rgba(192,57,43,0)',100);
}
function updateHUD(){
  document.getElementById('score-disp').textContent=player.score.toLocaleString();
  document.getElementById('wave-disp').textContent=`WAVE ${player.wave}`;
  document.getElementById('kill-count').textContent=`KILLS: ${player.kills}`;
  document.getElementById('coins-disp').textContent=`🪙 ${meta.coins}`;
  document.getElementById('hp-fill').style.width=(player.hp/player.maxHp*100)+'%';
  document.getElementById('ammo-count').textContent=`${player.ammo} / ${player.reserve}`;
  document.getElementById('ammo-warn').style.display=player.ammo<=6?'block':'none';
}

function circleBlocked(x,z,r){
  if(Math.abs(x)>19.5||Math.abs(z)>19.5) return true;
  for(const o of obstacles) if(Math.hypot(x-o.pos.x,z-o.pos.z)<r+o.r) return true;
  return false;
}

// ─── UPDATE ───────────────────────────────────────────────────────────────────
function update(dt){
  if(gameState!=='playing') return;

  camera.rotation.order='YXZ';
  camera.rotation.y=yaw; camera.rotation.x=pitch;

  const speed=5;
  const move=new THREE.Vector3();
  if(keys['KeyW']||keys['ArrowUp'])   move.z-=1;
  if(keys['KeyS']||keys['ArrowDown']) move.z+=1;
  if(keys['KeyA']||keys['ArrowLeft']) move.x-=1;
  if(keys['KeyD']||keys['ArrowRight'])move.x+=1;
  if(move.lengthSq()>0){
    move.normalize(); move.applyAxisAngle(new THREE.Vector3(0,1,0),yaw);
    const nx=player.pos.x+move.x*speed*dt, nz=player.pos.z+move.z*speed*dt;
    if(!circleBlocked(nx,player.pos.z,0.4)) player.pos.x=nx;
    if(!circleBlocked(player.pos.x,nz,0.4)) player.pos.z=nz;
  }
  player.pos.y=1.7;
  camera.position.copy(player.pos);

  // Reload
  if(player.isReloading){ player.reloadTimer-=dt; if(player.reloadTimer<=0) finishReload(); }

  // Shoot
  shootCD=Math.max(0,shootCD-dt);
  if(shooting&&!player.isReloading&&shootCD<=0&&player.ammo>0){
    fireBullet(); player.ammo--; shootCD=0.1;
    if(player.ammo===0&&player.reserve>0) startReload();
  }

  // Bullets
  for(let i=bullets.length-1;i>=0;i--){
    const b=bullets[i]; b.mesh.position.addScaledVector(b.dir,30*dt); b.life-=dt;
    if(b.life<=0){ scene.remove(b.mesh); bullets.splice(i,1); continue; }
    let hit=false;
    for(let j=zombies.length-1;j>=0;j--){
      const z=zombies[j]; if(z.dead) continue;
      if(b.mesh.position.distanceTo(z.grp.position)<0.9*z.scale){
        z.hp-=b.dmg; hit=true;
        if(z.hp<=0){
          z.dead=true; spawnBlood(z.grp.position.clone());
          scene.remove(z.grp); zombies.splice(j,1);
          player.score+=z.reward; player.kills++; meta.coins+=1; saveMeta();
          waveLeft=Math.max(0,waveLeft-1);
        }
        break;
      }
    }
    if(hit){ scene.remove(b.mesh); bullets.splice(i,1); }
  }

  // Zombies
  zombies.forEach(z=>{
    if(z.dead) return;
    const toP=new THREE.Vector3().subVectors(player.pos,z.grp.position); toP.y=0;
    const dist=toP.length();
    if(dist>0){
      toP.normalize();
      const nx=z.grp.position.x+toP.x*z.speed*dt;
      const nz2=z.grp.position.z+toP.z*z.speed*dt;
      z.grp.position.x=nx; z.grp.position.z=nz2;
      z.grp.position.y=0;
      z.grp.lookAt(player.pos.x,z.grp.position.y,player.pos.z);
    }
    z.attackTimer-=dt;
    if(dist<1.3&&z.attackTimer<=0){
      z.attackTimer=1.2;
      player.hp-=z.dmg; flashHit();
      if(player.hp<=0){ player.hp=0; triggerGameOver(); return; }
    }
  });

  // Blood particles
  for(let i=bloodParticles.length-1;i>=0;i--){
    const p=bloodParticles[i];
    p.vel.y-=15*dt;
    p.mesh.position.addScaledVector(p.vel,dt); p.life-=dt;
    if(p.life<=0){ scene.remove(p.mesh); bloodParticles.splice(i,1); }
  }

  // Wave
  if(!waveActive){ waveCooldown-=dt; if(waveCooldown<=0) startWave(player.wave); }
  else if(waveLeft===0&&zombies.length===0){
    waveActive=false; player.wave++; waveCooldown=5;
    player.hp=Math.min(player.maxHp,player.hp+20);
    player.reserve=Math.min(240,player.reserve+30);
  }

  // Banner timer
  if(waveBannerTimer>0){ waveBannerTimer-=dt;
    if(waveBannerTimer<=0) document.getElementById('wave-banner').style.opacity='0'; }

  updateHUD();
}

buildCompound();

function animate(){
  requestAnimationFrame(animate);
  const dt=Math.min(clock.getDelta(),0.05);
  update(dt);
  renderer.render(scene,camera);
}
camera.position.set(0,1.7,0);
animate();
document.getElementById('btn-play').onclick=startGame;
</script>
</body>
</html>
