const Particles=createPool(()=>({alive:false,x:0,y:0,vx:0,vy:0,life:0,maxLife:0,size:3,color:'#fff',gravity:0}),200);
function spawnParticles(x,y,count,opts){opts=opts||{};for(let i=0;i<count;i++){const a=opts.angle!==undefined?opts.angle+(Math.random()-0.5)*(opts.spread||Math.PI*2):Math.random()*Math.PI*2;const sp=opts.speed||(50+Math.random()*70);Particles.get(p=>{p.x=x;p.y=y;p.vx=Math.cos(a)*sp;p.vy=Math.sin(a)*sp;p.life=p.maxLife=opts.life||(0.25+Math.random()*0.35);p.size=opts.size||(2+Math.random()*3);p.color=opts.color||'#fff';p.gravity=opts.gravity!==undefined?opts.gravity:0;});}}

function lerp(a,b,t){return a+(b-a)*t;}
function clamp(v,mn,mx){return v<mn?mn:v>mx?mx:v;}
function dist2(ax,ay,bx,by){return(ax-bx)**2+(ay-by)**2;}
function aabb(ax,ay,aw,ah,bx,by,bw,bh){return ax<bx+bw&&ax+aw>bx&&ay<by+bh&&ay+ah>by;}
function randInt(a,b){return a+Math.floor(Math.random()*(b-a+1));}

const FIXED_DT=1/60,MAX_DT=0.1;let lastTime=0,accumulator=0;

function buildRooms() {
  rooms.length = 0;
  // Room dimensions in tiles
  // Example 3-room dungeon:
  // Room 0 (start), Room 1 (combat), Room 2 (boss)

  const ROOM_W=18*TILE, ROOM_H=14*TILE;
  const border=TILE;

  function makeRoom(worldX, worldY, w, h, enemyList, lootList, doors) {
    const walls=[];
    // Perimeter walls
    walls.push({x:worldX,y:worldY,w:w,h:border});                          // top
    walls.push({x:worldX,y:worldY+h-border,w:w,h:border});                 // bottom
    walls.push({x:worldX,y:worldY,w:border,h:h});                          // left
    walls.push({x:worldX+w-border,y:worldY,w:border,h:h});                 // right
    // [FILL: add interior walls, pillars, obstacles]

    return {worldX,worldY,w,h,walls,enemyList,lootList,doors,cleared:false};
  }

  // [FILL: Define room layout — connect rooms via doors]

  ));

// TILE COLLISION — DO NOT MODIFY (AABB sweep)
// ══════════════════════════════════════════════════════════════════
function resolveWalls(ent, roomWalls, dt) {
  // X axis
  ent.x += ent.vx * dt;
  for (const wall of roomWalls) {
    if (aabb(ent.x,ent.y,ent.w,ent.h, wall.x,wall.y,wall.w,wall.h)) {
      if (ent.vx>0) ent.x=wall.x-ent.w;
      else          ent.x=wall.x+wall.w;
      ent.vx=0;
    }
  }
  // Y axis
  ent.y += ent.vy * dt;
  for (const wall of roomWalls) {
    if (aabb(ent.x,ent.y,ent.w,ent.h, wall.x,wall.y,wall.w,wall.h)) {
      if (ent.vy>0) ent.y=wall.y-ent.h;
      else          ent.y=wall.y+wall.h;
      ent.vy=0;
    }
  }
}

function updateShop(dt){if(!anyAction())return;const mx=Mouse.clicked?Mouse.x:(Touch.justTapped?Touch.x:-1),my=Mouse.clicked?Mouse.y:(Touch.justTapped?Touch.y:-1);if(mx<0)return;const n=UPGRADES.length,cardW=Math.round(W*0.19),cardH=Math.round(H*0.32),gap=Math.round(W*0.02);const sy=Math.round(H*0.22),totalW=n*cardW+(n-1)*gap,sx=(W-totalW)/2;for(let i=0;i<n;i++){if(_shopHit(mx,my,sx+i*(cardW+gap),sy,cardW,cardH)){_shopIdx=i;if(buyUpgrade(UPGRADES[i].id)){sfx.play(660,0.12,'sine',0.1);applyUpgrades();}else sfx.play(110,0.06,'sawtooth',0.08);return;}}const btnW=160,btnH=42,btnX=(W-btnW)/2,btnY=sy+cardH+32;if(_shopHit(mx,my,btnX,btnY,btnW,btnH)){sfx.play(440,0.08,'square',0.1);startGame();setState('playing');}}

// GAME INIT
// ══════════════════════════════════════════════════════════════════
loadMeta();
function startGame() {
  loadMeta(); _runCoins=0; _gameoverTimer=1.5;
  buildRooms(); currentRoomIdx=0;
  GAME_SCORE=0;
  player.hp=player.maxHp; player.iframes=0; player.gold=0; player.xp=0; player.level=1;
  player.attackTimer=0; player.attackCooldown=0;
  player.attack.active=false;
  applyUpgrades();
  loadRoom(0);
}

function loadRoom(idx) {
  currentRoomIdx=idx;
  const room=rooms[idx];
  // Place player near room center (or door entry)
  player.x=room.worldX+room.w/2-player.w/2;
  player.y=room.worldY+room.h/2-player.h/2;
  player.vx=0; player.vy=0;

  enemyPool.clear(); lootPool.clear();

  if (!room.cleared) {
    room.enemyList.forEach(eDef=>{
      const def=ENEMY_DEFS[eDef.type]||ENEMY_DEFS.slime;
      enemyPool.get(e=>{
        Object.assign(e,{...def});
        e.x=eDef.x; e.y=eDef.y; e.hp=e.maxHp=def.hp; e.type=eDef.type;
        e.state='idle'; e.alertTimer=0; e.attackTimer=0; e.flashTimer=0; e.iframes=0;
        e.knockX=0; e.knockY=0; e.knockTimer=0;
      });
    });
    room.lootList.forEach(l=>{
      lootPool.get(lo=>{lo.x=l.x;lo.y=l.y;lo.type=l.type;lo.value=l.value||10;lo.bobTimer=Math.random()*Math.PI*2;});
    });
  }

  // Camera jump to room
  cam.x=room.worldX+room.w/2-W/2;
  cam.y=room.worldY+room.h/2-H/2;
}

// ══════════════════════════════════════════════════════════════════
// ENEMY AI (state machine) — DO NOT MODIFY core states
// ══════════════════════════════════════════════════════════════════
function updateEnemy(e, dt, room) {
  e.flashTimer=Math.max(0,e.flashTimer-dt);
  e.iframes=Math.max(0,e.iframes-dt);

  // Knockback decay
  if (e.knockTimer>0) {
    e.knockTimer-=dt;
    e.vx=lerp(e.vx,0,dt*8); e.vy=lerp(e.vy,0,dt*8);
    resolveWalls(e,room.walls,dt);
    return;
  }

  const dx=player.x+player.w/2-(e.x+e.w/2);
  const dy=player.y+player.h/2-(e.y+e.h/2);
  const d=Math.sqrt(dx*dx+dy*dy);
  const def=ENEMY_DEFS[e.type]||ENEMY_DEFS.slime;

  switch(e.state) {
    case 'idle':
      e.vx*=0.85; e.vy*=0.85;
      if (d<def.alertRange) {
        e.state='chase';
        spawnPopup(e.x+e.w/2,e.y-10,'!','#ff0',16);
        sfx.play(330,0.06,'sawtooth',0.06);
      }
      break;
    case 'chase':
      if (d>0) { e.vx=dx/d*def.speed; e.vy=dy/d*def.speed; }
      if (d<def.attackRange) { e.state='attack'; e.attackTimer=0; }
      break;
    case 'attack':
      e.vx*=0.6; e.vy*=0.6;
      e.attackTimer+=dt;
      if (e.attackTimer>=def.attackCooldown) {
        e.attackTimer=0;
        // Deal damage
        if(d<def.attackRange+10&&player.iframes<=0) {
          player.hp-=def.damage; player.iframes=player.IFRAME_DUR;
          const kx=dx>0?-1:1,ky=dy>0?-1:1;
          player.vx+=kx*180; player.vy+=ky*180;
          triggerShake(4,0.22);
          sfx.play(150,0.18,'sawtooth',0.14);
          spawnParticles(player.x+player.w/2,player.y+player.h/2,6,{color:'#f44',speed:60});
          if(player.hp<=0){saveHiScore(GAME_SCORE);_runCoins=player.gold;_gameoverTimer=1.5;setState('gameover');}
        }
      }
      if (d>def.attackRange+20) e.state='chase';
      break;
  }
  resolveWalls(e,room.walls,dt);
}

// UPDATE
// ══════════════════════════════════════════════════════════════════
function updatePlaying(dt) {
  const room=rooms[currentRoomIdx];

  // ── Player input ─────────────────────────────────────────────
  let dx = (keyDown('ArrowRight')||keyDown('KeyD') ? 1:0) - (keyDown('ArrowLeft')||keyDown('KeyA') ? 1:0);
  let dy = (keyDown('ArrowDown') ||keyDown('KeyS') ? 1:0) - (keyDown('ArrowUp')  ||keyDown('KeyW') ? 1:0);
  if(Touch.active){dx=Touch.stickX;dy=Touch.stickY;}
  const mag=Math.hypot(dx,dy)||0;
  if (mag>0) {
    const nx=dx/mag,ny=dy/mag;
    player.vx=nx*PLAYER_SPEED; player.vy=ny*PLAYER_SPEED;
    player.facingX=nx; player.facingY=ny;
  } else {
    player.vx*=0.7; player.vy*=0.7;
    if(Math.abs(player.vx)<2) player.vx=0;
    if(Math.abs(player.vy)<2) player.vy=0;
  }

  // ── Player iframes & knockback dampen ────────────────────────
  player.iframes=Math.max(0,player.iframes-dt);
  if(player.iframes>0){player.vx*=0.85;player.vy*=0.85;}

  // ── Movement ─────────────────────────────────────────────────
  resolveWalls(player,room.walls,dt);
  player.animTimer+=dt;

  // ── Attack ───────────────────────────────────────────────────
  player.attackCooldown=Math.max(0,player.attackCooldown-dt);
  player.attackTimer=Math.max(0,player.attackTimer-dt);
  player.attack.active=player.attackTimer>0;

  const wantAttack=keyPressed('Space')||keyPressed('KeyZ')||keyPressed('KeyJ')||attackInput;
  if(wantAttack&&player.attackCooldown<=0){
    player.attackTimer=ATTACK_DUR; player.attackCooldown=ATTACK_COOLDOWN;
    // Hitbox in facing direction
    const fx=player.facingX||1,fy=player.facingY||0;
    const hw=ATTACK_RANGE,hh=TILE;
    player.attack.x=player.x+player.w/2+fx*ATTACK_RANGE/2-hw/2;
    player.attack.y=player.y+player.h/2+fy*ATTACK_RANGE/2-hh/2;
    player.attack.w=hw; player.attack.h=hh;
    player.attack.damage=ATTACK_DAMAGE+(player.level-1)*5;
    sfx.play(330,0.06,'sawtooth',0.08);
  }

  // Attack hits enemies
  if(player.attack.active){
    enemyPool.active.forEach(e=>{
      if(!e.alive||e.iframes>0) return;
      if(aabb(player.attack.x,player.attack.y,player.attack.w,player.attack.h,e.x,e.y,e.w,e.h)){
        e.hp-=player.attack.damage; e.flashTimer=0.10; e.iframes=0.25;
        const ang=Math.atan2(e.y-player.y,e.x-player.x);
        e.knockX=Math.cos(ang)*180; e.knockY=Math.sin(ang)*180;
        e.vx=e.knockX; e.vy=e.knockY; e.knockTimer=0.18;
        spawnParticles(e.x+e.w/2,e.y+e.h/2,6,{color:e.color,speed:55,life:0.25});
        spawnPopup(e.x+e.w/2,e.y-8,`-${player.attack.damage}`,'#fff',12);
        sfx.play(220,0.07,'sawtooth',0.09);
        if(e.hp<=0){
          GAME_SCORE+=e.points; player.xp+=e.points/2;
          spawnParticles(e.x+e.w/2,e.y+e.h/2,12,{color:e.color,speed:80,life:0.4,gravity:100});
          // Loot drop
          if(Math.random()<0.3) lootPool.get(l=>{l.x=e.x;l.y=e.y;l.type='gold';l.value=randInt(5,20);l.bobTimer=0;});
          if(Math.random()<0.08) lootPool.get(l=>{l.x=e.x;l.y=e.y;l.type='potion';l.value=25;l.bobTimer=0;});
          e.alive=false;
          sfx.play(440,0.10,'square',0.10);
          // Check if all enemies cleared
          if(enemyPool.active.length===0&&!room.cleared){
            room.cleared=true;
            sfx.play(660,0.15,'sine',0.10);
            spawnPopup(player.x+player.w/2,player.y-30,'ROOM CLEAR!','#ff0',15);
          }
        }
      }
    });
  }

  // ── Enemies ───────────────────────────────────────────────────
  enemyPool.update(e=>{
    updateEnemy(e,dt,room);
    return e.alive;
  });

  // ── Loot collection ───────────────────────────────────────────
  lootPool.update(l=>{
    l.bobTimer+=dt;
    if(aabb(player.x,player.y,player.w,player.h,l.x,l.y,l.w,l.h)){
      if(l.type==='gold'){player.gold+=l.value;GAME_SCORE+=l.value*5;spawnPopup(l.x,l.y,`+${l.value}g`,'#ff0',12);}
      if(l.type==='potion'){player.hp=Math.min(player.maxHp,player.hp+l.value);spawnPopup(l.x,l.y,`+${l.value}HP`,'#0f0',12);}
      sfx.play(880,0.07,'sine',0.09);
      return false;
    }
    return true;
  });

  // ── XP & leveling ─────────────────────────────────────────────
  const xpNeeded=100*player.level;
  if(player.xp>=xpNeeded){player.xp-=xpNeeded;player.level++;player.maxHp+=20;player.hp=Math.min(player.hp+30,player.maxHp);spawnPopup(player.x+player.w/2,player.y-40,'LEVEL UP!','#ff0',16);sfx.play(880,0.20,'sine',0.12);}

  // ── Door transitions ──────────────────────────────────────────
  if(room.cleared) {
    const checkDoor=(dir,condition,nextRoom)=>{
      if(nextRoom===null||nextRoom===undefined) return;
      if(!condition) return;
      loadRoom(typeof nextRoom==='number'?nextRoom:0);
      sfx.play(440,0.10,'square',0.09);
    };
    const m=TILE*0.5;
    checkDoor('E',player.x+player.w>room.worldX+room.w-TILE+m&&room.doors.E!==null, room.doors.E);
    checkDoor('W',player.x<room.worldX+TILE-m&&room.doors.W!==null, room.doors.W);
    checkDoor('S',player.y+player.h>room.worldY+room.h-TILE+m&&room.doors.S!==null, room.doors.S);
    checkDoor('N',player.y<room.worldY+TILE-m&&room.doors.N!==null, room.doors.N);
  }

  // ── Victory check (boss room cleared) ────────────────────────
  const lastRoom=rooms[rooms.length-1];
  if(lastRoom.cleared&&currentRoomIdx===rooms.length-1){saveHiScore(GAME_SCORE);setState('victory');}

  // ── Camera smooth follow ──────────────────────────────────────
  const targetX=player.x+player.w/2-W/2, targetY=player.y+player.h/2-H/2;
  const minX=room.worldX, maxX=room.worldX+room.w-W;
  const minY=room.worldY, maxY=room.worldY+room.h-H;
  cam.x=lerp(cam.x,clamp(targetX,minX,Math.max(minX,maxX)),cam.SMOOTH*dt);
  cam.y=lerp(cam.y,clamp(targetY,minY,Math.max(minY,maxY)),cam.SMOOTH*dt);
}

function renderPlaying() {
  ctx.fillStyle=PALETTE.bg; ctx.fillRect(0,0,W,H);
  ctx.save(); ctx.translate(-Math.round(cam.x),-Math.round(cam.y));

  const room=rooms[currentRoomIdx];

  // ── Floor ─────────────────────────────────────────────────────
  ctx.fillStyle=PALETTE.floor;
  ctx.fillRect(room.worldX+TILE,room.worldY+TILE,room.w-TILE*2,room.h-TILE*2);
  // [FILL: floor tiles pattern, torches, decor]

  // ── Walls ─────────────────────────────────────────────────────
  room.walls.forEach(wall=>{
    ctx.fillStyle=PALETTE.wall; ctx.fillRect(wall.x,wall.y,wall.w,wall.h);
    ctx.fillStyle=PALETTE.wallEdge; ctx.fillRect(wall.x,wall.y,wall.w,4);
  });

  // ── Doors (when room cleared) ────────────────────────────────
  if(room.cleared){
    const drawDoor=(dx,dy,dw,dh)=>{ctx.fillStyle=PALETTE.doorOpen;ctx.fillRect(dx,dy,dw,dh);};
    if(room.doors.E!==null)drawDoor(room.worldX+room.w-TILE,room.worldY+room.h/2-TILE*0.75,TILE,TILE*1.5);
    if(room.doors.W!==null)drawDoor(room.worldX,room.worldY+room.h/2-TILE*0.75,TILE,TILE*1.5);
    if(room.doors.S!==null)drawDoor(room.worldX+room.w/2-TILE*0.75,room.worldY+room.h-TILE,TILE*1.5,TILE);
    if(room.doors.N!==null)drawDoor(room.worldX+room.w/2-TILE*0.75,room.worldY,TILE*1.5,TILE);
  }

  // ── Loot ──────────────────────────────────────────────────────
  lootPool.active.forEach(l=>{
    const bob=Math.sin(l.bobTimer*3)*3;
    ctx.fillStyle=l.type==='gold'?PALETTE.loot:'#f88';
    ctx.shadowBlur=6;ctx.shadowColor=ctx.fillStyle;
    ctx.beginPath();ctx.arc(l.x+l.w/2,l.y+l.h/2+bob,l.w/2,0,Math.PI*2);ctx.fill();
    ctx.shadowBlur=0;
    drawText(l.type==='gold'?'g':'♥',l.x+l.w/2,l.y+l.h/2+bob+4,'#000',9,'center');
  });

  // ── Enemies ───────────────────────────────────────────────────
  enemyPool.active.forEach(e=>{
    ctx.globalAlpha=e.flashTimer>0?0.35:1.0;
    // [FILL: draw enemy sprite per type — replace fillRect with shapes]
    ctx.fillStyle=e.flashTimer>0?'#fff':e.color;
    ctx.shadowBlur=e.type==='boss'?14:0;ctx.shadowColor=e.color;
    ctx.beginPath();ctx.arc(e.x+e.w/2,e.y+e.h/2,e.w/2,0,Math.PI*2);ctx.fill();
    ctx.shadowBlur=0;ctx.globalAlpha=1;
    drawBar(e.x,e.y-8,e.w,5,e.hp,e.maxHp,'#0f0','#300');
    if(e.state==='idle'){ctx.globalAlpha=0.5;ctx.fillStyle='#888';ctx.font='8px monospace';ctx.textAlign='center';ctx.fillText('zzz',e.x+e.w/2,e.y-10);ctx.textAlign='left';ctx.globalAlpha=1;}
  });

  // ── Attack hitbox (debug visual) ─────────────────────────────
  if(player.attack.active){
    ctx.strokeStyle='rgba(0,200,255,0.6)';ctx.lineWidth=2;
    ctx.strokeRect(player.attack.x,player.attack.y,player.attack.w,player.attack.h);
    // [FILL: draw sword swing arc instead]
  }

  // ── Player ────────────────────────────────────────────────────
  const blink=player.iframes>0&&Math.floor(player.iframes/0.07)%2===0;
  if(!blink){
    ctx.globalAlpha=player.iframes>0?0.55:1.0;
    ctx.fillStyle=PALETTE.player;
    ctx.shadowBlur=8;ctx.shadowColor=PALETTE.player;
    ctx.beginPath();ctx.arc(player.x+player.w/2,player.y+player.h/2,player.w/2,0,Math.PI*2);ctx.fill();
    ctx.shadowBlur=0;
    // Facing direction indicator
    ctx.fillStyle='rgba(0,0,0,0.6)';
    ctx.beginPath();ctx.arc(player.x+player.w/2+player.facingX*8,player.y+player.h/2+player.facingY*8,4,0,Math.PI*2);ctx.fill();
    ctx.globalAlpha=1;
  }

  ctx.restore();

  // ── HUD (screen-space) ────────────────────────────────────────
  drawText(`SCORE: ${GAME_SCORE}`,10,22,PALETTE.ui,13);
  drawText(`LV ${player.level}`,W/2,22,'#aaa',12,'center');
  drawText(`BEST: ${_hiScore}`,W-10,22,'#888',11,'right');
  // HP bar
  drawBar(10,H-32,150,10,player.hp,player.maxHp,'#f44','#300');
  drawText(`HP`,164,H-23,'#666',10);
  // XP bar
  drawBar(10,H-18,150,6,player.xp,100*player.level,PALETTE.xp,'#133');
  drawText(`XP`,164,H-13,PALETTE.xp,9);
  // Gold
  drawText(`⚜ ${player.gold}g`,W-10,H-22,PALETTE.loot,13,'right');
  // Attack cooldown bar
  if(player.attackCooldown>0){drawBar(10,H-44,80,4,ATTACK_COOLDOWN-player.attackCooldown,ATTACK_COOLDOWN,'#0cf','#133');}
  // Room indicator
  const roomLabel=currentRoomIdx===rooms.length-1?'BOSS ROOM':`Room ${currentRoomIdx+1}/${rooms.length}`;
  drawText(roomLabel,W/2,H-10,'#888',10,'center');
}

// ══════════════════════════════════════════════════════════════════
// START
// ══════════════════════════════════════════════════════════════════
startGame();
requestAnimationFrame(t=>{lastTime=t;requestAnimationFrame(loop);});
</script>
