<!DOCTYPE html>
<html><head><title>GALAXY BLASTER</title><style>
*{margin:0;padding:0;box-sizing:border-box;}
body{background:#000;display:flex;align-items:center;justify-content:center;height:100vh;overflow:hidden;}
canvas{display:block;}
</style></head><body>
<canvas id="gameCanvas"></canvas>
<script>
// ENGINE
window.__devPatch = function(code) { return eval(code); };
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
const DPR = Math.min(window.devicePixelRatio || 1, 2);
let W = 480, H = 640;
function resizeCanvas() {
  const vw = window.innerWidth, vh = window.innerHeight;
  const scale = Math.min(vw / W, vh / H);
  canvas.style.width  = Math.round(W * scale) + 'px';
  canvas.style.height = Math.round(H * scale) + 'px';
  canvas.width  = Math.round(W * DPR);
  canvas.height = Math.round(H * DPR);
  ctx.scale(DPR, DPR);
}
resizeCanvas();
window.addEventListener('resize', () => { resizeCanvas(); ctx.scale(DPR, DPR); });

let gameState = 'menu';
function setState(s) { gameState = s; }

const Keys = { down: {}, pressed: {}, released: {} };
window.addEventListener('keydown', e => {
  if (!Keys.down[e.code]) Keys.pressed[e.code] = true;
  Keys.down[e.code] = true;
  if (['Space','ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.code)) e.preventDefault();
});
window.addEventListener('keyup', e => { Keys.down[e.code] = false; Keys.released[e.code] = true; });
const Touch = { justTapped: false, x: 0, y: 0 };
canvas.addEventListener('touchstart', e => {
  e.preventDefault();
  const r = canvas.getBoundingClientRect();
  Touch.x = (e.touches[0].clientX - r.left) * (W / r.width);
  Touch.y = (e.touches[0].clientY - r.top) * (H / r.height);
  Touch.justTapped = true;
}, { passive: false });
const Mouse = { clicked: false, x: 0, y: 0 };
canvas.addEventListener('mousemove', e => {
  const r = canvas.getBoundingClientRect();
  Mouse.x = (e.clientX - r.left) * (W / r.width);
  Mouse.y = (e.clientY - r.top) * (H / r.height);
});
canvas.addEventListener('click', () => Mouse.clicked = true);

function keyDown(c) { return !!Keys.down[c]; }
function keyPressed(c) { return !!Keys.pressed[c]; }
function anyAction() { return Mouse.clicked || Touch.justTapped || keyPressed('Space') || keyPressed('Enter'); }
function flushInput() { Keys.pressed = {}; Keys.released = {}; Touch.justTapped = false; Mouse.clicked = false; }

function createPool(factory, size) {
  const inactive = Array.from({ length: size }, factory);
  const active = [];
  return {
    active,
    get(initFn) {
      const obj = inactive.length > 0 ? inactive.pop() : factory();
      obj.alive = true; if (initFn) initFn(obj); active.push(obj); return obj;
    },
    update(fn) {
      for (let i = active.length - 1; i >= 0; i--) {
        if (!fn(active[i])) { active[i].alive = false; inactive.push(active.splice(i, 1)[0]); }
      }
    },
    clear() { while (active.length) { active[0].alive = false; inactive.push(active.shift()); } }
  };
}

const Particles = createPool(() => ({ alive:false,x:0,y:0,vx:0,vy:0,life:0,maxLife:0,size:3,color:'#fff',gravity:150 }), 300);
function spawnParticles(x, y, count, opts) {
  opts = opts || {};
  for (let i = 0; i < count; i++) {
    const angle = opts.angle !== undefined ? opts.angle + (Math.random()-0.5)*(opts.spread||Math.PI*2) : Math.random()*Math.PI*2;
    const speed = opts.speed || (40 + Math.random()*80);
    Particles.get(p => {
      p.x=x; p.y=y; p.vx=Math.cos(angle)*speed; p.vy=Math.sin(angle)*speed;
      p.life=p.maxLife=opts.life||(0.3+Math.random()*0.5);
      p.size=opts.size||(2+Math.random()*3); p.color=opts.color||'#fff';
      p.gravity=opts.gravity!==undefined?opts.gravity:100;
    });
  }
}
function updateParticles(dt) {
  Particles.update(p => { p.life-=dt; p.x+=p.vx*dt; p.y+=p.vy*dt; p.vy+=p.gravity*dt; return p.life>0; });
}
function drawParticles() {
  Particles.active.forEach(p => {
    ctx.globalAlpha=p.life/p.maxLife; ctx.fillStyle=p.color;
    ctx.fillRect(p.x-p.size/2, p.y-p.size/2, p.size, p.size);
  });
  ctx.globalAlpha=1;
}

const Popups = [];
function spawnPopup(x,y,text,color,size){ Popups.push({x,y,text,color:color||'#fff',size:size||14,vy:-55,life:1.0}); }
function updatePopups(dt) {
  for(let i=Popups.length-1;i>=0;i--){ Popups[i].y+=Popups[i].vy*dt; Popups[i].life-=dt; if(Popups[i].life<=0) Popups.splice(i,1); }
}
function drawPopups() {
  Popups.forEach(p => {
    ctx.globalAlpha=Math.min(p.life,1); ctx.fillStyle=p.color;
    ctx.font=`bold ${p.size}px monospace`; ctx.textAlign='center'; ctx.fillText(p.text,p.x,p.y);
  });
  ctx.globalAlpha=1; ctx.textAlign='left';
}

const Shake = { x:0,y:0,mag:0,dur:0 };
function triggerShake(mag,dur){ Shake.mag=Math.max(Shake.mag,mag); Shake.dur=Math.max(Shake.dur,dur); }
function updateShake(dt) {
  if(Shake.dur>0){ Shake.dur-=dt; Shake.x=(Math.random()*2-1)*Shake.mag; Shake.y=(Math.random()*2-1)*Shake.mag; if(Shake.dur<=0){Shake.x=0;Shake.y=0;} }
}

const sfx = {
  _ctx:null,
  init(){try{if(!this._ctx)this._ctx=new(window.AudioContext||window.webkitAudioContext)();if(this._ctx.state==='suspended')this._ctx.resume();}catch(e){}},
  play(freq,dur,type,vol){
    try{
      this.init();if(!this._ctx)return;
      const o=this._ctx.createOscillator(),g=this._ctx.createGain();
      o.type=type||'square';o.frequency.value=freq||440;
      g.gain.setValueAtTime(vol||0.12,this._ctx.currentTime);
      g.gain.exponentialRampToValueAtTime(0.001,this._ctx.currentTime+(dur||0.1));
      o.connect(g);g.connect(this._ctx.destination);o.start();o.stop(this._ctx.currentTime+(dur||0.1));
    }catch(e){}
  }
};

function lerp(a,b,t){return a+(b-a)*t;}
function clamp(v,mn,mx){return v<mn?mn:v>mx?mx:v;}
function aabb(ax,ay,aw,ah,bx,by,bw,bh){return ax<bx+bw&&ax+aw>bx&&ay<by+bh&&ay+ah>by;}
function randInt(a,b){return a+Math.floor(Math.random()*(b-a+1));}
function randFloat(a,b){return a+Math.random()*(b-a);}
function randChoice(arr){return arr[Math.floor(Math.random()*arr.length)];}

let _hiScore=parseInt(localStorage.getItem('hs_galaxyblaster')||'0');
function saveHiScore(s){if(s>_hiScore){_hiScore=s;localStorage.setItem('hs_galaxyblaster',s);}}
function drawText(txt,x,y,color,size,align){ctx.fillStyle=color||'#fff';ctx.font=`bold ${size||14}px monospace`;ctx.textAlign=align||'left';ctx.fillText(txt,x,y);}
function drawBar(x,y,w,h,val,max,fg,bg){ctx.fillStyle=bg||'#333';ctx.fillRect(x,y,w,h);ctx.fillStyle=fg||'#0f0';ctx.fillRect(x,y,Math.round(w*clamp(val/max,0,1)),h);}

const FIXED_DT=1/60;
const MAX_DT=0.1;
let lastTime=0;
let accumulator=0;
function loop(ts){
  const rawDt=Math.min((ts-lastTime)/1000,MAX_DT);lastTime=ts;accumulator+=rawDt;
  while(accumulator>=FIXED_DT){update(FIXED_DT);accumulator-=FIXED_DT;}
  renderFrame();requestAnimationFrame(loop);
}
function update(dt){
  updateShake(dt);updateParticles(dt);updatePopups(dt);
  switch(gameState){
    case 'menu':    updateMenu(dt);break;
    case 'playing': updatePlaying(dt);break;
    case 'paused':  if(keyPressed('Escape')||keyPressed('KeyP'))setState('playing');break;
    case 'gameover':updateGameover(dt);break;
    case 'shop':    updateShop(dt);break;
  }
  flushInput();
}
function renderFrame(){
  ctx.save();ctx.translate(Shake.x,Shake.y);
  switch(gameState){
    case 'menu':    renderMenu();break;
    case 'playing': renderPlaying();break;
    case 'paused':  renderPlaying();renderPauseOverlay();break;
    case 'gameover':renderPlaying();renderGameoverOverlay();break;
    case 'shop':    renderShop();break;
  }
  drawParticles();drawPopups();ctx.restore();
}
function updateMenu(dt){if(anyAction()){sfx.play(440,0.08,'square',0.1);startGame();setState('playing');}}
function renderPauseOverlay(){
  ctx.fillStyle='rgba(0,0,0,0.55)';ctx.fillRect(0,0,W,H);
  drawText('PAUSED',W/2,H/2,'#fff',28,'center');
  drawText('ESC to resume',W/2,H/2+36,'#aaa',13,'center');
}
function renderGameoverOverlay(){
  ctx.fillStyle='rgba(0,0,0,0.78)';ctx.fillRect(0,0,W,H);ctx.textAlign='center';
  ctx.fillStyle='#f44';ctx.font='bold 34px system-ui,sans-serif';ctx.fillText('GAME OVER',W/2,H*0.36);
  ctx.fillStyle='#fff';ctx.font='bold 18px system-ui,sans-serif';ctx.fillText(`Score: ${GAME_SCORE}  •  +${Math.floor(_runCoins)} coins`,W/2,H*0.48);
  ctx.fillStyle='#ff0';ctx.font='14px system-ui,sans-serif';ctx.fillText(`Best: ${_hiScore}`,W/2,H*0.58);
  ctx.fillStyle='#aaa';ctx.font='13px system-ui,sans-serif';ctx.fillText('Heading to shop…',W/2,H*0.70);ctx.textAlign='left';
}

// ══════════════════════════════════════════════════════════════════
// GAME DATA
// ══════════════════════════════════════════════════════════════════
const GAME_TITLE = 'GALAXY BLASTER';
const PALETTE = {
  bg:'#03020f', player:'#00e5ff', engine:'#ff6600', bullet:'#00ffff',
  eBullet:'#ff4400', accent:'#ffdd00', ui:'#ffffff',
  grunt:'#ee4444', gunship:'#cc44ff', tank:'#4488ff', bomber:'#ff8800', boss:'#ff2200',
  shopBg:'#060418', shopCard:'#0e0830', shopSel:'#1c1060',
};

let GAME_SCORE = 0;

const player = {
  x:W/2-24, y:H-100, w:48, h:48, hbW:14, hbH:14,
  speed:290, hp:3, maxHp:3, iframes:0, IFRAME_DUR:2.0,
  fireTimer:0, fireRate:0.18, powerup:'none', powerupTimer:0, coins:0, ef:0,
};

const bulletPool  = createPool(()=>({alive:false,x:0,y:0,vx:0,vy:0,w:5,h:13,isEnemy:false,damage:1}),300);
const enemyPool   = createPool(()=>({alive:false,x:0,y:0,vx:0,vy:0,w:40,h:40,hbW:34,hbH:34,hp:1,maxHp:1,points:100,type:'grunt',fireTimer:0,fireRate:2,flashTimer:0,pt:0,spawnX:0,phase:0}),80);
const powerupPool = createPool(()=>({alive:false,x:0,y:0,vy:55,w:22,h:22,type:'hp',bt:0}),20);
const bgLayers = [];
let _nebulae = [];
const waveManager = {wave:0,enemiesLeft:0,waveTimer:0,betweenDelay:3.0};

// Meta-progression runtime
let _damageBonus=1, _scoreMultiplier=1.0, _runCoins=0, _gameoverTimer=0, _shopIdx=0;

const ENEMY_TYPES = {
  grunt:   {hp:1,  speed:80,  points:100,  w:36,h:36, fireRate:0,   color:PALETTE.grunt  },
  gunship: {hp:3,  speed:55,  points:250,  w:42,h:42, fireRate:2.2, color:PALETTE.gunship},
  tank:    {hp:8,  speed:35,  points:500,  w:54,h:48, fireRate:0,   color:PALETTE.tank   },
  bomber:  {hp:2,  speed:95,  points:180,  w:34,h:34, fireRate:0,   color:PALETTE.bomber },
  boss:    {hp:80, speed:28,  points:5000, w:90,h:76, fireRate:0.9, color:PALETTE.boss   },
};

// ── Upgrades ──────────────────────────────────────────────────────
const UPGRADES = [
  {id:'firerate',name:'Fire Rate',  desc:'Shoot faster each run',            maxLevel:3,costs:[30,70,140],icon:'🔫'},
  {id:'damage',  name:'Damage',     desc:'Bullets hit harder',               maxLevel:3,costs:[40,80,160],icon:'💥'},
  {id:'shield',  name:'Shield',     desc:'Start with extra max HP',          maxLevel:2,costs:[50,120],   icon:'🛡'},
  {id:'score',   name:'Score Boost',desc:'Score multiplier per level',       maxLevel:3,costs:[35,70,140],icon:'⭐'},
];

const _META_KEY='meta_shooter';
let _meta={coins:0,upgrades:{}};
function loadMeta(){try{_meta=JSON.parse(localStorage.getItem(_META_KEY))||{coins:0,upgrades:{}};}catch(e){_meta={coins:0,upgrades:{}};} if(!_meta.upgrades)_meta.upgrades={};}
function saveMeta(){try{localStorage.setItem(_META_KEY,JSON.stringify(_meta));}catch(e){}}
function addRunCoins(n){_meta.coins+=Math.floor(n);saveMeta();}
function getUpgradeLevel(id){return _meta.upgrades[id]||0;}
function buyUpgrade(id){const up=UPGRADES.find(u=>u.id===id);if(!up)return false;const lvl=getUpgradeLevel(id);if(lvl>=up.maxLevel)return false;const cost=up.costs[lvl];if(_meta.coins<cost)return false;_meta.coins-=cost;_meta.upgrades[id]=lvl+1;saveMeta();return true;}

function updateGameover(dt){_gameoverTimer-=dt;if(_gameoverTimer<=0||anyAction()){addRunCoins(_runCoins);_shopIdx=0;setState('shop');}}
function _shopHit(mx,my,x,y,w,h){return mx>=x&&mx<=x+w&&my>=y&&my<=y+h;}
function updateShop(dt){
  if(!anyAction())return;
  const cW=160,cH=128,gap=16,cols=Math.min(UPGRADES.length,3),totW=cols*cW+(cols-1)*gap,sx=(W-totW)/2,sy=100;
  for(let i=0;i<UPGRADES.length;i++){
    if(_shopHit(Mouse.x,Mouse.y,sx+i*(cW+gap),sy,cW,cH)){_shopIdx=i;if(buyUpgrade(UPGRADES[i].id)){sfx.play(660,0.12,'sine',0.1);applyUpgrades();}else sfx.play(110,0.06,'sawtooth',0.08);return;}
  }
  const bW=160,bH=42,bX=(W-bW)/2,bY=sy+cH+32;
  if(_shopHit(Mouse.x,Mouse.y,bX,bY,bW,bH)){sfx.play(440,0.08,'square',0.1);startGame();setState('playing');}
}
function renderShop(){
  ctx.fillStyle=PALETTE.shopBg;ctx.fillRect(0,0,W,H);ctx.textAlign='center';
  ctx.fillStyle=PALETTE.accent;ctx.font='bold 24px system-ui,sans-serif';ctx.fillText('UPGRADE SHOP',W/2,48);
  ctx.fillStyle='#ffdd00';ctx.font='bold 14px system-ui,sans-serif';ctx.fillText(`🪙 ${_meta.coins} coins`,W/2,72);
  const cW=160,cH=128,gap=16,cols=Math.min(UPGRADES.length,3),totW=cols*cW+(cols-1)*gap,sx=(W-totW)/2,sy=92;
  for(let i=0;i<UPGRADES.length;i++){
    const up=UPGRADES[i],lvl=getUpgradeLevel(up.id),cx=sx+i*(cW+gap),maxed=lvl>=up.maxLevel,canBuy=!maxed&&_meta.coins>=up.costs[lvl];
    ctx.fillStyle=i===_shopIdx?PALETTE.shopSel:PALETTE.shopCard;ctx.strokeStyle=maxed?'#4caf50':canBuy?'#ffdd00':'#444';ctx.lineWidth=i===_shopIdx?2:1;
    ctx.beginPath();ctx.roundRect(cx,sy,cW,cH,8);ctx.fill();ctx.stroke();
    ctx.font='24px system-ui,sans-serif';ctx.fillStyle='#fff';ctx.fillText(up.icon,cx+cW/2,sy+30);
    ctx.font='bold 11px system-ui,sans-serif';ctx.fillText(up.name,cx+cW/2,sy+50);
    ctx.fillStyle='#aaa';ctx.font='10px system-ui,sans-serif';ctx.fillText(up.desc,cx+cW/2,sy+64);
    for(let p=0;p<up.maxLevel;p++){ctx.fillStyle=p<lvl?'#ffdd00':'#333';ctx.beginPath();ctx.arc(cx+cW/2-(up.maxLevel-1)*7+p*14,sy+84,5,0,Math.PI*2);ctx.fill();}
    ctx.font='bold 11px system-ui,sans-serif';ctx.fillStyle=maxed?'#4caf50':canBuy?'#ffdd00':'#555';ctx.fillText(maxed?'MAXED':`${up.costs[lvl]} coins`,cx+cW/2,sy+108);
  }
  const bW=160,bH=42,bX=(W-bW)/2,bY=sy+cH+30;
  ctx.fillStyle='#1a4a1a';ctx.strokeStyle='#4caf50';ctx.lineWidth=2;ctx.beginPath();ctx.roundRect(bX,bY,bW,bH,8);ctx.fill();ctx.stroke();
  ctx.fillStyle='#fff';ctx.font='bold 16px system-ui,sans-serif';ctx.fillText('▶  PLAY',W/2,bY+26);ctx.textAlign='left';
}

function applyUpgrades(){
  player.fireRate=[0.18,0.13,0.09,0.06][getUpgradeLevel('firerate')];
  _damageBonus=[1,2,3,5][getUpgradeLevel('damage')];
  player.maxHp=3+getUpgradeLevel('shield')*2;
  player.hp=player.maxHp;
  _scoreMultiplier=[1.0,1.25,1.6,2.0][getUpgradeLevel('score')];
}

// ══════════════════════════════════════════════════════════════════
// WAVE SPAWNER
// ══════════════════════════════════════════════════════════════════
function spawnWave(waveNumber){
  const isBoss=waveNumber%5===0;
  if(isBoss){
    const def=ENEMY_TYPES.boss;
    enemyPool.get(e=>{
      e.x=W/2-def.w/2;e.y=-def.h-10;e.type='boss';
      e.hp=e.maxHp=def.hp+Math.floor(waveNumber/5)*20;
      e.w=def.w;e.h=def.h;e.hbW=def.w-8;e.hbH=def.h-8;
      e.points=def.points;e.fireRate=def.fireRate;e.fireTimer=1.5;
      e.pt=0;e.phase=0;e.spawnX=e.x;e.vx=40;
    });
    waveManager.enemiesLeft=1;waveManager.betweenDelay=4.0;return;
  }
  waveManager.betweenDelay=3.0;
  const count=Math.min(4+waveNumber*2,20);
  waveManager.enemiesLeft=count;
  for(let i=0;i<count;i++){
    const r=Math.random();
    let type='grunt';
    if(waveNumber>=6&&r<0.10)type='tank';
    else if(waveNumber>=4&&r<0.22)type='bomber';
    else if(waveNumber>=3&&r<0.40)type='gunship';
    const def=ENEMY_TYPES[type];
    const cols=Math.min(count,8);
    enemyPool.get(e=>{
      e.type=type;
      e.x=40+(i%cols)*(W-80)/(cols-1||1);
      e.y=-50-Math.floor(i/cols)*60;
      e.hp=e.maxHp=def.hp+Math.floor(waveNumber/4);
      e.w=def.w;e.h=def.h;e.hbW=def.w-6;e.hbH=def.h-6;
      e.points=def.points;e.fireRate=def.fireRate;e.fireTimer=randFloat(0.5,def.fireRate||3);
      e.spawnX=e.x;e.pt=0;e.phase=0;
      e.vx=type==='bomber'?randChoice([-1,1])*110:randChoice([-1,1])*45;
    });
  }
}

// ══════════════════════════════════════════════════════════════════
// INIT
// ══════════════════════════════════════════════════════════════════
function initGame(){
  loadMeta();
  bgLayers.length=0;
  [[120,1,0.3],[50,1.5,0.6],[18,2.5,0.95]].forEach(([count,sz,alpha],i)=>{
    const c=document.createElement('canvas');c.width=W;c.height=H*2;
    const cx2=c.getContext('2d');
    for(let j=0;j<count;j++){
      cx2.fillStyle=`rgba(${i===2?'180,220,255':'100,140,200'},${alpha})`;
      cx2.fillRect(Math.random()*W,Math.random()*H*2,sz,sz);
    }
    bgLayers.push({canvas:c,y:0,speed:[16,40,88][i]});
  });
  _nebulae=Array.from({length:5},()=>({
    x:randFloat(0,W),y:randFloat(0,H),r:randFloat(60,120),
    r2:randFloat(0.14,0.32),
    col:randChoice(['26,10,58','10,26,58','42,10,42']),
  }));
}

function startGame(){
  loadMeta();
  GAME_SCORE=0;_runCoins=0;_gameoverTimer=1.5;
  player.x=W/2-player.w/2;player.y=H-100;
  player.hp=player.maxHp=3;player.iframes=0;
  player.fireTimer=0;player.powerup='none';player.powerupTimer=0;player.coins=0;
  bulletPool.clear();enemyPool.clear();powerupPool.clear();Popups.length=0;
  waveManager.wave=0;waveManager.enemiesLeft=0;waveManager.waveTimer=0;
  applyUpgrades();
}

// ══════════════════════════════════════════════════════════════════
// UPDATE
// ══════════════════════════════════════════════════════════════════
function updatePlaying(dt){
  bgLayers.forEach(l=>{l.y+=l.speed*dt;if(l.y>=H)l.y-=H;});
  player.ef=(player.ef+dt*18)%(Math.PI*2);
  if(player.powerupTimer>0){player.powerupTimer-=dt;if(player.powerupTimer<=0)player.powerup='none';}

  // Movement
  let dx=0,dy=0;
  if(keyDown('ArrowLeft')||keyDown('KeyA'))dx-=1;
  if(keyDown('ArrowRight')||keyDown('KeyD'))dx+=1;
  if(keyDown('ArrowUp')||keyDown('KeyW'))dy-=1;
  if(keyDown('ArrowDown')||keyDown('KeyS'))dy+=1;
  const mag=Math.hypot(dx,dy)||1;
  if(dx||dy){player.x=clamp(player.x+dx/mag*player.speed*dt,0,W-player.w);player.y=clamp(player.y+dy/mag*player.speed*dt,0,H-player.h);}

  // Fire
  player.iframes=Math.max(0,player.iframes-dt);
  player.fireTimer=Math.max(0,player.fireTimer-dt);
  if((keyDown('Space')||keyDown('KeyZ'))&&player.fireTimer<=0){
    const pcx=player.x+player.w/2,pcy=player.y+4;
    if(player.powerup==='spread'){
      [[-300,-530],[0,-560],[300,-530]].forEach(([vx,vy])=>{
        bulletPool.get(b=>{b.x=pcx-2;b.y=pcy;b.vx=vx*0.85;b.vy=vy;b.isEnemy=false;b.damage=_damageBonus;b.w=4;b.h=11;});
      });
    }else{
      bulletPool.get(b=>{b.x=pcx-2;b.y=pcy;b.vx=0;b.vy=-560;b.isEnemy=false;b.damage=_damageBonus;b.w=5;b.h=13;});
    }
    player.fireTimer=player.fireRate;sfx.play(920,0.04,'square',0.07);
  }

  // Bullets
  bulletPool.update(b=>{b.x+=b.vx*dt;b.y+=b.vy*dt;return b.y>-30&&b.y<H+30&&b.x>-30&&b.x<W+30;});

  // Enemies
  enemyPool.update(e=>{
    e.flashTimer=Math.max(0,e.flashTimer-dt);e.pt+=dt;
    const def=ENEMY_TYPES[e.type];
    if(e.type==='grunt'){e.y+=def.speed*dt;e.x=e.spawnX+Math.sin(e.pt*2.2)*55;}
    else if(e.type==='gunship'){
      if(e.y<H*0.35)e.y+=def.speed*dt;
      else{e.x+=e.vx*dt;if(e.x<30||e.x>W-e.w-30)e.vx*=-1;}
    }else if(e.type==='tank'){e.y+=def.speed*dt*0.6;e.x=e.spawnX+Math.sin(e.pt*0.8)*30;}
    else if(e.type==='bomber'){e.y+=def.speed*dt*0.7;e.x+=e.vx*dt;if(e.x<10||e.x>W-e.w-10){e.vx*=-1;e.y+=20;}}
    else if(e.type==='boss'){
      if(e.y<60){e.y+=40*dt;}
      else{
        const hp_pct=e.hp/e.maxHp;
        e.phase=hp_pct>0.6?0:hp_pct>0.3?1:2;
        e.x+=e.vx*(1+e.phase*0.8)*dt;
        if(e.x<20||e.x>W-e.w-20)e.vx*=-1;
        e.y=60+Math.sin(e.pt*(1+e.phase))*28*(e.phase+1);
      }
    }
    // Enemy fire
    if(def.fireRate>0){
      e.fireTimer=Math.max(0,e.fireTimer-dt);
      if(e.fireTimer<=0&&e.y>-10){
        const ex2=e.x+e.w/2,ey2=e.y+e.h;
        const px=player.x+player.w/2,py=player.y+player.h/2;
        const ang=Math.atan2(py-ey2,px-ex2);
        if(e.type==='boss'&&e.phase>=1){
          for(let k=-2;k<=2;k++){
            const a2=ang+k*0.26;
            bulletPool.get(b=>{b.x=ex2;b.y=ey2;b.vx=Math.cos(a2)*220;b.vy=Math.sin(a2)*220;b.isEnemy=true;b.damage=1;b.w=7;b.h=7;});
          }
        }else{
          bulletPool.get(b=>{b.x=ex2;b.y=ey2;b.vx=Math.cos(ang)*200;b.vy=Math.sin(ang)*200;b.isEnemy=true;b.damage=1;b.w=6;b.h=6;});
        }
        e.fireTimer=def.fireRate*(e.phase===2?0.55:1.0);sfx.play(180,0.06,'sawtooth',0.06);
      }
    }
    return e.alive && e.y<H+90;
  });

  // Power-ups
  powerupPool.update(p=>{
    p.y+=p.vy*dt;p.bt+=dt;
    if(aabb(player.x,player.y,player.w,player.h,p.x,p.y,p.w,p.h)){
      if(p.type==='hp'){player.hp=Math.min(player.maxHp,player.hp+1);spawnPopup(p.x,p.y,'+HP','#0f0',14);}
      if(p.type==='spread'){player.powerup='spread';player.powerupTimer=12;spawnPopup(p.x,p.y,'SPREAD!','#ff0',13);}
      if(p.type==='shield'){player.powerup='shield';player.powerupTimer=8;spawnPopup(p.x,p.y,'SHIELD!','#0af',13);}
      sfx.play(660,0.14,'sine',0.10);return false;
    }
    return p.y<H+40;
  });

  // Player bullets → enemies
  bulletPool.active.forEach(b=>{
    if(b.isEnemy||!b.alive)return;
    enemyPool.active.forEach(e=>{
      if(!e.alive)return;
      if(aabb(b.x,b.y,b.w,b.h,e.x,e.y,e.w,e.h)){
        b.alive=false;e.hp-=b.damage;e.flashTimer=0.07;
        if(e.hp<=0){
          const pts=Math.round(e.points*_scoreMultiplier);GAME_SCORE+=pts;
          player.coins+=Math.max(1,Math.floor(e.points/80));
          spawnParticles(e.x+e.w/2,e.y+e.h/2,e.type==='boss'?30:10,{color:ENEMY_TYPES[e.type].color,speed:90,life:0.5,gravity:30});
          spawnPopup(e.x+e.w/2,e.y,`+${pts}`,PALETTE.accent,e.type==='boss'?18:13);
          sfx.play(e.type==='boss'?80:200,0.18,'square',0.12);triggerShake(e.type==='boss'?10:4,e.type==='boss'?0.4:0.15);
          const drop=e.type==='boss'?1.0:e.type==='tank'?0.4:0.10;
          if(Math.random()<drop)powerupPool.get(p=>{p.x=e.x+e.w/2-11;p.y=e.y+e.h/2;p.type=e.type==='boss'?'spread':randChoice(['hp','shield','spread']);p.vy=55;});
          e.alive=false;waveManager.enemiesLeft=Math.max(0,waveManager.enemiesLeft-1);
        }
      }
    });
  });

  // Enemy → player
  if(player.iframes<=0){
    const phX=player.x+(player.w-player.hbW)/2,phY=player.y+(player.h-player.hbH)/2;
    bulletPool.active.forEach(b=>{
      if(!b.isEnemy||!b.alive)return;
      if(aabb(phX,phY,player.hbW,player.hbH,b.x,b.y,b.w,b.h)){
        b.alive=false;
        if(player.powerup==='shield'){player.powerup='none';player.powerupTimer=0;sfx.play(300,0.1,'sine',0.1);}
        else{player.hp--;player.iframes=player.IFRAME_DUR;triggerShake(5,0.22);sfx.play(140,0.2,'sawtooth',0.14);spawnParticles(player.x+player.w/2,player.y+player.h/2,8,{color:'#f44',speed:60,gravity:60});if(player.hp<=0){_runCoins=player.coins;saveHiScore(GAME_SCORE);_gameoverTimer=1.5;setState('gameover');}}
      }
    });
    enemyPool.active.forEach(e=>{
      if(!e.alive)return;
      if(aabb(phX,phY,player.hbW,player.hbH,e.x,e.y,e.hbW,e.hbH)){
        player.hp--;player.iframes=player.IFRAME_DUR;e.alive=false;waveManager.enemiesLeft=Math.max(0,waveManager.enemiesLeft-1);
        triggerShake(7,0.30);sfx.play(110,0.25,'sawtooth',0.16);
        if(player.hp<=0){_runCoins=player.coins;saveHiScore(GAME_SCORE);_gameoverTimer=1.5;setState('gameover');}
      }
    });
  }

  // Wave manager
  if(waveManager.enemiesLeft<=0&&enemyPool.active.filter(x=>x.alive).length===0){
    waveManager.waveTimer+=dt;
    if(waveManager.waveTimer>=waveManager.betweenDelay){waveManager.waveTimer=0;waveManager.wave++;spawnWave(waveManager.wave);}
  }
  if(keyPressed('Escape')||keyPressed('KeyP'))setState('paused');
}

// ══════════════════════════════════════════════════════════════════
// RENDER
// ══════════════════════════════════════════════════════════════════
function drawStarLayers(){bgLayers.forEach(l=>{ctx.drawImage(l.canvas,0,l.y-H);ctx.drawImage(l.canvas,0,l.y);});}
function drawNebulae(){
  _nebulae.forEach(n=>{
    const g=ctx.createRadialGradient(n.x,n.y,0,n.x,n.y,n.r);
    g.addColorStop(0,`rgba(${n.col},${n.r2})`);g.addColorStop(1,'transparent');
    ctx.fillStyle=g;ctx.beginPath();ctx.arc(n.x,n.y,n.r,0,Math.PI*2);ctx.fill();
  });
}

function renderMenu(){
  ctx.fillStyle=PALETTE.bg;ctx.fillRect(0,0,W,H);
  drawStarLayers();drawNebulae();
  ctx.textAlign='center';
  ctx.shadowBlur=22;ctx.shadowColor=PALETTE.player;
  ctx.fillStyle=PALETTE.player;ctx.font='bold 40px monospace';ctx.fillText('GALAXY',W/2,H*0.24);
  ctx.fillStyle=PALETTE.accent;ctx.fillText('BLASTER',W/2,H*0.24+50);
  ctx.shadowBlur=0;
  ctx.fillStyle='#99aacc';ctx.font='12px system-ui,sans-serif';ctx.fillText('ARROWS/WASD — move    SPACE — fire',W/2,H*0.50);
  ctx.fillStyle='#fff';ctx.font='bold 17px system-ui,sans-serif';ctx.fillText('PRESS SPACE TO LAUNCH',W/2,H*0.60);
  ctx.fillStyle='#556';ctx.font='13px system-ui,sans-serif';ctx.fillText(`Best: ${_hiScore}`,W/2,H*0.70);
  if(_meta.coins>0){ctx.fillStyle='#ffdd00';ctx.fillText(`🪙 ${_meta.coins} coins saved`,W/2,H*0.80);}
  ctx.textAlign='left';
}

function renderPlaying(){
  ctx.fillStyle=PALETTE.bg;ctx.fillRect(0,0,W,H);
  drawStarLayers();drawNebulae();

  // Enemies
  enemyPool.active.forEach(e=>{
    ctx.globalAlpha=e.flashTimer>0?0.3:1.0;
    const ex2=e.x+e.w/2,ey2=e.y+e.h/2;
    if(e.type==='grunt'){
      ctx.fillStyle=e.flashTimer>0?'#fff':PALETTE.grunt;ctx.shadowBlur=8;ctx.shadowColor=PALETTE.grunt;
      ctx.beginPath();ctx.moveTo(ex2,e.y);ctx.lineTo(e.x+e.w,ey2);ctx.lineTo(ex2,e.y+e.h);ctx.lineTo(e.x,ey2);ctx.closePath();ctx.fill();ctx.shadowBlur=0;
    }else if(e.type==='gunship'){
      ctx.fillStyle=e.flashTimer>0?'#fff':PALETTE.gunship;ctx.shadowBlur=10;ctx.shadowColor=PALETTE.gunship;
      ctx.beginPath();ctx.moveTo(ex2,e.y+e.h);ctx.lineTo(e.x+e.w+8,ey2-6);ctx.lineTo(e.x+e.w,e.y);ctx.lineTo(e.x,e.y);ctx.lineTo(e.x-8,ey2-6);ctx.closePath();ctx.fill();ctx.shadowBlur=0;
    }else if(e.type==='tank'){
      ctx.fillStyle=e.flashTimer>0?'#fff':PALETTE.tank;ctx.shadowBlur=6;ctx.shadowColor=PALETTE.tank;
      ctx.fillRect(e.x+4,e.y+4,e.w-8,e.h-8);ctx.strokeStyle='#88aaff';ctx.lineWidth=2;ctx.strokeRect(e.x+4,e.y+4,e.w-8,e.h-8);ctx.lineWidth=1;ctx.shadowBlur=0;
    }else if(e.type==='bomber'){
      ctx.fillStyle=e.flashTimer>0?'#fff':PALETTE.bomber;ctx.shadowBlur=8;ctx.shadowColor=PALETTE.bomber;
      ctx.beginPath();ctx.moveTo(ex2,e.y);ctx.lineTo(e.x+e.w,e.y+e.h);ctx.lineTo(ex2,e.y+e.h*0.6);ctx.lineTo(e.x,e.y+e.h);ctx.closePath();ctx.fill();ctx.shadowBlur=0;
    }else if(e.type==='boss'){
      ctx.fillStyle=e.flashTimer>0?'#fff':PALETTE.boss;ctx.shadowBlur=20;ctx.shadowColor=PALETTE.boss;
      ctx.beginPath();ctx.ellipse(ex2,ey2,e.w/2,e.h/2,0,0,Math.PI*2);ctx.fill();
      ctx.fillStyle='#880000';
      ctx.beginPath();ctx.moveTo(e.x-10,ey2-10);ctx.lineTo(e.x-40,ey2+20);ctx.lineTo(e.x,ey2+10);ctx.closePath();ctx.fill();
      ctx.beginPath();ctx.moveTo(e.x+e.w+10,ey2-10);ctx.lineTo(e.x+e.w+40,ey2+20);ctx.lineTo(e.x+e.w,ey2+10);ctx.closePath();ctx.fill();
      const pulse=Math.floor(100+Math.sin(e.pt*4)*80);
      ctx.fillStyle=`rgba(255,${pulse},0,0.9)`;ctx.beginPath();ctx.arc(ex2,ey2,14,0,Math.PI*2);ctx.fill();
      ctx.shadowBlur=0;
      drawBar(20,12,W-40,10,e.hp,e.maxHp,'#f44','#400');
      ctx.fillStyle='#fff';ctx.font='10px system-ui,sans-serif';ctx.textAlign='center';ctx.fillText('MOTHERSHIP',W/2,11);ctx.textAlign='left';
    }
    ctx.globalAlpha=1;
    if(e.maxHp>1&&e.type!=='boss')drawBar(e.x,e.y-7,e.w,4,e.hp,e.maxHp,'#0f0','#400');
  });

  // Bullets
  bulletPool.active.forEach(b=>{
    if(b.isEnemy){
      ctx.fillStyle=PALETTE.eBullet;ctx.shadowBlur=6;ctx.shadowColor=PALETTE.eBullet;
      ctx.beginPath();ctx.arc(b.x+b.w/2,b.y+b.h/2,b.w/2+1,0,Math.PI*2);ctx.fill();ctx.shadowBlur=0;
    }else{
      ctx.fillStyle=player.powerup==='spread'?'#ffff00':PALETTE.bullet;
      ctx.shadowBlur=8;ctx.shadowColor=PALETTE.bullet;ctx.fillRect(b.x,b.y,b.w,b.h);ctx.shadowBlur=0;
    }
  });

  // Power-ups
  powerupPool.active.forEach(p=>{
    const colors={hp:'#00ff88',spread:'#ffff00',shield:'#00aaff'};
    const bob=Math.sin(p.bt*3.5)*4;
    ctx.fillStyle=colors[p.type]||'#fff';ctx.shadowBlur=10;ctx.shadowColor=colors[p.type];
    ctx.beginPath();ctx.arc(p.x+p.w/2,p.y+p.h/2+bob,p.w/2,0,Math.PI*2);ctx.fill();ctx.shadowBlur=0;
    ctx.fillStyle='#000';ctx.font='bold 9px system-ui,sans-serif';ctx.textAlign='center';
    ctx.fillText(p.type==='hp'?'HP':p.type==='spread'?'S':'SH',p.x+p.w/2,p.y+p.h/2+bob+3);ctx.textAlign='left';
  });

  // Player ship
  const blink=player.iframes>0&&Math.floor(player.iframes/0.08)%2===0;
  if(!blink){
    ctx.globalAlpha=player.iframes>0?0.55:1.0;
    const px2=player.x+player.w/2,py2=player.y+player.h/2;
    const flicker=0.7+Math.sin(player.ef)*0.3;
    ctx.fillStyle=`rgba(255,140,0,${0.7*flicker})`;
    ctx.beginPath();ctx.moveTo(px2-8,player.y+player.h-2);ctx.lineTo(px2+8,player.y+player.h-2);ctx.lineTo(px2,player.y+player.h+18*flicker);ctx.closePath();ctx.fill();
    const col=player.powerup==='shield'?'#44ddff':PALETTE.player;
    ctx.fillStyle=col;ctx.shadowBlur=14;ctx.shadowColor=col;
    ctx.beginPath();ctx.moveTo(px2,player.y);ctx.lineTo(player.x+player.w,player.y+player.h);ctx.lineTo(px2,player.y+player.h*0.7);ctx.lineTo(player.x,player.y+player.h);ctx.closePath();ctx.fill();
    ctx.shadowBlur=0;
    if(player.powerup==='shield'){
      ctx.strokeStyle='#00ccff';ctx.lineWidth=2;ctx.globalAlpha=0.55;
      ctx.beginPath();ctx.arc(px2,py2,player.w/2+8,0,Math.PI*2);ctx.stroke();ctx.lineWidth=1;
    }
    ctx.globalAlpha=1;
  }

  // HUD
  drawText(`SCORE: ${GAME_SCORE}`,10,22,PALETTE.ui,14);
  drawText(`WAVE ${waveManager.wave}`,W/2,22,'#99aacc',13,'center');
  drawText(`BEST: ${_hiScore}`,W-10,22,'#556',12,'right');
  drawBar(10,H-18,110,9,player.hp,player.maxHp,'#00e5ff','#003344');
  ctx.fillStyle='#668';ctx.font='10px system-ui,sans-serif';ctx.fillText('HP',124,H-9);
  ctx.fillStyle='#ffdd00';ctx.font='11px system-ui,sans-serif';ctx.fillText(`🪙 ${player.coins}`,W-60,H-8);
  if(player.powerup!=='none'){
    ctx.fillStyle=player.powerup==='spread'?'#ffff44':'#44aaff';ctx.font='bold 11px system-ui,sans-serif';
    ctx.fillText(`${player.powerup==='spread'?'🔫 SPREAD':'🛡 SHIELD'} ${Math.ceil(player.powerupTimer)}s`,10,H-32);
  }
  if(waveManager.enemiesLeft<=0&&enemyPool.active.filter(x=>x.alive).length===0&&waveManager.wave>0){
    const cd=Math.ceil(waveManager.betweenDelay-waveManager.waveTimer);
    drawText(`WAVE ${waveManager.wave+1} IN ${cd}s`,W/2,H*0.88,'#ffee44',15,'center');
  }
}

// START
initGame();
requestAnimationFrame(t=>{lastTime=t;requestAnimationFrame(loop);});
</script>
